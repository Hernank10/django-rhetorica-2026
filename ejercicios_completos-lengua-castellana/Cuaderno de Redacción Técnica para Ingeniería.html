<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Técnica para Ingeniería · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e6ebf0;
    --paper:#fdfcf8;
    --paper-2:#f5f7fa;
    --ink:#0f1b2d;
    --muted:#5b6b7f;
    --line:#ccd5df;
    --line-2:#b1bdcc;
    --accent:#0369a1;
    --accent-dark:#075985;
    --accent-soft:#dbeef9;
    --copper:#c2410c;
    --copper-dark:#9a3412;
    --copper-soft:#fde8dd;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(15,30,60,.06), 0 12px 30px rgba(15,30,60,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #f2f6fa 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(253,252,248,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #8ec6e3;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d5dde6; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#0369a1,#c2410c); transition:width .4s;}

  .btn{
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eef3f8; border-color:#8ba0ba;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:inherit; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f5f7fa; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#eef3f8;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-size:10.5px; font-weight:800;
    background:var(--copper-soft); color:var(--copper-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dae1e9; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--copper)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#2c3a4e;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#eef3f8;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--copper));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #8ec6e3; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(3,105,161,.22); border-color:var(--accent);}

  /* flashcard · plano de ingeniería */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fdfcf8;
    background-image:
      linear-gradient(rgba(3,105,161,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(3,105,161,.10) 1px, transparent 1px);
    background-size:20px 20px;
    box-shadow:inset 22px 0 0 -21px #e09a72;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #8ec6e3;
    background-color:#f2f9fd;
    box-shadow:inset 22px 0 0 -21px #6bb2d8;
  }
  .fc-tag{
    font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:24px; color:#16233a; background:rgba(255,255,255,.88); padding:6px 10px; border-radius:8px; border-left:3px solid var(--accent);}
  .fc-back p{color:#0b3a58; background:rgba(242,249,253,.92); border-left-color:var(--copper);}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:11.5px; color:#8798ad; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#2a3a52;
    background:#f5f7fa; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f2f9fd; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dae1e9; color:var(--muted);
    display:grid; place-items:center;
    font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#16233a;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--copper);
    background:#fdf2e9; color:var(--copper-dark); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fde8dd; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eef3f8; border:1.5px dashed var(--line-2);}
  .seq{background:#f2f9fd; border:1.5px solid #8ec6e3;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b1bdcc; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f2f9fd;}
  .seq .ord-item{border-color:#8ec6e3;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eef3f8; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#3a4a63; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:24px;
    color:#16233a; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fdfcf8;
    background-image:
      linear-gradient(rgba(3,105,161,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(3,105,161,.09) 1px, transparent 1px);
    background-size:20px 20px;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(3,105,161,.12);}
  textarea::placeholder{color:#8798ad; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--copper-soft); border:1px solid #fda27a; color:#7c2d12;}
  .feedback strong{display:block; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f5f7fa; border-left:3px solid var(--copper);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#7c2d12;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--copper); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,30,60,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">⚙️</div>
    <div>
      <h1>Cuaderno de Redacción Técnica para Ingeniería · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · sintaxis, puntuación, ortografía y estilo universitario</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN TÉCNICA PARA INGENIERÍA · 10 BLOQUES
   Instrucciones y explicaciones en castellano · ejemplos con enfoque técnico
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · FUNDAMENTOS ============ */
{
  id:"b1", nombre:"Fundamentos de la escritura técnica", emoji:"📐",
  desc:"Claridad, precisión, objetividad, concisión y función comunicativa en ingeniería.",
  tecnicas:[
    {id:"i1", nombre:"Claridad: principio rector",
     concepto:"La claridad es el primer principio de la redacción técnica. Un texto de ingeniería debe comunicar sin ambigüedad: quien lo lee debe entender exactamente lo que se dice, sin interpretaciones múltiples.",
     ejemplo:"En lugar de «Se procedió a efectuar la medición del voltaje correspondiente al circuito en cuestión», se escribe: «Se midió el voltaje del circuito».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estos enunciados cumple mejor con el principio de claridad técnica?",
       opciones:["«Se procedió a efectuar la medición del voltaje.»","«Se midió el voltaje del circuito.»","«Cúmpleme manifestar el voltaje obtenido.»","«En atención a lo anterior, el voltaje fue medido.»"],
       correcta:1,
       retro:"La claridad técnica exige verbos directos y precisos. «Se midió el voltaje» dice lo mismo en menos palabras y sin ambigüedad."}},

    {id:"i2", nombre:"Precisión técnica",
     concepto:"La precisión exige usar el término exacto, con su significado técnico establecido. En ingeniería, «precisión» y «exactitud» no son sinónimos: la primera se refiere a la repetibilidad, la segunda a la cercanía al valor real.",
     ejemplo:"«El sensor tiene una precisión de ±0,5 °C» (repetibilidad) es distinto de «la medición tiene una exactitud de ±0,1 °C respecto al patrón» (cercanía al valor real).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su significado técnico exacto.",
       categorias:["Precisión","Exactitud"],
       items:[
         {texto:"Repetibilidad de una medida.", cat:0},
         {texto:"Cercanía al valor real o patrón.", cat:1},
         {texto:"Dispersión de los valores obtenidos.", cat:0},
         {texto:"Error sistemático respecto a la referencia.", cat:1},
         {texto:"Consistencia entre mediciones sucesivas.", cat:0}
       ],
       retro:"Precisión = repetibilidad; exactitud = cercanía al valor real. Confundirlos es uno de los errores más frecuentes en informes técnicos."}},

    {id:"i3", nombre:"Objetividad técnica",
     concepto:"El texto técnico describe hechos y datos verificables, sin valoraciones personales ni juicios subjetivos. Las opiniones se reservan para las recomendaciones, debidamente señaladas.",
     ejemplo:"Objetivo: «El ensayo arrojó una resistencia de 32 MPa». Subjetivo: «El ensayo salió muy bien y la resistencia fue excelente».",
     ejercicio:{tipo:"fill",
       consigna:"Reformula objetivamente.",
       texto:"«La prueba salió muy bien» → «La prueba arrojó un resultado de ___ MPa, conforme a la especificación». (dato: 32)",
       respuestas:[["32","treinta y dos"]],
       retro:"La objetividad se logra sustituyendo valoraciones por datos verificables. «Salió bien» no comunica nada técnico."}},

    {id:"i4", nombre:"Concisión sin pérdida de información",
     concepto:"La concisión elimina palabras innecesarias sin sacrificar información. Un texto técnico conciso es más fácil de leer y de revisar. Se prefiere la frase corta y el verbo directo.",
     ejemplo:"Extenso: «Con el objetivo de poder llevar a cabo la determinación de la resistencia». Conciso: «Para determinar la resistencia».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza a la concisión técnica?",
       opciones:["Usar la menor cantidad de palabras sin perder información","Escribir frases muy cortas aunque se pierda información","Evitar tecnicismos","Usar solo verbos en infinitivo"],
       correcta:0,
       retro:"Concisión = decir lo mismo con menos palabras. No es empobrecer: es eliminar lo superfluo."}},

    {id:"i5", nombre:"Impersonalidad y voz pasiva refleja",
     concepto:"El texto técnico prefiere la impersonalidad: se evita el «yo» y se usa la pasiva refleja («se midió», «se observó») o la primera persona del plural. El foco queda en el proceso, no en quien lo hizo.",
     ejemplo:"«Se midió la temperatura con un termopar tipo K.» Mejor que «Yo medí la temperatura con un termopar tipo K».",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a estilo impersonal.",
       texto:"«Nosotros calibramos el instrumento» → «Se ___ el instrumento».",
       respuestas:[["calibro","calibró"]],
       retro:"La pasiva refleja con «se» es el recurso estándar. Mantiene el foco en el proceso y aporta objetividad."}},

    {id:"i6", nombre:"Función comunicativa del informe técnico",
     concepto:"Un informe técnico no se escribe para el autor, sino para que otros lo lean, lo revisen, lo apliquen o lo auditen. La función comunicativa es la razón de ser del documento.",
     ejemplo:"Un informe de laboratorio debe permitir que otra persona reproduzca el ensayo y verifique los resultados. Si no lo permite, no cumple su función.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la función principal de un informe técnico?",
       opciones:["Que el autor demuestre lo que sabe","Que otros puedan leer, revisar y aplicar la información","Que ocupe muchas páginas","Que use lenguaje complejo"],
       correcta:1,
       retro:"El informe técnico es una herramienta de comunicación. Su valor se mide por la utilidad para el lector, no por la extensión."}},

    {id:"i7", nombre:"Registro académico-técnico",
     concepto:"El registro técnico es formal, culto y preciso. Evita coloquialismos, jerga informal y expresiones ambiguas. El vocabulario es especializado pero sin ampulosidad.",
     ejemplo:"No se escribe «el motor se puso a fallar de la nada»; se escribe «el motor presentó una falla intermitente sin causa identificada».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro técnico o coloquial.",
       categorias:["Técnico","Coloquial"],
       items:[
         {texto:"«presentó una falla intermitente»", cat:0},
         {texto:"«se puso a fallar de la nada»", cat:1},
         {texto:"«la muestra se sometió a ensayo»", cat:0},
         {texto:"«le hicimos la prueba a la muestra»", cat:1},
         {texto:"«el sistema operó fuera de rango»", cat:0}
       ],
       retro:"El registro técnico es formal y preciso. Los coloquialismos restan seriedad al informe."}},

    {id:"i8", nombre:"Estructura externa del informe técnico",
     concepto:"El informe técnico tiene una estructura previsible: portada, resumen, objetivos, marco teórico, materiales, método, resultados, discusión, conclusiones, referencias y anexos.",
     ejemplo:"Un informe de laboratorio de materiales incluye: objetivo, fundamento teórico, equipos, procedimiento, datos, cálculos, análisis, conclusiones y referencias.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un informe técnico.",
       items:[
         "Portada con título, autores y fecha.",
         "Resumen y objetivos.",
         "Marco teórico y materiales.",
         "Método y procedimiento.",
         "Resultados, discusión y conclusiones."
       ],
       retro:"La estructura IMRyD adaptada a ingeniería es previsible. Reconocerla facilita la escritura y la lectura."}},

    {id:"i9", nombre:"Público técnico vs. divulgativo",
     concepto:"Un texto técnico se dirige a especialistas; un texto divulgativo, al público general. Ambos pueden tratar el mismo tema, pero el lenguaje, la profundidad y el tono cambian.",
     ejemplo:"Técnico: «Se aplicó un esfuerzo de 250 MPa sobre la probeta». Divulgativo: «Se aplicó una fuerza equivalente a sostener 25 toneladas sobre la pieza».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión según el público al que se dirige.",
       categorias:["Técnico","Divulgativo"],
       items:[
         {texto:"«esfuerzo de 250 MPa»", cat:0},
         {texto:"«una fuerza equivalente a 25 toneladas»", cat:1},
         {texto:"«resistencia a la tracción de 400 MPa»", cat:0},
         {texto:"«la pieza aguanta como si colgaran 40 elefantes»", cat:1},
         {texto:"«módulo de Young de 200 GPa»", cat:0}
       ],
       retro:"El público define el registro. Un texto técnico pierde rigor si se vuelve divulgativo sin propósito; un texto divulgativo pierde claridad si se llena de tecnicismos."}},

    {id:"i10", nombre:"Documentación del proceso",
     concepto:"La redacción técnica documenta lo que se hizo, cómo se hizo, con qué se hizo y qué se obtuvo. Lo que no queda documentado, en ingeniería se considera no hecho: es la base de la trazabilidad.",
     ejemplo:"Un protocolo sin fecha, sin número de ensayo y sin operador no es trazable. Con esos datos, cualquier auditor puede reconstruir el proceso.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los datos de trazabilidad.",
       texto:"Un registro técnico trazable incluye: fecha, número de ensayo, operador, equipo y ___ utilizados.",
       respuestas:[["materiales","material","reactivos","insumos","muestras"]],
       retro:"La trazabilidad es la base de la calidad. Sin ella, no se puede auditar ni reproducir el trabajo."}}
  ]
},

/* ============ BLOQUE 2 · SINTAXIS TÉCNICA ============ */
{
  id:"b2", nombre:"Sintaxis técnica", emoji:"🧱",
  desc:"Orden, longitud, voz, subordinación, concordancia y párrafos técnicos.",
  tecnicas:[
    {id:"i11", nombre:"Orden lógico: SVO",
     concepto:"En español técnico se prefiere el orden Sujeto + Verbo + Objeto. Alterarlo (hipérbaton) puede generar ambigüedad y dificultar la lectura. El orden natural es la base de la claridad.",
     ejemplo:"Orden lógico: «El operador calibró el instrumento». Orden alterado: «El instrumento, el operador, calibró».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden lógico.",
       texto:"Palabras: «la probeta / el técnico / ensayó». Oración: «El técnico ___ la probeta».",
       respuestas:[["ensayo","ensayó"]],
       retro:"El orden SVO es la base de la claridad. Los hipérbatos innecesarios oscurecen el mensaje técnico."}},

    {id:"i12", nombre:"Oraciones cortas (máx. 25 palabras)",
     concepto:"En redacción técnica se recomienda que las oraciones no superen las 25 palabras. Las oraciones largas dificultan la comprensión y favorecen la ambigüedad. Si una oración es larga, se divide.",
     ejemplo:"En vez de una oración de 60 palabras describiendo el procedimiento completo, se divide en pasos: «Se pesó la muestra. Luego se secó en estufa a 105 °C. Transcurridas 24 horas, se pesó de nuevo».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la longitud recomendada de una oración técnica?",
       opciones:["Hasta 50 palabras","No más de 25 palabras","Entre 30 y 40 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas (≤25 palabras) son más fáciles de leer y de traducir. Es la norma en documentación técnica."}},

    {id:"i13", nombre:"Voz activa vs. voz pasiva",
     concepto:"La voz activa es más directa: el sujeto realiza la acción. La voz pasiva oculta al agente. En documentación técnica se prefiere la activa, salvo cuando el agente es irrelevante o desconocido.",
     ejemplo:"Pasiva: «La muestra fue ensayada por el técnico». Activa: «El técnico ensayó la muestra». La segunda es más clara.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"«El operador encendió el motor.»", cat:0},
         {texto:"«El motor fue encendido por el operador.»", cat:1},
         {texto:"«El sistema registró la falla.»", cat:0},
         {texto:"«La falla fue registrada por el sistema.»", cat:1},
         {texto:"«El sensor detectó la anomalía.»", cat:0}
       ],
       retro:"La voz activa es más clara. La pasiva se reserva para descripciones de procesos donde el agente es irrelevante."}},

    {id:"i14", nombre:"Gerundios: evitar el abuso",
     concepto:"El gerundio excesivo o incorrecto (especialmente el de posterioridad) dificulta la lectura y crea ambigüedad. En redacción técnica se sustituye por verbos conjugados o por oraciones de relativo.",
     ejemplo:"Incorrecto: «El motor falló, produciendo la parada del sistema». Correcto: «El motor falló y produjo la parada del sistema».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por un verbo conjugado.",
       texto:"«Se calentó la muestra, obteniendo un cambio de fase» → «Se calentó la muestra y se ___ un cambio de fase».",
       respuestas:[["obtuvo","observo","observó","produjo"]],
       retro:"El gerundio de posterioridad es incorrecto en español técnico. Se sustituye por un verbo conjugado o por una oración de relativo."}},

    {id:"i15", nombre:"Subordinación mínima",
     concepto:"En redacción técnica se recomienda limitar la subordinación. Encadenar muchas oraciones subordinadas produce frases interminables y ambiguas. Se prefiere dividir en oraciones simples.",
     ejemplo:"Excesivo: «El operador que había calibrado el instrumento que se usa en el laboratorio que está en el segundo piso observó que...». Adecuado: «El operador calibró el instrumento del laboratorio. Luego observó que...».",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos más cortas.",
       texto:"«El técnico que había calibrado el sensor que registra la temperatura verificó los datos» → «El técnico calibró el sensor de temperatura. Después ___ los datos».",
       respuestas:[["verifico","verificó","reviso","revisó"]],
       retro:"La subordinación excesiva es una de las causas más frecuentes de oscuridad en textos técnicos."}},

    {id:"i16", nombre:"Coordinación de especificaciones",
     concepto:"La coordinación une elementos paralelos: características, requisitos, pasos, datos. Es esencial en especificaciones técnicas, donde los elementos deben presentarse con estructura paralela.",
     ejemplo:"«El equipo debe: (1) operar entre 0 y 50 °C; (2) soportar una humedad relativa del 80 %; (3) consumir menos de 100 W.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su tipo de coordinación.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],
       items:[
         {texto:"y", cat:0},
         {texto:"pero", cat:1},
         {texto:"o", cat:2},
         {texto:"e", cat:0},
         {texto:"sino", cat:1}
       ],
       retro:"La coordinación copulativa suma; la adversativa opone; la disyuntiva presenta alternativas. Reconocerlas ayuda a especificar con precisión."}},

    {id:"i17", nombre:"Concordancia en sujetos compuestos",
     concepto:"Cuando el sujeto es compuesto (dos o más núcleos), el verbo va en plural. La ruptura de la concordancia es un error frecuente en textos técnicos extensos.",
     ejemplo:"Incorrecto: «El motor y la bomba funciona correctamente». Correcto: «El motor y la bomba funcionan correctamente».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la concordancia.",
       texto:"«El sensor y el controlador registró la falla» → «El sensor y el controlador ___ la falla».",
       respuestas:[["registraron","registro","registró"]],
       retro:"El sujeto compuesto exige verbo en plural. La concordancia es obligatoria en todo el texto."}},

    {id:"i18", nombre:"Evitar hipérbaton",
     concepto:"El hipérbaton es la alteración del orden natural de la oración. En poesía es un recurso; en redacción técnica, un obstáculo. Se debe mantener el orden lógico.",
     ejemplo:"Hipérbaton: «Del sistema, la falla, el operador, identificó». Orden natural: «El operador identificó la falla del sistema».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden natural.",
       texto:"Palabras: «el equipo / la anomalía / detectó» → «El equipo ___ la anomalía».",
       respuestas:[["detecto","detectó"]],
       retro:"El hipérbaton innecesario oscurece el mensaje técnico. Se mantiene el orden lógico."}},

    {id:"i19", nombre:"Párrafos: una idea por párrafo",
     concepto:"Cada párrafo técnico desarrolla una idea principal. Mezclar ideas genera confusión. La extensión recomendada es de 80-150 palabras, con oraciones cortas.",
     ejemplo:"Un párrafo para describir el equipo, otro para el procedimiento, otro para los resultados. Cada uno con su idea central.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuántas ideas principales debe desarrollar cada párrafo técnico?",
       opciones:["Todas las relacionadas con el tema","Una sola idea principal","Al menos tres","No importa cuántas"],
       correcta:1,
       retro:"Un párrafo = una idea. Si aparece otra idea, se abre un nuevo párrafo. Es la base de la organización técnica."}},

    {id:"i20", nombre:"Anáfora y referencia técnica",
     concepto:"Los pronombres (él, este, aquel, que) remiten a un antecedente. En redacción técnica debe quedar claro a qué se refieren. Si hay duda, se repite el sustantivo o se usa la denominación completa.",
     ejemplo:"Ambiguo: «El sensor envía datos al controlador. Este los procesa». ¿«Este» = el sensor o el controlador? Claro: «El controlador los procesa».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad repitiendo el sustantivo.",
       texto:"«La bomba alimenta al tanque. Este se llena en 10 min». → «La bomba alimenta al tanque. El ___ se llena en 10 min».",
       respuestas:[["tanque"]],
       retro:"Repetir el sustantivo elimina la ambigüedad referencial. En redacción técnica, la claridad supera a la elegancia estilística."}}
  ]
},

/* ============ BLOQUE 3 · PUNTUACIÓN TÉCNICA ============ */
{
  id:"b3", nombre:"Puntuación técnica", emoji:"✒️",
  desc:"Coma, punto y coma, dos puntos, paréntesis, comillas y guiones en textos técnicos.",
  tecnicas:[
    {id:"i21", nombre:"Coma en enumeraciones técnicas",
     concepto:"La coma separa elementos de una enumeración. En textos técnicos es frecuente al listar materiales, variables o condiciones. El último elemento se une con «y» u «o».",
     ejemplo:"«Se utilizaron acero, aluminio, cobre y latón». La coma separa los materiales, y la «y» cierra la enumeración.",
     ejercicio:{tipo:"fill",
       consigna:"Coloca las comas donde correspondan.",
       texto:"«Se midieron la temperatura la presión y el caudal» → «Se midieron la temperatura___ la presión___ y el caudal».",
       respuestas:[[","],[","]],
       retro:"Los elementos de una enumeración se separan con coma. El último se une con «y» sin coma previa (excepto en enumeraciones complejas)."}},

    {id:"i22", nombre:"Punto y coma en especificaciones",
     concepto:"Cuando los elementos de una enumeración son extensos o tienen puntuación interna, se separan con punto y coma. Es frecuente en especificaciones técnicas y listas de requisitos.",
     ejemplo:"«El equipo debe: operar entre 0 y 50 °C; soportar una humedad del 80 %; consumir menos de 100 W; ser compatible con 220 V.»",
     ejercicio:{tipo:"fill",
       consigna:"Separa las especificaciones con punto y coma.",
       texto:"«Operar entre 0 y 50 °C___ soportar 80 % de humedad___ consumir menos de 100 W».",
       respuestas:[[";"],[";"]],
       retro:"En especificaciones técnicas, se usa punto y coma entre elementos extensos. Facilita la lectura y evita ambigüedad."}},

    {id:"i23", nombre:"Dos puntos: listas y aclaraciones",
     concepto:"Los dos puntos anuncian una enumeración, una aclaración o una consecuencia. En textos técnicos son frecuentes antes de listas de datos, requisitos o pasos.",
     ejemplo:"«Los datos obtenidos fueron los siguientes: temperatura = 25 °C; presión = 101 kPa; caudal = 2 L/min».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca dos puntos donde correspondan.",
       texto:"«Los resultados fueron los siguientes___ temperatura = 25 °C; presión = 101 kPa».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian una enumeración o aclaración. Se escriben sin espacio antes y con espacio después."}},

    {id:"i24", nombre:"Coma vocativa (cartas y oficios técnicos)",
     concepto:"El vocativo es la palabra o frase con la que nos dirigimos al interlocutor. En cartas y oficios técnicos es frecuente: «Estimado ingeniero», «Señor director». Siempre se separa con coma.",
     ejemplo:"«Ingeniero Rodríguez, adjunto el informe solicitado». «Señores evaluadores, presento los resultados».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma del vocativo.",
       texto:"«Ingeniero López___ adjunto el informe».",
       respuestas:[[","]],
       retro:"El vocativo siempre se separa con coma. Es un error muy frecuente en oficios técnicos."}},

    {id:"i25", nombre:"Punto y aparte",
     concepto:"El punto y aparte cierra un párrafo. En textos técnicos, cada párrafo desarrolla una idea. El punto y aparte facilita la lectura y la localización de información.",
     ejemplo:"Un párrafo para el objetivo, otro para la metodología, otro para los resultados. Cada uno termina en punto y aparte.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte en un texto técnico?",
       opciones:["Cuando se termina una oración","Cuando se termina un párrafo","Cuando se cita una norma","Cuando se enumeran datos"],
       correcta:1,
       retro:"El punto y aparte cierra el párrafo. Después se inicia uno nuevo con sangría o espacio adicional."}},

    {id:"i26", nombre:"Paréntesis para aclaraciones técnicas",
     concepto:"Los paréntesis encierran información complementaria: unidades, siglas, aclaraciones breves. En textos técnicos son frecuentes para incluir el símbolo de una unidad o el equivalente.",
     ejemplo:"«La masa de la muestra (250 g) se secó en estufa a 105 °C durante 24 h (tiempo establecido en la norma)».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde correspondan.",
       texto:"«La temperatura de operación ___ 25 °C ___ debe registrarse cada hora».",
       respuestas:[["("],[" )",""]],
       retro:"Los paréntesis encierran información aclaratoria. No se deja espacio antes del de apertura ni después del de cierre."}},

    {id:"i27", nombre:"Corchetes en fórmulas y citas",
     concepto:"Los corchetes se usan en fórmulas matemáticas para agrupar operaciones y en citas textuales para introducir aclaraciones. En textos técnicos aparecen frecuentemente en ecuaciones.",
     ejemplo:"Fórmula: «P = [F · d] / t». Cita: «El autor afirma: “La resistencia [del material] fue de 32 MPa”».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la fórmula con corchetes.",
       texto:"«E = ___m · c²___ / 2» (se agrupa el producto antes de dividir).",
       respuestas:[["["],["]"]],
       retro:"Los corchetes agrupan operaciones en fórmulas complejas. En citas textuales indican aclaraciones del editor."}},

    {id:"i28", nombre:"Comillas técnicas",
     concepto:"Las comillas encierran citas textuales, títulos de artículos, términos extranjeros y usos especiales. En textos técnicos también se usan para destacar términos que se definen por primera vez.",
     ejemplo:"«El ensayo “tracción uniaxial” (ASTM E8) se realizó con una máquina universal». También: «Se midió el “creep” o fluencia lenta del material».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«El ensayo ___tracción uniaxial___ se realizó conforme a la norma».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran términos técnicos que se destacan. Pueden ser latinas (« ») o inglesas (“ ”), según la norma editorial."}},

    {id:"i29", nombre:"Guiones y rayas",
     concepto:"El guion (-) une palabras compuestas o separa sílabas. La raya (—) introduce diálogos o aclaraciones. El guion bajo (_) es propio de nombres técnicos y archivos. En textos técnicos aparecen los tres.",
     ejemplo:"«Máquina-herramienta», «ensayo-tracción» (guion). «El resultado —como se observó— fue consistente» (raya). «temperatura_max.txt» (guion bajo en archivos).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso del guion.",
       categorias:["Guion (-)","Raya (—)"],
       items:[
         {texto:"«máquina-herramienta»", cat:0},
         {texto:"«ensayo-tracción»", cat:0},
         {texto:"«El resultado —según los datos— fue consistente»", cat:1},
         {texto:"«sistema-experto»", cat:0},
         {texto:"«el operador —dijo el supervisor— se equivocó»", cat:1}
       ],
       retro:"El guion une; la raya aísla. Cada uno tiene usos específicos en textos técnicos."}},

    {id:"i30", nombre:"Signos en fórmulas y ecuaciones",
     concepto:"En fórmulas matemáticas y físicas no se usa puntuación como en el texto: se usan signos específicos (comas para separar variables, puntos para multiplicar, barras para dividir). Las fórmulas se numeran entre paréntesis.",
     ejemplo:"«La densidad se calcula como d = m/V (1)», donde (1) es el número de la ecuación. La fórmula se referencia en el texto: «según la ecuación (1)».",

       respuestas:[["(3)","3","ecuación (3)"]],

  ]
},

       retro:"Los nombres comunes de máquinas van en minúscula. Las marcas y modelos específicos van en mayúscula."}},

    {id:"i32", nombre:"Números en textos técnicos",
     concepto:"En textos técnicos se prefieren los números arábigos para datos, mediciones y referencias. Los números del uno al diez pueden escribirse con letra en el cuerpo del texto, pero siempre con cifra cuando son datos técnicos.",
     ejemplo:"«Se realizaron tres ensayos» (número pequeño con letra). «La temperatura fue de 25 °C» (dato técnico con cifra). «Se aplicaron 3,5 kN» (magnitud siempre con cifra).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso de los números según la norma técnica.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«La temperatura fue de 25 °C»", cat:0},
         {texto:"«Se aplicaron tres coma cinco kilonewtons»", cat:1},
         {texto:"«Se realizaron tres ensayos»", cat:0},
         {texto:"«La masa fue de trescientos gramos»", cat:1},
         {texto:"«La presión fue de 101,3 kPa»", cat:0}
       ],
       retro:"Las magnitudes y datos técnicos van siempre con cifras. Los números pequeños en el cuerpo del texto pueden ir con letra."}},

    {id:"i33", nombre:"Unidades del SI y símbolos",
     concepto:"Las unidades del Sistema Internacional se escriben con símbolos específicos: m (metro), kg (kilogramo), s (segundo), N (newton), Pa (pascal), °C (grado Celsius). Se deja un espacio entre el número y el símbolo.",
     ejemplo:"«25 °C», «9,81 m/s²», «100 kPa», «3,5 kN». El símbolo del grado va separado de la cifra: 25 °C, no 25°C.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la unidad correctamente.",
       texto:"Temperatura: 25 ___ · Presión: 101 ___ · Masa: 3,5 ___ · Velocidad: 9,81 ___",
       respuestas:[["°C","°C","grados Celsius"],["kPa","kPa","kilopascales"],["kg","kg","kilogramos"],["m/s","m/s","metros por segundo"]],
       retro:"Las unidades SI tienen símbolos específicos. Se deja un espacio entre la cifra y el símbolo. Nunca se pluraliza el símbolo: 3,5 kg, no 3,5 kgs."}},

    {id:"i34", nombre:"Fechas y horas técnicas",
     concepto:"Las fechas se escriben con números arábigos y mes en minúscula: 15 de julio de 2024. Las horas se escriben con dos puntos: 14:30 h. En contextos internacionales, el formato ISO es 2024-07-15.",
     ejemplo:"«Bogotá, 15 de julio de 2024, 14:30 h». Formato ISO: «2024-07-15T14:30».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la fecha y hora correctamente.",
       texto:"«Bogotá, 15 de Julio de 2024, 2:30 pm» → «Bogotá, 15 de ___ de 2024, ___ h».",
       respuestas:[["julio"],["14:30","14:30 h"]],
       retro:"El mes va en minúscula. La hora se expresa en formato de 24 horas con dos puntos: 14:30 h."}},

    {id:"i35", nombre:"Siglas y acrónimos técnicos",
     concepto:"Las siglas se escriben sin puntos y en mayúsculas: CAD, GPS, PLC, SIG, IEEE. Los acrónimos lexicalizados pueden ir en minúscula: láser, radar. Se definen la primera vez que aparecen.",
     ejemplo:"«El sistema CAD (Computer-Aided Design) permitió el modelado 3D». «El GPS (Global Positioning System) registró las coordenadas».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la sigla y define la primera vez.",
       texto:"«El sistema ___ (Computer-Aided Design) permitió el modelado». · «El ___ (Global Positioning System) registró la posición».",
       respuestas:[["CAD"],["GPS"]],
       retro:"Las siglas van en mayúsculas, sin puntos. Se define la primera vez que aparecen y después se usa solo la sigla."}},

    {id:"i36", nombre:"Abreviaturas técnicas",
     concepto:"Las abreviaturas se cierran con punto: etc. (etcétera), p. ej. (por ejemplo), vol. (volumen), fig. (figura), ec. (ecuación). Se usan con moderación.",
     ejemplo:"«Los materiales (acero, aluminio, etc.) se sometieron a ensayo». «Ver la figura 3 y la ecuación (2)».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la abreviatura correcta.",
       texto:"«Ver la ___ 3» (figura) · «Según la ___ (2)» (ecuación) · «Los materiales (acero, aluminio, ___)» (etcétera)",
       respuestas:[["fig","fig."],["ec","ec."],["etc","etc."]],
       retro:"Las abreviaturas llevan punto. Se usan con moderación y siempre con coherencia en el documento."}},

    {id:"i37", nombre:"Prefijos y sufijos técnicos",
     concepto:"En ingeniería abundan los prefijos (kilo-, mega-, giga-, micro-, nano-, mili-) y sufijos (-ico, -al, -ción, -miento). Conocerlos permite formar y comprender términos técnicos.",
     ejemplo:"kilovatio (kW), megapascal (MPa), gigahercio (GHz), micrómetro (µm), nanosegundo (ns). Todos comparten estructura prefijo + unidad.",
     ejercicio:{tipo:"fill",
       consigna:"Forma el término técnico.",
       texto:"10³ W = 1 ___ · 10⁶ Pa = 1 ___ · 10⁻³ s = 1 ___",
       respuestas:[["kW","kilovatio","kilowatt","kilowatio"],["MPa","megapascal"],["ms","milisegundo"]],
       retro:"Los prefijos del SI son estándar: kilo (10³), mega (10⁶), giga (10⁹), mili (10⁻³), micro (10⁻⁶), nano (10⁻⁹)."}},

    {id:"i38", nombre:"Guiones en términos técnicos",
     concepto:"Muchos términos técnicos compuestos llevan guion: motor-generador, ensayo-tracción, máquina-herramienta, sistema-experto. El guion une dos conceptos en una sola unidad terminológica.",
     ejemplo:"«El motor-generador operó sin fallas». «Se aplicó un ensayo-tracción a la probeta». «El sistema-experto diagnosticó la falla».",
     ejercicio:{tipo:"fill",
       consigna:"Añade el guion donde corresponda.",
       texto:"«El motor generador operó sin fallas» → «El motor___generador operó sin fallas».",
       respuestas:[["-"]],
       retro:"El guion une dos términos que forman una unidad conceptual. Es un uso característico del lenguaje técnico."}},

    {id:"i39", nombre:"Latinismos en ingeniería",
     concepto:"En ingeniería se usan algunos latinismos: in situ, a priori, a posteriori, per cápita, de facto, ad hoc. Se escriben en cursiva o sin ella según la norma editorial.",
     ejemplo:"«Se realizó el ensayo in situ». «A priori, los resultados eran consistentes». «El comité ad hoc revisó el informe».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada latinismo según su significado.",
       categorias:["En el lugar","Antes de","Después de","Para este caso"],
       items:[
         {texto:"in situ", cat:0},
         {texto:"a priori", cat:1},
         {texto:"a posteriori", cat:2},
         {texto:"ad hoc", cat:3},
         {texto:"de facto", cat:0}
       ],
       retro:"Los latinismos son frecuentes en lenguaje académico y técnico. Se escriben sin acentos y, según la norma, en cursiva."}},

    {id:"i40", nombre:"Símbolos matemáticos en texto",
     concepto:"Los símbolos matemáticos (+, −, =, <, >, %, √, ∑, ∫) se usan en el contexto de fórmulas. En el texto corrido se prefieren las palabras o se dejan con espacio adecuado.",
     ejemplo:"«El 30 % de la muestra» (con espacio). «La temperatura fue < 0 °C» (símbolo en contexto técnico). «x² + y² = r²» (fórmula).",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el uso del símbolo.",
       texto:"«El 30% de la muestra» → «El 30 ___ de la muestra».",
       respuestas:[["%"]],
       retro:"En español se escribe un espacio entre la cifra y el símbolo del porcentaje: 30 %. Es la norma de la RAE y del SI."}}
  ]
},

/* ============ BLOQUE 5 · LÉXICO TÉCNICO ============ */
{
  id:"b5", nombre:"Léxico técnico", emoji:"🔧",
  desc:"Terminología específica, neologismos, extranjerismos, siglas y precisión léxica.",
  tecnicas:[
    {id:"i41", nombre:"Terminología específica",
     concepto:"Cada disciplina de la ingeniería tiene su terminología precisa: en mecánica (par, esfuerzo, deformación), en eléctrica (tensión, corriente, impedancia), en civil (mortero, hormigón, cimentación). Conocerla y usarla correctamente es imprescindible.",
     ejemplo:"En mecánica no es lo mismo «esfuerzo» (σ, fuerza por unidad de área) que «fuerza» (F, en newtons). Confundirlos es un error conceptual grave.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su disciplina técnica.",
       categorias:["Mecánica","Eléctrica","Civil"],
       items:[
         {texto:"esfuerzo", cat:0},
         {texto:"impedancia", cat:1},
         {texto:"hormigón", cat:2},
         {texto:"deformación", cat:0},
         {texto:"tensión eléctrica", cat:1},
         {texto:"cimentación", cat:2}
       ],
       retro:"Cada rama de la ingeniería tiene su terminología. Usar los términos correctos es señal de rigor profesional."}},

    {id:"i42", nombre:"Neologismos técnicos",
     concepto:"La ingeniería produce neologismos constantemente: software, hardware, internet, big data, machine learning, escaneo 3D. Algunos se adaptan al español y otros se mantienen en su idioma original.",
     ejemplo:"«Software» se usa en inglés; «programa informático» es el equivalente español. «Escaneo 3D» está adaptado; «machine learning» se mantiene en inglés.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término como adaptado al español o mantenido en inglés.",
       categorias:["Adaptado al español","Mantenido en inglés"],
       items:[
         {texto:"escaneo", cat:0},
         {texto:"software", cat:1},
         {texto:"internet", cat:0},
         {texto:"big data", cat:1},
         {texto:"digitalización", cat:0}
       ],
       retro:"Algunos neologismos técnicos se adaptan al español; otros se mantienen en inglés. En textos formales se prefieren los equivalentes en español cuando existen."}},

    {id:"i43", nombre:"Extranjerismos y su traducción",
     concepto:"Muchos términos técnicos provienen del inglés. Cuando existen equivalentes en español, se prefieren; cuando no, se mantienen en cursiva. Ejemplos: hardware (equipo), software (programa), feedback (retroalimentación).",
     ejemplo:"«Realimentación» en lugar de «feedback». «Retroalimentación» en lugar de «feedback». «Interfaz» en lugar de «interface».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el extranjerismo por su equivalente español.",
       texto:"«El feedback del sistema fue positivo» → «La ___ del sistema fue positiva».",
       respuestas:[["retroalimentacion","retroalimentación","realimentacion","realimentación"]],
       retro:"Cuando existe equivalente español, se prefiere. Si no existe, se mantiene el término original en cursiva."}},

    {id:"i44", nombre:"Siglas técnicas: CAD, CAM, CNC",
     concepto:"En ingeniería abundan las siglas: CAD (Computer-Aided Design), CAM (Computer-Aided Manufacturing), CNC (Control Numérico Computarizado), PLC (Programmable Logic Controller). Se definen la primera vez.",
     ejemplo:"«Se utilizó CAD (Computer-Aided Design) para el modelado, y CAM (Computer-Aided Manufacturing) para la producción».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el significado de las siglas.",
       texto:"CAD = Computer-Aided ___ · CAM = Computer-Aided ___ · CNC = Control ___ Computarizado.",
       respuestas:[["Design","design","diseño"],["Manufacturing","manufacturing","manufactura"],["Numerico","Numérico","numerico"]],
       retro:"Las siglas técnicas se definen la primera vez que aparecen. Después se usan solas en el resto del documento."}},

    {id:"i45", nombre:"Precisión léxica",
     concepto:"La precisión exige usar la palabra exacta. En ingeniería no es lo mismo «soportar» que «resistir», «medir» que «estimar», «calibrar» que «ajustar». Cada verbo tiene un matiz técnico distinto.",
     ejemplo:"«El soporte resiste 100 kg» (resistir: aguantar sin romperse). «El instrumento se calibró contra un patrón» (calibrar: comparar con referencia).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada verbo según su significado técnico.",
       categorias:["Medir","Estimar","Calibrar"],
       items:[
         {texto:"Comparar con un patrón de referencia.", cat:2},
         {texto:"Obtener un valor con un instrumento.", cat:0},
         {texto:"Aproximar un valor a partir de datos.", cat:1},
         {texto:"Ajustar un instrumento contra un patrón.", cat:2},
         {texto:"Determinar la longitud con una regla.", cat:0}
       ],
       retro:"Cada verbo técnico tiene un matiz preciso. La precisión léxica es señal de rigor profesional."}},

    {id:"i46", nombre:"Sinónimos técnicos y sus matices",
     concepto:"En ingeniería, los sinónimos aparentes pueden tener significados distintos: «resistencia» vs «tenacidad»; «rigidez» vs «dureza»; «precisión» vs «exactitud». Confundirlos es un error grave.",
     ejemplo:"La «dureza» es la resistencia a la penetración; la «rigidez» es la resistencia a la deformación elástica. No son sinónimos.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la distinción técnica.",
       texto:"La ___ es la resistencia a la penetración; la ___ es la resistencia a la deformación elástica.",
       respuestas:[["dureza"],["rigidez"]],
       retro:"En ingeniería, los sinónimos aparentes tienen matices técnicos precisos. La precisión terminológica es esencial."}},

    {id:"i47", nombre:"Tecnicismos y su definición",
     concepto:"Cuando se introduce un tecnicismo, se define la primera vez. Esto permite que el texto sea comprensible para lectores de otras disciplinas y evita ambigüedades.",
     ejemplo:"«El ensayo de tracción (aquel que somete la probeta a un esfuerzo axial hasta la rotura) se realizó conforme a la norma ASTM E8».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición del tecnicismo.",
       texto:"«La fluencia lenta (creep), es decir, la ___ del material bajo carga constante, se midió durante 1000 h».",
       respuestas:[["deformacion","deformación","deformacion progresiva","deformación progresiva"]],
       retro:"Definir el tecnicismo la primera vez que aparece hace el texto accesible sin perder rigor técnico."}},

    {id:"i48", nombre:"Léxico denotativo en ingeniería",
     concepto:"El texto técnico usa un lenguaje denotativo: cada término tiene un significado preciso, objetivo y verificable. Se evita el lenguaje figurado o connotativo.",
     ejemplo:"No se escribe «el motor está hecho polvo»; se escribe «el motor presenta desgaste severo en los cojinetes».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza al léxico denotativo técnico?",
       opciones:["Su significado figurado","Su significado preciso, objetivo y verificable","Su ambigüedad intencional","Su uso coloquial"],
       correcta:1,
       retro:"El léxico denotativo tiene un significado único y verificable. La ambigüedad es un defecto, no un recurso."}},

    {id:"i49", nombre:"Evitar coloquialismos",
     concepto:"El texto técnico evita expresiones coloquiales: «más o menos», «un montón», «de la nada», «a ojo». Se sustituyen por términos precisos: «aproximadamente», «una cantidad considerable», «sin causa identificada», «por estimación visual».",
     ejemplo:"No se escribe «el motor falló de la nada»; se escribe «el motor presentó una falla sin causa identificada».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el coloquialismo por un término técnico.",
       texto:"«Se midió a ojo» → «Se midió por ___ visual». · «Falló de la nada» → «Falló sin causa ___».",
       respuestas:[["estimacion","estimación"],["identificada","aparente"]],
       retro:"Los coloquialismos restan rigor al texto técnico. Se sustituyen por expresiones precisas."}},

    {id:"i50", nombre:"Diccionario técnico y consulta",
     concepto:"El redactor técnico debe consultar diccionarios especializados: Diccionario de la RAE (para términos generales), diccionarios técnicos de ingeniería, normas técnicas (ASTM, ISO, NTC en Colombia), manuales de referencia.",
     ejemplo:"Antes de usar un término dudoso, se consulta el diccionario técnico de la disciplina o la norma correspondiente.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la utilidad de los diccionarios técnicos?",
       opciones:["Traducir textos literarios","Resolver dudas sobre el significado preciso de términos técnicos","Escribir automáticamente","Reemplazar al ingeniero"],
       correcta:1,
       retro:"Los diccionarios técnicos y las normas son herramientas fundamentales para la precisión terminológica."}}
  ]
},

/* ============ BLOQUE 6 · ESTILO UNIVERSITARIO ============ */
{
  id:"b6", nombre:"Estilo universitario en ingeniería", emoji:"🎓",
  desc:"Registro académico, citas IEEE y APA, paráfrasis, conectores y argumentación.",
  tecnicas:[
    {id:"i51", nombre:"Registro académico-técnico",
     concepto:"El estilo universitario en ingeniería combina el registro académico con el técnico. Es formal, preciso y objetivo. Evita coloquialismos y valoraciones subjetivas sin respaldo.",
     ejemplo:"No se escribe «el motor es una maravilla»; se escribe «el motor presentó un rendimiento del 92 %, superior al de los modelos comparados».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como académica o coloquial.",
       categorias:["Académica","Coloquial"],
       items:[
         {texto:"«presentó un rendimiento superior»", cat:0},
         {texto:"«es una maravilla»", cat:1},
         {texto:"«el ensayo arrojó un valor de 32 MPa»", cat:0},
         {texto:"«salió súper bien»", cat:1},
         {texto:"«los datos son consistentes con la hipótesis»", cat:0}
       ],
       retro:"El registro académico-técnico es formal y objetivo. Los coloquialismos restan credibilidad al texto."}},

    {id:"i52", nombre:"Citas en estilo IEEE",
     concepto:"El estilo IEEE es el más usado en ingeniería. Las citas se numeran entre corchetes según el orden de aparición: [1], [2], [3]. Al final se incluye la lista de referencias numeradas.",
     ejemplo:"En el texto: «Este método fue propuesto por primera vez en 1998 [1]». En la lista: «[1] A. Smith, “Title of paper,” Journal Name, vol. 3, no. 2, pp. 45-58, 1998».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la cita según el estilo IEEE.",
       texto:"«El método fue propuesto en 1998 ___».",
       respuestas:[["[1]","[1].","1"]],
       retro:"En IEEE las citas se numeran con corchetes en orden de aparición. La lista final va numerada."}},

    {id:"i53", nombre:"Citas en estilo APA",
     concepto:"El estilo APA usa el formato (Autor, año). Es frecuente en ingeniería cuando se cita literatura de otras disciplinas. La lista de referencias va alfabética al final.",
     ejemplo:"En el texto: «Diversos autores han analizado este fenómeno (García, 2020; López, 2021)». En la lista: «García, M. (2020). Título del artículo. Revista, 15(2), 45-58».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita APA.",
       texto:"«El estudio fue realizado por García en 2020 (___, ___)».",
       respuestas:[["garcia","garcía"],["2020"]],
       retro:"En APA la cita va con (Autor, año). La lista final va en orden alfabético por apellido del primer autor."}},

    {id:"i54", nombre:"Paráfrasis técnica",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, manteniendo el significado técnico y citando la fuente. No es copiar cambiando algunas palabras.",
     ejemplo:"Original: «El ensayo se realizó a temperatura ambiente». Paráfrasis: «El ensayo se efectuó a 25 °C, conforme al protocolo [1]».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis con la cita.",
       texto:"«Según diversos estudios, el material presenta alta resistencia a la corrosión ___ ___».",
       respuestas:[["[1]","[2]","1","2"],["","."]],
       retro:"La paráfrasis mantiene la idea ajena con palabras propias y siempre cita la fuente. Sin cita, sería plagio."}},

    {id:"i55", nombre:"Conectores lógicos en ingeniería",
     concepto:"Los conectores organizan el razonamiento técnico: adición (además, asimismo), contraste (sin embargo, no obstante), causa (porque, debido a), consecuencia (por lo tanto, en consecuencia), orden (en primer lugar, seguidamente).",
     ejemplo:"«El material presenta alta resistencia; sin embargo, su costo es elevado. Por lo tanto, debe evaluarse su viabilidad económica».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Adición","Contraste","Causa","Consecuencia"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"debido a", cat:2},
         {texto:"por lo tanto", cat:3},
         {texto:"no obstante", cat:1},
         {texto:"en consecuencia", cat:3}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Sin ellos, el texto técnico parece una lista de datos sin sentido."}},

    {id:"i56", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. Es una falta grave de integridad académica.",
     ejemplo:"Copiar un párrafo de un manual sin comillas ni cita es plagio, aunque se cambien algunas palabras. Parafrasear sin citar también lo es.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"i57", nombre:"Formulación de hipótesis técnicas",
     concepto:"Una hipótesis técnica es una afirmación contrastable que se puede verificar experimentalmente. Se formula con precisión, indicando la relación esperada entre variables.",
     ejemplo:"«Si se incrementa la temperatura de operación, entonces la eficiencia del ciclo aumentará hasta un máximo, porque la energía disponible se distribuye mejor».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la hipótesis técnica.",
       texto:"«Si se aumenta la velocidad de corte, entonces el desgaste de la herramienta ___».",
       respuestas:[["aumentara","aumentará","se incrementara","se incrementará","crecera","crecerá"]],
       retro:"Una hipótesis técnica conecta variables con un razonamiento y permite contrastación experimental."}},

    {id:"i58", nombre:"Objetivos: generales y específicos",
     concepto:"El objetivo general expresa la meta amplia del proyecto. Los específicos la descomponen en acciones concretas y verificables. Se formulan con verbos en infinitivo: medir, comparar, diseñar, analizar, optimizar.",
     ejemplo:"General: «Diseñar un sistema de riego automatizado». Específicos: 1) Determinar el caudal requerido. 2) Seleccionar los sensores adecuados. 3) Diseñar el circuito de control. 4) Validar el sistema en campo.",
     ejercicio:{tipo:"fill",
       consigna:"Reformula el objetivo con verbo en infinitivo.",
       texto:"«Mediremos el caudal» → «___ el caudal».",
       respuestas:[["medir"]],
       retro:"Los objetivos usan verbos en infinitivo: medir, comparar, diseñar, analizar, evaluar, optimizar."}},

    {id:"i59", nombre:"Justificación técnica",
     concepto:"La justificación explica por qué vale la pena el proyecto: qué problema resuelve, a quién beneficia, qué aporta al conocimiento o a la industria. No es «porque me lo pidieron».",

    {id:"i63", nombre:"Instrucciones técnicas",

    {id:"i67", nombre:"Cronogramas y diagramas de Gantt",

{
  id:"b8", nombre:"Datos, fórmulas y unidades", emoji:"📊",

  tecnicas:[
    {id:"i71", nombre:"Notación científica",

     ejemplo:"La constante de Boltzmann: 1,38 × 10⁻²³ J/K. La velocidad de la luz: 3,0 × 10⁸ m/s. La carga del electrón: 1,6 × 10⁻¹⁹ C.",

       retro:"La notación científica simplifica la escritura y las operaciones. Es la forma estándar en ingeniería."}},

    {id:"i72", nombre:"Cifras significativas",
     concepto:"Las cifras significativas indican la precisión de una medida. No se deben escribir más cifras de las que el instrumento puede dar. En el resultado final se redondea según la precisión de los datos.",
     ejemplo:"Si una balanza mide hasta centésimas, se escribe «25,35 g», no «25,3467 g». Si una regla mide hasta milímetros, se escribe «7,23 cm» o «72,3 mm», no «7,2345 cm».",
     ejercicio:{tipo:"quiz",
       consigna:"Si una balanza mide hasta centésimas, ¿cómo se debe escribir 12,346 g?",
       opciones:["12,346 g","12,35 g","12,3 g","12 g"],
       correcta:1,
       retro:"Se redondea a la precisión del instrumento. Escribir más cifras de las que el instrumento puede medir es un error científico."}},

    {id:"i73", nombre:"Unidades del Sistema Internacional",
     concepto:"El SI define unidades estándar: longitud (m), masa (kg), tiempo (s), temperatura (K), corriente (A), cantidad de sustancia (mol), intensidad luminosa (cd). Las derivadas: N, Pa, J, W, V, Ω, F, H.",

       consigna:"Completa las unidades derivadas.",
       texto:"Fuerza: ___ · Presión: ___ · Energía: ___ · Potencia: ___",
       respuestas:[["N","newton","newtons"],["Pa","pascal","pascales"],["J","joule","joules"],["W","watt","vatios","vatios"]],
       retro:"Las unidades derivadas se expresan en función de las fundamentales. Su símbolo es universal y nunca se pluraliza."}},

    {id:"i74", nombre:"Conversión de unidades",
     concepto:"En ingeniería se trabaja con múltiples sistemas de unidades. La conversión se hace con factores de conversión: 1 in = 25,4 mm; 1 lb = 0,4536 kg; 1 psi = 6,895 kPa; 1 hp = 745,7 W.",
     ejemplo:"Convertir 50 psi a kPa: 50 × 6,895 = 344,75 kPa. Convertir 100 °F a °C: (100 − 32) × 5/9 = 37,8 °C.",
     ejercicio:{tipo:"fill",

    {id:"i75", nombre:"Fórmulas en texto",

    {id:"i76", nombre:"Variables y símbolos",
     concepto:"Cada variable se representa con un símbolo específico (m, v, t, T, F, E, P). El símbolo debe ser consistente en todo el documento. Se define la primera vez que aparece.",
     ejemplo:"«Sea m la masa del cuerpo (kg), v su velocidad (m/s) y E su energía cinética (J). Entonces E = ½mv²».",

       texto:"masa = ___ · velocidad = ___ · energía = ___ · fuerza = ___",

       retro:"Los símbolos son estándar en cada disciplina. Su consistencia es esencial para evitar errores de interpretación."}},

    {id:"i77", nombre:"Tablas de datos",

     ejemplo:"«Tabla 1. Resultados del ensayo de tracción. Columnas: Muestra (n.º), Carga máxima (kN), Deformación (mm), Esfuerzo (MPa)».",

    {id:"i78", nombre:"Gráficas técnicas",

    {id:"i79", nombre:"Incertidumbre en las mediciones",
     concepto:"Toda medición tiene incertidumbre. Se expresa como ± valor, indicando el rango probable del valor real. En ingeniería es obligatorio reportarla cuando se presentan resultados cuantitativos.",

/* =====================================================================

const STORAGE_KEY = "cuaderno_ingenieria_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");

  const head = el("div","tech-head");

                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");

  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");

  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno técnico <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, ejemplos, redacciones propias, cálculos, referencias técnicas…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}
