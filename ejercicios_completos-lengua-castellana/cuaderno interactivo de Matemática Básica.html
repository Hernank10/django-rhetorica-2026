<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Matemática Básica · 100 técnicas</title>
<style>
  :root{
    --bg:#e6edf5;
    --paper:#ffffff;
    --paper-2:#f7fafc;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#cbd5e1;
    --line-2:#b8c6d8;
    --accent:#0d9488;
    --accent-dark:#0f766e;
    --accent-soft:#e0f7f4;
    --blue:#1e40af;
    --blue-soft:#eef3ff;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(15,30,60,.05), 0 12px 30px rgba(15,30,60,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #f3f7fc 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1;
    background:var(--accent-soft);
    border:1px solid #b6e8e0;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    flex:0 0 auto;
  }
  .brand h1{font-size:16.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#dbe4ee; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#0d9488,#1e40af); transition:width .4s;}

  .btn{
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#f1f5f9; border-color:#94a3b8;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:inherit; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f8fafc; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.6px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#f1f5f9;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-size:10.5px; font-weight:800;
    background:var(--blue-soft); color:var(--blue);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{
    height:4px; border-radius:99px; background:#e2e8f0; margin:0 10px 6px;
    overflow:hidden;
  }
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--blue)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:13px; line-height:1.35; color:#334155;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#f1f5f9;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--blue));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #b6e8e0; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:25px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  /* puntos de avance del bloque */
  .block-dots{
    display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;
  }
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(13,148,136,.25); border-color:var(--accent);}

  /* ---------- FLASHCARD ---------- */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(270px, 34vh, 330px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fff;
    background-image:
      linear-gradient(rgba(30,64,175,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,64,175,.075) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .fc-front{
    border:1px solid var(--line-2);
    box-shadow:inset 22px 0 0 -21px #7dd3c8;
  }
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #b6e8e0;
    box-shadow:inset 22px 0 0 -21px #93c5fd;
    background-color:#f5fffd;
  }
  .fc-tag{
    font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:16px; line-height:1.75; color:#1e293b;}
  .fc-back p{color:#0f3d38;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:11.5px; color:#94a3b8; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  /* ---------- SECCIONES ---------- */
  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#334155;
    background:#f7fafc; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  /* quiz */
  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f5fffd; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#e2e8f0; color:var(--muted);
    display:grid; place-items:center;
    font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  /* fill */
  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#1e293b;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--accent);
    background:#f5fffd; color:var(--accent-dark); font-weight:800;
    padding:3px 8px; min-width:110px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#e0f7f4; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  /* order */
  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#f1f5f9; border:1.5px dashed var(--line-2);}
  .seq{background:#f5fffd; border:1.5px solid #b6e8e0;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#cbd5e1; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f5fffd;}
  .seq .ord-item{border-color:#b6e8e0;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* classify */
  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#f1f5f9; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--blue); border-color:var(--blue); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* open */
  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#475569; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:26px;
    color:#1e293b; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fff;
    background-image:linear-gradient(rgba(30,64,175,.06) 1px, transparent 1px);
    background-size:100% 26px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(13,148,136,.12);}
  textarea::placeholder{color:#94a3b8; font-style:italic;}

  /* feedback */
  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:500px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--blue-soft); border:1px solid #bfdbfe; color:#1e3a8a;}
  .feedback strong{display:block; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  /* modelo */
  .modelo{
    display:none; margin-top:14px;
    background:#f7fafc; border-left:3px solid var(--blue);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#1e3a8a;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--blue); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  /* cuaderno */
  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  /* nav inferior */
  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:21px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">∑</div>
    <div>
      <h1>Cuaderno de Matemática Básica</h1>
      <p>100 técnicas · 10 bloques · flashcards y ejercicios</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS EN 10 BLOQUES
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · NÚMEROS NATURALES Y ENTEROS ============ */
{
  id:"b1", nombre:"Números naturales y enteros", emoji:"🔢",
  desc:"Base del cálculo: valor posicional, cuatro operaciones, jerarquía, divisibilidad y factorización.",
  tecnicas:[
    {id:"n1", nombre:"Valor posicional",
     concepto:"Cada cifra de un número vale según la posición que ocupa: unidades, decenas, centenas, millares… El 3 de 345 vale 300 y el 3 de 4 530 vale 30. Sin entender la posición no se comprende ni la suma con llevadas ni la descomposición.",
     ejemplo:"En 7 482: 7 unidades de millar (7 000), 4 centenas (400), 8 decenas (80), 2 unidades (2). Descomposición: 7 000 + 400 + 80 + 2.",
     ejercicio:{tipo:"fill",
       consigna:"Descompón el número 5 306.",
       texto:"5 306 = ___ + ___ + ___",
       respuestas:[["5000","5.000","5 000"],["300"],["6"]],
       retro:"Cada cifra se lee con su valor posicional. El 0 de las decenas indica que no hay decenas, pero es imprescindible para que el 3 ocupe el lugar de las centenas."}},

    {id:"n2", nombre:"Suma y resta con llevadas",
     concepto:"En la suma, si una columna supera 9 se lleva 1 a la siguiente. En la resta, si la cifra de arriba es menor que la de abajo, se pide prestada una unidad a la columna superior. El alineamiento por columnas es obligatorio.",
     ejemplo:"347 + 285: 7+5=12 → escribo 2 y llevo 1; 4+8+1=13 → escribo 3 y llevo 1; 3+2+1=6. Resultado: 632.",
     ejercicio:{tipo:"fill",
       consigna:"Calcula el resultado de la operación.",
       texto:"478 + 265 = ___   ·   603 − 187 = ___",
       respuestas:[["743"],["416"]],
       retro:"478+265: 8+5=13 (escribo 3, llevo 1); 7+6+1=14 (escribo 4, llevo 1); 4+2+1=7 → 743. 603−187: pido prestado → 416."}},

    {id:"n3", nombre:"Multiplicación: algoritmo y propiedades",
     concepto:"Multiplicar es sumar repetidamente. El algoritmo multiplica cifra a cifra y desplaza una posición a la izquierda por cada cifra del multiplicador. La propiedad conmutativa (a×b=b×a) y la asociativa permiten reorganizar el cálculo.",
     ejemplo:"34 × 26 = 34×6 + 34×20 = 204 + 680 = 884.",
     ejercicio:{tipo:"fill",
       consigna:"Aplica el algoritmo y calcula.",
       texto:"47 × 23 = ___",
       respuestas:[["1081"]],
       retro:"47×3=141; 47×2=94, desplazado = 940. Suma: 141+940 = 1 081."}},

    {id:"n4", nombre:"División: partes y algoritmo",
     concepto:"En una división a : b = c (r), a es el dividendo, b el divisor, c el cociente y r el resto. Siempre se cumple a = b·c + r, con 0 ≤ r < b. Si r = 0 la división es exacta.",
     ejemplo:"47 : 5 = 9 con resto 2, porque 5·9 + 2 = 47. La división no es exacta.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la igualdad fundamental de la división.",
       texto:"83 : 7 → cociente = ___ y resto = ___   (comprueba: 7·c + r = 83)",
       respuestas:[["11"],["6"]],
       retro:"7·11=77; 83−77=6. Se cumple 7·11+6=83. El resto siempre es menor que el divisor."}},

    {id:"n5", nombre:"Jerarquía de operaciones",
     concepto:"Orden fijo: 1) paréntesis; 2) potencias y raíces; 3) multiplicaciones y divisiones (izq. a der.); 4) sumas y restas. Saltarse el orden produce resultados incorrectos.",

       opciones:["40","16","20","100"],

       retro:"Paréntesis: 5−3=2. Potencia: 2²=4. Multiplicación: 2×4=8. Suma: 8+8=16."}},

    {id:"n6", nombre:"Propiedades de las operaciones",
     concepto:"Conmutativa: a+b=b+a; a×b=b×a. Asociativa: (a+b)+c=a+(b+c); (a×b)×c=a×(b×c). Distributiva: a×(b+c)=a×b+a×c. Estas propiedades permiten calcular de forma más ágil.",
     ejemplo:"25 × 17 × 4 = (25×4) × 17 = 100 × 17 = 1 700. Usamos conmutativa y asociativa para agrupar.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada igualdad según la propiedad que aplica.",
       categorias:["Conmutativa","Asociativa","Distributiva"],
       items:[
         {texto:"7 + 4 = 4 + 7", cat:0},
         {texto:"(3 × 5) × 2 = 3 × (5 × 2)", cat:1},
         {texto:"6 × (2 + 9) = 6×2 + 6×9", cat:2},
         {texto:"12 × 8 = 8 × 12", cat:0},
         {texto:"(4 + 7) + 3 = 4 + (7 + 3)", cat:1},
         {texto:"5 × (10 − 3) = 50 − 15", cat:2}
       ],
       retro:"Conmutativa cambia el orden; asociativa agrupa; distributiva reparte la multiplicación sobre la suma o la resta."}},

    {id:"n7", nombre:"Múltiplos y divisores",

     ejemplo:"Múltiplos de 6: 6, 12, 18, 24, 30… Divisores de 12: 1, 2, 3, 4, 6, 12. El 6 es divisor de 12 y 18 es múltiplo de 6.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe todos los divisores de 18, separados por comas.",
       texto:"Divisores de 18: ___",
       respuestas:[["1,2,3,6,9,18","1, 2, 3, 6, 9, 18","1236918"]],
       retro:"18 = 1·18 = 2·9 = 3·6. Los divisores son siempre los que aparecen en esas factorizaciones."}},

    {id:"n8", nombre:"Criterios de divisibilidad",
     concepto:"Reglas rápidas: por 2 si termina en cifra par; por 3 si la suma de sus cifras es múltiplo de 3; por 5 si termina en 0 o 5; por 9 si la suma de cifras es múltiplo de 9; por 10 si termina en 0.",
     ejemplo:"342: par (÷2). 3+4+2=9, múltiplo de 3 (÷3). 3+4+2=9, múltiplo de 9 (÷9). No termina en 0 ni 5 (no ÷5).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada número según el criterio por el que es divisible (elige el que corresponda).",
       categorias:["Divisible por 2","Divisible por 3","Divisible por 5"],
       items:[
         {texto:"16", cat:0},
         {texto:"21", cat:1},
         {texto:"25", cat:2},
         {texto:"38", cat:0},
         {texto:"27", cat:1},
         {texto:"65", cat:2}
       ],
       retro:"16 y 38 son pares → ÷2. 21 y 27 suman múltiplo de 3 → ÷3. 25 y 65 terminan en 5 → ÷5."}},

    {id:"n9", nombre:"Números primos y compuestos",
     concepto:"Un número primo solo tiene dos divisores: 1 y él mismo (2, 3, 5, 7, 11, 13…). Un número compuesto tiene más divisores. El 1 no es primo ni compuesto. Todo compuesto se descompone en factores primos.",
     ejemplo:"30 = 2 × 3 × 5. El 7 es primo (solo ÷1 y ÷7). El 9 es compuesto (÷1, 3, 9).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estos números es primo?",
       opciones:["21","27","29","33"],
       correcta:2,
       retro:"21=3·7; 27=3·9=3³; 33=3·11. Solo 29 tiene como únicos divisores 1 y 29."}},

    {id:"n10", nombre:"MCM y MCD",
     concepto:"El MCD (máximo común divisor) es el mayor divisor común; el MCM (mínimo común múltiplo) es el menor múltiplo común. Se obtienen descomponiendo en factores primos: MCD toma factores comunes al menor exponente, MCM toma todos los factores al mayor exponente.",
     ejemplo:"12 = 2²·3; 18 = 2·3². MCD = 2·3 = 6. MCM = 2²·3² = 36.",
     ejercicio:{tipo:"fill",
       consigna:"Halla el MCD y el MCM de 8 y 12.",
       texto:"8 = 2³, 12 = 2²·3. MCD = ___ y MCM = ___",
       respuestas:[["4"],["24"]],
       retro:"MCD: factor común al menor exponente → 2² = 4. MCM: todos los factores al mayor exponente → 2³·3 = 24."}}
  ]
},

{

    {id:"n12", nombre:"Suma y resta de enteros",

    {id:"n13", nombre:"Multiplicación y división de enteros",

    {id:"n14", nombre:"Fracciones: concepto y representación",

    {id:"n16", nombre:"Simplificación de fracciones (MCD)",

     ejercicio:{tipo:"fill",

       texto:"18/24 = ___/___   ·   45/60 = ___/___",

    {id:"n17", nombre:"Comparación de fracciones",
     concepto:"Con igual denominador, es mayor la de mayor numerador. Con igual numerador, es mayor la de menor denominador. Si son distintas, se reducen a común denominador o se comparan cruzado: a/b > c/d si a·d > b·c.",

    {id:"n18", nombre:"Suma y resta de fracciones",

       consigna:"Resuelve y simplifica si puedes.",

    {id:"n19", nombre:"Multiplicación y división de fracciones",
     concepto:"Multiplicar: se multiplican numeradores y denominadores en línea. Dividir: se multiplica en cruz (a/b ÷ c/d = a·d / b·c). Conviene simplificar antes para operar con números más pequeños.",
     ejemplo:"2/3 × 3/5 = 6/15 = 2/5. (3/4) : (2/5) = 15/8.",
     ejercicio:{tipo:"fill",
       consigna:"Resuelve.",
       texto:"4/9 × 3/8 = ___   ·   (5/6) : (10/3) = ___",

    {id:"n20", nombre:"Fracción de una cantidad",

       consigna:"Resuelve por sustitución.",
       texto:"x + y = 12; x = y + 2 → y = ___ y x = ___",
       respuestas:[["5"],["7"]],
       retro:"(y+2)+y=12 → 2y=10 → y=5. x = 5+2 = 7."}},

    {id:"n67", nombre:"Sistemas: igualación",
     concepto:"Se despeja la misma incógnita en las dos ecuaciones y se igualan las expresiones obtenidas. Se resuelve la ecuación resultante y se calcula la otra incógnita.",
     ejemplo:"2x+y=7; x−y=2. Despejo y: y=7−2x; y=x−2. Igualo: 7−2x=x−2 → 9=3x → x=3. y=1.",
     ejercicio:{tipo:"fill",
       consigna:"Resuelve por igualación.",
       texto:"y = 2x; y = x + 3 → x = ___ e y = ___",
       respuestas:[["3"],["6"]],
       retro:"2x = x+3 → x=3. y = 2·3 = 6."}},

    {id:"n68", nombre:"Sistemas: reducción",
     concepto:"Se multiplican las ecuaciones por números convenientes para que los coeficientes de una incógnita sean opuestos y al sumar se eliminen. Se resuelve la ecuación resultante y se sustituye para hallar la otra incógnita.",
     ejemplo:"3x+2y=16; 5x−2y=8. Sumando: 8x=24 → x=3. Sustituyo: 9+2y=16 → y=3,5.",
     ejercicio:{tipo:"fill",
       consigna:"Resuelve por reducción.",
       texto:"x + y = 10; x − y = 4 → x = ___ e y = ___",
       respuestas:[["7"],["3"]],
       retro:"Sumando las dos ecuaciones: 2x = 14 → x = 7. Y de la primera: y = 3."}},

    {id:"n69", nombre:"Inecuaciones de primer grado",
     concepto:"Son desigualdades con incógnita. Se resuelven como las ecuaciones, pero al multiplicar o dividir por un número negativo, el sentido de la desigualdad se invierte.",
     ejemplo:"2x + 3 > 11 → 2x > 8 → x > 4. Pero −2x > 6 → x < −3 (se invierte).",
     ejercicio:{tipo:"quiz",
       consigna:"Resuelve −3x ≥ 12.",
       opciones:["x ≥ −4","x ≤ −4","x ≥ 4","x ≤ 4"],
       correcta:1,
       retro:"Dividimos entre −3: al ser negativo, el sentido se invierte. x ≤ −4."}},

    {id:"n70", nombre:"Valor absoluto",
     concepto:"|x| es la distancia de x al 0. Por eso |x| ≥ 0 siempre. La ecuación |x| = a (con a ≥ 0) tiene dos soluciones: x = a y x = −a. Si a < 0, no tiene solución.",
     ejemplo:"|x| = 5 → x = 5 o x = −5. |x−2| = 3 → x−2 = 3 (x=5) o x−2 = −3 (x=−1).",
     ejercicio:{tipo:"fill",
       consigna:"Resuelve la ecuación con valor absoluto.",
       texto:"|x + 1| = 4 tiene dos soluciones: x = ___ y x = ___",
       respuestas:[["3"],["-5","−5"]],
       retro:"x+1=4 → x=3. x+1=−4 → x=−5."}}
  ]
},

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_matematica_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/,/g,".")               // coma decimal → punto
    .replace(/\s+/g," ")
    .replace(/[¡!¿?;"']/g,"").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  /* cabecera */
  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + (CATEGORIAS.findIndex(c => c.id === t.catId)+1) + "/10"));

  /* puntos de avance dentro del bloque */
  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  /* flashcard */
  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo práctico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  /* ejercicio */
  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);

  const fb = el("div","feedback");
  fb.id = "ej-feedback";
  sec.appendChild(fb);

  panel.appendChild(sec);

  /* cuaderno */
  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.id = "nota";
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus cálculos, dudas, ejemplos propios o el resultado del ejercicio…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  /* navegación */
  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  /* eventos */
  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);

  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   MOTOR DE EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

/* QUIZ */
function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal",
        ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

/* FILL */
function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

/* ORDER */
function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);

  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

/* CLASSIFY */
function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

/* OPEN */
function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 20){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    /* refrescar puntos de avance del bloque */
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    document.querySelectorAll(".bdot").forEach((d,i) => {
      if(block && block.tecnicas[i]){
        d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      }
    });
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
</body>
</html>
