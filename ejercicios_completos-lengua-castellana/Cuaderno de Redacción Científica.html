       respuestas:[["garcia","garcía","autor"],["2020","año"]],
       retro:"La paráfrasis mantiene la idea ajena con palabras propias y siempre cita la fuente. Sin cita, sería plagio."}},

    {id:"c64", nombre:"Cita de cita (apud)",
     concepto:"Cuando citamos una fuente que a su vez cita a otra, se indica el autor original y el autor consultado: (Autor original, año, citado en Autor consultado, año). En APA se usa «como se citó en».",
     ejemplo:"«La fotosíntesis es un proceso cuántico» (Feynman, 1965, como se citó en García, 2020).",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita de cita.",
       texto:"«La célula es la unidad básica de la vida» (Schleiden, 1838, como se citó en ___, ___).",
       respuestas:[["garcia","garcía","autor consultado"],["2020","año consultado"]],
       retro:"La cita de cita indica el autor original y el consultado. En lo posible, conviene acudir a la fuente original."}},

    {id:"c65", nombre:"Referencias de libros (APA)",
     concepto:"Formato: Apellido, A. A. (Año). Título en cursiva (edición). Editorial. Si es traducido, se indica el traductor. Si es capítulo, se añaden «En Editor (Ed.), Título del libro (pp. X-X)».",
     ejemplo:"García, M. (2020). Biología celular (3.ª ed.). Editorial Científica.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia de libro en APA.",
       items:[
         "Apellido, inicial del autor.",
         "(Año).",
         "Título del libro en cursiva.",
         "(Edición, si la hay).",
         "Editorial."
       ],
       retro:"El formato APA de libro tiene un orden fijo. La cursiva se aplica al título del libro, nunca al autor ni a la editorial."}},

    {id:"c66", nombre:"Referencias de artículos científicos",
     concepto:"Formato APA: Apellido, A. A. (Año). Título del artículo. Nombre de la Revista, volumen(número), páginas. DOI. El título de la revista va en cursiva; el volumen también.",
     ejemplo:"López, J. (2021). Efecto del pH en la actividad enzimática. Revista de Bioquímica, 15(2), 45-58. https://doi.org/10.1234/rb.2021.15.2.45",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia del artículo.",
       texto:"Pérez, A. (___) Efecto de la temperatura en la germinación. Revista de Botánica, ___(3), 21-30.",
       respuestas:[["2022","año"],["10","volumen","12"]],
       retro:"En APA el volumen va en cursiva (cuando se formatea) y el número entre paréntesis sin cursiva. Siempre se incluyen las páginas."}},

    {id:"c67", nombre:"Referencias de páginas web",
     concepto:"Formato APA: Autor o institución. (Año, día mes). Título de la página. Nombre del sitio. URL. Si no hay fecha, se usa (s.f.). Si el autor es la institución, no se repite.",
     ejemplo:"Organización Mundial de la Salud. (2023, 15 de marzo). Cambio climático y salud. OMS. https://www.who.int/es/...",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia web.",
       texto:"Ministerio de Educación. (2023, 10 de mayo). Guía de laboratorio escolar. ___ [sitio web] · https://www.ejemplo.gob/...",
       respuestas:[["ministerio de educacion","ministerio de educación","nombre del sitio","el ministerio"]],
       retro:"En APA, si el autor es también el sitio web, se omite el nombre del sitio. Si no hay fecha, se usa (s.f.)."}},

    {id:"c68", nombre:"DOI y enlaces permanentes",
     concepto:"El DOI (Digital Object Identifier) es un identificador permanente de documentos académicos. Es más estable que una URL y se incluye al final de la referencia, tras «https://doi.org/».",
     ejemplo:"https://doi.org/10.1038/nature12373 — este DOI conduce siempre al mismo artículo, aunque cambie la URL de la revista.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué se recomienda incluir el DOI en las referencias?",
       opciones:["Porque queda más elegante","Porque es un enlace permanente y estable","Porque lo exige la universidad","Porque ocupa menos espacio"],
       correcta:1,
       retro:"El DOI permanece aunque cambie la web de la revista. Es la forma más fiable de enlazar un artículo."}},

    {id:"c69", nombre:"Orden alfabético y sangría francesa",
     concepto:"En APA la lista de referencias se ordena alfabéticamente por apellido del autor y se escribe con sangría francesa: la primera línea pegada al margen y las siguientes sangradas.",
     ejemplo:"García, M. (2020). …\n     López, J. (2021). …\n     Pérez, A. (2022). …",
     ejercicio:{tipo:"order",
       consigna:"Ordena alfabéticamente estas referencias por apellido.",
       items:[
         "Álvarez, R. (2019). …",
         "García, M. (2020). …",
         "López, J. (2021). …",
         "Martínez, P. (2018). …",
         "Pérez, A. (2022). …"
       ],
       retro:"El orden es estrictamente alfabético por apellido. La sangría francesa ayuda a identificar rápidamente cada entrada."}},

    {id:"c70", nombre:"Gestión con Zotero o Mendeley",
     concepto:"Los gestores bibliográficos capturan automáticamente los metadatos de un artículo, generan citas y listas en el formato elegido (APA, Vancouver, IEEE) y permiten cambiar de formato con un clic.",
     ejemplo:"Con Zotero conectado al navegador, al abrir un artículo en una revista se pulsa el icono y se guarda con autor, año, título, revista, DOI. Después, un plugin en el procesador de textos inserta las citas.",
     ejercicio:{tipo:"order",
       consigna:"Ordena el flujo de trabajo con un gestor bibliográfico.",
       items:[
         "Instalar el gestor y el conector del navegador.",
         "Guardar las referencias al encontrarlas.",
         "Organizar por carpetas o etiquetas según el tema.",
         "Insertar citas en el documento mientras se escribe.",
         "Generar automáticamente la lista de referencias al final."
       ],
       retro:"El gestor evita errores, ahorra tiempo y permite cambiar el formato de todas las citas con un solo clic."}}
  ]
},

/* ============ BLOQUE 8 · GÉNEROS DE ESCRITURA CIENTÍFICA ============ */
{
  id:"b8", nombre:"Géneros de escritura científica", emoji:"📄",
  desc:"Informe, artículo, revisión, protocolo, póster, comunicación oral, reseña y divulgación.",
  tecnicas:[
    {id:"c71", nombre:"Informe de laboratorio",
     concepto:"El informe de laboratorio documenta una práctica experimental: título, objetivo, introducción, materiales, método, resultados, discusión y conclusiones. Es el género científico más frecuente en secundaria.",
     ejemplo:"Informe: «Práctica 4. Determinación de la densidad del agua.» Con todos los apartados, cada uno con su función específica.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las secciones del informe de laboratorio.",
       items:[
         "Título y objetivo de la práctica.",
         "Introducción teórica.",
         "Materiales y método.",
         "Resultados (datos, tablas, gráficos).",
         "Discusión y conclusiones."
       ],
       retro:"El informe de laboratorio sigue la estructura IMRyD, adaptada a la enseñanza: título, objetivo, introducción, método, resultados y discusión."}},

    {id:"c72", nombre:"Artículo original",
     concepto:"Un artículo original presenta resultados nuevos de una investigación. Sigue la estructura IMRyD, tiene resumen y palabras clave, y se publica en revistas con revisión por pares.",
     ejemplo:"Un artículo que describe el descubrimiento de un nuevo mecanismo enzimático, con datos experimentales y discusión de sus implicaciones.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué distingue a un artículo original de una revisión?",
       opciones:["Que es más largo","Que presenta resultados nuevos de investigación","Que tiene más citas","Que se publica antes"],
       correcta:1,
       retro:"El artículo original aporta datos nuevos; la revisión sintetiza lo que ya existe. Ambos siguen estructuras distintas."}},

    {id:"c73", nombre:"Artículo de revisión",
     concepto:"Un artículo de revisión sintetiza el estado del conocimiento sobre un tema. Puede ser narrativo (libre) o sistemático (con protocolo y criterios). Es útil para orientarse en un campo.",
     ejemplo:"«Efectos del cambio climático en la biodiversidad andina: una revisión de la última década» resume y compara decenas de estudios publicados.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada característica según corresponda al artículo original o al de revisión.",
       categorias:["Artículo original","Artículo de revisión"],
       items:[
         {texto:"Aporta datos experimentales nuevos.", cat:0},
         {texto:"Sintetiza estudios previos.", cat:1},
         {texto:"Sección de resultados con datos propios.", cat:0},
         {texto:"Puede incluir metaanálisis.", cat:1},
         {texto:"Hipótesis propia que se contrasta.", cat:0}
       ],
       retro:"Original = datos nuevos. Revisión = síntesis de datos existentes. Algunas revisiones sistemáticas son también investigación original por su método."}},

    {id:"c74", nombre:"Protocolo experimental",
     concepto:"Un protocolo describe paso a paso cómo se va a realizar un experimento, antes de hacerlo. Es detallado, numerado y reproducible. Se usa en laboratorios y en ciencias de la salud.",
     ejemplo:"«Protocolo: Determinación de la actividad de la catalasa. 1) Extraer el tejido. 2) Homogeneizar con tampón. 3) Centrifugar a 3000 rpm. 4) Medir la actividad por producción de O₂. …»",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del protocolo experimental.",
       items:[
         "Objetivo y fundamento teórico.",
         "Materiales, reactivos e instrumentos.",
         "Procedimiento paso a paso, numerado.",
         "Precauciones y manejo de residuos.",
         "Registro de datos y cálculos previstos."
       ],
       retro:"El protocolo se escribe antes del experimento. Su detalle garantiza que cualquiera pueda repetirlo en las mismas condiciones."}},

    {id:"c75", nombre:"Póster científico",
     concepto:"El póster resume visualmente un estudio. Combina texto breve, gráficos y tablas, con un diseño claro: título, autores, introducción, método, resultados y conclusiones. Debe leerse en 2-3 minutos.",
     ejemplo:"Un póster A1 con título grande, un gráfico central con los resultados y dos columnas de texto breve. Sin párrafos largos.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza a un póster científico?",
       opciones:["Texto muy extenso y detallado","Resumen visual: gráficos claros, texto breve y estructura legible","Ausencia de datos","Fotografías decorativas"],
       correcta:1,
       retro:"El póster es un formato visual. Prima la claridad y la síntesis: quien lo lee debe captar el estudio en pocos minutos."}},

    {id:"c76", nombre:"Comunicación oral en congreso",
     concepto:"La comunicación oral resume la investigación en 10-15 minutos. Estructura: presentación, objetivo, método, resultados, conclusión y preguntas. Se apoya en diapositivas claras y breves.",
     ejemplo:"Diapositiva 1: título y autores. Diapositiva 2: pregunta de investigación. Diapositivas 3-5: método. Diapositivas 6-8: resultados. Diapositiva 9: conclusiones. Diapositiva 10: agradecimientos.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una comunicación oral.",
       items:[
         "Presentación del tema y su relevancia.",
         "Objetivo o pregunta de investigación.",
         "Método empleado, breve.",
         "Resultados principales, con apoyo visual.",
         "Conclusiones y turno de preguntas."
       ],
       retro:"La comunicación oral prioriza lo esencial. Cada diapositiva debe apoyar la palabra, no sustituirla."}},

    {id:"c77", nombre:"Reseña científica",
     concepto:"La reseña valora críticamente un artículo, un libro o un estudio. Resume, contextualiza, analiza los puntos fuertes y débiles y lo sitúa en el campo. No es solo un resumen.",
     ejemplo:"«El libro X ofrece una síntesis actualizada del tema, aunque omite los estudios latinoamericanos recientes. Su principal aporte es…»",
     ejercicio:{tipo:"fill",
       consigna:"Completa las partes de una reseña.",
       texto:"La reseña resume el ___ y lo ___ en el campo. Analiza los puntos ___ y ___ y termina con una ___ razonada.",
       respuestas:[["contenido","texto","trabajo"],["contextualiza","sitúa","situa"],["fuertes","positivos","fortalezas"],["debiles","débiles","negativos","debilidades"],["valoracion","valoración","recomendacion","recomendación","opinion","opinión"]],
       retro:"La reseña combina síntesis y valoración. No basta con resumir: hay que aportar un juicio razonado y situar la obra."}},

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_cientifico_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo científico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Cuaderno de campo del estudiante <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, observaciones, datos, cálculos, dudas o ejemplos propios…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
</body>
