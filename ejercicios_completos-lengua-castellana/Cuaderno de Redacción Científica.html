<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Científica · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e8eef7;
    --paper:#fffdfa;
    --paper-2:#f4f8fd;
    --ink:#16243b;
    --muted:#5f6f88;
    --line:#cfd9e8;
    --line-2:#b5c4da;
    --accent:#1e40af;
    --accent-dark:#1e3a8a;
    --accent-soft:#dbeafe;
    --coral:#e76f51;
    --coral-dark:#c2410c;
    --coral-soft:#ffe4d6;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(20,40,80,.06), 0 12px 30px rgba(20,40,80,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #f2f6fc 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,253,250,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #bfdbfe;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:16.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d4dfee; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#1e40af,#e76f51); transition:width .4s;}

  .btn{
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eef3fa; border-color:#7f93b5;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:inherit; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f4f8fd; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.6px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#eef3fa;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-size:10.5px; font-weight:800;
    background:var(--coral-soft); color:var(--coral-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dae3f0; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--coral)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:13px; line-height:1.35; color:#28374f;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#eef3fa;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--coral));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #bfdbfe; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(30,64,175,.20); border-color:var(--accent);}

  /* flashcard · papel cuadriculado científico */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#ffffff;
    background-image:
      linear-gradient(rgba(30,64,175,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,64,175,.09) 1px, transparent 1px);
    background-size:24px 24px;
    box-shadow:inset 22px 0 0 -21px #f8b4a0;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #bfdbfe;
    background-color:#f4f9ff;
    box-shadow:inset 22px 0 0 -21px #93c5fd;
  }
  .fc-tag{
    font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:24px; color:#182236; background:rgba(255,255,255,.85); padding:6px 8px; border-radius:6px;}
  .fc-back p{color:#1e3a8a; background:rgba(244,249,255,.9);}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:11.5px; color:#8899b0; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#26364e;
    background:#f4f8fd; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f4f9ff; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dae3f0; color:var(--muted);
    display:grid; place-items:center;
    font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#182236;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--coral);
    background:#fff7f2; color:var(--coral-dark); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#ffe4d6; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eef3fa; border:1.5px dashed var(--line-2);}
  .seq{background:#f4f9ff; border:1.5px solid #bfdbfe;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b5c4da; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f4f9ff;}
  .seq .ord-item{border-color:#bfdbfe;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eef3fa; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#3a4a63; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:24px;
    color:#182236; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fff;
    background-image:
      linear-gradient(rgba(30,64,175,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,64,175,.08) 1px, transparent 1px);
    background-size:24px 24px;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(30,64,175,.12);}
  textarea::placeholder{color:#8899b0; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--coral-soft); border:1px solid #fdba74; color:#7c2d12;}
  .feedback strong{display:block; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f4f8fd; border-left:3px solid var(--coral);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#7c2d12;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--coral); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,30,60,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🔬</div>
    <div>
      <h1>Cuaderno de Redacción Científica · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · ciencias naturales y escritura académica</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN CIENTÍFICA + CIENCIAS NATURALES · 10 BLOQUES
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · OBSERVACIÓN Y DESCRIPCIÓN ============ */
{
  id:"b1", nombre:"Observación y descripción científica", emoji:"🔬",
  desc:"Observar sistemáticamente, describir con objetividad, medir y registrar.",
  tecnicas:[
    {id:"c1", nombre:"Observación sistemática",
     concepto:"Observar científicamente no es mirar: es registrar de forma ordenada, con criterios definidos y repetibles. Se usan los sentidos y los instrumentos, y se anota todo lo relevante, incluso lo inesperado.",
     ejemplo:"Al observar el crecimiento de una planta durante 15 días, no basta con decir «creció»: se mide su altura cada mañana a la misma hora, con la misma regla, y se anota también la fecha, la temperatura y el riego.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué distingue la observación científica de una observación casual?",
       opciones:["Que se hace al aire libre","Que sigue criterios definidos, se registra y es repetible","Que la hace un científico titulado","Que se realiza con microscopio"],
       correcta:1,
       retro:"La observación científica es sistemática, registrada y reproducible. Cualquier persona con los mismos criterios debería obtener datos comparables."}},

    {id:"c2", nombre:"Descripción objetiva vs subjetiva",
     concepto:"La descripción objetiva se refiere a propiedades verificables y medibles. La subjetiva expresa valoraciones personales. En ciencia se privilegia la primera y se reserva la segunda para la interpretación.",
     ejemplo:"Objetiva: «La hoja mide 7,2 cm de largo y su color es verde oscuro». Subjetiva: «La hoja es hermosa y muy grande». Solo la primera es ciencia.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada descripción como objetiva o subjetiva.",
       categorias:["Objetiva","Subjetiva"],
       items:[
         {texto:"«El mineral tiene una dureza de 6 en la escala de Mohs.»", cat:0},
         {texto:"«El mineral es precioso y muy bonito.»", cat:1},
         {texto:"«La temperatura del agua es de 25 °C.»", cat:0},
         {texto:"«El agua está deliciosa hoy.»", cat:1},
         {texto:"«La muestra pesa 12,4 gramos.»", cat:0}
       ],
       retro:"La descripción objetiva se puede medir o verificar. La subjetiva depende del observador y no es replicable."}},

    {id:"c3", nombre:"Variables: independiente, dependiente y controlada",
     concepto:"En un experimento, la variable independiente es la que se manipula; la dependiente, la que se mide; las controladas, las que se mantienen constantes. Reconocerlas es imprescindible para escribir un método.",
     ejemplo:"Estudio del efecto de la luz sobre el crecimiento: VI = horas de luz al día; VD = altura de la planta; controladas = agua, tierra, temperatura, tipo de semilla.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada variable del experimento sobre la germinación de semillas según la temperatura del agua.",
       categorias:["Independiente","Dependiente","Controlada"],
       items:[
         {texto:"Temperatura del agua", cat:0},
         {texto:"Número de semillas germinadas", cat:1},
         {texto:"Cantidad de agua aplicada", cat:2},
         {texto:"Tipo de semilla", cat:2},
         {texto:"Tiempo hasta la germinación", cat:1}
       ],
       retro:"La VI se manipula; la VD se mide; las controladas se mantienen fijas. Sin control de variables, los resultados no son interpretables."}},

    {id:"c4", nombre:"Unidades del Sistema Internacional (SI)",
     concepto:"El SI define unidades estándar para cada magnitud: longitud en metros (m), masa en kilogramos (kg), tiempo en segundos (s), temperatura en kelvin (K), cantidad de sustancia en moles (mol), corriente en amperios (A).",
     ejemplo:"Escribir «pesa 500» es incorrecto: hay que decir «su masa es de 500 g» o «500 kg», indicando la unidad. La temperatura se da en °C en el aula y en K en ciencia básica.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la unidad del SI correspondiente.",
       texto:"Longitud: ___ · Masa: ___ · Tiempo: ___ · Temperatura termodinámica: ___",
       respuestas:[["metro","m","metros"],["kilogramo","kg","kilogramos"],["segundo","s","segundos"],["kelvin","k","kelvins"]],
       retro:"Las unidades del SI son el lenguaje común de la ciencia. Omitirlas o mezclarlas invalida cualquier medición."}},

    {id:"c5", nombre:"Instrumentos de medida",
     concepto:"Cada magnitud exige un instrumento y una precisión adecuada: regla (mm), balanza (g), termómetro (°C), probeta (mL), cronómetro (s), microscopio, dinamómetro (N).",
     ejemplo:"Para medir 25 mL de agua usaré una probeta graduada en mL, no un vaso. Para medir la masa, una balanza, no el tacto.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada instrumento según la magnitud que mide.",
       categorias:["Longitud","Masa","Volumen","Tiempo"],
       items:[
         {texto:"Regla graduada", cat:0},
         {texto:"Balanza digital", cat:1},
         {texto:"Probeta", cat:2},
         {texto:"Cronómetro", cat:3},
         {texto:"Cinta métrica", cat:0},
         {texto:"Vaso de precipitados", cat:2}
       ],
       retro:"Cada instrumento mide una magnitud y aporta una precisión concreta. Elegir mal el instrumento invalida la medición."}},

    {id:"c6", nombre:"Cuaderno de laboratorio",
     concepto:"El cuaderno de laboratorio es el registro primario de la investigación: fecha, objetivo, materiales, procedimiento, observaciones, datos, cálculos y conclusiones. Debe ser claro y honesto, con los errores incluidos.",
     ejemplo:"Cada práctica se anota así: «Práctica 3 · 12/11/2025 · Objetivo: medir la densidad del agua · Materiales: probeta, balanza, agua · Procedimiento: … · Datos: m = 25,3 g; V = 25 mL · Resultado: d = 1,01 g/mL · Observaciones: …»",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del cuaderno de laboratorio.",
       items:[
         "Fecha, título y objetivo de la práctica.",
         "Materiales e instrumentos utilizados.",
         "Procedimiento seguido paso a paso.",
         "Datos y observaciones registrados durante la práctica.",
         "Cálculos, resultados y conclusiones."
       ],
       retro:"El cuaderno se escribe en el momento, no después. Lo que no queda registrado, en ciencia se considera que no ocurrió."}},

    {id:"c7", nombre:"Clasificación y taxonomía",
     concepto:"La taxonomía ordena los seres vivos en categorías jerárquicas: reino, filo, clase, orden, familia, género y especie. La nomenclatura binomial usa el género y la especie en latín, con el género en mayúscula y la especie en minúscula.",
     ejemplo:"El ser humano: Animalia (reino), Chordata (filo), Mammalia (clase), Primates (orden), Hominidae (familia), Homo (género), Homo sapiens (especie).",
     ejercicio:{tipo:"fill",
       consigna:"Escribe los niveles taxonómicos que faltan.",
       texto:"Reino → Filo → Clase → ___ → Familia → ___ → Especie · El nombre científico «Homo sapiens» se escribe con el género en ___ y la especie en ___.",
       respuestas:[["orden"],["genero","género"],["mayuscula","mayúscula"],["minuscula","minúscula"]],
       retro:"La taxonomía es un lenguaje universal. El nombre científico se escribe siempre en cursiva, con el género en mayúscula y la especie en minúscula."}},

    {id:"c8", nombre:"Magnitudes y símbolos",
     concepto:"En ciencia cada magnitud tiene un símbolo y una unidad: masa m (kg), tiempo t (s), longitud l (m), temperatura T (K), velocidad v (m/s), densidad d (g/mL), energía E (J), fuerza F (N).",
     ejemplo:"La fórmula de la densidad es d = m/V. Al escribirla, las unidades deben ser coherentes: si m está en g y V en mL, d estará en g/mL.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los símbolos.",
       texto:"masa = ___ · velocidad = ___ · densidad = ___ · fuerza = ___",
       respuestas:[["m"],["v"],["d"],["f"]],
       retro:"Los símbolos son universales: la misma «m» significa masa en cualquier país y en cualquier idioma científico."}},

    {id:"c9", nombre:"Cambios de unidades",
     concepto:"En ciencias hay que convertir unidades con frecuencia. La clave es multiplicar o dividir por potencias de 10 según la escala: 1 km = 1000 m, 1 m = 100 cm, 1 kg = 1000 g, 1 L = 1000 mL.",
     ejemplo:"2,5 km = 2 500 m = 250 000 cm. 350 mL = 0,35 L. 0,75 kg = 750 g. La conversión se hace con factores de conversión.",
     ejercicio:{tipo:"fill",
       consigna:"Realiza las conversiones.",
       texto:"3,2 km = ___ m · 450 g = ___ kg · 1,5 L = ___ mL",
       respuestas:[["3200","3.200","3 200"],["0,45","0.45"],["1500","1.500","1 500"]],
       retro:"Multiplicar por 1000 al bajar en la escala y dividir por 1000 al subir. La coherencia de unidades es esencial en cualquier cálculo."}},

    {id:"c10", nombre:"Precisión, exactitud y error",
     concepto:"La precisión indica la repetibilidad de una medida; la exactitud, la cercanía al valor real. El error es la diferencia entre el valor medido y el real. En ciencia ambos se declaran.",
     ejemplo:"Si la balanza da siempre 25,1 g pero el valor real es 25,0 g, la medición es precisa pero no exacta. Si da 25,0; 25,3; 24,8; 25,1, es exacta en promedio pero poco precisa.",
     ejercicio:{tipo:"quiz",
       consigna:"Si un instrumento da siempre 9,8 m/s² pero el valor real es 9,81 m/s², ¿cómo describirías la medición?",
       opciones:["Muy imprecisa e inexacta","Precisa y exacta","Precisa pero ligeramente inexacta","Imprecisa pero exacta"],
       correcta:2,
       retro:"Preciso = da siempre el mismo valor. Exacto = ese valor está muy cerca del real. Aquí se cumple lo primero y casi lo segundo."}}
  ]
},

/* ============ BLOQUE 2 · MÉTODO CIENTÍFICO Y FORMULACIÓN ============ */
{
  id:"b2", nombre:"Método científico y formulación", emoji:"🧪",
  desc:"Pregunta, hipótesis, objetivos, justificación, diseño experimental y limitaciones.",
  tecnicas:[
    {id:"c11", nombre:"La pregunta de investigación",
     concepto:"Una buena pregunta de investigación es concreta, verificable y relevante. No puede responderse con un simple sí o no, y orienta todo el estudio posterior.",
     ejemplo:"Pregunta correcta: «¿Cómo afecta la concentración de sal del agua a la velocidad de ebullición?» Pregunta vaga: «¿Es importante la sal?»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pregunta como buena o mala pregunta de investigación.",
       categorias:["Buena pregunta","Mala pregunta"],
       items:[
         {texto:"«¿Cómo varía el crecimiento de las plantas según la cantidad de luz diaria?»", cat:0},
         {texto:"«¿Las plantas son bonitas?»", cat:1},
         {texto:"«¿Qué efecto tiene el pH del suelo en la germinación de las semillas?»", cat:0},
         {texto:"«¿La ciencia es importante?»", cat:1},
         {texto:"«¿Influye la temperatura en la velocidad de reacción del bicarbonato con vinagre?»", cat:0}
       ],
       retro:"Una buena pregunta es concreta, verificable, medible y no admite respuesta binaria. Las preguntas vagas no pueden contestarse con datos."}},

    {id:"c12", nombre:"La hipótesis",
     concepto:"Una hipótesis es una posible respuesta a la pregunta de investigación, expresada de forma clara y contrastable. Debe poder ser confirmada o refutada con datos experimentales.",
     ejemplo:"Pregunta: «¿Cómo afecta la temperatura al crecimiento de la planta?» Hipótesis: «Si la temperatura se mantiene entre 20 y 25 °C, entonces la planta crecerá más rápido que a 10 °C o a 35 °C, porque ese rango es óptimo para su metabolismo.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas afirmaciones es una hipótesis científica bien formulada?",
       opciones:["«Las plantas son verdes porque sí.»","«Si aumento la concentración de CO₂, entonces la tasa de fotosíntesis aumentará hasta un límite, porque el CO₂ es un reactivo de la fotosíntesis.»","«La naturaleza es maravillosa.»","«Creo que las plantas crecen mejor con música clásica.»"],
       correcta:1,
       retro:"Una hipótesis es una predicción razonada y contrastable. Tiene la forma «Si…, entonces…, porque…» y conecta variables con un razonamiento."}},

    {id:"c13", nombre:"Objetivos general y específicos",
     concepto:"El objetivo general expresa la meta amplia del estudio. Los específicos la descomponen en acciones concretas, verificables y ordenadas. Se formulan con verbos en infinitivo: identificar, medir, comparar, analizar, describir.",
     ejemplo:"General: «Analizar el efecto de la temperatura en la germinación de las semillas de frijol.» Específicos: 1) Medir el porcentaje de germinación a 10, 20 y 30 °C. 2) Comparar los tiempos de germinación. 3) Describir las diferencias observadas.",
     ejercicio:{tipo:"fill",
       consigna:"Reformula estos objetivos con verbos en infinitivo.",
       texto:"«Mediremos la altura de las plantas» → ___ la altura de las plantas · «Hicimos una comparación de temperaturas» → ___ las temperaturas · «Describimos los resultados» → ___ los resultados",
       respuestas:[["medir"],["comparar"],["describir"]],
       retro:"Los objetivos usan verbos en infinitivo y describen acciones medibles. «Medir, comparar, describir, identificar, analizar, cuantificar» son los más frecuentes."}},

    {id:"c14", nombre:"Justificación del estudio",
     concepto:"La justificación explica por qué vale la pena hacer esa investigación: qué problema aborda, a quién beneficia, qué vacío de conocimiento cubre. No es «porque me lo pidió el profesor».",
     ejemplo:"«Esta investigación es relevante porque la sequía afecta al 40 % de los cultivos de la región y comprender la respuesta de las semillas a la temperatura puede orientar prácticas agrícolas más eficientes.»",
     ejercicio:{tipo:"open",
       consigna:"Escribe una justificación breve (3-4 líneas) para un estudio sobre el efecto del pH del agua en la germinación de lentejas.",
       criterios:[
         "Mencioné el problema o fenómeno concreto.",
         "Expliqué a quién o a qué beneficia el estudio.",
         "Usé un lenguaje científico y no valorativo."
       ],
       modelo:"Este estudio es relevante porque la acidez del agua de riego varía según la zona y afecta a la germinación de cultivos básicos. Comprender cómo responde la lenteja a distintos niveles de pH permite ajustar prácticas agrícolas y seleccionar variedades más tolerantes. Además, aporta datos útiles para la enseñanza de la biología vegetal en secundaria."}},

    {id:"c15", nombre:"Marco teórico",
     concepto:"El marco teórico es el conjunto de conceptos y estudios previos sobre los que se apoya la investigación. Sitúa el trabajo en un contexto y demuestra que se conoce lo que ya se sabe.",
     ejemplo:"Si investigo la fotosíntesis, el marco teórico incluye qué es, dónde ocurre, qué factores la afectan, y qué han encontrado otros estudios sobre la influencia de la luz y el CO₂.",
     ejercicio:{tipo:"open",
       consigna:"Enumera tres conceptos o fuentes que incluirías en el marco teórico de un estudio sobre la contaminación del agua por plásticos.",
       criterios:[
         "Mencioné al menos tres conceptos clave relacionados con el tema.",
         "Relacioné los conceptos entre sí o con el problema del estudio.",
         "Usé lenguaje científico y reconocí que hay estudios previos."
       ],
       modelo:"1) Definición de microplásticos y su origen (fragmentación de plásticos mayores). 2) Estudios previos sobre la presencia de microplásticos en ríos y océanos (OMS, ONU Medio Ambiente). 3) Efectos documentados en la fauna acuática: ingestión, bioacumulación y alteración de la cadena trófica. Estos tres ejes permiten situar el problema y justificar la necesidad de más datos locales."}},

    {id:"c16", nombre:"Diseño experimental",
     concepto:"El diseño experimental define cómo se va a realizar el estudio: qué se mide, cuándo, cómo, cuántas repeticiones y con qué controles. Un diseño claro es imprescindible para que el experimento sea replicable.",
     ejemplo:"Diseño: 3 grupos de 10 semillas cada uno. Grupo A a 10 °C, B a 20 °C, C a 30 °C. Misma tierra, misma agua, mismo tiempo de exposición. Se mide la germinación cada 12 h durante 10 días.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las decisiones del diseño experimental.",
       items:[
         "Definir qué se va a medir y con qué instrumento.",
         "Elegir el número de grupos y de repeticiones.",
         "Establecer las condiciones que se mantienen constantes.",
         "Decidir los intervalos de observación y el tiempo total.",
         "Definir qué se considerará resultado y cómo se registrará."
       ],
       retro:"El diseño se decide antes de empezar. Improvisar durante el experimento invalida los datos."}},

    {id:"c17", nombre:"Grupo control y grupo experimental",
     concepto:"El grupo control no recibe el tratamiento; el experimental sí. Comparar ambos permite atribuir los cambios a la variable manipulada y no a otros factores.",
     ejemplo:"Si pruebo un fertilizante: grupo A recibe fertilizante (experimental), grupo B recibe agua (control). Si A crece más, puede atribuirse al fertilizante. Sin control, no hay conclusión válida.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada grupo en un experimento sobre el efecto de la luz en la fotosíntesis.",
       categorias:["Grupo control","Grupo experimental"],
       items:[
         {texto:"Plantas expuestas a 8 horas de luz diaria.", cat:1},
         {texto:"Plantas mantenidas en oscuridad total.", cat:0},
         {texto:"Plantas expuestas a 12 horas de luz.", cat:1},
         {texto:"Plantas de referencia sin tratamiento de luz adicional.", cat:0}
       ],
       retro:"El grupo control permite comparar. Sin él, no sabemos si el cambio se debe al tratamiento o a otra variable."}},

    {id:"c18", nombre:"Reproducibilidad y réplicas",
     concepto:"Un experimento debe poder repetirse por otros investigadores y dar resultados similares. Por eso se hacen varias réplicas y se documentan con detalle. Un resultado único no es ciencia: es una anécdota.",
     ejemplo:"Si solo germina una semilla de las 30 plantadas a 30 °C, no se puede concluir nada. Con 3 grupos de 10 semillas y resultados similares, la conclusión gana solidez.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué son importantes las réplicas en un experimento?",
       opciones:["Para ahorrar tiempo","Para que los resultados sean más fiables y no se deban al azar","Para tener más material que mostrar","Para que el informe sea más largo"],
       correcta:1,
       retro:"Las réplicas reducen el efecto del azar y de las variaciones individuales. Sin repetición, cualquier resultado puede ser una casualidad."}},

    {id:"c19", nombre:"Predicciones contrastables",
     concepto:"De una hipótesis se derivan predicciones concretas: qué debería observarse si la hipótesis es correcta. Si las predicciones no se cumplen, la hipótesis debe revisarse.",
     ejemplo:"Hipótesis: «La planta crece más con 12 h de luz que con 6 h.» Predicción: «Al día 10, la altura media del grupo de 12 h será mayor que la del grupo de 6 h.»",
     ejercicio:{tipo:"fill",
       consigna:"Deriva una predicción concreta de la hipótesis dada.",
       texto:"Hipótesis: «A mayor temperatura (hasta 40 °C), mayor velocidad de disolución del azúcar en agua.» Predicción: al aumentar la temperatura, el tiempo de disolución será ___.",
       respuestas:[["menor","mas corto","más corto","más breve","mas breve","inferior"]],
       retro:"Una predicción derivada de la hipótesis concreta qué se espera observar. Si no se cumple, hay que revisar la hipótesis."}},

    {id:"c20", nombre:"Limitaciones y alcance",
     concepto:"Todo estudio tiene límites: qué se ha medido y qué no, en qué condiciones, con qué muestra. Declararlos con honestidad es parte de la buena ciencia.",
     ejemplo:"«Este estudio se realizó en condiciones de laboratorio con semillas de una sola variedad; los resultados podrían no ser extrapolables a otras especies o a condiciones de campo.»",
     ejercicio:{tipo:"open",
       consigna:"Escribe dos limitaciones posibles de un estudio sobre la contaminación del aire en tu ciudad.",
       criterios:[
         "Mencioné al menos dos limitaciones concretas y realistas.",
         "Las limitaciones se refieren al alcance del estudio, no a errores de ejecución.",
         "Usé un tono científico y prudente."
       ],
       modelo:"1) El estudio solo mide partículas PM2,5 en dos puntos de la ciudad, por lo que no representa toda la variabilidad espacial. 2) La recogida de datos se hizo durante tres semanas de primavera; las concentraciones podrían ser distintas en invierno o en época de lluvias."}}
  ]
},

/* ============ BLOQUE 3 · BÚSQUEDA Y FUENTES ============ */
{
  id:"b3", nombre:"Búsqueda y fuentes de información", emoji:"📚",
  desc:"Fuentes primarias y secundarias, buscadores académicos, criterios de fiabilidad y fichas.",
  tecnicas:[
    {id:"c21", nombre:"Fuentes primarias y secundarias",
     concepto:"Las fuentes primarias son originales: artículos de investigación, informes técnicos, datos brutos. Las secundarias interpretan o resumen las primarias: libros de texto, enciclopedias, artículos de divulgación.",
     ejemplo:"Primaria: un artículo que describe un experimento original sobre el ADN. Secundaria: un manual que resume ese experimento. Ambas son útiles, pero la primera es más directa.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada fuente como primaria o secundaria.",
       categorias:["Primaria","Secundaria"],
       items:[
         {texto:"Un artículo original publicado en una revista científica.", cat:0},
         {texto:"Un libro de texto de biología de secundaria.", cat:1},
         {texto:"Datos brutos de un experimento.", cat:0},
         {texto:"Una enciclopedia general.", cat:1},
         {texto:"Un informe técnico de laboratorio.", cat:0}
       ],
       retro:"La fuente primaria es el original; la secundaria lo interpreta o resume. En un trabajo científico se citan ambas, pero con distintos propósitos."}},

    {id:"c22", nombre:"Buscadores académicos",
     concepto:"Para buscar información científica fiable se usan buscadores especializados: Google Scholar, PubMed (medicina), Scielo (Latinoamérica), Redalyc, arXiv (física y matemáticas), Dialnet (España).",
     ejemplo:"Si busco un artículo sobre el efecto del ejercicio en el corazón, PubMed o Google Scholar serán más útiles que una búsqueda general en internet.",
     ejercicio:{tipo:"fill",
       consigna:"Indica para qué área es más útil cada buscador.",
       texto:"PubMed → ___ · arXiv → ___ · Scielo → ___",
       respuestas:[["medicina","biologia","ciencias de la salud","salud"],["fisica","matematicas","física","matemáticas","fisica y matematicas"],["america latina","latinoamerica","ciencias sociales y naturales en america latina","revistas latinoamericanas","latinoamerica"]],
       retro:"Cada buscador académico se especializa en un área. Usar el adecuado ahorra tiempo y mejora la calidad de las fuentes."}},

    {id:"c23", nombre:"Palabras clave y operadores booleanos",
     concepto:"Las palabras clave condensan el tema. Los operadores booleanos (AND, OR, NOT) permiten combinar términos: AND restringe, OR amplía, NOT excluye. Las comillas «» buscan la frase exacta.",
     ejemplo:"«fotosíntesis AND luz» encuentra artículos que traten ambos temas. «fotosíntesis OR clorofila» busca cualquiera de los dos. «fotosíntesis NOT artificial» excluye los que hablen del tema artificial.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué hace el operador AND en una búsqueda?",
       opciones:["Amplía los resultados","Restringe los resultados a los que contengan ambos términos","Excluye términos","Busca la frase exacta"],
       correcta:1,
       retro:"AND exige que aparezcan los dos términos. OR amplía; NOT excluye. Dominar estos operadores mejora radicalmente las búsquedas."}},

    {id:"c24", nombre:"Criterios CRAAP de evaluación de fuentes",
     concepto:"CRAAP es un acrónimo en inglés para evaluar fuentes: Currency (actualidad), Relevance (relevancia), Authority (autoridad), Accuracy (exactitud), Purpose (propósito).",
     ejemplo:"Una fuente actual, relevante, firmada por un especialista, con datos verificables y sin intención comercial supera el test CRAAP. Una web anónima y desactualizada no.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pregunta según el criterio CRAAP al que pertenece.",
       categorias:["Currency (actualidad)","Authority (autoría)","Purpose (propósito)"],
       items:[
         {texto:"¿Cuándo se publicó o actualizó esta página?", cat:0},
         {texto:"¿Quién es el autor y qué formación tiene?", cat:1},
         {texto:"¿La web busca informar, vender o persuadir?", cat:2},
         {texto:"¿La fecha de la fuente es reciente?", cat:0},
         {texto:"¿Está respaldada por una institución académica?", cat:1}
       ],
       retro:"CRAAP ofrece una lista de comprobación. Aplicarla evita usar fuentes poco fiables y detectar sesgos comerciales o ideológicos."}},

    {id:"c25", nombre:"Lectura de un artículo científico",
     concepto:"Un artículo científico se lee en tres pasadas: 1) título, resumen y palabras clave; 2) introducción y conclusiones; 3) método, resultados y discusión con detalle. Así se ahorra tiempo.",
     ejemplo:"Si en la primera pasada el artículo no responde a mi pregunta, no necesito leerlo entero. Si responde, profundizo en el método y los datos.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las tres pasadas de lectura de un artículo científico.",
       items:[
         "Leer el título, el resumen y las palabras clave.",
         "Leer la introducción y las conclusiones.",
         "Leer con detalle el método, los resultados y la discusión.",
         "Anotar datos clave y referencias relevantes.",
         "Decidir si el artículo merece una lectura completa o parcial."
       ],
       retro:"La lectura en tres pasadas evita perder tiempo en artículos que no son útiles para el trabajo propio."}},

    {id:"c26", nombre:"Abstract y palabras clave",
     concepto:"El abstract es el resumen del artículo: qué se estudió, cómo, qué se encontró y qué conclusión se obtuvo. Las palabras clave (keywords) son los términos que resumen el contenido para su indexación.",
     ejemplo:"Abstract típico: «Se estudió el efecto de la temperatura (10, 20 y 30 °C) sobre la germinación de semillas de frijol. Se midió el porcentaje y el tiempo de germinación. Los resultados muestran mayor germinación a 20 °C. Se concluye que 20 °C es la temperatura óptima para esta especie.»",
     ejercicio:{tipo:"fill",
       consigna:"Identifica las partes del abstract.",
       texto:"«Se estudió el efecto de X» = ___ · «Se midió Y» = ___ · «Los resultados muestran Z» = ___ · «Se concluye que…» = ___",
       respuestas:[["objetivo","el objetivo"],["metodo","método"],["resultados"],["conclusion","conclusión"]],
       retro:"Los abstracts siguen una estructura previsible: objetivo, método, resultados y conclusión. Reconocerla acelera la lectura."}},

    {id:"c27", nombre:"Gestores bibliográficos",
     concepto:"Los gestores bibliográficos (Zotero, Mendeley, EndNote) almacenan, organizan y citan fuentes automáticamente. Ahorran tiempo y evitan errores en el formato de las referencias.",
     ejemplo:"Con Zotero instalado en el navegador, un clic guarda el artículo con sus metadatos. Al escribir, se inserta la cita en formato APA, Vancouver, etc., sin escribirla a mano.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Para qué sirve un gestor bibliográfico?",
       opciones:["Para escribir artículos automáticamente","Para almacenar, organizar y citar fuentes de forma automática","Para traducir artículos al español","Para publicar en revistas"],
       correcta:1,
       retro:"Un gestor bibliográfico guarda las fuentes y produce citas y referencias en el formato elegido. Es una herramienta imprescindible en trabajos con muchas fuentes."}},

    {id:"c28", nombre:"Fichas de lectura científica",
     concepto:"Una ficha de lectura científica registra: referencia completa, tipo de estudio, objetivo, método, resultados principales, conclusiones y utilidad para el trabajo propio. Es una herramienta clave para organizar el material.",
     ejemplo:"Ficha: Autor (año). Título. Revista. Tipo: estudio experimental. Objetivo: medir X. Método: 3 grupos, 10 réplicas. Resultados: mayor efecto a 20 °C. Utilidad: apoya mi hipótesis sobre temperatura óptima.",
     ejercicio:{tipo:"open",
       consigna:"Redacta una ficha de lectura breve para un estudio hipotético sobre el efecto de la contaminación lumínica en aves migratorias.",
       criterios:[
         "Incluí la referencia y el tipo de estudio.",
         "Resumí objetivo, método y resultados.",
         "Expliqué la utilidad para un trabajo propio."
       ],
       modelo:"Referencia: García, M. (2022). Contaminación lumínica y migración de aves. Revista de Ecología Urbana, 12(3), 45-58. Tipo: estudio de campo. Objetivo: evaluar si la luz artificial altera las rutas migratorias nocturnas. Método: seguimiento con GPS de 40 aves en dos zonas (urbana y rural). Resultados: las aves urbanas desviaron su ruta un 20 % más. Utilidad: sostiene la idea de que la contaminación lumínica tiene efectos concretos sobre la fauna, útil para mi trabajo sobre impacto humano en ecosistemas."}},

    {id:"c29", nombre:"Revisión sistemática vs revisión narrativa",
     concepto:"Una revisión narrativa resume lo que se sabe sobre un tema de forma libre. Una revisión sistemática sigue un protocolo estricto: criterios de inclusión, búsqueda documentada, selección y síntesis. Es más rigurosa y reproducible.",
     ejemplo:"Revisión narrativa: «En general, los estudios indican que…». Revisión sistemática: «Se buscaron artículos en PubMed entre 2010 y 2023 con los términos X e Y. Se incluyeron 32 estudios según los criterios Z. Los resultados se sintetizaron en una tabla.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada característica según corresponda a una revisión sistemática o narrativa.",
       categorias:["Revisión sistemática","Revisión narrativa"],
       items:[
         {texto:"Protocolo definido antes de empezar.", cat:0},
         {texto:"Selección libre según el criterio del autor.", cat:1},
         {texto:"Criterios de inclusión y exclusión explícitos.", cat:0},
         {texto:"Búsqueda documentada y reproducible.", cat:0},
         {texto:"Síntesis personal sin método estricto.", cat:1}
       ],
       retro:"La revisión sistemática es una investigación en sí misma: sigue un método tan riguroso como un experimento. La narrativa es más libre y personal."}},

    {id:"c30", nombre:"Plagio y autoplagio",
     concepto:"El plagio es presentar como propio el trabajo de otro. El autoplagio es reutilizar textos propios ya publicados sin indicarlo. Ambos son faltas graves de integridad científica y se evitan citando siempre las fuentes.",
     ejemplo:"Copiar un párrafo de un artículo sin comillas ni cita es plagio, aunque se cambien algunas palabras. Reutilizar un trabajo propio ya entregado en otro curso puede ser autoplagio si no se declara.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. Citar y parafrasear con referencia son prácticas correctas."}}
  ]
},

/* ============ BLOQUE 4 · ESTRUCTURA IMRyD ============ */
{
  id:"b4", nombre:"Estructura del texto científico (IMRyD)", emoji:"🏗️",
  desc:"Título, resumen, introducción, método, resultados, discusión, conclusiones y anexos.",
  tecnicas:[
    {id:"c31", nombre:"Título científico",
     concepto:"El título debe ser claro, específico y reflejar el contenido del estudio. Suele incluir la variable estudiada, el objeto y en ocasiones el método. Evita títulos vagos o llamativos.",
     ejemplo:"Mal título: «Un estudio interesante sobre plantas». Buen título: «Efecto de la temperatura sobre la germinación de semillas de Phaseolus vulgaris en condiciones de laboratorio».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es el mejor título para un estudio sobre el efecto del pH en la actividad de la catalasa?",
       opciones:["«La catalasa es una enzima muy interesante»","«Efecto del pH sobre la actividad de la catalasa de la papa (Solanum tuberosum) in vitro»","«Experimento sobre enzimas»","«¿Qué le pasa a la catalasa cuando cambia el pH?»"],
       correcta:1,
       retro:"El título científico indica qué se estudió, en qué organismo y en qué condiciones. Debe ser específico y no contener preguntas retóricas ni valoraciones."}},

    {id:"c32", nombre:"Resumen / Abstract",
     concepto:"El resumen es una síntesis del estudio en 150-250 palabras: objetivo, método, resultados y conclusión. Es lo primero que se lee y lo que decide si se sigue leyendo.",
     ejemplo:"«Este estudio tuvo como objetivo evaluar el efecto del pH (3, 5, 7, 9) en la actividad de la catalasa extraída de papa. Se midió la producción de O₂ durante 5 min. Los resultados muestran máxima actividad a pH 7. Se concluye que la catalasa tiene un pH óptimo cercano a la neutralidad.»",
     ejercicio:{tipo:"fill",
       consigna:"Identifica la parte del resumen que falta.",
       texto:"«Este estudio tuvo como objetivo… » = ___ · «Se midió… durante…» = ___ · «Los resultados muestran…» = ___ · «Se concluye que…» = ___",
       respuestas:[["objetivo","el objetivo"],["metodo","método"],["resultados"],["conclusion","conclusión"]],
       retro:"Todo resumen científico tiene las mismas cuatro partes: objetivo, método, resultados y conclusión. Aprender a escribirlas es esencial."}},

    {id:"c33", nombre:"Introducción: el embudo",
     concepto:"La introducción va de lo general a lo específico: presenta el tema, señala el problema, resume lo que se sabe y termina con el objetivo o la pregunta de investigación. Es un embudo informativo.",
     ejemplo:"1) General: la fotosíntesis es el proceso que sostiene la vida. 2) Problema: su eficiencia depende de factores ambientales. 3) Estado de la cuestión: estudios previos muestran que la luz es clave. 4) Objetivo: este trabajo estudia cómo la intensidad luminosa afecta la tasa de fotosíntesis en Elodea.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la introducción.",
       items:[
         "Presentación general del tema y su importancia.",
         "Planteamiento del problema o vacío de conocimiento.",
         "Revisión breve de lo que ya se sabe sobre el tema.",
         "Formulación del objetivo o pregunta de investigación."
       ],
       retro:"La introducción funciona como un embudo: empieza amplio y termina en el objetivo concreto. Cada párrafo acerca al lector al estudio específico."}},

    {id:"c34", nombre:"Materiales y métodos",
     concepto:"Esta sección describe qué se usó y cómo se hizo, con el detalle necesario para que otra persona pueda repetir el experimento. Se escribe en pasado, de forma impersonal y ordenada.",
     ejemplo:"«Se utilizaron 30 semillas de frijol (Phaseolus vulgaris), tres placas Petri, papel filtro y agua destilada. Se dividieron las semillas en tres grupos de 10. Cada grupo se mantuvo a 10, 20 y 30 °C respectivamente. Se registró la germinación cada 12 h durante 10 días.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el tiempo verbal adecuado (pasado).",
       texto:"«Se ___ (utilizar) 30 semillas de frijol. Se ___ (dividir) en tres grupos. Se ___ (mantener) cada grupo a distinta temperatura.»",
       respuestas:[["utilizaron","utilizo","utilizó"],["dividieron","dividio","dividió"],["mantuvo","mantuvieron","mantuvo cada"]],
       retro:"En materiales y métodos se usa pasado impersonal (pasiva refleja con «se» o primera persona del plural). El objetivo es que el experimento sea reproducible."}},

    {id:"c35", nombre:"Resultados",
     concepto:"Los resultados presentan los datos obtenidos, sin interpretarlos. Se apoyan en tablas, gráficos y descripciones objetivas. La interpretación se reserva para la discusión.",
     ejemplo:"«En el grupo a 20 °C germinaron 9 de 10 semillas (90 %), mientras que a 10 °C lo hicieron 4 de 10 (40 %) y a 30 °C, 5 de 10 (50 %). La germinación comenzó antes en el grupo de 20 °C (día 3 frente al día 5 y 6).»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué NO debe aparecer en la sección de resultados?",
       opciones:["Cifras y porcentajes","Tablas y gráficos","Frases como «esto demuestra que la temperatura óptima es 20 °C»","Descripción objetiva de lo observado"],
       correcta:2,
       retro:"Los resultados solo presentan datos. La interpretación y las conclusiones van en la discusión. Mezclarlos debilita el informe."}},

    {id:"c36", nombre:"Discusión",
     concepto:"En la discusión se interpretan los resultados: qué significan, cómo se relacionan con la hipótesis y con estudios previos, qué limitaciones tiene el trabajo y qué nuevas preguntas abre.",
     ejemplo:"«Los resultados confirman la hipótesis: la temperatura óptima es cercana a 20 °C. Estos valores coinciden con los reportados por López (2020). Sin embargo, el estudio se realizó en laboratorio, por lo que los resultados podrían variar en condiciones de campo.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado según pertenezca a resultados o discusión.",
       categorias:["Resultados","Discusión"],
       items:[
         {texto:"«Germinaron 9 de 10 semillas a 20 °C.»", cat:0},
         {texto:"«Esto confirma la hipótesis planteada.»", cat:1},
         {texto:"«La germinación comenzó el día 3.»", cat:0},
         {texto:"«Estos datos coinciden con los de estudios previos.»", cat:1},
         {texto:"«Una limitación es que se trabajó solo en laboratorio.»", cat:1}
       ],
       retro:"Resultados = datos. Discusión = interpretación, comparación con la literatura y limitaciones."}},

    {id:"c37", nombre:"Conclusiones",
     concepto:"Las conclusiones responden a la pregunta de investigación y sintetizan lo aprendido. Deben ser breves, claras, basadas en los datos y no introducir información nueva.",
     ejemplo:"«Se concluye que la temperatura óptima para la germinación de Phaseolus vulgaris en condiciones de laboratorio es cercana a 20 °C. Se recomienda repetir el estudio variando la humedad para evaluar su interacción con la temperatura.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas frases es una conclusión científica adecuada?",
       opciones:["«Creo que las plantas prefieren el calor.»","«Los resultados demuestran que la temperatura de 20 °C produjo el mayor porcentaje de germinación en las condiciones estudiadas.»","«Todos los agricultores deberían usar 20 °C siempre.»","«Fue una práctica muy interesante.»"],
       correcta:1,
       retro:"Una conclusión se apoya en los datos y se limita al alcance del estudio. No generaliza más allá de lo medido ni incluye valoraciones personales."}},

    {id:"c38", nombre:"Agradecimientos y financiación",
     concepto:"En agradecimientos se reconoce la ayuda de personas o instituciones que colaboraron sin ser autores. La financiación declara las fuentes de apoyo económico. Es una sección breve pero obligatoria.",
     ejemplo:"«Agradecimientos: al laboratorio de biología del centro por facilitar los materiales y a la profesora Ana Ruiz por su orientación. Financiación: este trabajo no recibió financiación externa.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Dónde se declara quién financió la investigación?",
       opciones:["En la introducción","En la sección de agradecimientos o en un apartado específico","En la discusión","No se declara"],
       correcta:1,
       retro:"Declarar la financiación es una exigencia ética. Permite al lector evaluar posibles conflictos de interés."}},

    {id:"c39", nombre:"Referencias bibliográficas",
     concepto:"La lista de referencias recoge todas las fuentes citadas en el texto, en el formato exigido por la revista o institución (APA, Vancouver, IEEE…). Debe ser completa, ordenada y coherente.",
     ejemplo:"APA: García, M. (2020). Efecto de la temperatura en la germinación. Revista de Botánica, 15(2), 45-58. https://doi.org/xx.xxxx/xxxx",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia APA de artículo.",
       items:[
         "Apellido del autor, inicial.",
         "(Año de publicación).",
         "Título del artículo.",
         "Nombre de la revista, volumen(número), páginas.",
         "DOI o URL"
       ],
       retro:"Las referencias en APA siguen un orden fijo. Cualquier alteración dificulta la localización de la fuente."}},

    {id:"c40", nombre:"Anexos y material suplementario",
     concepto:"Los anexos incluyen material complementario que no cabe en el cuerpo: tablas largas, cuestionarios, fotografías, cálculos detallados. Se referencian en el texto pero no interrumpen la lectura.",
     ejemplo:"«Los datos completos de las 30 semillas se incluyen en el Anexo 1. El protocolo detallado de laboratorio está en el Anexo 2.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se incluye material en un anexo?",
       opciones:["Cuando es importante pero interrumpiría la lectura del cuerpo principal","Cuando no tiene relación con el trabajo","Cuando el autor no quiere escribirlo","Siempre, aunque el trabajo sea breve"],
       correcta:0,
       retro:"El anexo es material complementario que apoya el trabajo pero no es esencial para seguir el argumento. Se cita desde el texto principal."}}
  ]
},

/* ============ BLOQUE 5 · LENGUAJE CIENTÍFICO ============ */
{
  id:"b5", nombre:"Lenguaje científico", emoji:"✒️",
  desc:"Impersonalidad, precisión, tecnicismos, conectores, tiempo verbal y estilo.",
  tecnicas:[
    {id:"c41", nombre:"Impersonalidad y pasiva refleja",
     concepto:"El discurso científico prefiere la impersonalidad: se evita el «yo» y se usa la pasiva refleja con «se» («se midió», «se observó») o la primera persona del plural. Así el foco queda en el proceso, no en quien lo hizo.",
     ejemplo:"En vez de «yo medí la temperatura», se escribe «se midió la temperatura» o «medimos la temperatura». El resultado es más objetivo.",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a estilo impersonal.",
       texto:"«Yo observé el crecimiento de las plantas» → «Se ___ el crecimiento de las plantas» · «Nosotros analizamos los datos» → «Se ___ los datos»",
       respuestas:[["observo","observó"],["analizaron","analizo","analizó"]],
       retro:"La pasiva refleja con «se» es el recurso más frecuente en el español científico. Permite mantener el foco en el proceso."}},

    {id:"c42", nombre:"Tiempo verbal en ciencias",
     concepto:"En ciencia se usan distintos tiempos según la sección: presente para hechos generales y conclusiones; pasado para lo que se hizo en el estudio; presente para lo que otros autores afirman.",
     ejemplo:"Introducción: «La fotosíntesis es un proceso…» (presente, hecho general). Método: «Se midió la temperatura…» (pasado, lo que se hizo). Resultados: «Los datos mostraron…» (pasado). Conclusión: «Se concluye que…» (presente, la conclusión sigue vigente).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la sección y el tiempo verbal.",
       categorias:["Introducción · presente","Método · pasado","Conclusión · presente"],
       items:[
         {texto:"«La célula es la unidad básica de la vida.»", cat:0},
         {texto:"«Se midió la masa de la muestra con una balanza digital.»", cat:1},
         {texto:"«Los resultados confirman la hipótesis planteada.»", cat:2},
         {texto:"«El ADN contiene la información genética.»", cat:0},
         {texto:"«Se prepararon tres disoluciones de distinta concentración.»", cat:1}
       ],
       retro:"Cada sección tiene su tiempo verbal típico. Confundirlos rompe la coherencia del texto científico."}},

    {id:"c43", nombre:"Tecnicismos y terminología",
     concepto:"La ciencia usa una terminología precisa y estable. Los tecnicismos deben definirse la primera vez que aparecen y usarse siempre con el mismo significado. Evitar sinónimos innecesarios.",
     ejemplo:"Al hablar de «ADN» no se alterna con «material genético», «molécula hereditaria» y «ácido desoxirribonucleico» en el mismo texto sin aclararlo. Se elige un término y se mantiene.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué hacer la primera vez que aparece un tecnicismo en un texto científico?",
       opciones:["Omitirlo para no confundir","Definirlo brevemente y usarlo con coherencia después","Cambiarlo por sinónimos cada vez","Ponerlo solo en el título"],
       correcta:1,
       retro:"La primera aparición de un tecnicismo se define. Después se mantiene el mismo término. Cambiar de sinónimo confunde al lector."}},

    {id:"c44", nombre:"Conectores lógicos científicos",
     concepto:"Los conectores lógicos articulan el razonamiento científico: causa (porque, debido a, ya que), consecuencia (por lo tanto, en consecuencia, así pues), contraste (sin embargo, no obstante), adición (además, asimismo) y orden (en primer lugar, seguidamente).",
     ejemplo:"«La temperatura aumentó; en consecuencia, la velocidad de reacción se incrementó. Sin embargo, por encima de 40 °C la actividad enzimática disminuyó, debido a la desnaturalización de la proteína.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función lógica.",
       categorias:["Causa","Consecuencia","Contraste","Adición"],
       items:[
         {texto:"debido a", cat:0},
         {texto:"por lo tanto", cat:1},
         {texto:"sin embargo", cat:2},
         {texto:"además", cat:3},
         {texto:"ya que", cat:0},
         {texto:"en consecuencia", cat:1},
         {texto:"no obstante", cat:2}
       ],
       retro:"Los conectores revelan la relación entre ideas. En ciencia son imprescindibles para que el razonamiento sea explícito y verificable."}},

    {id:"c45", nombre:"Precisión y ambigüedad",
     concepto:"El lenguaje científico debe ser inequívoco. Palabras vagas como «mucho», «poco», «bastante» se sustituyen por cantidades concretas. Un texto ambiguo no es replicable.",
     ejemplo:"En lugar de «se añadió bastante agua», se escribe «se añadieron 50 mL de agua destilada». En lugar de «creció mucho», «la planta alcanzó 12,3 cm en 10 días».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye por una expresión precisa.",
       texto:"«Se añadió bastante sal» → «Se añadieron ___ g de sal» · «La temperatura era alta» → «La temperatura fue de ___ °C» · «Creció mucho» → «Creció ___ cm»",
       respuestas:[["5","10","2","1","cantidad concreta"],["40","50","60","80","100","35","cantidad concreta"],["12","10","15","20","cantidad concreta"]],
       retro:"En ciencia, lo que no se mide no existe. Las expresiones vagas impiden replicar el experimento y comparar resultados."}},

    {id:"c46", nombre:"Nominalización",
     concepto:"La nominalización convierte verbos y adjetivos en sustantivos: «reaccionar» → «la reacción», «medir» → «la medición», «observar» → «la observación». Da densidad y formalidad al texto, pero abusar de ella lo hace pesado.",
     ejemplo:"«Se midió la temperatura y se observó la reacción» → «La medición de la temperatura permitió la observación de la reacción». Más formal, pero también más denso.",
     ejercicio:{tipo:"fill",
       consigna:"Nominaliza los verbos.",
       texto:"«medir» → la ___ · «observar» → la ___ · «analizar» → el ___ · «evaporar» → la ___",
       respuestas:[["medicion","medición"],["observacion","observación"],["analisis","análisis"],["evaporacion","evaporación"]],
       retro:"La nominalización es típica del lenguaje académico. Ayuda a condensar, pero si se abusa el texto se vuelve árido."}},

    {id:"c47", nombre:"Cuantificadores y comparaciones",
     concepto:"Los cuantificadores científicos deben ser exactos: «el doble», «un 15 % más», «la mitad». Las comparaciones deben indicar respecto a qué se comparan: «mayor que el grupo control», «menor que en condiciones normales».",
     ejemplo:"En lugar de «creció más», «la altura media fue un 30 % mayor que la del grupo control». En lugar de «es más rápido», «la reacción ocurrió en la mitad de tiempo».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas frases es más precisa científicamente?",
       opciones:["«La planta creció mucho más.»","«La planta creció bastante.»","«La altura media aumentó un 30 % respecto al grupo control.»","«La planta creció más rápido.»"],
       correcta:2,
       retro:"El cuantificador indica magnitud; la comparación indica respecto a qué. Ambas cosas son necesarias para que la afirmación sea verificable."}},

    {id:"c48", nombre:"Evitar juicios de valor",
     concepto:"El texto científico describe hechos, no los valora. Se evitan adjetivos como «bueno», «malo», «interesante», «impresionante». Se prefieren descripciones objetivas y medibles.",
     ejemplo:"En vez de «el resultado fue sorprendente», «el resultado difiere un 40 % del valor esperado». En vez de «la práctica salió mal», «no se obtuvo el producto esperado en el tiempo previsto».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como objetiva o valorativa.",
       categorias:["Objetiva","Valorativa"],
       items:[
         {texto:"«El pH final fue de 7,2.»", cat:0},
         {texto:"«El experimento fue un desastre.»", cat:1},
         {texto:"«Se observó un incremento del 25 % en la masa.»", cat:0},
         {texto:"«Los resultados fueron muy interesantes.»", cat:1},
         {texto:"«La muestra presentó una coloración amarillenta.»", cat:0}
       ],
       retro:"La ciencia describe sin juzgar. Los juicios de valor se reservan para otros géneros, como la divulgación o el ensayo."}},

    {id:"c49", nombre:"Abreviaturas y siglas",
     concepto:"Las abreviaturas y siglas se definen la primera vez que aparecen: «ácido desoxirribonucleico (ADN)». Después se usa solo la sigla. Es importante mantener la coherencia.",
     ejemplo:"«El ácido desoxirribonucleico (ADN) contiene la información genética. El ADN se encuentra en el núcleo celular.»",
     ejercicio:{tipo:"fill",
       consigna:"Define la sigla antes de usarla.",
       texto:"«El ___ (ADN) contiene la información genética» · «La unidad de masa atómica (___) se usa en química» · «El potencial de hidrógeno (___) mide la acidez»",
       respuestas:[["acido desoxirribonucleico","ácido desoxirribonucleico"],["uma","u"],["ph"]],
       retro:"Siempre se define la sigla la primera vez. Después basta con la abreviatura. Así el lector no se pierde."}},

    {id:"c50", nombre:"Estilo conciso y claro",
     concepto:"El texto científico gana con la concisión: frases cortas, sin rodeos, sin adjetivos innecesarios. La claridad facilita la comprensión y reduce la ambigüedad.",
     ejemplo:"En vez de «En el presente trabajo de investigación, lo que se pretende es llevar a cabo un análisis de los datos obtenidos con el fin de determinar si existe o no una relación entre ambas variables», «Este trabajo analiza la relación entre ambas variables».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe de forma concisa.",
       texto:"«Con el objetivo de poder llevar a cabo la determinación de la masa de la muestra, se procedió a la utilización de una balanza de precisión» → «Se determinó la masa de la muestra con una ___ de precisión»",
       respuestas:[["balanza","balanza digital","balanza de precision","balanza de precisión"]],
       retro:"La concisión no es empobrecer: es decir lo mismo con menos palabras. En ciencia, la claridad es una forma de respeto al lector."}}
  ]
},

/* ============ BLOQUE 6 · DATOS, TABLAS Y FIGURAS ============ */
{
  id:"b6", nombre:"Datos, tablas y figuras", emoji:"📊",
  desc:"Representar datos: tablas, gráficos, ejes, leyendas, cifras significativas e incertidumbre.",
  tecnicas:[
    {id:"c51", nombre:"Tablas científicas",
     concepto:"Una tabla organiza datos en filas y columnas. Debe tener número y título, encabezados con unidad, y datos alineados. La información debe entenderse sin leer el texto.",
     ejemplo:"Tabla 1. Porcentaje de germinación según la temperatura. Columnas: Temperatura (°C), Semillas germinadas (n/10), Porcentaje (%).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué NO debe faltar en una tabla científica?",
       opciones:["Un título y unidades en los encabezados","Colores llamativos","Fotos decorativas","Comentarios personales"],
       correcta:0,
       retro:"Una tabla debe ser autosuficiente: número, título, encabezados con unidades y datos ordenados. Sin unidades, los números no significan nada."}},

    {id:"c52", nombre:"Gráficos de barras",
     concepto:"El gráfico de barras compara valores entre categorías discretas (grupos, especies, temperaturas fijas). Las barras pueden ser verticales u horizontales, y su longitud es proporcional al valor.",
     ejemplo:"Comparar el porcentaje de germinación a 10 °C, 20 °C y 30 °C: tres barras, una por temperatura. La altura refleja el porcentaje.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo conviene un gráfico de barras?",
       opciones:["Para mostrar una tendencia a lo largo del tiempo","Para comparar valores entre categorías discretas","Para mostrar la relación entre dos variables continuas","Para representar un esquema de un proceso"],
       correcta:1,
       retro:"Barras: comparación entre categorías. Líneas: evolución temporal. Dispersión: relación entre dos variables. Cada gráfico tiene su uso."}},

    {id:"c53", nombre:"Gráficos de líneas",
     concepto:"El gráfico de líneas muestra cómo cambia una variable continua a lo largo del tiempo o de otra variable continua. Es ideal para tendencias: crecimiento, temperatura, velocidad de reacción.",
     ejemplo:"La evolución de la altura de una planta cada 3 días durante 15 días se representa con una línea que muestra la tendencia de crecimiento.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la descripción del gráfico.",
       texto:"En el gráfico de líneas, el eje X representa el ___ y el eje Y representa la ___ medida.",
       respuestas:[["tiempo","los dias","dias","período","periodo"],["altura","variable","magnitud","valor"]],
       retro:"En un gráfico de líneas, el eje X suele ser el tiempo y el eje Y, la variable medida. Cada eje debe llevar etiqueta y unidad."}},

    {id:"c54", nombre:"Diagramas de dispersión",
     concepto:"El diagrama de dispersión representa la relación entre dos variables continuas. Cada punto es un par de valores (x, y). Sirve para detectar correlación, tendencias o valores atípicos.",
     ejemplo:"Relacionar la temperatura (x) con la velocidad de reacción (y) en 10 ensayos: cada punto representa un ensayo. Si los puntos siguen una línea, hay correlación.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Para qué sirve un diagrama de dispersión?",
       opciones:["Para comparar categorías","Para mostrar la relación entre dos variables continuas","Para representar un proceso paso a paso","Para mostrar proporciones de un total"],
       correcta:1,
       retro:"El diagrama de dispersión revela si dos variables están relacionadas. Es la base de la correlación y la regresión."}},

    {id:"c55", nombre:"Leyendas y títulos de figuras",
     concepto:"Cada figura lleva un número, un título y, cuando es necesario, una leyenda que explique símbolos, colores o líneas. El título se coloca debajo de la figura; el de las tablas, encima.",
     ejemplo:"«Figura 1. Evolución de la altura media de las plantas según las horas de luz diaria (● 6 h; ■ 12 h; ▲ 18 h). Cada punto es la media de 10 plantas.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Dónde se coloca normalmente el título de una figura?",
       opciones:["Encima de la figura","Debajo de la figura","Dentro de la figura","En un anexo"],
       correcta:1,
       retro:"Convención habitual: el título de las tablas va encima; el de las figuras, debajo. La leyenda explica los símbolos."}},

    {id:"c56", nombre:"Ejes, escalas y unidades",
     concepto:"Todo gráfico debe tener ejes etiquetados con la magnitud y la unidad. La escala debe ser clara y adecuada: no conviene exagerar diferencias cambiando el origen sin avisar.",
     ejemplo:"Eje X: «Temperatura (°C)»; eje Y: «Altura media (cm)». Escala de 0 a 30 en el eje Y. Empezar en 0 es lo habitual si los valores son positivos.",
     ejercicio:{tipo:"fill",
       consigna:"Completa las etiquetas de los ejes.",
       texto:"Eje X: «Tiempo (___)» · Eje Y: «Masa (___)» · Eje Y alternativo: «Volumen (___)»",
       respuestas:[["s","segundos","dias","días","min","minutos","horas","h"],["g","gramos","kg","kilogramos"],["ml","mL","l","L","cm3","cm³"]],
       retro:"Cada eje lleva etiqueta y unidad. Sin ellas, el gráfico no es interpretable."}},

    {id:"c57", nombre:"Cifras significativas",
     concepto:"Las cifras significativas indican la precisión de una medida. No se deben escribir más cifras de las que el instrumento puede dar. En el resultado final se redondea según la precisión de los datos.",
     ejemplo:"Si una balanza mide hasta centésimas, escribir «25,347 g» es falso: se escribe «25,35 g». Si una regla mide hasta milímetros, «7,23 cm» es correcto; «7,2345 cm» no.",
     ejercicio:{tipo:"quiz",
       consigna:"Si una balanza mide hasta las centésimas, ¿cómo se debe escribir un valor de 12,346 g?",
       opciones:["12,346 g","12,35 g","12,3 g","12 g"],
       correcta:1,
       retro:"Se redondea a la precisión del instrumento. Escribir más cifras de las que el instrumento puede medir es un error científico."}},

    {id:"c58", nombre:"Notación científica",
     concepto:"La notación científica escribe números muy grandes o muy pequeños como a × 10ⁿ, con 1 ≤ a < 10. Es esencial en ciencias: distancias astronómicas, tamaños moleculares, concentraciones.",
     ejemplo:"La distancia Tierra-Sol: 150 000 000 km = 1,5 × 10⁸ km. El diámetro de un átomo: 0,0000000001 m = 1 × 10⁻¹⁰ m.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe en notación científica.",
       texto:"250 000 = ___ × 10^___ · 0,00045 = ___ × 10^___",
       respuestas:[["2,5","2.5"],["5"],["4,5","4.5"],["-4","−4"]],
       retro:"La notación científica simplifica la escritura y facilita las operaciones con números muy grandes o muy pequeños."}},

    {id:"c59", nombre:"Promedios y dispersión",
     concepto:"En ciencia se reportan la media y una medida de dispersión (desviación estándar, rango o error estándar). La media sin dispersión oculta la variabilidad de los datos.",
     ejemplo:"«La altura media fue 12,3 cm ± 1,2 cm (media ± DE, n = 10).» Ese ±1,2 cm indica cuánto varían los datos alrededor de la media.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué es importante reportar la dispersión junto a la media?",
       opciones:["Para que el informe sea más largo","Porque indica cuánto varían los datos respecto a la media","Porque lo exige la revista","Para impresionar al lector"],
       correcta:1,
       retro:"Dos experimentos pueden tener la misma media y dispersiones muy distintas. Sin la dispersión, la media es incompleta y puede engañar."}},

    {id:"c60", nombre:"Representación de la incertidumbre",
     concepto:"En gráficos, la incertidumbre se representa con barras de error. Su longitud refleja la variabilidad o el error de la medida. Son imprescindibles en resultados cuantitativos.",
     ejemplo:"En un gráfico de barras con barras de error, si dos grupos tienen medias distintas pero las barras se solapan, la diferencia puede no ser significativa.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué representan las barras de error en un gráfico?",
       opciones:["La media de los datos","La variabilidad o el error de la medida","El número de datos","El rango de la escala"],
       correcta:1,
       retro:"Las barras de error muestran la incertidumbre de cada punto. Sin ellas, el gráfico sugiere una precisión que quizá no existe."}}
  ]
},

/* ============ BLOQUE 7 · CITAS Y REFERENCIAS ============ */
{
  id:"b7", nombre:"Citas y referencias (APA)", emoji:"🔖",
  desc:"Citas directas, paráfrasis, referencias de libros, artículos y webs, DOI y gestores.",
  tecnicas:[
    {id:"c61", nombre:"Cita directa corta",
     concepto:"Una cita textual de menos de 40 palabras se incluye entre comillas dentro del párrafo, con autor, año y número de página: (Autor, año, p. X).",
     ejemplo:"«La fotosíntesis convierte la energía lumínica en energía química» (García, 2020, p. 45).",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita directa corta según APA.",
       texto:"«El ADN contiene la información genética» (Watson y Crick, ___, p. ___) — si el artículo es de 1953 y la cita está en la página 737.",
       respuestas:[["1953"],["737"]],
       retro:"La cita directa corta lleva comillas y, al final, autor, año y página. Sin página, la cita textual está incompleta."}},

    {id:"c62", nombre:"Cita directa larga",
     concepto:"Una cita textual de más de 40 palabras se escribe en bloque sangrado, sin comillas, con autor, año y página al final. Se usa para fragmentos extensos que merecen reproducirse literalmente.",
     ejemplo:"En un párrafo aparte, sangrado a la izquierda, se escribe: «El método científico es un proceso sistemático que permite… (texto completo)… » (García, 2020, p. 47).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se escribe una cita directa de más de 40 palabras en APA?",
       opciones:["Entre comillas dentro del texto","En bloque sangrado, sin comillas, con autor, año y página","Sin indicar la fuente","En cursiva y sin autor"],
       correcta:1,
       retro:"Las citas largas se sangran en bloque y se omiten las comillas. Siempre se indica autor, año y página."}},

    {id:"c63", nombre:"Paráfrasis",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, manteniendo el significado. Siempre se cita la fuente: (Autor, año). No es copiar cambiando algunas palabras.",
     ejemplo:"Original: «La temperatura óptima para la germinación del frijol ronda los 20 °C.» Paráfrasis: «Diversos estudios indican que la germinación del frijol alcanza su máximo en torno a los 20 °C (García, 2020).»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis con la cita.",
       texto:"«Según diversos autores, la temperatura de 20 °C favorece la germinación del frijol (___, ___)»",
