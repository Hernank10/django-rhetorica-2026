<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Radial Comunitaria · 100 técnicas + Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0; --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);border-bottom:3px double var(--navy);box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .seal{width:50px;height:50px;flex:0 0 auto;border-radius:50%;padding:3px;border:1.5px dashed var(--bronze);display:grid;place-items:center;}
  .seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:16px;position:relative;}
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:6px;color:var(--bronze);}
  .seal-inner::before{top:5px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:5px;left:50%;transform:translateX(-50%);}
  .brand h1{font-family:"PT Serif",Georgia,serif;font-size:15px;margin:0;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

  .tabs{display:flex;gap:0;border:1px solid var(--navy);background:var(--paper);}
  .tab{
    font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;border:none;background:transparent;color:var(--navy);
    border-right:1px solid var(--navy);transition:.15s;font-family:"Public Sans",sans-serif;
  }
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--navy-soft);}
  .tab.active{background:var(--navy);color:var(--paper);}

  .progress-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .progress-bar{width:130px;height:6px;border:1px solid var(--line-2);background:#f0ece0;overflow:hidden;}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}

  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .stat strong{font-family:"PT Serif",Georgia,serif;font-size:15px;color:var(--navy);font-weight:700;padding:0 5px;}

  .btn{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--paper);color:var(--navy);transition:.16s;font-family:"Public Sans",sans-serif;}
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy);color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc;color:var(--navy);}
  .btn.danger{border-color:var(--bad);color:var(--bad);}
  .btn.danger:hover{background:var(--bad-soft);}
  .only-mobile{display:none;}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:22px;max-width:1400px;margin:0 auto;padding:22px;align-items:start;}
  .sidebar{position:sticky;top:100px;max-height:calc(100vh - 124px);overflow-y:auto;background:var(--paper);border:1px solid var(--navy);padding:4px;box-shadow:var(--shadow);}
  .sidebar-inner{border:1px solid var(--bronze-line);padding:12px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);}
  #search{width:100%;font-size:12px;padding:8px 11px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px;font-family:"Public Sans",sans-serif;}
  #search:focus{border-color:var(--navy);}
  .cat{margin-bottom:4px;}
  .cat-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;padding:9px 10px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--navy);text-transform:uppercase;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .cat-head:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto;font-size:9px;color:var(--bronze);transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{font-family:"PT Serif",Georgia,serif;font-size:10.5px;font-weight:700;background:var(--bronze-soft);color:var(--bronze-dark);padding:1px 7px;border:1px solid var(--bronze-line);}
  .cat-bar{height:3px;background:#e8e2d2;margin:0 10px 6px;overflow:hidden;border:1px solid var(--line);}
  .cat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .cat-body{display:none;padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:10.5px;color:var(--muted);padding:0 10px 8px;line-height:1.5;font-style:italic;}
  .tech-link{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:7px 10px;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .tech-link:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-link .dot{flex:0 0 auto;width:13px;height:13px;margin-top:1px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-size:8px;color:transparent;}
  .tech-link.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* Taller sidebar */
  .sidebar-label{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--bronze-line);}
  .sidebar-section{margin-bottom:16px;}
  .side-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:8px 10px;border-left:3px solid transparent;transition:.15s;font-family:"Public Sans",sans-serif;}
  .side-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .side-item.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .side-item .icon{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;color:var(--navy);}
  .side-item.active .icon{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .side-item .label{flex:1;min-width:0;}
  .side-item .label small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px;}
  .empty-mini{font-size:11px;color:var(--muted);font-style:italic;padding:10px;text-align:center;border:1px dashed var(--line-2);background:var(--paper-2);}
  .draft-item{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-left:3px solid transparent;cursor:pointer;transition:.15s;font-size:11px;line-height:1.35;font-family:"Public Sans",sans-serif;border-bottom:1px solid var(--line);}
  .draft-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .draft-item.active{background:var(--navy-soft);border-left-color:var(--navy);}
  .draft-item .di-title{flex:1;min-width:0;color:#3a3a3a;font-weight:600;}
  .draft-item .di-title small{display:block;font-weight:400;font-size:10px;color:var(--muted);margin-top:2px;}
  .draft-item .di-del{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .draft-item .di-del:hover{color:var(--bad);}

  .panel{background:var(--paper);border:1px solid var(--navy);padding:6px;box-shadow:var(--shadow);}
  .panel-inner{border:1px solid var(--bronze-line);padding:26px 30px 30px;background:radial-gradient(circle at 100% 0%,#f7f2e8 0%,transparent 40%),var(--paper);position:relative;}
  .panel-seal{position:absolute;top:18px;right:22px;width:70px;height:70px;border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.75;}
  .panel-seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:10px;text-align:center;line-height:1.1;}
  .tech-head{margin-bottom:20px;padding-right:90px;}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);border:1px solid var(--bronze-line);padding:3px 10px;margin-bottom:12px;}
  .tech-head h2{margin:0;font-family:"PT Serif",Georgia,serif;font-size:25px;line-height:1.2;letter-spacing:-.3px;font-weight:700;color:var(--navy);}
  .tech-head p.lead{margin:8px 0 0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.6;color:var(--muted);}
  .tech-pos{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .rule{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:16px 0 20px;}
  .block-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .bdot{width:11px;height:11px;border:1px solid var(--line-2);background:var(--paper);cursor:pointer;transition:.15s;}
  .bdot:hover{transform:scale(1.2);border-color:var(--bronze);}
  .bdot.done{background:var(--ok);border-color:var(--ok);}
  .bdot.current{background:var(--bronze);border-color:var(--bronze-dark);}

  .flashcard{perspective:1600px;margin:0 0 14px;cursor:pointer;border:1px solid var(--navy);padding:4px;background:var(--paper);box-shadow:var(--shadow);}
  .fc-inner{position:relative;min-height:clamp(270px,35vh,330px);transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);border:1px solid var(--bronze-line);}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px 26px;display:flex;flex-direction:column;overflow:auto;background:var(--paper);background-image:linear-gradient(transparent 27px,rgba(20,33,61,.06) 27px 28px);background-size:100% 28px;background-position:0 14px;}
  .fc-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:15.5px;line-height:28px;color:var(--ink);}
  .fc-back{transform:rotateY(180deg);background:#faf6ec;}
  .fc-back p{color:var(--navy-dark);font-style:italic;}
  .fc-tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:12px;display:block;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);}
  .fc-hint{margin-top:auto;padding-top:14px;font-size:10.5px;color:#9c907c;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .flip-btn{margin:0 0 26px;}

  .sec-title{display:flex;align-items:center;gap:10px;font-family:"PT Serif",Georgia,serif;font-size:16px;font-weight:700;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title span{font-size:10px;font-weight:700;color:var(--muted);margin-left:auto;letter-spacing:.6px;text-transform:uppercase;}
  .consigna{font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper-2);border-left:3px solid var(--bronze);padding:12px 16px;margin:0 0 16px;}
  .opciones{display:flex;flex-direction:column;gap:8px;}
  .opcion{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:13.5px;line-height:1.5;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);padding:12px 14px;cursor:pointer;transition:.15s;font-family:"Public Sans",sans-serif;}
  .opcion:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft);}
  .opcion:disabled{cursor:default;opacity:.9;}
  .opcion .letra{flex:0 0 auto;width:22px;height:22px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line-2);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:12px;font-weight:700;}
  .opcion.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad);color:#fff;border-color:var(--bad);}

  .fill-texto{font-family:"PT Serif",Georgia,serif;font-size:16px;line-height:2.4;margin:0 0 16px;color:var(--ink);}
  .hueco{font:inherit;font-family:"PT Serif",Georgia,serif;font-size:15px;font-style:italic;border:none;border-bottom:1.5px solid var(--bronze);background:transparent;color:var(--bronze-dark);font-weight:700;padding:2px 6px;min-width:100px;text-align:center;outline:none;}
  .hueco:focus{background:var(--bronze-soft);border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);text-decoration:line-through;}

  .order-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .order-col h4{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .pool,.seq{min-height:120px;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .pool{background:var(--paper-2);border:1px dashed var(--line-2);}
  .seq{background:#f4efe2;border:1px solid var(--bronze-line);}
  .pool:empty::after,.seq:empty::after{content:"···";color:#c9c2b2;font-size:16px;text-align:center;margin:auto;letter-spacing:4px;}
  .ord-item{font:inherit;font-size:12.5px;line-height:1.4;text-align:left;background:var(--paper);border:1px solid var(--line-2);padding:9px 11px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;gap:8px;align-items:flex-start;font-family:"Public Sans",sans-serif;}
  .ord-item:hover{border-color:var(--navy);background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{flex:0 0 auto;width:18px;height:18px;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;}
  .ord-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad);background:var(--bad-soft);}

  .cl-item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line-2);padding:11px 13px;margin-bottom:8px;}
  .cl-item p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.5;flex:1 1 260px;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:5px 10px;cursor:pointer;border:1px solid var(--line-2);background:var(--paper-2);color:var(--muted);transition:.14s;text-transform:uppercase;font-family:"Public Sans",sans-serif;}
  .chip:hover{border-color:var(--navy);color:var(--navy);}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .cl-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad);background:var(--bad-soft);}

  .criterios{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;}
  .criterios li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#4a4a4a;line-height:1.55;}
  .criterios input{margin-top:2px;accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto;}

  textarea{width:100%;font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:26px;color:var(--ink);padding:12px 16px;border:1px solid var(--bronze-line);background-color:#fdfaf3;background-image:linear-gradient(transparent 25px,rgba(20,33,61,.07) 25px 26px);background-size:100% 26px;background-attachment:local;resize:vertical;outline:none;}
  textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e;font-style:italic;}

  .feedback{margin-top:16px;padding:0;overflow:hidden;max-height:0;opacity:0;transition:.3s;border-left:3px solid transparent;}
  .feedback.show{max-height:600px;opacity:1;padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft);border-left-color:var(--ok);color:#1d4526;}
  .feedback.mal{background:var(--bad-soft);border-left-color:var(--bad);color:#5c1414;}
  .feedback.info{background:var(--bronze-soft);border-left-color:var(--bronze);color:#5a3f22;}
  .feedback strong{display:block;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px;}
  .feedback p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.6;}
  .ej-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}

  .modelo{display:none;margin-top:14px;background:var(--paper-2);border-left:3px solid var(--navy);padding:13px 16px;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.65;color:var(--navy-dark);}
  .modelo.show{display:block;animation:fade .3s ease;}
  .modelo strong{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:5px;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

  .cuaderno{margin-top:32px;padding-top:22px;border-top:1px solid var(--navy);position:relative;}
  .cuaderno::before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--bronze-line);}
  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--bronze-line);}
  .nav-foot .btn{flex:1;max-width:220px;text-align:center;}
  .nav-foot .btn:disabled{opacity:.35;cursor:not-allowed;}

  /* Taller */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px;}
  .form-grid .full{grid-column:1/-1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--bronze-dark);font-family:"Public Sans",sans-serif;}
  .field input,.field textarea,.field select{font-family:"PT Serif",Georgia,serif;font-size:14px;padding:8px 11px;border:1px solid var(--bronze-line);background-color:#fdfaf3;color:var(--ink);outline:none;transition:.15s;width:100%;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}

{

    {id:"rr25", nombre:"Comillas para citas",
     concepto:"Las comillas encierran las palabras textuales de un entrevistado, funcionario o vecino. En radio, el locutor puede leer la cita o dar paso a la voz real.",
     ejemplo:"«La lideresa afirmó: “Llevamos veinte años esperando esta obra”». Entre comillas: cita textual.",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«La lideresa afirmó: ___Llevamos veinte años esperando esta obra___».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran citas textuales. El locutor da paso a la voz real o la lee como cita."}},
    {id:"rr26", nombre:"Paréntesis en guiones técnicos",
     concepto:"En guiones radiales, los paréntesis contienen indicaciones técnicas para el operador o el locutor: (música), (control), (bajada), (sube), (ambiente).",
     ejemplo:"«(Entra música: cortina de 5 segundos) Locutor: Buenos días, comunidad...».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada indicación.",
       categorias:["Indicación técnica","Texto del locutor"],
       items:[
         {texto:"(Entra música de entrada)", cat:0},
         {texto:"Buenos días, comunidad.", cat:1},
         {texto:"(Baja música al fondo)", cat:0},
         {texto:"Hoy hablamos del agua.", cat:1},
         {texto:"(Corte. Pausa de 2 segundos)", cat:0}
       ],
       retro:"En radio, el guion distingue el texto del locutor de las indicaciones técnicas."}},
    {id:"rr27", nombre:"Guion largo para diálogos",
     concepto:"En radioteatro y entrevistas con guion, la raya (—) introduce cada intervención. Ayuda al locutor a saber cuándo le toca hablar.",
     ejemplo:"«—Buenos días, señora. —Buenos días, ¿en qué puedo ayudarle? —Vengo por el problema del agua».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la raya en el diálogo.",
       texto:"«___Buenos días. ___Buenos días, ¿en qué puedo ayudarle?»",
       respuestas:[["—","-"],["—","-"]],
       retro:"La raya introduce cada intervención. En radioteatro y guion de entrevista es esencial."}},
    {id:"rr28", nombre:"Signos de interrogación",
     concepto:"Los signos de interrogación (¿?) enmarcan las preguntas del entrevistador. Ayudan al locutor a preparar la entonación ascendente.",
     ejemplo:"«¿Cuándo comenzará la obra? ¿Quiénes serán los beneficiarios? ¿Cuál es el presupuesto?».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca los signos.",
       texto:"«___Cuándo comenzará la obra___»",
       respuestas:[["¿"],["?"]],
       retro:"Los signos dobles (¿?) preparan la entonación ascendente en el locutor."}},
    {id:"rr29", nombre:"Signos de exclamación moderados",
     concepto:"En radio, los signos de exclamación (¡!) se usan con moderación. Sirven para marcar énfasis genuino, no para forzar emoción.",
     ejemplo:"«¡El agua llegó al barrio después de 20 años!» (énfasis genuino). No: «¡Buenos días, queridos oyentes!» (exagerado).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se usan los signos de exclamación en radio?",
       opciones:["En cada oración","Con moderación, para énfasis genuino","Nunca","Solo en noticias"],
       correcta:1,
       retro:"Los signos de exclamación se usan con moderación. El énfasis excesivo suena artificial al oído."}},
    {id:"rr30", nombre:"Barra y doble barra en guiones",
     concepto:"En guiones radiales, la barra (/) marca pausa breve, y la doble barra (//) marca pausa larga o cambio de sección. Ayudan al locutor a dosificar el ritmo.",
     ejemplo:"«La comunidad pidió / una solución al problema del agua // Ahora escucharemos a la lideresa».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la barra o doble barra.",
       texto:"«La comunidad pidió ___ una solución al agua ___ Ahora escucharemos a la lideresa».",
       respuestas:[["/"],["//"]],
       retro:"La barra marca pausa breve; la doble barra, pausa larga o cambio de sección. Ayudan al ritmo del locutor."}}
  ]
},
/* ---------- Bloque 4 ---------- */
{
  id:"r4", nombre:"Ortografía y normativa avanzada", emoji:"✓",
  desc:"Dequeísmo, queísmo, mayúsculas y tildes para el texto radial.",
  tecnicas:[
    {id:"rr31", nombre:"Dequeísmo",
     concepto:"El dequeísmo es usar «de que» cuando el verbo no lo exige: «pienso de que», «creo de que». En radio, es un error muy audible.",
     ejemplo:"Incorrecto: «Considero de que el proyecto es bueno». Correcto: «Considero que el proyecto es bueno».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina el dequeísmo.",
       texto:"«Pienso de que la reunión será el viernes» → «Pienso ___ la reunión será el viernes».",
       respuestas:[["que"]],
       retro:"«Pensar» rige «que», no «de que». En radio, el dequeísmo se escucha y resta credibilidad."}},
    {id:"rr32", nombre:"Queísmo",
     concepto:"El queísmo es lo contrario: omitir «de» cuando el verbo la exige. «Me di cuenta que», «estoy seguro que».",
     ejemplo:"Incorrecto: «Me di cuenta que faltaban recursos». Correcto: «Me di cuenta de que faltaban recursos».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el queísmo.",
       texto:"«Estoy seguro que la obra comenzará» → «Estoy seguro ___ que la obra comenzará».",
       respuestas:[["de"]],
       retro:"«Estar seguro» rige «de que». En radio, el queísmo es tan audible como el dequeísmo."}},
    {id:"rr33", nombre:"Laísmo, leísmo y loísmo",
     concepto:"El laísmo usa «la» como complemento indirecto: «la dije». El leísmo usa «le» como directo de cosa. Ambos son errores en la norma culta.",
     ejemplo:"Correcto: «Le dije a la vecina que viniera». Laísmo: «La dije a la vecina que viniera».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración.",
       categorias:["Correcto","Laísmo","Leísmo"],
       items:[
         {texto:"Le entregué el micrófono a la locutora.", cat:0},
         {texto:"La entregué el micrófono a la locutora.", cat:1},
         {texto:"Le vi el equipo (a la emisora).", cat:2},
         {texto:"Le dije al técnico que esperara.", cat:0},
         {texto:"La dije al técnico que esperara.", cat:1}
       ],
       retro:"El laísmo y el leísmo se escuchan claramente en radio. La norma culta exige le/les para indirecto."}},
    {id:"rr34", nombre:"Mayúsculas en instituciones",
     concepto:"Los nombres oficiales van en mayúscula: Alcaldía de Medellín, Ministerio de las TIC, Universidad Nacional. Los genéricos van en minúscula: alcaldía, ministerio, universidad.",
     ejemplo:"«La Alcaldía de Medellín firmó un convenio». «La alcaldía invertirá en obras».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«La Alcaldía de Medellín»,", cat:0},
         {texto:"«La alcaldía de medellín»,", cat:1},
         {texto:"«El Ministerio de las TIC»,", cat:0},
         {texto:"«El ministerio de las tic»,", cat:1},
         {texto:"«La Universidad Nacional»,", cat:0}
       ],
       retro:"Los nombres oficiales completos llevan mayúscula. Los genéricos, minúscula."}},
    {id:"rr35", nombre:"Mayúsculas en cargos",
     concepto:"Los cargos van en minúscula cuando acompañan al nombre: «el alcalde Gómez». En vocativo directo llevan mayúscula: «Señor Alcalde».",
     ejemplo:"«El alcalde Gómez visitó el barrio». «Señor Alcalde, ¿qué responde a los vecinos?».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"El alcalde Gómez visitó.", cat:0},
         {texto:"El Alcalde Gómez visitó.", cat:1},
         {texto:"Señor Alcalde, ¿qué responde?", cat:0},
         {texto:"La Docente Martínez asistió.", cat:1},
         {texto:"Señora Ministra, la escuchamos.", cat:0}
       ],
       retro:"Los cargos con nombre van en minúscula; en vocativo directo, en mayúscula."}},
    {id:"rr36", nombre:"Tilde diacrítica",
     concepto:"Distingue funciones: él/el, sí/si, más/mas, té/te, dé/de, sé/se, aún/aun. En radio es esencial.",
     ejemplo:"«Él dijo que vendría» / «El alcalde vendrá». «Sí, aceptamos» / «Si aceptan, avisen».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la forma.",
       texto:"___ alcalde llegó (él/el). · ___ aceptamos la invitación (Si/Sí). · ___ no ha llegado (Aún/Aun).",
       respuestas:[["el","él"],["si","sí"],["aun","aún"]],
       retro:"La tilde diacrítica distingue funciones. En radio, la pronunciación ayuda pero la escritura correcta es esencial."}},
    {id:"rr37", nombre:"Números en radio",
     concepto:"En radio, los números se escriben como se dicen. No «1 500 000», sino «un millón quinientos mil» o «1,5 millones». Los decimales se redondean.",
     ejemplo:"«El proyecto cuesta 1 500 000 pesos» → en guion: «cuesta un millón quinientos mil pesos».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe como se dice.",
       texto:"«$1 500 000» → «___ pesos».",
       respuestas:[["un millon quinientos mil","un millón quinientos mil"]],
       retro:"Los números se escriben como se dicen. El locutor no debe traducir en vivo."}},
    {id:"rr38", nombre:"Siglas en radio",
     concepto:"En radio, las siglas se leen deletreadas o se dice su nombre completo. Se evita leer «ONG» como palabra. Se explica la primera vez.",
     ejemplo:"En vez de «la ONG llegó al barrio», se dice: «La organización no gubernamental, conocida como ONG, llegó al barrio». O se deletrea: «o-ene-ge».",
     ejercicio:{tipo:"fill",
       consigna:"Explica la sigla.",
       texto:"«La ___ , o sea la organización no gubernamental, llegó al barrio».",
       respuestas:[["ong","ONG"]],
       retro:"Las siglas se explican la primera vez. El oyente puede no saber qué significan."}},
    {id:"rr39", nombre:"A ver / haber",
     concepto:"«A ver» es preposición + verbo (mirar). «Haber» es auxiliar. La confusión es error frecuente en guiones radiales.",
     ejemplo:"Correcto: «Vamos a ver los resultados». Correcto: «Debe haber respuesta».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con «a ver» o «haber».",
       texto:"«Vamos ___ cómo responde la comunidad». · «Debe ___ más presencia institucional».",
       respuestas:[["a ver"],["haber"]],
       retro:"«A ver» es mirar; «haber» es auxiliar. La confusión resta seriedad al guion."}},
    {id:"rr40", nombre:"Porque / por qué / porqué",
     concepto:"«Porque» (causa), «por qué» (interrogativo), «porqué» (sustantivo). En entrevistas radiales, distinguirlos es esencial.",
     ejemplo:"«No asistió porque estaba enfermo». «¿Por qué no asistió?». «Nadie explicó el porqué de la ausencia».",
     ejercicio:{tipo:"fill",
       consigna:"Completa.",
       texto:"No asistió ___ estaba enfermo (porque). · ¿___ no asistió? (Por qué). · No hay ___ (porqué).",
       respuestas:[["porque"],["por que","por qué"],["porque","porqué"]],
       retro:"Cada forma tiene función. En entrevista radial, la confusión afecta la comprensión del oyente."}}
  ]
},
/* ---------- Bloque 5 ---------- */
{
  id:"r5", nombre:"Vicios del lenguaje y claridad sonora", emoji:"⚠",
  desc:"Pleonasmos, muletillas, anfibologías y otros vicios que restan claridad en radio.",
  tecnicas:[
    {id:"rr41", nombre:"Pleonasmo",
     concepto:"Repetir ideas innecesariamente: «subir arriba», «lo vi con mis propios ojos». En radio ocupa tiempo valioso sin aportar información.",
     ejemplo:"Incorrecto: «El alcalde subió arriba al escenario». Correcto: «El alcalde subió al escenario».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la redundancia.",
       texto:"«El informe debe ser breve y conciso» → «El informe debe ser ___ ».",
       respuestas:[["breve","conciso"]],
       retro:"La redundancia ocupa tiempo valioso en radio. Se elimina."}},
    {id:"rr42", nombre:"Anfibología",
     concepto:"Ambigüedad por doble interpretación. En radio, el oyente no puede releer, así que la ambigüedad es grave.",
     ejemplo:"Ambiguo: «El alcalde habló con el líder sobre su proyecto». ¿«Su» = alcalde o líder? Correcto: «...sobre el proyecto del líder».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad.",
       texto:"«El alcalde habló con el líder sobre su propuesta» → «El alcalde habló con el líder sobre la propuesta del ___ ».",
       respuestas:[["lider","líder"]],
       retro:"La anfibología confunde al oyente. En radio, la claridad referencial es esencial."}},
    {id:"rr43", nombre:"Cosismo",
     concepto:"Usar «cosa» en lugar del término preciso. En radio, «cosa» es vago y confunde.",
     ejemplo:"Incorrecto: «Sucedió una cosa en la reunión». Correcto: «Se aprobó una decisión en la reunión».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye «cosa».",
       texto:"«Sucedió una cosa importante» → «Se presentó un ___ importante».",
       respuestas:[["hecho","evento","incidente","acuerdo","problema","avance"]],
       retro:"El cosismo es impreciso. En radio se exige el término exacto."}},
    {id:"rr44", nombre:"Muletillas radiales",
     concepto:"«Bueno», «este», «o sea», «eh» son muletillas del habla espontánea. En un guion escrito no caben. Se eliminan.",
     ejemplo:"No: «Bueno, entonces, este, la reunión fue, o sea, ayer». Sí: «La reunión fue ayer».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina las muletillas.",
       texto:"«Bueno, entonces, la reunión fue ayer» → «La reunión fue ___ ».",
       respuestas:[["ayer"]],
       retro:"Las muletillas restan profesionalismo. En un guion se eliminan por completo."}},
    {id:"rr45", nombre:"Impropiedad léxica",
     concepto:"Usar una palabra con significado distinto: «intoxicación» por «infección», «evaluación» por «calificación». En radio, confunde al oyente.",
     ejemplo:"Incorrecto: «La evaluación del estudiante fue 4,5». Correcto: «La calificación del estudiante fue 4,5».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término.",
       categorias:["Proceso completo","Asignación de nota"],
       items:[
         {texto:"evaluación", cat:0},
         {texto:"calificación", cat:1},
         {texto:"valoración", cat:0},
         {texto:"nota", cat:1},
         {texto:"seguimiento", cat:0}
       ],
       retro:"La impropiedad léxica confunde. En radio se exige el término exacto."}},
    {id:"rr46", nombre:"Abuso del «que»",
     concepto:"El encadenamiento de «que» dificulta la comprensión. En radio, la frase se pierde.",
     ejemplo:"No: «Dijo que el alcalde que vino que trajo un proyecto que beneficiará...». Sí: «Dijo que el alcalde trajo un proyecto. Beneficiará...».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina el «que» superfluo.",
       texto:"«Dijo que el alcalde que vino que trajo un proyecto» → «Dijo que el alcalde vino y trajo un ___ ».",
       respuestas:[["proyecto"]],
       retro:"El abuso del «que» confunde al oyente. Se divide y se eliminan los superfluos."}},
    {id:"rr47", nombre:"Cacofonía",
     concepto:"Repetición de sonidos desagradables: «el área del área», «la coordinación coordina». En radio suena mal y distrae.",
     ejemplo:"Cacofónico: «El área del área administrativa». Mejor: «El área administrativa».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin cacofonía.",
       texto:"«El acta del acto fue archivada en el archivo» → «El acta del acto fue archivada en el ___ ».",
       respuestas:[["deposito","depósito","fondo documental","archivo central"]],
       retro:"La cacofonía se corrige por sustitución. En radio, la eufonía es esencial."}},
    {id:"rr48", nombre:"Barbarismos",
     concepto:"«Haiga», «dijieron», «vinistes», «prevee» son barbarismos. En radio restan credibilidad inmediata.",
     ejemplo:"Correcto: «Espero que haya asistencia». Correcto: «Ellos dijeron». Correcto: «El reglamento prevé».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el barbarismo.",
       texto:"«Se espera que haiga respuesta» → «Se espera que ___ respuesta».",
       respuestas:[["haya"]],
       retro:"Los barbarismos se escuchan claramente en radio. Restan credibilidad inmediata."}},
    {id:"rr49", nombre:"Anacoluto",
     concepto:"Ruptura de la estructura sintáctica: la oración empieza de una manera y termina de otra. En radio produce incoherencia.",
     ejemplo:"Anacoluto: «Los vecinos que vinieron, sus quejas fueron escuchadas». Correcto: «A los vecinos que vinieron se les escucharon sus quejas».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin anacoluto.",
       texto:"«El informe que presentó el técnico, sus conclusiones son claras» → «Las conclusiones del informe presentado por el técnico son ___ ».",
       respuestas:[["claras"]],
       retro:"El anacoluto produce incoherencia. Se corrige reorganizando la oración."}},
    {id:"rr50", nombre:"Ultracorrección",
     concepto:"Corregir lo que no está mal: «Bogotà», «dijistes», «vinistes». En radio se escucha y confunde.",
     ejemplo:"Incorrecto: «Tú vinistes ayer». Correcto: «Tú viniste ayer».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la ultracorrección.",
       texto:"«Tú dijistes que sí» → «Tú ___ que sí».",
       respuestas:[["dijiste"]],
       retro:"La ultracorrección es un error por exceso de celo. La norma culta exige la forma correcta."}}
  ]
},
/* ---------- Bloque 6 ---------- */
{
  id:"r6", nombre:"Estilo radial y sonoridad", emoji:"🎙",
  desc:"Ritmo, musicalización, recursos sonoros y escritura para la voz.",
  tecnicas:[
    {id:"rr51", nombre:"Escribir como se habla",
     concepto:"En radio, se escribe como se habla bien. No se imita el lenguaje de la prensa escrita ni el de los libros. Se escribe para la voz.",
     ejemplo:"Prensa: «El mandatario local efectuó una visita a la comunidad». Radio: «El alcalde visitó la comunidad».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe para la voz.",
       texto:"«El mandatario local efectuó una visita a la comunidad» → «El ___ visitó la comunidad».",
       respuestas:[["alcalde","mandatario"]],
       retro:"En radio se escribe como se habla bien. La naturalidad no es descuido: es claridad."}},
    {id:"rr52", nombre:"Ritmo y cadencia",
     concepto:"El ritmo en radio se construye alternando frases cortas y medianas. Ni todas cortas (atropellado) ni todas largas (monótono). Se alterna.",
     ejemplo:"«La obra comenzará en agosto. Durante tres meses se pavimentarán las vías principales. Los vecinos piden que se cumpla el plazo».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se construye el ritmo radial?",
       opciones:["Solo con frases cortas","Alternando frases cortas y medianas","Solo con frases largas","No importa el ritmo"],
       correcta:1,
       retro:"El ritmo radial se logra alternando frases. Ni atropellado ni monótono."}},
    {id:"rr53", nombre:"Entonación implícita en el texto",
     concepto:"El texto radial sugiere la entonación. Las preguntas suben, las afirmaciones bajan, las enumeraciones sostienen. Se escribe pensando en eso.",
     ejemplo:"«¿Qué piden los vecinos? Seguridad. Vías. Un parque». El texto prepara la entonación.",
     ejercicio:{tipo:"fill",
       consigna:"Prepara la entonación.",
       texto:"«¿Qué piden los vecinos? ___ , ___ y ___ » (tres cosas que pide la comunidad).",
       respuestas:[["seguridad","vias","vías","agua","salud"],["vias","vías","educacion","educación","empleo","parque"],["parque","recreacion","recreación","alumbrado","transporte"]],
       retro:"El texto sugiere la entonación. En radio, la escritura prepara la voz."}},
    {id:"rr54", nombre:"Musicalización y silencio",
     concepto:"La música en radio no es adorno: crea atmósfera, marca secciones, refuerza el mensaje. El silencio también comunica: da peso a lo dicho.",
     ejemplo:"«(Entra música suave) Y ahora, la voz de los abuelos del barrio. (Sube música) Doña Marta, cuéntenos...».",
     ejercicio:{tipo:"fill",
       consigna:"Indica la musicalización.",
       texto:"«___Entra música suave___ Y ahora, la voz de los abuelos del barrio».",
       respuestas:[["("],[" )",""]],
       retro:"La música y el silencio son recursos. Las indicaciones técnicas se escriben entre paréntesis."}},
    {id:"rr55", nombre:"Recursos sonoros",
     concepto:"Ambientes, efectos y sonidos reales enriquecen la narración radial. Un reportaje sobre el río se acompaña con el sonido del agua. Una crónica sobre la plaza, con las voces del mercado.",
     ejemplo:"«(Ambiente: sonido de agua de río) A orillas del río, los pescadores hablan...».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada recurso.",
       categorias:["Ambiente","Efecto","Voz"],
       items:[
         {texto:"Sonido del agua del río.", cat:0},
         {texto:"Sonido de una campana.", cat:1},
         {texto:"Voz de una lideresa.", cat:2},
         {texto:"Ruido del mercado.", cat:0},
         {texto:"Voz de un funcionario.", cat:2}
       ],
       retro:"Ambientes, efectos y voces enriquecen el relato radial. Se marcan en el guion."}},
    {id:"rr56", nombre:"Números redondeados",
     concepto:"En radio, los números se redondean para facilitar la comprensión. No «un 47,3 %», sino «casi la mitad». No «1 234 567 pesos», sino «más de un millón de pesos».",
     ejemplo:"«Casi la mitad de los encuestados dijo...». «Más de un millón de pesos se invertirán...».",
     ejercicio:{tipo:"fill",
       consigna:"Redondea el número.",
       texto:"«El 47,3 % de los vecinos» → «___ de los vecinos».",
       respuestas:[["casi la mitad","la mitad","cerca de la mitad"]],
       retro:"Los números redondeados son más comprensibles al oído. La exactitud se da en la fuente."}},
    {id:"rr57", nombre:"Nombres pronunciables",
     concepto:"Los nombres propios difíciles se escriben con apoyo fonético entre corchetes: [Huilá], [Yopal], [Guaicaramo]. El locutor agradece la ayuda.",
     ejemplo:"«El resguardo indígena de [Guambía] pidió apoyo al gobierno».",
     ejercicio:{tipo:"fill",
       consigna:"Añade apoyo fonético.",
       texto:"«El resguardo indígena de ___ pidió apoyo» (nombre: Guambía).",
       respuestas:[["guambia","guambía","[guambia]","[guambía]"]],
       retro:"Los nombres difíciles se escriben con apoyo fonético. El locutor agradece la ayuda."}},
    {id:"rr58", nombre:"Siglas y su lectura",
     concepto:"En radio, las siglas se leen deletreadas o se explica el nombre completo. Se evita leer «ONG» como palabra.",
     ejemplo:"«La organización no gubernamental, conocida como ONG» o «o-ene-ge».",
     ejercicio:{tipo:"fill",
       consigna:"Explica la sigla.",
       texto:"«La ___ , o sea la organización no gubernamental».",
       respuestas:[["ong","ONG"]],
       retro:"En radio, las siglas se leen o se explican. No se pronuncian como palabras."}},
    {id:"rr59", nombre:"Pausas y respiración",
     concepto:"El texto radial deja espacio para que el locutor respire. Se marcan pausas con comas, puntos o barras. Un guion sin pausas ahoga al locutor.",
     ejemplo:"«La comunidad / después de veinte años / recibió la noticia».",
     ejercicio:{tipo:"fill",
       consigna:"Marca las pausas.",
       texto:"«La comunidad después de veinte años recibió la noticia» → «La comunidad / ___ / recibió la noticia».",
       respuestas:[["despues de veinte anos","después de veinte años"]],
       retro:"Las pausas permiten respirar. Un guion sin pausas ahoga al locutor."}},
    {id:"rr60", nombre:"Cierre circular",
     concepto:"El cierre radial recupera el inicio. Si se abrió con una pregunta o una imagen, se cierra con la respuesta o la misma imagen. Esto da unidad al programa.",
     ejemplo:"Apertura: «¿Llegará el agua al barrio La Esperanza?». Cierre: «El agua llegará al barrio La Esperanza. Después de veinte años».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el cierre circular.",
       texto:"Apertura: «¿Llegará el agua?». Cierre: «El agua ___ ».",
       respuestas:[["llegara","llegará"]],
       retro:"El cierre circular da unidad al programa. Recupera la pregunta o imagen inicial."}}
  ]
},
/* ---------- Bloque 7 ---------- */
{
  id:"r7", nombre:"Géneros radiofónicos", emoji:"🎼",
  desc:"Noticia, crónica, reportaje, entrevista, cuña, spot, magazine, mesa redonda.",
  tecnicas:[
    {id:"rr61", nombre:"Noticia radial",
     concepto:"La noticia radial responde qué, quién, cuándo, dónde, cómo y por qué. Se escribe en pirámide invertida: lo más importante primero. Dura entre 30 y 60 segundos.",
     ejemplo:"«La alcaldía iniciará la pavimentación de tres vías del barrio La Esperanza. Las obras comenzarán en agosto y durarán tres meses. La inversión supera los 500 millones de pesos».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la noticia radial.",
       items:[

         "Quién: la alcaldía.",
         "Cuándo: en agosto.",
         "Dónde: barrio La Esperanza.",
         "Dato: inversión de 500 millones."
       ],
       retro:"La noticia radial ordena los datos según su importancia. Lo más importante primero."}},
    {id:"rr62", nombre:"Crónica radial",
     concepto:"La crónica narra los hechos con voz propia. Combina información y descripción. Tiene ritmo, imágenes sonoras y presencia del cronista.",
     ejemplo:"«A las cinco de la mañana, las canoas ya están en el río. Los pescadores revisan las redes bajo un sol que apenas asoma. La jornada empieza antes del amanecer...».",

       consigna:"Completa la crónica.",
       texto:"«A las ___ de la mañana, las canoas ya están en el ___ ».",
       respuestas:[["cinco","5","seis","6","cuatro","4"],["rio","río"]],
       retro:"La crónica radial narra con imágenes sonoras. Combina información y descripción."}},
    {id:"rr63", nombre:"Reportaje radial",
     concepto:"El reportaje profundiza un tema con múltiples voces y ambientes reales. Dura más que la noticia. Se construye con entrevistas, sonidos del lugar y contexto.",
     ejemplo:"Un reportaje sobre el agua del barrio: la voz de la lideresa, del funcionario, del fontanero, con ambientes reales del barrio.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el reportaje.",
       texto:"El reportaje radial profundiza un tema con múltiples ___ , ___ reales y ___ .",
       respuestas:[["voces"],["ambientes","sonidos"],["contexto","datos","investigacion","investigación"]],
       retro:"El reportaje combina voces, ambientes y contexto. Es un género de profundidad."}},
    {id:"rr64", nombre:"Entrevista radial",
     concepto:"La entrevista radial da voz a una persona. Se prepara con preguntas abiertas y respetuosas. El entrevistador escucha y repregunta.",
     ejemplo:"«Señora Marta, usted ha liderado esta lucha durante veinte años. ¿Cómo empezó todo? ¿Qué ha sido lo más difícil? ¿Qué le diría a las autoridades?».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe una pregunta abierta.",
       texto:"«¿Cómo ___ todo?» · «¿Qué ha sido lo más ___ ?» · «¿Qué le diría a las ___ ?»",
       respuestas:[["empezo","empezó","comenzo","comenzó","inicio","inició"],["dificil","difícil","duro","complejo"],["autoridades","instituciones","alcaldia","alcaldía","entidades"]],
       retro:"Las preguntas abiertas (cómo, qué, por qué) dan mejores respuestas que las cerradas (sí/no)."}},
    {id:"rr65", nombre:"Cuña radial",
     concepto:"La cuña radial es un mensaje breve (15-30 segundos) que promueve una idea, un servicio o una campaña. Tiene estructura: gancho, mensaje, cierre con identificación.",
     ejemplo:"«(Sonido de gota de agua) Una gota. Otra. Miles. Cada gota cuenta. Cierra la llave cuando no la uses. Campaña de la emisora comunitaria El Río».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la cuña.",
       items:[
         "Gancho sonoro o frase inicial.",
         "Mensaje central.",
         "Llamada a la acción.",
         "Identificación de la emisora."
       ],
       retro:"La cuña radial tiene gancho, mensaje, acción e identificación. Dura entre 15 y 30 segundos."}},
    {id:"rr66", nombre:"Spot radial",
     concepto:"El spot radial (30-60 segundos) promueve un producto, servicio o campaña con más desarrollo que la cuña. Combina voces, sonidos y música.",
     ejemplo:"Un spot sobre vacunación: una madre preocupada, un médico que aclara, un cierre con la voz institucional.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el spot.",
       texto:"El spot radial dura entre ___ y ___ segundos y combina voces, ___ y ___ .",
       respuestas:[["30","treinta"],["60","sesenta"],["sonidos","musica","música"],["musica","música","efectos"]],
       retro:"El spot tiene más desarrollo que la cuña. Combina varios recursos sonoros."}},
    {id:"rr67", nombre:"Radiorevista",
     concepto:"La radiorevista o magazine combina varios formatos: noticias, entrevistas, música, secciones. Dura de 30 a 60 minutos. Se estructura en bloques.",
     ejemplo:"Bloque 1: noticias. Bloque 2: entrevista. Bloque 3: música. Bloque 4: sección de servicio comunitario.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los bloques de la radiorevista.",
       items:[
         "Bloque de apertura y noticias.",
         "Bloque de entrevista o reportaje.",
         "Bloque musical.",
         "Bloque de servicio a la comunidad.",
         "Bloque de cierre."
       ],
       retro:"La radiorevista organiza varios formatos en bloques. Cada bloque tiene su ritmo y su función."}},
    {id:"rr68", nombre:"Mesa redonda",
     concepto:"La mesa redonda reúne a varios participantes para discutir un tema. Un moderador ordena las intervenciones. Se preparan preguntas y se da tiempo equitativo.",
     ejemplo:"Una mesa sobre el agua con la lideresa, el funcionario, el experto y la veedora. El moderador da la palabra y ordena.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la mesa redonda.",
       texto:"La mesa redonda reúne a varios ___ , ordena las ___ con un moderador y da tiempo ___ .",
       respuestas:[["participantes","invitados","voceros"],["intervenciones","palabras","opiniones"],["equitativo","igual","justo"]],
       retro:"La mesa redonda requiere moderación. Todos los participantes deben tener voz."}},
    {id:"rr69", nombre:"Radioteatro y radionovela",
     concepto:"El radioteatro y la radionovela narran historias con voces, sonidos y música. Se construyen con diálogos, ambientes y efectos. Cada personaje tiene su voz.",
     ejemplo:"«(Ambiente: lluvia) —Mamá, ya no aguanto más. —Tranquila, hija, ya falta poco».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el radioteatro.",
       texto:"El radioteatro narra historias con ___ , sonidos y ___ . Cada personaje tiene su ___ .",
       respuestas:[["voces"],["musica","música","efectos"],["voz","tono","caracter"]],
       retro:"El radioteatro construye mundos con voz, sonido y música. La imaginación del oyente es el escenario."}},
    {id:"rr70", nombre:"Comentario y editorial",
     concepto:"El comentario y el editorial expresan la opinión de la emisora o del comentarista. Estructura: tesis, argumentos, conclusión. Se sostienen con hechos, no con descalificaciones.",
     ejemplo:"«Hoy queremos comentar la situación del agua en el barrio. Es cierto que la obra es compleja. Pero veinte años es demasiado tiempo. Las comunidades tienen derecho a los servicios básicos».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el comentario.",
       texto:"El comentario radial tiene una ___ , varios ___ y una ___ . Se sostiene con ___ , no con descalificaciones.",
       respuestas:[["tesis","opinion","opinión"],["argumentos","razones"],["conclusion","conclusión"],["hechos","datos","evidencia"]],
       retro:"El comentario radial defiende una tesis con argumentos. La opinión se sostiene con hechos."}}
  ]
},
/* ---------- Bloque 8 ---------- */
{
  id:"r8", nombre:"Técnica normativa y ética radial", emoji:"⚖",
  desc:"Ley 1341, derechos, protección de menores y ética de la radiodifusión.",
  tecnicas:[
    {id:"rr71", nombre:"Ley 1341 de 2009",
     concepto:"La Ley 1341 de 2009 regula las TIC en Colombia. Establece el marco de la radiodifusión sonora, los servicios comunitarios y las obligaciones de los operadores.",
     ejemplo:"«La emisora comunitaria opera en el marco de la Ley 1341 de 2009 y las resoluciones del Ministerio de las TIC».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia normativa.",
       texto:"La radiodifusión sonora comunitaria en Colombia opera en el marco de la Ley ___ de ___ .",
       respuestas:[["1341"],["2009"]],
       retro:"La Ley 1341 de 2009 y sus resoluciones regulan la radiodifusión sonora comunitaria en Colombia."}},
    {id:"rr72", nombre:"Radiodifusión sonora comunitaria",
     concepto:"La radiodifusión sonora comunitaria es un servicio público sin ánimo de lucro, prestado por comunidades organizadas. Su fin es el desarrollo social y la participación ciudadana.",
     ejemplo:"La emisora comunitaria no vende publicidad comercial como fin, sino que presta un servicio a la comunidad.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los rasgos.",
       texto:"La radiodifusión sonora comunitaria es un servicio público sin ___ , prestado por ___ organizadas, con fin ___ .",
       respuestas:[["animo de lucro","ánimo de lucro","lucro"],["comunidades","organizaciones"],["social","comunitario","de desarrollo social"]],
       retro:"La radio comunitaria no busca lucro. Su fin es el desarrollo social y la participación ciudadana."}},
    {id:"rr73", nombre:"Derecho a la información veraz",
     concepto:"Toda persona tiene derecho a recibir información veraz e imparcial (art. 20 C.P.). La emisora comunitaria garantiza ese derecho verificando sus fuentes.",
     ejemplo:"«Verificamos cada dato con al menos dos fuentes antes de emitir».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el derecho.",
       texto:"El artículo ___ de la Constitución consagra el derecho a la información ___ .",
       respuestas:[["20"],["veraz","verdadera"]],
       retro:"El artículo 20 de la Constitución consagra el derecho a la información veraz. La radio comunitaria lo garantiza."}},
    {id:"rr74", nombre:"Rectificación y derecho de réplica",
     concepto:"Quien se sienta afectado por una información tiene derecho a la rectificación en las mismas condiciones. La emisora debe ofrecer ese espacio.",
     ejemplo:"«Si alguna persona considera que hemos afectado su buen nombre, ofrecemos el espacio de rectificación en el mismo horario».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el derecho de rectificación.",
       texto:"Quien se sienta afectado tiene derecho a la ___ en las mismas ___ , en el mismo ___ .",
       respuestas:[["rectificacion","rectificación"],["condiciones"],["horario","espacio","programa"]],
       retro:"El derecho de rectificación está consagrado en el artículo 20 de la Constitución. La radio comunitaria lo respeta."}},
    {id:"rr75", nombre:"Protección de menores",
     concepto:"Los niños, niñas y adolescentes tienen protección reforzada. No se difunden sus nombres, imágenes ni datos en casos que los afecten. Se protege su intimidad.",
     ejemplo:"En lugar de «el menor Juan Pérez del barrio X», se dice: «un adolescente del barrio».",
     ejercicio:{tipo:"fill",
       consigna:"Protege la intimidad del menor.",
       texto:"«El menor Juan Pérez del barrio X» → «Un ___ del barrio».",
       respuestas:[["adolescente","menor","joven","nino","niño","estudiante"]],
       retro:"Los menores tienen protección reforzada. No se difunden sus nombres en casos que los afecten."}},
    {id:"rr76", nombre:"Lenguaje no discriminatorio",
     concepto:"La radio comunitaria evita expresiones que estigmatizan por origen, género, etnia, edad, discapacidad, orientación sexual o religión. Se usa lenguaje respetuoso.",
     ejemplo:"Se prefiere «persona con discapacidad» a «discapacitado». «Persona adulta mayor» a «viejo». «Comunidad afrodescendiente» a «moreno».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Respetuosa","Discriminatoria"],
       items:[
         {texto:"Persona con discapacidad.", cat:0},
         {texto:"Discapacitado.", cat:1},
         {texto:"Persona adulta mayor.", cat:0},
         {texto:"Viejo inútil.", cat:1},
         {texto:"Comunidad afrodescendiente.", cat:0}
       ],
       retro:"El lenguaje no discriminatorio reconoce la dignidad de todas las personas."}},
    {id:"rr77", nombre:"Manejo de fuentes sensibles",
     concepto:"Cuando la fuente es una víctima, un menor o una persona en riesgo, se protege su identidad y su integridad. Se evita revictimizar.",
     ejemplo:"«Una víctima del conflicto, quien pidió reservar su nombre, contó que...».",
     ejercicio:{tipo:"fill",
       consigna:"Protege la fuente.",
       texto:"«Una víctima del conflicto, quien pidió reservar su ___ , contó que...».",
       respuestas:[["nombre","identidad"]],
       retro:"Las fuentes sensibles se protegen. La emisora no revictimiza ni expone a personas en riesgo."}},
    {id:"rr78", nombre:"Participación comunitaria",
     concepto:"La radio comunitaria es un espacio de participación. Los programas se construyen con la comunidad: cabildos abiertos, llamadas, mensajes, corresponsales locales.",
     ejemplo:"«Este programa lo construimos entre todos. Llame y cuéntenos qué pasa en su barrio».",
     ejercicio:{tipo:"fill",
       consigna:"Promueve la participación.",
       texto:"«Este programa lo construimos ___ . Llame y cuéntenos qué pasa en su ___ ».",
       respuestas:[["entre todos","en comunidad","juntos"],["barrio","vereda","sector","comunidad"]],
       retro:"La radio comunitaria es un espacio de participación. La comunidad es protagonista, no espectadora."}},
    {id:"rr79", nombre:"Parrilla de programación",
     concepto:"La parrilla de programación organiza los programas de la emisora por franjas y públicos. Cada franja tiene un propósito y un público destinatario.",
     ejemplo:"Mañana: informativo y servicio. Mediodía: música y mensajes comunitarios. Tarde: juvenil y educativo. Noche: cultural y reflexivo.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la parrilla.",
       texto:"La parrilla organiza los programas por ___ y públicos. La franja de la mañana suele ser ___ .",
       respuestas:[["franjas","horarios","momentos"],["informativa","informativa y de servicio","de noticias","de servicio"]],
       retro:"La parrilla radial organiza los programas según franjas y públicos. Cada franja tiene su propósito."}},
    {id:"rr80", nombre:"Guion técnico radial",
     concepto:"El guion técnico radial indica el texto del locutor, las señales de control (música, entrada, bajada), los tiempos y los recursos. Es la herramienta del operador y del locutor.",
     ejemplo:"«0:00 - Entra cortina musical. 0:05 - Locutor 1: Buenos días... 0:30 - Baja cortina. 0:32 - Locutor 2: Hoy hablamos...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las columnas del guion técnico.",
       items:[
         "Tiempo (minuto/segundo).",
         "Indicación técnica (control, música, sonido).",
         "Texto del locutor.",
         "Duración del bloque."
       ],
       retro:"El guion técnico organiza tiempo, control y texto. Es la herramienta de la emisión."}}
  ]
},

{

  desc:"Verificación, archivo sonoro, dos fuentes y manejo de rumores.",
  tecnicas:[
    {id:"rr81", nombre:"Verificación de fuentes",

     ejercicio:{tipo:"fill",

       retro:"La verificación con dos fuentes es deber ético. La credibilidad de la emisora depende de ella."}},
    {id:"rr82", nombre:"Fuentes vivas y documentales",

    {id:"rr83", nombre:"Archivo sonoro",

    {id:"rr84", nombre:"Regla de dos fuentes",

    {id:"rr85", nombre:"Cita de funcionarios",

    {id:"rr86", nombre:"Cita de organizaciones sociales",
     concepto:"Las organizaciones sociales (JAC, sindicatos, colectivos, resguardos) son fuentes fundamentales en radio comunitaria. Se cita su nombre completo y su vocero.",

    {id:"rr87", nombre:"Cita de expertos",

     ejercicio:{tipo:"fill",
       consigna:"Completa la cita del experto.",

    {id:"rr88", nombre:"Manejo de rumores",
     concepto:"En radio comunitaria circulan rumores. El deber es verificar antes de emitir. Si el rumor no se confirma, no se emite como noticia. Se informa que se está verificando.",

       retro:"El rumor no se emite como noticia. Se verifica y se informa que se está verificando."}},
    {id:"rr89", nombre:"Corrección en vivo",
     concepto:"Si se emite un error, se corrige de inmediato en el mismo programa. La corrección es deber ético. Se explica qué se dijo mal y cuál es el dato correcto.",

     ejercicio:{tipo:"fill",
       consigna:"Completa la corrección.",
       texto:"«En el boletín anterior dijimos que la reunión sería el ___ . Rectificamos: será el ___ ».",
       respuestas:[["jueves"],["viernes","dia correcto","día correcto"]],
       retro:"La corrección en vivo es deber ético. Se explica el error y se da el dato correcto."}},
    {id:"rr90", nombre:"Verificación de cifras",
     concepto:"Las cifras se verifican con la fuente oficial. Se contrastan con otras fuentes. En radio se redondean al aire pero se conservan exactas en el archivo.",
     ejemplo:"«Según la Secretaría de Salud, se registraron 47 casos (casi cincuenta) en el último mes». En el guion: «casi cincuenta».",
