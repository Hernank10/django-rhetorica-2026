<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno del Desarrollador de LMS · Python + Django + SQL · 100 técnicas + Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0; --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);border-bottom:3px double var(--navy);box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .seal{width:50px;height:50px;flex:0 0 auto;border-radius:50%;padding:3px;border:1.5px dashed var(--bronze);display:grid;place-items:center;}
  .seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:14px;position:relative;}
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:6px;color:var(--bronze);}
  .seal-inner::before{top:5px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:5px;left:50%;transform:translateX(-50%);}
  .brand h1{font-family:"PT Serif",Georgia,serif;font-size:14px;margin:0;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tabs{display:flex;gap:0;border:1px solid var(--navy);background:var(--paper);}
  .tab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:none;background:transparent;color:var(--navy);border-right:1px solid var(--navy);transition:.15s;font-family:"Public Sans",sans-serif;}
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--navy-soft);}
  .tab.active{background:var(--navy);color:var(--paper);}
  .progress-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .progress-bar{width:130px;height:6px;border:1px solid var(--line-2);background:#f0ece0;overflow:hidden;}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .stat strong{font-family:"PT Serif",Georgia,serif;font-size:15px;color:var(--navy);font-weight:700;padding:0 5px;}
  .btn{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--paper);color:var(--navy);transition:.16s;font-family:"Public Sans",sans-serif;}
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy);color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc;color:var(--navy);}
  .btn.danger{border-color:var(--bad);color:var(--bad);}
  .btn.danger:hover{background:var(--bad-soft);}
  .only-mobile{display:none;}
  .layout{display:grid;grid-template-columns:310px 1fr;gap:22px;max-width:1400px;margin:0 auto;padding:22px;align-items:start;}
  .sidebar{position:sticky;top:100px;max-height:calc(100vh - 124px);overflow-y:auto;background:var(--paper);border:1px solid var(--navy);padding:4px;box-shadow:var(--shadow);}
  .sidebar-inner{border:1px solid var(--bronze-line);padding:12px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);}
  #search{width:100%;font-size:12px;padding:8px 11px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px;font-family:"Public Sans",sans-serif;}
  #search:focus{border-color:var(--navy);}
  .cat{margin-bottom:4px;}
  .cat-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;padding:9px 10px;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--navy);text-transform:uppercase;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .cat-head:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto;font-size:9px;color:var(--bronze);transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{font-family:"PT Serif",Georgia,serif;font-size:10.5px;font-weight:700;background:var(--bronze-soft);color:var(--bronze-dark);padding:1px 7px;border:1px solid var(--bronze-line);}
  .cat-bar{height:3px;background:#e8e2d2;margin:0 10px 6px;overflow:hidden;border:1px solid var(--line);}
  .cat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .cat-body{display:none;padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:10px;color:var(--muted);padding:0 10px 8px;line-height:1.45;font-style:italic;}
  .tech-link{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.3px;line-height:1.4;color:#3a3a3a;padding:7px 10px;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .tech-link:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-link .dot{flex:0 0 auto;width:13px;height:13px;margin-top:1px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-size:8px;color:transparent;}
  .tech-link.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}
  .sidebar-label{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--bronze-line);}
  .sidebar-section{margin-bottom:16px;}
  .side-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.3px;line-height:1.4;color:#3a3a3a;padding:8px 10px;border-left:3px solid transparent;transition:.15s;font-family:"Public Sans",sans-serif;}
  .side-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .side-item.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .side-item .icon{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;color:var(--navy);}
  .side-item.active .icon{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .side-item .label{flex:1;min-width:0;}
  .side-item .label small{display:block;font-size:9.5px;color:var(--muted);font-weight:500;margin-top:2px;}
  .empty-mini{font-size:11px;color:var(--muted);font-style:italic;padding:10px;text-align:center;border:1px dashed var(--line-2);background:var(--paper-2);}
  .draft-item{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-left:3px solid transparent;cursor:pointer;transition:.15s;font-size:11px;line-height:1.35;font-family:"Public Sans",sans-serif;border-bottom:1px solid var(--line);}
  .draft-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .draft-item.active{background:var(--navy-soft);border-left-color:var(--navy);}
  .draft-item .di-title{flex:1;min-width:0;color:#3a3a3a;font-weight:600;}
  .draft-item .di-title small{display:block;font-weight:400;font-size:9.5px;color:var(--muted);margin-top:2px;}
  .draft-item .di-del{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .draft-item .di-del:hover{color:var(--bad);}
  .panel{background:var(--paper);border:1px solid var(--navy);padding:6px;box-shadow:var(--shadow);}
  .panel-inner{border:1px solid var(--bronze-line);padding:26px 30px 30px;background:radial-gradient(circle at 100% 0%,#f7f2e8 0%,transparent 40%),var(--paper);position:relative;}
  .panel-seal{position:absolute;top:18px;right:22px;width:70px;height:70px;border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.75;}
  .panel-seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:9px;text-align:center;line-height:1.1;}
  .tech-head{margin-bottom:20px;padding-right:90px;}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);border:1px solid var(--bronze-line);padding:3px 10px;margin-bottom:12px;}
  .tech-head h2{margin:0;font-family:"PT Serif",Georgia,serif;font-size:23px;line-height:1.2;letter-spacing:-.3px;font-weight:700;color:var(--navy);}
  .tech-head p.lead{margin:8px 0 0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.6;color:var(--muted);}
  .tech-pos{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .rule{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:16px 0 20px;}
  .block-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .bdot{width:11px;height:11px;border:1px solid var(--line-2);background:var(--paper);cursor:pointer;transition:.15s;}
  .bdot:hover{transform:scale(1.2);border-color:var(--bronze);}
  .bdot.done{background:var(--ok);border-color:var(--ok);}
  .bdot.current{background:var(--bronze);border-color:var(--bronze-dark);}
  .flashcard{perspective:1600px;margin:0 0 14px;cursor:pointer;border:1px solid var(--navy);padding:4px;background:var(--paper);box-shadow:var(--shadow);}
  .fc-inner{position:relative;min-height:clamp(260px,34vh,320px);transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);border:1px solid var(--bronze-line);}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px 26px;display:flex;flex-direction:column;overflow:auto;background:var(--paper);background-image:linear-gradient(transparent 27px,rgba(20,33,61,.06) 27px 28px);background-size:100% 28px;background-position:0 14px;}
  .fc-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:27px;color:var(--ink);}
  .fc-back{transform:rotateY(180deg);background:#faf6ec;}
  .fc-back p{color:var(--navy-dark);font-style:italic;font-size:14px;}
  .fc-back code,.fc-face code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;background:#eef2f8;padding:1px 5px;border-radius:3px;color:#14213d;font-style:normal;}
  .fc-tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:12px;display:block;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);}
  .fc-hint{margin-top:auto;padding-top:14px;font-size:10.5px;color:#9c907c;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .flip-btn{margin:0 0 26px;}
  .sec-title{display:flex;align-items:center;gap:10px;font-family:"PT Serif",Georgia,serif;font-size:16px;font-weight:700;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title span{font-size:10px;font-weight:700;color:var(--muted);margin-left:auto;letter-spacing:.6px;text-transform:uppercase;}
  .consigna{font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper-2);border-left:3px solid var(--bronze);padding:12px 16px;margin:0 0 16px;}
  .opciones{display:flex;flex-direction:column;gap:8px;}
  .opcion{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:13px;line-height:1.5;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);padding:12px 14px;cursor:pointer;transition:.15s;font-family:"Public Sans",sans-serif;}
  .opcion:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft);}
  .opcion:disabled{cursor:default;opacity:.9;}
  .opcion .letra{flex:0 0 auto;width:22px;height:22px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line-2);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:12px;font-weight:700;}
  .opcion.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad);color:#fff;border-color:var(--bad);}
  .fill-texto{font-family:"PT Serif",Georgia,serif;font-size:15.5px;line-height:2.4;margin:0 0 16px;color:var(--ink);}
  .hueco{font:inherit;font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-style:normal;border:none;border-bottom:1.5px solid var(--bronze);background:transparent;color:var(--bronze-dark);font-weight:700;padding:2px 6px;min-width:110px;text-align:center;outline:none;}
  .hueco:focus{background:var(--bronze-soft);border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);text-decoration:line-through;}
  .order-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .order-col h4{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .pool,.seq{min-height:120px;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .pool{background:var(--paper-2);border:1px dashed var(--line-2);}
  .seq{background:#f4efe2;border:1px solid var(--bronze-line);}
  .pool:empty::after,.seq:empty::after{content:"···";color:#c9c2b2;font-size:16px;text-align:center;margin:auto;letter-spacing:4px;}
  .ord-item{font:inherit;font-size:12.5px;line-height:1.4;text-align:left;background:var(--paper);border:1px solid var(--line-2);padding:9px 11px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;gap:8px;align-items:flex-start;font-family:"Public Sans",sans-serif;}
  .ord-item:hover{border-color:var(--navy);background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{flex:0 0 auto;width:18px;height:18px;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;}
  .ord-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .cl-item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line-2);padding:11px 13px;margin-bottom:8px;}
  .cl-item p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:13.5px;line-height:1.5;flex:1 1 260px;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:5px 10px;cursor:pointer;border:1px solid var(--line-2);background:var(--paper-2);color:var(--muted);transition:.14s;text-transform:uppercase;font-family:"Public Sans",sans-serif;}
  .chip:hover{border-color:var(--navy);color:var(--navy);}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .cl-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .criterios{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;}
  .criterios li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#4a4a4a;line-height:1.55;}
  .criterios input{margin-top:2px;accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto;}
  textarea{width:100%;font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;line-height:24px;color:var(--ink);padding:12px 16px;border:1px solid var(--bronze-line);background-color:#fdfaf3;background-image:linear-gradient(transparent 23px,rgba(20,33,61,.06) 23px 24px);background-size:100% 24px;background-attachment:local;resize:vertical;outline:none;}
  textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e;font-style:italic;}
  .feedback{margin-top:16px;padding:0;overflow:hidden;max-height:0;opacity:0;transition:.3s;border-left:3px solid transparent;}
  .feedback.show{max-height:700px;opacity:1;padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft);border-left-color:var(--ok);color:#1d4526;}
  .feedback.mal{background:var(--bad-soft);border-left-color:var(--bad);color:#5c1414;}
  .feedback.info{background:var(--bronze-soft);border-left-color:var(--bronze);color:#5a3f22;}
  .feedback strong{display:block;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px;}
  .feedback p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.6;}
  .ej-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .modelo{display:none;margin-top:14px;background:var(--paper-2);border-left:3px solid var(--navy);padding:13px 16px;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.65;color:var(--navy-dark);}
  .modelo.show{display:block;animation:fade .3s ease;}
  .modelo strong{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:5px;}
  .modelo code{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;background:#eef2f8;padding:1px 4px;border-radius:3px;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .cuaderno{margin-top:32px;padding-top:22px;border-top:1px solid var(--navy);position:relative;}
  .cuaderno::before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--bronze-line);}
  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--bronze-line);}
  .nav-foot .btn{flex:1;max-width:220px;text-align:center;}
  .nav-foot .btn:disabled{opacity:.35;cursor:not-allowed;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px;}
  .form-grid .full{grid-column:1/-1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--bronze-dark);font-family:"Public Sans",sans-serif;}
  .field label small{font-weight:500;font-style:italic;letter-spacing:.2px;text-transform:none;color:var(--muted);margin-left:4px;}

const STORAGE_TALLER   = "cuaderno_lms_taller_v1";

let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_CUADERNO)) || {}; } catch(e){ progreso = {}; }

  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));
if(TECNICAS_FLAT.length) actualId = TECNICAS_FLAT[0].id;

function guardarProg(){ try{ localStorage.setItem(STORAGE_CUADERNO, JSON.stringify(progreso)); }catch(e){} }
function guardarDrafts(){ try{ localStorage.setItem(STORAGE_TALLER, JSON.stringify(drafts)); }catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function nuevoId(){ return "l" + Date.now() + Math.random().toString(36).slice(2,7); }
function getPlantilla(id){ return PLANTILLAS.find(p=>p.id===id); }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
function boton(txt, cls){ const b=document.createElement("button"); b.className="btn "+(cls||"primary"); b.textContent=txt; return b; }
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderMenu(){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(document.getElementById("search").value||"");
  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;
    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>'+cat.emoji+'</span><span>'+cat.nombre+'</span><span class="cat-count">'+hechas+"/"+cat.tecnicas.length+'</span><span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);
    const bar = el("div","cat-bar");
    const bf = document.createElement("i");
    bf.style.width = (hechas/cat.tecnicas.length*100)+"%";
    bar.appendChild(bf); div.appendChild(bar);
    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));
    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>'+t.nombre+'</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){ const t = TECNICAS_FLAT.find(x=>x.id===id); return t ? t.catId : null; }

function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x=>x.id===id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";
  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "LMS\nPYTHON");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn); panel.appendChild(seal);

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bi = CATEGORIAS.findIndex(c=>c.id===t.catId)+1;
  head.appendChild(el("div","tech-pos", "Técnica "+(idx+1)+" de "+TECNICAS_FLAT.length+" · Bloque "+bi+"/5"));
  panel.appendChild(head);
  panel.appendChild(el("div","rule"));

  const block = CATEGORIAS.find(c=>c.id===t.catId);
  const dots = el("div","block-dots");
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot"+(getProg(bt.id).ok?" done":"")+(bt.id===t.id?" current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  panel.appendChild(dots);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");
  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","• Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Voltee la tarjeta para ver el ejemplo ↻"));
  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","• Ejemplo"));
  const pre = el("p");
  pre.innerHTML = escapeHtml(t.ejemplo).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  back.appendChild(pre);
  back.appendChild(el("span","fc-hint","↻ Toque de nuevo para volver al concepto"));
  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);
  const flipBtn = boton("↻ Voltear tarjeta","ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "Ejercicio interactivo <span>compruebe su comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));
  const body = el("div"); sec.appendChild(body);
  const fb = el("div","feedback"); sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "Cuaderno técnico <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);
  const ta = document.createElement("textarea");
  ta.rows = 6; ta.placeholder = "Escriba aquí sus notas, código propio, dudas técnicas, decisiones de diseño…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);
  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx===0;
  next.disabled = idx===TECNICAS_FLAT.length-1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n===1?" palabra":" palabras");

  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");

      getProg(t.id).nota = ta.value;
      guardarProg();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});

function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo==="quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo==="fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo==="order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo==="classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo==="open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback "+tipo+" show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}
function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const L = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">'+L[i]+'</span><span>'+escapeHtml(op)+'</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i===ej.correcta;
      Array.from(wrap.children).forEach((c,j) => {
        c.disabled = true;
        if(j===ej.correcta) c.classList.add("correcta");
        if(j===i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok?"ok":"mal", ok?"✓ Correcto":"✗ Revise su respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}
function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length-1){
      const inp = document.createElement("input");
      inp.type="text"; inp.className="hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key==="Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i=>!i.value.trim())){
      mostrarFeedback(fb,"info","Complete todos los huecos","Escriba una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i]||[]).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok?"ok":"mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos===total;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto ? "✓ "+aciertos+" de "+total+" correctas" : "✗ "+aciertos+" de "+total+" correctas",
      ej.retro + (perfecto?"":" · Respuestas válidas: " + ej.respuestas.map((r,i)=>(i+1)+") "+r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}
function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i)=>({txt,i})));
  const seq = [];
  const wrap = el("div","order-wrap");
  const cA = el("div","order-col");
  cA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool"); cA.appendChild(poolEl);
  const cB = el("div","order-col");
  cB.appendChild(el("h4", null, "Su secuencia"));
  const seqEl = el("div","seq"); cB.appendChild(seqEl);
  wrap.appendChild(cA); wrap.appendChild(cB);
  cont.appendChild(wrap);
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  function pintar(){
    poolEl.innerHTML=""; seqEl.innerHTML="";
    pool.forEach((o,k)=>{
      const b = document.createElement("button");
      b.className="ord-item"; b.textContent=o.txt;
      b.onclick=()=>{ if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o,k)=>{
      const b = document.createElement("button");
      b.className="ord-item";
      b.innerHTML = '<span class="num">'+(k+1)+'</span><span>'+o.txt+'</span>';
      b.onclick=()=>{ if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();
  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length!==correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pase todos los elementos a la columna de la derecha.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo,k)=>{
      const ok = seq[k].i===k;
      nodo.classList.add(ok?"ok":"mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos===correcto.length;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto?"✓ Secuencia correcta":"✗ "+aciertos+" de "+correcto.length+" en su lugar",
      perfecto ? ej.retro : "Empieza por: «"+correcto[0].slice(0,70)+"…». "+ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function renderClassify(ej, cont, fb, techId){
  const sel = new Array(ej.items.length).fill(null);
  ej.items.forEach((it,i)=>{
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat,ci)=>{
      const c = document.createElement("button");
      c.className="chip"; c.textContent=cat;
      c.onclick=()=>{
        if(row.dataset.locked) return;
        sel[i]=ci;
        Array.from(chips.children).forEach((x,xi)=>x.classList.toggle("sel", xi===ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(sel.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigne una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila,i)=>{
      fila.dataset.locked = "1";
      const ok = sel[i]===ej.items[i].cat;
      fila.classList.add(ok?"ok":"mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c=>c.disabled=true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:11px;color:#8b1e1e;font-weight:700;letter-spacing:.4px;";
        nota.textContent = "→ Correcto: "+ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos===ej.items.length;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto?"✓ Clasificación correcta":"✗ "+aciertos+" de "+ej.items.length+" correctas",
      ej.retro||"");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 6; ta.placeholder = "Redacte aquí su respuesta…";
  cont.appendChild(ta);
  const ul = el("ul","criterios"); ul.style.marginTop="14px";
  ej.criterios.forEach((c,i)=>{
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type="checkbox"; cb.id = "crit_"+techId+"_"+i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);
  const mod = el("div","modelo");
  const pre = el("div");
  pre.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + escapeHtml(ej.modelo);
  mod.appendChild(pre);
  cont.appendChild(mod);
  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escriba primero su respuesta","Redacte al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados===total?"ok":"info",
      marcados===total?"✓ Autoevaluación completa":"Autoevaluación: "+marcados+"/"+total,
      "Compare su respuesta con el modelo: ¿qué ideas coinciden? ¿qué le falta? ¿qué aporta usted?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardarProg();
    actualizarProgreso(); renderMenu();
    const block = CATEGORIAS.find(c=>c.tecnicas.some(t=>t.id===id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i)=>{
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t=>getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas+" / "+total;
  document.getElementById("progressFill").style.width = (hechas/total*100)+"%";
}

/* =====================================================================
   TALLER · RENDER
   ===================================================================== */
function renderMenuTaller(){
  const mp = document.getElementById("menuPlantillas");
  mp.innerHTML = "";
  PLANTILLAS.forEach(p=>{
    const b = document.createElement("button");
    b.className = "side-item" + ((vistaTaller.tipo==="plantilla" && vistaTaller.id===p.id) ? " active":"");
    b.innerHTML = `<span class="icon">${p.icon}</span><span class="label">${p.nombre}<small>${p.sub}</small></span>`;
    b.onclick = () => { vistaTaller = { tipo:"plantilla", id:p.id }; cerrarSidebar(); abrirTaller(); };
    mp.appendChild(b);
  });
  const md = document.getElementById("menuDrafts");
  md.innerHTML = "";
  if(!drafts.length){
    md.appendChild(el("div","empty-mini","Aún no hay artefactos guardados."));
  } else {
    drafts.slice().reverse().forEach(d=>{
      const p = getPlantilla(d.plantillaId);
      if(!p) return;
      const wrap = el("div","draft-item" + (vistaTaller.tipo==="draft" && vistaTaller.id===d.id ? " active":""));
      const title = el("div","di-title");
      const t = (d.campos.clase || d.campos.tabla || d.campos.tarea || d.campos.sprint || d.campos.proyecto || d.campos.modulo || p.nombre).slice(0,42);
      title.innerHTML = `${t}<small>${p.nombre} · ${d.fecha}</small>`;
      wrap.appendChild(title);
      const del = el("button","di-del","×");
      del.onclick = (ev)=>{ ev.stopPropagation(); eliminarDraft(d.id); };
      wrap.appendChild(del);
      wrap.onclick = () => { vistaTaller = { tipo:"draft", id:d.id }; cerrarSidebar(); abrirTaller(); };
      md.appendChild(wrap);
    });
  }
  document.getElementById("statCount").textContent = drafts.length;
}
function eliminarDraft(id){
  if(!confirm("¿Eliminar este artefacto guardado? Esta acción no se puede deshacer.")) return;
  drafts = drafts.filter(d=>d.id!==id);
  guardarDrafts();
  if(vistaTaller.tipo==="draft" && vistaTaller.id===id){
    vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id };
  }
  renderMenuTaller(); abrirTaller();
}
function abrirTaller(){
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";
  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "TALLER\nLMS");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn); panel.appendChild(seal);

  if(vistaTaller.tipo==="plantilla"){
    const p = getPlantilla(vistaTaller.id);
    const head = el("div","tech-head");
    head.appendChild(el("span","badge", "Taller · " + p.genero));
    head.appendChild(el("h2", null, p.nombre));
    head.appendChild(el("p","lead", p.desc));
    panel.appendChild(head);
    panel.appendChild(el("div","rule"));

    const hint = el("p","hint");
    hint.innerHTML = "<strong>Cómo usar:</strong> complete los campos. La vista previa se genera en vivo con el código o texto resultante. Puede guardar el artefacto en <em>Mis artefactos</em>, copiarlo o descargarlo como archivo.";
    panel.appendChild(hint);

    const form = el("div","form-grid");
    p.campos.forEach(c=>{
      const f = el("div","field" + (c.full?" full":""));
      f.appendChild(el("label", null, c.label));
      const input = document.createElement(c.textarea ? "textarea" : "input");
      if(!c.textarea) input.type = "text";
      input.placeholder = c.ph || "";
      input.id = "field_"+c.id;
      input.addEventListener("input", actualizarPreviewTaller);
      f.appendChild(input);
      form.appendChild(f);
    });
    panel.appendChild(form);

    const st = el("h3","sec-title");
    st.innerHTML = "Vista previa <span>se actualiza automáticamente</span>";
    panel.appendChild(st);

    const prev = el("div","preview-wrap");
    const prevIn = el("div","preview-inner");
    prevIn.id = "previewText";
    prev.appendChild(prevIn);
    panel.appendChild(prev);

    const acts = el("div","preview-actions");
    const bSave = boton("Guardar en Mis artefactos","primary");
    bSave.onclick = () => guardarDesdePlantilla(p);
    const bCopy = boton("Copiar texto","ghost");
    bCopy.onclick = () => copiarTexto(prevIn.textContent);
    const bDl = boton("Descargar .txt","ghost");
    bDl.onclick = () => descargarTxt(prevIn.textContent, p.id);
    const bClear = boton("Limpiar campos","ghost");
    bClear.onclick = () => { p.campos.forEach(c=>{ const i=document.getElementById("field_"+c.id); if(i) i.value=""; }); actualizarPreviewTaller(); };
    acts.appendChild(bSave); acts.appendChild(bCopy); acts.appendChild(bDl); acts.appendChild(bClear);
    panel.appendChild(acts);
    setTimeout(actualizarPreviewTaller, 0);

  } else if(vistaTaller.tipo==="draft"){
    const d = drafts.find(x=>x.id===vistaTaller.id);
    if(!d){ vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; abrirTaller(); return; }
    const p = getPlantilla(d.plantillaId);
    if(!p){ vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; abrirTaller(); return; }

    const head = el("div","tech-head");
    head.appendChild(el("span","badge", "Artefacto guardado · " + p.genero));
    const t = (d.campos.clase || d.campos.tabla || d.campos.tarea || d.campos.sprint || d.campos.proyecto || d.campos.modulo || p.nombre).slice(0,60);
    head.appendChild(el("h2", null, t));
    head.appendChild(el("p","lead", "Guardado el " + d.fecha + ". Puede editarlo; los cambios se guardan automáticamente."));
    panel.appendChild(head);
    panel.appendChild(el("div","rule"));

    const hint = el("p","hint");
    hint.innerHTML = "Edite los campos y la vista previa se actualizará. Los cambios se guardan automáticamente.";
    panel.appendChild(hint);

    const form = el("div","form-grid");
    p.campos.forEach(c=>{
      const f = el("div","field" + (c.full?" full":""));
      f.appendChild(el("label", null, c.label));
      const input = document.createElement(c.textarea ? "textarea" : "input");
      if(!c.textarea) input.type = "text";
      input.placeholder = c.ph || "";
      input.id = "field_"+c.id;
      input.value = d.campos[c.id] || "";
      input.addEventListener("input", ()=>{
        d.campos[c.id] = input.value;
        d.textoGenerado = p.template(d.campos);
        guardarDrafts();
        actualizarPreviewTaller();
      });
      f.appendChild(input);
      form.appendChild(f);
    });
    panel.appendChild(form);

    const st = el("h3","sec-title");
    st.innerHTML = "Vista previa <span>se actualiza automáticamente</span>";
    panel.appendChild(st);

    const prev = el("div","preview-wrap");
    const prevIn = el("div","preview-inner");
    prevIn.id = "previewText";
    prev.appendChild(prevIn);
    panel.appendChild(prev);

    const acts = el("div","preview-actions");
    const bCopy = boton("Copiar texto","primary");
    bCopy.onclick = () => copiarTexto(prevIn.textContent);
    const bDl = boton("Descargar .txt","ghost");
    bDl.onclick = () => descargarTxt(prevIn.textContent, p.id);
    const bNew = boton("Nuevo con esta plantilla","ghost");
    bNew.onclick = () => { vistaTaller = { tipo:"plantilla", id:p.id }; abrirTaller(); };
    const bDel = boton("Eliminar artefacto","danger");
    bDel.onclick = () => eliminarDraft(d.id);
    acts.appendChild(bCopy); acts.appendChild(bDl); acts.appendChild(bNew); acts.appendChild(bDel);
    panel.appendChild(acts);
    setTimeout(actualizarPreviewTaller, 0);
  }
}
function actualizarPreviewTaller(){
  const elPrev = document.getElementById("previewText");
  if(!elPrev) return;
  if(vistaTaller.tipo==="plantilla"){
    const p = getPlantilla(vistaTaller.id);
    const datos = {};
    p.campos.forEach(c=>{
      const inp = document.getElementById("field_"+c.id);
      datos[c.id] = inp ? inp.value.trim() : "";
    });
    elPrev.textContent = p.template(datos) + "\n\n";
  } else if(vistaTaller.tipo==="draft"){
    const d = drafts.find(x=>x.id===vistaTaller.id);
    if(!d) return;
    const p = getPlantilla(d.plantillaId);
    const datos = {};
    p.campos.forEach(c=>{
      const inp = document.getElementById("field_"+c.id);
      datos[c.id] = inp ? inp.value : (d.campos[c.id]||"");
    });
    elPrev.textContent = p.template(datos) + "\n\n";
  }
}
function guardarDesdePlantilla(p){
  const datos = {};
  let vacio = true;
  p.campos.forEach(c=>{
    const inp = document.getElementById("field_"+c.id);
    const v = inp ? inp.value.trim() : "";
    datos[c.id] = v;
    if(v) vacio = false;
  });
  if(vacio){ mostrarToast("Llene al menos un campo antes de guardar."); return; }
  const nuevo = {
    id: nuevoId(),
    plantillaId: p.id,
    campos: datos,
    textoGenerado: p.template(datos),
    fecha: new Date().toLocaleDateString("es-CO", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })
  };
  drafts.push(nuevo);
  guardarDrafts();
  mostrarToast("✓ Guardado en Mis artefactos");
  vistaTaller = { tipo:"draft", id:nuevo.id };
  renderMenuTaller();
  abrirTaller();
}
function copiarTexto(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>mostrarToast("✓ Texto copiado"), ()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); mostrarToast("✓ Texto copiado"); } catch(e){ mostrarToast("No se pudo copiar"); }
  document.body.removeChild(ta);
}
function descargarTxt(txt, nombreBase){
  const blob = new Blob([txt], { type:"text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const fecha = new Date().toISOString().slice(0,10);
  a.download = `${nombreBase}_${fecha}.txt`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarToast("✓ Archivo descargado");
}
let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* =====================================================================
   CAMBIO DE MODO
   ===================================================================== */
function cambiarModo(m){
  modo = m;
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.mode===m);
  });
  document.getElementById("progressWrap").style.display = m==="cuaderno" ? "flex" : "none";
  document.getElementById("statWrap").style.display = m==="taller" ? "flex" : "none";
  document.getElementById("btnNew").style.display = m==="taller" ? "inline-block" : "none";
  document.getElementById("menu").style.display = m==="cuaderno" ? "block" : "none";
  document.getElementById("menuTaller").style.display = m==="taller" ? "block" : "none";
  document.getElementById("search").style.display = m==="cuaderno" ? "block" : "none";
  cerrarSidebar();
  if(m==="cuaderno"){ renderMenu(); abrirTecnica(actualId); actualizarProgreso(); }
  else { renderMenuTaller(); abrirTaller(); }
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = () => cambiarModo(t.dataset.mode);
});
document.getElementById("btnNew").onclick = () => {
  vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id };
  cerrarSidebar();
  renderMenuTaller();
  abrirTaller();
  window.scrollTo({top:0, behavior:"smooth"});
};

/* =====================================================================
   SIDEBAR / RESET / BÚSQUEDA
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;
document.getElementById("search").addEventListener("input", renderMenu);
document.getElementById("btnReset").onclick = () => {
  const msg = modo==="cuaderno"
    ? "¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer."
    : "¿Borrar todos los artefactos guardados del taller? Esta acción no se puede deshacer.";
  if(!confirm(msg)) return;
  if(modo==="cuaderno"){ progreso = {}; guardarProg(); abrirTecnica(TECNICAS_FLAT[0].id); actualizarProgreso(); }
  else { drafts = []; guardarDrafts(); vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; renderMenuTaller(); abrirTaller(); }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
cambiarModo("cuaderno");
</script>
