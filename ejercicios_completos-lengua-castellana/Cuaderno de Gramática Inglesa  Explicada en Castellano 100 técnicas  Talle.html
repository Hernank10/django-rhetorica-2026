<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Gramática Inglesa · Explicada en Castellano · 100 técnicas + Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0; --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);border-bottom:3px double var(--navy);box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .seal{width:50px;height:50px;flex:0 0 auto;border-radius:50%;padding:3px;border:1.5px dashed var(--bronze);display:grid;place-items:center;}
  .seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:15px;position:relative;}
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:6px;color:var(--bronze);}
  .seal-inner::before{top:5px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:5px;left:50%;transform:translateX(-50%);}
  .brand h1{font-family:"PT Serif",Georgia,serif;font-size:14.5px;margin:0;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tabs{display:flex;gap:0;border:1px solid var(--navy);background:var(--paper);}
  .tab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:none;background:transparent;color:var(--navy);border-right:1px solid var(--navy);transition:.15s;font-family:"Public Sans",sans-serif;}
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--navy-soft);}
  .tab.active{background:var(--navy);color:var(--paper);}
  .progress-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .progress-bar{width:130px;height:6px;border:1px solid var(--line-2);background:#f0ece0;overflow:hidden;}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .stat strong{font-family:"PT Serif",Georgia,serif;font-size:15px;color:var(--navy);font-weight:700;padding:0 5px;}
  .btn{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--paper);color:var(--navy);transition:.16s;font-family:"Public Sans",sans-serif;}
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy);color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc;color:var(--navy);}
  .btn.danger{border-color:var(--bad);color:var(--bad);}
  .btn.danger:hover{background:var(--bad-soft);}
  .only-mobile{display:none;}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:22px;max-width:1400px;margin:0 auto;padding:22px;align-items:start;}
  .sidebar{position:sticky;top:100px;max-height:calc(100vh - 124px);overflow-y:auto;background:var(--paper);border:1px solid var(--navy);padding:4px;box-shadow:var(--shadow);}
  .sidebar-inner{border:1px solid var(--bronze-line);padding:12px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);}
  #search{width:100%;font-size:12px;padding:8px 11px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px;font-family:"Public Sans",sans-serif;}
  #search:focus{border-color:var(--navy);}
  .cat{margin-bottom:4px;}
  .cat-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;padding:9px 10px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--navy);text-transform:uppercase;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .cat-head:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto;font-size:9px;color:var(--bronze);transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{font-family:"PT Serif",Georgia,serif;font-size:10.5px;font-weight:700;background:var(--bronze-soft);color:var(--bronze-dark);padding:1px 7px;border:1px solid var(--bronze-line);}
  .cat-bar{height:3px;background:#e8e2d2;margin:0 10px 6px;overflow:hidden;border:1px solid var(--line);}
  .cat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .cat-body{display:none;padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:10.5px;color:var(--muted);padding:0 10px 8px;line-height:1.5;font-style:italic;}
  .tech-link{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:7px 10px;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .tech-link:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-link .dot{flex:0 0 auto;width:13px;height:13px;margin-top:1px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-size:8px;color:transparent;}
  .tech-link.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}
  .sidebar-label{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--bronze-line);}
  .sidebar-section{margin-bottom:16px;}
  .side-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:8px 10px;border-left:3px solid transparent;transition:.15s;font-family:"Public Sans",sans-serif;}
  .side-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .side-item.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .side-item .icon{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;color:var(--navy);}
  .side-item.active .icon{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .side-item .label{flex:1;min-width:0;}
  .side-item .label small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px;}
  .empty-mini{font-size:11px;color:var(--muted);font-style:italic;padding:10px;text-align:center;border:1px dashed var(--line-2);background:var(--paper-2);}
  .draft-item{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-left:3px solid transparent;cursor:pointer;transition:.15s;font-size:11px;line-height:1.35;font-family:"Public Sans",sans-serif;border-bottom:1px solid var(--line);}
  .draft-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .draft-item.active{background:var(--navy-soft);border-left-color:var(--navy);}
  .draft-item .di-title{flex:1;min-width:0;color:#3a3a3a;font-weight:600;}
  .draft-item .di-title small{display:block;font-weight:400;font-size:10px;color:var(--muted);margin-top:2px;}
  .draft-item .di-del{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .draft-item .di-del:hover{color:var(--bad);}
  .panel{background:var(--paper);border:1px solid var(--navy);padding:6px;box-shadow:var(--shadow);}
  .panel-inner{border:1px solid var(--bronze-line);padding:26px 30px 30px;background:radial-gradient(circle at 100% 0%,#f7f2e8 0%,transparent 40%),var(--paper);position:relative;}
  .panel-seal{position:absolute;top:18px;right:22px;width:70px;height:70px;border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.75;}
  .panel-seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:10px;text-align:center;line-height:1.1;}
  .tech-head{margin-bottom:20px;padding-right:90px;}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);border:1px solid var(--bronze-line);padding:3px 10px;margin-bottom:12px;}
  .tech-head h2{margin:0;font-family:"PT Serif",Georgia,serif;font-size:24px;line-height:1.2;letter-spacing:-.3px;font-weight:700;color:var(--navy);}
  .tech-head p.lead{margin:8px 0 0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.6;color:var(--muted);}
  .tech-pos{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .rule{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:16px 0 20px;}
  .block-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .bdot{width:11px;height:11px;border:1px solid var(--line-2);background:var(--paper);cursor:pointer;transition:.15s;}
  .bdot:hover{transform:scale(1.2);border-color:var(--bronze);}
  .bdot.done{background:var(--ok);border-color:var(--ok);}
  .bdot.current{background:var(--bronze);border-color:var(--bronze-dark);}
  .flashcard{perspective:1600px;margin:0 0 14px;cursor:pointer;border:1px solid var(--navy);padding:4px;background:var(--paper);box-shadow:var(--shadow);}
  .fc-inner{position:relative;min-height:clamp(270px,35vh,330px);transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);border:1px solid var(--bronze-line);}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px 26px;display:flex;flex-direction:column;overflow:auto;background:var(--paper);background-image:linear-gradient(transparent 27px,rgba(20,33,61,.06) 27px 28px);background-size:100% 28px;background-position:0 14px;}
  .fc-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:15.5px;line-height:28px;color:var(--ink);}
  .fc-back{transform:rotateY(180deg);background:#faf6ec;}
  .fc-back p{color:var(--navy-dark);font-style:italic;}
  .fc-tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:12px;display:block;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);}
  .fc-hint{margin-top:auto;padding-top:14px;font-size:10.5px;color:#9c907c;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .flip-btn{margin:0 0 26px;}
  .sec-title{display:flex;align-items:center;gap:10px;font-family:"PT Serif",Georgia,serif;font-size:16px;font-weight:700;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title span{font-size:10px;font-weight:700;color:var(--muted);margin-left:auto;letter-spacing:.6px;text-transform:uppercase;}
  .consigna{font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper-2);border-left:3px solid var(--bronze);padding:12px 16px;margin:0 0 16px;}
  .opciones{display:flex;flex-direction:column;gap:8px;}
  .opcion{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:13.5px;line-height:1.5;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);padding:12px 14px;cursor:pointer;transition:.15s;font-family:"Public Sans",sans-serif;}
  .opcion:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft);}
  .opcion:disabled{cursor:default;opacity:.9;}
  .opcion .letra{flex:0 0 auto;width:22px;height:22px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line-2);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:12px;font-weight:700;}
  .opcion.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad);color:#fff;border-color:var(--bad);}
  .fill-texto{font-family:"PT Serif",Georgia,serif;font-size:16px;line-height:2.4;margin:0 0 16px;color:var(--ink);}
  .hueco{font:inherit;font-family:"PT Serif",Georgia,serif;font-size:15px;font-style:italic;border:none;border-bottom:1.5px solid var(--bronze);background:transparent;color:var(--bronze-dark);font-weight:700;padding:2px 6px;min-width:110px;text-align:center;outline:none;}
  .hueco:focus{background:var(--bronze-soft);border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);text-decoration:line-through;}
  .order-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .order-col h4{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .pool,.seq{min-height:120px;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .pool{background:var(--paper-2);border:1px dashed var(--line-2);}
  .seq{background:#f4efe2;border:1px solid var(--bronze-line);}
  .pool:empty::after,.seq:empty::after{content:"···";color:#c9c2b2;font-size:16px;text-align:center;margin:auto;letter-spacing:4px;}
  .ord-item{font:inherit;font-size:12.5px;line-height:1.4;text-align:left;background:var(--paper);border:1px solid var(--line-2);padding:9px 11px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;gap:8px;align-items:flex-start;font-family:"Public Sans",sans-serif;}
  .ord-item:hover{border-color:var(--navy);background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{flex:0 0 auto;width:18px;height:18px;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;}
  .ord-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .cl-item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line-2);padding:11px 13px;margin-bottom:8px;}
  .cl-item p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.5;flex:1 1 260px;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:5px 10px;cursor:pointer;border:1px solid var(--line-2);background:var(--paper-2);color:var(--muted);transition:.14s;text-transform:uppercase;font-family:"Public Sans",sans-serif;}
  .chip:hover{border-color:var(--navy);color:var(--navy);}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .cl-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .criterios{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;}
  .criterios li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#4a4a4a;line-height:1.55;}
  .criterios input{margin-top:2px;accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto;}
  textarea{width:100%;font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:26px;color:var(--ink);padding:12px 16px;border:1px solid var(--bronze-line);background-color:#fdfaf3;background-image:linear-gradient(transparent 25px,rgba(20,33,61,.07) 25px 26px);background-size:100% 26px;background-attachment:local;resize:vertical;outline:none;}
  textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e;font-style:italic;}
  .feedback{margin-top:16px;padding:0;overflow:hidden;max-height:0;opacity:0;transition:.3s;border-left:3px solid transparent;}
  .feedback.show{max-height:600px;opacity:1;padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft);border-left-color:var(--ok);color:#1d4526;}
  .feedback.mal{background:var(--bad-soft);border-left-color:var(--bad);color:#5c1414;}
  .feedback.info{background:var(--bronze-soft);border-left-color:var(--bronze);color:#5a3f22;}
  .feedback strong{display:block;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px;}
  .feedback p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.6;}
  .ej-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .modelo{display:none;margin-top:14px;background:var(--paper-2);border-left:3px solid var(--navy);padding:13px 16px;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.65;color:var(--navy-dark);}
  .modelo.show{display:block;animation:fade .3s ease;}
  .modelo strong{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:5px;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .cuaderno{margin-top:32px;padding-top:22px;border-top:1px solid var(--navy);position:relative;}
  .cuaderno::before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--bronze-line);}
  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--bronze-line);}
  .nav-foot .btn{flex:1;max-width:220px;text-align:center;}
  .nav-foot .btn:disabled{opacity:.35;cursor:not-allowed;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px;}
  .form-grid .full{grid-column:1/-1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--bronze-dark);font-family:"Public Sans",sans-serif;}
  .field label small{font-weight:500;font-style:italic;letter-spacing:.2px;text-transform:none;color:var(--muted);margin-left:4px;}
  .field input,.field textarea,.field select{font-family:"PT Serif",Georgia,serif;font-size:14px;padding:8px 11px;border:1px solid var(--bronze-line);background-color:#fdfaf3;color:var(--ink);outline:none;transition:.15s;width:100%;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field input::placeholder,.field textarea::placeholder{color:#a1957e;font-style:italic;}
  .field select{cursor:pointer;}
  .preview-wrap{border:1px solid var(--navy);padding:4px;background:var(--paper);margin-top:6px;}
  .preview-inner{border:1px solid var(--bronze-line);padding:24px 26px;background:var(--paper);font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;max-height:520px;overflow-y:auto;}
  .preview-inner .placeholder{color:#a1957e;font-style:italic;}
  .preview-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--bronze-line);}
  .hint{font-family:"PT Serif",Georgia,serif;font-size:12.5px;font-style:italic;color:var(--muted);background:var(--paper-2);border-left:3px solid var(--bronze);padding:9px 13px;margin:0 0 16px;}
  .hint strong{color:var(--navy);font-style:normal;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:var(--paper);padding:11px 20px;font-family:"Public Sans",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--bronze-line);box-shadow:var(--shadow);opacity:0;transition:.28s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .mode{display:none;}
  .mode.active{display:block;}
  .conj-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:18px 0;}
  .conj-col{border:1px solid var(--bronze-line);background:var(--paper);padding:12px;}
  .conj-col h4{font-family:"PT Serif",Georgia,serif;font-size:11px;color:var(--navy);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);letter-spacing:.3px;text-align:center;text-transform:uppercase;font-weight:800;}
  .conj-col table{width:100%;border-collapse:collapse;font-family:"PT Serif",Georgia,serif;font-size:12.5px;}
  .conj-col td{padding:3px 4px;vertical-align:top;}
  .conj-col td.pron{color:var(--muted);width:38%;font-style:italic;}
  .conj-col td.form{color:var(--navy-dark);font-weight:700;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr;padding:14px;gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:100vh;z-index:100;padding:4px;transform:translateX(-105%);transition:transform .28s ease;overflow-y:auto;top:0;}
    .sidebar.open{transform:none;}
    .scrim{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:99;opacity:0;pointer-events:none;transition:.25s;}
    .scrim.show{opacity:1;pointer-events:auto;}
    .panel-inner{padding:20px 18px 24px;}
    .panel-seal{display:none;}
    .tech-head{padding-right:0;}
    .tech-head h2{font-size:20px;}
    .form-grid{grid-template-columns:1fr;}
    .conj-wrap{grid-template-columns:1fr;}
    .brand p{display:none;}
    .brand h1{font-size:12px;}
    .progress-wrap{display:none;}
  }
</style>
</head>
