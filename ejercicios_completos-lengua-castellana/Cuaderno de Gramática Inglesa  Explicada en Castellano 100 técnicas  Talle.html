<script>
/* =====================================================================
   MODO 1 · 100 TÉCNICAS DE GRAMÁTICA INGLESA EXPLICADA EN CASTELLANO
   ===================================================================== */
const CATEGORIAS = [
/* ---------- Bloque 1 ---------- */
{ id:"e1", nombre:"Fundamentos del inglés", emoji:"📘",
  desc:"Partes de la oración, orden SVO y estructura básica en inglés.",
  tecnicas:[
    {id:"e1_1", nombre:"Partes de la oración",
     concepto:"En inglés las palabras se clasifican igual que en español: noun (sustantivo), verb (verbo), adjective (adjetivo), adverb (adverbio), pronoun (pronombre), preposition (preposición), conjunction (conjunción), article (artículo), interjection (interjección).",
     ejemplo:"«The black cat sleeps quietly»: The (article), black (adjective), cat (noun), sleeps (verb), quietly (adverb).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada palabra de «The big dog runs fast».",
       categorias:["Article","Adjective","Noun","Verb","Adverb"],
       items:[{texto:"The",cat:0},{texto:"big",cat:1},{texto:"dog",cat:2},{texto:"runs",cat:3},{texto:"fast",cat:4}],
       retro:"The: artículo. Big: adjetivo. Dog: sustantivo. Runs: verbo. Fast: adverbio."}},
    {id:"e1_2", nombre:"Orden SVO",
     concepto:"El inglés tiene orden fijo: Subject + Verb + Object. Cambiarlo altera el significado o produce agramaticalidad. «The dog bit the man» ≠ «The man bit the dog».",
     ejemplo:"Correcto: «She reads books». Incorrecto: «Books reads she».",
     ejercicio:{tipo:"fill", consigna:"Ordena según SVO.",
       texto:"Palabras: «the children / played / football» → «The children ___ football».",
       respuestas:[["played"]],
       retro:"Sujeto (the children) + verbo (played) + objeto (football). En inglés el orden es fijo."}},
    {id:"e1_3", nombre:"El sujeto siempre presente",
     concepto:"En inglés, a diferencia del español, el sujeto nunca se omite. Siempre se usa el pronombre personal: «I am», «You are», «He is». No se puede decir «Am tired», sino «I am tired».",
     ejemplo:"Español: «Estoy cansado» (sujeto elidido). Inglés: «I am tired» (sujeto obligatorio).",
     ejercicio:{tipo:"fill", consigna:"Completa con el sujeto obligatorio.",
       texto:"«___ am a student» · «___ is my friend» · «___ are happy».",
       respuestas:[["i","I"],["he","she","it","He","She","It"],["we","you","they","We","You","They"]],
       retro:"En inglés el sujeto siempre se expresa: I am, He is, We are."}},
    {id:"e1_4", nombre:"Artículos: a / an",
     concepto:"«A» se usa ante sonido consonántico («a book», «a university»). «An» ante sonido vocálico («an apple», «an hour»). La regla es por SONIDO, no por letra.",
     ejemplo:"«A university» (suena /juː/). «An hour» (la h es muda). «An honest man».",
     ejercicio:{tipo:"fill", consigna:"Completa con a o an.",
       texto:"«___ apple» · «___ book» · «___ hour» · «___ university».",
       respuestas:[["an"],["a"],["an"],["a"]],
       retro:"An apple (vocal), a book (consonante), an hour (h muda), a university (suena /juː/)."}},
    {id:"e1_5", nombre:"El artículo definido «the»",
     concepto:"«The» se usa con sustantivos específicos o ya mencionados: «I saw a dog. The dog was black». También con únicos (the sun, the moon) y superlativos (the best).",
     ejemplo:"«The book on the table is mine». «The sun rises in the east».",
     ejercicio:{tipo:"fill", consigna:"Coloca «the» donde corresponda.",
       texto:"«I bought ___ book. ___ book is interesting».",
       respuestas:[["a"],["the","The"]],
       retro:"Primera mención: a book. Segunda mención (ya específico): the book."}},
    {id:"e1_6", nombre:"Plural de sustantivos",
     concepto:"El plural regular se forma añadiendo -s. Reglas especiales: -s, -ss, -sh, -ch, -x, -z → -es; consonante + y → -ies; -f/-fe → -ves (algunos); irregulares (man→men, child→children).",
     ejemplo:"Book→books. Box→boxes. City→cities. Knife→knives. Man→men.",
     ejercicio:{tipo:"fill", consigna:"Forma el plural.",
       texto:"«box» → ___ · «city» → ___ · «child» → ___ · «knife» → ___ .",
       respuestas:[["boxes"],["cities"],["children"],["knives"]],
       retro:"Boxes (-x → -es), cities (y → ies), children (irregular), knives (-fe → -ves)."}},
    {id:"e1_7", nombre:"Contables e incontables",
     concepto:"Los contables tienen plural y admiten a/an y números (book, apple). Los incontables no tienen plural y no admiten a/an (water, rice, information). Se usa «some», «much», «a lot of».",
     ejemplo:"«Two books» (contable). «Some water» (incontable). No: «a water» / «two waters».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada sustantivo.",
       categorias:["Contable","Incontable"],
       items:[{texto:"book",cat:0},{texto:"water",cat:1},{texto:"apple",cat:0},{texto:"rice",cat:1},{texto:"information",cat:1},{texto:"chair",cat:0}],
       retro:"Contables: book, apple, chair. Incontables: water, rice, information."}},
    {id:"e1_8", nombre:"«There is» y «there are»",
     concepto:"«There is» con singular («There is a book»). «There are» con plural («There are two books»). Expresan existencia, equivalente a «hay» en español.",
     ejemplo:"«There is a problem». «There are many students». «There isn't any milk».",
     ejercicio:{tipo:"fill", consigna:"Completa con «is» o «are».",
       texto:"«There ___ a cat on the roof» · «There ___ three cars» · «There ___ some water».",
       respuestas:[["is"],["are"],["is"]],
       retro:"«There is» + singular/incontable. «There are» + plural."}},
    {id:"e1_9", nombre:"Posesivo sajón ('s)",
     concepto:"Se añade 's al poseedor: «John's book». Con plural terminado en -s, solo apóstrofo: «the students' books». Con nombres propios terminados en -s, se admite 's o solo apóstrofo.",
     ejemplo:"«Mary's car». «The children's toys». «The girls' room» (varias chicas).",
     ejercicio:{tipo:"fill", consigna:"Aplica el posesivo sajón.",
       texto:"«El libro de Juan» → «___ book». · «Los juguetes de los niños» → «The ___ toys».",
       respuestas:[["john's","Juan's","John's"],["children's"]],
       retro:"«John's book». «The children's toys». Con plural en -s solo apóstrofo: «the girls' room»."}},
    {id:"e1_10", nombre:"Frases básicas de cortesía",
     concepto:"En inglés las fórmulas de cortesía son fijas: please, thank you, excuse me, sorry, you're welcome. Se usan mucho más que en español.",
     ejemplo:"«Could you help me, please?». «Thank you very much». «You're welcome». «Excuse me, where is the station?».",
     ejercicio:{tipo:"fill", consigna:"Completa con la fórmula de cortesía.",
       texto:"«Could you help me, ___ ?» · «Thank you». «___ welcome». · «___ me, where is the station?»",
       respuestas:[["please"],["you're","You're","you are"],["excuse","Excuse"]],
       retro:"Please, you're welcome, excuse me. Las fórmulas de cortesía son obligatorias en inglés."}}
  ]},

/* ---------- Bloque 2 ---------- */
{ id:"e2", nombre:"Sustantivos y pronombres", emoji:"👥",
  desc:"Pronombres personales, posesivos, demostrativos y reflexivos.",
  tecnicas:[
    {id:"e2_1", nombre:"Pronombres personales de sujeto",
     concepto:"I, you, he, she, it, we, you, they. Siempre van ante el verbo. «It» se usa para cosas, animales y para el tiempo/clima.",
     ejemplo:"«I am a teacher». «She is my sister». «It is raining». «They are students».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pronombre.",
       texto:"«___ am happy» (yo) · «___ is my friend» (ella) · «___ are students» (ellos).",
       respuestas:[["i","I"],["she","She"],["they","They"]],
       retro:"I, she, they. Los pronombres personales de sujeto siempre van ante el verbo."}},
    {id:"e2_2", nombre:"Pronombres objeto",
     concepto:"me, you, him, her, it, us, you, them. Van después del verbo o de una preposición. «I saw him», «Give it to me».",
     ejemplo:"«She loves me». «I called them». «Send it to us». «Wait for her».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pronombre objeto.",
       texto:"«I saw ___ (él)» · «Give ___ the book (a mí)» · «Wait for ___ (nosotros)».",
       respuestas:[["him"],["me"],["us"]],
       retro:"Him (él), me (a mí), us (nosotros). Los pronombres objeto van tras verbo o preposición."}},
    {id:"e2_3", nombre:"Adjetivos posesivos",
     concepto:"my, your, his, her, its, our, your, their. Van ante el sustantivo. En inglés siempre concuerdan con el POSEEDOR, no con la cosa poseída.",
     ejemplo:"«My book». «His car» (de él). «Her house» (de ella). «Their children» (de ellos).",
     ejercicio:{tipo:"fill", consigna:"Completa con el posesivo.",
       texto:"«This is ___ book (de mí)» · «___ car is red (de él)» · «___ house is big (de nosotros)».",
       respuestas:[["my"],["his"],["our"]],
       retro:"My, his, our. Concuerdan con el poseedor, no con lo poseído."}},
    {id:"e2_4", nombre:"Pronombres posesivos",
     concepto:"mine, yours, his, hers, its, ours, yours, theirs. Sustituyen al nombre + posesivo: «This book is mine» (= my book).",
     ejemplo:"«This is mine». «That car is hers». «The books are ours».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pronombre posesivo.",
       texto:"«This book is ___ (de mí)» · «That car is ___ (de ella)» · «The house is ___ (de nosotros)».",
       respuestas:[["mine"],["hers"],["ours"]],
       retro:"Mine, hers, ours. Los pronombres posesivos sustituyen a «posesivo + sustantivo»."}},
    {id:"e2_5", nombre:"Pronombres demostrativos",
     concepto:"this/these (cerca), that/those (lejos). This y that con singular; these y those con plural. Funcionan como adjetivos o pronombres.",
     ejemplo:"«This book is mine» (adjetivo). «This is mine» (pronombre). «Those are my friends».",
     ejercicio:{tipo:"fill", consigna:"Completa con el demostrativo.",
       texto:"«___ book here is mine (cerca, singular)» · «___ books there are yours (lejos, plural)».",
       respuestas:[["this","This"],["those","Those"]],
       retro:"This (cerca, sing), those (lejos, plural). Concordancia con número."}},
    {id:"e2_6", nombre:"Pronombres reflexivos",
     concepto:"myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. Se usan cuando sujeto y objeto son la misma persona: «I hurt myself». También para énfasis: «I did it myself».",
     ejemplo:"«She looked at herself in the mirror». «We enjoyed ourselves». «They built it themselves».",
     ejercicio:{tipo:"fill", consigna:"Completa con el reflexivo.",
       texto:"«I hurt ___ » · «She looked at ___ » · «We enjoyed ___ ».",
       respuestas:[["myself"],["herself"],["ourselves"]],
       retro:"Myself, herself, ourselves. El reflexivo concuerda con el sujeto."}},
    {id:"e2_7", nombre:"Pronombres relativos",
     concepto:"who (personas), which (cosas), that (ambas, en defining), whose (posesión), where (lugar), when (tiempo). Introducen oraciones de relativo.",
     ejemplo:"«The man who called you is my uncle». «The book which I read is good». «The city where I live».",
     ejercicio:{tipo:"fill", consigna:"Completa con el relativo.",
       texto:"«The man ___ called you is my uncle» · «The book ___ I read is good» · «The girl ___ father is a doctor».",
       respuestas:[["who","that"],["which","that"],["whose"]],
       retro:"Who/that: personas. Which/that: cosas. Whose: posesión."}},
    {id:"e2_8", nombre:"Pronombres indefinidos",
     concepto:"somebody/someone, anybody/anyone, nobody, everybody; something, anything, nothing, everything. Los compuestos con -body y -thing son singulares: «Everyone is here».",
     ejemplo:"«Someone called». «Nothing happened». «Everybody is ready».",
     ejercicio:{tipo:"fill", consigna:"Completa.",
       texto:"«___ called me (alguien)» · «___ happened (nada)» · «___ is ready (todos)».",
       respuestas:[["someone","somebody"],["nothing"],["everyone","everybody"]],
       retro:"Someone, nothing, everyone. Los indefinidos con -body y -thing son singulares."}},
    {id:"e2_9", nombre:"Uso de «it»",
     concepto:"«It» tiene varios usos: pronombre de cosa («It is red»), sujeto impersonal para clima («It is raining»), tiempo («It is 5 o'clock»), distancia («It is far»).",
     ejemplo:"«It is cold». «It is 3 p.m.». «It is important to study». «It is my book».",
     ejercicio:{tipo:"fill", consigna:"Completa con «it».",
       texto:"«___ is raining» · «___ is 5 o'clock» · «___ is important to study».",
       respuestas:[["it","It"],["it","It"],["it","It"]],
       retro:"«It» es el sujeto impersonal obligatorio en inglés para clima, tiempo y estructuras con infinitivo."}},
    {id:"e2_10", nombre:"Pronombres recíprocos",
     concepto:"«Each other» (dos) y «one another» (más de dos) expresan reciprocidad: «They love each other». «We help one another».",
     ejemplo:"«They looked at each other». «The students help one another».",
     ejercicio:{tipo:"fill", consigna:"Completa con el recíproco.",
       texto:"«They love ___ (dos personas)» · «We help ___ (varios)».",
       respuestas:[["each other"],["one another"]],
       retro:"Each other para dos. One another para más de dos (en la práctica se usan indistintamente)."}}
  ]},

/* ---------- Bloque 3 ---------- */
{ id:"e3", nombre:"Adjetivos y adverbios", emoji:"🎨",
  desc:"Comparativos, superlativos, orden de adjetivos, adverbios de modo.",
  tecnicas:[
    {id:"e3_1", nombre:"Adjetivo: posición",
     concepto:"En inglés el adjetivo va ANTES del sustantivo: «a red car» (no «a car red»). Cuando funciona como atributo tras verbo copulativo: «The car is red».",
     ejemplo:"«A beautiful house». «The house is beautiful». Nunca: «a house beautiful».",
     ejercicio:{tipo:"fill", consigna:"Ordena correctamente.",
       texto:"Palabras: «a / car / red» → «a ___ car».",
       respuestas:[["red"]],
       retro:"El adjetivo en inglés va ante el sustantivo: «a red car»."}},
    {id:"e3_2", nombre:"Comparativo de superioridad",
     concepto:"Adjetivos cortos (1 sílaba): -er + than («taller than»). Adjetivos largos (2+ sílabas): more + adj + than («more interesting than»). Irregulares: good→better, bad→worse, far→farther/further.",
     ejemplo:"«She is taller than me». «This is more interesting than that». «My English is better than yours».",
     ejercicio:{tipo:"fill", consigna:"Forma el comparativo.",
       texto:"«tall» → ___ than · «interesting» → ___ than · «good» → ___ than.",
       respuestas:[["taller"],["more interesting"],["better"]],
       retro:"Cortos: -er. Largos: more + adj. Irregulares: good→better, bad→worse."}},
    {id:"e3_3", nombre:"Superlativo",
     concepto:"Cortos: the + -est («the tallest»). Largos: the most + adj («the most interesting»). Irregulares: the best, the worst, the farthest.",
     ejemplo:"«She is the tallest in the class». «This is the most interesting book».",
     ejercicio:{tipo:"fill", consigna:"Forma el superlativo.",
       texto:"«tall» → the ___ · «interesting» → the ___ · «good» → the ___ .",
       respuestas:[["tallest"],["most interesting"],["best"]],
       retro:"The tallest, the most interesting, the best. Superlativos irregulares: best, worst, farthest."}},
    {id:"e3_4", nombre:"Comparativo de igualdad",
     concepto:"«as + adj + as» (tan... como). Negativo: «not as + adj + as» o «not so + adj + as».",
     ejemplo:"«She is as tall as me». «He is not as fast as you».",
     ejercicio:{tipo:"fill", consigna:"Completa la comparación.",
       texto:"«She is ___ tall ___ me» · «He is not ___ fast ___ you».",
       respuestas:[["as"],["as"],["as","so"],["as"]],
       retro:"«As tall as», «not as/so fast as». Estructura de igualdad."}},
    {id:"e3_5", nombre:"Orden de adjetivos",
     concepto:"Cuando hay varios adjetivos, el orden es: opinion + size + age + shape + colour + origin + material + purpose + noun. «A beautiful big old round brown Italian leather bag».",
     ejemplo:"«A nice small old round black French wooden table».",
     ejercicio:{tipo:"fill", consigna:"Ordena los adjetivos.",
       texto:"Palabras: «big / a / old / house» → «a ___ ___ ___ house» (a + ? + ? + ?).",
       respuestas:[["big"],["old"],[""],[""]],
       retro:"Orden: a + big (size) + old (age) + house. Aunque el orden estricto sería: a + big + old + house."}},
    {id:"e3_6", nombre:"Adverbios de modo",
     concepto:"Se forman añadiendo -ly al adjetivo: quick→quickly, careful→carefully. Irregulares: good→well, fast→fast, hard→hard, late→late.",
     ejemplo:"«She sings beautifully». «He works hard». «They arrived late».",
     ejercicio:{tipo:"fill", consigna:"Forma el adverbio.",
       texto:"«quick» → ___ · «careful» → ___ · «good» → ___ .",
       respuestas:[["quickly"],["carefully"],["well"]],
       retro:"Quick→quickly, careful→carefully. Irregular: good→well."}},
    {id:"e3_7", nombre:"Adverbios de frecuencia",
     concepto:"always, usually, often, sometimes, rarely, never. Van ante el verbo principal, pero tras el verbo «to be»: «I always study». «I am always tired».",
     ejemplo:"«She never smokes». «He is usually late». «We often go to the cinema».",
     ejercicio:{tipo:"fill", consigna:"Coloca el adverbio.",
       texto:"«I ___ study (always)» · «He is ___ tired (usually)» · «They ___ go (never)».",
       respuestas:[["always"],["usually"],["never"]],
       retro:"Ante verbo principal: «I always study». Tras «to be»: «He is usually tired»."}},
    {id:"e3_8", nombre:"Adjetivos terminados en -ed / -ing",
     concepto:"-ed describe cómo se siente la persona («I am bored»). -ing describe la causa («The book is boring»). Confundirlos es un error frecuente.",
     ejemplo:"«I am interested» (yo siento interés). «The book is interesting» (el libro causa interés).",
     ejercicio:{tipo:"fill", consigna:"Elige la forma correcta.",
       texto:"«I am ___ (bored/boring)» → ___ · «The film is ___ (bored/boring)» → ___ .",
       respuestas:[["bored"],["boring"]],
       retro:"Persona: -ed (bored). Causa: -ing (boring)."}},
    {id:"e3_9", nombre:"«Too» y «enough»",
     concepto:"«Too + adj» (demasiado): «too hot». «Adj + enough» (suficientemente): «old enough». También «too much/many» y «enough + noun».",
     ejemplo:"«It's too hot». «He is old enough to drive». «There is too much noise». «We don't have enough time».",
     ejercicio:{tipo:"fill", consigna:"Completa con too o enough.",
       texto:"«It is ___ hot» · «He is old ___ » · «There is ___ much noise».",
       respuestas:[["too"],["enough"],["too"]],
       retro:"Too + adj. Adj + enough. Too much + incontable."}},
    {id:"e3_10", nombre:"«So» y «such»",
     concepto:"«So + adj/adv» (tan): «so tall». «Such + (a/an) + adj + noun» (tan... que): «such a tall man». Se usan para énfasis y exclamaciones.",
     ejemplo:"«She is so beautiful!». «It was such a beautiful day!». «He drives so fast».",
     ejercicio:{tipo:"fill", consigna:"Completa con so o such.",
       texto:"«She is ___ tall» · «It was ___ a good film» · «They are ___ nice».",
       respuestas:[["so"],["such"],["so"]],
       retro:"So + adj. Such + (a/an) + adj + noun."}}
  ]},

/* ---------- Bloque 4 ---------- */
{ id:"e4", nombre:"Tiempos simples", emoji:"⏱",
  desc:"Present simple/continuous, past simple/continuous, used to.",
  tecnicas:[
    {id:"e4_1", nombre:"Present simple",
     concepto:"Expresa rutinas, hábitos, verdades generales. Estructura: sujeto + verbo (con -s en 3.ª singular). Negativa e interrogativa con do/does.",
     ejemplo:"«I work in a hospital». «She works in a school». «They don't like coffee». «Do you speak English?».",
     ejercicio:{tipo:"fill", consigna:"Completa con el presente simple.",
       texto:"«He ___ (study) every day» · «They ___ (not/like) fish» · «___ she ___ (speak) French?»",
       respuestas:[["studies"],["don't like","do not like"],["does"],["speak"]],
       retro:"En 3.ª singular se añade -s/-es. Negativa con don't/doesn't. Interrogativa con do/does."}},
    {id:"e4_2", nombre:"Present continuous",
     concepto:"Expresa acciones en curso o planes futuros cercanos. Estructura: am/is/are + verbo-ing. Marcadores: now, at the moment, today.",
     ejemplo:"«She is studying right now». «They aren't listening». «I'm meeting Ana tomorrow».",
     ejercicio:{tipo:"fill", consigna:"Completa con presente continuo.",
       texto:"«I ___ (read) a book right now» · «They ___ (not/work) today» · «What ___ you ___ (do)?»",
       respuestas:[["am reading","'m reading"],["aren't working","are not working"],["are"],["doing"]],
       retro:"Am/is/are + -ing. El presente continuo expresa acciones en curso."}},
    {id:"e4_3", nombre:"Present simple vs continuous",
     concepto:"Simple: rutinas y verdades. Continuous: acciones en curso. Algunos verbos de estado (like, know, want, believe) no se usan en continuo.",
     ejemplo:"«I work every day» (rutina). «I am working now» (en curso). «I know the answer» (no «I am knowing»).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada situación.",
       categorias:["Present simple","Present continuous"],
       items:[{texto:"Rutina diaria",cat:0},{texto:"Acción en este momento",cat:1},{texto:"Verdad general",cat:0},{texto:"Plan futuro cercano",cat:1},{texto:"Hábito",cat:0}],
       retro:"Simple: rutina, verdad, hábito. Continuous: en curso, plan cercano."}},
    {id:"e4_4", nombre:"Past simple",
     concepto:"Acciones terminadas en un momento pasado concreto. Regulares: -ed. Irregulares: formas propias (go→went, see→saw). Negativa e interrogativa con did.",
     ejemplo:"«I visited Rome in 2019». «She went to Paris». «They didn't come». «Did you see the film?».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pasado simple.",
       texto:"«I ___ (visit) London last year» · «She ___ (go) to Paris» · «They ___ (not/come)».",
       respuestas:[["visited"],["went"],["didn't come","did not come"]],
       retro:"Visit→visited (regular). Go→went (irregular). Negativa: didn't + infinitivo."}},
    {id:"e4_5", nombre:"Past continuous",
     concepto:"Acciones en desarrollo en un momento pasado. Estructura: was/were + -ing. Se usa con «while», «when» para marcar interrupción.",
     ejemplo:"«I was reading when she called». «They were playing at 6 pm». «While I was cooking, he was watching TV».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pasado continuo.",
       texto:"«I ___ (walk) home when I saw her» · «They ___ (study) all evening».",
       respuestas:[["was walking"],["were studying"]],
       retro:"Was/were + -ing. El pasado continuo sitúa la acción en desarrollo."}},
    {id:"e4_6", nombre:"Past simple vs continuous",
     concepto:"Past simple: acción terminada («I saw him»). Past continuous: acción en desarrollo («I was seeing him» no, sería «I was watching»). Combinación: «I was reading when he arrived».",
     ejemplo:"«I was reading when he arrived». «She called while I was cooking».",
     ejercicio:{tipo:"fill", consigna:"Completa con el tiempo correcto.",
       texto:"«I ___ (read) when he ___ (arrive)».",
       respuestas:[["was reading"],["arrived"]],
       retro:"Acción en desarrollo: was reading. Acción que interrumpe: arrived (past simple)."}},
    {id:"e4_7", nombre:"«Used to»",
     concepto:"Expresa hábitos o estados pasados que ya no se dan: «I used to smoke» (antes fumaba). Negativa: didn't use to. Interrogativa: Did you use to...?",
     ejemplo:"«I used to live in Madrid». «She didn't use to like coffee». «Did you use to play football?».",
     ejercicio:{tipo:"fill", consigna:"Completa con used to.",
       texto:"«I ___ (live) in Madrid» · «She ___ (not/like) coffee».",
       respuestas:[["used to live"],["didn't use to like","did not use to like"]],
       retro:"«Used to + infinitivo» expresa hábitos pasados. Negativa: didn't use to."}},
    {id:"e4_8", nombre:"«Would» para hábitos pasados",
     concepto:"«Would + infinitivo» también expresa hábitos pasados, pero solo con acciones (no estados): «When I was a child, we would visit my grandmother every Sunday».",
     ejemplo:"«We would play in the park every afternoon». No: «I would have a dog» (con estado se usa «used to»).",
     ejercicio:{tipo:"fill", consigna:"Completa con would o used to.",
       texto:"«When I was a child, we ___ visit my grandmother» (hábito) · «I ___ have a dog» (estado).",
       respuestas:[["would","used to"],["used to"]],
       retro:"«Would» para hábitos con acciones. «Used to» para estados."}},
    {id:"e4_9", nombre:"Adverbios de tiempo pasado",
     concepto:"yesterday, last night/week/year, two days ago, in 2010, when I was young. Se usan con past simple, no con present perfect.",
     ejemplo:"«I saw him yesterday». «She left two days ago». «We met in 2010».",
     ejercicio:{tipo:"fill", consigna:"Completa con el adverbio.",
       texto:"«I saw him ___ (el día anterior)» · «She left two days ___ » · «We met ___ 2010».",
       respuestas:[["yesterday"],["ago"],["in"]],
       retro:"Yesterday, ago, in + año. Marcadores típicos del past simple."}},
    {id:"e4_10", nombre:"Preguntas en pasado",
     concepto:"Interrogativa: Did + sujeto + infinitivo. «Did you see him?». No se usa el pasado del verbo principal cuando ya hay «did»: no «Did you saw».",
     ejemplo:"«Did you see the film?». «Where did she go?». «What did they do?».",
     ejercicio:{tipo:"fill", consigna:"Completa la pregunta.",
       texto:"«___ you ___ (see) the film?» → «Did you see the film?»",
       respuestas:[["did","Did"],["see"]],
       retro:"«Did» + sujeto + infinitivo. Nunca se usa el pasado tras «did»."}}
  ]},

/* ---------- Bloque 5 ---------- */
{ id:"e5", nombre:"Tiempos perfectos y futuros", emoji:"🔮",
  desc:"Present perfect, past perfect y todas las formas de futuro.",
  tecnicas:[
    {id:"e5_1", nombre:"Present perfect",
     concepto:"Conecta pasado y presente: experiencias, acciones recientes, estados que continúan. Estructura: have/has + participio. Marcadores: ever, never, just, already, yet, since, for.",
     ejemplo:"«I have visited Japan twice». «She has just finished». «Have you ever been to London?». «I've lived here for 5 years».",
     ejercicio:{tipo:"fill", consigna:"Completa con present perfect.",
       texto:"«I ___ (never/be) to Canada» · «She ___ (just/finish)» · «___ you ever ___ (see) this film?»",
       respuestas:[["have never been","'ve never been"],["has just finished","'s just finished"],["have"],["seen"]],
       retro:"Have/has + participio. El present perfect conecta pasado y presente."}},
    {id:"e5_2", nombre:"Present perfect vs past simple",
     concepto:"Present perfect: tiempo no especificado o conectado al presente. Past simple: tiempo pasado concreto. «I have seen it» (alguna vez). «I saw it yesterday» (momento concreto).",
     ejemplo:"«I have seen that film» (en algún momento). «I saw that film last week» (momento específico).",
     ejercicio:{tipo:"classify", consigna:"Elige el tiempo adecuado.",
       categorias:["Present perfect","Past simple"],
       items:[{texto:"...yesterday.",cat:1},{texto:"...ever...?",cat:0},{texto:"...in 2015.",cat:1},{texto:"...just...",cat:0},{texto:"...last week.",cat:1}],
       retro:"Con marcadores de tiempo pasado concreto → past simple. Sin tiempo específico o con ever/never/just → present perfect."}},
    {id:"e5_3", nombre:"«Since» y «for»",
     concepto:"«Since» marca el punto de inicio (since 2010, since Monday). «For» marca la duración (for 5 years, for two weeks). Se usan con present perfect.",
     ejemplo:"«I have lived here since 2010». «I have studied English for 5 years».",
     ejercicio:{tipo:"fill", consigna:"Completa con since o for.",
       texto:"«I have worked here ___ 2015» · «She has studied ___ three years».",
       respuestas:[["since"],["for"]],
       retro:"Since + punto de inicio. For + duración."}},
    {id:"e5_4", nombre:"Past perfect",
     concepto:"Acción anterior a otra acción pasada. Estructura: had + participio. Se usa con «before», «after», «when», «by the time».",
     ejemplo:"«When I arrived, she had already left». «They had finished before we came».",
     ejercicio:{tipo:"fill", consigna:"Completa con past perfect.",
       texto:"«When I arrived, they ___ (already/leave)» · «She ___ (not/see) the film before».",
       respuestas:[["had already left"],["hadn't seen","had not seen"]],
       retro:"Had + participio. El past perfect marca el «pasado del pasado»."}},
    {id:"e5_5", nombre:"«Will» para futuro",
     concepto:"Decisiones espontáneas, predicciones, promesas: «I'll help you», «It will rain», «I promise I will come». Estructura: will + infinitivo.",
     ejemplo:"«I'll call you back». «I think it will be cold». «She will help us».",
     ejercicio:{tipo:"fill", consigna:"Completa con will.",
       texto:"«I ___ (call) you back in five minutes» · «I think it ___ (be) cold tomorrow».",
       respuestas:[["will call","'ll call"],["will be","'ll be"]],
       retro:"Will + infinitivo. Para decisiones espontáneas y predicciones."}},
    {id:"e5_6", nombre:"«Going to» para futuro",
     concepto:"Planes e intenciones decididos: «I'm going to study medicine». Predicciones basadas en evidencia: «Look at those clouds! It's going to rain».",
     ejemplo:"«We're going to travel to Italy next summer». «She's going to start a new job in May».",
     ejercicio:{tipo:"fill", consigna:"Completa con going to.",
       texto:"«We ___ (travel) to Italy next summer» · «She ___ (start) a new job».",
       respuestas:[["are going to travel","'re going to travel"],["is going to start","'s going to start"]],
       retro:"Am/is/are + going to + infinitivo. Para planes y predicciones con evidencia."}},
    {id:"e5_7", nombre:"«Will» vs «going to»",
     concepto:"Will: decisión espontánea o predicción sin evidencia. Going to: plan decidido o predicción con evidencia visible.",
     ejemplo:"«The phone is ringing. —I'll answer it» (decisión espontánea). «I'm going to visit my parents next week» (plan).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada uso.",
       categorias:["Will (espontáneo/predicción)","Going to (plan/evidencia)"],
       items:[{texto:"I'll answer the phone.",cat:0},{texto:"I'm going to study medicine.",cat:1},{texto:"I think it will rain.",cat:0},{texto:"Look! It's going to rain.",cat:1},{texto:"I'll help you with that.",cat:0}],
       retro:"Will: espontáneo o predicción sin evidencia. Going to: plan o predicción con evidencia."}},
    {id:"e5_8", nombre:"Present continuous para futuro",
     concepto:"El presente continuo también expresa planes futuros ya fijados: «I'm meeting Ana tomorrow at 5». Es más definitivo que «going to».",
     ejemplo:"«I'm flying to Bogotá tomorrow». «We're having dinner with friends tonight».",
     ejercicio:{tipo:"fill", consigna:"Completa con presente continuo de futuro.",
       texto:"«I ___ (meet) Ana tomorrow at 5» · «We ___ (have) dinner tonight».",
       respuestas:[["am meeting","'m meeting"],["are having","'re having"]],
       retro:"Presente continuo para planes futuros fijados con fecha/hora concreta."}},
    {id:"e5_9", nombre:"Future continuous",
     concepto:"«Will be + -ing»: acción en desarrollo en un momento futuro. «At 8 pm I'll be watching the match».",
     ejemplo:"«This time tomorrow I'll be travelling to Madrid». «At 10 o'clock she will be sleeping».",
     ejercicio:{tipo:"fill", consigna:"Completa con future continuous.",
       texto:"«This time tomorrow I ___ (travel) to Madrid» · «At 10 she ___ (sleep)».",
       respuestas:[["will be travelling","'ll be travelling","will be traveling","'ll be traveling"],["will be sleeping","'ll be sleeping"]],
       retro:"Will be + -ing. El future continuous describe acción en progreso en el futuro."}},
    {id:"e5_10", nombre:"Future perfect",
     concepto:"«Will have + participio»: acción terminada antes de un momento futuro. «By 2030 I'll have finished my degree».",
     ejemplo:"«By next June she will have finished her thesis». «By the time you arrive, I will have cooked dinner».",
     ejercicio:{tipo:"fill", consigna:"Completa con future perfect.",
       texto:"«By next June she ___ (finish) her thesis» · «By the time you arrive, I ___ (cook) dinner».",
       respuestas:[["will have finished","'ll have finished"],["will have cooked","'ll have cooked"]],
       retro:"Will have + participio. Acción completada antes de un momento futuro."}}
  ]},

/* ---------- Bloque 6 ---------- */
{ id:"e6", nombre:"Modales y condicionales", emoji:"⚙",
  desc:"Can, must, should, may, might, conditionals 0-3, wish.",
  tecnicas:[
    {id:"e6_1", nombre:"«Can» y «could»: habilidad",
     concepto:"«Can» = habilidad en presente («I can swim»). «Could» = habilidad en pasado («I could swim when I was 5»). También permiso informal.",
     ejemplo:"«She can speak three languages». «He could play the piano when he was a child».",
     ejercicio:{tipo:"fill", consigna:"Completa con can o could.",
       texto:"«She ___ speak three languages» (presente) · «He ___ play the piano at 5» (pasado).",
       respuestas:[["can"],["could"]],
       retro:"Can: habilidad presente. Could: habilidad pasada o permiso cortés."}},
    {id:"e6_2", nombre:"«Must» y «have to»: obligación",
     concepto:"«Must» = obligación personal, interna o del hablante. «Have to» = obligación externa, impuesta. En negativa: «mustn't» = prohibición; «don't have to» = no es necesario.",
     ejemplo:"«I must study» (yo decido). «I have to wear a uniform» (lo imponen). «You mustn't smoke». «You don't have to come».",
     ejercicio:{tipo:"fill", consigna:"Completa con must o have to.",
       texto:"«I ___ study, I decided it» (personal) · «I ___ wear a uniform» (impuesto).",
       respuestas:[["must"],["have to"]],
       retro:"Must: obligación personal. Have to: obligación externa."}},
    {id:"e6_3", nombre:"«Should» y «ought to»: consejo",
     concepto:"«Should» = consejo, recomendación. «Ought to» tiene el mismo valor, con «to». En negativa: shouldn't.",
     ejemplo:"«You should rest». «You ought to study more». «You shouldn't smoke».",
     ejercicio:{tipo:"fill", consigna:"Completa con should.",
       texto:"«You ___ rest, you look tired» · «You ___ smoke, it's bad for you».",
       respuestas:[["should"],["shouldn't","should not"]],
       retro:"Should: consejo. Shouldn't: consejo negativo (no deberías)."}},
    {id:"e6_4", nombre:"«May» y «might»: posibilidad",
     concepto:"«May» = posibilidad más probable. «Might» = posibilidad más remota. También permiso formal con «May I...?».",
     ejemplo:"«It may rain today» (probable). «It might rain» (menos probable). «May I come in?».",
     ejercicio:{tipo:"fill", consigna:"Completa con may o might.",
       texto:"«It ___ rain today, but I'm not sure» · «___ I come in?» (permiso formal).",
       respuestas:[["may","might"],["may","May"]],
       retro:"May: probabilidad o permiso formal. Might: probabilidad más remota."}},
    {id:"e6_5", nombre:"Zero conditional",
     concepto:"«If + present simple, present simple»: verdades generales. «If you heat water, it boils».",
     ejemplo:"«If you don't water plants, they die». «If you mix red and blue, you get purple».",
     ejercicio:{tipo:"fill", consigna:"Completa el zero conditional.",
       texto:"«If you ___ (heat) water, it ___ (boil)».",
       respuestas:[["heat"],["boils"]],
       retro:"Zero conditional: presente + presente. Verdades generales."}},
    {id:"e6_6", nombre:"First conditional",
     concepto:"«If + present simple, will + infinitivo»: situaciones reales o probables en el futuro. «If it rains, we'll stay home».",
     ejemplo:"«If you study, you will pass». «If it rains tomorrow, we will stay home».",
     ejercicio:{tipo:"fill", consigna:"Completa el first conditional.",
       texto:"«If it ___ (rain) tomorrow, we ___ (stay) home».",
       respuestas:[["rains"],["will stay","'ll stay"]],
       retro:"If + presente, will + infinitivo. Situaciones probables."}},
    {id:"e6_7", nombre:"Second conditional",
     concepto:"«If + past simple, would + infinitivo»: hipótesis improbables o imaginarias en presente. «If I were rich, I would travel the world».",
     ejemplo:"«If I had more time, I would learn French». «If I were you, I would accept».",
     ejercicio:{tipo:"fill", consigna:"Completa el second conditional.",
       texto:"«If I ___ (be) you, I ___ (accept) the offer».",
       respuestas:[["were"],["would accept","'d accept"]],
       retro:"If + past simple, would + infinitivo. Hipótesis improbables. Con «be» se usa «were» en todas las personas."}},
    {id:"e6_8", nombre:"Third conditional",
     concepto:"«If + past perfect, would have + participio»: hipótesis sobre el pasado no realizado. «If I had studied, I would have passed».",
     ejemplo:"«If you had told me, I would have helped you». «If I had known, I would have come».",
     ejercicio:{tipo:"fill", consigna:"Completa el third conditional.",
       texto:"«If I ___ (study), I ___ (pass) the exam».",
       respuestas:[["had studied"],["would have passed","'d have passed"]],
       retro:"If + past perfect, would have + participio. Hipótesis sobre el pasado."}},
    {id:"e6_9", nombre:"Mixed conditional",
     concepto:"Combina segundo y tercer condicional: hipótesis del pasado con consecuencia en el presente, o viceversa. «If I had studied medicine, I would be a doctor now».",
     ejemplo:"«If I had studied medicine, I would be a doctor now». «If I were rich, I would have bought that house last year».",
     ejercicio:{tipo:"fill", consigna:"Completa el mixed conditional.",
       texto:"«If I ___ (study) medicine, I ___ (be) a doctor now».",
       respuestas:[["had studied"],["would be","'d be"]],
       retro:"Mixed: condición pasada, consecuencia presente. Estructura mixta."}},
    {id:"e6_10", nombre:"«Wish» y «if only»",
     concepto:"«Wish + past simple»: deseo irreal presente. «Wish + past perfect»: lamento por el pasado. «If only» refuerza el deseo.",
     ejemplo:"«I wish I had more time» (presente). «I wish I had studied more» (pasado). «If only I were rich!».",
     ejercicio:{tipo:"fill", consigna:"Completa con la forma adecuada.",
       texto:"«I wish I ___ (have) more time» (presente) · «I wish I ___ (study) more» (pasado).",
       respuestas:[["had"],["had studied"]],
       retro:"Wish + past simple: deseo presente. Wish + past perfect: lamento pasado."}}
  ]},

/* ---------- Bloque 7 ---------- */
{ id:"e7", nombre:"Voz pasiva y estilo indirecto", emoji:"🔄",
  desc:"Passive voice, reported speech, causativos.",
  tecnicas:[
    {id:"e7_1", nombre:"Voz pasiva: formación",
     concepto:"«Be + participio» (+ by + agente). El objeto de la activa pasa a sujeto de la pasiva. Se usa cuando el agente es desconocido, irrelevante o evidente.",
     ejemplo:"Activa: «They built the bridge in 1890». Pasiva: «The bridge was built in 1890».",
     ejercicio:{tipo:"fill", consigna:"Transforma a pasiva.",
       texto:"«Shakespeare wrote Hamlet» → «Hamlet ___ ___ by Shakespeare».",
       respuestas:[["was"],["written"]],
       retro:"Was + participio. El objeto (Hamlet) pasa a sujeto."}},
    {id:"e7_2", nombre:"Voz pasiva en distintos tiempos",
     concepto:"El verbo «be» se conjuga en el tiempo correspondiente: is made, was made, has been made, will be made, is being made, had been made.",
     ejemplo:"«The car is washed every week». «The letter has been sent». «The house will be sold».",
     ejercicio:{tipo:"fill", consigna:"Completa con la pasiva correcta.",
       texto:"«The letter ___ (send) already» (present perfect) · «The house ___ (sell) tomorrow» (futuro).",
       respuestas:[["has been sent"],["will be sold"]],
       retro:"El verbo «be» se conjuga según el tiempo: has been, will be, etc."}},
    {id:"e7_3", nombre:"Pasiva con dos objetos",
     concepto:"Verbos como give, send, offer, show tienen dos objetos. En pasiva, el objeto indirecto suele pasar a sujeto: «They gave me a book → I was given a book».",
     ejemplo:"«They sent her a letter → She was sent a letter» o «A letter was sent to her».",
     ejercicio:{tipo:"fill", consigna:"Transforma a pasiva con OI como sujeto.",
       texto:"«They gave me a prize» → «I ___ ___ a prize».",
       respuestas:[["was"],["given"]],
       retro:"El OI (me → I) pasa a sujeto. Estructura: I was given a prize."}},
    {id:"e7_4", nombre:"Pasiva impersonal",
     concepto:"«It is said that...», «He is said to...». Se usa para reportar opiniones generales sin atribuirlas a nadie en concreto.",
     ejemplo:"«It is said that he is rich» = «He is said to be rich». «It is believed that...».",
     ejercicio:{tipo:"fill", consigna:"Transforma a pasiva impersonal.",
       texto:"«People say he is rich» → «It ___ ___ that he is rich» o «He ___ ___ to be rich».",
       respuestas:[["is"],["said"],["is"],["said"]],
       retro:"It is said that... o He is said to... Ambas son correctas."}},
    {id:"e7_5", nombre:"Estilo indirecto: tiempos",
     concepto:"Al pasar a indirecto, se retrocede un tiempo: present→past, past→past perfect, will→would, can→could, must→had to.",
     ejemplo:"«I am tired» → He said (that) he was tired. «I will come» → He said he would come.",
     ejercicio:{tipo:"fill", consigna:"Transforma a indirecto.",
       texto:"«I live in London» → «She said she ___ in London». · «I will help you» → «He said he ___ help me».",
       respuestas:[["lived"],["would"]],
       retro:"Present→past. Will→would. Retroceso obligatorio en el paso al indirecto."}},
    {id:"e7_6", nombre:"Estilo indirecto: pronombres y deícticos",
     concepto:"Además de los tiempos, cambian los pronombres y los deícticos: today→that day, tomorrow→the next day, here→there, this→that.",
     ejemplo:"«I'll see you tomorrow» → He said he would see me the next day.",
     ejercicio:{tipo:"fill", consigna:"Ajusta el deíctico.",
       texto:"«I'll see you tomorrow» → «He said he would see me ___ ___ ___ ».",
       respuestas:[["the"],["next"],["day"]],
       retro:"Tomorrow → the next day. Los deícticos se ajustan al punto de vista del hablante."}},
    {id:"e7_7", nombre:"Preguntas en estilo indirecto",
     concepto:"Las preguntas indirectas no llevan inversión ni signos de interrogación: «He asked me where I lived». Con «if» para yes/no questions: «He asked me if I spoke English».",
     ejemplo:"«Where do you live?» → He asked me where I lived. «Do you speak English?» → He asked me if I spoke English.",
     ejercicio:{tipo:"fill", consigna:"Transforma la pregunta a indirecto.",
       texto:"«Where do you live?» → «He asked me where I ___ ».",
       respuestas:[["lived"]],
       retro:"Sin inversión y con retroceso temporal. Where I lived (no «did I live»)."}},
    {id:"e7_8", nombre:"Órdenes en estilo indirecto",
     concepto:"Las órdenes pasan a infinitivo con «told»: «Close the door» → He told me to close the door. Negativa: «Don't go» → He told me not to go.",
     ejemplo:"«Sit down!» → He told me to sit down. «Don't touch it!» → He told me not to touch it.",
     ejercicio:{tipo:"fill", consigna:"Transforma la orden.",
       texto:"«Close the door!» → «He told me ___ the door». · «Don't go!» → «He told me ___ go».",
       respuestas:[["to close"],["not to"]],
       retro:"Órdenes: told + (not) to + infinitivo."}},
    {id:"e7_9", nombre:"Causativos: have/get something done",
     concepto:"«Have + objeto + participio» o «get + objeto + participio»: algo se hace por otro. «I had my car repaired» = otro lo reparó.",
     ejemplo:"«I had my hair cut». «She got her house painted». «I need to have my computer fixed».",
     ejercicio:{tipo:"fill", consigna:"Completa el causativo.",
       texto:"«I ___ my car ___ (repair) yesterday» (have). · «She ___ her house ___ (paint)» (get).",
       respuestas:[["had"],["repaired"],["got"],["painted"]],
       retro:"Have/get + objeto + participio. El sujeto no realiza la acción: la encarga."}},
    {id:"e7_10", nombre:"Verbos que no se usan en pasiva",
     concepto:"Verbos intransitivos (arrive, happen, sleep) no tienen pasiva. Tampoco algunos verbos de estado (have, like, know) cuando expresan estado.",
     ejemplo:"Incorrecto: «The accident was happened». Correcto: «The accident happened».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada verbo.",
       categorias:["Admite pasiva","No admite pasiva"],
       items:[{texto:"build",cat:0},{texto:"arrive",cat:1},{texto:"make",cat:0},{texto:"happen",cat:1},{texto:"send",cat:0}],
       retro:"Verbos transitivos (build, make, send) admiten pasiva. Intransitivos (arrive, happen) no."}}
  ]},

/* ---------- Bloque 8 ---------- */
{ id:"e8", nombre:"Preposiciones y phrasal verbs", emoji:"🔗",
  desc:"Preposiciones de tiempo y lugar, phrasal verbs frecuentes.",
  tecnicas:[
    {id:"e8_1", nombre:"Preposiciones de tiempo: in, on, at",
     concepto:"«In» con meses, años, estaciones, partes del día (in July, in 2020, in the morning). «On» con días y fechas (on Monday, on 5th May). «At» con horas y momentos concretos (at 5, at night, at Christmas).",
     ejemplo:"«I was born in 1990». «The meeting is on Monday». «We met at 8 pm».",
     ejercicio:{tipo:"fill", consigna:"Completa con in, on o at.",
       texto:"«I was born ___ 1990» · «The meeting is ___ Monday» · «We met ___ 8 pm».",
       respuestas:[["in"],["on"],["at"]],
       retro:"In: periodos largos. On: días. At: horas y momentos concretos."}},
    {id:"e8_2", nombre:"Preposiciones de lugar: in, on, at",
     concepto:"«In» = dentro (in the box, in London). «On» = sobre superficie (on the table, on the wall). «At» = punto específico (at the door, at school, at home).",
     ejemplo:"«The book is in the bag». «It's on the table». «I'm at home». «She's at the bus stop».",
     ejercicio:{tipo:"fill", consigna:"Completa con in, on o at.",
       texto:"«The book is ___ the bag» · «It's ___ the table» · «I'm ___ home».",
       respuestas:[["in"],["on"],["at"]],
       retro:"In: dentro. On: superficie. At: punto específico."}},
    {id:"e8_3", nombre:"Preposiciones de movimiento",
     concepto:"«To» = dirección (go to). «Into» = hacia dentro. «Onto» = hacia una superficie. «From» = origen. «Through» = a través. «Across» = al otro lado.",
     ejemplo:"«I go to school». «She walked into the room». «He jumped onto the table». «We came from Spain».",
     ejercicio:{tipo:"fill", consigna:"Completa con la preposición.",
       texto:"«I go ___ school» · «She walked ___ the room» · «We came ___ Spain».",
       respuestas:[["to"],["into"],["from"]],
       retro:"To: dirección. Into: hacia dentro. From: origen."}},
    {id:"e8_4", nombre:"Preposiciones con adjetivos",
     concepto:"Algunos adjetivos rigen preposición fija: afraid of, interested in, good at, proud of, angry with, similar to.",
     ejemplo:"«I'm afraid of heights». «She's interested in art». «He's good at maths». «I'm proud of you».",
     ejercicio:{tipo:"fill", consigna:"Completa con la preposición.",
       texto:"«I'm afraid ___ heights» · «She's interested ___ art» · «He's good ___ maths».",
       respuestas:[["of"],["in"],["at"]],
       retro:"Afraid of, interested in, good at. Las preposiciones con adjetivos son fijas."}},
    {id:"e8_5", nombre:"Phrasal verbs intransitivos",
     concepto:"Verbo + partícula sin objeto: get up, wake up, come back, go out, sit down. No separables.",
     ejemplo:"«I get up at 7». «She woke up late». «We went out last night».",
     ejercicio:{tipo:"fill", consigna:"Completa el phrasal verb.",
       texto:"«I ___ ___ at 7 am» (levantarse) · «She ___ ___ late» (despertarse).",
       respuestas:[["get","wake"],["up","up"]],
       retro:"Get up, wake up. Los phrasal verbs intransitivos no admiten objeto."}},
    {id:"e8_6", nombre:"Phrasal verbs transitivos separables",
     concepto:"Verbo + partícula + objeto. El objeto puede ir entre verbo y partícula o después: «Turn off the TV» o «Turn the TV off». Con pronombre, obligatorio separar: «Turn it off».",
     ejemplo:"«Turn off the lights» = «Turn the lights off». «Turn them off» (obligatorio separar).",
     ejercicio:{tipo:"fill", consigna:"Coloca el phrasal verb.",
       texto:"«Turn ___ the TV ___ » · «Turn ___ ___ (it)» → con pronombre, separar.",
       respuestas:[["off"],["off",""],["it"],["off"]],
       retro:"Con pronombre el phrasal verb se separa: turn it off, nunca «turn off it»."}},
    {id:"e8_7", nombre:"Phrasal verbs transitivos inseparables",
     concepto:"Verbo + preposición + objeto. No se separan. «Look after the baby» (no «look the baby after»). «Look for», «wait for», «listen to».",
     ejemplo:"«She looks after her brother». «I'm looking for my keys». «Wait for me».",
     ejercicio:{tipo:"fill", consigna:"Completa con el phrasal verb.",
       texto:"«She looks ___ her brother» (cuidar) · «I'm looking ___ my keys» (buscar).",
       respuestas:[["after"],["for"]],
       retro:"Look after: cuidar (inseparable). Look for: buscar (inseparable)."}},
    {id:"e8_8", nombre:"Phrasal verbs de tres palabras",
     concepto:"Verbo + partícula + preposición: put up with (soportar), look forward to (esperar con ganas), get on with (llevarse bien), run out of (quedarse sin).",
     ejemplo:"«I can't put up with this noise». «I'm looking forward to the holidays». «We ran out of milk».",
     ejercicio:{tipo:"fill", consigna:"Completa el phrasal verb.",
       texto:"«I'm looking forward ___ the holidays» · «We ran out ___ milk».",
       respuestas:[["to"],["of"]],
       retro:"Look forward to, run out of. Los phrasal verbs de tres palabras son inseparables."}},
    {id:"e8_9", nombre:"Preposiciones al final de oración",
     concepto:"En inglés, las preposiciones pueden quedar al final: «Who are you talking to?», «What are you looking for?». Es gramaticalmente correcto.",
     ejemplo:"«Who are you waiting for?». «What are you thinking about?». «This is the book I told you about».",
     ejercicio:{tipo:"fill", consigna:"Coloca la preposición al final.",
       texto:"«¿Con quién hablas?» → «Who are you talking ___ ?» · «¿Qué buscas?» → «What are you looking ___ ?».",
       respuestas:[["to","with"],["for"]],
       retro:"En inglés coloquial, la preposición va al final de la pregunta."}},
    {id:"e8_10", nombre:"Expresiones de tiempo con preposición cero",
     concepto:"Sin preposición con next, last, this, every: «next week», «last month», «this morning», «every day». No: «in next week».",
     ejemplo:"«I'll see you next week». «She came last Monday». «I study every day».",
     ejercicio:{tipo:"fill", consigna:"Elige la opción correcta.",
       texto:"«I'll see you ___ week» (sin preposición) · «She came ___ Monday» (sin preposición).",
       respuestas:[["next"],["last"]],
       retro:"Next, last, this, every no llevan preposición."}}
  ]},

/* ---------- Bloque 9 ---------- */
{ id:"e9", nombre:"Oraciones compuestas y relativas", emoji:"🧩",
  desc:"Cláusulas, relativas, subordinadas, gerundio e infinitivo.",
  tecnicas:[
    {id:"e9_1", nombre:"Cláusulas definidas y no definidas",
     concepto:"Las relativas definidas identifican (sin comas): «The man who lives next door is my uncle». Las no definidas añaden información (con comas): «My uncle, who lives next door, is a doctor».",
     ejemplo:"«The book which I read is good» (definida). «My father, who is 60, works every day» (no definida).",
     ejercicio:{tipo:"fill", consigna:"Coloca las comas si es no definida.",
       texto:"«My brother who lives in Cali is a doctor» (no definida) → «My brother___ who lives in Cali___ is a doctor».",
       respuestas:[[","],[","]],
       retro:"Las no definidas se separan con comas. Las definidas no."}},
    {id:"e9_2", nombre:"Omisión del relativo",
     concepto:"En las definidas, el relativo puede omitirse si no es sujeto: «The book (that) I read». No se omite si es sujeto: «The man who called» (no «The man called»).",
     ejemplo:"«The book (that) I read is good». «The film (which) we saw was boring».",
     ejercicio:{tipo:"fill", consigna:"¿Se puede omitir el relativo?",
       texto:"«The book ___ I read» → sí se puede omitir (objeto) · «The man ___ called me» → no se puede (sujeto).",
       respuestas:[["that","which"],["who","that"]],
       retro:"Se omite si es objeto. No se omite si es sujeto."}},
    {id:"e9_3", nombre:"«Because», «so», «although»",
     concepto:"«Because» = causa. «So» = consecuencia. «Although» = concesión. «But» = contraste. Se usan en oraciones compuestas.",
     ejemplo:"«I stayed home because it was raining». «It was raining, so I stayed home». «Although it was raining, I went out».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada conector.",
       categorias:["Causa","Consecuencia","Concesión","Contraste"],
       items:[{texto:"because",cat:0},{texto:"so",cat:1},{texto:"although",cat:2},{texto:"but",cat:3},{texto:"though",cat:2}],
       retro:"Because: causa. So: consecuencia. Although/though: concesión. But: contraste."}},
    {id:"e9_4", nombre:"Infinitivo vs gerundio",
     concepto:"Algunos verbos van con infinitivo (want to go, decide to go), otros con gerundio (enjoy going, finish doing), y algunos con ambos (like, love, hate, start, begin).",
     ejemplo:"«I want to travel». «I enjoy reading». «I like swimming / to swim».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada verbo.",
       categorias:["+ infinitivo","+ gerundio"],
       items:[{texto:"want",cat:0},{texto:"enjoy",cat:1},{texto:"decide",cat:0},{texto:"finish",cat:1},{texto:"hope",cat:0},{texto:"avoid",cat:1}],
       retro:"Want, decide, hope + infinitivo. Enjoy, finish, avoid + gerundio."}},
    {id:"e9_5", nombre:"Verbos con cambio de significado",
     concepto:"Algunos verbos cambian de significado según lleven infinitivo o gerundio: remember, forget, stop, try, go on.",
     ejemplo:"«Remember to lock the door» (recordar hacer algo). «I remember locking the door» (recordar haber hecho algo). «Stop smoking» (dejar) vs «stop to smoke» (parar para fumar).",
     ejercicio:{tipo:"fill", consigna:"Completa con la forma correcta.",
       texto:"«Remember ___ (lock) the door» (recordar hacer) · «I remember ___ (lock) the door» (recordar haber hecho).",
       respuestas:[["to lock"],["locking"]],
       retro:"Remember to + inf: recordar hacer. Remember + -ing: recordar haber hecho."}},
    {id:"e9_6", nombre:"Preposición + gerundio",
     concepto:"Después de preposición, siempre gerundio: «I'm interested in learning», «Thank you for coming», «Before leaving».",
     ejemplo:"«I'm good at cooking». «Thanks for helping». «After finishing, we left».",
     ejercicio:{tipo:"fill", consigna:"Completa con gerundio.",
       texto:"«I'm interested in ___ (learn) English» · «Thank you for ___ (come)».",
       respuestas:[["learning"],["coming"]],
       retro:"Después de preposición, siempre -ing."}},
    {id:"e9_7", nombre:"«Make» y «let» + infinitivo sin to",
     concepto:"«Make + objeto + infinitivo sin to» (obligar): «She made me cry». «Let + objeto + infinitivo sin to» (permitir): «Let me go».",
     ejemplo:"«My parents made me study». «Let me help you». «Don't let him go».",
     ejercicio:{tipo:"fill", consigna:"Completa con el infinitivo sin to.",
       texto:"«She made me ___ (cry)» · «Let me ___ (help) you».",
       respuestas:[["cry"],["help"]],
       retro:"Make y let van con infinitivo sin «to»."}},
    {id:"e9_8", nombre:"«To» de finalidad",
     concepto:"«To + infinitivo» expresa finalidad: «I study to learn». En negativa: «in order not to» o «so as not to».",
     ejemplo:"«I study to pass the exam». «She left early to catch the train». «I whispered in order not to wake him».",
     ejercicio:{tipo:"fill", consigna:"Completa con «to» + infinitivo.",
       texto:"«I study ___ (pass) the exam» · «She left early ___ (catch) the train».",
       respuestas:[["to pass"],["to catch"]],
       retro:"«To» + infinitivo expresa finalidad."}},
    {id:"e9_9", nombre:"Participios en -ing y -ed en cláusulas",
     concepto:"Las cláusulas participiales reducen oraciones: «Feeling tired, I went to bed» = «Because I felt tired, I went to bed». «Built in 1890, the bridge is still used».",
     ejemplo:"«Walking home, I met John». «Surprised by the news, she cried».",
     ejercicio:{tipo:"fill", consigna:"Reduce la cláusula.",
       texto:"«Because I felt tired, I went to bed» → «___ tired, I went to bed».",
       respuestas:[["feeling","Feeling"]],
       retro:"Cláusula participial: -ing para activa, -ed para pasiva."}},
    {id:"e9_10", nombre:"Cláusulas de tiempo",
     concepto:"«When», «while», «as soon as», «before», «after», «until», «by the time». Introducen subordinadas de tiempo. En futuro se usa presente: «When I arrive, I'll call you».",
     ejemplo:"«When I arrive, I'll call you» (no «when I will arrive»). «As soon as I finish, I'll go».",
     ejercicio:{tipo:"fill", consigna:"Completa con presente (no futuro).",
       texto:"«When I ___ (arrive), I ___ (call) you» · «As soon as I ___ (finish), I'll go».",
       respuestas:[["arrive"],["will call","'ll call"],["finish"]],
       retro:"En subordinadas de tiempo con futuro, se usa presente. No «when I will arrive»."}}
  ]},

/* ---------- Bloque 10 ---------- */
{ id:"e10", nombre:"Errores frecuentes de hispanohablantes", emoji:"⚠",
  desc:"Errores típicos y cómo evitarlos.",
  tecnicas:[
    {id:"e10_1", nombre:"«Do» como auxiliar en afirmativas",
     concepto:"En inglés, «do» es auxiliar solo en negativas e interrogativas. En afirmativas no se usa: «I study», no «I do study» (salvo énfasis).",
     ejemplo:"Correcto: «I like coffee». Incorrecto: «I do like coffee» (salvo énfasis enfático).",
     ejercicio:{tipo:"fill", consigna:"Elimina el «do» innecesario.",
       texto:"«I do study English every day» → «I ___ English every day».",
       respuestas:[["study"]],
       retro:"En afirmativas no se usa «do» como auxiliar (salvo énfasis especial)."}},
    {id:"e10_2", nombre:"«Have» vs «have got»",
     concepto:"«Have» es la forma americana; «have got» la británica para posesión. En negativa/interrogativa: «I don't have» / «I haven't got». En inglés americano predomina «do you have».",
     ejemplo:"Americano: «I have a car». «Do you have a car?». Británico: «I've got a car». «Have you got a car?».",
     ejercicio:{tipo:"fill", consigna:"Completa según la variedad.",
       texto:"Americano: «___ you ___ a car?» · Británico: «___ you ___ a car?»",
       respuestas:[["do","Do"],["have"],["have","Have"],["got"]],
       retro:"Americano: do you have. Británico: have you got."}},
    {id:"e10_3", nombre:"«To be» + edad",
     concepto:"En inglés la edad se expresa con «to be»: «I am 20 years old». No con «have»: nunca «I have 20 years».",
     ejemplo:"Correcto: «She is 25 years old». Incorrecto: «She has 25 years».",
     ejercicio:{tipo:"fill", consigna:"Completa con la forma correcta.",
       texto:"«I ___ 20 years old» · «She ___ 25».",
       respuestas:[["am"],["is"]],
       retro:"La edad en inglés se expresa con «to be», no con «have»."}},
    {id:"e10_4", nombre:"«People» es plural",
     concepto:"«People» es plural: «People are nice» (no «People is»). «Person» es singular. «Peoples» se usa para pueblos o etnias.",
     ejemplo:"«People are waiting». «One person is waiting». «The peoples of America».",
     ejercicio:{tipo:"fill", consigna:"Completa la concordancia.",
       texto:"«The people ___ (be) waiting» → ___ · «One person ___ (be) waiting» → ___ .",
       respuestas:[["are"],["is"]],
       retro:"People = plural (are). Person = singular (is)."}},
    {id:"e10_5", nombre:"«Actually» no es «actualmente»",
     concepto:"Falso amigo: «actually» significa «en realidad», no «actualmente». «Actualmente» se traduce como «currently» o «nowadays».",
     ejemplo:"«Actually, I don't like it» = En realidad, no me gusta. «Currently, I live in Bogotá» = Actualmente vivo en Bogotá.",
     ejercicio:{tipo:"fill", consigna:"Elige el término correcto.",
       texto:"«___ I live in Bogotá» (actualmente) → ___ · «___, I don't like it» (en realidad) → ___ .",
       respuestas:[["currently","Currently","nowadays","Nowadays"],["actually","Actually"]],
       retro:"Currently = actualmente. Actually = en realidad."}},
    {id:"e10_6", nombre:"«Make» vs «do»",
     concepto:"«Make» = crear, producir («make a cake», «make a decision»). «Do» = realizar actividades («do homework», «do the dishes»). Error frecuente: «do a mistake» (debe ser «make a mistake»).",
     ejemplo:"«I make a cake». «I do my homework». «Make a mistake» (no «do»).",
     ejercicio:{tipo:"fill", consigna:"Completa con make o do.",
       texto:"«___ homework» · «___ a decision» · «___ the dishes» · «___ a mistake».",
       respuestas:[["do"],["make"],["do"],["make"]],
       retro:"Do homework, do the dishes. Make a decision, make a mistake."}},
    {id:"e10_7", nombre:"«Say» vs «tell»",
     concepto:"«Say» no lleva OI obligatorio: «He said that...». «Tell» lleva OI: «He told me that...». Nunca «He said me».",
     ejemplo:"Correcto: «He said that he was tired». «He told me that he was tired». Incorrecto: «He said me».",
     ejercicio:{tipo:"fill", consigna:"Completa con say o tell.",
       texto:"«He ___ that he was tired» · «He ___ me that he was tired».",
       respuestas:[["said"],["told"]],
       retro:"Say + (that) clause. Tell + objeto + (that) clause."}},
    {id:"e10_8", nombre:"«Very» vs «too»",
     concepto:"«Very» = muy (intensifica). «Too» = demasiado (excesivo, con connotación negativa). «Too much» con incontables, «too many» con contables.",
     ejemplo:"«It's very hot» (muy caliente). «It's too hot» (demasiado caliente). «Too much noise». «Too many people».",
     ejercicio:{tipo:"fill", consigna:"Completa con very o too.",
       texto:"«It's ___ hot today» (muy) · «It's ___ hot to go out» (demasiado).",
       respuestas:[["very"],["too"]],
       retro:"Very: intensificación neutra. Too: excesivo, con consecuencia."}},
    {id:"e10_9", nombre:"«Since» y «from»",
     concepto:"«Since» con present perfect: «I've lived here since 2010». «From» con otras estructuras: «The shop is open from 9 to 5». No son intercambiables.",
     ejemplo:"«I've worked here since 2015». «I work from Monday to Friday».",
     ejercicio:{tipo:"fill", consigna:"Completa con since o from.",
       texto:"«I've worked here ___ 2015» · «I work ___ Monday to Friday».",
       respuestas:[["since"],["from"]],
       retro:"Since + present perfect. From...to para horarios o rangos."}},
    {id:"e10_10", nombre:"«Also», «too», «as well», «either»",
     concepto:"«Also» va ante el verbo. «Too» y «as well» al final de la oración (afirmativas). «Either» en negativas al final.",
     ejemplo:"«I also like tea». «I like tea too». «I like tea as well». «I don't like tea either».",
     ejercicio:{tipo:"fill", consigna:"Completa con too, also o either.",
       texto:"«I ___ like tea» (ante verbo) · «I like tea ___ » (final) · «I don't like tea ___ » (negativa).",
       respuestas:[["also"],["too","as well"],["either"]],
       retro:"Also: ante verbo. Too/as well: final en afirmativa. Either: final en negativa."}}
  ]}
];
