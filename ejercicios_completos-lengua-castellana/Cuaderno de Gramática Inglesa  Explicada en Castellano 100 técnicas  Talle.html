const STORAGE_CUADERNO = "cuaderno_gramatica_inglesa_v1";
const STORAGE_TALLER   = "cuaderno_gramatica_inglesa_taller_v1";

let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_CUADERNO)) || {}; } catch(e){ progreso = {}; }
let drafts = [];
try { drafts = JSON.parse(localStorage.getItem(STORAGE_TALLER)) || []; } catch(e){ drafts = []; }

let modo = "cuaderno";
let actualId = null;
let vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id };
let notaTimer = null;

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));
if(TECNICAS_FLAT.length) actualId = TECNICAS_FLAT[0].id;

function guardarProg(){ try{ localStorage.setItem(STORAGE_CUADERNO, JSON.stringify(progreso)); }catch(e){} }
function guardarDrafts(){ try{ localStorage.setItem(STORAGE_TALLER, JSON.stringify(drafts)); }catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function nuevoId(){ return "en" + Date.now() + Math.random().toString(36).slice(2,7); }
function getPlantilla(id){ return PLANTILLAS.find(p=>p.id===id); }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
function boton(txt, cls){ const b=document.createElement("button"); b.className="btn "+(cls||"primary"); b.textContent=txt; return b; }

/* =====================================================================
   RENDER CUADERNO
   ===================================================================== */
function renderMenu(){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(document.getElementById("search").value||"");
  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;
    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>'+cat.emoji+'</span><span>'+cat.nombre+'</span><span class="cat-count">'+hechas+"/"+cat.tecnicas.length+'</span><span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);
    const bar = el("div","cat-bar");
    const bf = document.createElement("i");
    bf.style.width = (hechas/cat.tecnicas.length*100)+"%";
    bar.appendChild(bf); div.appendChild(bar);
    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));
    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>'+t.nombre+'</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){ const t = TECNICAS_FLAT.find(x=>x.id===id); return t ? t.catId : null; }

function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x=>x.id===id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";
  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "ENGLISH\nGRAMMAR");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn); panel.appendChild(seal);

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bi = CATEGORIAS.findIndex(c=>c.id===t.catId)+1;
  head.appendChild(el("div","tech-pos", "Técnica "+(idx+1)+" de "+TECNICAS_FLAT.length+" · Bloque "+bi+"/10"));
  panel.appendChild(head);
  panel.appendChild(el("div","rule"));

  const block = CATEGORIAS.find(c=>c.id===t.catId);
  const dots = el("div","block-dots");
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot"+(getProg(bt.id).ok?" done":"")+(bt.id===t.id?" current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  panel.appendChild(dots);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");
  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","• Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Voltee la tarjeta para ver el ejemplo ↻"));
  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","• Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toque de nuevo para volver al concepto"));
  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);
  const flipBtn = boton("↻ Voltear tarjeta","ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "Ejercicio interactivo <span>compruebe su comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));
  const body = el("div"); sec.appendChild(body);
  const fb = el("div","feedback"); sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "Cuaderno gramatical <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Escriba aquí sus notas, ejemplos en inglés, análisis propios, dudas…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);
  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx===0;
  next.disabled = idx===TECNICAS_FLAT.length-1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n===1?" palabra":" palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardarProg();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu();
  actualizarProgreso();
}

function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo==="quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo==="fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo==="order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo==="classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo==="open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback "+tipo+" show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}
function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const L = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">'+L[i]+'</span><span>'+op+'</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i===ej.correcta;
      Array.from(wrap.children).forEach((c,j) => {
        c.disabled = true;
        if(j===ej.correcta) c.classList.add("correcta");
        if(j===i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok?"ok":"mal", ok?"✓ Correcto":"✗ Revise su respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}
function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length-1){
      const inp = document.createElement("input");
      inp.type="text"; inp.className="hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key==="Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i=>!i.value.trim())){
      mostrarFeedback(fb,"info","Complete todos los huecos","Escriba una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i]||[]).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok?"ok":"mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos===total;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto ? "✓ "+aciertos+" de "+total+" correctas" : "✗ "+aciertos+" de "+total+" correctas",
      ej.retro + (perfecto?"":" · Respuestas válidas: " + ej.respuestas.map((r,i)=>(i+1)+") "+r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}
function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i)=>({txt,i})));
  const seq = [];
  const wrap = el("div","order-wrap");
  const cA = el("div","order-col");
  cA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool"); cA.appendChild(poolEl);
  const cB = el("div","order-col");
  cB.appendChild(el("h4", null, "Su secuencia"));
  const seqEl = el("div","seq"); cB.appendChild(seqEl);
  wrap.appendChild(cA); wrap.appendChild(cB);
  cont.appendChild(wrap);
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  function pintar(){
    poolEl.innerHTML=""; seqEl.innerHTML="";
    pool.forEach((o,k)=>{
      const b = document.createElement("button");
      b.className="ord-item"; b.textContent=o.txt;
      b.onclick=()=>{ if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o,k)=>{
      const b = document.createElement("button");
      b.className="ord-item";
      b.innerHTML = '<span class="num">'+(k+1)+'</span><span>'+o.txt+'</span>';
      b.onclick=()=>{ if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();
  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length!==correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pase todos los elementos a la columna de la derecha.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo,k)=>{
      const ok = seq[k].i===k;
      nodo.classList.add(ok?"ok":"mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos===correcto.length;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto?"✓ Secuencia correcta":"✗ "+aciertos+" de "+correcto.length+" en su lugar",
      perfecto ? ej.retro : "Empieza por: «"+correcto[0].slice(0,70)+"…». "+ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function renderClassify(ej, cont, fb, techId){
  const sel = new Array(ej.items.length).fill(null);
  ej.items.forEach((it,i)=>{
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat,ci)=>{
      const c = document.createElement("button");
      c.className="chip"; c.textContent=cat;
      c.onclick=()=>{
        if(row.dataset.locked) return;
        sel[i]=ci;
        Array.from(chips.children).forEach((x,xi)=>x.classList.toggle("sel", xi===ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });
  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(sel.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigne una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila,i)=>{
      fila.dataset.locked = "1";
      const ok = sel[i]===ej.items[i].cat;
      fila.classList.add(ok?"ok":"mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c=>c.disabled=true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:11px;color:#8b1e1e;font-weight:700;letter-spacing:.4px;";
        nota.textContent = "→ Correcto: "+ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos===ej.items.length;
    mostrarFeedback(fb, perfecto?"ok":"mal",
      perfecto?"✓ Clasificación correcta":"✗ "+aciertos+" de "+ej.items.length+" correctas",
      ej.retro||"");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 6; ta.placeholder = "Redacte aquí su respuesta…";
  cont.appendChild(ta);
  const ul = el("ul","criterios"); ul.style.marginTop="14px";
  ej.criterios.forEach((c,i)=>{
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type="checkbox"; cb.id = "crit_"+techId+"_"+i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);
  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>"+ej.modelo;
  cont.appendChild(mod);
  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);
  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escriba primero su respuesta","Redacte al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados===total?"ok":"info",
      marcados===total?"✓ Autoevaluación completa":"Autoevaluación: "+marcados+"/"+total,
      "Compare su texto con el modelo: ¿qué ideas coinciden? ¿qué le falta? ¿qué aporta usted?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}
function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardarProg();
    actualizarProgreso(); renderMenu();
    const block = CATEGORIAS.find(c=>c.tecnicas.some(t=>t.id===id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i)=>{
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t=>getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas+" / "+total;
  document.getElementById("progressFill").style.width = (hechas/total*100)+"%";
}

/* =====================================================================
   RENDER TALLER
   ===================================================================== */
function renderMenuTaller(){
  const mp = document.getElementById("menuPlantillas");
  mp.innerHTML = "";
  PLANTILLAS.forEach(p=>{
    const b = document.createElement("button");
    b.className = "side-item" + ((vistaTaller.tipo==="plantilla" && vistaTaller.id===p.id) ? " active":"");
    b.innerHTML = `<span class="icon">${p.icon}</span><span class="label">${p.nombre}<small>${p.sub}</small></span>`;
    b.onclick = () => { vistaTaller = { tipo:"plantilla", id:p.id }; cerrarSidebar(); abrirTaller(); };
    mp.appendChild(b);
  });
  const md = document.getElementById("menuDrafts");
  md.innerHTML = "";
  if(!drafts.length){
    md.appendChild(el("div","empty-mini","Aún no hay análisis guardados."));
  } else {
    drafts.slice().reverse().forEach(d=>{
      const p = getPlantilla(d.plantillaId);
      if(!p) return;
      const wrap = el("div","draft-item" + (vistaTaller.tipo==="draft" && vistaTaller.id===d.id ? " active":""));
      const title = el("div","di-title");
      const t = (d.campos.oracion || d.campos.activa || d.campos.directo || d.campos.verbo || d.campos.modal || p.nombre).slice(0,42);
      title.innerHTML = `${t}<small>${p.nombre} · ${d.fecha}</small>`;
      wrap.appendChild(title);
      const del = el("button","di-del","×");
      del.onclick = (ev)=>{ ev.stopPropagation(); eliminarDraft(d.id); };
      wrap.appendChild(del);
      wrap.onclick = () => { vistaTaller = { tipo:"draft", id:d.id }; cerrarSidebar(); abrirTaller(); };
      md.appendChild(wrap);
    });
  }
  document.getElementById("statCount").textContent = drafts.length;
}
function eliminarDraft(id){
  if(!confirm("¿Eliminar este análisis guardado? Esta acción no se puede deshacer.")) return;
  drafts = drafts.filter(d=>d.id!==id);
  guardarDrafts();
  if(vistaTaller.tipo==="draft" && vistaTaller.id===id){
    vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id };
  }
  renderMenuTaller(); abrirTaller();
}
function abrirTaller(){
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";
  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "TALLER\nENGLISH");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn); panel.appendChild(seal);

  if(vistaTaller.tipo==="plantilla"){
    const p = getPlantilla(vistaTaller.id);
    const head = el("div","tech-head");
    head.appendChild(el("span","badge", "Taller · " + p.genero));
    head.appendChild(el("h2", null, p.nombre));
    head.appendChild(el("p","lead", p.desc));
    panel.appendChild(head);
    panel.appendChild(el("div","rule"));

    const hint = el("p","hint");
    hint.innerHTML = "<strong>Cómo usar:</strong> complete los campos. La vista previa se genera en vivo. Puede guardar el análisis en <em>Mis análisis</em>, copiarlo o descargarlo como archivo de texto.";
    panel.appendChild(hint);

    const form = el("div","form-grid");
    p.campos.forEach(c=>{
      const f = el("div","field" + (c.full?" full":""));
      f.appendChild(el("label", null, c.label));
      const input = document.createElement(c.textarea ? "textarea" : "input");
      if(!c.textarea) input.type = "text";
      input.placeholder = c.ph || "";
      input.id = "field_"+c.id;
      input.addEventListener("input", actualizarPreviewTaller);
      f.appendChild(input);
      form.appendChild(f);
    });
    panel.appendChild(form);

    const st = el("h3","sec-title");
    st.innerHTML = "Vista previa <span>se actualiza automáticamente</span>";
    panel.appendChild(st);

    const prev = el("div","preview-wrap");
    const prevIn = el("div","preview-inner");
    prevIn.id = "previewText";
    prev.appendChild(prevIn);
    panel.appendChild(prev);

    const acts = el("div","preview-actions");
    const bSave = boton("Guardar en Mis análisis","primary");
    bSave.onclick = () => guardarDesdePlantilla(p);
    const bCopy = boton("Copiar texto","ghost");
    bCopy.onclick = () => copiarTexto(prevIn.textContent);
    const bDl = boton("Descargar .txt","ghost");
    bDl.onclick = () => descargarTxt(prevIn.textContent, p.id);
    const bClear = boton("Limpiar campos","ghost");
    bClear.onclick = () => { p.campos.forEach(c=>{ const i=document.getElementById("field_"+c.id); if(i) i.value=""; }); actualizarPreviewTaller(); };
    acts.appendChild(bSave); acts.appendChild(bCopy); acts.appendChild(bDl); acts.appendChild(bClear);
    panel.appendChild(acts);
    setTimeout(actualizarPreviewTaller, 0);

  } else if(vistaTaller.tipo==="draft"){
    const d = drafts.find(x=>x.id===vistaTaller.id);
    if(!d){ vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; abrirTaller(); return; }
    const p = getPlantilla(d.plantillaId);
    if(!p){ vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; abrirTaller(); return; }

    const head = el("div","tech-head");
    head.appendChild(el("span","badge", "Análisis guardado · " + p.genero));
    const t = (d.campos.oracion || d.campos.activa || d.campos.directo || d.campos.verbo || d.campos.modal || p.nombre).slice(0,60);
    head.appendChild(el("h2", null, t));
    head.appendChild(el("p","lead", "Guardado el " + d.fecha + ". Puede editarlo; los cambios se guardan automáticamente."));
    panel.appendChild(head);
    panel.appendChild(el("div","rule"));

    const hint = el("p","hint");
    hint.innerHTML = "Edite los campos y la vista previa se actualizará. Los cambios se guardan automáticamente.";
    panel.appendChild(hint);

    const form = el("div","form-grid");
    p.campos.forEach(c=>{
      const f = el("div","field" + (c.full?" full":""));
      f.appendChild(el("label", null, c.label));
      const input = document.createElement(c.textarea ? "textarea" : "input");
      if(!c.textarea) input.type = "text";
      input.placeholder = c.ph || "";
      input.id = "field_"+c.id;
      input.value = d.campos[c.id] || "";
      input.addEventListener("input", ()=>{
        d.campos[c.id] = input.value;
        d.textoGenerado = p.template(d.campos);
        guardarDrafts();
        actualizarPreviewTaller();
      });
      f.appendChild(input);
      form.appendChild(f);
    });
    panel.appendChild(form);

    const st = el("h3","sec-title");
    st.innerHTML = "Vista previa <span>se actualiza automáticamente</span>";
    panel.appendChild(st);

    const prev = el("div","preview-wrap");
    const prevIn = el("div","preview-inner");
    prevIn.id = "previewText";
    prev.appendChild(prevIn);
    panel.appendChild(prev);

    const acts = el("div","preview-actions");
    const bCopy = boton("Copiar texto","primary");
    bCopy.onclick = () => copiarTexto(prevIn.textContent);
    const bDl = boton("Descargar .txt","ghost");
    bDl.onclick = () => descargarTxt(prevIn.textContent, p.id);
    const bNew = boton("Nuevo con esta plantilla","ghost");
    bNew.onclick = () => { vistaTaller = { tipo:"plantilla", id:p.id }; abrirTaller(); };
    const bDel = boton("Eliminar análisis","danger");
    bDel.onclick = () => eliminarDraft(d.id);
    acts.appendChild(bCopy); acts.appendChild(bDl); acts.appendChild(bNew); acts.appendChild(bDel);
    panel.appendChild(acts);
    setTimeout(actualizarPreviewTaller, 0);
  }
}
function actualizarPreviewTaller(){
  const elPrev = document.getElementById("previewText");
  if(!elPrev) return;
  if(vistaTaller.tipo==="plantilla"){
    const p = getPlantilla(vistaTaller.id);
    const datos = {};
    p.campos.forEach(c=>{
      const inp = document.getElementById("field_"+c.id);
      datos[c.id] = inp ? inp.value.trim() : "";
    });
    elPrev.textContent = p.template(datos) + "\n\n";
    elPrev.innerHTML = elPrev.textContent.replace(/____/g,'<span class="placeholder">____</span>');
  } else if(vistaTaller.tipo==="draft"){
    const d = drafts.find(x=>x.id===vistaTaller.id);
    if(!d) return;
    const p = getPlantilla(d.plantillaId);
    const datos = {};
    p.campos.forEach(c=>{
      const inp = document.getElementById("field_"+c.id);
      datos[c.id] = inp ? inp.value : (d.campos[c.id]||"");
    });
    elPrev.textContent = p.template(datos) + "\n\n";
    elPrev.innerHTML = elPrev.textContent.replace(/____/g,'<span class="placeholder">____</span>');
  }
}
function guardarDesdePlantilla(p){
  const datos = {};
  let vacio = true;
  p.campos.forEach(c=>{
    const inp = document.getElementById("field_"+c.id);
    const v = inp ? inp.value.trim() : "";
    datos[c.id] = v;
    if(v) vacio = false;
  });
  if(vacio){ mostrarToast("Llene al menos un campo antes de guardar."); return; }
  const nuevo = {
    id: nuevoId(),
    plantillaId: p.id,
    campos: datos,
    textoGenerado: p.template(datos),
    fecha: new Date().toLocaleDateString("es-CO", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })
  };
  drafts.push(nuevo);
  guardarDrafts();
  mostrarToast("✓ Guardado en Mis análisis");
  vistaTaller = { tipo:"draft", id:nuevo.id };
  renderMenuTaller();
  abrirTaller();
}
function copiarTexto(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>mostrarToast("✓ Texto copiado"), ()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); mostrarToast("✓ Texto copiado"); } catch(e){ mostrarToast("No se pudo copiar"); }
  document.body.removeChild(ta);
}
function descargarTxt(txt, nombreBase){
  const blob = new Blob([txt], { type:"text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const fecha = new Date().toISOString().slice(0,10);
  a.download = `${nombreBase}_${fecha}.txt`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarToast("✓ Archivo descargado");
}
let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* =====================================================================
   CAMBIO DE MODO
   ===================================================================== */
function cambiarModo(m){
  modo = m;
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.mode===m);
  });
  document.getElementById("progressWrap").style.display = m==="cuaderno" ? "flex" : "none";
  document.getElementById("statWrap").style.display = m==="taller" ? "flex" : "none";
  document.getElementById("btnNew").style.display = m==="taller" ? "inline-block" : "none";
  document.getElementById("menu").style.display = m==="cuaderno" ? "block" : "none";
  document.getElementById("menuTaller").style.display = m==="taller" ? "block" : "none";
  document.getElementById("search").style.display = m==="cuaderno" ? "block" : "none";
  cerrarSidebar();
  if(m==="cuaderno"){ renderMenu(); abrirTecnica(actualId); actualizarProgreso(); }
  else { renderMenuTaller(); abrirTaller(); }
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = () => cambiarModo(t.dataset.mode);
});
document.getElementById("btnNew").onclick = () => {
  vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id };
  cerrarSidebar();
  renderMenuTaller();
  abrirTaller();
  window.scrollTo({top:0, behavior:"smooth"});
};

/* =====================================================================
   SIDEBAR / RESET / BÚSQUEDA
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;
document.getElementById("search").addEventListener("input", renderMenu);
document.getElementById("btnReset").onclick = () => {
  const msg = modo==="cuaderno"
    ? "¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer."
    : "¿Borrar todos los análisis guardados del taller? Esta acción no se puede deshacer.";
  if(!confirm(msg)) return;
  if(modo==="cuaderno"){ progreso = {}; guardarProg(); abrirTecnica(TECNICAS_FLAT[0].id); actualizarProgreso(); }
  else { drafts = []; guardarDrafts(); vistaTaller = { tipo:"plantilla", id:PLANTILLAS[0].id }; renderMenuTaller(); abrirTaller(); }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
cambiarModo("cuaderno");
</script>
