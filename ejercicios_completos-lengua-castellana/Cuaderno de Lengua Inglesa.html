       texto:"'The train to Manchester leaves at 7:45 from platform 3.' Time: ___ · Platform: ___",
       respuestas:[["7:45","7.45","seven forty five","7 45"],["3","three","platform 3"]],
       retro:"Escuchar buscando datos concretos es una habilidad esencial en situaciones reales (viajes, aeropuertos, clases)."}},

    {id:"e63", nombre:"Connected speech (linking, elision)",
     concepto:"El inglés oral une palabras: 'an apple' suena /əˈnæpl̩/. Se enlazan consonante-vocal (linking) y se eliden sonidos (elision): 'next day' → /neks deɪ/.",
     ejemplo:"'What are you doing?' → 'Whatcha doin'?' en habla rápida. 'Give it to him' → 'givitutim'.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué el habla rápida del inglés suena tan distinta al escrito?",
       opciones:["Porque los nativos hablan mal","Porque hay fenómenos de enlace, elisión y reducción vocálica","Porque el inglés tiene reglas secretas","Porque el diccionario está mal"],
       correcta:1,
       retro:"El connected speech explica por qué entender inglés nativo requiere mucha escucha: el sonido real difiere del escrito."}},

    {id:"e64", nombre:"Word stress",
     concepto:"Cada palabra inglesa tiene una sílaba tónica. Colocarla mal puede cambiar el significado o dificultar la comprensión: 'PREsent (regalo)' vs 'preSENT (presentar)'.",
     ejemplo:"'PHOtograph' → 'phoTOgrapher' → 'photoGRAPHic'. La sílaba tónica cambia al cambiar de categoría.",
     ejercicio:{tipo:"fill",
       consigna:"Marca la sílaba tónica (en mayúsculas).",
       texto:"En 'computer' la tónica es ___ · En 'important' la tónica es ___ · En 'banana' la tónica es ___",
       respuestas:[["comPUter","puter","second","segunda"],["imPORtant","portant","second","segunda"],["baNAna","nana","second","segunda"]],
       retro:"El 'stress' en inglés es distintivo: comPUter, imPORtant, baNAna. Escuchar y repetir es la mejor forma de interiorizarlo."}},

    {id:"e65", nombre:"Sentence stress & rhythm",
     concepto:"En inglés las palabras con significado (sustantivos, verbos, adjetivos) llevan el acento; las palabras funcionales (artículos, preposiciones, pronombres) se reducen. Esto crea el ritmo característico.",
     ejemplo:"'I WANT to GO to the CInema toNIght.' Las palabras importantes se acentúan; las otras se 'comen'.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué palabras suelen llevar el acento en una oración inglesa?",
       opciones:["Artículos y preposiciones","Sustantivos, verbos principales, adjetivos y adverbios","Todos por igual","Solo los nombres propios"],
       correcta:1,
       retro:"Las 'content words' se acentúan; las 'function words' se reducen. Ese contraste crea el ritmo del inglés."}},

    {id:"e66", nombre:"Intonation (rising / falling)",
     concepto:"La entonación cambia el significado: 'rising' en preguntas sí/no, 'falling' en afirmaciones y en preguntas Wh-. También expresa actitud: sorpresa, duda, ironía.",
     ejemplo:"'Are you coming? ↗' (rising). 'Where are you going? ↘' (falling). 'Really? ↗' puede ser duda o ironía.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de pregunta según la entonación típica.",
       categorias:["Rising ↗","Falling ↘"],
       items:[
         {texto:"'Are you tired?'", cat:0},
         {texto:"'Where do you live?'", cat:1},
         {texto:"'Do you like coffee?'", cat:0},
         {texto:"'What time is it?'", cat:1},
         {texto:"'Can you help me?'", cat:0}
       ],
       retro:"Yes/No questions: entonación ascendente. Wh-questions: descendente. La entonación también expresa actitud."}},

    {id:"e67", nombre:"Minimal pairs (vowels & consonants)",
     concepto:"Los 'minimal pairs' son pares de palabras que solo difieren en un sonido: 'ship/sheep', 'bit/beat', 'think/sink'. Reconocerlos es clave para la pronunciación y la comprensión.",
     ejemplo:"'ship' /ʃɪp/ vs 'sheep' /ʃiːp/ (vocal corta vs larga). 'think' /θɪŋk/ vs 'sink' /sɪŋk/ (θ vs s).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada par según el contraste fonético.",
       categorias:["Vocal corta / larga","Consonante θ / s","Consonante b / v"],
       items:[
         {texto:"ship / sheep", cat:0},
         {texto:"think / sink", cat:1},
         {texto:"berry / very", cat:2},
         {texto:"bit / beat", cat:0},
         {texto:"thin / sin", cat:1}
       ],
       retro:"Los minimal pairs entrenan el oído. Distinguirlos es esencial para una pronunciación clara y una buena comprensión."}},

    {id:"e68", nombre:"Silent letters",
     concepto:"En inglés muchas letras no se pronuncian: 'k' en 'knight', 'b' en 'climb', 'l' en 'walk', 'w' en 'write', 'h' en 'hour'. Reconocerlas mejora la pronunciación y la ortografía.",
     ejemplo:"'climb' /klaɪm/, 'know' /nəʊ/, 'island' /ˈaɪlənd/, 'hour' /ˈaʊə/, 'write' /raɪt/.",
     ejercicio:{tipo:"fill",
       consigna:"Indica qué letra es muda en cada palabra.",
       texto:"'knife' → letra muda: ___ · 'climb' → letra muda: ___ · 'hour' → letra muda: ___",
       respuestas:[["k"],["b"],["h"]],
       retro:"Las letras mudas son frecuentes en inglés. Reconocerlas evita errores de pronunciación y de ortografía."}},

    {id:"e69", nombre:"-ed pronunciation rules",
     concepto:"El sufijo -ed del pasado se pronuncia de tres formas distintas según el sonido final del verbo: /t/ (después de sonidos sordos), /d/ (después de sonoros), /ɪd/ (después de t o d).",
     ejemplo:"'worked' /wɜːkt/, 'played' /pleɪd/, 'wanted' /ˈwɒntɪd/. Tres pronunciaciones distintas.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada verbo pasado por su pronunciación de -ed.",
       categorias:["/t/","/d/","/ɪd/"],
       items:[
         {texto:"worked", cat:0},
         {texto:"played", cat:1},
         {texto:"wanted", cat:2},
         {texto:"kissed", cat:0},
         {texto:"lived", cat:1},
         {texto:"needed", cat:2}
       ],
       retro:"Regla: /t/ tras sonido sordo (k, s, p, f, ʃ, tʃ), /d/ tras sonoro (b, g, v, z, l, m, n, r, vocal), /ɪd/ tras t o d."}},

    {id:"e70", nombre:"Schwa /ə/ & weak forms",
     concepto:"El schwa /ə/ es el sonido vocálico más frecuente del inglés y aparece en sílabas átonas: 'banana' /bəˈnɑːnə/. Las 'weak forms' son reducciones de palabras funcionales: 'and' → /ən/, 'to' → /tə/, 'for' → /fə/.",
     ejemplo:"'I want to go to the cinema for a coffee.' En habla rápida: /aɪ wɒnə ɡəʊ tə ðə ˈsɪnəmə fər ə ˈkɒfi/.",
     ejercicio:{tipo:"fill",
       consigna:"Indica el número de schwas /ə/ en cada palabra.",
       texto:"'banana' → ___ schwas · 'computer' → ___ schwa · 'about' → ___ schwa",
       respuestas:[["2","dos"],["1","uno"],["1","uno"]],
       retro:"El schwa es el sonido más frecuente del inglés. Reproducirlo bien marca la diferencia entre sonar 'de libro' y sonar natural."}}
  ]
},

/* ============ BLOQUE 8 · SPEAKING & FUNCTIONS ============ */
{
  id:"b8", nombre:"Speaking & Communicative functions", emoji:"💬",
  desc:"Saludos, opiniones, sugerencias, acuerdo/desacuerdo, describir, narrar, negociar y exponer.",
  tecnicas:[
    {id:"e71", nombre:"Greetings & introductions",
     concepto:"Fórmulas inglesas para saludar y presentarse según el registro: informal ('Hi, what's up?'), neutral ('Hello, how are you?'), formal ('Good morning, pleased to meet you.').",
     ejemplo:"Informal: 'Hi! I'm Ana.' Neutral: 'Hello, nice to meet you.' Formal: 'Good morning. May I introduce myself? I'm Mr. Smith.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada saludo según el registro.",
       categorias:["Informal","Neutral","Formal"],
       items:[
         {texto:"'Hey, what's up?'", cat:0},
         {texto:"'Hello, how are you?'", cat:1},
         {texto:"'Good morning, pleased to meet you.'", cat:2},
         {texto:"'Hi! Long time no see!'", cat:0},
         {texto:"'How do you do? May I introduce myself?'", cat:2}
       ],
       retro:"El registro depende del contexto y del interlocutor. Reconocerlo y usarlo adecuadamente es parte de la competencia comunicativa."}},

    {id:"e72", nombre:"Asking for & giving opinions",
     concepto:"En inglés: 'What do you think of…?', 'How do you feel about…?' para preguntar; 'In my opinion…', 'I think…', 'As far as I'm concerned…' para dar opinión.",
     ejemplo:"'What do you think of the new policy?' 'In my opinion, it's too strict.' 'From my point of view, it has some advantages.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la expresión adecuada.",
       texto:"___ do you think of this film? (preguntar) · ___, it's a great idea. (dar opinión) · As far as I'm ___, we should wait.",
       respuestas:[["what"],["in my opinion","i think","personally"],["concerned"]],
       retro:"Las fórmulas para dar opinión en inglés son variadas: In my opinion, I think, From my point of view, As far as I'm concerned…"}},

    {id:"e73", nombre:"Making suggestions & offers",
     concepto:"'Shall we…?', 'How about + -ing?', 'Why don't we…?', 'Let's…' para sugerir. 'Would you like…?', 'Can I…?', 'Shall I…?' para ofrecer.",
     ejemplo:"'Shall we go to the cinema?' 'How about eating out tonight?' 'Would you like some coffee?' 'Can I help you?'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión según su función.",
       categorias:["Suggestion","Offer"],
       items:[
         {texto:"'Shall we go for a walk?'", cat:0},
         {texto:"'Would you like some tea?'", cat:1},
         {texto:"'Why don't we try that new restaurant?'", cat:0},
         {texto:"'Can I carry your bags?'", cat:1},
         {texto:"'How about watching a film?'", cat:0}
       ],
       retro:"Sugerir implica proponer una actividad conjunta; ofrecer implica dar algo al interlocutor."}},

    {id:"e74", nombre:"Agreeing & disagreeing politely",
     concepto:"En inglés el desacuerdo suele ser indirecto para no ofender: 'I see your point, but…', 'I'm not sure I agree…'. Fórmulas de acuerdo: 'I completely agree', 'That's exactly how I feel'.",
     ejemplo:"Acuerdo: 'I couldn't agree more.' Desacuerdo suave: 'I see what you mean, but I have a different view.' Desacuerdo firme: 'I'm afraid I have to disagree.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Agreeing","Disagreeing politely"],
       items:[
         {texto:"'I completely agree with you.'", cat:0},
         {texto:"'I see your point, but I have a different view.'", cat:1},
         {texto:"'That's exactly how I feel.'", cat:0},
         {texto:"'I'm afraid I have to disagree.'", cat:1},
         {texto:"'I couldn't agree more.'", cat:0}
       ],
       retro:"En inglés el desacuerdo tiende a suavizarse con 'I see your point, but…' o 'I'm afraid…'. La cortesía es parte de la competencia comunicativa."}},

    {id:"e75", nombre:"Asking for clarification",
     concepto:"Fórmulas para pedir aclaración o repetición: 'Sorry, could you repeat that?', 'What do you mean by…?', 'Could you say that again, please?', 'I don't quite follow you.'",
     ejemplo:"'Sorry, I didn't catch that.' 'Could you speak more slowly, please?' 'What do you mean by "sustainable"?'",
     ejercicio:{tipo:"fill",
       consigna:"Completa las peticiones de aclaración.",
       texto:"Sorry, could you ___ that, please? · What do you ___ by 'fair trade'? · I don't quite ___ you.",
       respuestas:[["repeat","say again"],["mean"],["follow","understand","get"]],
       retro:"Pedir aclaración no es señal de debilidad: es parte de una conversación eficaz y de la cortesía comunicativa."}},

    {id:"e76", nombre:"Describing people, places & things",
     concepto:"En inglés se describe con adjetivos y preposiciones: 'She's tall, with dark hair.' 'It's a quiet town near the coast.' 'It's a small wooden box.' Orden típico: opinión, tamaño, edad, forma, color, origen, material.",
     ejemplo:"'An old Italian leather bag.' Orden: edad (old) → origen (Italian) → material (leather).",
     ejercicio:{tipo:"order",
       consigna:"Ordena los adjetivos según el orden típico del inglés.",
       items:[
         "opinion (beautiful)",
         "size (big)",
         "age (old)",
         "colour (black)",
         "origin (Italian)"
       ],
       retro:"El orden de los adjetivos en inglés es fijo: opinión, tamaño, edad, forma, color, origen, material. Violarlo suena extraño al nativo."}},

    {id:"e77", nombre:"Narrating a story / anecdote",
     concepto:"Para narrar en inglés se combinan past simple y past continuous, se usan marcadores temporales (First…, Then…, Finally…) y expresiones de reacción (It was amazing, I couldn't believe it).",
     ejemplo:"'Last summer I was travelling in Italy when I met an old friend. At first I didn't recognise him, but then…'",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos para narrar una anécdota en inglés.",
       items:[
         "Set the scene: 'Last summer, I was…'",
         "Introduce the main event: 'Suddenly, …'",
         "Describe reactions and details: 'I couldn't believe it…'",
         "Conclude with a comment or reflection."
       ],
       retro:"La narración oral en inglés sigue una estructura clara: escena → evento → reacción → conclusión. Los marcadores ayudan al oyente a seguir el hilo."}},

    {id:"e78", nombre:"Giving instructions & directions",
     concepto:"En inglés se usa el imperativo y fórmulas de cortesía: 'Turn left.', 'Go straight on.', 'Take the second turning.', 'Could you tell me how to get to…?'.",
     ejemplo:"'Go straight on for 200 metres, then turn left at the traffic lights. The museum is on your right.'",
     ejercicio:{tipo:"order",
       consigna:"Ordena las indicaciones para llegar al museo.",
       items:[
         "Go straight on for 200 metres.",
         "Turn left at the traffic lights.",
         "Walk past the bank.",
         "Take the second turning on the right.",
         "The museum is on your left."
       ],
       retro:"Las indicaciones en inglés siguen un orden lógico y usan imperativos y preposiciones de lugar (on the left/right, next to, opposite)."}},

    {id:"e79", nombre:"Negotiating & problem-solving",
     concepto:"En inglés para negociar se usan condicionales y modales: 'If you could lower the price, I would buy it.', 'Would you be willing to…?', 'Let's find a compromise.'.",
     ejemplo:"'If you could deliver by Friday, we would sign the contract today.' 'Could we split the difference?'",
     ejercicio:{tipo:"fill",
       consigna:"Completa las expresiones de negociación.",
       texto:"If you could lower the price, I ___ buy it. · Would you be ___ to change the date? · Let's find a ___.",
       respuestas:[["would","'d"],["willing","able","prepared"],["compromise","solution","middle ground","agreement"]],
       retro:"La negociación en inglés combina condicionales (If you could…, I would…) con modales de cortesía (could, would, might)."}},

    {id:"e80", nombre:"Giving a short presentation",
     concepto:"Una presentación oral en inglés tiene estructura fija: saludo, presentación del tema, desarrollo con puntos claros, conclusión y agradecimiento. Fórmulas útiles: 'Today I'm going to talk about…', 'Firstly…, Secondly…, Finally…', 'To sum up…'.",
     ejemplo:"'Good morning everyone. Today I'm going to talk about climate change. Firstly, I'll explain the causes. Secondly, the effects. Finally, some solutions. To sum up… Thank you for listening.'",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos de una presentación oral en inglés.",
       items:[
         "Greet the audience and introduce the topic.",
         "Present the structure: 'Firstly…, Secondly…, Finally…'",
         "Develop each point with examples or data.",
         "Summarise: 'To sum up…' or 'In conclusion…'",
         "Thank the audience and invite questions."
       ],
       retro:"Las presentaciones orales en inglés siguen un guion previsible. Dominar sus fórmulas da seguridad y claridad."}}
  ]
},

/* ============ BLOQUE 9 · WRITING & TEXT TYPES ============ */
{
  id:"b9", nombre:"Writing & Text types", emoji:"✍️",
  desc:"Párrafos, cohesión, registro, emails, narración, descripción, ensayo, informe, reseña y edición.",
  tecnicas:[
    {id:"e81", nombre:"Paragraph structure & topic sentence",
     concepto:"Un párrafo inglés bien construido tiene 'topic sentence' (idea principal), 'supporting sentences' (desarrollo) y a veces 'concluding sentence'. La topic sentence suele abrir el párrafo.",
     ejemplo:"Topic: 'Recycling has several benefits.' Supporting: 'First, it reduces waste… Second, it saves energy…' Concluding: 'In short, recycling is essential.'",
     ejercicio:{tipo:"quiz",
       consigna:"Where is the topic sentence usually placed in an English paragraph?",
       opciones:["In the middle","At the beginning (first sentence)","Never in the first line","Only at the end"],
       correcta:1,
       retro:"La topic sentence encabeza el párrafo en la mayoría de textos expositivos ingleses. Es la idea que el resto desarrolla."}},

    {id:"e82", nombre:"Linking words & cohesion",
     concepto:"Los conectores y marcadores en inglés cohesionan el texto: 'firstly, secondly, in addition, however, therefore, in conclusion'. Sin ellos, el texto parece una lista de frases sueltas.",
     ejemplo:"'Firstly, we need funding. In addition, we need trained staff. However, without political support, nothing will change. Therefore, we must lobby.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el conector adecuado.",
       texto:"___, we need to define the problem. (inicio) · ___, the costs are too high. (contraste) · ___, we must act now. (conclusión)",
       respuestas:[["first","firstly","to begin with","first of all"],["however","nevertheless","on the other hand","but"],["in conclusion","to sum up","finally","therefore","in short"]],
       retro:"Los conectores organizan el discurso y guían al lector. Son imprescindibles en la escritura académica en inglés."}},

    {id:"e83", nombre:"Formal vs informal register",
     concepto:"El registro formal evita contracciones, usa vocabulario culto y estructuras completas. El informal admite contracciones, expresiones coloquiales y frases cortas.",
     ejemplo:"Formal: 'I am writing to request further information.' Informal: 'Just wanted to ask you something.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión según el registro.",
       categorias:["Formal","Informal"],
       items:[
         {texto:"'I am writing to request further information.'", cat:0},
         {texto:"'Just wanted to ask you something.'", cat:1},
         {texto:"'Yours sincerely,'", cat:0},
         {texto:"'Cheers,'", cat:1},
         {texto:"'I would be grateful if you could…'", cat:0},
         {texto:"'Can't wait to hear from you!'", cat:1}
       ],
       retro:"El registro se elige según el destinatario y el contexto. Mezclarlos produce extrañeza o incluso descortesía."}},

    {id:"e84", nombre:"Email writing (formal & informal)",
     concepto:"Un email formal tiene: saludo (Dear Mr/Ms…), motivo, desarrollo, despedida (Yours sincerely / Best regards) y firma. Un email informal usa 'Hi…', contracciones y despedidas más cercanas (Cheers, Take care).",
     ejemplo:"Formal: 'Dear Ms Smith, I am writing to apply for the position advertised… Yours sincerely, Ana López.' Informal: 'Hi John, How's it going? Just a quick note about… Cheers, Ana.'",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un email formal.",
       items:[
         "Greeting: 'Dear Mr Smith,'",
         "Opening: 'I am writing to…'",
         "Body: main message in clear paragraphs.",
         "Closing formula: 'I look forward to your reply.'",
         "Sign-off: 'Yours sincerely,' + name"
       ],
       retro:"El email formal en inglés tiene una estructura fija. Reconocerla y respetarla es parte de la competencia escrita."}},

    {id:"e85", nombre:"Narrative writing (story)",
     concepto:"Un relato en inglés sigue una estructura: setting (situación inicial), complicación (conflicto), climax, resolution. Se usa past simple y past continuous, con marcadores temporales y conectores.",
     ejemplo:"'Last summer, I was travelling in Italy. One evening, while I was walking alone, something strange happened…'",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un relato breve en inglés.",
       items:[
         "Setting: introduce the time, place and characters.",
         "Complication: something happens that changes the situation.",
         "Climax: the most intense or decisive moment.",
         "Resolution: how the situation is resolved.",
         "Coda: a final comment or reflection."
       ],
       retro:"La estructura narrativa es previsible. Dominarla permite escribir relatos coherentes y atractivos."}},

    {id:"e86", nombre:"Descriptive writing",
     concepto:"Un texto descriptivo en inglés usa adjetivos precisos, verbos sensoriales y orden espacial: 'from top to bottom', 'in the foreground', 'behind'. Puede ser objetivo o subjetivo.",
     ejemplo:"'The old house stood at the end of the street. Its windows were dark and its door, half-open, creaked in the wind.'",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye 'good' por un adjetivo más preciso.",
       texto:"'The view was very good.' → 'The view was ___' · 'The food was good.' → 'The food was ___'",
       respuestas:[["breathtaking","stunning","spectacular","magnificent","impressive","beautiful"],["delicious","tasty","exquisite","mouth-watering","scrumptious"]],
       retro:"La descripción gana con adjetivos precisos. 'Good' es tan general que apenas comunica nada."}},

    {id:"e87", nombre:"Opinion essay / argumentative writing",
     concepto:"Un 'opinion essay' en inglés tiene introducción con tesis, 2-3 párrafos con argumentos y ejemplos, y conclusión que retoma la tesis. Fórmulas: 'It is often argued that…', 'On the one hand… on the other hand…', 'In conclusion…'.",
     ejemplo:"'It is often argued that technology improves education. On the one hand, it provides instant access to information. On the other hand, it can distract students. In conclusion, technology is a tool: its value depends on how we use it.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa las fórmulas típicas del ensayo de opinión.",
       texto:"It is often ___ that… · On the one ___, … On the other ___, … · In ___, …",
       respuestas:[["argued","said","claimed","believed"],["hand"],["hand"],["conclusion"]],
       retro:"Estas fórmulas dan estructura y registro formal al ensayo. Son la base de la escritura argumentativa en inglés."}},

    {id:"e88", nombre:"Report & article writing",
     concepto:"Un 'report' en inglés es objetivo, con secciones y datos. Un 'article' puede ser más personal y atractivo, con título llamativo y estilo más libre. Ambos requieren introducción, desarrollo y conclusión.",
     ejemplo:"Report: 'Introduction — The aim of this report is to… Findings — The survey shows that… Recommendations — It is recommended that…'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada rasgo según corresponda a un report o a un article.",
       categorias:["Report","Article"],
       items:[
         {texto:"Objective tone, sections and headings.", cat:0},
         {texto:"Catchy title, personal style, engaging.", cat:1},
         {texto:"'The aim of this report is to…'", cat:0},
         {texto:"Rhetorical questions and vivid language.", cat:1},
         {texto:"Recommendations and findings.", cat:0}
       ],
       retro:"El report es objetivo y estructurado; el article es más libre y busca atraer al lector. Ambos son géneros frecuentes en el ámbito académico anglosajón."}},

    {id:"e89", nombre:"Review (book, film, restaurant)",
     concepto:"Una 'review' en inglés resume y valora una obra o experiencia: introduce (título, autor/director), resume brevemente, valora (con razones) y recomienda (o no) al público adecuado.",
     ejemplo:"'This novel, written by…, tells the story of… What I liked most was… I would recommend it to anyone who enjoys…'",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una review.",
       items:[
         "Introduce the work: title, author or director, genre.",
         "Brief plot summary (without spoilers).",
         "Evaluate: what works and what doesn't.",
         "Recommend: who would enjoy it and why."
       ],

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "english_notebook_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  /* flashcard */
  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo práctico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico (EN / ES)"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  /* ejercicio */
  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  /* cuaderno */
  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 My notebook <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, dudas, ejemplos propios, palabras nuevas en inglés…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  /* navegación */
  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  /* eventos */
  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
