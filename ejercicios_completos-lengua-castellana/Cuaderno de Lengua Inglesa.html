<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Notebook · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e9efe4;
    --paper:#fdfefb;
    --paper-2:#f5f9f2;
    --ink:#15271a;
    --muted:#5a6b5e;
    --line:#cdd8c9;
    --line-2:#b7c7b3;
    --accent:#166534;
    --accent-dark:#14532d;
    --accent-soft:#dcfce7;
    --amber:#b45309;
    --amber-soft:#fef3c7;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(20,50,25,.06), 0 12px 30px rgba(20,50,25,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #f5f8ef 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(253,254,251,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #b3e0c0;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:16.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d8e2d3; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#166534,#b45309); transition:width .4s;}

  .btn{
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eff5ec; border-color:#8fa88a;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:inherit; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f5f9f2; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.6px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#eff5ec;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-size:10.5px; font-weight:800;
    background:var(--amber-soft); color:var(--amber);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dbe6d6; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--amber)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:13px; line-height:1.35; color:#31463a;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#eff5ec;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--amber));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #b3e0c0; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:25px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(22,101,52,.20); border-color:var(--accent);}

  /* ---------- FLASHCARD (papel con renglones verdes) ---------- */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fffdf5;
    background-image:
      linear-gradient(transparent 27px, rgba(22,101,52,.16) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
    box-shadow:inset 22px 0 0 -21px #f0b97a;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #b3e0c0;
    background-color:#f5fdf6;
    box-shadow:inset 22px 0 0 -21px #86d29b;
  }
  .fc-tag{
    font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.8px; line-height:28px; color:#1a2a1d;}
  .fc-back p{color:#143a22;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:11.5px; color:#94a692; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  /* ---------- SECCIONES ---------- */
  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#2b3e30;
    background:#f5f9f2; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f5fdf6; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dbe6d6; color:var(--muted);
    display:grid; place-items:center;
    font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#1a2a1d;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--amber);
    background:#fffaeb; color:var(--amber); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fef3c7; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eff3eb; border:1.5px dashed var(--line-2);}
  .seq{background:#f5fdf6; border:1.5px solid #b3e0c0;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b7c7b3; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f5fdf6;}
  .seq .ord-item{border-color:#b3e0c0;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eff3eb; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#3e4e41; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:27px;
    color:#1a2a1d; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf5;
    background-image:linear-gradient(transparent 26px, rgba(22,101,52,.16) 26px 27px);
    background-size:100% 27px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(22,101,52,.12);}
  textarea::placeholder{color:#94a692; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:560px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--amber-soft); border:1px solid #fcd34d; color:#78350f;}
  .feedback strong{display:block; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f5f9f2; border-left:3px solid var(--amber);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#5a3b13;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--amber); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,35,20,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:21px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">EN</div>
    <div>
      <h1>English Notebook · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · reading, grammar, listening, speaking &amp; writing</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · LENGUA INGLESA · 10 BLOQUES
   Instrucciones y explicaciones en castellano · ejemplos bilingües
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · READING LITERAL ============ */
{
  id:"b1", nombre:"Reading · Comprensión literal", emoji:"📖",
  desc:"Leer lo que el texto inglés dice explícitamente: idea principal, detalles, referencia, estructura.",
  tecnicas:[
    {id:"e1", nombre:"Skimming (lectura panorámica)",
     concepto:"Consiste en recorrer el texto inglés rápidamente para captar la idea general. Se leen títulos, primeras y últimas frases de cada párrafo. En inglés es una de las técnicas más útiles para saber 'what the text is about'.",
     ejemplo:"Texto sobre 'climate change': con una hojeada en 60 segundos ya sabemos que trata de las causas y efectos del cambio climático. Título + primera línea de cada párrafo → idea general.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Para qué sirve principalmente el skimming al leer un texto en inglés?",
       opciones:["Para memorizar todos los detalles","Para captar la idea general antes de profundizar","Para corregir la ortografía del texto","Para traducirlo literalmente al español"],
       correcta:1,
       retro:"Skimming = 'gist reading' (lectura de la idea general). No se detiene en detalles: busca el sentido global del texto."}},

    {id:"e2", nombre:"Scanning (búsqueda de un dato concreto)",
     concepto:"Es un barrido rápido del texto inglés buscando un dato específico: una fecha, un número, un nombre. No se lee palabra por palabra: los ojos saltan hasta encontrar la información.",
     ejemplo:"Pregunta: 'When was the novel published?' → buscas en el texto palabras como 'published', 'in 1967', cifras de cuatro dígitos…",
     ejercicio:{tipo:"fill",
       consigna:"Localiza los datos concretos en el fragmento.",
       texto:"'The novel was published in 1952 and translated into Spanish in 1968.' Published: ___ · Spanish translation: ___",
       respuestas:[["1952"],["1968"]],
       retro:"Scanning busca información concreta. Los años, cifras, nombres propios son fáciles de 'escanear' visualmente."}},

    {id:"e3", nombre:"Identifying the main idea",
     concepto:"Consiste en identificar la idea principal del texto o del párrafo en inglés. Suele aparecer en la 'topic sentence' (primera oración) o al final del párrafo.",
     ejemplo:"'Reading is an active process. The reader constructs meaning using previous knowledge.' → Main idea: reading is active (the first sentence).",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la idea principal en inglés o castellano.",
       texto:"'Learning a language requires daily practice. Twenty minutes a day is more useful than three hours once a week.' Main idea: ___",
       respuestas:[["daily practice","la practica diaria","regular practice","practicar a diario","la practica constante","practice every day","constant practice","la constancia","la practica regular"]],
       retro:"La 'topic sentence' es la primera: aprender idiomas exige práctica diaria. Las demás oraciones la apoyan."}},

    {id:"e4", nombre:"Main vs supporting ideas",
     concepto:"En inglés se distinguen la 'main idea' (idea principal) de las 'supporting ideas' (ideas secundarias: ejemplos, datos, razones). Reconocerlas ayuda a hacer un buen resumen.",
     ejemplo:"Main: 'Recycling reduces waste.' Supporting: 'In 2022, 1.2 million tonnes of paper were recycled.' / 'Recycling requires separating materials.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según sea main o supporting idea de un texto sobre 'plastic pollution'.",
       categorias:["Main idea","Supporting idea"],
       items:[
         {texto:"Plastic pollution is one of the biggest environmental problems today.", cat:0},
         {texto:"Every year, 8 million tonnes of plastic end up in the oceans.", cat:1},
         {texto:"Microplastics have been found in fish, salt and even rain.", cat:1},
         {texto:"Plastic pollution threatens marine life and human health.", cat:0}
       ],
       retro:"La main idea es general y sostiene el texto; las supporting ideas aportan datos o detalles concretos."}},

    {id:"e5", nombre:"Wh-questions: who, what, when, where, why, how",
     concepto:"En inglés las preguntas Wh- organizan la información básica de un texto: quién, qué, cuándo, dónde, por qué y cómo. Identificarlas facilita la comprensión literal.",
     ejemplo:"'Yesterday, in Madrid, hundreds of students protested against climate change because they want action.' → Who? students. What? protested. When? yesterday. Where? Madrid. Why? climate change. How many? hundreds.",
     ejercicio:{tipo:"fill",
       consigna:"Responde en inglés con la información del fragmento.",
       texto:"'Last Friday, in London, thousands of workers marched for better salaries because prices have risen.' Who? ___ · When? ___ · Why? ___",
       respuestas:[["workers","thousands of workers"],["last friday","on friday","friday"],["prices have risen","better salaries","for better salaries","because prices have risen","salaries"]],
       retro:"Las Wh-questions te ayudan a extraer la información esencial. Con práctica se vuelven automáticas."}},

    {id:"e6", nombre:"Reference words (pronombres y anáfora)",
     concepto:"En inglés los textos usan palabras que remiten a algo ya dicho: 'he, she, it, this, that, they'. Saber a qué se refieren es imprescindible para no perder el hilo.",
     ejemplo:"'The Hubble telescope was launched in 1990. It has changed our view of the universe.' → 'It' refers to the Hubble telescope.",
     ejercicio:{tipo:"quiz",
       consigna:"'The students studied hard for the exam. They wanted to pass with a high mark.' What does 'They' refer to?",
       opciones:["The exam and the mark","The students","The teachers","The books"],
       correcta:1,
       retro:"'They' es el pronombre plural que remite al antecedente plural más próximo y coherente: 'the students'."}},

    {id:"e7", nombre:"Recognizing text structure",
     concepto:"Los textos en inglés suelen seguir estructuras reconocibles: 'problem-solution', 'cause-effect', 'chronological', 'compare-contrast'. Reconocerla ayuda a anticipar la información.",
     ejemplo:"'First..., Then..., Finally...' → estructura cronológica. 'Both A and B share..., however, they differ...' → compare-contrast.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según la estructura a la que apunta.",
       categorias:["Chronological","Compare-contrast","Cause-effect"],
       items:[
         {texto:"first / then / finally", cat:0},
         {texto:"however / whereas / on the other hand", cat:1},
         {texto:"because of / as a result / consequently", cat:2},
         {texto:"before / after / meanwhile", cat:0},
         {texto:"similarly / in contrast", cat:1}
       ],
       retro:"Los conectores revelan la estructura. Reconocerlos te permite anticipar la información del párrafo siguiente."}},

    {id:"e8", nombre:"Linking words (conectores en inglés)",
     concepto:"Los 'linking words' o 'connectors' enlazan ideas: adición (and, moreover), contraste (but, however), causa (because), consecuencia (so, therefore). Son las señales de tráfico del texto.",
     ejemplo:"'It was raining. However, we went out.' 'She studied a lot, so she passed the exam.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Addition","Contrast","Cause","Consequence"],
       items:[
         {texto:"moreover", cat:0},
         {texto:"however", cat:1},
         {texto:"because", cat:2},
         {texto:"therefore", cat:3},
         {texto:"in addition", cat:0},
         {texto:"although", cat:1},
         {texto:"as a result", cat:3}
       ],
       retro:"Los conectores organizan el razonamiento. Sin ellos el lector no sabe cómo se relacionan las ideas."}},

    {id:"e9", nombre:"Understanding definitions in context",
     concepto:"Muchos textos en inglés definen términos técnicos. Las definiciones suelen aparecer con estructuras como 'X is…', 'X means…', 'X refers to…', 'X, that is, …'.",
     ejemplo:"'Photosynthesis is the process by which plants convert sunlight into energy.' 'Photosynthesis' queda definido en la misma oración.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición usando el texto.",
       texto:"'A habitat is the natural environment where an animal or plant lives.' A habitat is ___. A 'habitat' is the natural environment where ___.",
       respuestas:[["the natural environment where an animal or plant lives","the natural environment where plants and animals live"],["an animal or plant lives","plants and animals live"]],
       retro:"Reconocer el patrón 'X is…' permite identificar definiciones sin necesidad de diccionario."}},

    {id:"e10", nombre:"Following instructions",
     concepto:"Los textos instructivos en inglés usan el imperativo: 'Open… Cut… Add… Mix… Do not…'. Comprender las instrucciones exige atención al orden y a las palabras de acción.",
     ejemplo:"'Preheat the oven to 180 °C. Mix the flour and sugar. Bake for 25 minutes.' Tres acciones en orden estricto.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las instrucciones de la receta según el texto original.",
       items:[
         "Preheat the oven to 180 °C.",
         "Mix the flour, sugar and eggs in a bowl.",
         "Pour the mixture into a greased tin.",
         "Bake for 25 minutes.",
         "Let it cool before removing from the tin."
       ],
       retro:"En inglés los verbos en imperativo indican acciones; el orden es esencial. Cambiar el orden cambia el resultado."}}
  ]
},

/* ============ BLOQUE 2 · READING INFERENCIAL ============ */
{
  id:"b2", nombre:"Reading · Comprensión inferencial", emoji:"🧩",
  desc:"Deducir lo que el texto inglés sugiere sin decirlo: causas, sentimientos, intención, tono.",
  tecnicas:[
    {id:"e11", nombre:"Inferring meaning from context",
     concepto:"Deducir el significado de una palabra inglesa desconocida usando las pistas del contexto: otras palabras, la estructura de la frase, el tema general.",
     ejemplo:"'The children were starving; they hadn't eaten for two days.' 'Starving' = very hungry (extremely hungry), como indican 'hadn't eaten for two days'.",
     ejercicio:{tipo:"quiz",
       consigna:"'The old man was very thrifty: he saved every penny and never wasted anything.' What does 'thrifty' mean?",
       opciones:["Wasteful","Careful with money, economical","Very rich","Generous"],
       correcta:1,
       retro:"Las pistas ('saved every penny', 'never wasted anything') indican que thrifty significa cuidadoso con el dinero, ahorrador."}},

    {id:"e12", nombre:"Inferring causes and effects",
     concepto:"Deducir por qué ocurre algo o qué consecuencia tendrá, aunque el texto no lo diga explícitamente. Se apoya en indicios y en el conocimiento del mundo.",
     ejemplo:"'Maria looked at her watch again and stood up by the door.' → We can infer she is waiting for someone who is late.",
     ejercicio:{tipo:"quiz",
       consigna:"'The team didn't practise all week. On Saturday, they lost 4-0.' What can we infer?",
       opciones:["They practised very hard","Lack of practice probably affected their performance","The other team was worse","The match was cancelled"],
       correcta:1,
       retro:"El texto no dice que la falta de práctica causó la derrota, pero es la inferencia más razonable a partir de los hechos."}},

    {id:"e13", nombre:"Inferring feelings and attitudes",
     concepto:"Deducir cómo se sienten los personajes según sus palabras, gestos o acciones, aunque el texto no lo diga con adjetivos.",
     ejemplo:"'She slammed the door and didn't say a word.' → We can infer she was angry or upset.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada fragmento según el sentimiento que sugiere.",
       categorias:["Nervous","Angry","Sad"],
       items:[
         {texto:"'He kept checking his phone every minute.'", cat:0},
         {texto:"'She threw the letter on the floor and left.'", cat:1},
         {texto:"'He sat alone, staring at the old photograph.'", cat:2},
         {texto:"'Her hands were shaking before the interview.'", cat:0},
         {texto:"'He slammed his fist on the table.'", cat:1}
       ],
       retro:"Las acciones y los gestos son pistas del estado emocional. El narrador no siempre necesita nombrarlo."}},

    {id:"e14", nombre:"Inferring the author's purpose",
     concepto:"Deducir para qué escribió el autor: inform (informar), persuade (persuadir), entertain (entretener), warn (advertir), describe (describir). Se detecta por el léxico, el tono y la estructura.",
     ejemplo:"'Nobody in their right mind would support this absurd proposal.' → Purpose: to persuade / criticise, not to inform (the language is evaluative).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada fragmento según el propósito del autor.",
       categorias:["To inform","To persuade","To entertain"],
       items:[
         {texto:"'The water cycle involves evaporation, condensation and precipitation.'", cat:0},
         {texto:"'We must act now to save our planet!'", cat:1},
         {texto:"'Once upon a time there was a lonely dragon…'", cat:2},
         {texto:"'Vaccines have reduced child mortality by 60% since 1990.'", cat:0}
       ],
       retro:"Los textos informativos usan datos; los persuasivos, valoraciones y llamadas a la acción; los de entretenimiento, narrativa."}},

    {id:"e15", nombre:"Inferring tone and mood",
     concepto:"El tono (actitud del autor) y el mood (atmósfera que crea el texto) pueden ser irónicos, solemnes, melancólicos, neutros… Se detectan en el léxico y las imágenes.",
     ejemplo:"'Great idea: throwing your money away on useless things.' → Ironic tone: the praise is sarcastic.",
     ejercicio:{tipo:"quiz",
       consigna:"'What a wonderful day: I lost my keys, missed the bus and it's raining.' What is the tone?",
       opciones:["Sincere admiration","Ironic","Neutral","Formal"],
       correcta:1,
       retro:"El contraste entre 'wonderful day' y la lista de problemas indica ironía."}},

    {id:"e16", nombre:"Making predictions",
     concepto:"Predecir lo que vendrá después en el texto inglés usando la información ya leída y el conocimiento del mundo. Se confirma o se ajusta durante la lectura.",
     ejemplo:"'The dark clouds gathered over the city…' → Prediction: it's going to rain.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe en inglés o castellano una predicción razonable.",
       texto:"'The goalkeeper fell to the ground and didn't get up.' Prediction: ___",
       respuestas:[["he is injured","the player is injured","esta lesionado","se ha lesionado","he will be substituted","the match will stop","el jugador esta lesionado","the goalkeeper is hurt","he is hurt"]],
       retro:"Predecir es formular una hipótesis razonable. No es adivinar: se apoya en pistas del texto y del mundo real."}},

    {id:"e17", nombre:"Understanding implied meaning",
     concepto:"En inglés es frecuente el 'understatement' o lo implícito: se sugiere sin decir. Comprender lo implícito demuestra un nivel alto de lectura.",
     ejemplo:"'It's a bit cold in here.' → Implied: 'Can you close the window / turn on the heating?'",
     ejercicio:{tipo:"quiz",
       consigna:"'Would you mind closing the door?' What is the speaker actually asking?",
       opciones:["If you can close the door (a request)","Whether you have a door","To leave the room","To break the door"],
       correcta:0,
       retro:"'Would you mind + -ing?' es una petición cortés, no una pregunta literal sobre el 'mind'."}},

    {id:"e18", nombre:"Understanding idioms and figurative language",
     concepto:"Los 'idioms' y las expresiones figuradas no se traducen literalmente. Hay que reconocerlas como bloques con un significado propio.",
     ejemplo:"'Break a leg!' = Good luck! (no 'romper una pierna'). 'It's raining cats and dogs' = It's raining heavily.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe el significado en castellano.",
       texto:"'To pull someone's leg' = ___ · 'Once in a blue moon' = ___ · 'Under the weather' = ___",
       respuestas:[["tomar el pelo","bromear","gastar una broma","burlarse"],["muy rara vez","casi nunca","de higos a brevas","rarisima vez","rarísima vez"],["sentirse mal","estar enfermo","no sentirse bien","estar pachucho","enfermo"]],
       retro:"Los idioms son bloques léxicos: se aprenden enteros, no palabra por palabra."}},

    {id:"e19", nombre:"Drawing conclusions",
     concepto:"Sacar una conclusión razonada a partir de la información del texto. Distinto de inferir: la conclusión sintetiza varias inferencias en un juicio final.",
     ejemplo:"Si el texto dice: 1) John studies every day, 2) takes notes in class, 3) practises listening… → Conclusion: John is a serious student.",
     ejercicio:{tipo:"quiz",
       consigna:"'Ana gets up at 5 a.m., runs 10 km, works 9 hours and studies at night.' What conclusion can we draw?",
       opciones:["She is lazy","She is a very disciplined person","She is rich","She has no interests"],
       correcta:1,
       retro:"Las tres evidencias apuntan a la misma conclusión: una persona disciplinada. La conclusión sintetiza, no repite."}},

    {id:"e20", nombre:"Understanding presuppositions",
     concepto:"Una presuposición es información que el autor da por sabida sin enunciarla. En inglés se detecta en construcciones como 'stop + -ing', 'again', 'too'.",
     ejemplo:"'Have you stopped biting your nails?' presupposes that the person used to bite their nails.",
     ejercicio:{tipo:"quiz",
       consigna:"'My brother also passed the exam.' What does this presuppose?",
       opciones:["That nobody passed the exam","That someone else passed the exam","That the exam was easy","That the brother failed"],
       correcta:1,
       retro:"'Also' presupone que otra persona (además del hermano) ha aprobado. La presuposición se activa por esa palabra."}}
  ]
},

/* ============ BLOQUE 3 · READING CRÍTICO ============ */
{
  id:"b3", nombre:"Reading · Comprensión crítica", emoji:"⚖️",
  desc:"Evaluar el texto inglés: hechos y opiniones, sesgo, argumentación, falacias y postura.",
  tecnicas:[
    {id:"e21", nombre:"Fact vs opinion",
     concepto:"Distinguir en inglés 'facts' (verificables) de 'opinions' (valoraciones personales). Los adjetivos valorativos, 'I think', 'probably', 'should' son pistas de opinión.",
     ejemplo:"Fact: 'The Earth orbits the Sun.' Opinion: 'This is the best film of the year.' 'Best' is a value judgement.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado como fact u opinion.",
       categorias:["Fact","Opinion"],
       items:[
         {texto:"'Water boils at 100 °C at sea level.'", cat:0},
         {texto:"'Modern music is worse than classical music.'", cat:1},
         {texto:"'The novel was published in 1952.'", cat:0},
         {texto:"'I think schools should ban mobile phones.'", cat:1},
         {texto:"'The European Union has 27 member states.'", cat:0}
       ],
       retro:"Los facts se comprueban; las opinions expresan valoraciones. 'I think', 'should', 'the best' son pistas claras."}},

    {id:"e22", nombre:"Recognizing bias",
     concepto:"Reconocer sesgos en textos ingleses: qué se destaca, qué se omite, a quién se cita, qué palabras se eligen. Ninguna fuente es completamente neutral.",
     ejemplo:"Un texto sobre inmigración que solo menciona crímenes tiene un sesgo de selección: está omitiendo otras realidades.",
     ejercicio:{tipo:"quiz",
       consigna:"Which question helps most to detect bias in an English text?",
       opciones:["How long is the text?","What is highlighted, what is omitted, and who is quoted?","How many paragraphs does it have?","Is the vocabulary difficult?"],
       correcta:1,
       retro:"Detectar sesgos es preguntar por las ausencias y las voces: qué no se dice, a quién no se cita, qué se presenta como natural."}},

    {id:"e23", nombre:"Evaluating source credibility",
     concepto:"Valorar la fiabilidad de una fuente inglesa: autoría, institución, fecha, referencias, tono. Una fuente creíble cita, contextualiza y reconoce límites.",
     ejemplo:"Un artículo firmado por un especialista con bibliografía y publicado en revista académica es más creíble que un post anónimo sin fuentes.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada rasgo como señal de fiabilidad o de poca fiabilidad.",
       categorias:["Reliable","Unreliable"],
       items:[
         {texto:"Signed by a researcher with institutional affiliation.", cat:0},
         {texto:"No author, no date, no references.", cat:1},
         {texto:"Published in a peer-reviewed journal.", cat:0},
         {texto:"Uses sensationalist language and CAPS.", cat:1},
         {texto:"Cites sources and provides bibliography.", cat:0}
       ],
       retro:"La credibilidad se construye con transparencia: autoría, fuentes, contexto y tono mesurado."}},

    {id:"e24", nombre:"Identifying argument and evidence",
     concepto:"En textos argumentativos ingleses hay que distinguir la 'claim' (tesis) de la 'evidence' (datos, ejemplos, autoridades) que la sostiene.",
     ejemplo:"Claim: 'Social media harms teenagers' mental health.' Evidence: 'A 2023 study found a 40% increase in anxiety among heavy users.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado como claim o evidence.",
       categorias:["Claim","Evidence"],
       items:[
         {texto:"'Reading in print is better than reading on screen.'", cat:0},
         {texto:"'According to a 2019 study, comprehension drops 20% on screens.'", cat:1},
         {texto:"'Governments should invest more in public libraries.'", cat:0},
         {texto:"'In Finland, library visits increased by 15% after the reform.'", cat:1}
       ],
       retro:"La claim es lo que se defiende; la evidence es lo que la sostiene. Un buen texto tiene claims con evidence."}},

    {id:"e25", nombre:"Detecting logical fallacies",
     concepto:"Una 'fallacy' es un razonamiento que parece válido pero no lo es. Las más frecuentes en inglés: ad hominem, hasty generalization, false dilemma, straw man.",
     ejemplo:"Ad hominem: 'Don't listen to him: he's ignorant.' Hasty generalization: 'All teenagers are lazy; I saw one sleeping in class.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada falacia.",
       categorias:["Ad hominem","Hasty generalization","False dilemma"],
       items:[
         {texto:"'Don't trust her: she's just a student.'", cat:0},
         {texto:"'My neighbour is rude, so all French people are rude.'", cat:1},
         {texto:"'Either you support this policy or you hate the country.'", cat:2},
         {texto:"'His argument is invalid because he failed maths.'", cat:0},
         {texto:"'I met two rude waiters, so service in this city is terrible.'", cat:1}
       ],
       retro:"Detectar falacias es la vacuna contra la manipulación: se ataca a la persona, se generaliza desde poco o se reducen las opciones."}},

    {id:"e26", nombre:"Comparing multiple sources",
     concepto:"Contrastar dos o más textos ingleses sobre el mismo tema: qué comparten, qué difieren, qué destacan, qué omiten. Técnica central de la lectura crítica.",
     ejemplo:"Comparar un artículo de la BBC y uno del New York Times sobre el mismo suceso revela encuadres distintos.",
     ejercicio:{tipo:"open",
       consigna:"Describe en castellano cómo compararías dos fuentes en inglés sobre el mismo tema.",
       criterios:[
         "Elegí un tema y dos fuentes identificables.",
         "Definí al menos tres criterios de comparación.",
         "Explicitó qué diferencias esperaría encontrar y cómo interpretarlas."
       ],
       modelo:"Tema: una reforma educativa. Fuente A: The Guardian (línea progresista). Fuente B: The Telegraph (línea conservadora). Compararía: 1) titulares y adjetivos; 2) datos numéricos citados; 3) voces expertas convocadas; 4) aspectos omitidos. Si el Guardian destaca las críticas sindicales y el Telegraph las empresariales, cada uno encuadra el tema desde su línea editorial."}},

    {id:"e27", nombre:"Recognizing stereotypes",
     concepto:"Un estereotipo es una imagen rígida y generalizadora de un grupo. Se detecta en generalizaciones con 'all', 'every', 'always' aplicadas a colectivos.",
     ejemplo:"'All British people drink tea at 5 pm' es un estereotipo: generaliza sin matices y sin evidencia.",
     ejercicio:{tipo:"quiz",
       consigna:"Which sentence contains a stereotype?",
       opciones:["'Some British people enjoy tea in the afternoon.'","'All British people drink tea at 5 pm.'","'Tea is a popular drink in the UK.'","'Many British families have tea at home.'"],
       correcta:1,
       retro:"El uso de 'all' convierte una observación en estereotipo. Los enunciados con 'some', 'many', 'often' son más prudentes y verificables."}},

    {id:"e28", nombre:"Understanding ideology",
     concepto:"Todo texto refleja una visión del mundo: valores, creencias, intereses. Analizarla es preguntarse qué se da por supuesto y qué visión se transmite.",
     ejemplo:"Un texto que presenta el éxito como fruto solo del esfuerzo individual transmite una ideología meritocrática.",
     ejercicio:{tipo:"open",
       consigna:"Analiza en castellano la ideología que podría haber detrás de: 'Anyone can succeed if they work hard enough'.",
       criterios:[
         "Identifiqué los valores que presupone la frase.",
         "Expliqué qué visión de la sociedad transmite.",
         "Reconocí algún posible límite o crítica."
       ],
       modelo:"La frase presupone que el éxito depende solo del esfuerzo individual. Transmite una ideología meritocrática que tiende a responsabilizar al individuo de su situación y a ignorar factores estructurales (acceso a educación, salud, contexto económico). Un análisis crítico señalaría que el esfuerzo es necesario pero no suficiente: las condiciones sociales también determinan las oportunidades."}},

    {id:"e29", nombre:"Evaluating arguments",
     concepto:"Valorar la solidez de un argumento inglés: ¿las premisas son verdaderas?, ¿la conclusión se sigue?, ¿qué tipo de evidencia se usa? Datos y autoridades son más sólidos que ejemplos aislados.",
     ejemplo:"'According to the WHO, smoking causes cancer' (strong: authority + data). 'My uncle smoked and lived to 90' (weak: anecdotal).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de evidencia.",
       categorias:["Data","Authority","Anecdote","Analogy"],
       items:[
         {texto:"'78% of respondents support the measure.'", cat:0},
         {texto:"'According to the WHO…'", cat:1},
         {texto:"'My uncle smoked all his life and lived to 90.'", cat:2},
         {texto:"'Banning phones is like banning books.'", cat:3},
         {texto:"'According to a Harvard study…'", cat:1}
       ],
       retro:"Datos y autoridades reconocidas son más sólidos que anécdotas o analogías, que a menudo son falaces."}},

    {id:"e30", nombre:"Taking a critical stance",
     concepto:"Después de comprender y evaluar un texto inglés, el lector crítico formula su propia postura con razones. En inglés, expresiones útiles: 'I agree to some extent…', 'I partly disagree…', 'While X is true, …'.",
     ejemplo:"'While I agree that social media can be harmful, I don't think banning it is the solution: education is more effective.'",
     ejercicio:{tipo:"open",
       consigna:"Escribe en inglés (o castellano si lo prefieres) tu postura sobre: 'Mobile phones should be banned in schools'.",
       criterios:[
         "Expuse una postura clara.",
         "Aporté al menos dos razones.",
         "Consideré un contraargumento o matiz.",
         "Cerré con una conclusión coherente."
       ],
       modelo:"I agree to some extent that mobile phones should be regulated in schools, but I don't think a total ban is the best solution. On the one hand, phones can distract students and facilitate cyberbullying. On the other hand, they are useful learning tools and banning them doesn't teach responsible use. A balanced policy would allow phones at specific times and teach digital skills. In conclusion, I would regulate rather than prohibit."}}
  ]
},

/* ============ BLOQUE 4 · VOCABULARY & WORD FORMATION ============ */
{
  id:"b4", nombre:"Vocabulary & Word formation", emoji:"🔤",
  desc:"Prefijos, sufijos, palabras compuestas, collocations, phrasal verbs, idioms y false friends.",
  tecnicas:[
    {id:"e31", nombre:"Prefixes (un-, re-, dis-, pre-, mis-, over-, under-)",
     concepto:"Los prefijos ingleses modifican el significado de la raíz. Los más frecuentes: un- (negación), re- (repetición), dis- (negación), pre- (antes), mis- (error), over- (exceso), under- (insuficiencia).",
     ejemplo:"happy → unhappy. do → redo. agree → disagree. view → preview. understand → misunderstand. cook → overcook. estimate → underestimate.",
     ejercicio:{tipo:"fill",
       consigna:"Forma la palabra añadiendo el prefijo adecuado.",
       texto:"'un-' + 'happy' = ___ · 're-' + 'write' = ___ · 'dis-' + 'agree' = ___",
       respuestas:[["unhappy"],["rewrite"],["disagree"]],
       retro:"Conocer unos cuantos prefijos multiplica tu vocabulario. Es una inversión de alto rendimiento."}},

    {id:"e32", nombre:"Suffixes (-tion, -ness, -able, -ful, -less, -ly)",
     concepto:"Los sufijos ingleses cambian la categoría gramatical o añaden matices: -tion (sustantivo), -ness (cualidad), -able (posibilidad), -ful (lleno de), -less (sin), -ly (adverbio).",
     ejemplo:"inform → information. happy → happiness. read → readable. care → careful / careless. quick → quickly.",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el sufijo correcto.",
       texto:"'educate' + sufijo → '___' (sustantivo) · 'use' + sufijo → '___' (adjetivo: que se puede usar) · 'care' + sufijo → '___' (sin cuidado)",
       respuestas:[["education"],["usable"],["careless"]],
       retro:"Los sufijos transforman la palabra y su función. Aprenderlos permite formar familias léxicas completas."}},

    {id:"e33", nombre:"Compound words",
     concepto:"Las 'compound words' se forman uniendo dos palabras: 'bedroom' (bed + room), 'sunflower', 'football', 'toothbrush'. Su significado se deduce de las partes pero es unitario.",
     ejemplo:"'rain' + 'bow' = rainbow. 'book' + 'shop' = bookshop. 'home' + 'work' = homework.",
     ejercicio:{tipo:"fill",
       consigna:"Forma la palabra compuesta a partir de las dos palabras.",
       texto:"'tooth' + 'brush' = ___ · 'sun' + 'flower' = ___ · 'foot' + 'ball' = ___",
       respuestas:[["toothbrush"],["sunflower"],["football"]],
       retro:"Los compuestos son productivos en inglés. Reconocer las partes ayuda a deducir el significado global."}},

    {id:"e34", nombre:"Collocations",
     concepto:"Las 'collocations' son combinaciones de palabras que se usan juntas con frecuencia en inglés: 'make a decision' (no 'do a decision'), 'take a shower', 'heavy rain'.",
     ejemplo:"'make a mistake', 'do homework', 'take a photo', 'give a presentation', 'have breakfast'.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada colocación según el verbo que la acompaña.",
       categorias:["Make","Do","Take","Have"],
       items:[
         {texto:"___ a decision", cat:0},
         {texto:"___ homework", cat:1},
         {texto:"___ a photo", cat:2},
         {texto:"___ breakfast", cat:3},
         {texto:"___ a mistake", cat:0},
         {texto:"___ a shower", cat:2},
         {texto:"___ the dishes", cat:1}
       ],
       retro:"Las colocaciones no se traducen literalmente; se aprenden como bloques. Son uno de los mayores indicadores de nivel."}},

    {id:"e35", nombre:"Phrasal verbs",
     concepto:"Un 'phrasal verb' es un verbo + partícula (preposición o adverbio) que juntos tienen un significado nuevo: 'give up' (rendirse), 'look after' (cuidar), 'turn on' (encender).",
     ejemplo:"'Look after' = cuidar. 'Give up' = rendirse. 'Put off' = posponer. 'Find out' = descubrir.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe el significado en castellano.",
       texto:"'give up' = ___ · 'look after' = ___ · 'find out' = ___ · 'put off' = ___",
       respuestas:[["rendirse","abandonar","dejar","renunciar"],["cuidar","cuidar a alguien","atender"],["descubrir","averiguar","enterarse de","enterarse"],["posponer","aplazar","dejar para despues","dejar para después"]],
       retro:"Los phrasal verbs son frecuentísimos en inglés oral. Se aprenden como bloques, no como verbo + preposición suelta."}},

    {id:"e36", nombre:"Synonyms and antonyms",
     concepto:"Los sinónimos ingleses amplían el vocabulario y permiten matizar: 'big/large/huge/enormous'. Los antónimos ayudan a definir por contraste: 'hot / cold'.",
     ejemplo:"Synonyms of 'happy': glad, cheerful, delighted, pleased. Antonyms: sad, unhappy, miserable.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe un sinónimo y un antónimo en inglés.",
       texto:"'happy' → synonym: ___ · antonym: ___",
       respuestas:[["glad","cheerful","delighted","pleased","joyful","content"],["sad","unhappy","miserable","sorrowful","depressed"]],
       retro:"Los sinónimos comparten el significado central pero matizan. Aprenderlos en pares con sus antónimos los fija mejor."}},

    {id:"e37", nombre:"Word families",
     concepto:"Una familia de palabras comparte raíz: 'act, action, active, activity, actor, actress, activate'. Conocerla permite usar la palabra en distintas funciones gramaticales.",
     ejemplo:"Familia de 'care': care, careful, careless, carefully, carer, caring.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la familia léxica.",
       texto:"'beauty' (sustantivo) → 'beautiful' (adjetivo) → '___' (adverbio) · 'create' (verbo) → '___' (sustantivo: creación) → 'creative' (adjetivo)",
       respuestas:[["beautifully"],["creation"]],
       retro:"Conocer las familias léxicas evita errores frecuentes como 'I did it beautiful' (por 'beautifully')."}},

    {id:"e38", nombre:"Idioms and expressions",
     concepto:"Los 'idioms' no se traducen literalmente: tienen significado figurado. Conocerlos mejora la comprensión y da naturalidad a la expresión oral.",
     ejemplo:"'Break a leg!' = ¡Suerte! 'Once in a blue moon' = casi nunca. 'Piece of cake' = muy fácil.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe el significado en castellano.",
       texto:"'A piece of cake' = ___ · 'Hit the books' = ___ · 'Under the weather' = ___",
       respuestas:[["muy facil","muy fácil","pan comido"],["ponerse a estudiar","estudiar mucho","hincar los codos","estudiar"],["sentirse mal","enfermo","indispuesto","no sentirse bien"]],
       retro:"Los idioms forman parte de la competencia cultural. Aprenderlos con su equivalente castellano los fija mejor."}},

    {id:"e39", nombre:"False friends (falsos amigos)",
     concepto:"Los 'false friends' son palabras que se parecen al castellano pero significan otra cosa: 'actually' = en realidad (no 'actualmente'), 'library' = biblioteca (no 'librería'), 'parents' = padres (no 'parientes').",
     ejemplo:"'I'm actually tired' = Estoy cansado en realidad (no 'actualmente'). 'The library is open' = La biblioteca está abierta (no la librería).",
     ejercicio:{tipo:"fill",
       consigna:"Traduce al castellano el significado real.",
       texto:"'Actually' = ___ · 'Library' = ___ · 'Parents' = ___ · 'Embarrassed' = ___",
       respuestas:[["en realidad","de hecho","realmente"],["biblioteca"],["padres","padre y madre","papa y mama"],["avergonzado","avergonzada","con verguenza","con vergüenza"]],
       retro:"Los false friends provocan malentendidos frecuentes. Reconocerlos es imprescindible a partir de un nivel intermedio."}},

    {id:"e40", nombre:"Vocabulary notebook & word maps",
     concepto:"Un cuaderno de vocabulario inglés bien organizado incluye: la palabra, el contexto donde apareció, el significado, la pronunciación (IPA), un sinónimo, un antónimo y una frase propia. Los 'word maps' agrupan palabras por tema.",
     ejemplo:"Palabra: 'thrilling'. Contexto: 'It was a thrilling match.' Significado: emocionante. IPA: /ˈθrɪlɪŋ/. Frase propia: 'The roller coaster was thrilling.'",
     ejercicio:{tipo:"open",
       consigna:"Crea una entrada completa de cuaderno de vocabulario para una palabra inglesa que hayas aprendido hoy.",
       criterios:[
         "Incluí la palabra y el contexto donde la encontré.",
         "Escribí el significado con mis propias palabras.",
         "Añadí una frase nueva en inglés de uso propio."
       ],
       modelo:"Word: 'breathtaking'. Context: 'The view from the mountain was breathtaking.' Meaning: extremely beautiful, so impressive that it takes your breath away. IPA: /ˈbreθˌteɪkɪŋ/. Synonym: stunning. My sentence: 'The sunset over the sea was absolutely breathtaking.'"}}
  ]
},

/* ============ BLOQUE 5 · VERB TENSES ============ */
{
  id:"b5", nombre:"Grammar · Verb tenses", emoji:"⏱️",
  desc:"Los tiempos verbales del inglés: presente, pasado, perfecto, futuro y condicionales.",
  tecnicas:[
    {id:"e41", nombre:"Present Simple",
     concepto:"Se usa para rutinas, hábitos y verdades generales. Estructura: sujeto + verbo (con -s en 3.ª persona singular). Negativa e interrogativa con do/does.",
     ejemplo:"'She works in a hospital.' 'They don't like coffee.' 'Do you speak English?' 'Water boils at 100 °C.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta del Present Simple.",
       texto:"He ___ (study) every day. · They ___ (not / like) fish. · ___ she ___ (speak) French?",
       respuestas:[["studies"],["don't like","do not like"],["does",""],["speak"]],
       retro:"En 3.ª persona singular se añade -s/-es. Las negativas e interrogativas usan do/does + infinitivo sin -s."}},

    {id:"e42", nombre:"Present Continuous",
     concepto:"Se usa para acciones que ocurren ahora, en este momento, o para planes futuros ya decididos. Estructura: sujeto + am/is/are + verbo-ing.",
     ejemplo:"'She is studying right now.' 'They aren't listening.' 'I'm meeting Ana tomorrow at 5.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con Present Continuous.",
       texto:"I ___ (read) a book right now. · They ___ (not / work) today. · What ___ you ___ (do)?",
       respuestas:[["am reading","'m reading"],["aren't working","are not working"],["are"],["doing"]],
       retro:"El Present Continuous expresa acciones en progreso o planes ya cerrados. Se forma con be + -ing."}},

    {id:"e43", nombre:"Past Simple (regular & irregular)",
     concepto:"Se usa para acciones terminadas en un momento pasado concreto. Los regulares añaden -ed; los irregulares tienen formas propias que hay que memorizar.",
     ejemplo:"'I visited Rome in 2019.' 'She went to the party.' 'They didn't come.' 'Did you see the film?'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con Past Simple.",
       texto:"I ___ (visit) London last year. · She ___ (go) to Paris. · They ___ (not / come) to the party.",
       respuestas:[["visited"],["went"],["didn't come","did not come"]],
       retro:"'Go → went' es irregular. Las negativas usan 'didn't + infinitivo' (sin pasado en el verbo principal)."}},

    {id:"e44", nombre:"Past Continuous",
     concepto:"Describe acciones en desarrollo en un momento pasado. Frecuente para narrar: 'While I was walking…'. Estructura: was/were + -ing.",
     ejemplo:"'I was reading when she called.' 'They were playing football at 6 pm.' 'While I was cooking, he was watching TV.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con Past Continuous.",
       texto:"I ___ (walk) home when I saw her. · They ___ (study) all evening. · While she ___ (cook), he set the table.",
       respuestas:[["was walking"],["were studying"],["was cooking"]],
       retro:"El Past Continuous sitúa la acción en desarrollo; el Past Simple interrumpe o cierra la escena."}},

    {id:"e45", nombre:"Present Perfect",
     concepto:"Conecta el pasado con el presente: experiencias, acciones recientes, estados que continúan. Estructura: have/has + participio. Marcadores: ever, never, just, already, yet, since, for.",
     ejemplo:"'I have visited Japan twice.' 'She has just finished.' 'Have you ever been to London?' 'I've lived here for 5 years.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con Present Perfect.",
       texto:"I ___ (never / be) to Canada. · She ___ (just / finish) her homework. · ___ you ever ___ (see) this film?",
       respuestas:[["have never been","'ve never been"],["has just finished","'s just finished"],["have"],["seen"]],
       retro:"El Present Perfect no indica un momento pasado concreto: se centra en la experiencia o el resultado presente."}},

    {id:"e46", nombre:"Past Perfect",
     concepto:"Indica una acción anterior a otra acción pasada. Estructura: had + participio. Se usa con 'before, after, when, by the time'.",
     ejemplo:"'When I arrived, she had already left.' 'They had finished before we came.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con Past Perfect.",
       texto:"When I arrived, they ___ (already / leave). · She ___ (not / see) the film before that day. · By the time we got there, the concert ___ (start).",
       respuestas:[["had already left"],["hadn't seen","had not seen"],["had started"]],
       retro:"El Past Perfect marca el 'pasado del pasado': una acción que ocurrió antes de otra acción pasada."}},

    {id:"e47", nombre:"Future: will / going to",
     concepto:"'Will' para decisiones espontáneas, predicciones y promesas. 'Be going to' para planes e intenciones y predicciones basadas en evidencia. Ambos proyectan al futuro.",
     ejemplo:"'I'll help you.' (decisión) 'I'm going to study medicine.' (plan) 'Look at those clouds: it's going to rain.' (evidencia)",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según el uso del futuro.",
       categorias:["Will (decisión/predicción)","Going to (plan/intención)"],
       items:[
         {texto:"'I'll call you back in five minutes.'", cat:0},
         {texto:"'We're going to travel to Italy next summer.'", cat:1},
         {texto:"'I think it will be cold tomorrow.'", cat:0},
         {texto:"'She's going to start a new job in May.'", cat:1}
       ],
       retro:"Will suele ser espontáneo o predictivo; going to expresa planes decididos o evidencia visible."}},

    {id:"e48", nombre:"Future Continuous & Future Perfect",
     concepto:"Future Continuous (will be + -ing) describe una acción en progreso en un momento futuro. Future Perfect (will have + participio) describe una acción ya completada antes de un momento futuro.",
     ejemplo:"'At 8 pm I'll be watching the match.' 'By 2030 I'll have finished my degree.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el futuro adecuado.",
       texto:"This time tomorrow I ___ (travel) to Madrid. (Future Continuous) · By next June she ___ (finish) her thesis. (Future Perfect)",
       respuestas:[["will be travelling","will be traveling","'ll be travelling","'ll be traveling"],["will have finished","'ll have finished"]],
       retro:"Future Continuous: acción en progreso en un momento futuro. Future Perfect: acción terminada antes de un momento futuro."}},

    {id:"e49", nombre:"Conditionals 0 & 1",
     concepto:"Zero Conditional (If + present, present) expresa verdades generales. First Conditional (If + present, will + infinitivo) expresa situaciones reales o probables en el futuro.",
     ejemplo:"'If you heat water, it boils.' (0) 'If it rains, we'll stay home.' (1)",
     ejercicio:{tipo:"fill",
       consigna:"Completa el condicional.",
       texto:"If you ___ (mix) red and blue, you get purple. (0) · If it ___ (rain) tomorrow, we ___ (stay) home. (1)",
       respuestas:[["mix"],["rains"],["will stay","'ll stay"]],
       retro:"En ambos condicionales, la 'if-clause' va en presente (nunca 'will' tras 'if' en inglés estándar)."}},

    {id:"e50", nombre:"Conditionals 2, 3 & Mixed",
     concepto:"Second Conditional (If + past simple, would + inf.) expresa hipótesis improbables o imaginarias. Third Conditional (If + past perfect, would have + part.) expresa hipótesis sobre el pasado no realizado. Mixed combina ambos.",
     ejemplo:"'If I were rich, I would travel the world.' (2) 'If I had studied, I would have passed.' (3)",
     ejercicio:{tipo:"fill",
       consigna:"Completa los condicionales.",
       texto:"If I ___ (be) you, I would accept the offer. (2) · If she ___ (study), she would have passed. (3)",
       respuestas:[["were"],["had studied"]],
       retro:"Second: hipótesis irreal presente ('if I were…'). Third: hipótesis irreal pasada ('if I had studied…'). En el segundo se usa 'were' con todas las personas."}}
  ]
},

/* ============ BLOQUE 6 · STRUCTURES & SYNTAX ============ */
{
  id:"b6", nombre:"Grammar · Structures & syntax", emoji:"🧱",
  desc:"Modales, pasiva, estilo indirecto, relativas, comparativos, gerundio/infinitivo, artículos, preposiciones.",
  tecnicas:[
    {id:"e51", nombre:"Modal verbs (can, must, should, might…)",
     concepto:"Los modales expresan habilidad, obligación, posibilidad, permiso o consejo: can/could (habilidad, permiso), must (obligación), should (consejo), might/may (posibilidad), have to (obligación externa).",
     ejemplo:"'I can swim.' 'You must wear a seatbelt.' 'You should rest.' 'It might rain.' 'I have to work tomorrow.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según el valor del modal.",
       categorias:["Ability","Obligation","Advice","Possibility"],
       items:[
         {texto:"'She can speak three languages.'", cat:0},
         {texto:"'You must stop at the red light.'", cat:1},
         {texto:"'You should drink more water.'", cat:2},
         {texto:"'It might snow tomorrow.'", cat:3},
         {texto:"'He could play the piano when he was five.'", cat:0}
       ],
       retro:"Los modales no cambian de forma por persona ni llevan -s. Su significado depende del contexto."}},

    {id:"e52", nombre:"Passive voice",
     concepto:"La pasiva pone el foco en la acción o en el objeto, no en quien la realiza. Estructura: be + participio (+ by + agente). Muy frecuente en textos académicos y periodísticos.",
     ejemplo:"Active: 'They built the bridge in 1890.' Passive: 'The bridge was built in 1890.'",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a pasiva.",
       texto:"'Shakespeare wrote Hamlet.' → 'Hamlet ___ ___ by Shakespeare.' · 'They will announce the results tomorrow.' → 'The results ___ ___ announced tomorrow.'",
       respuestas:[["was"],["written"],["will"],["be"]],
       retro:"La pasiva en inglés: be en el tiempo correspondiente + participio pasado. El agente se introduce con 'by'."}},

    {id:"e53", nombre:"Reported speech",
     concepto:"El estilo indirecto reproduce lo que dijo alguien sin citarlo literalmente. En inglés hay que retroceder un tiempo verbal: present → past, past → past perfect, will → would, can → could.",
     ejemplo:"Direct: 'I am tired,' she said. Reported: She said (that) she was tired. Direct: 'I will come,' he said. Reported: He said he would come.",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a estilo indirecto.",
       texto:"'I live in London,' she said. → She said she ___ in London. · 'I will help you,' he said. → He said he ___ help me.",
       respuestas:[["lived"],["would"]],
       retro:"En inglés el retroceso temporal es obligatorio. Los pronombres también cambian según quién habla y a quién se refiere."}},

    {id:"e54", nombre:"Relative clauses (who, which, that, whose, where)",
     concepto:"Las oraciones de relativo añaden información sobre un sustantivo. 'Who' para personas, 'which' para cosas, 'that' para ambos (en defining), 'whose' para posesión, 'where' para lugares.",
     ejemplo:"'The man who called you is my uncle.' 'The book which I bought is fascinating.' 'The city where I was born is small.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el relativo adecuado.",
       texto:"The woman ___ called you is my aunt. (persona) · The book ___ I read was amazing. (cosa) · The boy ___ father is a doctor lives here. (posesión)",
       respuestas:[["who","that"],["which","that"],["whose"]],
       retro:"'Who' persona, 'which' cosa, 'that' ambos en defining, 'whose' posesión. En non-defining solo who/which, entre comas."}},

    {id:"e55", nombre:"Comparatives & superlatives",
     concepto:"Comparativos: adjetivos cortos + -er… than (bigger than); largos con 'more… than'. Superlativos: the + -est o the most. Irregulares: good → better → the best; bad → worse → the worst.",
     ejemplo:"'She is taller than me.' 'This is more interesting than that.' 'He is the best student in the class.'",
     ejercicio:{tipo:"fill",
       consigna:"Completa con comparativo o superlativo.",
       texto:"This book is ___ (interesting) than that one. · She is the ___ (tall) girl in class. · My phone is ___ (good) than yours.",
       respuestas:[["more interesting"],["tallest"],["better"]],
       retro:"Los adjetivos cortos usan -er/-est; los largos, more/most. 'Good' y 'bad' son irregulares."}},

    {id:"e56", nombre:"Gerunds & infinitives",
     concepto:"Algunos verbos van seguidos de gerundio (-ing): enjoy, finish, avoid, mind. Otros, de infinitivo (to + verbo): want, decide, hope, need. Algunos admiten ambos con matiz distinto: remember, stop.",
     ejemplo:"'I enjoy reading.' (gerundio) 'I want to travel.' (infinitivo) 'Remember to lock the door.' vs 'I remember locking the door.'",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada verbo según la forma que exige.",
       categorias:["+ gerund (-ing)","+ infinitive (to + verb)"],
       items:[
         {texto:"enjoy", cat:0},
         {texto:"want", cat:1},
         {texto:"finish", cat:0},
         {texto:"decide", cat:1},
         {texto:"avoid", cat:0},
         {texto:"hope", cat:1},
         {texto:"mind", cat:0}
       ],
       retro:"No hay regla absoluta: se aprenden con el uso. 'Enjoy + -ing', 'want + to', son bloques fijos."}},

    {id:"e57", nombre:"Articles: a / an / the / zero article",
     concepto:"'A/an' para primera mención o seres indeterminados. 'The' para específicos o ya mencionados. 'Zero article' con plurales genéricos y nombres propios. 'An' antes de sonido vocálico.",
     ejemplo:"'I saw a dog. The dog was black.' 'Cats are independent.' (zero) 'I live in Spain.' (zero) 'An apple' / 'a university' (por el sonido, no la letra).",
     ejercicio:{tipo:"fill",
       consigna:"Completa con a, an, the o nada.",
       texto:"I bought ___ book yesterday. ___ book is fascinating. She is ___ honest person. I love ___ music.",
       respuestas:[["a"],["the","The"],["an"],["", "nothing"]],
       retro:"'An' antes de sonido vocálico: 'an honest person' (la h es muda). Sin artículo con generalizaciones ('I love music')."}},

    {id:"e58", nombre:"Prepositions of time & place",
     concepto:"'In' con meses, años, estaciones, ciudades, países y espacios cerrados. 'On' con días, fechas y superficies. 'At' con horas, momentos concretos y lugares específicos.",
     ejemplo:"'In July', 'in 2020', 'in London'. 'On Monday', 'on 5th May', 'on the table'. 'At 5 o'clock', 'at night', 'at the bus stop'.",
     ejercicio:{tipo:"fill",
       consigna:"Completa con in, on o at.",
       texto:"I was born ___ 1990. · The meeting is ___ Monday. · We met ___ the bus stop. · She arrived ___ 8 pm.",
       respuestas:[["in"],["on"],["at"],["at"]],
       retro:"In (periodos largos), on (días y fechas), at (horas y puntos concretos). Es una de las áreas más difíciles del inglés."}},

    {id:"e59", nombre:"Question formation",
     concepto:"En inglés las preguntas requieren inversión o auxiliar: 'Do you…?', 'Did she…?', 'Have they…?'. En las Wh-questions, primero la partícula, luego el auxiliar, luego el sujeto.",
     ejemplo:"'Do you like coffee?' 'Where did you go?' 'What are you doing?' 'Have you ever been to London?'",
     ejercicio:{tipo:"order",
       consigna:"Ordena las palabras para formar una pregunta correcta.",
       items:[
         "Where",
         "did",
         "you",
         "go",
         "last summer?"
       ],
       retro:"Estructura: Wh- + auxiliar + sujeto + verbo principal + complementos. Sin auxiliar la pregunta no es correcta."}},

    {id:"e60", nombre:"Word order (SVO) & inversion",
     concepto:"El inglés es una lengua de orden fijo: Sujeto + Verbo + Objeto. Cambiar el orden cambia el significado. La inversión ocurre en preguntas, tras 'never, rarely, hardly' y en condicionales enfáticos.",
     ejemplo:"'The dog bit the man' ≠ 'The man bit the dog'. 'Never have I seen such a thing.' (inversión enfática).",
     ejercicio:{tipo:"quiz",
       consigna:"Which sentence has correct English word order?",
       opciones:["'Yesterday I went to the cinema with my friends.'","'Yesterday went I to the cinema with my friends.'","'To the cinema yesterday I with my friends went.'","'With my friends to the cinema yesterday went I.'"],
       correcta:0,
       retro:"El inglés respeta SVO + complementos. Los adverbios de tiempo pueden ir al principio, pero el orden sujeto-verbo se mantiene."}}
  ]
},

{

    {id:"e61", nombre:"Listening for gist",

    {id:"e62", nombre:"Listening for specific information",
