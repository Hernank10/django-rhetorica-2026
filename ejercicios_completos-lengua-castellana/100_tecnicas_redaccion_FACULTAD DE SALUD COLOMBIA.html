<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Médico-Legal · Facultad de Salud · Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0;
    --paper:#fdfaf3;
    --paper-2:#f7f2e8;
    --ink:#14213d;
    --navy:#14213d;
    --navy-dark:#0a1528;
    --navy-soft:#dde5f0;
    --bronze:#a67c52;
    --bronze-dark:#7c5c39;
    --bronze-soft:#f0e4d3;
    --bronze-line:#c9a96e;
    --muted:#6b6355;
    --line:#d8d2c3;
    --line-2:#b8af99;
    --ok:#2f6b3a;
    --ok-soft:#e0efe2;
    --bad:#8b1e1e;
    --bad-soft:#f8e0e0;
    --radius:6px;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 12% 0%, #f4f1ea 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TOPBAR oficial ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 22px;
    background:linear-gradient(180deg, #fdfaf3 0%, #f7f2e8 100%);
    border-bottom:3px double var(--navy);
    box-shadow:0 1px 0 var(--bronze-line) inset;
  }
  .brand{display:flex; align-items:center; gap:14px; min-width:0;}
  .seal{
    width:52px; height:52px; flex:0 0 auto;
    border-radius:50%;
    padding:3px;
    background:transparent;
    border:1.5px dashed var(--bronze);
    display:grid; place-items:center;
  }
  .seal-inner{
    width:100%; height:100%;
    border-radius:50%;
    border:1px solid var(--navy);
    display:grid; place-items:center;
    background:
      radial-gradient(circle, var(--paper) 60%, var(--bronze-soft) 100%);
    color:var(--navy);
    font-family:"PT Serif",Georgia,serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:.5px;
    position:relative;
  }
  .seal-inner::before,
  .seal-inner::after{
    content:"★";
    position:absolute;
    font-size:6px;
    color:var(--bronze);
  }
  .seal-inner::before{top:5px; left:50%; transform:translateX(-50%);}
  .seal-inner::after{bottom:5px; left:50%; transform:translateX(-50%);}
  .brand h1{
    font-family:"PT Serif",Georgia,serif;
    font-size:16px; margin:0; font-weight:700; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--navy);
  }
  .brand p{
    margin:2px 0 0; font-size:11px; color:var(--muted);
    font-family:"Public Sans",sans-serif; font-weight:600;
    letter-spacing:.6px; text-transform:uppercase;
  }
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{
    display:flex; align-items:center; gap:8px;
    font-family:"Public Sans",sans-serif; font-size:11px; color:var(--muted);
    font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  }
  .progress-bar{width:140px; height:6px; border:1px solid var(--line-2); background:#f0ece0; overflow:hidden;}
  #progressFill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--navy), var(--bronze));
    transition:width .4s;
  }

  .btn{
    font-family:"Public Sans",sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.5px; text-transform:uppercase;
    padding:8px 14px; cursor:pointer;
    border:1px solid var(--navy); background:var(--paper); color:var(--navy);
    transition:.16s;
  }
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy); color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent; border-color:var(--line-2); color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc; color:var(--navy);}
  .only-mobile{display:none;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:sticky; top:92px;
    max-height:calc(100vh - 116px);
    overflow-y:auto;
    background:var(--paper);
    border:1px solid var(--navy);
    padding:4px;
    box-shadow:var(--shadow);
  }
  .sidebar-inner{
    border:1px solid var(--bronze-line);
    padding:12px;
    background:
      linear-gradient(180deg, #fdfaf3 0%, #f7f2e8 100%);
  }
  #search{
    width:100%; font-family:"Public Sans",sans-serif; font-size:12px;
    padding:9px 11px; border:1px solid var(--line-2);
    background:var(--paper); color:var(--ink);
    outline:none; margin-bottom:12px;
    letter-spacing:.3px;
  }
  #search:focus{border-color:var(--navy);}

  .cat{margin-bottom:4px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:9px 10px;
    font-family:"Public Sans",sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.4px; color:var(--navy);
    text-transform:uppercase;
    border-left:3px solid transparent;
  }
  .cat-head:hover{background:var(--navy-soft); border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto; font-size:9px; color:var(--bronze); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:"PT Serif",Georgia,serif; font-size:11px; font-weight:700;
    background:var(--bronze-soft); color:var(--bronze-dark);
    padding:1px 7px; border:1px solid var(--bronze-line);
  }
  .cat-bar{height:3px; background:#e8e2d2; margin:0 10px 6px; overflow:hidden; border:1px solid var(--line);}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--navy), var(--bronze)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{
    font-family:"Public Sans",sans-serif; font-size:11px; color:var(--muted);
    padding:0 10px 8px; line-height:1.5; font-style:italic;
  }
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-family:"Public Sans",sans-serif; font-size:11.5px; line-height:1.4;
    color:#3a3a3a;
    padding:7px 10px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:var(--bronze-soft); border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft); border-left-color:var(--navy); color:var(--navy-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:13px; height:13px; margin-top:1px;
    border:1px solid var(--line-2);
    display:grid; place-items:center; font-size:8px; color:transparent;
    background:var(--paper);
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--paper);
    border:1px solid var(--navy);
    padding:6px;
    position:relative;
    box-shadow:var(--shadow);
  }
  .panel-inner{
    border:1px solid var(--bronze-line);
    padding:26px 30px 30px;
    position:relative;
    background:
      radial-gradient(circle at 100% 0%, #f7f2e8 0%, transparent 40%),
      var(--paper);
  }

  /* sello decorativo grande en esquina */
  .panel-seal{
    position:absolute;
    top:18px; right:22px;
    width:70px; height:70px;
    border-radius:50%;
    border:1.5px dashed var(--bronze);
    padding:3px;
    opacity:.75;
  }
  .panel-seal-inner{
    width:100%; height:100%;
    border-radius:50%;
    border:1px solid var(--navy);
    display:grid; place-items:center;
    color:var(--navy);
    font-family:"PT Serif",Georgia,serif;
    font-weight:700; font-size:11px;
    text-align:center; line-height:1;
  }

  .tech-head{margin-bottom:20px; padding-right:90px;}
  .badge{
    display:inline-block;
    font-family:"Public Sans",sans-serif; font-size:10px; font-weight:800;
    letter-spacing:1.4px; text-transform:uppercase;
    color:var(--bronze-dark); background:var(--bronze-soft);
    border:1px solid var(--bronze-line);
    padding:3px 10px;
    margin-bottom:12px;
  }
  .tech-head h2{
    margin:0;
    font-family:"PT Serif",Georgia,serif;
    font-size:26px; line-height:1.2; letter-spacing:-.3px;
    font-weight:700; color:var(--navy);
  }
  .tech-pos{
    font-family:"Public Sans",sans-serif; font-size:11px;
    color:var(--muted); margin-top:6px; font-weight:600;
    letter-spacing:.6px; text-transform:uppercase;
  }
  .rule{
    height:3px;
    border-top:1px solid var(--navy);
    border-bottom:1px solid var(--bronze-line);
    margin:16px 0 20px;
  }

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:11px; height:11px;
    border:1px solid var(--line-2); background:var(--paper);
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.2); border-color:var(--bronze);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{background:var(--bronze); border-color:var(--bronze-dark);}

  /* ---------- FLASHCARD con doble filete ---------- */
  .flashcard{
    perspective:1600px; margin:0 0 14px; cursor:pointer;
    border:1px solid var(--navy);
    padding:4px;
    background:var(--paper);
    box-shadow:var(--shadow);
  }
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
    border:1px solid var(--bronze-line);
    padding:0;
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    padding:22px 26px 22px 26px;
    display:flex; flex-direction:column; overflow:auto;
    background:var(--paper);
    background-image:
      linear-gradient(transparent 27px, rgba(20,33,61,.06) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
  }
  .fc-face p{
    margin:0;
    font-family:"PT Serif",Georgia,serif;
    font-size:15.5px; line-height:28px; color:var(--ink);
  }
  .fc-back{
    transform:rotateY(180deg);
    background:#faf6ec;
  }
  .fc-back p{color:var(--navy-dark); font-style:italic;}
  .fc-tag{
    font-family:"Public Sans",sans-serif; font-size:10px; font-weight:800;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--bronze-dark);
    margin-bottom:12px; display:block;
    padding-bottom:6px; border-bottom:1px solid var(--bronze-line);
  }
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:"Public Sans",sans-serif; font-size:10.5px;
    color:#9c907c; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  }
  .flip-btn{margin:0 0 26px;}

  /* ---------- SECCIONES ---------- */
  .sec-title{
    display:flex; align-items:center; gap:10px;
    font-family:"PT Serif",Georgia,serif;
    font-size:16px; font-weight:700; color:var(--navy);
    letter-spacing:-.2px;
    margin:0 0 12px; padding-bottom:8px;
    border-bottom:1px solid var(--navy);
    position:relative;
  }
  .sec-title::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-3px; height:1px;
    background:var(--bronze-line);
  }
  .sec-title span{
    font-family:"Public Sans",sans-serif;
    font-size:10px; font-weight:700; color:var(--muted);
    margin-left:auto; letter-spacing:.6px; text-transform:uppercase;
  }

  .consigna{
    font-family:"PT Serif",Georgia,serif;
    font-size:15px; line-height:1.6; color:var(--ink);
    background:var(--paper-2); border-left:3px solid var(--bronze);
    padding:12px 16px; margin:0 0 16px;
  }

  /* ---------- OPCIONES ---------- */
  .opciones{display:flex; flex-direction:column; gap:8px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-family:"Public Sans",sans-serif;
    font-size:13.5px; line-height:1.5;
    background:var(--paper); border:1px solid var(--line-2);
    color:var(--ink); padding:12px 14px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--navy); background:var(--navy-soft);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:22px; height:22px;
    background:var(--paper-2); color:var(--muted);
    border:1px solid var(--line-2);
    display:grid; place-items:center;
    font-family:"PT Serif",Georgia,serif; font-size:12px; font-weight:700;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff; border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff; border-color:var(--bad);}

  /* ---------- FILL ---------- */
  .fill-texto{
    font-family:"PT Serif",Georgia,serif;
    font-size:16px; line-height:2.4; margin:0 0 16px; color:var(--ink);
  }
  .hueco{
    font:inherit; font-family:"PT Serif",Georgia,serif;
    font-size:15px; font-style:italic;
    border:none; border-bottom:1.5px solid var(--bronze);
    background:transparent; color:var(--bronze-dark); font-weight:700;
    padding:2px 6px; min-width:110px; text-align:center;
    outline:none;
  }
  .hueco:focus{background:var(--bronze-soft); border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  /* ---------- ORDER ---------- */
  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .order-col h4{
    font-family:"Public Sans",sans-serif; font-size:10px; font-weight:800;
    letter-spacing:1.1px; text-transform:uppercase; color:var(--muted);
    margin:0 0 8px;
  }
  .pool, .seq{min-height:120px; padding:8px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:var(--paper-2); border:1px dashed var(--line-2);}
  .seq{background:#f4efe2; border:1px solid var(--bronze-line);}
  .pool:empty::after, .seq:empty::after{content:"···"; color:#c9c2b2; font-size:16px; text-align:center; margin:auto; letter-spacing:4px;}
  .ord-item{
    font:inherit; font-family:"Public Sans",sans-serif;
    font-size:12.5px; line-height:1.4; text-align:left;
    background:var(--paper); border:1px solid var(--line-2);
    padding:9px 11px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:8px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--navy); background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{
    flex:0 0 auto; width:18px; height:18px;
    background:var(--navy); color:var(--paper);
    display:grid; place-items:center;
    font-family:"PT Serif",Georgia,serif; font-size:11px; font-weight:700;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* ---------- CLASSIFY ---------- */
  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line-2);
    padding:11px 13px; margin-bottom:8px;
  }
  .cl-item p{
    margin:0; font-family:"PT Serif",Georgia,serif;
    font-size:14px; line-height:1.5; flex:1 1 260px;
  }
  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .chip{
    font-family:"Public Sans",sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:.4px; padding:5px 10px; cursor:pointer;
    border:1px solid var(--line-2); background:var(--paper-2); color:var(--muted);
    transition:.14s; text-transform:uppercase;
  }
  .chip:hover{border-color:var(--navy); color:var(--navy);}
  .chip.sel{background:var(--navy); border-color:var(--navy); color:var(--paper);}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* ---------- OPEN ---------- */
  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{
    display:flex; gap:10px; align-items:flex-start;
    font-family:"Public Sans",sans-serif; font-size:12.5px;
    color:#4a4a4a; line-height:1.55;
  }
  .criterios input{margin-top:2px; accent-color:var(--navy); width:15px; height:15px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:"PT Serif",Georgia,serif;
    font-size:15px; line-height:26px; color:var(--ink);
    padding:12px 16px;
    border:1px solid var(--bronze-line);
    background-color:#fdfaf3;
    background-image:
      linear-gradient(transparent 25px, rgba(20,33,61,.07) 25px 26px);
    background-size:100% 26px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--navy); box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e; font-style:italic;}

  /* ---------- FEEDBACK ---------- */
  .feedback{margin-top:16px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s; border-left:3px solid transparent;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border-left-color:var(--ok); color:#1d4526;}
  .feedback.mal{background:var(--bad-soft); border-left-color:var(--bad); color:#5c1414;}
  .feedback.info{background:var(--bronze-soft); border-left-color:var(--bronze); color:#5a3f22;}
  .feedback strong{
    display:block; font-family:"Public Sans",sans-serif;
    font-size:11px; letter-spacing:1.1px; text-transform:uppercase; margin-bottom:6px;
  }
  .feedback p{margin:0; font-family:"PT Serif",Georgia,serif; font-size:14.5px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px;}

  /* ---------- MODELO ---------- */
  .modelo{
    display:none; margin-top:14px;
    background:var(--paper-2); border-left:3px solid var(--navy);
    padding:13px 16px;
    font-family:"PT Serif",Georgia,serif;
    font-size:14.5px; line-height:1.65; color:var(--navy-dark);
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{
    font-family:"Public Sans",sans-serif; font-size:10px;
    letter-spacing:1px; text-transform:uppercase;
    color:var(--navy); display:block; margin-bottom:5px;
  }
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  /* ---------- CUADERNO ---------- */
  .cuaderno{margin-top:32px; padding-top:22px; border-top:1px solid var(--navy); position:relative;}
  .cuaderno::before{
    content:""; position:absolute; left:0; right:0; top:2px; height:1px;
    background:var(--bronze-line);
  }
  .cuaderno-foot{
    display:flex; justify-content:space-between; align-items:center;
    font-family:"Public Sans",sans-serif; font-size:10.5px; color:var(--muted);
    margin-top:8px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  }
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  /* ---------- NAV ---------- */
  .nav-foot{
    display:flex; justify-content:space-between; gap:12px;
    margin-top:26px; padding-top:20px;
    border-top:1px solid var(--bronze-line);
  }
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:320px; max-height:100vh;
      z-index:100; padding:4px;
      transform:translateX(-105%); transition:transform .28s ease;
    }
    .sidebar.open{transform:none;}

    {id:"ml5", nombre:"Evitar el gerundio de posterioridad",

       consigna:"Completa con la forma correcta.",

       respuestas:[["el","él"],["si","sí"],["aun","aún"]],
       retro:"La tilde diacrítica distingue funciones. En documentos legales, escribirla correctamente es exigencia formal."}},

    {id:"ml27", nombre:"Tildes en términos jurídicos y médicos",
     concepto:"Los términos médico-legales siguen las reglas generales. Errores frecuentes: «diagnostico» (verbo) vs «diagnóstico» (sustantivo), «clínica», «patología», «jurídico», «expediente», «memorial».",
     ejemplo:"«Diagnóstico» (sustantivo esdrújulo). «Diagnostico» (verbo, presente, sin tilde). «Jurídico», «clínico», «médico», «practico/practicó».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada palabra según su acentuación.",
       categorias:["Esdrújula","Grave","Aguda"],
       items:[
         {texto:"diagnóstico", cat:0},
         {texto:"jurídico", cat:0},
         {texto:"expediente", cat:1},
         {texto:"memorial", cat:1},
         {texto:"practicó", cat:2}
       ],
       retro:"Los términos médico-legales siguen las reglas generales de acentuación."}},

    {id:"ml28", nombre:"Uso de «a ver» / «haber» / «haver»",
     concepto:"Confusión frecuente: «a ver» (mirar, comprobar), «haber» (verbo auxiliar), «haver» (no existe en español actual). En escritos médico-legales: «Debe haber evidencia», «Vamos a ver el expediente».",
     ejemplo:"Correcto: «Debe haber evidencia documental». Correcto: «Vamos a ver el expediente». Incorrecto: «Debe a ver evidencia».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con «a ver» o «haber».",
       texto:"«Debe ___ evidencia» · «Vamos ___ el expediente» · «Pudo ___ omisión»",
       respuestas:[["haber"],["a ver"],["haber"]],
       retro:"«Haber» es auxiliar o infinitivo; «a ver» es preposición + verbo. La confusión es frecuente y grave."}},

    {id:"ml29", nombre:"Uso de «porque», «por qué», «porqué», «por que»",
     concepto:"Cuatro formas: «porque» (causa), «por qué» (interrogativo), «porqué» (sustantivo), «por que» (relativo). En dictámenes médico-legales es esencial distinguirlas.",
     ejemplo:"«No asistió porque estaba hospitalizado». «¿Por qué no asistió?». «Se desconoce el porqué de su inasistencia». «La razón por que no asistió».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"No asistió ___ estaba hospitalizado (porque). · ¿___ no asistió? (Por qué). · Se desconoce el ___ de su ausencia (porqué).",
       respuestas:[["porque"],["por que","por qué"],["porque","porqué"]],
       retro:"Cada forma tiene función propia. La confusión es error frecuente en textos formales."}},

    {id:"ml30", nombre:"Siglas en salud y derecho",
     concepto:"Siglas frecuentes: EPS (Entidad Promotora de Salud), IPS (Institución Prestadora de Servicios de Salud), SGSSS (Sistema General de Seguridad Social en Salud), INS (Instituto Nacional de Salud), INVIMA, SIVIGILA, CNMH, CSJ. Se escriben sin puntos y en mayúsculas.",
     ejemplo:"«La EPS debe autorizar el servicio». «El INS reportó el brote». «El SGSSS se rige por la Ley 100 de 1993».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el significado.",
       texto:"EPS = Entidad Promotora de ___ · IPS = Institución ___ de Servicios de Salud · INS = Instituto Nacional de ___",
       respuestas:[["salud"],["prestadora"],["salud"]],
       retro:"Las siglas se escriben sin puntos y en mayúsculas. Se definen la primera vez que aparecen."}}
  ]
},

/* ============ 4 · VICIOS DEL LENGUAJE Y CLARIDAD ============ */
{
  id:"b4", nombre:"Vicios del lenguaje y claridad", emoji:"☑",
  desc:"Pleonasmo, anfibología, cosismo, queísmo funcional, impropiedad y muletillas.",
  tecnicas:[
    {id:"ml31", nombre:"Pleonasmo o redundancia",
     concepto:"El pleonasmo es la repetición innecesaria de ideas: «subir arriba», «salir afuera», «lo vi con mis propios ojos». En documentos médico-legales resta credibilidad y ocupa espacio sin aportar información.",
     ejemplo:"Incorrecto: «El paciente subió arriba a la habitación». Correcto: «El paciente subió a la habitación». Incorrecto: «Lo vi personalmente con mis propios ojos». Correcto: «Lo vi personalmente».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la redundancia.",
       texto:"«El informe debe ser breve y conciso» → «El informe debe ser ___».",
       respuestas:[["breve","conciso"]],
       retro:"La redundancia resta fuerza al texto legal. Se corrige eliminando el elemento duplicado."}},

    {id:"ml32", nombre:"Anfibología o doble sentido",
     concepto:"La anfibología es la ambigüedad por doble interpretación sintáctica. En textos médico-legales es un vicio grave: puede alterar el sentido de una cláusula o un diagnóstico.",
     ejemplo:"Ambiguo: «Se le practicó la cirugía al paciente con anestesia general». ¿El paciente tenía anestesia general, o se le practicó con ese tipo de anestesia? Ambos sentidos son posibles.",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe para eliminar la ambigüedad.",
       texto:"«Se operó al paciente con anestesia general» → «Se operó al paciente ___ anestesia general».",
       respuestas:[["bajo","utilizando","mediante","con"]],
       retro:"La anfibología se corrige explicitando la relación. En textos legales puede invalidar cláusulas."}},

    {id:"ml33", nombre:"Cosismo («cosa», «cosas»)",
     concepto:"El cosismo es el uso abusivo de «cosa» en lugar del término preciso. En textos médico-legales, «cosa» es inaceptable: debe especificarse si es hallazgo, síntoma, lesión, documento, norma.",
     ejemplo:"Incorrecto: «Se observó una cosa extraña en el examen». Correcto: «Se observó una lesión eritematosa en la región lumbar».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye «cosa» por término preciso.",
       texto:"«Sucedió una cosa importante durante el procedimiento» → «Se presentó una ___ durante el procedimiento».",
       respuestas:[["complicacion","complicación","evento","incidente","situacion","situación","anomalia","anomalía"]],
       retro:"El cosismo es vago e impreciso. En textos médico-legales, el término exacto es exigible."}},

    {id:"ml34", nombre:"Muletillas y fórmulas vacías",
     concepto:"Muletillas como «en su momento procesal oportuno», «a la mayor brevedad posible», «cúmpleme manifestar», «en atención a lo anteriormente expuesto» ocupan espacio sin aportar información. El lenguaje claro las elimina.",
     ejemplo:"En lugar de «A la mayor brevedad posible», se escribe: «Antes del 15 de julio». En lugar de «En su momento procesal oportuno», se escribe: «Dentro del término legal».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye la fórmula vacía.",
       texto:"«A la mayor brevedad posible» → «Antes del ___» (fecha: 15 de julio)",
       respuestas:[["15 de julio","15/07","15 de julio de 2024"]],
       retro:"Las fórmulas vacías oscurecen. El lenguaje claro exige precisión temporal y factual."}},

    {id:"ml35", nombre:"Impropiedad léxica",
     concepto:"La impropiedad es el uso de una palabra con significado distinto al que tiene. En medicina: «intoxicación» por «infección», «síntoma» por «signo», «diagnóstico» por «pronóstico». Errores graves.",
     ejemplo:"Incorrecto: «El paciente presenta diagnóstico favorable». Correcto: «El paciente presenta pronóstico favorable». «Diagnóstico» = identificación; «pronóstico» = predicción.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su significado.",
       categorias:["Identificación de enfermedad","Predicción de evolución","Malestar referido","Hallazgo objetivo"],
       items:[
         {texto:"diagnóstico", cat:0},
         {texto:"pronóstico", cat:1},
         {texto:"síntoma", cat:2},
         {texto:"signo", cat:3},
         {texto:"etiología", cat:0}
       ],
       retro:"La impropiedad léxica altera el significado. En medicina, puede inducir a error clínico."}},

    {id:"ml36", nombre:"Queísmo funcional y abuso del «que»",
     concepto:"El abuso del «que» encadenado produce frases ilegibles: «Que si el paciente que vino que traía una orden que no era válida...». Se corrige eliminando «que» superfluos y dividiendo oraciones.",
     ejemplo:"Incorrecto: «Dijo que el perito que había examinado que el paciente que estaba presente...». Correcto: «Dijo que el perito había examinado al paciente presente».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina el «que» superfluo.",
       texto:"«Resulta que el informe que fue presentado que estaba incompleto» → «El informe presentado estaba ___».",
       respuestas:[["incompleto"]],
       retro:"El abuso del «que» genera frases confusas. El estilo culto lo evita."}},

    {id:"ml37", nombre:"Cacofonía",
     concepto:"La cacofonía es la repetición de sonidos desagradables: «el área del área», «los los...», «el atestado atestigua». En documentos médico-legales se corrige por eufonía.",
     ejemplo:"Cacofónico: «Se solicitó su solicitud de solicitud». Mejor: «Se solicitó la petición correspondiente».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin cacofonía.",
       texto:"«El acta del acto fue archivada en el archivo» → «El acta del acto fue archivada en el ___».",
       respuestas:[["deposito","depósito","fondo documental","archivo central"]],
       retro:"La cacofonía se corrige por sustitución léxica. En documentos formales, la eufonía es parte del estilo."}},

    {id:"ml38", nombre:"Barbarismos frecuentes",
     concepto:"Barbarismos: «haiga» por «haya», «dijieron» por «dijeron», «vinistes» por «viniste», «prevee» por «prevé», «satisfació» por «satisfizo». En textos médico-legales restan credibilidad profesional.",
     ejemplo:"Correcto: «Espero que haya respuesta». Correcto: «Ellos dijeron». Correcto: «El artículo prevé». Correcto: «Satisfizo los requisitos».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el barbarismo.",
       texto:"«Se espera que haiga respuesta» → «Se espera que ___ respuesta».",
       respuestas:[["haya"]],
       retro:"Los barbarismos son formas incorrectas. En documentos formales, son señal de escaso dominio de la lengua."}},

    {id:"ml39", nombre:"Improvisación sintáctica y anacoluto",
     concepto:"El anacoluto es la ruptura de la estructura sintáctica: la oración empieza de una manera y termina de otra. En textos médico-legales produce incoherencia.",
     ejemplo:"Anacoluto: «El paciente que ingresó ayer, sus exámenes fueron normales». Correcto: «Al paciente que ingresó ayer le fueron normales los exámenes» o «Los exámenes del paciente que ingresó ayer fueron normales».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin anacoluto.",
       texto:"«El informe que presentó el perito, sus conclusiones son claras» → «Las conclusiones del informe que presentó el perito son ___».",
       respuestas:[["claras"]],
       retro:"El anacoluto produce incoherencia. Se corrige reorganizando la oración completa."}},

    {id:"ml40", nombre:"Ultracorrección",
     concepto:"La ultracorrección consiste en corregir lo que no está mal, por miedo a equivocarse: «Bogotá» escrito «Bogotà», «síntoma» en lugar de «síntoma» (correcto), «dijistes» en lugar de «dijiste» (correcto).",
     ejemplo:"Incorrecto: «Vinistes tarde». Correcto: «Viniste tarde». Incorrecto: «Bilbáo». Correcto: «Bilbao».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la ultracorrección.",
       texto:"«Tú vinistes al hospital» → «Tú ___ al hospital».",
       respuestas:[["viniste"]],
       retro:"La ultracorrección es un error por exceso de celo. La norma culta exige la forma correcta, no la exagerada."}}
  ]
},

/* ============ 5 · ESTILO UNIVERSITARIO ============ */
{
  id:"b5", nombre:"Estilo universitario en salud y derecho", emoji:"🎓",
  desc:"Registro, citas, paráfrasis, plagio, argumentación y coherencia académica.",
  tecnicas:[
    {id:"ml41", nombre:"Registro académico-formal",
     concepto:"El registro universitario exige formalidad, precisión y objetividad. Se evitan coloquialismos, valoraciones sin respaldo y expresiones vagas. El vocabulario debe ser técnico y preciso.",
     ejemplo:"No: «El paciente está muy mal». Sí: «El paciente se encuentra en regulares condiciones generales, con TA 80/50 mmHg y SatO₂ 88 %».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Académico","Coloquial"],
       items:[
         {texto:"«Presenta taquicardia e hipotensión»,", cat:0},
         {texto:"«Está muy malito»,", cat:1},
         {texto:"«Se evidencia deterioro hemodinámico»,", cat:0},
         {texto:"«Se puso mal de repente»,", cat:1},
         {texto:"«El cuadro es compatible con sepsis»,", cat:0}
       ],
       retro:"El registro académico es formal y técnico. Los coloquialismos restan credibilidad."}},

    {id:"ml42", nombre:"Citas APA en salud",
     concepto:"El estilo APA es frecuente en ciencias de la salud (enfermería, psicología, salud pública). Formato: (Autor, año). En el texto: «Según García (2020)...» o «(García, 2020)».",
     ejemplo:"«Diversos estudios confirman esta asociación (García, 2020; López, 2021)». Referencia: García, M. (2020). Título del artículo. Revista, 15(2), 45-58.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita APA.",
       texto:"«El estudio fue realizado por García en 2020 (___, ___)».",
       respuestas:[["garcia","garcía"],["2020"]],
       retro:"La cita APA usa (Autor, año). La lista de referencias va al final, ordenada alfabéticamente."}},

    {id:"ml43", nombre:"Citas Vancouver en medicina",
     concepto:"El estilo Vancouver es el estándar en medicina. Las citas se numeran entre corchetes según orden de aparición: [1], [2], [3]. La lista final va numerada.",
     ejemplo:"«El tratamiento con estatinas reduce la mortalidad cardiovascular [1]». Referencia: 1. Smith A, Jones B. Statins and mortality. N Engl J Med. 2020;382(3):245-55.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la cita Vancouver.",
       texto:"«El tratamiento reduce la mortalidad cardiovascular ___». (primera cita)",
       respuestas:[["[1]","[1].","1"]],
       retro:"En Vancouver las citas van numeradas entre corchetes en orden de aparición."}},

    {id:"ml44", nombre:"Citas de normas jurídicas colombianas",
     concepto:"Las normas se citan con tipo, número, año y artículo: «Ley 100 de 1993, art. 153», «Resolución 1995 de 1999, art. 1», «Constitución Política de Colombia, art. 49». Es formato estándar en textos médico-legales.",
     ejemplo:"«El derecho a la salud está consagrado en el artículo 49 de la Constitución Política de Colombia». «La Resolución 1995 de 1999 regula el diligenciamiento de la historia clínica».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita normativa.",
       texto:"«La historia clínica se rige por la ___ 1995 de ___ ».",
       respuestas:[["resolucion","resolución"],["1999"]],
       retro:"Las normas se citan con tipo, número y año. En Colombia, la Res. 1995 de 1999 regula la historia clínica."}},

    {id:"ml45", nombre:"Citas de jurisprudencia colombiana",
     concepto:"La jurisprudencia se cita con corporación, tipo de sentencia, número y año: «Corte Constitucional, Sentencia T-760 de 2008», «Corte Suprema de Justicia, Sala de Casación Civil, SC-1234 de 2020». Se incluye magistrado ponente cuando corresponde.",
     ejemplo:"«Corte Constitucional, Sentencia T-760 de 2008, M.P. Manuel José Cepeda Espinosa». Es la sentencia estructural del derecho a la salud en Colombia.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita jurisprudencial.",
       texto:"«Corte ___ , Sentencia ___ de 2008, M.P. Manuel José Cepeda».",
       respuestas:[["constitucional"],["T-760","T 760"]],
       retro:"La jurisprudencia se cita con corporación, tipo, número y año. La T-760 de 2008 es hito del derecho a la salud."}},

    {id:"ml46", nombre:"Paráfrasis académica",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, citando la fuente. En textos médico-legales es esencial para sintetizar jurisprudencia, doctrina y literatura sin plagiar.",
     ejemplo:"Original: «El derecho a la salud es fundamental y autónomo» (T-760/08). Paráfrasis: «La Corte Constitucional reconoció el carácter fundamental y autónomo del derecho a la salud (T-760/08)».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis.",
       texto:"«Según la Corte Constitucional, el derecho a la salud es fundamental y ___ ».",
       respuestas:[["autonomo","autónomo"]],
       retro:"La paráfrasis mantiene la idea con palabras propias y cita la fuente. Sin cita, sería plagio."}},

    {id:"ml47", nombre:"Plagio y autoplagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. El autoplagio es reutilizar textos propios ya publicados sin indicarlo. Ambos son faltas graves de integridad académica y científica.",
     ejemplo:"Copiar un párrafo de un artículo o de una sentencia sin comillas ni cita es plagio. Reutilizar un trabajo propio ya entregado es autoplagio.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir y referenciar","Citar entre comillas con referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"ml48", nombre:"Conectores lógicos académicos",
     concepto:"Los conectores organizan el razonamiento: adición (además), contraste (sin embargo), causa (porque, debido a), consecuencia (por lo tanto), orden (en primer lugar). En textos académicos son esenciales.",
     ejemplo:"«El paciente presentaba fiebre; sin embargo, no había signos de focalización. Por lo tanto, se solicitaron estudios complementarios».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector.",
       categorias:["Adición","Contraste","Consecuencia"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"por lo tanto", cat:2},
         {texto:"no obstante", cat:1},
         {texto:"en consecuencia", cat:2}
       ],
       retro:"Los conectores revelan la relación lógica entre ideas. Son esenciales en el razonamiento académico."}},

    {id:"ml49", nombre:"Argumentación con evidencia",
     concepto:"La argumentación médico-legal se apoya en evidencia: literatura científica, normas, jurisprudencia, datos clínicos. La jerarquía de la evidencia orienta la fuerza del argumento.",
     ejemplo:"«La evidencia muestra que la profilaxis reduce la incidencia de trombosis (García, 2020). Además, la Ley 100 de 1993 exige garantizar servicios de prevención. Por lo tanto, la omisión configura responsabilidad».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de la argumentación médico-legal.",
       items:[
         "Introducción con la tesis o pretensión.",
         "Argumentos con evidencia (estudios, normas, jurisprudencia).",
         "Refutación de objeciones.",
         "Conclusión con recomendación o pretensión jurídica."
       ],
       retro:"La argumentación médico-legal combina evidencia científica con fundamento jurídico. Cada elemento refuerza el conjunto."}},

    {id:"ml50", nombre:"Coherencia global del texto",
     concepto:"La coherencia es la unidad de sentido: todas las partes contribuyen al mismo propósito. En textos médico-legales, la contradicción entre secciones es un vicio grave que puede invalidar el documento.",
     ejemplo:"Un dictamen cuyas conclusiones contradicen los hallazgos previamente descritos es incoherente y puede ser objeto de objeción procesal.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué afecta la COHERENCIA global, no la cohesión?",
       opciones:["Falta de conector","Contradicción entre secciones","Falta ortográfica","Oración larga"],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. La contradicción entre secciones es fallo grave."}}
  ]
},

    {id:"ml54", nombre:"Estructura del memorial",
     concepto:"El memorial colombiano contiene: encabezado (destinatario, referencia), identificación del peticionario, hechos o fundamentos, petición, anexos y firma. Se usa para solicitudes, recursos y escritos procesales.",
     ejemplo:"«Señor Juez X. E. S. D. Ref: proceso 2024-00123. Yo, Juan Pérez, mayor de edad... respetuosamente solicito... Anexos: ... Firma».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del memorial.",
       items:[
         "Encabezado con destinatario y referencia.",
         "Identificación del peticionario.",
         "Hechos o fundamentos de la petición.",
         "Petición concreta.",
         "Anexos y firma."
       ],
       retro:"El memorial sigue estructura previsible. Cumplirla garantiza la validez procesal del escrito."}},

    {id:"ml55", nombre:"Estructura de la demanda",
     concepto:"La demanda colombiana (CGP, art. 82) contiene: designación del juez, identificación de las partes, pretensiones, hechos, fundamentos de derecho, pruebas y juramento estimatorio. Cada parte es obligatoria.",
     ejemplo:"«Señor Juez Civil del Circuito. Demandante: X. Demandado: Y. PRETENSIONES: Primera. Que se declare... HECHOS: Primero. Que el 15 de enero... FUNDAMENTOS DE DERECHO: ... PRUEBAS: ... JURAMENTO ESTIMATORIO: ...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la demanda.",
       items:[
         "Designación del juez y referencia.",
         "Identificación de las partes.",
         "Pretensiones.",
         "Hechos y fundamentos de derecho.",
         "Pruebas, juramento estimatorio y firma."
       ],
       retro:"La demanda tiene estructura legal obligatoria (CGP, art. 82). Su omisión genera inadmisión o rechazo."}},

    {id:"ml56", nombre:"Estructura de la sentencia",
     concepto:"La sentencia colombiana contiene: encabezado, antecedentes, consideraciones (análisis probatorio y jurídico), decisión (parte resolutiva) y firma. La parte resolutiva se profiere «administrando justicia en nombre de la República y por autoridad de la ley».",
     ejemplo:"«...administrando justicia en nombre de la República de Colombia y por autoridad de la ley, RESUELVE: Primero. Declarar la responsabilidad civil médica. Segundo. Condenar en costas...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la fórmula resolutiva.",
       texto:"«Administrando justicia en nombre de la ___ de Colombia y por autoridad de la ___».",
       respuestas:[["republica","república"],["ley"]],
       retro:"La fórmula es obligatoria en las sentencias colombianas. Su omisión vicia el acto."}},

    {id:"ml57", nombre:"Estructura del contrato de prestación de servicios de salud",
     concepto:"El contrato de prestación de servicios de salud contiene: partes, objeto, obligaciones, tarifas, plazo, supervisión, obligaciones en seguridad del paciente, terminación y solución de controversias. Debe cumplir la Ley 100 de 1993 y normas concordantes.",
     ejemplo:"«Contrato de prestación de servicios. Entre la EPS X y la IPS Y se celebra el presente contrato regido por las siguientes cláusulas: PRIMERA. Objeto. SEGUNDA. Obligaciones. TERCERA. Tarifas...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las cláusulas.",
       items:[
         "Partes y objeto del contrato.",
         "Obligaciones de las partes.",
         "Tarifas y forma de pago.",
         "Plazo, supervisión y seguridad del paciente.",
         "Terminación, controversias y firma."
       ],
       retro:"El contrato de salud cumple función reguladora. Su estructura protege a las partes y a los usuarios."}},

    {id:"ml58", nombre:"Estructura del recurso de apelación",
     concepto:"El recurso de apelación contiene: identificación del proceso, decisión recurrida, fundamentos (inconformidad), petición y competencia del superior. Se dirige al juez o tribunal superior jerárquico.",
     ejemplo:"«Recurso de apelación contra la sentencia del 15 de mayo de 2024 proferida por el Juzgado X. FUNDAMENTOS: 1. El juez incurrió en error en la valoración probatoria... PETICIÓN: Que se revoque...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del recurso.",
       texto:"El recurso de apelación contiene: identificación, decisión ___, fundamentos y ___.",
       respuestas:[["recurrida"],["peticion","petición"]],
       retro:"El recurso expone los fundamentos de la inconformidad y la petición concreta al superior."}},

    {id:"ml59", nombre:"Estructura de la resolución administrativa en salud",
     concepto:"La resolución administrativa (MinSalud, Supersalud, secretarías) contiene: encabezado (número, fecha, entidad), consideraciones, parte resolutiva (RESUELVE), artículos y firma. Regula materias de salud pública.",
     ejemplo:"«RESOLUCIÓN 1234 DE 2024. Por la cual se adopta el protocolo de atención. El Ministro de Salud, en ejercicio de sus facultades, CONSIDERANDO: ... RESUELVE: Artículo primero. Adoptar...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la resolución.",
       items:[
         "Encabezado (número, fecha, entidad).",
         "Consideraciones o motivos.",
         "Parte resolutiva (RESUELVE).",
         "Artículos.",
         "Firma de la autoridad."
       ],
       retro:"La resolución administrativa tiene estructura fija. Su cumplimiento es obligatorio en el sector salud."}},

    {id:"ml60", nombre:"Estructura del informe de auditoría médica",
     concepto:"El informe de auditoría médica contiene: identificación del caso, documentación revisada, criterios de auditoría (normas, guías), hallazgos, conclusiones y recomendaciones. Es documento técnico y legal.",
     ejemplo:"«Auditoría del caso X. Documentación: historia clínica, autorizaciones, facturación. Criterios: GPC MinSalud, Res. 1995/99. Hallazgos: ... Conclusiones: ... Recomendaciones: ...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del informe de auditoría.",
       items:[
         "Identificación del caso auditado.",
         "Documentación revisada.",
         "Criterios de auditoría (normas y guías).",
         "Hallazgos y análisis.",
         "Conclusiones y recomendaciones."
       ],
       retro:"La auditoría médica evalúa calidad y pertinencia. Su informe es soporte de decisiones administrativas y jurídicas."}}
  ]
},

/* ============ 7 · TÉCNICA NORMATIVA EN SALUD ============ */
{
  id:"b7", nombre:"Técnica normativa en salud", emoji:"§",
  desc:"Artículos, parágrafos, sanciones y estructura de normas sanitarias.",
  tecnicas:[
    {id:"ml61", nombre:"Estructura del artículo normativo",
     concepto:"El artículo es la unidad básica de la norma. Tiene una sola idea regulada. Se numera ordinalmente (Artículo primero, artículo 1.º). Puede contener incisos, numerales y literales.",
     ejemplo:"«Artículo 1.º Objeto. La presente resolución tiene por objeto adoptar el protocolo de atención... Parágrafo. El protocolo se aplicará a todas las IPS del territorio nacional».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del artículo.",
       texto:"El artículo contiene una sola idea regulada. Se puede descomponer en ___, numerales y ___.",
       respuestas:[["incisos"],["literales"]],
       retro:"El artículo regula una sola materia. Los incisos, numerales y literales desarrollan su contenido."}},

    {id:"ml62", nombre:"Uso del parágrafo",
     concepto:"El parágrafo amplía, excepciona o precisa el contenido de un artículo. Se numera (Parágrafo 1.º, Parágrafo 2.º) o se denomina simplemente «Parágrafo». Nunca introduce materias nuevas.",
     ejemplo:"«Artículo 5.º Ámbito. La norma se aplica a todas las entidades. Parágrafo 1.º Las entidades territoriales tendrán seis meses para adecuarse. Parágrafo 2.º Se exceptúan los municipios de categoría 6».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Para qué sirve el parágrafo en la técnica normativa?",
       opciones:["Para regular una materia nueva","Para ampliar, excepcionar o precisar el contenido del artículo","Para reemplazar el artículo","Para adornar el texto"],
       correcta:1,
       retro:"El parágrafo amplía, excepciona o precisa. Nunca introduce materias nuevas: para eso se requiere otro artículo."}},

    {id:"ml63", nombre:"Incisos y numerales",
     concepto:"Los incisos son párrafos internos del artículo. Los numerales se escriben con número arábigo y punto (1., 2., 3.) o con letra (a., b., c.) cuando son literales. Ambos descomponen el contenido del artículo.",
     ejemplo:"«Artículo 10. Obligaciones. Son obligaciones de las IPS: 1. Garantizar la atención inicial de urgencias. 2. Reportar eventos adversos. 3. Cumplir con los protocolos vigentes».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento.",
       categorias:["Numeral","Literal","Inciso"],
       items:[
         {texto:"1. Reportar eventos.", cat:0},
         {texto:"a) Presentar documento.", cat:1},
         {texto:"Párrafo interno del artículo que desarrolla la idea.", cat:2},
         {texto:"2. Garantizar atención.", cat:0},
         {texto:"b) Adjuntar soporte.", cat:1}
       ],
       retro:"Numerales (1., 2.), literales (a., b.) e incisos son formas de descomposición del artículo."}},

    {id:"ml64", nombre:"Vigencias y derogatorias",
     concepto:"Toda norma indica su vigencia (desde cuándo rige) y, si corresponde, la derogatoria de normas anteriores. La cláusula de vigencia cierra el articulado.",
     ejemplo:"«Artículo 20. Vigencia. La presente resolución rige a partir de su publicación y deroga la Resolución 1234 de 2020».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cláusula de vigencia.",
       texto:"«La presente resolución rige a partir de su ___ y deroga la Resolución ___ de 2020».",
       respuestas:[["publicacion","publicación"],["1234"]],
       retro:"La vigencia y la derogatoria son cláusulas obligatorias. Sin ellas, la norma queda incompleta."}},

    {id:"ml65", nombre:"Régimen sancionatorio en salud",
     concepto:"Las normas sanitarias establecen sanciones: amonestación, multas, suspensión, cierre temporal o definitivo, cancelación de la habilitación. La sanción se gradúa según la gravedad y la reincidencia.",
     ejemplo:"«Artículo 15. Sanciones. El incumplimiento de las obligaciones dará lugar a: 1. Amonestación escrita. 2. Multa hasta de 100 SMLMV. 3. Suspensión de la habilitación hasta por seis meses. 4. Cierre definitivo del servicio».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada sanción según su gravedad.",
       categorias:["Leve","Media","Grave"],
       items:[
         {texto:"Amonestación escrita", cat:0},
         {texto:"Multa hasta 50 SMLMV", cat:1},
         {texto:"Cierre definitivo del servicio", cat:2},
         {texto:"Suspensión de la habilitación", cat:1},
         {texto:"Cancelación de la habilitación", cat:2}
       ],
       retro:"Las sanciones se gradúan. La reincidencia y la gravedad del daño determinan el nivel aplicable."}},

    {id:"ml66", nombre:"Sujetos y ámbito de aplicación",
     concepto:"Toda norma en salud precisa sus destinatarios (sujetos) y su ámbito (territorial, material, temporal). Esto evita ambigüedad sobre a quién aplica y hasta dónde.",
     ejemplo:"«Artículo 2. Ámbito de aplicación. La presente resolución se aplica a las EPS, IPS, entidades territoriales y profesionales de la salud que operen en el territorio nacional».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el ámbito de aplicación.",
       texto:"«La presente resolución se aplica a las ___, IPS y profesionales de la salud del territorio ___».",
       respuestas:[["eps","EPS"],["nacional","colombiano"]],
       retro:"El ámbito de aplicación precisa destinatarios y territorio. Sin él, la norma es ambigua."}},

    {id:"ml67", nombre:"Lenguaje deóntico: «deberá», «podrá», «tendrá»",
     concepto:"El lenguaje normativo usa formas deónticas: «deberá» (obligación), «podrá» (facultad), «no podrá» (prohibición), «tendrá» (mandato). La elección correcta determina el alcance de la norma.",
     ejemplo:"«El profesional deberá registrar la atención» (obligación). «La entidad podrá delegar la función» (facultad). «No podrá negarse la atención de urgencias» (prohibición).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada forma verbal según su valor normativo.",
       categorias:["Obligación","Facultad","Prohibición"],
       items:[
         {texto:"«deberá registrar»", cat:0},
         {texto:"«podrá delegar»", cat:1},
         {texto:"«no podrá negarse»", cat:2},
         {texto:"«tendrá la obligación de»", cat:0},
         {texto:"«no podrá suspenderse»", cat:2}
       ],
       retro:"El lenguaje deóntico debe usarse con precisión. «Deberá» obliga, «podrá» faculta, «no podrá» prohíbe."}},

    {id:"ml68", nombre:"Definiciones y glosario normativo",
     concepto:"Cuando la norma usa términos técnicos o susceptibles de interpretación, los define en un artículo de definiciones al inicio. Esto garantiza interpretación uniforme.",
     ejemplo:"«Artículo 3. Definiciones. Para efectos de la presente resolución se entiende por: 1. Evento adverso: lesión o daño no intencional... 2. Seguridad del paciente: ...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cláusula de definiciones.",
       texto:"«Para efectos de la presente ___ se entiende por evento adverso: ___ ».",
       respuestas:[["resolucion","resolución","norma"],["lesion","lesión","dano","daño","evento no intencional"]],
       retro:"El artículo de definiciones garantiza interpretación uniforme. Es frecuente en normas técnicas de salud."}},

    {id:"ml69", nombre:"Transitoriedad y régimen de transición",
     concepto:"Cuando una norma cambia el régimen anterior, se prevé un régimen de transición: qué pasa con las situaciones en curso, los plazos de adecuación y los derechos adquiridos.",
     ejemplo:"«Artículo 18. Régimen de transición. Los procesos iniciados antes de la vigencia de la presente resolución continuarán tramitándose conforme a la norma anterior, por un término máximo de seis meses».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cláusula de transición.",
       texto:"«Los procesos iniciados antes de la vigencia continuarán tramitándose conforme a la norma ___, por un término máximo de ___ meses».",
       respuestas:[["anterior"],["6","seis"]],
       retro:"El régimen de transición protege la seguridad jurídica. Precisa qué pasa con las situaciones en curso."}},

    {id:"ml70", nombre:"Concordancia con la Ley 100 y normas superiores",
     concepto:"Toda norma en salud debe ser concordante con la Constitución (arts. 48, 49), la Ley 100 de 1993, la Ley Estatutaria 1751 de 2015 y las normas superiores. La contradicción genera nulidad o inaplicación.",
     ejemplo:"«La presente resolución se expide en ejercicio de las facultades legales, en concordancia con la Ley 100 de 1993 y la Ley 1751 de 2015, y respetando el derecho fundamental a la salud».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la concordancia normativa.",
       texto:"«La presente resolución se expide en concordancia con la Ley ___ de 1993 y la Ley Estatutaria ___ de 2015».",
       respuestas:[["100"],["1751"]],
       retro:"Las normas de salud deben guardar concordancia con la Constitución y la Ley Estatutaria. La contradicción genera nulidad."}}
  ]
},

    {id:"ml71", nombre:"Constitución Política de Colombia",

    {id:"ml73", nombre:"Decretos y resoluciones",

    {id:"ml77", nombre:"Citas de guías de práctica clínica colombianas",

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_medico_legal_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";

  // sello decorativo
  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "SALUD ·\nCOL");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn);
  panel.appendChild(seal);

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));
  panel.appendChild(head);
  panel.appendChild(el("div","rule"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  panel.appendChild(dots);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","• Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Voltee la tarjeta para ver el ejemplo ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","• Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toque de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "Ejercicio interactivo <span>compruebe su comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "Cuaderno del estudiante <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escriba aquí sus notas, ejemplos, redacciones propias, dudas…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ Correcto" : "✗ Revise su respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Complete todos los huecos","Escriba una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ " + aciertos + " de " + total + " correctas" : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Su secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pase todos los elementos a la columna de la derecha.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ Secuencia correcta" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigne una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-family:'Public Sans',sans-serif;font-size:11px;color:#8b1e1e;font-weight:700;letter-spacing:.4px;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ Clasificación correcta" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 6; ta.placeholder = "Redacte aquí su respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escriba primero su respuesta","Redacte al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compare su texto con el modelo: ¿qué ideas coinciden? ¿qué le falta? ¿qué aporta usted?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
