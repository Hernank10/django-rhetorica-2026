<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Estética y Educación Artística · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#f2e6d3;
    --paper:#fffdf7;
    --paper-2:#fbf6ec;
    --ink:#2a1810;
    --muted:#7a6453;
    --line:#e2d1ba;
    --line-2:#cbb296;
    --accent:#b45309;
    --accent-dark:#7c2d12;
    --accent-soft:#fdebd2;
    --wine:#7f1d1d;
    --wine-soft:#fbe4e0;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(70,35,15,.06), 0 12px 30px rgba(70,35,15,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    background:
      radial-gradient(circle at 15% 0%, #faf1e2 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,253,247,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #f0c98c;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:system-ui,sans-serif;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600; font-family:system-ui,sans-serif;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#e6d3b8; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#b45309,#7f1d1d); transition:width .4s;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#f7ecdb; border-color:#a88b6c;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#fbf6ec; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
    font-family:system-ui,sans-serif;
  }
  .cat-head:hover{background:#f7ecdb;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    background:var(--wine-soft); color:var(--wine);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#eadbc3; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--wine)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#42301f;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link:hover{background:#f7ecdb;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--wine));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #f0c98c; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(180,83,9,.22); border-color:var(--accent);}

  /* flashcard · papel de cuaderno de bocetos */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fffdf5;
    background-image:
      linear-gradient(transparent 27px, rgba(124,45,18,.18) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
    box-shadow:inset 22px 0 0 -21px #e0965a;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #f0c98c;
    background-color:#fdf5e8;
    box-shadow:inset 22px 0 0 -21px #c9644a;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:28px; color:#2e1f14;}
  .fc-back p{color:#5b2d10;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#a58e74; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
    font-family:system-ui,sans-serif;
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#3e2c1a;
    background:#fbf6ec; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#fdf5e8; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#eadbc3; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#2e1f14;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--wine);
    background:#fdf1ed; color:var(--wine); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fbe4e0; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-family:system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#f5ebd9; border:1.5px dashed var(--line-2);}
  .seq{background:#fdf5e8; border:1.5px solid #f0c98c;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#cbb296; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#fdf5e8;}
  .seq .ord-item{border-color:#f0c98c;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#f5ebd9; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--wine); border-color:var(--wine); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-family:system-ui,sans-serif; font-size:13px; color:#53402a; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:27px;
    color:#2e1f14; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf5;
    background-image:linear-gradient(transparent 26px, rgba(124,45,18,.18) 26px 27px);
    background-size:100% 27px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(180,83,9,.13);}
  textarea::placeholder{color:#a58e74; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--accent-soft); border:1px solid #f0c98c; color:#7c2d12;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#fbf6ec; border-left:3px solid var(--wine);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#5b1d1d;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--wine); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(60,30,10,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🎨</div>
    <div>
      <h1>Cuaderno de Estética y Educación Artística · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · belleza, arte, percepción y cultura</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · ESTÉTICA, FILOSOFÍA DEL ARTE Y EDUCACIÓN ARTÍSTICA
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · OBSERVACIÓN ESTÉTICA Y PERCEPCIÓN ============ */
{
  id:"b1", nombre:"Observación estética y percepción", emoji:"👁️",
  desc:"Mirar de otro modo: la mirada estética, los sentidos y la atención a la forma.",
  tecnicas:[
    {id:"a1", nombre:"Mirada estética vs mirada cotidiana",
     concepto:"La mirada cotidiana busca utilidad: reconoce un objeto y pasa de largo. La mirada estética se detiene en la forma, el color, la textura, el ritmo. No pregunta «¿para qué sirve?», sino «¿cómo es y qué me hace sentir?».",
     ejemplo:"Un vaso de agua: mirado cotidianamente es un recipiente para beber. Mirado estéticamente, es una forma transparente que curva la luz, un volumen con borde, un cuerpo que refleja.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué distingue principalmente la mirada estética de la mirada cotidiana?",
       opciones:["Que se hace con instrumentos","Que se detiene en la forma y la experiencia sensible, no en la utilidad","Que requiere formación académica","Que solo se aplica a objetos de arte"],
       correcta:1,
       retro:"La mirada estética se demora en la apariencia, la forma y la experiencia. Cualquier objeto puede mirarse estéticamente."}},

    {id:"a2", nombre:"Descripción sensorial de una obra",
     concepto:"Describir estéticamente es registrar lo que los sentidos captan antes de interpretar: qué colores hay, qué texturas, qué sonidos, qué olores, qué sensaciones corporales produce. Es la base del análisis posterior.",
     ejemplo:"Ante un cuadro: «Dominan rojos intensos y negros profundos. Hay una textura gruesa, casi rugosa, con pinceladas visibles. La figura central ocupa los dos tercios superiores. La sensación es de peso y tensión.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la descripción sensorial.",
       texto:"«El cuadro tiene colores ___ y una textura ___. La figura central produce una sensación de ___.»",
       respuestas:[["intensos","vivos","calidos","cálidos","oscuros","brillantes"],["rugosa","gruesa","áspera","lisa","suave","texturada"],["peso","tension","tensión","calma","movimiento","angustia","serenidad"]],
       retro:"La descripción sensorial se apoya en los sentidos y evita adjetivos valorativos («bonito», «feo»). Es el primer paso del análisis."}},

    {id:"a3", nombre:"Contemplación y atención plena",
     concepto:"Contemplar es permanecer ante una obra el tiempo suficiente para que revele aspectos que la mirada rápida no capta. La contemplación estética exige silencio, lentitud y disponibilidad.",
     ejemplo:"Un minuto mirando un cuadro sin hablar ni buscar nada: primero se ve la escena; luego los detalles; luego las relaciones entre formas; luego el ambiente. La obra se abre por capas.",
     ejercicio:{tipo:"open",
       consigna:"Describe qué observas en una obra que conozcas tras dedicarle tres minutos de contemplación silenciosa.",
       criterios:[
         "Describí al menos tres aspectos que noté al detenerme.",
         "Expliqué cómo cambió mi percepción entre el primer vistazo y la contemplación.",
         "Evité valoraciones apresuradas."
       ],
       modelo:"Elegí «La noche estrellada» de Van Gogh. Al primer vistazo vi un cielo azul con remolinos y un pueblo. Tras tres minutos: noté que el ciprés del primer plano parece llamas; que las estrellas tienen halos concéntricos; que el pueblo está dormido y el cielo, agitado; que hay más movimiento arriba que abajo. La obra pasó de ser «un paisaje nocturno» a ser «un conflicto entre el cielo y la tierra»."}},

    {id:"a4", nombre:"Figura y fondo",
     concepto:"La percepción organiza el campo visual en una figura (lo que destaca) y un fondo (lo que retrocede). En arte esta relación puede alterarse: el fondo puede invadir a la figura o confundirse con ella.",
     ejemplo:"En un retrato clásico, el rostro es la figura y el paisaje, el fondo. En algunas obras contemporáneas, el fondo tiene tanta presencia que cuesta distinguirlo de la figura.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué es la relación figura-fondo?",
       opciones:["La proporción entre el alto y el ancho de un cuadro","La distinción perceptual entre lo que destaca y lo que retrocede en el campo visual","El contraste entre blanco y negro","La firma del artista"],
       correcta:1,
       retro:"La figura-fondo es una organización perceptual básica. Alterarla es un recurso expresivo frecuente en el arte moderno."}},

    {id:"a5", nombre:"Percepción del color",
     concepto:"El color no es solo una propiedad física de la luz: también es una experiencia. Cada cultura asocia colores a significados; cada artista los combina para producir efectos sensoriales y emocionales.",
     ejemplo:"El rojo puede ser pasión, peligro, vida o violencia según el contexto. En un cuadro de Rothko, dos campos de color producen serenidad o inquietud según su relación.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada asociación cromática como cálida o fría, según su efecto perceptivo típico.",
       categorias:["Cálidos","Fríos"],
       items:[
         {texto:"rojo", cat:0},
         {texto:"azul", cat:1},
         {texto:"naranja", cat:0},
         {texto:"verde azulado", cat:1},
         {texto:"amarillo", cat:0},
         {texto:"violeta", cat:1}
       ],
       retro:"Los colores cálidos tienden a avanzar y activar; los fríos, a retroceder y calmar. Son tendencias culturales y perceptivas, no leyes absolutas."}},

    {id:"a6", nombre:"Percepción de la forma",
     concepto:"La forma es la configuración visible de un objeto: su contorno, su silueta, su estructura. Percibirla es reconocer la organización del campo visual más allá del detalle.",
     ejemplo:"Una taza puede tener forma redonda, cilíndrica, cónica. La forma permanece aunque cambie el color o el material: es lo que constituye su identidad visual.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la descripción de la forma.",
       texto:"Un jarrón con cuello estrecho, cuerpo ancho y base pequeña tiene una forma ___. Una piedra sin aristas definidas tiene forma ___. Una escultura con ángulos rectos tiene forma ___.",
       respuestas:[["curva","redondeada","organica","orgánica","sinuosa","abombada"],["irregular","organica","orgánica","informe","natural","amorfa"],["geometrica","geométrica","angular","recta","cubica","cúbica"]],
       retro:"La forma puede ser geométrica, orgánica, angular, curva. Reconocerla es distinguir la estructura del objeto de sus detalles superficiales."}},

    {id:"a7", nombre:"Ritmo visual",
     concepto:"El ritmo visual se produce por la repetición de elementos (líneas, colores, formas) que crea una cadencia perceptiva. Igual que en la música, el ritmo puede ser regular o irregular, rápido o lento.",
     ejemplo:"Una serie de columnas iguales en un templo produce un ritmo regular. Las pinceladas dispersas de un cuadro impresionista producen un ritmo irregular y vibrante.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada ejemplo según el tipo de ritmo visual.",
       categorias:["Regular","Irregular"],
       items:[
         {texto:"Columnas de un templo griego.", cat:0},
         {texto:"Pinceladas sueltas de Monet.", cat:1},
         {texto:"Baldosas de un mosaico geométrico.", cat:0},
         {texto:"Grafitis en un muro.", cat:1},
         {texto:"Ventanas de un edificio modernista.", cat:0}
       ],
       retro:"El ritmo regular organiza y tranquiliza; el irregular activa y sorprende. Ambos son recursos expresivos."}},

    {id:"a8", nombre:"Sinestesia y percepción cruzada",
     concepto:"La sinestesia es la experiencia de percibir con un sentido lo que corresponde a otro: ver sonidos, oír colores, sentir sabores con las formas. En arte se usa como recurso expresivo.",
     ejemplo:"«Ese azul suena a trompeta.» «Esta música tiene un sabor dulce.» Kandinsky asociaba colores a sonidos y formas a emociones.",
     ejercicio:{tipo:"fill",
       consigna:"Completa las sinestesias.",
       texto:"«El amarillo me suena a ___» · «Esta música tiene un sabor ___» · «El silencio tiene una textura ___»",
       respuestas:[["trompeta","alegria","alegría","sol","campana","fiesta","risa"],["dulce","amargo","salado","acido","ácido","agridulce"],["suave","aspera","áspera","algodonosa","espesa","lisa","densa"]],
       retro:"La sinestesia es un recurso poético y perceptivo: mezcla los sentidos para producir sensaciones nuevas."}},

    {id:"a9", nombre:"Empatía estética",
     concepto:"La empatía estética es la capacidad de proyectarse en la obra: sentir lo que sugiere, identificarse con lo representado, dejarse afectar. Es una forma de conocimiento sensible.",
     ejemplo:"Ante un retrato triste, el espectador puede sentir la tristeza del personaje sin que el cuadro lo explique. Esa proyección es empatía estética.",
     ejercicio:{tipo:"open",
       consigna:"Describe una obra que te haya producido una emoción fuerte y explica por qué crees que te afectó.",
       criterios:[
         "Describí la obra brevemente.",
         "Nombré la emoción que sentí.",
         "Expliqué qué elementos de la obra (color, forma, tema) pudieron provocarla."
       ],
       modelo:"El «Guernica» de Picasso me produjo una mezcla de horror y dolor. Creo que me afectó por los cuerpos desmembrados, los ojos abiertos sin cuerpo y la ausencia de color. El blanco, el negro y el gris hacen que la escena parezca un grito sin voz. Esa desolación cromática me transmitió la devastación de la guerra sin necesidad de mostrar sangre."}},

    {id:"a10", nombre:"Juicio estético: espontáneo y reflexivo",
     concepto:"El juicio estético espontáneo es inmediato: «me gusta», «no me gusta». El reflexivo examina por qué, con qué criterios y en diálogo con la obra. La educación estética busca pasar del primero al segundo.",
     ejemplo:"Espontáneo: «Esta obra no me gusta.» Reflexivo: «No me gusta porque su violencia cromática me resulta agresiva; pero reconozco que esa agresividad es intencional y expresa un conflicto real.»",
     ejercicio:{tipo:"fill",
       consigna:"Transforma el juicio espontáneo en reflexivo.",
       texto:"«Este cuadro no me gusta» → «No me gusta porque ___, aunque reconozco que ___».",
       respuestas:[["me resulta agresivo","sus colores son muy fuertes","no entiendo lo que representa","me incomoda","es muy abstracto"],["es intencional","expresa un conflicto","tiene una intencion","tiene una intención","busca provocar","es un recurso del autor"]],
       retro:"El juicio reflexivo no niega la emoción: la examina. Reconoce el propio gusto y a la vez dialoga con la obra."}}
  ]
},

/* ============ BLOQUE 2 · LA BELLEZA Y SUS CONCEPCIONES ============ */
{
  id:"b2", nombre:"La belleza y sus concepciones", emoji:"🌹",
  desc:"Qué es lo bello: armonía, sublimidad, subjetividad, fealdad, kitsch y estética cotidiana.",
  tecnicas:[
    {id:"a11", nombre:"Belleza clásica: proporción y armonía",
     concepto:"La tradición clásica entiende la belleza como proporción, medida y unidad en la variedad. La obra bella es la que integra sus partes en un todo ordenado.",
     ejemplo:"El canon de Policleto, la proporción áurea, la simetría de los templos griegos. La belleza como equilibrio entre las partes.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza a la concepción clásica de la belleza?",
       opciones:["La ruptura y el caos","La proporción, la medida y la unidad en la variedad","La fealdad como valor","El azar y lo efímero"],
       correcta:1,
       retro:"La belleza clásica se funda en el orden, la proporción y la armonía. Es una herencia greco-romana que atraviesa el Renacimiento."}},

    {id:"a12", nombre:"Lo sublime (Burke, Kant)",
     concepto:"Lo sublime no es lo bello: es una experiencia de asombro y sobrecogimiento ante algo inmenso, poderoso o terrible. Puede producir placer y a la vez temor. Se asocia a montañas, tormentas, abismos, el infinito.",
     ejemplo:"Contemplar una tormenta en el mar puede ser sublime: nos sentimos pequeños ante una fuerza que nos supera, y a la vez admirados.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada experiencia como propia de lo bello o de lo sublime.",
       categorias:["Bello","Sublime"],
       items:[
         {texto:"Un jardín cuidado y armonioso.", cat:0},
         {texto:"Una tormenta en alta mar.", cat:1},
         {texto:"Una sonata serena.", cat:0},
         {texto:"Un precipicio de mil metros.", cat:1},
         {texto:"Una puesta de sol apacible.", cat:0}
       ],
       retro:"Lo bello atrae y tranquiliza; lo sublime sobrecoge. La diferencia fue central en la estética del siglo XVIII y sigue vigente."}},

    {id:"a13", nombre:"La belleza como experiencia subjetiva (Kant)",
     concepto:"Para Kant, el juicio de gusto es subjetivo (depende del sentimiento del sujeto) pero pretende validez universal (esperamos que los demás estén de acuerdo). Es un juicio «sin concepto»: no se demuestra, se siente.",
     ejemplo:"«Esto es bello» no es una afirmación científica: no se puede demostrar. Pero no es tampoco un simple gusto personal como «me gusta el chocolate»: esperamos que otros lo compartan.",
     ejercicio:{tipo:"quiz",
       consigna:"Según Kant, ¿qué caracteriza al juicio de gusto?",
       opciones:["Es objetivo y demostrable","Es subjetivo pero aspira a la universalidad","Es puramente personal y sin pretensión","Es una cuestión de moda"],
       correcta:1,
       retro:"El juicio de gusto es subjetivo (no hay concepto ni demostración) pero universal (esperamos que otros coincidan). Esa tensión lo caracteriza."}},

    {id:"a14", nombre:"Belleza y fealdad",
     concepto:"La fealdad también puede ser estética: puede provocar, conmover, incomodar o expresar verdad. El arte moderno reivindica lo feo, lo grotesco y lo monstruoso como recursos expresivos.",
     ejemplo:"«El grito» de Munch o las pinturas negras de Goya no son «bellas» en sentido clásico, pero conmueven y expresan. La fealdad puede ser poderosa.",
     ejercicio:{tipo:"open",
       consigna:"¿Puede una obra fea ser valiosa artísticamente? Argumenta con un ejemplo.",
       criterios:[
         "Tomé una posición clara.",
         "Usé un ejemplo concreto de obra o artista.",
         "Expliqué por qué la fealdad puede tener valor estético."
       ],
       modelo:"Sí, una obra fea puede ser valiosa. Los rostros deformados de «El grito» de Munch no son bellos en sentido clásico, pero expresan una angustia que la belleza serena no podría transmitir. La fealdad es un recurso: exagera, incomoda y dice algo que la armonía oculta. El arte no busca solo agradar; también busca conmover, sacudir y decir la verdad de una época."}},

    {id:"a15", nombre:"Lo pintoresco",
     concepto:"Lo pintoresco es una categoría estética intermedia entre lo bello y lo sublime. Designa lo agradable, irregular y pintoresco del paisaje natural: ruinas, senderos, árboles retorcidos, casas viejas.",
     ejemplo:"Un molino abandonado junto a un arroyo, con árboles viejos y hierba alta, es pintoresco. Produce placer estético sin el sobrecogimiento de lo sublime.",
     ejercicio:{tipo:"fill",
       consigna:"Describe una escena pintoresca.",
       texto:"Una escena pintoresca incluiría ___ , ___ y ___.",
       respuestas:[["ruinas","una casa vieja","un sendero","arboles retorcidos","árboles retorcidos","un arroyo","un molino","piedras con musgo"],["un sendero","un arroyo","hierba alta","flores silvestres","un puente viejo","piedras con musgo","un arbol","un árbol"],["un puente viejo","un molino","una cabaña","un cielo nublado","una fuente","una iglesia pequena","una iglesia pequeña"]],
       retro:"Lo pintoresco valora lo irregular, lo antiguo y lo humilde. Fue una categoría central en el romanticismo paisajístico."}},

    {id:"a16", nombre:"Lo siniestro (unheimlich)",
     concepto:"Lo siniestro es lo familiar que se vuelve inquietante: algo conocido que de pronto se muestra extraño. Freud lo llamó «unheimlich» (lo no-familiar dentro de lo familiar).",
     ejemplo:"Una casa idéntica a la propia pero vacía. Un muñeco que parece humano. Un pasillo conocido que de pronto no termina. Es inquietante porque mezcla lo familiar y lo extraño.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza a lo siniestro?",
       opciones:["Lo totalmente extraño y desconocido","Lo familiar que de pronto se vuelve inquietante","Lo puramente cómico","Lo sublime natural"],
       correcta:1,
       retro:"Lo siniestro no es lo ajeno, sino lo conocido que se vuelve extraño. Su eficacia estética está en la mezcla."}},

    {id:"a17", nombre:"Kitsch",
     concepto:"El kitsch es la estética de la falsificación sentimental: imita la emoción sin profundidad, produce placer inmediato y evita cualquier exigencia. Es arte de consumo, decorativo y previsible.",
     ejemplo:"Un cuadro de delfines al atardecer con brillo neón, un souvenir con un corazón y una inscripción genérica, una taza con «Mejor mamá del mundo».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada objeto según sea kitsch o no.",
       categorias:["Kitsch","No kitsch"],
       items:[
         {texto:"Un cuadro de delfines al atardecer con brillo.", cat:0},
         {texto:"Un jarrón de cerámica artesanal.", cat:1},
         {texto:"Una taza con «Mejor mamá del mundo».", cat:0},
         {texto:"Una escultura griega original.", cat:1},
         {texto:"Un souvenir turístico con la Torre Eiffel y purpurina.", cat:0}
       ],
       retro:"El kitsch imita la emoción sin producirla. Es un juicio estético, no una simple preferencia."}},

    {id:"a18", nombre:"Belleza natural y belleza artística",
     concepto:"La belleza natural se encuentra sin intervención humana; la belleza artística es producida intencionadamente. Ambas se relacionan: el arte imita la naturaleza, la interpreta o la transforma.",
     ejemplo:"Un paisaje de montaña es belleza natural. Un cuadro que lo representa es belleza artística. La fotografía se sitúa entre ambas: capta lo natural con una mirada construida.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada ejemplo como belleza natural o artística.",
       categorias:["Natural","Artística"],
       items:[
         {texto:"Un bosque al amanecer.", cat:0},
         {texto:"Una sinfonía de Beethoven.", cat:1},
         {texto:"Un acantilado junto al mar.", cat:0},
         {texto:"Una escultura de Miguel Ángel.", cat:1},
         {texto:"Un cielo estrellado.", cat:0}
       ],
       retro:"La belleza natural no es producida por el hombre; la artística sí. La fotografía y el land art difuminan la frontera."}},

    {id:"a19", nombre:"Estética de lo cotidiano",
     concepto:"La estética no se limita a las obras de arte: también se ocupa de la experiencia estética de la vida diaria. La ropa, la comida, la casa, los gestos, los objetos, pueden experimentarse estéticamente.",
     ejemplo:"La disposición de una mesa, la combinación de colores de la ropa, el ritmo de una conversación, la textura de una taza. Lo cotidiano está lleno de decisiones estéticas.",
     ejercicio:{tipo:"open",
       consigna:"Describe tres objetos o situaciones de tu vida cotidiana que tengan una dimensión estética.",
       criterios:[
         "Elegí tres objetos o situaciones concretas.",
         "Describí qué elementos estéticos tienen (forma, color, ritmo...).",
         "Expliqué qué experiencia producen."
       ],
       modelo:"1) La taza en que tomo el té cada mañana: su forma curva y su color blanco roto producen una sensación de calma. 2) La cuadra de árboles que recorro al salir de casa: la repetición de troncos crea un ritmo regular que acompaña el paso. 3) La disposición de los libros en mi escritorio: mezcla de colores de lomos que se ordenan por tema y por tamaño, y produce una sensación de orden frágil."}},

    {id:"a20", nombre:"Belleza y verdad",
     concepto:"La relación entre belleza y verdad es un problema clásico: ¿lo bello es verdadero?, ¿la verdad puede ser fea?, ¿el arte puede embellecer la mentira? La reflexión estética indaga esta tensión.",
     ejemplo:"Una pintura puede ser bella y falsa (propaganda, publicidad). También puede ser verdadera y terrible (una imagen de guerra). Belleza y verdad no siempre coinciden.",
     ejercicio:{tipo:"open",
       consigna:"¿Puede una obra ser bella y mentirosa a la vez? Reflexiona con un ejemplo.",
       criterios:[
         "Tomé una posición clara.",
         "Usé un ejemplo concreto (publicidad, propaganda, obra de arte).",
         "Expliqué la relación entre belleza y verdad que propongo."
       ],
       modelo:"Sí. La publicidad produce imágenes muy bellas para vender productos que quizá no mejoren la vida del comprador. La belleza es aquí un instrumento de seducción al servicio de un mensaje dudoso. También hay obras de arte bellas que idealizan una realidad injusta, como cierta pintura de propaganda del siglo XX. Belleza y verdad no son lo mismo: la primera puede servir a la segunda o traicionarla."}}
  ]
},

/* ============ BLOQUE 3 · EL ARTE: CONCEPTO Y CLASIFICACIÓN ============ */
{
  id:"b3", nombre:"El arte: concepto y clasificación", emoji:"🖼️",
  desc:"Qué es el arte, las bellas artes, las artes aplicadas, el arte contemporáneo y sus rupturas.",
  tecnicas:[
    {id:"a21", nombre:"¿Qué es el arte? Definiciones",
     concepto:"No existe una única definición de arte. Ha sido pensado como imitación (Platón, Aristóteles), como expresión (romanticismo), como forma (formalismo), como institución (Danto, Dickie). Cada época propone su definición.",
     ejemplo:"Para Platón el arte imita la naturaleza; para los románticos expresa el yo; para los formalistas es la organización de la forma; para Danto es lo que el «mundo del arte» reconoce como arte.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada definición con su corriente.",
       categorias:["Imitación","Expresión","Forma","Institución"],
       items:[
         {texto:"El arte imita la naturaleza.", cat:0},
         {texto:"El arte expresa el sentimiento del artista.", cat:1},
         {texto:"El arte es la organización significante de la forma.", cat:2},
         {texto:"Es arte lo que el mundo del arte reconoce como arte.", cat:3},
         {texto:"El arte copia la realidad de manera verosímil.", cat:0}
       ],
       retro:"No hay una sola definición de arte: cada tradición filosófica enfatiza un aspecto. Conocerlas permite pensar críticamente el arte actual."}},

    {id:"a22", nombre:"Bellas artes tradicionales",
     concepto:"La clasificación moderna de las bellas artes incluye pintura, escultura, arquitectura, música, danza, literatura y, a veces, teatro. Son artes «mayores» por su valor estético y su complejidad.",
     ejemplo:"Un museo de bellas artes reúne pintura, escultura y grabado. El término «bellas artes» surge en el siglo XVIII para distinguirlas de las artesanías.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada disciplina según sea considerada bella arte tradicional o no.",
       categorias:["Bella arte tradicional","No tradicional"],
       items:[
         {texto:"Pintura", cat:0},
         {texto:"Escultura", cat:0},
         {texto:"Cerámica utilitaria", cat:1},
         {texto:"Música", cat:0},
         {texto:"Mueblería", cat:1},
         {texto:"Arquitectura", cat:0}
       ],
       retro:"La división entre bellas artes y artesanías es histórica y discutida. Muchas culturas no la reconocen."}},

    {id:"a23", nombre:"Artes aplicadas y diseño",
     concepto:"Las artes aplicadas producen objetos con función práctica pero cuidado estético: muebles, cerámica, joyería, textiles, carteles, diseño gráfico, industrial y de moda. La belleza y la utilidad se combinan.",
     ejemplo:"Una silla de diseño, un envase atractivo, un cartel publicitario, un vestido de alta costura. Todos combinan forma, función y expresión.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada objeto según sea arte aplicado o arte «puro».",
       categorias:["Arte aplicado","Arte no aplicado"],
       items:[
         {texto:"Un cartel publicitario.", cat:0},
         {texto:"Un cuadro de Kandinsky.", cat:1},
         {texto:"Un jarrón de cerámica decorado.", cat:0},
         {texto:"Una escultura de Brancusi.", cat:1},
         {texto:"Un vestido de alta costura.", cat:0}
       ],
       retro:"El arte aplicado une función y estética. La frontera con el arte «puro» es más permeable de lo que parece."}},

    {id:"a24", nombre:"Arte contemporáneo y sus rupturas",
     concepto:"El arte contemporáneo (desde mediados del siglo XX) rompe con la tradición: cuestiona qué es arte, incorpora objetos cotidianos, acciones, instalaciones, medios digitales. Ya no busca solo la belleza.",
     ejemplo:"«La fuente» de Duchamp (un urinario firmado) fue una de las primeras rupturas: cuestionó la frontera entre arte y objeto cotidiano. Las instalaciones, performances y videoarte continúan esa ruptura.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza al arte contemporáneo?",
       opciones:["Imita la realidad con fidelidad","Cuestiona qué es el arte e incorpora medios, objetos y acciones antes no considerados artísticos","Se limita a la pintura y la escultura","Solo representa temas bellos"],
       correcta:1,
       retro:"El arte contemporáneo es autorreflexivo: se pregunta por su propio estatuto. La belleza no es su único valor."}},

    {id:"a25", nombre:"Arte conceptual",
     concepto:"En el arte conceptual, la idea importa más que la realización material. La obra puede ser una instrucción, un texto, un gesto o un objeto cualquiera. Lo esencial es el concepto que propone.",
     ejemplo:"«Una y tres sillas» de Kosuth: muestra una silla real, una fotografía de la silla y la definición de diccionario de «silla». La obra es la reflexión sobre la representación, no los objetos.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición.",
       texto:"En el arte conceptual, lo esencial no es la obra material sino ___ que propone. La realización puede ser mínima porque lo importante es ___.",
       respuestas:[["la idea","el concepto","el pensamiento"],["la reflexion","la reflexión","el concepto","la idea","el pensamiento"]],
       retro:"El arte conceptual desplaza el foco de la obra material a la idea. Es una de las rupturas más radicales del arte del siglo XX."}},

    {id:"a26", nombre:"Performance y arte de acción",
     concepto:"La performance es una acción artística realizada ante un público, generalmente efímera. El cuerpo del artista es el medio. Se diferencia del teatro en que no hay ficción: es una acción real en el presente.",
     ejemplo:"Marina Abramović mirando a los visitantes durante horas. Acciones donde el cuerpo realiza una tarea o gesto con valor simbólico.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué distingue la performance del teatro?",
       opciones:["Que la performance es más corta","Que en la performance no hay ficción: la acción es real y presente","Que la performance no tiene público","Que el teatro no tiene cuerpo"],
       correcta:1,
       retro:"En la performance el artista no interpreta un personaje: es él mismo realizando una acción. Lo real sustituye a la ficción."}},

    {id:"a27", nombre:"Arte digital y nuevos medios",
     concepto:"El arte digital usa tecnologías computacionales: videoarte, net.art, arte generativo, instalaciones interactivas, realidad virtual, inteligencia artificial. Plantea nuevas preguntas sobre autoría, originalidad y experiencia.",
     ejemplo:"Una instalación interactiva que responde a los movimientos del visitante. Una obra generada por un algoritmo. Un videoarte que se difunde solo por internet.",
     ejercicio:{tipo:"open",
       consigna:"Reflexiona brevemente sobre cómo el arte digital cambia la idea de «obra única».",
       criterios:[
         "Mencioné alguna característica del arte digital.",
         "Expliqué cómo afecta la reproducibilidad o la interacción.",
         "Tomé una posición sobre la originalidad."
       ],
       modelo:"El arte digital cuestiona la idea de obra única porque puede reproducirse sin pérdida: un archivo digital es idéntico en cada copia. Pierde el aura que Benjamin atribuía al original, pero gana en difusión y accesibilidad. Una obra interactiva, además, solo existe cuando el espectador la activa: ya no es un objeto cerrado, sino un sistema abierto. Esto obliga a repensar qué significa autenticidad en el arte."}},

    {id:"a28", nombre:"Arte popular y artesanía",
     concepto:"El arte popular incluye las expresiones artísticas de comunidades: música, danza, textiles, cerámica, fiestas, relatos. La artesanía produce objetos útiles y bellos con técnicas transmitidas. No es «arte menor»: es otra tradición estética.",
     ejemplo:"Los bordados de una comunidad, los murales comunitarios, las máscaras rituales, los instrumentos tradicionales. Cada uno tiene su propia estética.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada ejemplo según sea arte popular o arte académico.",
       categorias:["Arte popular","Arte académico"],
       items:[
         {texto:"Un bordado tradicional con motivos del lugar.", cat:0},
         {texto:"Una escultura expuesta en un museo.", cat:1},
         {texto:"Una danza ritual de una comunidad.", cat:0},
         {texto:"Un concierto en una sala sinfónica.", cat:1},
         {texto:"Una máscara usada en una fiesta popular.", cat:0}
       ],
       retro:"El arte popular y el académico son tradiciones distintas, no jerarquías. La distinción es histórica, no estética."}},

    {id:"a29", nombre:"Arte y técnica",
     concepto:"La técnica es el conjunto de procedimientos mediante los cuales se realiza una obra. Cada técnica tiene sus posibilidades y límites: el óleo, la acuarela, el mármol, el bronce, el video. La técnica no es neutral: condiciona lo que se puede decir.",
     ejemplo:"Un grabado permite tiradas múltiples; el óleo, capas y textura; el video, movimiento y sonido. La elección técnica es también una decisión estética.",
     ejercicio:{tipo:"fill",
       consigna:"Relaciona cada técnica con una de sus posibilidades.",
       texto:"El ___ permite obtener varias copias idénticas. El ___ permite corregir y superponer capas. El ___ permite captar el movimiento en el tiempo.",
       respuestas:[["grabado","grabado calcografico","grabado calcográfico","grabado en relieve","xilografia","xilografía"],["oleo","óleo","acrilico","acrílico"],["video","videoarte","cine","video digital"]],
       retro:"La técnica no es un simple medio: condiciona lo que la obra puede decir y cómo lo dice."}},

    {id:"a30", nombre:"Obra única y reproducción (Benjamin)",
     concepto:"Walter Benjamin analizó cómo la reproducción técnica (fotografía, cine, imprenta) transforma la experiencia del arte. La obra pierde su «aura» (su aquí y ahora único) pero gana en difusión y accesibilidad.",
     ejemplo:"Ver «La Gioconda» en el Louvre es una experiencia aurática (única, presente). Ver su reproducción en un libro o una pantalla es una experiencia distinta: más accesible, pero sin aura.",
     ejercicio:{tipo:"quiz",
       consigna:"Según Benjamin, ¿qué pierde la obra de arte con la reproducción técnica?",
       opciones:["Su valor económico","Su aura: el aquí y ahora único de la obra original","Su significado","Su autor"],
       correcta:1,
       retro:"El «aura» es la singularidad de la obra en su lugar y tiempo. La reproducción la elimina, pero también democratiza el acceso."}}
  ]
},

/* ============ BLOQUE 4 · LENGUAJES ARTÍSTICOS ============ */
{
  id:"b4", nombre:"Lenguajes artísticos", emoji:"🎭",
  desc:"Pintura, escultura, arquitectura, música, literatura, teatro, danza, cine e historieta.",
  tecnicas:[
    {id:"a31", nombre:"Pintura: soportes y técnicas",
     concepto:"La pintura se realiza sobre distintos soportes (muro, tabla, lienzo, papel, pantalla) con distintas técnicas (fresco, temple, óleo, acuarela, acrílico, digital). Cada combinación produce efectos propios.",
     ejemplo:"El óleo permite capas y textura; la acuarela es transparente y fluida; el fresco se aplica sobre yeso húmedo y dura siglos; el acrílico seca rápido y admite capas.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la relación técnica-soporte.",
       texto:"El ___ se aplica sobre yeso húmedo en el muro. La ___ se aplica sobre papel y es transparente. El ___ permite capas y textura sobre lienzo.",
       respuestas:[["fresco"],["acuarela"],["oleo","óleo","acrilico","acrílico"]],
       retro:"Cada técnica pictórica tiene sus posibilidades expresivas. Reconocerlas ayuda a leer la obra."}},

    {id:"a32", nombre:"Escultura: talla, modelado y fundición",
     concepto:"La escultura puede realizarse por sustracción (talla en piedra o madera), por adición (modelado en barro o cera) o por fundición (vaciado en bronce). Cada procedimiento produce resultados distintos.",
     ejemplo:"Miguel Ángel tallaba el mármol quitando materia. Rodin modelaba el barro añadiendo. La fundición en bronce permite reproducir el modelo y resistir al tiempo.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada procedimiento escultórico.",
       categorias:["Sustracción","Adición","Fundición"],
       items:[
         {texto:"Talla en mármol.", cat:0},
         {texto:"Modelado en barro.", cat:1},
         {texto:"Vaciado en bronce.", cat:2},
         {texto:"Talla en madera.", cat:0},
         {texto:"Modelado en cera.", cat:1}
       ],
       retro:"La sustracción quita materia; la adición la suma; la fundición la transforma. Son tres lógicas escultóricas distintas."}},

    {id:"a33", nombre:"Arquitectura: forma, función y espacio",
     concepto:"La arquitectura combina forma, función y espacio habitable. Una obra arquitectónica resuelve un problema práctico (vivir, trabajar, reunirse) y a la vez propone una experiencia estética del espacio.",
     ejemplo:"Un templo griego resuelve el culto con columnas y proporción. Una casa moderna resuelve la vivienda con luz y funcionalidad. La arquitectura es el arte del espacio habitado.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la relación forma-función.",
       texto:"Una catedral gótica cumple la función de ___ mediante formas ___ y ___. Un rascacielos cumple la función de ___ mediante formas ___.",
       respuestas:[["acoger fieles","reunir fieles","el culto","el culto religioso","reunir a los fieles"],["verticales","elevadas","altas","apuntadas","esbeltas"],["luminosas","con vidrieras","abovedadas","con arcos","de piedra"],["albergar oficinas","trabajar","vivienda","trabajo","oficinas"],["verticales","de vidrio","altas","modernas","funcionales"]],
       retro:"En arquitectura, forma y función están en tensión creativa. No siempre se subordina una a la otra."}},

    {id:"a34", nombre:"Fotografía: encuadre y momento",
     concepto:"La fotografía se construye con decisiones: encuadre, ángulo, luz, momento. No es una simple reproducción de lo real: es una mirada que selecciona y compone.",
     ejemplo:"Un mismo paisaje cambia según el ángulo (picado, contrapicado, frontal), la luz (amanecer, mediodía, atardecer) y el momento (con o sin personas). La foto es una interpretación.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué hace que una fotografía sea una interpretación y no una simple copia?",
       opciones:["Que se hace con cámara profesional","Las decisiones de encuadre, luz, ángulo y momento","Que se imprime en papel","Que tiene muchos megapíxeles"],
       correcta:1,
       retro:"La fotografía selecciona y compone. Toda foto es una mirada: no hay fotografía neutral."}},

    {id:"a35", nombre:"Música: ritmo, melodía y armonía",
     concepto:"La música organiza el sonido en el tiempo mediante ritmo (duración), melodía (sucesión de notas) y armonía (combinación simultánea). También incluye timbre, dinámica y forma.",
     ejemplo:"Una canción pop combina un ritmo regular, una melodía memorable y una armonía sencilla. Una sinfonía desarrolla los tres elementos con mayor complejidad.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento musical según su función.",
       categorias:["Ritmo","Melodía","Armonía"],
       items:[
         {texto:"Sucesión de notas que se canta.", cat:1},
         {texto:"Duración de los sonidos y los silencios.", cat:0},
         {texto:"Combinación simultánea de notas (acordes).", cat:2},
         {texto:"Pulso regular de la música.", cat:0},
         {texto:"Nota principal que se sigue en una pieza.", cat:1}
       ],
       retro:"Ritmo, melodía y armonía son los tres ejes de la organización musical. Cada tradición los combina de manera propia."}},

    {id:"a36", nombre:"Literatura como arte",
     concepto:"La literatura es arte cuando trabaja la palabra por su valor sonoro, rítmico y simbólico, no solo por su contenido informativo. La forma y el estilo son parte del significado.",
     ejemplo:"Un mismo argumento puede narrarse de mil maneras distintas. La forma (el ritmo de las frases, las imágenes, el punto de vista) construye el sentido.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo es arte un texto literario?",
       opciones:["Cuando tiene muchas páginas","Cuando trabaja la palabra por su valor estético, no solo por su contenido","Cuando se vende mucho","Cuando se publica en una editorial famosa"],
       correcta:1,
       retro:"En literatura, la forma es parte del contenido. Un texto es arte cuando la manera de decir es inseparable de lo que dice."}},

    {id:"a37", nombre:"Teatro: texto, actuación y escena",
     concepto:"El teatro combina texto dramático, actuación, escenografía, vestuario, iluminación y sonido. Ocurre en vivo y en presente: cada función es única.",
     ejemplo:"Una obra de Shakespeare puede representarse en un escenario clásico o en uno contemporáneo, con vestuario de época o actual. El texto es el mismo, la obra es distinta.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los elementos del teatro.",
       texto:"El teatro combina el texto dramático, la ___, la escenografía, el ___ y la ___.",
       respuestas:[["actuacion","actuación","interpretacion","interpretación"],["vestuario","sonido","iluminacion","iluminación"],["iluminacion","iluminación","musica","música","direccion","dirección"]],
       retro:"El teatro es un arte colectivo y en vivo. En cada función, todos los elementos se conjugan de manera irrepetible."}},

    {id:"a38", nombre:"Danza: cuerpo, espacio y tiempo",
     concepto:"La danza usa el cuerpo en movimiento como medio expresivo. Se organiza en el espacio, en el tiempo y con un ritmo. Puede ser codificada (ballet, flamenco) o libre (danza contemporánea).",
     ejemplo:"Un ballet clásico sigue un vocabulario codificado. Una improvisación contemporánea explora el movimiento sin formas previas. En ambos casos, el cuerpo expresa.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de danza como codificada o libre.",
       categorias:["Codificada","Libre / contemporánea"],
       items:[
         {texto:"Ballet clásico.", cat:0},
         {texto:"Improvisación contemporánea.", cat:1},
         {texto:"Flamenco tradicional.", cat:0},
         {texto:"Danza butoh.", cat:1},
         {texto:"Danza folclórica con pasos fijos.", cat:0}
       ],
       retro:"La danza codificada trasmite un vocabulario aprendido; la libre explora el movimiento sin formas previas. Ambas son formas de arte."}},

    {id:"a39", nombre:"Cine: lenguaje audiovisual",
     concepto:"El cine combina imagen en movimiento, sonido y montaje. Se construye con planos (encuadres), secuencias (sucesión de planos) y montaje (unión entre planos). El significado emerge de las relaciones entre imágenes.",
     ejemplo:"Un plano cercano produce intimidad; un plano general, contexto; un montaje rápido, tensión; un montaje lento, reflexión. Cada decisión produce efectos.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la relación plano-efecto.",
       texto:"Un plano muy cercano produce sensación de ___. Un plano general produce sensación de ___. Un montaje rápido produce sensación de ___.",
       respuestas:[["intimidad","proximidad","emocion","emoción","tension","tensión"],["contexto","lejania","lejanía","amplitud","panorama","distancia"],["tension","tensión","velocidad","urgencia","dinamismo","nerviosismo"]],
       retro:"El lenguaje cinematográfico se construye con decisiones de encuadre, movimiento y montaje. Cada una produce un efecto."}},

    {id:"a40", nombre:"Historieta y novela gráfica",
     concepto:"La historieta combina imagen y texto en secuencias de viñetas. El lenguaje propio incluye viñetas, globos, cartelas y recursos gráficos. La novela gráfica es un formato más extenso y con mayor ambición narrativa.",
     ejemplo:"«Maus» de Spiegelman usa la historieta para narrar el Holocausto. «Persépolis» de Satrapi narra una infancia en Irán. La historieta puede tratar temas serios con un lenguaje propio.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento según pertenezca al lenguaje de la historieta.",
       categorias:["Elemento de historieta","No es elemento"],
       items:[
         {texto:"Viñeta", cat:0},
         {texto:"Globo de diálogo", cat:0},
         {texto:"Cartela", cat:0},
         {texto:"Capítulo", cat:1},
         {texto:"Onomatopeya gráfica", cat:0}
       ],
       retro:"La historieta tiene un lenguaje propio: viñetas, globos, cartelas, onomatopeyas. No es literatura ilustrada ni cine en papel: es un arte con sus reglas."}}
  ]
},

/* ============ BLOQUE 5 · ANÁLISIS FORMAL DE LA OBRA ============ */
{
  id:"b5", nombre:"Análisis formal de la obra", emoji:"🧩",
  desc:"Línea, color, textura, composición, luz, perspectiva, ritmo, simetría, escala y espacio.",
  tecnicas:[
    {id:"a41", nombre:"La línea",
     concepto:"La línea es el trazo que delimita, separa, guía o expresa. Puede ser recta o curva, gruesa o fina, continua o discontinua. Transmite dirección, tensión y movimiento.",
     ejemplo:"Las líneas verticales de un edificio expresan estabilidad; las curvas de una danza, fluidez; las líneas quebradas de un dibujo expresionista, angustia.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de línea según su efecto expresivo típico.",
       categorias:["Estabilidad","Fluidez","Tensión"],
       items:[
         {texto:"Líneas verticales.", cat:0},
         {texto:"Curvas suaves.", cat:1},
         {texto:"Líneas quebradas.", cat:2},
         {texto:"Líneas horizontales.", cat:0},
         {texto:"Curvas sinuosas.", cat:1}
       ],
       retro:"La línea no es neutra: orienta la mirada y produce sensaciones. Es uno de los elementos formales más expresivos."}},

    {id:"a42", nombre:"El color: círculo cromático",
     concepto:"El círculo cromático organiza los colores primarios, secundarios y terciarios. Muestra las relaciones de complementariedad, armonía y contraste. Cada combinación produce efectos distintos.",
     ejemplo:"Colores complementarios (rojo/verde, azul/naranja) producen contraste y vibración. Colores análogos (azules vecinos) producen serenidad y armonía.",
     ejercicio:{tipo:"fill",
       consigna:"Identifica los colores complementarios.",
       texto:"El complementario del rojo es el ___. El del azul es el ___. El del amarillo es el ___.",
       respuestas:[["verde"],["naranja"],["violeta","morado","purpura","púrpura"]],
       retro:"Los complementarios están enfrentados en el círculo cromático. Al yuxtaponerlos, se intensifican mutuamente."}},

    {id:"a43", nombre:"La textura",
     concepto:"La textura es la cualidad de la superficie: lisa o rugosa, mate o brillante, suave o áspera. Puede ser táctil (se toca) o visual (se percibe con la vista). En arte produce efectos sensoriales y expresivos.",
     ejemplo:"La textura empastada de un Van Gogh produce sensación de energía. La textura lisa de una escultura de Brancusi produce serenidad. La textura visual de una acuarela sugiere transparencia.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada textura como táctil o visual.",
       categorias:["Táctil","Visual"],
       items:[
         {texto:"El relieve de un óleo empastado.", cat:0},
         {texto:"La sensación de rugosidad en una fotografía de piedra.", cat:1},
         {texto:"La superficie pulida de un mármol.", cat:0},
         {texto:"El grano impreso en una imagen digital.", cat:1},
         {texto:"Las vetas visibles de la madera.", cat:0}
       ],
       retro:"La textura táctil se percibe con el tacto o se sugiere para él; la visual solo con la vista. Ambas contribuyen a la experiencia estética."}},

    {id:"a44", nombre:"La composición",
     concepto:"La composición es la organización de los elementos en el espacio de la obra. Puede ser simétrica o asimétrica, centrada o descentrada, cerrada o abierta. Determina el equilibrio y el recorrido de la mirada.",
     ejemplo:"Una composición simétrica produce orden y solemnidad; una asimétrica, tensión y dinamismo. Una composición centrada concentra la mirada; una descentrada la dispersa.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de composición según su efecto.",
       categorias:["Simétrica","Asimétrica"],
       items:[
         {texto:"Un rostro centrado y equilibrado.", cat:0},
         {texto:"Una escena con la figura principal a un lado.", cat:1},
         {texto:"Una fachada con dos torres idénticas.", cat:0},
         {texto:"Un cuadro con masas de color desiguales.", cat:1},
         {texto:"Un jarrón en el eje exacto de la mesa.", cat:0}
       ],
       retro:"La simetría ordena; la asimetría dinamiza. Ninguna es superior: cada una produce efectos según lo que la obra busca."}},

    {id:"a45", nombre:"Luz y sombra",
     concepto:"La luz y la sombra construyen volumen, profundidad y atmósfera. El claroscuro es el contraste intenso entre luz y sombra; el sfumato es la transición suave entre ambas.",
     ejemplo:"Caravaggio usa claroscuro para producir dramatismo. Da Vinci usa sfumato para dar suavidad y misterio. La luz puede ser natural o artificial, frontal o lateral.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada técnica según su efecto.",
       categorias:["Claroscuro","Sfumato"],
       items:[
         {texto:"Contraste intenso entre luz y sombra.", cat:0},
         {texto:"Transición suave entre luz y sombra.", cat:1},
         {texto:"Efecto dramático y teatral.", cat:0},
         {texto:"Efecto suave y atmosférico.", cat:1},
         {texto:"Contornos que se pierden en la penumbra.", cat:1}
       ],
       retro:"El claroscuro dramatiza; el sfumato difumina. Ambos son recursos para construir volumen y atmósfera."}},

    {id:"a46", nombre:"Perspectiva",
     concepto:"La perspectiva es el sistema para representar la profundidad en una superficie plana. La perspectiva lineal usa puntos de fuga; la aérea, la atenuación del color con la distancia; la invertida, típica de algunas tradiciones, no usa punto de fuga.",
     ejemplo:"En el Renacimiento se sistematizó la perspectiva lineal con punto de fuga. En el arte medieval y en algunas tradiciones asiáticas, la perspectiva es jerárquica o invertida.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los tipos de perspectiva.",
       texto:"La perspectiva ___ usa puntos de fuga y líneas convergentes. La perspectiva ___ atenúa colores y detalles con la distancia. La perspectiva ___ no usa punto de fuga y es frecuente en el arte medieval.",
       respuestas:[["lineal","conica","cónica"],["aerea","aérea","atmosferica","atmosférica"],["invertida","jerarquica","jerárquica"]],
       retro:"La perspectiva no es una sola: cada tradición desarrolla sus propias convenciones de representación del espacio."}},

    {id:"a47", nombre:"Ritmo y repetición",
     concepto:"El ritmo en la imagen se produce por la repetición de elementos: colores, formas, líneas, tamaños. Igual que en la música, puede ser regular, irregular, rápido o lento.",
     ejemplo:"Las Meninas de Velázquez tienen un ritmo complejo, con elementos que reaparecen y se responden. Un patrón geométrico islámico produce un ritmo regular y matemático.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué produce el ritmo visual en una obra?",
       opciones:["La firma del autor","La repetición y variación de elementos formales","El precio de la obra","El tamaño del marco"],
       correcta:1,
       retro:"El ritmo visual es un juego de repeticiones y variaciones. Guía la mirada y produce una cadencia perceptiva."}},

    {id:"a48", nombre:"Simetría y asimetría",
     concepto:"La simetría es la correspondencia de partes respecto a un eje. La asimetría rompe esa correspondencia. Ambas pueden producir equilibrio, pero por caminos distintos: la simetría por igualdad, la asimetría por compensación.",
     ejemplo:"El rostro humano es aproximadamente simétrico. Una pintura asimétrica puede equilibrarse compensando masas: un objeto grande a un lado y varios pequeños al otro.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo puede una obra asimétrica estar equilibrada?",
       opciones:["No puede estarlo","Compensando masas: un objeto grande a un lado y varios pequeños al otro","Repitiendo todo al revés","Eliminando el color"],
       correcta:1,
       retro:"El equilibrio visual no depende solo de la simetría. La asimetría puede equilibrarse mediante compensaciones de peso, color o tamaño."}},

    {id:"a49", nombre:"Escala y proporción",
     concepto:"La escala es la relación entre el tamaño de un objeto y su referencia real o con otros objetos. La proporción es la relación entre las partes de un objeto y su todo. Ambas son recursos expresivos.",
     ejemplo:"Un cuadro monumental produce sobrecogimiento; una miniatura, intimidad. Cambiar la escala de un objeto cotidiano (una silla gigante) lo vuelve extraño y significativo.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la relación escala-efecto.",
       texto:"Una obra de gran escala produce sensación de ___. Una obra de pequeña escala produce sensación de ___. Cambiar la escala de un objeto cotidiano puede volverlo ___.",
       respuestas:[["monumentalidad","grandeza","poder","sobrecogimiento","majestuosidad"],["intimidad","recogimiento","fragilidad","cercania","cercanía"],["extrano","extraño","significativo","irreal","simbólico"]],
       retro:"La escala es un recurso: cambiar el tamaño de un objeto cambia su sentido. Los surrealistas lo usaron con frecuencia."}},

    {id:"a50", nombre:"Espacio y volumen",
     concepto:"En las artes visuales, el espacio puede ser plano (bidimensional) o ilusorio (simula profundidad). El volumen es la percepción de tridimensionalidad, ya sea real (escultura) o sugerida (pintura).",
     ejemplo:"Una pintura medieval puede ser plana, sin profundidad. Un cuadro renacentista simula profundidad. Una escultura ocupa el espacio real y modifica su entorno.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada obra según su tratamiento del espacio.",
       categorias:["Plano","Ilusorio","Tridimensional real"],
       items:[
         {texto:"Pintura medieval sin profundidad.", cat:0},
         {texto:"Cuadro renacentista con punto de fuga.", cat:1},
         {texto:"Escultura exenta en mármol.", cat:2},
         {texto:"Ícono bizantino.", cat:0},
         {texto:"Instalación que ocupa una sala.", cat:2}

/* ============ BLOQUE 6 · HISTORIA DEL ARTE Y PERIODOS ============ */
{
  id:"b6", nombre:"Historia del arte y periodos", emoji:"🏛️",
  desc:"Recorrido por los grandes periodos y las rupturas que articulan la historia del arte.",
  tecnicas:[
    {id:"a51", nombre:"Arte prehistórico",
     concepto:"Las primeras manifestaciones artísticas conocidas son las pinturas rupestres y las figurillas paleolíticas. Su función no era decorativa: probablemente tenían sentido ritual, mágico o simbólico.",
     ejemplo:"Las cuevas de Altamira (España) o Lascaux (Francia) con bisontes pintados. La Venus de Willendorf, una figurilla femenina tallada.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza al arte prehistórico?",

       correcta:1,
       retro:"El arte prehistórico se asocia a rituales, caza y creencias. No conocemos su sentido exacto, solo sus huellas materiales."}},

    {id:"a52", nombre:"Arte clásico greco-romano",
     concepto:"El arte griego y romano buscó proporción, equilibrio y armonía. Fue modelo para el Renacimiento y el Neoclasicismo. Sus valores: medida, canon, simetría, serenidad.",
     ejemplo:"El Partenón, el Doríforo de Policleto, la Venus de Milo, el Coliseo romano. Todos comparten búsqueda de proporción y orden.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada característica como propia del arte clásico o no.",
       categorias:["Clásico","No clásico"],
       items:[
         {texto:"Búsqueda de la proporción y la medida.", cat:0},

         {texto:"Deformación expresiva de las figuras.", cat:1},
         {texto:"Uso del canon y la armonía.", cat:0},
         {texto:"Abandono de toda referencia a la realidad.", cat:1}
       ],
       retro:"El clasicismo valora el orden y la medida. Las deformaciones expresivas son propias de otras tradiciones y periodos."}},

    {id:"a53", nombre:"Arte medieval: románico y gótico",
     concepto:"El arte medieval cristiano se dividió en románico (siglos XI-XII, muros gruesos, oscuridad, símbolos) y gótico (siglos XII-XV, arcos apuntados, vidrieras, luz). Ambos servían a la fe.",
     ejemplo:"Una iglesia románica, con muros gruesos y pocas ventanas. Una catedral gótica, con arbotantes, vidrieras y luz coloreada. Dos concepciones distintas de lo sagrado.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada rasgo como propio del románico o del gótico.",
       categorias:["Románico","Gótico"],
