         {texto:"Muros gruesos, pocas ventanas.", cat:0},
         {texto:"Vidrieras que llenan de luz el espacio.", cat:1},
         {texto:"Arco de medio punto.", cat:0},
         {texto:"Arco apuntado y arbotantes.", cat:1},
         {texto:"Ambiente oscuro y simbólico.", cat:0}
       ],
       retro:"Ambos son artes sagrados, pero con concepciones opuestas de la luz y el espacio. El gótico busca la elevación y la luz."}},

    {id:"a54", nombre:"Renacimiento",
     concepto:"El Renacimiento (siglos XV-XVI) recupera los modelos clásicos, desarrolla la perspectiva, valora al ser humano y la observación de la naturaleza. Es el arte del humanismo.",
     ejemplo:"La Capilla Sixtina de Miguel Ángel, «La escuela de Atenas» de Rafael, «Las Meninas» (más tardía, pero heredera). Leonardo estudia anatomía y perspectiva.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los rasgos del Renacimiento.",
       texto:"El Renacimiento recupera modelos ___, desarrolla la ___ y valora al ser humano y la observación de la ___.",
       respuestas:[["clasicos","clásicos","griegos y romanos","griegos","antiguos"],["perspectiva"],["naturaleza","realidad","naturaleza y el cuerpo humano"]],
       retro:"El Renacimiento es un momento clave: arte, ciencia y humanismo convergen en la misma mirada."}},

    {id:"a55", nombre:"Barroco",
     concepto:"El Barroco (siglos XVII-XVIII) valora el movimiento, el contraste, la emoción y el dramatismo. Usa claroscuro, diagonales, teatralidad. Es un arte de persuasión y espectáculo.",
     ejemplo:"Caravaggio, Velázquez, Bernini, Rubens. Las obras barrocas conmueven al espectador: no solo lo instruyen, lo mueven.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada característica como barroca o clásica.",
       categorias:["Barroco","Clásico"],
       items:[
         {texto:"Movimiento y tensión.", cat:0},
         {texto:"Equilibrio y serenidad.", cat:1},
         {texto:"Contraste fuerte entre luz y sombra.", cat:0},
         {texto:"Proporción y medida.", cat:1},
         {texto:"Teatralidad y dramatismo.", cat:0}
       ],
       retro:"El Barroco rompe la serenidad clásica para conmover. El arte se vuelve instrumento de persuasión."}},

    {id:"a56", nombre:"Neoclasicismo y Romanticismo",
     concepto:"El Neoclasicismo (siglo XVIII) vuelve a los modelos clásicos por racionalismo. El Romanticismo (siglo XIX) reivindica el sentimiento, la libertad, la naturaleza y lo sublime. Son respuestas opuestas a la misma época.",
     ejemplo:"David, pintor neoclásico, congelaba la historia con claridad. Delacroix o Goya románticos, exaltaban el movimiento, el color y la emoción.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada rasgo según corresponda al Neoclasicismo o al Romanticismo.",
       categorias:["Neoclasicismo","Romanticismo"],
       items:[
         {texto:"Vuelta a los modelos clásicos por razón.", cat:0},
         {texto:"Exaltación del sentimiento y la libertad.", cat:1},
         {texto:"Claridad, contorno y serenidad.", cat:0},
         {texto:"Lo sublime, lo exótico, lo infinito.", cat:1},
         {texto:"Interés por el deber cívico y la historia.", cat:0}
       ],
       retro:"Neoclasicismo y Romanticismo son dos caras de la misma época: la razón y el sentimiento. Se suceden pero también conviven."}},

    {id:"a57", nombre:"Impresionismo y postimpresionismo",
     concepto:"El Impresionismo (último tercio del siglo XIX) busca captar la impresión de la luz y el instante, con pinceladas sueltas y colores puros. El postimpresionismo va más allá: estructura, expresión, color simbólico.",
     ejemplo:"Monet pinta la misma catedral a distintas horas. Van Gogh y Gauguin usan el color con valor expresivo y simbólico, no solo descriptivo.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pintor según corresponda.",
       categorias:["Impresionismo","Postimpresionismo"],
       items:[
         {texto:"Monet", cat:0},
         {texto:"Van Gogh", cat:1},
         {texto:"Renoir", cat:0},
         {texto:"Gauguin", cat:1},
         {texto:"Cézanne", cat:1}
       ],
       retro:"El Impresionismo capta la luz; el postimpresionismo construye con el color. Es una continuidad y una ruptura a la vez."}},

    {id:"a58", nombre:"Vanguardias del siglo XX",
     concepto:"Las vanguardias (1905-1945) rompen con toda tradición. Cubismo, futurismo, dadaísmo, surrealismo, expresionismo, abstracción. Cada movimiento propone una nueva manera de ver y hacer arte.",
     ejemplo:"Picasso y Braque descomponen la figura (cubismo). Duchamp cuestiona el arte mismo (dadaísmo). Dalí y Magritte exploran el inconsciente (surrealismo). Kandinsky y Mondrian van hacia la abstracción.",
     ejercicio:{tipo:"classify",
       consigna:"Relaciona cada artista con su vanguardia.",
       categorias:["Cubismo","Surrealismo","Abstracción"],
       items:[
         {texto:"Picasso", cat:0},
         {texto:"Dalí", cat:1},
         {texto:"Kandinsky", cat:2},
         {texto:"Magritte", cat:1},
         {texto:"Mondrian", cat:2}
       ],
       retro:"Cada vanguardia propone una nueva mirada: descomposición, inconsciente, abstracción. Son las raíces del arte contemporáneo."}},

    {id:"a59", nombre:"Arte latinoamericano",
     concepto:"El arte latinoamericano combina tradiciones indígenas, africanas y europeas. El muralismo mexicano, el arte cinético venezolano, la nueva figuración argentina son aportes propios de la región.",
     ejemplo:"Rivera, Orozco y Siqueiros pintaron murales para el pueblo. Torres-García desarrolló el universalismo constructivo. Lygia Clark y Hélio Oiticica exploraron el cuerpo y la participación.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los aportes latinoamericanos.",
       texto:"El ___ mexicano pintó murales para el pueblo. El arte ___ explora el movimiento y la percepción. La nueva figuración ___ introdujo un lenguaje crítico y urbano.",
       respuestas:[["muralismo"],["cinetico","cinético","constructivo"],["argentina","brasilena","brasileña","latinoamericana"]],
       retro:"América Latina no solo recibió el arte europeo: produjo sus propias vanguardias y lenguajes originales."}},

    {id:"a60", nombre:"Arte actual y globalización",
     concepto:"El arte actual (desde 1980) es global, plural y multiforme. Coexisten bienales, ferias, arte digital, arte comunitario, instalaciones, performance, arte ecológico. No hay un estilo único.",
     ejemplo:"Las bienales de São Paulo, Venecia o La Habana reúnen obras de todo el mundo. Artistas trabajan con video, datos, tierra, comunidades, redes. El arte se vuelve global y a la vez local.",
     ejercicio:{tipo:"open",
       consigna:"Reflexiona sobre cómo la globalización afecta al arte actual.",
       criterios:[
         "Mencioné al menos dos efectos concretos de la globalización en el arte.",
         "Consideré tanto oportunidades como riesgos.",
         "Tomé una posición personal."
       ],
       modelo:"La globalización permite que artistas de todo el mundo expongan en bienales y sean vistos al instante. También favorece el diálogo entre tradiciones: un artista africano puede combinar formas locales con lenguajes digitales. El riesgo es la homogeneización: ciertos lenguajes del mercado internacional se imponen sobre las poéticas locales. Creo que la tarea del arte actual es usar la circulación global sin perder la raíz propia."}}
  ]
},

/* ============ BLOQUE 7 · INTERPRETACIÓN Y CRÍTICA ============ */
{
  id:"b7", nombre:"Interpretación y crítica", emoji:"🔍",
  desc:"Leer una obra: denotación, connotación, contexto, símbolo, recepción y crítica.",
  tecnicas:[
    {id:"a61", nombre:"Lectura denotativa",
     concepto:"La lectura denotativa describe lo que la obra muestra de forma literal: qué se ve, qué se oye, qué se lee. Es el nivel de los datos sensoriales y descriptivos.",
     ejemplo:"En «Las Meninas»: una niña, varias figuras alrededor, un perro, un pintor con paleta, un espejo al fondo, una puerta abierta. Eso es lo que se ve literalmente.",
     ejercicio:{tipo:"fill",
       consigna:"Realiza una lectura denotativa.",
       texto:"En la obra se ve ___, ___, ___ y ___.",
       respuestas:[["una figura central","un personaje","una persona","una silueta","un objeto","un elemento principal","un cuerpo"],["un fondo","un espacio","un lugar","un paisaje","un ambiente","una habitacion","una habitación"],["un objeto secundario","un elemento decorativo","una ventana","una puerta","un espejo","un mueble"],["un detalle significativo","un simbolo","un símbolo","un texto","un color dominante","una figura secundaria"]],
       retro:"La denotación describe sin interpretar. Es el primer paso del análisis."}},

    {id:"a62", nombre:"Lectura connotativa",
     concepto:"La lectura connotativa interpreta lo que la obra sugiere, simboliza o evoca. Ya no describe lo que se ve, sino lo que significa. Es el paso de la forma al sentido.",
     ejemplo:"En «Las Meninas», el espejo con los reyes sugiere la presencia del espectador; el pintor mirándonos subvierte la relación obra-espectador. Todo eso es connotación.",
     ejercicio:{tipo:"open",
       consigna:"Realiza una lectura connotativa de una obra que conozcas.",
       criterios:[
         "Mencioné la obra.",
         "Interpreté al menos dos elementos con sentido simbólico.",
         "Relacioné mi interpretación con el contexto o la intención de la obra."
       ],
       modelo:"Elegí «El grito» de Munch. El rostro deformado puede leerse como la disolución del yo ante la angustia. El cielo rojo anaranjado sugiere un estado interior alterado. El paisaje del fondo, casi vacío, refuerza la soledad del personaje. La obra connota una experiencia moderna: la ansiedad de un individuo aislado."}},

    {id:"a63", nombre:"Contexto de producción",
     concepto:"Toda obra se produce en un contexto histórico, social, cultural y material. Conocerlo ayuda a comprender por qué la obra es como es. La obra no flota en el vacío.",
     ejemplo:"«El Guernica» de Picasso se produce en 1937, tras el bombardeo de la ciudad vasca durante la Guerra Civil española. Sin ese contexto, la obra pierde parte de su sentido.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el contexto.",
       texto:"El «Guernica» se pintó en ___ (año), tras el bombardeo de la ciudad durante la ___ ___. Se expuso por primera vez en el pabellón español de la Exposición Internacional de ___.",
       respuestas:[["1937"],["guerra civil","Guerra Civil","guerra civil española","Guerra Civil Española"],["paris","parís"]],
       retro:"El contexto no explica del todo la obra, pero sin él muchos sentidos quedan ocultos."}},

    {id:"a64", nombre:"Biografía y obra",
     concepto:"La vida del autor puede iluminar la obra, pero no la agota. Conocer la biografía es útil si no se convierte en la única clave de lectura. La obra trasciende a su autor.",
     ejemplo:"La enfermedad y la sordera de Beethoven influyen en su obra tardía, pero la Novena Sinfonía no se reduce a esa circunstancia. La obra tiene vida propia.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la relación adecuada entre biografía y obra?",
       opciones:["La biografía explica completamente la obra","La biografía puede iluminar la obra, pero no la agota","La biografía es irrelevante","La obra es solo un reflejo de la vida del autor"],
       correcta:1,
       retro:"La biografía es un contexto útil, no una clave única. La obra trasciende la vida del autor y dialoga con otros lectores y épocas."}},

    {id:"a65", nombre:"Intención del autor",
     concepto:"La intención del autor es lo que quiso decir o hacer con la obra. Su papel en la interpretación es discutido: algunos la consideran decisiva, otros sostienen que la obra vive independientemente de ella.",
     ejemplo:"El «Guernica» fue un encargo propagandístico del gobierno republicano, pero su sentido supera esa intención inicial: hoy es una denuncia universal de la guerra.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué sostiene la postura que relativiza la intención del autor?",
       opciones:["Que solo el autor sabe lo que quiso decir","Que la obra puede significar más o distinto de lo que el autor quiso","Que el autor no importa en absoluto","Que el crítico debe adivinar la intención"],
       correcta:1,
       retro:"Una obra puede significar más de lo que su autor pretendía. El sentido se construye también en la recepción."}},

    {id:"a66", nombre:"Recepción del espectador",
     concepto:"La obra no existe plenamente hasta que alguien la recibe. Cada época y cada espectador la interpretan desde su propio horizonte. La historia de las recepciones es parte de la historia del arte.",
     ejemplo:"Las pinturas de Van Gogh que hoy son admiradas no fueron valoradas en su tiempo. La recepción cambia con el tiempo y con las culturas.",
     ejercicio:{tipo:"open",
       consigna:"Describe cómo una obra puede recibir interpretaciones distintas según la época o la cultura.",
       criterios:[
         "Elegí una obra concreta.",
         "Describí al menos dos recepciones distintas.",
         "Expliqué qué factores producen esas diferencias."
       ],
       modelo:"«Las Meninas» de Velázquez fue vista en el siglo XVII como un retrato de la familia real con el pintor incluido. En el siglo XX, Foucault la leyó como una obra que problematiza la representación misma: el espectador ocupa el lugar de los reyes. La diferencia no está en la obra, sino en el horizonte de quien la mira: la época barroca valoraba el retrato cortesano; la época moderna, la reflexión sobre el lenguaje. La obra contiene ambas posibilidades."}},

    {id:"a67", nombre:"Interpretación simbólica",
     concepto:"Interpretar simbólicamente es leer los elementos de la obra como signos que remiten a algo más. Los símbolos pueden ser culturales (una calavera = muerte) o propios de la obra (un color que reaparece).",
     ejemplo:"En la pintura medieval, un cordero puede simbolizar a Cristo; un espejo, la vanidad; una calavera, la muerte (vanitas). En arte contemporáneo, los símbolos son más abiertos.",
     ejercicio:{tipo:"classify",
       consigna:"Relaciona cada símbolo tradicional con su significado habitual.",
       categorias:["Vanidad","Muerte","Pureza","Sabiduría"],
       items:[
         {texto:"Espejo", cat:0},
         {texto:"Calavera", cat:1},
         {texto:"Lirio", cat:2},
         {texto:"Lechuza", cat:3},
         {texto:"Reloj de arena", cat:1}
       ],
       retro:"Los símbolos clásicos tienen significados convencionales en la tradición occidental. Pero cada obra puede resignificarlos."}},

    {id:"a68", nombre:"Análisis iconográfico",
     concepto:"La iconografía identifica y describe los temas, personajes y motivos de una obra. La iconología interpreta su significado cultural más profundo. Erwin Panofsky distinguió tres niveles: pre-iconográfico, iconográfico e iconológico.",
     ejemplo:"Identificar a una mujer con un niño y una paloma es iconografía (Virgen con el Niño y el Espíritu Santo). Interpretar por qué se representa así en una época es iconología.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada acción según el nivel de análisis de Panofsky.",
       categorias:["Pre-iconográfico","Iconográfico","Iconológico"],
       items:[
         {texto:"Describir colores y formas.", cat:0},
         {texto:"Identificar a la Virgen con el Niño.", cat:1},
         {texto:"Interpretar por qué esa imagen era significativa en su contexto.", cat:2},
         {texto:"Reconocer un rostro y un gesto.", cat:0},
         {texto:"Reconocer el tema del descendimiento.", cat:1}
       ],
       retro:"Panofsky distingue tres niveles de lectura: lo que se ve, lo que se identifica y lo que significa culturalmente."}},

    {id:"a69", nombre:"Crítica de arte: función y tipos",
     concepto:"La crítica de arte interpreta, valora y sitúa una obra en su contexto. Puede ser descriptiva, interpretativa o valorativa. Su función es mediar entre obra y público, no imponer un gusto.",
     ejemplo:"Una crítica de una exposición puede describir las obras, situarlas en la trayectoria del artista, valorar su aporte y proponer una lectura.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de crítica según su función principal.",
       categorias:["Descriptiva","Interpretativa","Valorativa"],
       items:[
         {texto:"«La obra mide 2 x 3 m y está pintada al óleo.»", cat:0},
         {texto:"«La obra puede leerse como una reflexión sobre la memoria.»", cat:1},
         {texto:"«Es una de las propuestas más originales de la temporada.»", cat:2},
         {texto:"«El color dominante es el azul ultramar.»", cat:0},
         {texto:"«Su aporte al debate sobre el arte público es notable.»", cat:2}
       ],
       retro:"La crítica combina descripción, interpretación y valoración. Cuando solo hay una de las tres, la crítica se empobrece."}},

    {id:"a70", nombre:"Debate interpretativo",
     concepto:"Las obras admiten interpretaciones diversas. El debate interpretativo no busca una única verdad, sino poner a prueba las lecturas con argumentos. La mejor interpretación es la que mejor se sostiene con la obra.",
     ejemplo:"Ante una misma obra, alguien puede leerla como crítica política y otro como exploración formal. El debate entre ambas lecturas enriquece la comprensión.",
     ejercicio:{tipo:"open",
       consigna:"Propón dos interpretaciones distintas de una misma obra y argumenta cuál te parece más convincente.",
       criterios:[
         "Describí la obra brevemente.",
         "Propuse dos interpretaciones diferentes.",
         "Argumenté por qué una me parece más sólida."
       ],
       modelo:"Elegí «La joven de la perla» de Vermeer. Primera interpretación: es un retrato intimista, una escena doméstica captada en un instante. Segunda interpretación: es un estudio sobre la mirada y la relación entre el espectador y lo representado, ya que la joven parece mirarnos directamente. Me parece más convincente la segunda, porque el giro de cabeza, el ojo que nos busca y la luz que ilumina justamente la perla construyen un dispositivo de seducción visual: la obra nos interpela."}}
  ]
},

/* ============ BLOQUE 8 · ARTE, CULTURA Y SOCIEDAD ============ */
{
  id:"b8", nombre:"Arte, cultura y sociedad", emoji:"🌍",
  desc:"Arte y política, identidad, género, religión, mercado, tecnología, ecología y memoria.",
  tecnicas:[
    {id:"a71", nombre:"Arte y política",
     concepto:"El arte ha sido instrumento de propaganda, de crítica y de resistencia. Puede reforzar el poder o cuestionarlo. Nunca es completamente neutral: siempre se sitúa en un contexto de poder.",
     ejemplo:"Los murales de Siqueiros criticaban el orden social. El realismo socialista soviético glorificaba el régimen. El arte de protesta actual cuestiona políticas concretas.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada ejemplo según su relación con el poder.",
       categorias:["Propaganda","Crítica / resistencia"],
       items:[
         {texto:"Mural que glorifica al líder.", cat:0},
         {texto:"Obra que denuncia la violencia de Estado.", cat:1},
         {texto:"Cartel que llama a apoyar la guerra.", cat:0},
         {texto:"Performance que reclama derechos.", cat:1},
         {texto:"Monumento oficial a un gobernante.", cat:0}
       ],
       retro:"El arte nunca es puramente neutral. Puede servir al poder o resistirlo, y muchas veces hace las dos cosas a la vez."}},

    {id:"a72", nombre:"Arte e identidad",
     concepto:"El arte expresa y construye identidades: personales, colectivas, nacionales, étnicas, sexuales. Puede reforzar estereotipos o desmontarlos, afirmar lo propio o dialogar con lo ajeno.",
     ejemplo:"El arte indígena contemporáneo afirma identidades y reclama reconocimiento. Las obras autobiográficas construyen identidades individuales. El arte queer cuestiona las normas de género.",
     ejercicio:{tipo:"open",
       consigna:"¿Cómo puede el arte contribuir a construir o afirmar una identidad colectiva?",
       criterios:[
         "Expliqué al menos una manera concreta.",
         "Usé un ejemplo (obra, artista, movimiento o comunidad).",
         "Reconocí también los riesgos de la esencialización."
       ],
       modelo:"El arte afirma identidades cuando una comunidad se ve representada en obras que reconocen su historia, sus paisajes o sus luchas. Por ejemplo, el muralismo mexicano de los años veinte dio a campesinos e indígenas un lugar central en la imagen nacional. Pero también hay un riesgo: fijar una única imagen de la identidad puede borrar diferencias internas y convertir la cultura en estereotipo. La mejor contribución del arte es mostrar la identidad como algo vivo y plural, no como una esencia cerrada."}},

    {id:"a73", nombre:"Arte y género",
     concepto:"El arte ha representado históricamente a las mujeres desde la mirada masculina dominante. La crítica feminista analiza cómo se construyen esas imágenes y reivindica a las artistas silenciadas y nuevas formas de representación.",
     ejemplo:"El desnudo femenino en la pintura occidental suele estar hecho para la mirada masculina. Artistas como Artemisia Gentileschi, Frida Kahlo o Guerrilla Girls cuestionan esa tradición.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada situación según corresponda al análisis feminista del arte.",
       categorias:["Crítica feminista","Práctica tradicional"],
       items:[
         {texto:"Analizar cómo se representa el cuerpo femenino.", cat:0},
         {texto:"Representar a la mujer solo como objeto decorativo.", cat:1},
         {texto:"Recuperar obras de artistas mujeres olvidadas.", cat:0},
         {texto:"Excluir a las mujeres de las academias.", cat:1},
         {texto:"Cuestionar los cánones de belleza dominantes.", cat:0}
       ],
       retro:"La crítica feminista del arte revela cómo el género organiza la producción, la representación y la recepción de las obras."}},

    {id:"a74", nombre:"Arte y religión",
     concepto:"Muchas tradiciones artísticas nacieron al servicio de lo sagrado: templos, íconos, música litúrgica, danzas rituales. El arte ha sido vehículo de experiencia religiosa y también objeto de censura.",
     ejemplo:"Las catedrales góticas, los iconos bizantinos, la caligrafía islámica, los mantos rituales, la música sacra. Cada tradición desarrolla un lenguaje propio para lo sagrado.",
     ejercicio:{tipo:"fill",
       consigna:"Relaciona cada tradición con su expresión artística principal.",
       texto:"El arte bizantino se expresa en los ___. El arte islámico evita la figuración y privilegia la ___ y la geometría. El arte gótico se expresa en las ___.",
       respuestas:[["iconos","íconos","mosaicos"],["caligrafia","caligrafía","arabescos","geometria","geometría"],["catedrales","vidrieras","iglesias"]],
       retro:"El arte religioso desarrolla lenguajes propios según cada tradición: la figuración cristiana, la abstracción islámica, los símbolos del hinduismo o del budismo."}},

    {id:"a75", nombre:"Arte y mercado",
     concepto:"El arte circula en un mercado: galerías, ferias, subastas, coleccionistas. El valor económico de una obra no coincide necesariamente con su valor estético. El mercado influye en qué se produce y qué se difunde.",
     ejemplo:"Una obra puede alcanzar precios millonarios en subasta por razones de prestigio, escasez o inversión, no necesariamente por su calidad artística. Muchas obras valiosas permanecen fuera del circuito comercial.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué relación existe entre el valor económico y el valor estético de una obra?",
       opciones:["Siempre coinciden","No coinciden necesariamente: el precio depende del mercado, el valor estético de otros criterios","El valor estético determina el precio","Solo importa el precio"],
       correcta:1,
       retro:"El precio es una construcción del mercado. El valor estético se juzga con otros criterios: forma, sentido, contexto, aporte."}},

    {id:"a76", nombre:"Arte y tecnología",
     concepto:"Las tecnologías transforman el arte: la imprenta, la fotografía, el cine, el video, internet, la inteligencia artificial. Cada nueva tecnología abre posibilidades expresivas y plantea problemas nuevos.",
     ejemplo:"La fotografía liberó a la pintura de la obligación de representar y abrió el camino a la abstracción. El video permitió el arte del tiempo. Internet dio lugar al net.art. La IA plantea hoy problemas de autoría.",
     ejercicio:{tipo:"open",
       consigna:"Reflexiona sobre cómo una tecnología ha transformado el arte.",
       criterios:[
         "Elegí una tecnología concreta.",
         "Expliqué al menos una transformación que produjo.",
         "Reconocí también algún problema o tensión que introdujo."
       ],
       modelo:"La fotografía transformó el arte porque liberó a la pintura de la tarea de reproducir la realidad. Si una cámara podía captar un rostro con exactitud, la pintura pudo explorar otros caminos: el impresionismo, el expresionismo, la abstracción. Pero también introdujo tensiones: ¿es la fotografía arte? ¿Quién es el autor si la imagen la captura una máquina? Estas preguntas siguen vivas hoy con la inteligencia artificial."}},

    {id:"a77", nombre:"Arte y ecología",
     concepto:"El arte contemporáneo aborda la crisis ecológica: el cambio climático, la extinción, la contaminación, la relación entre humanos y naturaleza. También cuestiona el impacto material de la producción artística.",
     ejemplo:"Obras con materiales reciclados, instalaciones sobre el deshielo, performances que señalan la contaminación, land art que dialoga con el paisaje. El arte se vuelve testigo y crítica ambiental.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los rasgos del arte ecológico.",
       texto:"El arte ecológico usa materiales ___, aborda temas como el ___ climático y cuestiona la relación entre el ser humano y la ___.",
       respuestas:[["reciclados","naturales","sostenibles","recuperados","reutilizados"],["cambio","calentamiento","cambio climático"],["naturaleza","tierra","biosfera","fauna","flora"]],
       retro:"El arte ecológico no solo tematiza el problema: también repiensa sus propios materiales y procesos."}},

    {id:"a78", nombre:"Arte y memoria",
     concepto:"El arte conserva, elabora y transmite la memoria colectiva. Monumentos, memoriales, fotografías, testimonios y obras contemporáneas hacen presente lo que el olvido amenaza.",
     ejemplo:"Los memoriales del Holocausto, las Madres de Plaza de Mayo con sus pañuelos, las fotografías de desaparecidos, las obras que recuerdan dictaduras y guerras.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la función del arte en la memoria.",
       texto:"El arte contribuye a la memoria colectiva porque ___, ___ y ___. Monumentos y memoriales hacen presente lo que el olvido amenaza: ___, ___ y ___.",
       respuestas:[["conserva testimonios","da forma al recuerdo","transmite experiencias","honra a las victimas","honra a las víctimas","mantiene vivo el pasado"],["el pasado","la historia","la experiencia colectiva","la memoria"],["la ausencia","la perdida","la pérdida","el dolor","la injusticia","a las victimas","a las víctimas"]],
       retro:"El arte puede dar forma a lo que la memoria no alcanza a decir. Los memoriales son dispositivos para que el pasado no se borre."}},

    {id:"a79", nombre:"Arte y educación",
     concepto:"La educación artística desarrolla la percepción, la sensibilidad, la creatividad y el pensamiento crítico. No forma solo artistas: forma ciudadanos capaces de leer el mundo simbólicamente.",
     ejemplo:"Un taller de teatro desarrolla expresión, escucha y trabajo en equipo. Una clase de dibujo entrena la observación y la paciencia. Un proyecto de mural comunitario forma sentido de pertenencia.",
     ejercicio:{tipo:"open",
       consigna:"¿Qué aporta la educación artística a la formación de una persona?",
       criterios:[
         "Mencioné al menos tres aportes distintos.",
         "Expliqué por qué son importantes más allá del arte mismo.",
         "Relacioné la educación artística con la vida cotidiana o ciudadana."
       ],
       modelo:"La educación artística aporta tres cosas fundamentales. Primero, entrena la percepción: aprender a mirar con atención algo que normalmente se pasa por alto. Segundo, desarrolla la imaginación y la capacidad de crear, que sirve para cualquier ámbito de la vida. Tercero, forma pensamiento simbólico: aprender a leer imágenes, gestos, sonidos y textos como signos con sentido. Estas capacidades sirven para ser mejor ciudadano: alguien capaz de no dejarse manipular por la publicidad o la propaganda, y capaz de imaginar mundos distintos al que vive."}},

    {id:"a80", nombre:"Arte y diversidad cultural",
     concepto:"El arte expresa la diversidad de culturas, lenguas y tradiciones. La diversidad no es solo un hecho a respetar: es una riqueza estética. El diálogo entre culturas produce formas nuevas.",
     ejemplo:"Músicas que mezclan tradiciones africanas, europeas e indígenas. Artes visuales que combinan técnicas milenarias con lenguajes contemporáneos. Textiles que cuentan historias comunitarias.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada situación según favorezca o no la diversidad cultural.",
       categorias:["Favorece la diversidad","No la favorece"],
       items:[
         {texto:"Un festival que reúne músicas de varias regiones.", cat:0},
         {texto:"Una política que prohíbe las lenguas locales.", cat:1},
         {texto:"Talleres donde mayores enseñan oficios a jóvenes.", cat:0},
         {texto:"Un museo que solo exhibe arte europeo.", cat:1},
         {texto:"Un proyecto que mezcla técnicas tradicionales y digitales.", cat:0}
       ],
       retro:"La diversidad cultural se sostiene con prácticas concretas: festivales, talleres, políticas de reconocimiento, educación intercultural."}}
  ]
},

/* ============ BLOQUE 9 · CREATIVIDAD Y PRODUCCIÓN ARTÍSTICA ============ */
{
  id:"b9", nombre:"Creatividad y producción artística", emoji:"✨",
  desc:"El proceso creativo, bocetos, experimentación, serie, colaboración, montaje y portafolio.",
  tecnicas:[
    {id:"a81", nombre:"Fases del proceso creativo",
     concepto:"El proceso creativo suele pasar por varias fases: preparación (documentarse, observar), incubación (dejar reposar), iluminación (la idea), verificación (realizar y ajustar). No es lineal: hay idas y vueltas.",
     ejemplo:"Antes de pintar un cuadro: observar, bocetar, pensar. Después dejar la idea reposar. Un día aparece una solución inesperada. Luego hay que realizarla y corregirla.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las fases del proceso creativo.",
       items:[
         "Preparación: observar, documentarse, recoger material.",
         "Incubación: dejar reposar la idea.",
         "Iluminación: aparición de una idea o solución.",
         "Verificación: realizar la obra y ajustar."
       ],
       retro:"Las fases no son rígidas. Muchas veces hay que volver a la preparación en medio del proceso."}},

    {id:"a82", nombre:"Bocetos y cuaderno de artista",
     concepto:"El boceto es un dibujo preparatorio: prueba ideas antes de realizarlas. El cuaderno de artista recoge bocetos, notas, observaciones, dudas y hallazgos. Es el laboratorio íntimo del creador.",
     ejemplo:"Los cuadernos de Da Vinci, los bocetos de Picasso para el «Guernica», los apuntes de Frida Kahlo. En ellos se ve el pensamiento en proceso.",
     ejercicio:{tipo:"open",
       consigna:"Describe qué incluirías en tu propio cuaderno de artista.",
       criterios:[
         "Mencioné al menos cuatro tipos de contenidos.",
         "Expliqué para qué serviría cada uno.",
         "Reconocí el cuaderno como espacio de prueba y error."
       ],
       modelo:"En mi cuaderno incluiría: 1) bocetos rápidos de lo que veo en la calle; 2) notas sobre obras que me impresionan y por qué; 3) pruebas de color y textura; 4) frases oídas que pueden convertirse en títulos; 5) dudas y errores, porque el cuaderno no es para mostrar, es para pensar. Serviría para no perder ideas y para ver cómo evolucionan con el tiempo."}},

    {id:"a83", nombre:"Experimentación con materiales",
     concepto:"Experimentar es probar materiales, soportes y técnicas sin saber de antemano el resultado. El error forma parte del proceso: muchos hallazgos nacen de un accidente.",
     ejemplo:"Mezclar arena con pintura, pintar sobre cartón, usar café como tinte, grabar con objetos cotidianos. La experimentación abre posibilidades que la técnica aprendida cierra.",
     ejercicio:{tipo:"fill",
       consigna:"Propón experimentaciones materiales.",
       texto:"Podría pintar con ___, dibujar sobre ___ o esculpir con ___.",
       respuestas:[["cafe","café","tierra","carbon","carbón","arena","tinta","pigmentos naturales","acuarela","tizas","ceras"],["carton","cartón","madera","papel reciclado","tela","piedra","vidrio","periodico","periódico"],["barro","arcilla","papel","alambre","yeso","carton","cartón","plastilina","materiales reciclados"]],
       retro:"La experimentación material abre posibilidades expresivas. A menudo el hallazgo nace del accidente."}},

    {id:"a84", nombre:"Improvisación",
     concepto:"Improvisar es crear en el momento, sin plan previo completo. Se practica en música, teatro, danza, poesía oral. Requiere escucha, atención y disponibilidad para el error.",
     ejemplo:"Un músico de jazz improvisa sobre una base armónica. Un actor improvisa una escena a partir de una consigna. Un bailarín improvisa siguiendo el sonido.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué requiere principalmente la improvisación?",
       opciones:["Memorizar todo de antemano","Escucha, atención al presente y disponibilidad para el error","Tener un plan rígido","Ignorar a los demás"],
       correcta:1,
       retro:"Improvisar no es hacer lo que uno quiera: es escuchar y responder en el momento. Requiere mucha atención y confianza."}},

    {id:"a85", nombre:"Referentes e influencias",
     concepto:"Todo artista se apoya en otros: los estudia, los copia, los transforma, los rechaza. Reconocer las influencias no quita originalidad: es parte de la historia del arte como diálogo.",
     ejemplo:"Picasso estudió a Velázquez y lo reinterpretó en sus variaciones sobre «Las Meninas». Warhol se apropió de imágenes publicitarias. Toda obra dialoga con otras.",
     ejercicio:{tipo:"open",
       consigna:"Elige un artista y describe al menos dos influencias reconocibles en su obra.",
       criterios:[
         "Elegí un artista concreto.",
         "Mencioné dos influencias identificables.",
         "Expliqué cómo esas influencias se transforman en su obra."
       ],
       modelo:"Elegí Frida Kahlo. Primera influencia: el arte popular mexicano, visible en los colores intensos, los exvotos y la imaginería religiosa. Segunda influencia: el surrealismo, presente en la libertad onírica de algunas imágenes, aunque ella negaba ser surrealista. Ambas se transforman en un lenguaje propio: Kahlo toma del arte popular la frontalidad y el color, y del surrealismo la libertad para representar el mundo interior, pero siempre partiendo de su propia biografía y su cuerpo."}},

    {id:"a86", nombre:"Serie y variaciones",
     concepto:"Muchos artistas trabajan en series: la misma idea explorada en variaciones. La serie permite profundizar en un tema, una forma o un procedimiento, en lugar de buscar la obra única.",
     ejemplo:"Monet pintó la catedral de Rouen muchas veces, a distintas horas. Warhol repitió la imagen de Marilyn en colores distintos. Cada variación cambia el sentido del conjunto.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la reflexión sobre la serie.",
       texto:"Trabajar en serie permite explorar ___, comparar ___ y profundizar en ___.",
       respuestas:[["un tema","una idea","un motivo","un procedimiento"],["variaciones","diferencias","soluciones","resultados"],["el proceso","la forma","el sentido","un lenguaje"]],
       retro:"La serie no repite: profundiza. Cada variación ilumina algo que la obra única no alcanza a mostrar."}},

    {id:"a87", nombre:"Colaboración artística",
     concepto:"Muchas obras se producen en colaboración: teatro, cine, música de conjunto, murales comunitarios, proyectos colectivos. La autoría puede ser compartida o difusa. Colaborar exige escucha y negociación.",
     ejemplo:"Una obra de teatro involucra dramaturgo, director, actores, escenógrafo, iluminador, sonidista. Un mural comunitario puede tener decenas de autores. El resultado es de todos y de nadie.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada práctica artística como individual o colaborativa.",
       categorias:["Individual","Colaborativa"],
       items:[
         {texto:"Una novela escrita por una sola persona.", cat:0},
         {texto:"Una obra de teatro con elenco completo.", cat:1},
         {texto:"Un mural comunitario.", cat:1},
         {texto:"Un cuadro firmado por un único pintor.", cat:0},
         {texto:"Una película con equipo técnico y artístico.", cat:1}
       ],
       retro:"La colaboración plantea preguntas sobre autoría, jerarquía y responsabilidad. Muchas obras importantes son colectivas."}},

    {id:"a88", nombre:"Montaje y exposición",
     concepto:"Montar una exposición es un acto creativo: cómo se disponen las obras en el espacio, qué recorrido se propone, qué luces, qué textos, qué relaciones se establecen entre las piezas. La exposición produce sentido.",
     ejemplo:"Una misma obra puede verse distinta según la sala, la luz, la obra que tiene al lado o el texto que la acompaña. El montaje es parte del mensaje.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos para montar una exposición.",
       items:[
         "Definir el concepto o tema de la exposición.",
         "Seleccionar las obras y establecer relaciones entre ellas.",
         "Diseñar el recorrido y la disposición en el espacio.",
         "Ajustar luces, textos y señalización.",
         "Inaugurar y evaluar la experiencia del visitante."
       ],
       retro:"Una exposición no es un almacén de obras: es un discurso en el espacio. El montaje lo hace visible."}},

    {id:"a89", nombre:"Portafolio artístico",
     concepto:"El portafolio reúne y presenta la obra de un artista: selección, organización, textos, imágenes. No es un archivo: es una narración sobre el propio trabajo, su evolución y sus intereses.",
     ejemplo:"Un portafolio puede mostrar la evolución de una serie, distintos proyectos o una selección temática. Incluye imágenes, títulos, años y una breve descripción del trabajo.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un portafolio artístico.",
       items:[
         "Portada con nombre y presentación breve.",
         "Selección de obras representativas.",
         "Textos que expliquen el proceso o la intención.",
         "Registro de la evolución del trabajo en el tiempo.",
         "Cierre con datos de contacto o reflexión final."
       ],
       retro:"El portafolio no es un álbum: es un argumento sobre lo que uno hace. La selección y el orden dicen tanto como las obras."}},

    {id:"a90", nombre:"Autorreflexión sobre la obra propia",
     concepto:"Pensar la propia obra es parte del trabajo artístico. Preguntarse qué se quiso hacer, qué se hizo, qué se logró, qué falló, qué se aprendió. La autorreflexión transforma la práctica.",
     ejemplo:"Un artista puede escribir sobre su proceso, sus dudas y sus hallazgos. Esa escritura no es un adorno: es una herramienta para seguir trabajando.",
     ejercicio:{tipo:"open",
       consigna:"Escribe una breve autorreflexión sobre un trabajo artístico propio (dibujo, texto, música, performance, lo que sea).",
       criterios:[
         "Describí qué quise hacer y qué hice.",
         "Reconocí algún acierto y alguna dificultad.",
         "Formulé una pregunta para seguir trabajando."
       ],
       modelo:"Hice un dibujo a carboncillo de una ventana con luz entrando. Quería captar la sensación de un interior silencioso. Logré el contraste entre la zona iluminada y la penumbra, pero me costó mantener la línea del marco recta. La dificultad me enseñó que necesito practicar la línea recta con más soltura. Me pregunto cómo sería el mismo dibujo si en lugar del carboncillo usara tinta: probablemente tendría menos atmósfera y más definición. Lo probaré en la próxima serie."}}
  ]
},

/* ============ BLOQUE 10 · PATRIMONIO, IDENTIDAD Y CULTURA ============ */
{
  id:"b10", nombre:"Patrimonio, identidad y educación cultural", emoji:"🏛️",
  desc:"Patrimonio material e inmaterial, museos, conservación, derechos culturales y ciudadanía.",
  tecnicas:[
    {id:"a91", nombre:"¿Qué es el patrimonio cultural?",
     concepto:"El patrimonio cultural es el conjunto de bienes, prácticas y saberes que una comunidad reconoce como propios y decide transmitir. Incluye monumentos, obras, fiestas, lenguas, oficios y tradiciones.",
     ejemplo:"Una catedral, un cuadro, una danza tradicional, una receta familiar, un idioma, un bosque sagrado. Todo aquello que una comunidad cuida porque lo considera suyo.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento como parte del patrimonio cultural o no.",
       categorias:["Patrimonio cultural","No es patrimonio"],
       items:[
         {texto:"Una catedral histórica.", cat:0},
         {texto:"Una danza tradicional.", cat:0},
         {texto:"Un edificio abandonado sin valor reconocido.", cat:1},
         {texto:"Una lengua indígena.", cat:0},
         {texto:"Un objeto de plástico de un solo uso.", cat:1}
       ],
       retro:"El patrimonio no es solo lo bello o lo antiguo: es lo que una comunidad reconoce como propio y decide cuidar."}},

    {id:"a92", nombre:"Patrimonio material e inmaterial",
     concepto:"El patrimonio material es tangible: edificios, esculturas, pinturas, objetos. El inmaterial es intangible: lenguas, músicas, danzas, oficios, fiestas, saberes. Ambos son igualmente valiosos.",
     ejemplo:"Material: el Coliseo, una talla barroca, un tapiz. Inmaterial: el flamenco, el tango, la dieta mediterránea, el arte de la cerámica, la lengua quechua.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento según sea patrimonio material o inmaterial.",
       categorias:["Material","Inmaterial"],
       items:[
         {texto:"Un templo precolombino.", cat:0},
         {texto:"El flamenco.", cat:1},
         {texto:"Un cuadro del siglo XVII.", cat:0},
         {texto:"El oficio del bordado tradicional.", cat:1},
         {texto:"Una escultura en bronce.", cat:0},
         {texto:"La lengua guaraní.", cat:1}
       ],
       retro:"El patrimonio inmaterial es tan valioso como el material: vive en las personas y se transmite por práctica, no por conservación de objetos."}},

    {id:"a93", nombre:"Museos y su función",
     concepto:"El museo conserva, investiga, expone y comunica. Su función no es solo guardar obras: también educar, mediar, generar experiencias y cuestionar. La idea de museo ha cambiado mucho en las últimas décadas.",
     ejemplo:"Los museos clásicos eran templos de objetos. Hoy también hay museos interactivos, comunitarios, virtuales y museos que problematizan su propia historia.",
     ejercicio:{tipo:"fill",
       consigna:"Completa las funciones del museo.",
       texto:"El museo ___, ___, ___ y comunica el patrimonio. Frente al museo tradicional, los museos actuales buscan ser más ___ y ___.",
       respuestas:[["conserva","preserva","guarda","custodia"],["investiga","estudia","documenta"],["expone","muestra","exhibe","difunde"],["participativos","interactivos","abiertos","accesibles"],["educativos","comunitarios","criticos","críticos","inclusivos"]],
       retro:"El museo es una institución viva. Sus funciones clásicas se amplían hoy con la mediación, la accesibilidad y la participación."}},

    {id:"a94", nombre:"Conservación y restauración",
     concepto:"Conservar es prevenir el deterioro; restaurar es intervenir para recuperar la obra. Ambas exigen criterios éticos: mínima intervención, respeto por la obra, reversibilidad de los cambios, documentación rigurosa.",
     ejemplo:"Limpiar un cuadro sin dañar la capa pictórica. Reforzar una estructura sin sustituirla. Documentar cada intervención para que sea reconocible.",
     ejercicio:{tipo:"fill",
       consigna:"Completa los principios de la restauración.",
       texto:"La restauración debe buscar la mínima ___, respetar la ___ original y ser ___ para no dañar la obra de forma irreversible.",
       respuestas:[["intervencion","intervención","alteracion","alteración"],["obra","materia","pintura","estructura"],["reversible","documentada","respetuosa"]],
       retro:"El restaurador no crea: conserva para las generaciones futuras. La prudencia y la documentación son sus principios básicos."}},

    {id:"a95", nombre:"Patrimonio local y comunitario",
     concepto:"El patrimonio no está solo en los grandes museos: cada barrio, cada pueblo, cada familia tiene su patrimonio. Reconocerlo, valorarlo y transmitirlo es una tarea educativa y ciudadana.",
     ejemplo:"Una plaza donde se juega a algo desde hace décadas. Una receta que se transmite de abuela a nieta. Un muro con murales comunitarios. Una canción que solo se canta en ciertas fiestas.",
     ejercicio:{tipo:"open",
       consigna:"Identifica tres elementos patrimoniales de tu entorno cercano (barrio, pueblo, familia).",
       criterios:[
         "Mencioné tres elementos concretos.",
         "Expliqué qué tipo de patrimonio son (material o inmaterial).",
         "Justifiqué por qué merecen ser conservados."
       ],
       modelo:"1) La plaza donde se juega a las escondidas desde generaciones: patrimonio inmaterial, porque transmite formas de convivencia y juego. 2) La panadería del barrio que usa una receta antigua de pan: patrimonio inmaterial, ligado a un oficio. 3) El mural colectivo pintado hace diez años por vecinos y estudiantes: patrimonio material y simbólico, porque cuenta la historia del barrio. Los tres merecen conservarse porque sostienen la memoria y el sentido de pertenencia."}},

    {id:"a96", nombre:"Turismo cultural responsable",
     concepto:"El turismo cultural puede valorar el patrimonio o destruirlo. El turismo responsable respeta a las comunidades, no masifica, no mercantiliza las tradiciones y contribuye a su sostenibilidad.",

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_estetica_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno de bocetos <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, interpretaciones, referencias, dudas, ideas propias…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
</body>
</html>
