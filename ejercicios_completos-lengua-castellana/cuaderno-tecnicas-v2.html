<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de técnicas — el ensayo breve</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap');

:root{
  --paper:#EDE9DD;
  --paper-2:#E4DFCF;
  --ink:#22283B;
  --ink-soft:#4A5068;
  --redpen:#8C3230;
  --line:#C7BFA4;
  --card:#F6F3E9;
  --graphite:#726C58;
  --radius:3px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--line) 1px, transparent 1px);
  background-size:100% 34px;
  color:var(--ink);
  font-family:'Lora', Georgia, serif;
  min-height:100vh;
}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh;
}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--paper-2);
  border-right:1px solid var(--line);
  padding:28px 0 20px;
  display:flex;
  flex-direction:column;
}
.brand{ padding:0 22px 20px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.brand h1{ font-size:1.05rem; font-weight:600; margin:0 0 4px; line-height:1.25; }
.brand p{ font-family:'Special Elite', monospace; font-size:0.72rem; color:var(--graphite); margin:0; }

.progress-wrap{ padding:16px 22px 18px; border-bottom:1px solid var(--line); }
.progress-label{ font-family:'Special Elite', monospace; font-size:0.68rem; color:var(--graphite); margin-bottom:6px; }
.progress-bar{ height:6px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.progress-fill{ height:100%; background:var(--redpen); width:0%; transition:width .4s ease; }

.cat-list{ list-style:none; margin:8px 0 0; padding:0; flex:1; }
.cat-item{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding:11px 22px; cursor:pointer; font-size:0.92rem; color:var(--ink-soft);
  border-left:3px solid transparent;
}
.cat-item:hover{ color:var(--ink); }
.cat-item.active{
  color:var(--ink); border-left-color:var(--redpen);
  background:rgba(140,50,48,0.06); font-weight:600;
}
.cat-count{ font-family:'Special Elite', monospace; font-size:0.68rem; color:var(--graphite); }
.sidebar-foot{ padding:14px 22px 0; font-family:'Special Elite', monospace; font-size:0.68rem; color:var(--graphite); }

/* ---------- main ---------- */
main{ padding:34px 40px 60px; max-width:760px; }
.top-row{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:22px; flex-wrap:wrap; gap:10px;
}
.top-row h2{ margin:0; font-size:1.4rem; font-weight:600; }
.top-row .counter{ font-family:'Special Elite', monospace; font-size:0.78rem; color:var(--graphite); }

/* card shell */
.card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:3px 3px 0 rgba(34,40,59,0.06);
  margin-bottom:16px;
  position:relative;
}
.card-head{
  display:flex; align-items:center; gap:14px;
  padding:22px 28px 16px;
  border-bottom:1px solid var(--line);
}
.card-num{ font-family:'Special Elite', monospace; color:var(--redpen); font-size:0.85rem; }
.card-title{ font-size:1.35rem; font-weight:600; margin:0; }
.done-mark{
  margin-left:auto;
  font-family:'Special Elite', monospace; color:var(--redpen); font-size:0.72rem;
  border:1px solid var(--redpen); padding:2px 7px; border-radius:var(--radius);
  transform:rotate(-6deg); opacity:0; transition:opacity .3s; white-space:nowrap;
}
.done-mark.show{ opacity:0.85; }

.tabs{
  display:flex; gap:2px; padding:12px 28px 0;
  border-bottom:1px solid var(--line);
}
.tab-btn{
  font-family:'Lora', serif; font-size:0.85rem; background:transparent; border:none;
  color:var(--graphite); padding:8px 4px 12px; cursor:pointer; margin-right:20px;
  border-bottom:2px solid transparent;
}
.tab-btn.active{ color:var(--ink); border-bottom-color:var(--redpen); font-weight:600; }
.tab-btn:hover{ color:var(--ink); }

.panel{ padding:24px 28px 28px; min-height:150px; display:none; }
.panel.active{ display:block; }

.panel-label{
  font-family:'Special Elite', monospace; font-size:0.66rem; color:var(--graphite);
  margin-bottom:10px;
}
.panel p{ font-size:1.03rem; line-height:1.6; margin:0; }
.panel .ejemplo-text{ font-style:italic; }

.ejercicio-instr{ font-size:1rem; line-height:1.55; margin:0 0 14px; }

textarea{
  width:100%; min-height:130px; resize:vertical;
  border:1px solid var(--line); background:var(--paper);
  background-image:linear-gradient(var(--line) 1px, transparent 1px);
  background-size:100% 30px;
  padding:9px 16px 0; line-height:30px;
  font-family:'Lora', serif; font-size:1rem; color:var(--ink);
  border-radius:var(--radius); outline:none;
}
textarea:focus{ border-color:var(--ink-soft); }

.pad-foot{
  display:flex; justify-content:space-between;
  font-family:'Special Elite', monospace; font-size:0.66rem; color:var(--graphite);
  margin-top:8px;
}
.pad-status.saved{ color:var(--redpen); }

.nav-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
button{
  font-family:'Lora', serif; font-size:0.85rem; background:transparent;
  border:1px solid var(--line); color:var(--ink-soft);
  padding:8px 14px; border-radius:var(--radius); cursor:pointer;
}
button:hover{ border-color:var(--ink-soft); color:var(--ink); }
.nav-row .spacer{ flex:1; }
.nav-row .shuffle{ font-family:'Special Elite', monospace; font-size:0.72rem; }

@media (max-width:760px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ border-right:none; border-bottom:1px solid var(--line); padding:18px 0 10px; }
  .cat-list{ display:flex; overflow-x:auto; gap:4px; padding:0 14px; }
  .cat-item{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; padding:9px 12px; }
  .cat-item.active{ border-bottom-color:var(--redpen); background:none; }
  .progress-wrap, .sidebar-foot, .brand{ padding-left:14px; padding-right:14px; }
  main{ padding:22px 16px 50px; }
  .card-head{ padding:18px 18px 14px; flex-wrap:wrap; }
  .tabs{ padding:10px 18px 0; }
  .tab-btn{ margin-right:14px; font-size:0.8rem; }
  .panel{ padding:18px 18px 22px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Cuaderno de técnicas</h1>
      <p>100 herramientas del ensayo</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label" id="progress-label">0 de 100 practicadas</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <ul class="cat-list" id="cat-list"></ul>
    <div class="sidebar-foot">tus ejercicios se guardan solos</div>
  </aside>

  <main>
    <div class="top-row">
      <h2 id="cat-title">apertura</h2>
      <div class="counter" id="cat-counter">1 / 15</div>
    </div>

    <div class="card" id="card">
      <div class="card-head">
        <span class="card-num" id="face-num">01</span>
        <h3 class="card-title" id="face-title">—</h3>
        <span class="done-mark" id="done-mark">practicada</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="concepto">concepto</button>
        <button class="tab-btn" data-tab="ejemplo">ejemplo</button>
        <button class="tab-btn" data-tab="ejercicio">ejercicio</button>
      </div>

      <div class="panel active" id="panel-concepto">
        <div class="panel-label">qué es</div>
        <p id="face-desc">—</p>
      </div>

      <div class="panel" id="panel-ejemplo">
        <div class="panel-label">cómo suena en un texto</div>
        <p class="ejemplo-text" id="face-ejemplo">—</p>
      </div>

      <div class="panel" id="panel-ejercicio">
        <div class="panel-label">ahora tú</div>
        <p class="ejercicio-instr" id="face-ejercicio">—</p>
        <textarea id="pad" placeholder="Escribe aquí tu práctica..."></textarea>
        <div class="pad-foot">
          <span id="pad-status">sin guardar</span>
          <span id="pad-count">0 caracteres</span>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button id="prev">← anterior</button>
      <button id="next">siguiente →</button>
      <div class="spacer"></div>
      <button class="shuffle" id="shuffle">barajar categoría</button>
    </div>
  </main>
</div>

<script>
const DATA = [
{id:1,cat:"apertura",name:"Anécdota breve",desc:"Arrancar con una escena mínima y concreta, casi cinematográfica, antes de decir de qué trata el texto.",ex:"Tenía nueve años cuando vi llorar a mi padre por primera vez, y desde entonces entendí que la fuerza también se quiebra.",ej:"Escribe en 2-3 líneas una escena mínima y concreta que podría abrir un ensayo sobre cualquier tema que elijas."},
{id:2,cat:"apertura",name:"Pregunta retórica",desc:"Abrir con una interrogación que el ensayo entero irá respondiendo poco a poco.",ex:"¿Qué es, en realidad, tener miedo?",ej:"Escribe una pregunta que abra un ensayo y que el resto del texto debería responder poco a poco."},
{id:3,cat:"apertura",name:"Cita ajena",desc:"Usar una idea de otro autor, parafraseada, como disparador del propio pensamiento.",ex:"Como decía cierto filósofo, no nos bañamos dos veces en el mismo río — y tampoco somos, dos veces, la misma persona.",ej:"Parafrasea (sin copiar textual) una idea de alguien que admires y úsala como disparador de un párrafo propio."},
{id:4,cat:"apertura",name:"Definición provocadora",desc:"Redefinir un término común de forma inesperada para descolocar al lector desde la primera línea.",ex:"La paciencia no es esperar: es dejar de necesitar que algo termine.",ej:"Redefine, en una sola frase y de forma inesperada, una palabra que todos creen entender."},
{id:5,cat:"apertura",name:"Contradicción inicial",desc:"Presentar una paradoja que el desarrollo del ensayo se encargará de resolver.",ex:"Cuanto más elegimos, menos libres nos sentimos.",ej:"Escribe una frase paradójica —algo que suene contradictorio pero sea cierto— que podría abrir un ensayo."},
{id:6,cat:"apertura",name:"Imagen sensorial",desc:"Comenzar con una escena visual, sonora o táctil antes de nombrar la idea abstracta.",ex:"El olor a café quemado llenaba la cocina antes de que nadie dijera una palabra.",ej:"Describe en dos líneas una escena usando solo los sentidos, sin nombrar la emoción directamente."},
{id:7,cat:"apertura",name:"Dato sorprendente",desc:"Abrir con un hecho o cifra que rompa las expectativas del lector.",ex:"El ser humano promedio pasa casi seis años de su vida soñando.",ej:"Escribe una frase inicial que presente un dato numérico sorprendente sobre tu tema."},
{id:8,cat:"apertura",name:"In medias res",desc:"Entrar directamente en la acción o el conflicto, sin preámbulo explicativo.",ex:"La puerta se cerró detrás de mí antes de que pudiera decidir si quería entrar.",ej:"Escribe la primera frase de un ensayo que empiece en plena acción, sin explicar antes el contexto."},
{id:9,cat:"apertura",name:"Confesión personal",desc:"Revelar algo íntimo del autor como punto de partida del razonamiento.",ex:"Nunca le he dicho a nadie que, en realidad, le tengo miedo al silencio.",ej:"Escribe una confesión breve y honesta que podría abrir un ensayo sobre un tema que te importe."},
{id:10,cat:"apertura",name:"Aforismo propio",desc:"Inventar una sentencia breve y memorable que funcione como puerta de entrada al tema.",ex:"Se madura el día en que uno deja de esperar que lo entiendan.",ej:"Inventa una sentencia propia, breve y memorable, sobre cualquier tema."},
{id:11,cat:"apertura",name:"Descripción de un objeto",desc:"Usar un objeto cotidiano como metáfora inicial de la idea que se va a desarrollar.",ex:"Sobre la mesa había un reloj detenido a las tres, como si el tiempo también se cansara.",ej:"Describe un objeto cotidiano de forma que se convierta en metáfora de una idea más grande."},
{id:12,cat:"apertura",name:"Diálogo imaginario",desc:"Abrir con una conversación ficticia o hipotética entre dos voces.",ex:"—¿Y si el tiempo no pasara, sino que se quedara? —me preguntó una voz que no era la mía.",ej:"Escribe un breve diálogo imaginario que introduzca el tema de un ensayo."},
{id:13,cat:"apertura",name:"Negación inicial",desc:"Comenzar diciendo lo que el ensayo no es o no va a hacer, para delimitar el terreno.",ex:"Esto no es un ensayo sobre el fracaso. O tal vez sí, pero no del modo en que uno espera.",ej:"Escribe una frase inicial que diga lo que tu texto no va a hacer."},
{id:14,cat:"apertura",name:"Etimología",desc:"Rastrear el origen de una palabra clave como punto de partida del argumento.",ex:"'Decidir' viene del latín decidere: cortar. Elegir siempre implica perder algo.",ej:"Busca el origen de una palabra clave para tu tema y escribe una frase que parta de ahí."},
{id:15,cat:"apertura",name:"Escena histórica",desc:"Situar al lector en un momento del pasado antes de traer el tema al presente.",ex:"En 1969, mientras el mundo miraba hacia la Luna, alguien en algún lugar miraba, simplemente, hacia adentro.",ej:"Sitúa al lector en un momento histórico concreto como puerta de entrada a tu tema."},

{id:16,cat:"estructura",name:"Tesis explícita temprana",desc:"Declarar la idea central del ensayo ya en el primer párrafo.",ex:"Este ensayo sostiene que el aburrimiento no es un vacío, sino una forma de atención postergada.",ej:"Escribe, en una sola frase clara, la tesis que defenderías sobre un tema de tu elección."},
{id:17,cat:"estructura",name:"Tesis diferida",desc:"Dejar que la idea central emerja recién al final, tras el recorrido del texto.",ex:"La idea central de este ensayo solo aparece en la última línea, y ahí es más fuerte.",ej:"Escribe tres frases que vayan acercándose a una idea, sin decirla del todo hasta la tercera."},
{id:18,cat:"estructura",name:"Estructura circular",desc:"Cerrar el texto retomando, transformada, la imagen con la que abrió.",ex:"Empezamos hablando de un reloj detenido; terminamos entendiendo que el tiempo detenido éramos nosotros.",ej:"Escribe una imagen de apertura y, debajo, cómo la transformarías para que cierre el mismo texto."},
{id:19,cat:"estructura",name:"Progresión en espiral",desc:"Volver una y otra vez sobre la misma idea, profundizando en cada vuelta.",ex:"Volvemos sobre la misma pregunta —¿qué es el hogar?— cada vez con una respuesta más honesta.",ej:"Escribe la misma pregunta dos veces, y entre una y otra, una frase que la profundice."},
{id:20,cat:"estructura",name:"Contraste binario",desc:"Organizar el ensayo en torno a dos polos opuestos que se van alternando.",ex:"Hay quienes viajan para escapar, y quienes viajan para encontrarse. Rara vez son la misma persona.",ej:"Escribe una frase que organice tu tema en dos polos opuestos y claros."},
{id:21,cat:"estructura",name:"Enumeración temática",desc:"Desarrollar el ensayo como una lista comentada de casos o ideas.",ex:"Primero, el silencio. Después, la costumbre. Por último, el olvido.",ej:"Enumera tres aspectos de tu tema, cada uno en una frase breve."},
{id:22,cat:"estructura",name:"Fragmentación",desc:"Dividir el texto en bloques breves y relativamente autónomos entre sí.",ex:"I. La espera. II. El cansancio de esperar. III. Lo que queda cuando ya no se espera.",ej:"Divide una idea en tres fragmentos breves y autónomos, numerados."},
{id:23,cat:"estructura",name:"Digresión controlada",desc:"Desviarse del tema principal y regresar a él con un sentido nuevo.",ex:"Hablábamos de la ciudad —aunque esto también es hablar de la infancia— y volvamos a la ciudad.",ej:"Escribe una frase que se desvíe del tema principal y otra que regrese a él con sentido nuevo."},
{id:24,cat:"estructura",name:"Analogía extendida",desc:"Sostener una misma comparación a lo largo de todo el ensayo.",ex:"La memoria es un jardín: hay que regarla, o se llena de maleza.",ej:"Elige una comparación y escribe dos frases que la sostengan, sin abandonarla."},
{id:25,cat:"estructura",name:"Caso y ley (inducción)",desc:"Partir de un ejemplo particular para llegar a una idea general.",ex:"Mi abuela nunca tiró una carta. Así aprendí que hay personas que guardan el tiempo en papel.",ej:"Escribe un caso particular y, debajo, la idea general que ese caso te permite afirmar."},
{id:26,cat:"estructura",name:"Estructura deductiva",desc:"Partir de una idea general y descender hacia lo particular.",ex:"Toda pérdida enseña algo. La mía, por ejemplo, me enseñó a callar mejor.",ej:"Escribe una idea general y, debajo, un ejemplo particular que la ilustre."},
{id:27,cat:"estructura",name:"Montaje o collage",desc:"Yuxtaponer fragmentos de pensamiento sin conectores explícitos entre ellos.",ex:"Un tren. Una carta sin enviar. El ruido de una puerta. Así también se cuenta una vida.",ej:"Escribe tres imágenes sueltas, sin conectarlas con palabras de enlace, que sugieran una misma idea."},
{id:28,cat:"estructura",name:"Hilo narrativo",desc:"Usar una pequeña historia como columna vertebral que sostiene el argumento.",ex:"Todo empezó con una maleta que nunca llegamos a deshacer del todo.",ej:"Escribe el inicio de una pequeña historia que podría sostener, por debajo, un argumento."},
{id:29,cat:"estructura",name:"Punto de inflexión",desc:"Marcar un giro claro de sentido hacia la mitad del texto.",ex:"Hasta ahí pensaba que el silencio era ausencia. Después entendí que era compañía.",ej:"Escribe una frase de bisagra: 'Hasta aquí pensaba X. Después entendí Y.'"},
{id:30,cat:"estructura",name:"Simetría de párrafos",desc:"Equilibrar deliberadamente la extensión entre la apertura y el cierre.",ex:"Un párrafo de apertura y uno de cierre, de largo casi idéntico, como dos manos que se encuentran.",ej:"Escribe dos frases de largo parecido: una para abrir, otra para cerrar la misma idea."},
{id:31,cat:"estructura",name:"Acumulación gradual",desc:"Sumar ejemplos de menor a mayor intensidad a medida que avanza el texto.",ex:"Primero fue una duda. Luego, una costumbre. Finalmente, una forma de vida.",ej:"Escribe tres ejemplos del mismo tema, ordenados de menor a mayor intensidad."},
{id:32,cat:"estructura",name:"Preguntas en cascada",desc:"Encadenar interrogantes que van profundizando cada vez más en el tema.",ex:"¿Qué es el hogar? ¿Es un lugar? ¿O es la persona con la que uno vuelve?",ej:"Escribe tres preguntas encadenadas que profundicen cada vez más en un mismo tema."},
{id:33,cat:"estructura",name:"Voz que se autocorrige",desc:"Dejar que el propio texto dude de sí mismo y se rectifique en voz alta.",ex:"Creo que el amor es paciencia. No —creo que el amor es, sobre todo, atención.",ej:"Escribe una frase, y luego corrígete a ti mismo en la siguiente."},
{id:34,cat:"estructura",name:"Estructura de carta",desc:"Dirigir el ensayo entero a un destinatario específico, real o imaginado.",ex:"Querido lector: esto que voy a contarte también me lo estoy contando a mí.",ej:"Escribe el inicio de tu ensayo como si fuera una carta dirigida a alguien concreto."},
{id:35,cat:"estructura",name:"Paréntesis reflexivo",desc:"Insertar una pausa meta-textual sobre el propio acto de escribir el ensayo.",ex:"No sé todavía si esta frase es cierta, pero la escribo para averiguarlo.",ej:"Escribe una frase entre paréntesis donde reflexiones sobre lo que acabas de escribir."},

{id:36,cat:"argumentacion",name:"Ejemplo concreto",desc:"Ilustrar cada idea abstracta con un caso tangible y reconocible.",ex:"Decimos que el tiempo cura, pero mi tío lleva veinte años sin volver a esa casa.",ej:"Escribe una idea abstracta y, debajo, un ejemplo muy concreto que la ilustre."},
{id:37,cat:"argumentacion",name:"Contraargumento y réplica",desc:"Anticipar la objeción más fuerte del lector y responderla dentro del texto.",ex:"Se podría decir que renunciar es debilidad. Y sin embargo, a veces es la forma más difícil de valentía.",ej:"Escribe una objeción a tu propia idea, y luego respóndela en la frase siguiente."},
{id:38,cat:"argumentacion",name:"Comparación histórica",desc:"Vincular el asunto presente con un precedente claro del pasado.",ex:"Como en la peste de Atenas, el miedo también contagia más rápido que cualquier virus.",ej:"Vincula tu tema con un antecedente histórico, aunque sea breve o aproximado."},
{id:39,cat:"argumentacion",name:"Reducción al absurdo",desc:"Llevar una idea a su extremo lógico para mostrar dónde falla.",ex:"Si toda opinión mereciera el mismo peso, la ignorancia y el conocimiento pesarían igual.",ej:"Lleva una idea común a su extremo lógico para mostrar, con humor, dónde falla."},
{id:40,cat:"argumentacion",name:"Apelación a la experiencia",desc:"Usar una vivencia propia como evidencia que sostiene la tesis.",ex:"La primera vez que perdí un vuelo aprendí que el control es, casi siempre, una ilusión.",ej:"Escribe una experiencia propia (real o verosímil) que sirva como evidencia de una idea."},
{id:41,cat:"argumentacion",name:"Autoridad citada",desc:"Apoyar la tesis parafraseando a una fuente reconocida en el tema.",ex:"Como bien señalaba cierto pensador, el hábito es una segunda naturaleza que se olvida de serlo.",ej:"Parafrasea una idea de alguien con autoridad en el tema y úsala para sostener tu argumento."},
{id:42,cat:"argumentacion",name:"Ironía argumentativa",desc:"Decir lo contrario de lo que se piensa para exponer mejor un vicio o error.",ex:"Claro, lo mejor es no opinar nunca: así nadie se equivoca ni piensa.",ej:"Escribe, en tono irónico, lo contrario de lo que realmente piensas, para exponer un error común."},
{id:43,cat:"argumentacion",name:"Hipérbole controlada",desc:"Exagerar deliberadamente un punto para hacerlo más visible.",ex:"Esperé tanto esa respuesta que envejecí un poco cada día.",ej:"Exagera deliberadamente una idea para hacerla más visible, sin perder el control del tono."},
{id:44,cat:"argumentacion",name:"Concesión parcial",desc:"Aceptar una parte válida de la posición contraria antes de refutar el resto.",ex:"Es cierto que la prisa a veces salva vidas. Pero rara vez salva relaciones.",ej:"Acepta una parte válida de la postura contraria antes de defender la tuya."},
{id:45,cat:"argumentacion",name:"Silogismo disimulado",desc:"Razonar en tres pasos lógicos sin que suene mecánico ni forzado.",ex:"Quien teme perder ya ha perdido algo: la calma. Y sin calma, se pierde casi todo lo demás.",ej:"Escribe un razonamiento en tres pasos que no suene mecánico ni forzado."},
{id:46,cat:"argumentacion",name:"Metáfora argumentativa",desc:"Usar una imagen para sostener la idea, no solo para decorarla.",ex:"Una relación sin conversación es una casa sin ventanas: se puede vivir, pero se ahoga.",ej:"Usa una imagen para sostener, no solo decorar, un argumento."},
{id:47,cat:"argumentacion",name:"Dato cuantitativo",desc:"Respaldar una afirmación con un número, proporción o medida concreta.",ex:"Se estima que olvidamos el noventa por ciento de lo que soñamos apenas despertamos.",ej:"Respalda una afirmación con un número o proporción, aunque sea aproximado."},
{id:48,cat:"argumentacion",name:"Comparación cultural",desc:"Contrastar cómo distintas sociedades entienden el mismo asunto.",ex:"Donde unos ven silencio incómodo, otras culturas ven, simplemente, respeto.",ej:"Contrasta cómo dos culturas distintas entenderían el mismo asunto."},
{id:49,cat:"argumentacion",name:"Absurdo cotidiano",desc:"Usar un ejemplo doméstico y pequeño para validar una idea abstracta y grande.",ex:"Guardar todos los mensajes sin leer es, también, una forma de guardar el tiempo sin vivirlo.",ej:"Usa un ejemplo pequeño y doméstico para validar una idea abstracta."},
{id:50,cat:"argumentacion",name:"Cadena causal",desc:"Mostrar cómo una causa produce otra, en efecto dominó, hasta la conclusión.",ex:"El cansancio produce silencio; el silencio, distancia; la distancia, olvido.",ej:"Escribe una cadena de tres causas y efectos que terminen en tu idea principal."},
{id:51,cat:"argumentacion",name:"Definición negativa",desc:"Explicar un concepto diciendo, primero, todo lo que no es.",ex:"El coraje no es no tener miedo. Es tenerlo y seguir caminando.",ej:"Define un concepto diciendo, primero, todo lo que no es."},
{id:52,cat:"argumentacion",name:"Universalización de lo particular",desc:"Partir de un caso propio para hablar, en realidad, de todos.",ex:"Mi padre nunca pidió perdón; y en eso se parecía a media generación.",ej:"Parte de un caso propio y ábrelo hacia una afirmación sobre todos."},
{id:53,cat:"argumentacion",name:"Autocrítica del argumento",desc:"El propio ensayista pone en duda, en voz alta, su tesis principal.",ex:"Quizás lo que llamo paciencia sea, en realidad, otra forma de miedo.",ej:"Pon en duda, en voz alta, tu propia tesis en una frase."},
{id:54,cat:"argumentacion",name:"Absurdo lúdico",desc:"Argumentar con humor deliberado para desarmar un prejuicio sin agredir.",ex:"Si el orden fuera virtud, mi escritorio sería un pecado mortal.",ej:"Usa el humor para desarmar, con suavidad, un prejuicio o idea común."},
{id:55,cat:"argumentacion",name:"Evidencia sensorial",desc:"Convertir una observación física y directa en prueba de una idea.",ex:"Se nota cuándo alguien miente: la voz cambia de textura, como el papel mojado.",ej:"Convierte una observación física concreta en prueba de una idea abstracta."},

{id:56,cat:"estilo",name:"Frase corta de impacto",desc:"Intercalar una oración muy breve entre frases más largas y elaboradas.",ex:"Todo cambió esa tarde. Todo. Incluso lo que creía inmutable en mí.",ej:"Escribe dos frases largas y, entre ellas, una muy corta que golpee."},
{id:57,cat:"estilo",name:"Ritmo pendular",desc:"Alternar conscientemente frases largas y cortas para marcar un compás.",ex:"Quería quedarse. También quería irse. Ambas cosas, al mismo tiempo, con la misma fuerza silenciosa.",ej:"Alterna una frase corta con una larga sobre el mismo tema."},
{id:58,cat:"estilo",name:"Repetición anafórica",desc:"Comenzar varias frases seguidas con la misma palabra o expresión.",ex:"Nadie avisa cuándo empieza el olvido. Nadie explica cómo se sale de él.",ej:"Escribe dos o tres frases que comiencen con la misma palabra."},
{id:59,cat:"estilo",name:"Paralelismo sintáctico",desc:"Repetir una misma estructura gramatical para darle cadencia al texto.",ex:"Aprendí a callar lo que dolía. Aprendí a nombrar lo que sanaba.",ej:"Escribe dos frases con exactamente la misma estructura gramatical."},
{id:60,cat:"estilo",name:"Personificación",desc:"Dar cualidades humanas a ideas o conceptos abstractos.",ex:"El silencio se sentó a la mesa con nosotros esa noche.",ej:"Dale una acción humana a una idea o emoción abstracta."},
{id:61,cat:"estilo",name:"Mezcla de registros",desc:"Combinar lenguaje culto y coloquial dentro del mismo párrafo.",ex:"La existencia, decían los filósofos, es una condena; para mí, más bien, es un rollo con sus días buenos.",ej:"Escribe una frase que combine una palabra culta con una expresión coloquial."},
{id:62,cat:"estilo",name:"Neologismo puntual",desc:"Inventar una palabra nueva cuando ninguna existente expresa la idea con precisión.",ex:"Vivíamos en una especie de esperanzadumbre: mitad espera, mitad tristeza.",ej:"Inventa una palabra nueva para nombrar algo que el idioma no nombra bien."},
{id:63,cat:"estilo",name:"Elipsis",desc:"Omitir lo obvio para que sea el lector quien complete el sentido.",ex:"Llegó, vio la maleta, y ya no dijo nada más.",ej:"Escribe una frase que omita lo obvio y deje que el lector complete el resto."},
{id:64,cat:"estilo",name:"Segunda persona",desc:"Dirigirse directamente al lector usando el 'tú', como si le hablara.",ex:"Tú también, alguna vez, has fingido estar bien por no explicar por qué no lo estás.",ej:"Escribe una frase dirigida directamente al lector, usando el 'tú'."},
{id:65,cat:"estilo",name:"Tono confesional",desc:"Escribir como quien piensa en voz alta, sin pulir demasiado el razonamiento.",ex:"No sé si esto tiene sentido, pero necesito escribirlo de todos modos.",ej:"Escribe como si pensaras en voz alta, sin pulir demasiado la idea."},
{id:66,cat:"estilo",name:"Ambigüedad deliberada",desc:"Dejar abierta, a propósito, una doble interpretación posible.",ex:"Se fue sin decir adónde, y quizás ni ella misma lo sabía.",ej:"Escribe una frase que pueda leerse de dos formas distintas, a propósito."},
{id:67,cat:"estilo",name:"Sintaxis quebrada",desc:"Romper el orden lógico de la frase para imitar el ritmo del pensamiento.",ex:"Y sin embargo —cómo explicarlo— seguía ahí, esa sensación, sin nombre todavía.",ej:"Rompe el orden habitual de una frase para imitar el ritmo de un pensamiento real."},
{id:68,cat:"estilo",name:"Adjetivación precisa",desc:"Preferir un solo adjetivo certero antes que tres adjetivos vagos.",ex:"Tenía una voz cansada. No triste: cansada.",ej:"Escribe una frase con un único adjetivo, pero exacto."},
{id:69,cat:"estilo",name:"Presente histórico",desc:"Narrar un hecho pasado como si estuviera ocurriendo ahora mismo.",ex:"Es 1985. Mi madre tiene veinte años y no sabe todavía que va a quedarse.",ej:"Narra un hecho del pasado en presente, como si ocurriera ahora."},
{id:70,cat:"estilo",name:"Onomatopeya conceptual",desc:"Usar el sonido de las palabras elegidas para reforzar la idea que expresan.",ex:"El silencio crujía entre nosotros como madera vieja.",ej:"Escribe una frase donde el sonido de las palabras refuerce la idea que expresan."},
{id:71,cat:"estilo",name:"Ironía de tono",desc:"Decir algo serio con ligereza, o algo leve con una gravedad inesperada.",ex:"Todo perfecto, como siempre: la casa vacía, el café frío, la rutina intacta.",ej:"Escribe algo serio con un tono ligero, o algo leve con un tono grave."},
{id:72,cat:"estilo",name:"Polisíndeton",desc:"Multiplicar las conjunciones ('y... y... y...') para dar sensación de intensidad.",ex:"Y esperamos y dudamos y volvimos a esperar.",ej:"Escribe una frase repitiendo la conjunción 'y' varias veces."},
{id:73,cat:"estilo",name:"Asíndeton",desc:"Eliminar las conjunciones entre frases para dar velocidad a la lectura.",ex:"Llegó, miró, decidió, se fue.",ej:"Escribe una secuencia de acciones sin usar ninguna conjunción."},
{id:74,cat:"estilo",name:"Cita interna",desc:"El autor retoma y vuelve a citar su propia frase, dicha antes en el texto.",ex:"Dije antes que el silencio se sienta a la mesa; esa noche, además, se quedó a dormir.",ej:"Retoma, más adelante en un texto tuyo, una frase que ya habías escrito antes."},
{id:75,cat:"estilo",name:"Juego etimológico",desc:"Explotar el doble sentido o el origen escondido de una palabra clave.",ex:"Recordar: volver a pasar por el corazón. Por eso duele tanto, a veces.",ej:"Explota el doble sentido o el origen de una palabra clave de tu tema."},

{id:76,cat:"pensamiento",name:"Duda como método",desc:"Dejar que el ensayo avance dudando en voz alta, no afirmando de entrada.",ex:"No sé todavía si esto es coraje o simple terquedad. Sigo escribiendo para averiguarlo.",ej:"Escribe una frase que empiece afirmando y termine dudando de lo afirmado."},
{id:77,cat:"pensamiento",name:"Pensamiento en proceso",desc:"Mostrar cómo se llega a una idea, no solo entregar la conclusión final.",ex:"Al principio pensé que era enojo. Después até cabos: era, en realidad, miedo disfrazado.",ej:"Muestra, en dos frases, cómo cambiaste de opinión sobre algo mientras lo pensabas."},
{id:78,cat:"pensamiento",name:"Tema desde lo mínimo",desc:"Abordar una gran idea a través de un detalle pequeño y concreto.",ex:"Toda la historia de mi familia cabe, de algún modo, en un cajón de cartas sin abrir.",ej:"Elige un objeto pequeño y úsalo para hablar de un tema mucho más grande."},
{id:79,cat:"pensamiento",name:"Multiplicidad de miradas",desc:"Observar el mismo tema desde varios ángulos sucesivos, sin quedarse en uno solo.",ex:"Para mi madre era ahorro; para mí, miedo disfrazado de prudencia.",ej:"Describe una misma situación desde dos puntos de vista distintos."},
{id:80,cat:"pensamiento",name:"Digresión filosófica",desc:"Detenerse deliberadamente a pensar sobre un concepto lateral al tema central.",ex:"Y esto me lleva, de paso, a preguntarme qué es realmente 'tener tiempo'.",ej:"Escribe una frase que se detenga a pensar sobre un concepto lateral a tu tema."},
{id:81,cat:"pensamiento",name:"Confesión de límites",desc:"Admitir abiertamente lo que el autor no sabe o no logra resolver.",ex:"No tengo una respuesta clara para esto. Solo tengo la pregunta, y la sigo cargando.",ej:"Admite, en una frase honesta, algo que no logras resolver del todo."},
{id:82,cat:"pensamiento",name:"Provocación intelectual",desc:"Plantear a propósito una idea incómoda que desafíe al lector.",ex:"Quizás no todos merecen ser escuchados con la misma paciencia.",ej:"Escribe una frase incómoda, a propósito, sobre un tema que te importe."},
{id:83,cat:"pensamiento",name:"Diálogo con el lector implícito",desc:"Anticipar dentro del texto las objeciones que el lector podría hacer.",ex:"Dirás que exagero. Puede ser. Pero déjame explicarte por qué no lo creo.",ej:"Anticipa una objeción del lector y respóndele directamente en el texto."},
{id:84,cat:"pensamiento",name:"El ensayo como tanteo",desc:"Presentar el texto como un intento honesto, no como una verdad cerrada.",ex:"No sé si esto es una conclusión o apenas el borrador de una.",ej:"Escribe una frase de cierre que suene a intento honesto, no a verdad cerrada."},
{id:85,cat:"pensamiento",name:"Ironía existencial",desc:"Señalar la distancia entre lo que se desea y lo que realmente ocurre.",ex:"Pasamos la vida ahorrando tiempo para actividades que, al final, nunca hacemos.",ej:"Señala, en una frase, la distancia entre lo que alguien desea y lo que realmente hace."},
{id:86,cat:"pensamiento",name:"Meditación sobre el tiempo",desc:"Usar la temporalidad como eje reflexivo del texto.",ex:"Hay días que duran una vida entera, y años que caben en una sola tarde.",ej:"Escribe una frase que reflexione sobre cómo el tiempo se siente, no cómo se mide."},
{id:87,cat:"pensamiento",name:"De lo íntimo a lo universal",desc:"Pasar de una experiencia personal a una reflexión colectiva sin previo aviso.",ex:"Mi abuela guardaba el pan duro; también, sospecho, guardaba el miedo de haber tenido hambre alguna vez.",ej:"Escribe una anécdota personal y, en la frase siguiente, ábrela hacia algo colectivo."},
{id:88,cat:"pensamiento",name:"Fragmento tipo aforismo",desc:"Cerrar cada sección con una sentencia breve y condensada.",ex:"Se crece, sobre todo, en las despedidas que no elegimos.",ej:"Cierra una idea con una frase breve, casi de sentencia."},
{id:89,cat:"pensamiento",name:"Revalorización de lo trivial",desc:"Tratar con seriedad genuina un tema aparentemente menor o cotidiano.",ex:"Barrer la casa cada mañana también es una forma de ordenar lo que uno siente.",ej:"Trata con seriedad un gesto cotidiano y pequeño, como si mereciera atención filosófica."},
{id:90,cat:"pensamiento",name:"Autoironía",desc:"El autor se burla, con suavidad, de su propio razonamiento.",ex:"Digo que valoro la calma, y escribo esto a las tres de la mañana, sin poder dormir.",ej:"Escribe una frase donde te contradigas a ti mismo, con humor."},

{id:91,cat:"cierre",name:"Cierre en espejo",desc:"Repetir, transformada, la imagen con la que había abierto el ensayo.",ex:"Empezamos con una maleta sin deshacer. Termina, todavía, sin deshacerse — y quizás está bien así.",ej:"Retoma la imagen de tu apertura y transfórmala levemente para cerrar el mismo texto."},
{id:92,cat:"cierre",name:"Pregunta final abierta",desc:"Terminar sin resolver del todo, invitando al lector a seguir pensando.",ex:"¿Y si el hogar nunca fue un lugar, sino una persona que ya no está?",ej:"Cierra una idea con una pregunta que no pretenda respuesta inmediata."},
{id:93,cat:"cierre",name:"Síntesis en una frase",desc:"Condensar todo el ensayo en una sola sentencia final.",ex:"Al final, todo esto habla de aprender a quedarse sin necesitar quedarse para siempre.",ej:"Condensa una idea compleja en una sola frase final."},
{id:94,cat:"cierre",name:"Giro inesperado",desc:"Cambiar el sentido del texto en sus últimas líneas.",ex:"Pensé que esto era sobre perder. Ahora entiendo que era, todo el tiempo, sobre soltar.",ej:"Escribe una última frase que cambie el sentido de todo lo anterior."},
{id:95,cat:"cierre",name:"Cierre irónico",desc:"Terminar con una nota de humor que resignifica todo lo dicho antes.",ex:"Y así aprendí, finalmente, la lección más inútil y necesaria de todas: que no hay lecciones finales.",ej:"Cierra con una nota de humor que le dé un giro a todo el texto."},
{id:96,cat:"cierre",name:"Vuelta a lo cotidiano",desc:"Bajar de la reflexión abstracta a un gesto simple y concreto.",ex:"Después de tanto pensarlo, simplemente puse la mesa para dos.",ej:"Baja una reflexión abstracta a un gesto simple y concreto para cerrar."},
{id:97,cat:"cierre",name:"Cierre epigramático",desc:"Una frase corta, casi de cita, que resume la tesis central.",ex:"Se ama, al final, lo que se decide seguir mirando.",ej:"Escribe una frase corta, casi de cita, que resuma tu idea central."},
{id:98,cat:"cierre",name:"Silencio productivo",desc:"Terminar con una imagen sin explicarla, dejando que hable por sí sola.",ex:"La puerta quedó abierta. Nadie entró. Nadie salió.",ej:"Cierra con una imagen sin explicarla, dejando que hable por sí sola."},
{id:99,cat:"cierre",name:"Llamado a la acción sutil",desc:"Invitar al lector, sin imponerlo, a mirar el mundo de otra manera.",ex:"Tal vez baste con mirar, mañana, un poco más despacio.",ej:"Invita al lector, sin imponerlo, a hacer algo pequeño y distinto."},
{id:100,cat:"cierre",name:"Un nuevo comienzo",desc:"Cerrar el texto sugiriendo que el tema, en realidad, apenas empieza.",ex:"Y quizás esto no termina aquí: apenas empieza, ahora que por fin lo escribí.",ej:"Cierra sugiriendo que el tema, en realidad, recién empieza."},
];

const CATS = [
  {key:"todas", label:"todas las técnicas"},
  {key:"apertura", label:"apertura"},
  {key:"estructura", label:"estructura"},
  {key:"argumentacion", label:"argumentación"},
  {key:"estilo", label:"estilo y lenguaje"},
  {key:"pensamiento", label:"pensamiento ensayístico"},
  {key:"cierre", label:"cierre"},
];

let currentCat = "apertura";
let pool = [];
let idx = 0;
let activeTab = "concepto";
let saveTimer = null;
let practicedIds = new Set();

const catListEl = document.getElementById('cat-list');
const catTitleEl = document.getElementById('cat-title');
const catCounterEl = document.getElementById('cat-counter');
const faceNum = document.getElementById('face-num');
const faceTitle = document.getElementById('face-title');
const faceDesc = document.getElementById('face-desc');
const faceEjemplo = document.getElementById('face-ejemplo');
const faceEjercicio = document.getElementById('face-ejercicio');
const doneMark = document.getElementById('done-mark');
const padEl = document.getElementById('pad');
const padStatus = document.getElementById('pad-status');
const padCount = document.getElementById('pad-count');
const progressLabel = document.getElementById('progress-label');
const progressFill = document.getElementById('progress-fill');
const tabBtns = document.querySelectorAll('.tab-btn');
const panels = { concepto: document.getElementById('panel-concepto'), ejemplo: document.getElementById('panel-ejemplo'), ejercicio: document.getElementById('panel-ejercicio') };

function buildSidebar(){
  catListEl.innerHTML = '';
  CATS.forEach(c=>{
    const count = c.key === 'todas' ? DATA.length : DATA.filter(d=>d.cat===c.key).length;
    const li = document.createElement('li');
    li.className = 'cat-item' + (c.key===currentCat ? ' active' : '');
    li.innerHTML = `<span>${c.label}</span><span class="cat-count">${count}</span>`;
    li.addEventListener('click', ()=>selectCategory(c.key));
    catListEl.appendChild(li);
  });
}

function selectCategory(key){
  currentCat = key;
  pool = key === 'todas' ? DATA.slice() : DATA.filter(d=>d.cat===key);
  idx = 0;
  buildSidebar();
  catTitleEl.textContent = CATS.find(c=>c.key===key).label;
  renderCard();
}

function shufflePool(){
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  idx = 0;
  renderCard();
}

function setTab(tab){
  activeTab = tab;
  tabBtns.forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  Object.keys(panels).forEach(k=>panels[k].classList.toggle('active', k===tab));
}

tabBtns.forEach(b=>b.addEventListener('click', ()=>setTab(b.dataset.tab)));

async function loadEntry(id){
  try{
    const res = await window.storage.get('entry:'+id);
    return res ? res.value : '';
  }catch(e){ return ''; }
}

async function saveEntry(id, text){
  try{
    await window.storage.set('entry:'+id, text);
    if(text.trim().length>0){ practicedIds.add(id); } else { practicedIds.delete(id); }
    await window.storage.set('practiced-ids', JSON.stringify(Array.from(practicedIds)));
    updateProgress();
  }catch(e){
    padStatus.textContent = 'no se pudo guardar';
  }
}

async function loadPracticedIds(){
  try{
    const res = await window.storage.get('practiced-ids');
    if(res && res.value){ practicedIds = new Set(JSON.parse(res.value)); }
  }catch(e){ practicedIds = new Set(); }
  updateProgress();
}

function updateProgress(){
  const n = practicedIds.size;
  progressLabel.textContent = `${n} de 100 practicadas`;
  progressFill.style.width = Math.min(100, n) + '%';
  updateDoneMark();
}

function updateDoneMark(){
  const t = pool[idx];
  doneMark.classList.toggle('show', !!(t && practicedIds.has(t.id)));
}

async function renderCard(){
  const t = pool[idx];
  if(!t) return;
  setTab('concepto');
  faceNum.textContent = String(t.id).padStart(2,'0');
  faceTitle.textContent = t.name;
  faceDesc.textContent = t.desc;
  faceEjemplo.textContent = t.ex;
  faceEjercicio.textContent = t.ej;
  catCounterEl.textContent = `${idx+1} / ${pool.length}`;
  updateDoneMark();

  const savedText = await loadEntry(t.id);
  padEl.value = savedText;
  padCount.textContent = savedText.length + ' caracteres';
  padStatus.textContent = savedText.trim().length>0 ? 'guardado' : 'sin guardar';
  padStatus.classList.toggle('saved', savedText.trim().length>0);
}

document.getElementById('prev').addEventListener('click', ()=>{
  idx = (idx - 1 + pool.length) % pool.length;
  renderCard();
});
document.getElementById('next').addEventListener('click', ()=>{
  idx = (idx + 1) % pool.length;
  renderCard();
});
document.getElementById('shuffle').addEventListener('click', shufflePool);

padEl.addEventListener('input', ()=>{
  const t = pool[idx];
  padCount.textContent = padEl.value.length + ' caracteres';
  padStatus.textContent = 'escribiendo…';
  padStatus.classList.remove('saved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await saveEntry(t.id, padEl.value);
    padStatus.textContent = padEl.value.trim().length>0 ? 'guardado' : 'sin guardar';
    padStatus.classList.toggle('saved', padEl.value.trim().length>0);
  }, 600);
});

(async function init(){
  await loadPracticedIds();
  selectCategory('apertura');
})();
</script>
</body>
