/* ============ 8 · COMUNICACIONES CON ESTUDIANTES ============ */
{
  id:"b8", nombre:"Comunicaciones con estudiantes", emoji:"🎒",
  desc:"Retroalimentación, instrucciones, guías, rúbricas y mensajes motivacionales.",
  tecnicas:[
    {id:"p71", nombre:"Retroalimentación constructiva",
     concepto:"La retroalimentación constructiva reconoce avances, describe dificultades con evidencias y propone caminos concretos. No califica a la persona, califica el trabajo.",
     ejemplo:"«Observo que ya usas conectores para unir ideas. Ahora podrías trabajar la puntuación de diálogos: revisa las comillas y las rayas en los textos del punto 3».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la retroalimentación.",
       texto:"«Observo que ya ___. Ahora podrías trabajar ___».",
       respuestas:[["usas conectores","mejoraste","avanzaste","comprendes la idea principal","escribes con claridad"],["la puntuacion","la puntuación","la ortografia","la ortografía","la estructura","los dialogos","los diálogos","la argumentacion","la argumentación"]],
       retro:"La retroalimentación reconoce avances, describe dificultades con evidencias y propone caminos concretos."}},

    {id:"p72", nombre:"Reconocimiento de logros",
     concepto:"El reconocimiento destaca un logro específico. Debe ser concreto, auténtico y personalizado. Refuerza la motivación y la autoestima.",
     ejemplo:"«Felicitaciones, Ana: tu participación en el debate sobre el medio ambiente mostró preparación y escucha atenta. Tus argumentos fueron sólidos y respetuosos».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el reconocimiento.",
       texto:"«Felicitaciones: tu ___ mostró ___ y ___».",
       respuestas:[["participacion","participación","trabajo","esfuerzo","desempeno","desempeño"],["preparacion","preparación","dedicacion","dedicación","esfuerzo","interes","interés"],["escucha atenta","respeto","claridad","creatividad","rigor"]],
       retro:"El reconocimiento concreto y personalizado refuerza la motivación. Se destaca un logro específico."}},

    {id:"p73", nombre:"Llamado de atención respetuoso",
     concepto:"El llamado de atención describe la conducta, cita la norma, expresa la expectativa y propone un compromiso. No descalifica a la persona.",
     ejemplo:"«Juan: en la clase de hoy interrumpiste en tres ocasiones. El manual de convivencia pide respetar el turno de palabra. Espero que mañana puedas escuchar y participar en el momento adecuado».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Respetuosa","Descalificadora"],
       items:[
         {texto:"«Interrumpiste en tres ocasiones».", cat:0},
         {texto:"«Eres un irrespetuoso».", cat:1},
         {texto:"«El manual pide respetar el turno».", cat:0},
         {texto:"«Nunca vas a cambiar».", cat:1},
         {texto:"«Espero que mañana puedas participar».", cat:0}
       ],
       retro:"El llamado de atención describe la conducta, cita la norma y propone un compromiso. Nunca descalifica."}},

    {id:"p74", nombre:"Instrucciones de tarea",
     concepto:"Las instrucciones deben ser claras, secuenciales y verificables. Se escribe qué hacer, cómo, con qué, cuándo y cómo se evaluará. Se evitan ambigüedades.",
     ejemplo:"«Tarea: 1) Lee el texto de las páginas 45-47. 2) Subraya las ideas principales. 3) Escribe un resumen de 10 líneas. 4) Entrega el lunes 22 en el cuaderno. Se evaluará la claridad y la ortografía».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la instrucción.",
       items:[
         "Qué hacer.",
         "Cómo hacerlo (pasos).",
         "Con qué materiales.",
         "Cuándo entregar.",
         "Cómo se evaluará."
       ],
       retro:"Las instrucciones claras indican qué, cómo, con qué, cuándo y cómo se evalúa."}},

    {id:"p75", nombre:"Guía de trabajo",
     concepto:"La guía de trabajo organiza actividades de aprendizaje. Incluye: objetivo, contenidos, actividades, recursos, tiempo y evaluación. Debe ser autosuficiente.",
     ejemplo:"«Guía N.º 3. Objetivo: identificar la idea principal de un texto. Contenidos: idea principal, ideas secundarias. Actividades: 1) leer; 2) subrayar; 3) responder. Recursos: texto impreso. Tiempo: 2 horas. Evaluación: rúbrica».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la guía.",
       items:[
         "Objetivo de aprendizaje.",
         "Contenidos.",
         "Actividades secuenciadas.",
         "Recursos y tiempo.",
         "Criterios de evaluación."
       ],
       retro:"La guía organiza el aprendizaje. Debe ser autosuficiente y clara."}},

    {id:"p76", nombre:"Rúbrica de evaluación",
     concepto:"La rúbrica describe niveles de desempeño y criterios. Permite evaluar de forma objetiva y transparente. Debe ser conocida por los estudiantes antes de la actividad.",
     ejemplo:"«Rúbrica del ensayo: Excelente (4.6-5.0): tesis clara, argumentos sólidos, buena ortografía. Bueno (4.0-4.5): tesis clara, argumentos regulares. Aceptable (3.0-3.9): tesis débil. Insuficiente (1.0-2.9): sin tesis».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la rúbrica.",
       texto:"La rúbrica describe niveles de ___ y ___ de evaluación. Debe ser conocida por los ___ antes de la actividad.",
       respuestas:[["desempeno","desempeño"],["criterios"],["estudiantes"]],
       retro:"La rúbrica hace transparente la evaluación. Los estudiantes deben conocerla antes de la actividad."}},

    {id:"p77", nombre:"Mensaje motivacional",
     concepto:"El mensaje motivacional reconoce el esfuerzo y anima a continuar. Debe ser breve, auténtico y concreto. No cae en frases vacías.",
     ejemplo:"«Sé que esta semana ha sido exigente. Valoro tu esfuerzo por no rendirte. Mañana seguimos, paso a paso».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el mensaje motivacional.",
       texto:"«Valoro tu ___ por no ___. Mañana seguimos, ___».",
       respuestas:[["esfuerzo","dedicacion","dedicación","trabajo"],["rendirte","abandonar","desistir","claudicar"],["paso a paso","juntos","con calma","con animo","con ánimo"]],
       retro:"El mensaje motivacional es breve, auténtico y concreto. Reconoce el esfuerzo y anima a continuar."}},

    {id:"p78", nombre:"Indicaciones para evaluación",
     concepto:"Las indicaciones para una evaluación informan qué se evaluará, cómo, con qué recursos, cuánto tiempo y qué se permite. Reducen la ansiedad y la incertidumbre.",
     ejemplo:"«Evaluación de comprensión lectora. Temas: idea principal, inferencias, vocabulario en contexto. Duración: 60 minutos. Recursos permitidos: diccionario. Se evaluará la comprensión, no la memoria».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las indicaciones.",
       texto:"«Temas: ___. Duración: ___ minutos. Recursos permitidos: ___».",
       respuestas:[["idea principal","comprension","comprensión","los temas vistos","los contenidos"],["60","45","90"],["diccionario","calculadora","ninguno"]],
       retro:"Las indicaciones reducen la ansiedad. Informan qué, cómo, cuándo y con qué recursos."}},

    {id:"p79", nombre:"Acompañamiento académico",
     concepto:"El acompañamiento ofrece apoyo adicional a estudiantes con dificultades. Se describe la situación, se proponen estrategias y se establece un plan con seguimiento.",
     ejemplo:"«Juan: hemos notado que la producción escrita te cuesta. Te propongo un plan: 1) taller de escritura los martes; 2) revisión conjunta de tus textos; 3) seguimiento cada dos semanas. ¿Te parece?».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el acompañamiento.",
       texto:"«Te propongo un plan: 1) taller de ___; 2) revisión ___ de tus textos; 3) seguimiento cada ___ semanas».",
       respuestas:[["escritura","lectura","matematicas","matemáticas"],["conjunta","periodica","periódica","guiada"],["dos","tres","2","3"]],
       retro:"El acompañamiento describe la situación, propone estrategias y establece plan con seguimiento."}},

    {id:"p80", nombre:"Cierre de período",
     concepto:"El cierre de período resume logros, dificultades y proyecciones. Se comparte con estudiantes. Tono reflexivo, orientado a la mejora continua.",
     ejemplo:"«Cerramos el segundo período. Avanzamos en comprensión lectora y trabajo en equipo. Nos queda pendiente la producción escrita. En el tercer período trabajaremos con más talleres de escritura. Gracias por su esfuerzo».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del cierre.",
       items:[
         "Resumen del período.",
         "Logros alcanzados.",
         "Dificultades pendientes.",
         "Proyecciones para el próximo período.",
         "Agradecimiento y ánimo."
       ],
       retro:"El cierre reflexiona sobre el período: logros, dificultades y proyecciones. Tono orientado a la mejora."}}
  ]
},

/* ============ 9 · ARGUMENTACIÓN PEDAGÓGICA ============ */
{
  id:"b9", nombre:"Argumentación pedagógica", emoji:"🧠",
  desc:"Tesis, evidencia, argumentación con familias, comités y propuestas de mejora.",
  tecnicas:[
    {id:"p81", nombre:"Tesis pedagógica",
     concepto:"La tesis es la afirmación central que se defiende. Debe ser discutible y sostenible con argumentos. En educación: «La evaluación formativa mejora el aprendizaje», «El juego es aprendizaje».",
     ejemplo:"«La evaluación formativa mejora el aprendizaje porque ofrece retroalimentación oportuna y permite ajustar la enseñanza».",
     ejercicio:{tipo:"fill",
       consigna:"Formula una tesis pedagógica.",
       texto:"«La ___ formativa mejora el aprendizaje porque ___».",
       respuestas:[["evaluacion","evaluación"],["ofrece retroalimentacion","ofrece retroalimentación","permite ajustar la ensenanza","permite ajustar la enseñanza","acompana el proceso","acompaña el proceso"]],
       retro:"La tesis es discutible y sostenible con argumentos. Organiza todo el texto."}},

    {id:"p82", nombre:"Argumentos con evidencia educativa",
     concepto:"Los argumentos pedagógicos se apoyan en evidencia: investigaciones educativas, datos del aula, referentes teóricos (Piaget, Vygotsky, Ausubel, Freire). Sin evidencia, la afirmación es solo opinión.",
     ejemplo:"«Según Vygotsky (1978), el aprendizaje se construye en interacción social. Los datos de nuestra aula muestran que los estudiantes que trabajan en pares mejoran un 20 % en comprensión».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el argumento.",
       texto:"«Según ___ (1978), el aprendizaje se construye en ___ social. Los datos muestran que los estudiantes que trabajan en ___ mejoran».",
       respuestas:[["vygotsky","Vygotsky"],["interaccion","interacción"],["pares","grupos","equipos"]],
       retro:"Los argumentos pedagógicos se apoyan en evidencia. Citar referentes refuerza el razonamiento."}},

    {id:"p83", nombre:"Argumentación con familias",
     concepto:"La argumentación con familias defiende una decisión o propuesta con razones claras, evidencia del proceso del estudiante y enfoque en el bienestar. Sin tecnicismos innecesarios.",
     ejemplo:"«Le proponemos acompañamiento adicional en lectura porque los datos muestran que Juan lee 40 palabras por minuto cuando el promedio del grado es 80. Con apoyo en casa y talleres, puede alcanzar el nivel esperado».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la argumentación.",
       texto:"«Le proponemos ___ adicional en ___ porque los datos muestran que ___».",
       respuestas:[["acompanamiento","acompañamiento","apoyo","refuerzo"],["lectura","escritura","matematicas","matemáticas"],["el estudiante necesita","juan lee menos","los datos muestran dificultad","el promedio esta bajo","el promedio está bajo"]],
       retro:"La argumentación con familias usa evidencia del proceso y enfoque en el bienestar. Sin tecnicismos innecesarios."}},

    {id:"p84", nombre:"Argumentación ante comités",
     concepto:"La argumentación ante comités (académico, convivencia, evaluación) exige formalidad, evidencia documental y fundamento normativo. Se citan normas del manual de convivencia o del SIEE.",
     ejemplo:"«Se propone al comité académico promover al estudiante al grado siguiente. Fundamento: el artículo 12 del SIEE establece la promoción anticipada. Evidencia: desempeño sobresaliente en todas las áreas y prueba de validación superada».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la argumentación.",
       texto:"«Se propone al comité ___ promover al estudiante. Fundamento: el artículo ___ del SIEE. Evidencia: ___».",
       respuestas:[["academico","académico","de evaluacion","de evaluación","de convivencia"],["12","numero","número"],["desempeno sobresaliente","desempeño sobresaliente","prueba superada","evidencias del proceso"]],
       retro:"La argumentación ante comités exige formalidad, evidencia documental y fundamento normativo."}},

    {id:"p85", nombre:"Refutación respetuosa",
     concepto:"La refutación reconoce la posición del otro y responde con razones. No descalifica a la persona. Se usa en reuniones docentes, comités y comunicaciones difíciles.",
     ejemplo:"«Entiendo su preocupación por la carga académica. Sin embargo, las actividades propuestas están articuladas con el plan de área y los DBA. Podemos revisar juntos los tiempos para ajustar lo necesario».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la refutación.",
       texto:"«Entiendo su ___ por ___. Sin embargo, ___ ».",
       respuestas:[["preocupacion","preocupación","posicion","posición","punto de vista"],["la carga academica","la carga académica","la evaluacion","la evaluación","los resultados","la metodologia","la metodología"],["las actividades estan articuladas","las actividades están articuladas","podemos revisar juntos","el plan esta organizado","el plan está organizado"]],

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_escolar_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panelInner");
  panel.innerHTML = "";

  const seal = el("div","panel-seal");
  const sealIn = el("div","panel-seal-inner", "COMUNIDAD\nEDUCATIVA");
  sealIn.style.whiteSpace = "pre-line";
  seal.appendChild(sealIn);
  panel.appendChild(seal);

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));
  panel.appendChild(head);
  panel.appendChild(el("div","rule"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");

    d.onclick = () => abrirTecnica(bt.id);

  panel.appendChild(dots);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","• Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Voltee la tarjeta para ver el ejemplo ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","• Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toque de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "Ejercicio interactivo <span>compruebe su comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "Cuaderno docente <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escriba aquí sus notas, ejemplos, redacciones propias, comunicaciones…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ Correcto" : "✗ Revise su respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Complete todos los huecos","Escriba una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ " + aciertos + " de " + total + " correctas" : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Su secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pase todos los elementos a la columna de la derecha.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ Secuencia correcta" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigne una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:11px;color:#8b1e1e;font-weight:700;letter-spacing:.4px;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ Clasificación correcta" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 6; ta.placeholder = "Redacte aquí su respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escriba primero su respuesta","Redacte al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compare su texto con el modelo: ¿qué ideas coinciden? ¿qué le falta? ¿qué aporta usted?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
