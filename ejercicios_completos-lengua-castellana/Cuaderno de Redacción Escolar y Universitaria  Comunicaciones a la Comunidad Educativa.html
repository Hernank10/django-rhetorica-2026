<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Escolar y Universitaria · Comunicaciones a la Comunidad Educativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0;
    --paper:#fdfaf3;
    --paper-2:#f7f2e8;
    --ink:#14213d;
    --navy:#14213d;
    --navy-dark:#0a1528;
    --navy-soft:#dde5f0;
    --bronze:#a67c52;
    --bronze-dark:#7c5c39;
    --bronze-soft:#f0e4d3;
    --bronze-line:#c9a96e;
    --muted:#6b6355;
    --line:#d8d2c3;
    --line-2:#b8af99;
    --ok:#2f6b3a;
    --ok-soft:#e0efe2;
    --bad:#8b1e1e;
    --bad-soft:#f8e0e0;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Public Sans",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 12% 0%, #f4f1ea 0%, transparent 55%), var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 22px;
    background:linear-gradient(180deg, #fdfaf3 0%, #f7f2e8 100%);
    border-bottom:3px double var(--navy);
    box-shadow:0 1px 0 var(--bronze-line) inset;
  }
  .brand{display:flex; align-items:center; gap:14px; min-width:0;}
  .seal{
    width:52px; height:52px; flex:0 0 auto;
    border-radius:50%; padding:3px;
    border:1.5px dashed var(--bronze);
    display:grid; place-items:center;
  }
  .seal-inner{
    width:100%; height:100%;
    border-radius:50%;
    border:1px solid var(--navy);
    display:grid; place-items:center;
    background:radial-gradient(circle, var(--paper) 60%, var(--bronze-soft) 100%);
    color:var(--navy);
    font-family:"PT Serif",Georgia,serif;
    font-weight:700; font-size:17px; letter-spacing:.5px;
    position:relative;
  }
  .seal-inner::before,
  .seal-inner::after{
    content:"★"; position:absolute; font-size:6px; color:var(--bronze);
  }
  .seal-inner::before{top:5px; left:50%; transform:translateX(-50%);}
  .seal-inner::after{bottom:5px; left:50%; transform:translateX(-50%);}
  .brand h1{
    font-family:"PT Serif",Georgia,serif;
    font-size:16px; margin:0; font-weight:700; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--navy);
  }
  .brand p{
    margin:2px 0 0; font-size:11px; color:var(--muted);
    font-weight:600; letter-spacing:.6px; text-transform:uppercase;
  }
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}
  .progress-wrap{
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:var(--muted); font-weight:700;
    letter-spacing:.4px; text-transform:uppercase;
  }
  .progress-bar{width:140px; height:6px; border:1px solid var(--line-2); background:#f0ece0; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg, var(--navy), var(--bronze)); transition:width .4s;}
  .btn{
    font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    padding:8px 14px; cursor:pointer;
    border:1px solid var(--navy); background:var(--paper); color:var(--navy);
    transition:.16s;
  }
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy); color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent; border-color:var(--line-2); color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc; color:var(--navy);}
  .only-mobile{display:none;}
  .layout{display:grid; grid-template-columns:320px 1fr; gap:22px; max-width:1400px; margin:0 auto; padding:22px; align-items:start;}
  .sidebar{
    position:sticky; top:92px;
    max-height:calc(100vh - 116px); overflow-y:auto;
    background:var(--paper); border:1px solid var(--navy);
    padding:4px; box-shadow:var(--shadow);
  }
  .sidebar-inner{
    border:1px solid var(--bronze-line); padding:12px;
    background:linear-gradient(180deg, #fdfaf3 0%, #f7f2e8 100%);
  }
  #search{
    width:100%; font-size:12px;
    padding:9px 11px; border:1px solid var(--line-2);
    background:var(--paper); color:var(--ink); outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--navy);}
  .cat{margin-bottom:4px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:9px 10px;
    font-size:11.5px; font-weight:700; letter-spacing:.4px; color:var(--navy);
    text-transform:uppercase;
    border-left:3px solid transparent;
  }
  .cat-head:hover{background:var(--navy-soft); border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto; font-size:9px; color:var(--bronze); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:"PT Serif",Georgia,serif; font-size:11px; font-weight:700;
    background:var(--bronze-soft); color:var(--bronze-dark);
    padding:1px 7px; border:1px solid var(--bronze-line);
  }
  .cat-bar{height:3px; background:#e8e2d2; margin:0 10px 6px; overflow:hidden; border:1px solid var(--line);}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--navy), var(--bronze)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:10.5px; color:var(--muted); padding:0 10px 8px; line-height:1.5; font-style:italic;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:11.5px; line-height:1.4; color:#3a3a3a;
    padding:7px 10px; border-left:3px solid transparent;
  }
  .tech-link:hover{background:var(--bronze-soft); border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft); border-left-color:var(--navy); color:var(--navy-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:13px; height:13px; margin-top:1px;
    border:1px solid var(--line-2); background:var(--paper);
    display:grid; place-items:center; font-size:8px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}
  .panel{background:var(--paper); border:1px solid var(--navy); padding:6px; position:relative; box-shadow:var(--shadow);}
  .panel-inner{
    border:1px solid var(--bronze-line);
    padding:26px 30px 30px;
    background:radial-gradient(circle at 100% 0%, #f7f2e8 0%, transparent 40%), var(--paper);
    position:relative;
  }
  .panel-seal{
    position:absolute; top:18px; right:22px;
    width:70px; height:70px; border-radius:50%;
    border:1.5px dashed var(--bronze); padding:3px; opacity:.75;
  }
  .panel-seal-inner{
    width:100%; height:100%; border-radius:50%;
    border:1px solid var(--navy);
    display:grid; place-items:center;
    color:var(--navy);
    font-family:"PT Serif",Georgia,serif;
    font-weight:700; font-size:10px; text-align:center; line-height:1.1;
  }
  .tech-head{margin-bottom:20px; padding-right:90px;}
  .badge{
    display:inline-block; font-size:10px; font-weight:800;
    letter-spacing:1.4px; text-transform:uppercase;
    color:var(--bronze-dark); background:var(--bronze-soft);
    border:1px solid var(--bronze-line);
    padding:3px 10px; margin-bottom:12px;
  }
  .tech-head h2{
    margin:0;
    font-family:"PT Serif",Georgia,serif;
    font-size:26px; line-height:1.2; letter-spacing:-.3px;
    font-weight:700; color:var(--navy);
  }
  .tech-pos{
    font-size:11px; color:var(--muted); margin-top:6px;
    font-weight:600; letter-spacing:.6px; text-transform:uppercase;
  }
  .rule{
    height:3px;
    border-top:1px solid var(--navy);
    border-bottom:1px solid var(--bronze-line);
    margin:16px 0 20px;
  }
  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{width:11px; height:11px; border:1px solid var(--line-2); background:var(--paper); cursor:pointer; transition:.15s;}
  .bdot:hover{transform:scale(1.2); border-color:var(--bronze);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{background:var(--bronze); border-color:var(--bronze-dark);}
  .flashcard{
    perspective:1600px; margin:0 0 14px; cursor:pointer;
    border:1px solid var(--navy); padding:4px;
    background:var(--paper); box-shadow:var(--shadow);
  }
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
    border:1px solid var(--bronze-line);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    padding:22px 26px;
    display:flex; flex-direction:column; overflow:auto;
    background:var(--paper);
    background-image:linear-gradient(transparent 27px, rgba(20,33,61,.06) 27px 28px);
    background-size:100% 28px; background-position:0 14px;
  }
  .fc-face p{margin:0; font-family:"PT Serif",Georgia,serif; font-size:15.5px; line-height:28px; color:var(--ink);}
  .fc-back{transform:rotateY(180deg); background:#faf6ec;}
  .fc-back p{color:var(--navy-dark); font-style:italic;}
  .fc-tag{
    font-size:10px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--bronze-dark); margin-bottom:12px; display:block;
    padding-bottom:6px; border-bottom:1px solid var(--bronze-line);
  }
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:10.5px; color:#9c907c; font-weight:600;
    letter-spacing:.5px; text-transform:uppercase;
  }
  .flip-btn{margin:0 0 26px;}
  .sec-title{
    display:flex; align-items:center; gap:10px;
    font-family:"PT Serif",Georgia,serif;
    font-size:16px; font-weight:700; color:var(--navy);
    margin:0 0 12px; padding-bottom:8px;
    border-bottom:1px solid var(--navy);
    position:relative;
  }
  .sec-title::after{
    content:""; position:absolute; left:0; right:0; bottom:-3px; height:1px;
    background:var(--bronze-line);
  }
  .sec-title span{
    font-size:10px; font-weight:700; color:var(--muted);
    margin-left:auto; letter-spacing:.6px; text-transform:uppercase;
  }
  .consigna{
    font-family:"PT Serif",Georgia,serif;
    font-size:15px; line-height:1.6; color:var(--ink);
    background:var(--paper-2); border-left:3px solid var(--bronze);
    padding:12px 16px; margin:0 0 16px;
  }
  .opciones{display:flex; flex-direction:column; gap:8px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:13.5px; line-height:1.5;
    background:var(--paper); border:1px solid var(--line-2);
    color:var(--ink); padding:12px 14px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--navy); background:var(--navy-soft);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:22px; height:22px;
    background:var(--paper-2); color:var(--muted);
    border:1px solid var(--line-2);
    display:grid; place-items:center;
    font-family:"PT Serif",Georgia,serif; font-size:12px; font-weight:700;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff; border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff; border-color:var(--bad);}
  .fill-texto{font-family:"PT Serif",Georgia,serif; font-size:16px; line-height:2.4; margin:0 0 16px; color:var(--ink);}
  .hueco{
    font:inherit; font-family:"PT Serif",Georgia,serif;
    font-size:15px; font-style:italic;
    border:none; border-bottom:1.5px solid var(--bronze);
    background:transparent; color:var(--bronze-dark); font-weight:700;
    padding:2px 6px; min-width:110px; text-align:center; outline:none;
  }
  .hueco:focus{background:var(--bronze-soft); border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}
  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .order-col h4{font-size:10px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; color:var(--muted); margin:0 0 8px;}
  .pool, .seq{min-height:120px; padding:8px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:var(--paper-2); border:1px dashed var(--line-2);}
  .seq{background:#f4efe2; border:1px solid var(--bronze-line);}
  .pool:empty::after, .seq:empty::after{content:"···"; color:#c9c2b2; font-size:16px; text-align:center; margin:auto; letter-spacing:4px;}
  .ord-item{
    font:inherit; font-size:12.5px; line-height:1.4; text-align:left;
    background:var(--paper); border:1px solid var(--line-2);
    padding:9px 11px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:8px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--navy); background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{
    flex:0 0 auto; width:18px; height:18px;
    background:var(--navy); color:var(--paper);
    display:grid; place-items:center;
    font-family:"PT Serif",Georgia,serif; font-size:11px; font-weight:700;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}
  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line-2);
    padding:11px 13px; margin-bottom:8px;
  }
  .cl-item p{margin:0; font-family:"PT Serif",Georgia,serif; font-size:14px; line-height:1.5; flex:1 1 260px;}
  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .chip{
    font-size:10.5px; font-weight:700; letter-spacing:.4px;
    padding:5px 10px; cursor:pointer;
    border:1px solid var(--line-2); background:var(--paper-2); color:var(--muted);
    transition:.14s; text-transform:uppercase;
  }
  .chip:hover{border-color:var(--navy); color:var(--navy);}
  .chip.sel{background:var(--navy); border-color:var(--navy); color:var(--paper);}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}
  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:#4a4a4a; line-height:1.55;}
  .criterios input{margin-top:2px; accent-color:var(--navy); width:15px; height:15px; flex:0 0 auto;}
  textarea{
    width:100%; font-family:"PT Serif",Georgia,serif;
    font-size:15px; line-height:26px; color:var(--ink);
    padding:12px 16px;
    border:1px solid var(--bronze-line);
    background-color:#fdfaf3;
    background-image:linear-gradient(transparent 25px, rgba(20,33,61,.07) 25px 26px);
    background-size:100% 26px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--navy); box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e; font-style:italic;}
  .feedback{margin-top:16px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s; border-left:3px solid transparent;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border-left-color:var(--ok); color:#1d4526;}
  .feedback.mal{background:var(--bad-soft); border-left-color:var(--bad); color:#5c1414;}
  .feedback.info{background:var(--bronze-soft); border-left-color:var(--bronze); color:#5a3f22;}
  .feedback strong{display:block; font-size:11px; letter-spacing:1.1px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-family:"PT Serif",Georgia,serif; font-size:14.5px; line-height:1.6;}
  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px;}
  .modelo{
    display:none; margin-top:14px;
    background:var(--paper-2); border-left:3px solid var(--navy);
    padding:13px 16px;
    font-family:"PT Serif",Georgia,serif;
    font-size:14.5px; line-height:1.65; color:var(--navy-dark);
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--navy); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
  .cuaderno{margin-top:32px; padding-top:22px; border-top:1px solid var(--navy); position:relative;}
  .cuaderno::before{content:""; position:absolute; left:0; right:0; top:2px; height:1px; background:var(--bronze-line);}
  .cuaderno-foot{
    display:flex; justify-content:space-between; align-items:center;
    font-size:10.5px; color:var(--muted); margin-top:8px;
    font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  }
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--bronze-line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}
  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:320px; max-height:100vh;
      z-index:100; padding:4px;
      transform:translateX(-105%); transition:transform .28s ease;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(20,33,61,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel-inner{padding:20px 18px 24px;}
    .panel-seal{display:none;}
    .tech-head h2{font-size:20px;}
    .tech-head{padding-right:0;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
    .brand h1{font-size:13.5px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="seal"><div class="seal-inner">EDU</div></div>
    <div>
      <h1>Cuaderno de Redacción Escolar y Universitaria</h1>
      <p>Comunicaciones a la Comunidad Educativa · 100 técnicas</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-inner">
      <input id="search" type="search" placeholder="Buscar técnica…" autocomplete="off">
      <nav id="menu"></nav>
    </div>
  </aside>
  <main class="main">
    <article id="panel" class="panel">
      <div class="panel-inner" id="panelInner"></div>
    </article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN ESCOLAR Y UNIVERSITARIA · 10 BLOQUES
   ===================================================================== */
const CATEGORIAS = [

/* ============ 1 · SINTAXIS PEDAGÓGICA ============ */
{
  id:"b1", nombre:"Sintaxis pedagógica", emoji:"✎",
  desc:"Orden, concordancia, longitud y claridad en comunicaciones escolares.",
  tecnicas:[
    {id:"p1", nombre:"Orden lógico SVO",
     concepto:"En circulares, cartas y comunicados, el orden Sujeto + Verbo + Objeto garantiza lectura clara. Alterarlo (hipérbaton) puede confundir a familias y estudiantes.",
     ejemplo:"Correcto: «La coordinación convoca a reunión de padres». Incorrecto: «A reunión de padres, la coordinación, convoca».",
     ejercicio:{tipo:"fill",
       consigna:"Reordena según el orden lógico.",
       texto:"Palabras: «la institución / la circular / envió» → «La institución ___ la circular».",
       respuestas:[["envio","envió"]],
       retro:"El orden SVO es la base de la claridad. Las familias comprenden mejor las comunicaciones directas."}},

    {id:"p2", nombre:"Oraciones cortas en comunicaciones escolares",
     concepto:"Las comunicaciones escolares deben usar oraciones de 15-20 palabras. Las familias leen rápido, a veces en el celular. Las oraciones largas se dividen.",
     ejemplo:"En lugar de 40 palabras con tres subordinadas: «La reunión será el viernes. Se realizará a las 3:00 p.m. Es obligatoria la asistencia de un acudiente».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la longitud recomendada de oración en una circular?",
       opciones:["Hasta 45 palabras","Entre 15 y 20 palabras","Al menos 30 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas son esenciales en comunicaciones escolares. Se leen rápido y se comprenden mejor."}},

    {id:"p3", nombre:"Concordancia sujeto-verbo",
     concepto:"La concordancia es obligatoria. Los errores restan credibilidad a la institución y dificultan la comprensión. Revisar al final es un deber del docente que escribe.",
     ejemplo:"Incorrecto: «Los estudiantes del grado sexto asistió a la jornada». Correcto: «Los estudiantes del grado sexto asistieron a la jornada».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la concordancia.",
       texto:"«Los docentes y directivos participó en la jornada» → «Los docentes y directivos ___ en la jornada».",
       respuestas:[["participaron","participo","participó"]],
       retro:"El sujeto compuesto exige verbo en plural. La concordancia es señal de rigor profesional."}},

    {id:"p4", nombre:"Voz activa en la atribución institucional",
     concepto:"La voz activa identifica quién realiza la acción: rector, coordinador, docente, consejo. En comunicaciones oficiales esto es esencial para que las familias sepan a quién dirigirse.",
     ejemplo:"Activa: «La rectora autorizó la salida». Pasiva: «La salida fue autorizada». La primera identifica al responsable.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"El coordinador convocó a reunión.", cat:0},
         {texto:"La reunión fue convocada.", cat:1},
         {texto:"La docente entregó los informes.", cat:0},
         {texto:"Los informes fueron entregados.", cat:1},
         {texto:"El consejo aprobó la propuesta.", cat:0}
       ],
       retro:"La voz activa identifica responsables. En comunicaciones oficiales, esto facilita la interlocución."}},

    {id:"p5", nombre:"Evitar el gerundio de posterioridad",
     concepto:"El gerundio de posterioridad («se realizó la jornada, asistiendo 200 estudiantes») es incorrecto. Se sustituye por coordinación o subordinación causal. En comunicaciones formales es exigencia.",
     ejemplo:"Incorrecto: «Se envió la circular, recibiendo respuesta de las familias». Correcto: «Se envió la circular y las familias respondieron».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por verbo conjugado.",
       texto:"«Se realizó la reunión, asistiendo 80 familias» → «Se realizó la reunión y ___ 80 familias».",
       respuestas:[["asistieron","asistio","asistió"]],
       retro:"El gerundio de posterioridad es incorrecto en la norma culta. Se sustituye por coordinación."}},

    {id:"p6", nombre:"Subordinación mínima",
     concepto:"El exceso de subordinación produce frases ilegibles. En comunicaciones a familias, se prefiere dividir en oraciones simples. La claridad supera a la elegancia.",
     ejemplo:"En lugar de una oración de 60 palabras con cuatro subordinadas: «La salida será el 15 de mayo. El punto de encuentro es la portería. La hora es 7:00 a.m.».",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos.",
       texto:"«El estudiante que fue elegido que representará al curso viajará a la final» → «El estudiante fue elegido. ___ al curso en la final».",
       respuestas:[["representara","representará"]],
       retro:"La subordinación excesiva oscurece. Se prefiere dividir en oraciones simples."}},

    {id:"p7", nombre:"Coordinación en enumeraciones escolares",
     concepto:"En circulares, actas y comunicados, la coordinación enumera sin subordinar. Se usan conectores: «y», «o», «e», «ni». El último elemento se une con «y» sin coma previa.",
     ejemplo:"«Se entregarán: uniformes, útiles, libros y materiales didácticos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector.",
       categorias:["Copulativa","Disyuntiva","Adversativa"],
       items:[
         {texto:"y", cat:0},
         {texto:"o", cat:1},
         {texto:"e", cat:0},
         {texto:"pero", cat:2},
         {texto:"ni", cat:0}
       ],
       retro:"La copulativa suma; la disyuntiva presenta alternativas; la adversativa opone."}},

    {id:"p8", nombre:"Párrafos: una idea por párrafo",
     concepto:"En comunicaciones escolares, cada párrafo desarrolla una idea. Mezclar temas confunde a las familias. Especialmente en circulares y cartas extensas.",
     ejemplo:"Párrafo 1: motivo de la reunión. Párrafo 2: fecha y hora. Párrafo 3: qué deben traer los acudientes.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuántas ideas principales debe contener cada párrafo?",
       opciones:["Todas las relacionadas","Una sola idea principal","Al menos tres","No importa"],
       correcta:1,
       retro:"Un párrafo = una idea. En comunicaciones escolares, esto garantiza comprensión rápida."}},

    {id:"p9", nombre:"Anáfora y referencia clara",
     concepto:"Los pronombres deben remitir inequívocamente a su antecedente. En comunicaciones con varios sujetos (estudiante, familia, docente, institución), la ambigüedad confunde.",
     ejemplo:"Ambiguo: «El docente informó al acudiente que su hijo había mejorado». ¿«Su» = del docente o del acudiente? Correcto: «...que el hijo del acudiente había mejorado».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad.",
       texto:"«La coordinadora le dijo a la madre que su hijo debía asistir» → «La coordinadora le dijo a la madre que el hijo de la ___ debía asistir».",
       respuestas:[["madre"]],
       retro:"La referencia debe ser inequívoca. Las familias deben comprender sin dudas a quién se refiere el texto."}},

    {id:"p10", nombre:"Perífrasis y rodeos innecesarios",
     concepto:"Fórmulas como «cúmpleme manifestar», «por medio de la presente me permito», «en su momento oportuno» ocupan espacio sin aportar información. El lenguaje claro las elimina.",
     ejemplo:"En lugar de «Por medio de la presente me permito comunicar a usted que», se escribe: «Le comunico que».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye la perífrasis por forma directa.",
       texto:"«Cúmpleme manifestar a usted que la reunión fue aplazada» → «Le ___ que la reunión fue aplazada».",
       respuestas:[["informo","comunico","manifiesto"]],
       retro:"El lenguaje claro exige evitar perífrasis vacías. Las familias agradecen comunicaciones directas."}}
  ]
},

/* ============ 2 · PUNTUACIÓN EN COMUNICACIONES ============ */
{
  id:"b2", nombre:"Puntuación en comunicaciones", emoji:"¶",
  desc:"Coma, punto y coma, dos puntos, comillas y paréntesis en textos escolares.",
  tecnicas:[
    {id:"p11", nombre:"Coma en enumeraciones",
     concepto:"La coma separa elementos de una enumeración. En comunicaciones escolares es frecuente: útiles, fechas, actividades. El último se une con «y» u «o» sin coma previa.",
     ejemplo:"«Los estudiantes deben traer cartuchera, cuaderno, colores y regla».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca las comas.",
       texto:"«Se entregarán uniformes libros y útiles» → «Se entregarán uniformes___ libros___ y útiles».",
       respuestas:[[","],[","]],
       retro:"Los elementos de la enumeración se separan con coma; el último se une con «y» sin coma previa."}},

    {id:"p12", nombre:"Coma del vocativo",
     concepto:"En cartas, circulares y comunicados, el vocativo se separa con coma: «Apreciadas familias», «Estimados estudiantes», «Señor acudiente». Su omisión es error frecuente.",
     ejemplo:"«Apreciadas familias, la reunión será el viernes». «Estimados estudiantes, recuerden traer los materiales».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma del vocativo.",
       texto:"«Apreciadas familias___ la reunión será el viernes».",
       respuestas:[[","]],
       retro:"El vocativo se separa con coma. Es error frecuente en comunicaciones escolares."}},

    {id:"p13", nombre:"Punto y coma en listas complejas",
     concepto:"Cuando los elementos de una lista contienen incisos con coma, se separan con punto y coma. Frecuente en actas y circulares con datos entre paréntesis.",
     ejemplo:"«Se revisaron: asistencia (95 %), aprobación (88 %), participación en actividades (90 %); se acordó reforzar el segundo indicador».",
     ejercicio:{tipo:"fill",
       consigna:"Separa con punto y coma.",
       texto:"«Asistencia (95 %) aprobación (88 %)___ participación (90 %)».",
       respuestas:[[";"]],
       retro:"En listas con incisos internos, se usa punto y coma. Facilita la lectura."}},

    {id:"p14", nombre:"Dos puntos antes de listas y aclaraciones",
     concepto:"Los dos puntos anuncian enumeración, aclaración o consecuencia. Frecuente en circulares: «Se acuerda: 1) ...». Después de los dos puntos, minúscula si es enumeración breve; mayúscula si es cita o fórmula.",
     ejemplo:"«Los objetivos son los siguientes: comprender, analizar, aplicar». «El rector RESUELVE: Primero. Aprobar...».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca los dos puntos.",
       texto:"«Los objetivos son los siguientes___ comprender, analizar, aplicar».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian enumeración o aclaración. Se escriben sin espacio antes y con espacio después."}},

    {id:"p15", nombre:"Punto y aparte",
     concepto:"El punto y aparte cierra un párrafo. En comunicaciones escolares, cada sección se separa: encabezado, motivo, información, cierre. Facilita la lectura.",
     ejemplo:"Encabezado termina en punto y aparte. Motivo comienza en nuevo párrafo. Información detallada igualmente.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte?",
       opciones:["Al terminar una oración","Al terminar una sección o párrafo","Al citar una norma","Al enumerar"],
       correcta:1,
       retro:"El punto y aparte separa secciones. En comunicaciones escolares, organiza la información."}},

    {id:"p16", nombre:"Paréntesis para aclaraciones",
     concepto:"Los paréntesis encierran aclaraciones, fechas, siglas o datos complementarios. Frecuentes en circulares: «Reunión (jornada única)», «PEI (Proyecto Educativo Institucional)».",
     ejemplo:"«La reunión será el 15 de julio (viernes) a las 3:00 p.m.». «El PEI (Proyecto Educativo Institucional) se actualizará».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde correspondan.",
       texto:"«La reunión será el 15 de julio ___viernes___ a las 3:00 p.m.».",
       respuestas:[["("],[")",""]],
       retro:"Los paréntesis encierran información complementaria sin interrumpir el texto principal."}},

    {id:"p17", nombre:"Comillas en citas y términos",
     concepto:"Las comillas encierran citas textuales, títulos de obras, términos específicos o usos irónicos. Frecuentes en circulares: títulos de proyectos, expresiones del PEI.",
     ejemplo:"«Se implementará el proyecto “Leer para crecer”». «El programa “Todos a aprender” cumple 10 años».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«Se implementará el proyecto ___Leer para crecer___».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran títulos de proyectos, citas y términos específicos."}},

    {id:"p18", nombre:"Guion y raya",
     concepto:"El guion (-) une palabras compuestas: «enseñanza-aprendizaje», «teórico-práctico». La raya (—) introduce aclaraciones o diálogos en transcripciones.",
     ejemplo:"«El proceso de enseñanza-aprendizaje continúa». «El rector —quien presidió la reunión— anunció el cambio».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso del signo.",
       categorias:["Guion (-)","Raya (—)"],
       items:[
         {texto:"enseñanza-aprendizaje", cat:0},
         {texto:"teórico-práctico", cat:0},
         {texto:"—dijo el rector—", cat:1},
         {texto:"cívico-cultural", cat:0},
         {texto:"—respondió el docente—", cat:1}
       ],
       retro:"El guion une; la raya aísla aclaraciones o intervenciones en transcripciones."}},

    {id:"p19", nombre:"Punto y seguido",
     concepto:"El punto y seguido separa oraciones dentro del mismo párrafo. Cada oración debe tener sentido completo. En comunicaciones breves, facilita la lectura rápida.",
     ejemplo:"«La reunión será el viernes. Se realizará a las 3:00 p.m. Es obligatoria la asistencia de un acudiente».",
     ejercicio:{tipo:"fill",
       consigna:"Separa las oraciones con punto y seguido.",
       texto:"«La reunión será el viernes___ Se realizará a las 3:00 p.m.___»",
       respuestas:[["."],["."]],
       retro:"El punto y seguido separa oraciones. Después se escribe mayúscula."}},

    {id:"p20", nombre:"Signos de interrogación en consignas y encuestas",
     concepto:"Los signos de interrogación enmarcan preguntas. Frecuentes en consignas para estudiantes, encuestas a familias, cuestionarios. En español se abren (¿) y se cierran (?).",
     ejemplo:"«¿Cuál es la idea principal del texto?». «¿Considera adecuada la comunicación de la institución?».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca los signos de interrogación.",
       texto:"«___Considera adecuada la comunicación de la institución___»",
       respuestas:[["¿"],["?"]],
       retro:"En español los signos son dobles: se abren (¿) y se cierran (?). Es diferencia frente al inglés."}}
  ]
},

/* ============ 3 · ORTOGRAFÍA Y NORMATIVA AVANZADA ============ */
{
  id:"b3", nombre:"Ortografía y normativa avanzada", emoji:"✓",
  desc:"Dequeísmo, queísmo, laísmo/leísmo, mayúsculas y tildes diacríticas.",
  tecnicas:[
    {id:"p21", nombre:"Dequeísmo",
     concepto:"El dequeísmo es usar «de que» cuando el verbo no exige la preposición. Verbos como «pensar», «creer», «considerar», «opinar» rigen «que», no «de que». Error frecuente en comunicaciones escolares.",
     ejemplo:"Incorrecto: «Considero de que la reunión fue exitosa». Correcto: «Considero que la reunión fue exitosa». Correcto con «de»: «Me alegro de que haya asistido».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina el dequeísmo.",
       texto:"«Pienso de que el proyecto beneficiará a los estudiantes» → «Pienso ___ el proyecto beneficiará a los estudiantes».",
       respuestas:[["que"]],
       retro:"«Pensar» rige «que», no «de que». El dequeísmo es error sancionado en la norma culta."}},

    {id:"p22", nombre:"Queísmo",
     concepto:"El queísmo es el error inverso: omitir «de» cuando el verbo la exige. Verbos como «darse cuenta», «acordarse», «alegrarse», «estar seguro» rigen «de que».",
     ejemplo:"Incorrecto: «Me di cuenta que faltaban útiles». Correcto: «Me di cuenta de que faltaban útiles». Correcto: «Estoy seguro de que...».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el queísmo.",
       texto:"«Estoy seguro que la actividad será exitosa» → «Estoy seguro ___ que la actividad será exitosa».",
       respuestas:[["de"]],
       retro:"«Estar seguro» rige «de que». El queísmo es tan grave como el dequeísmo."}},

    {id:"p23", nombre:"Laísmo, leísmo y loísmo",
     concepto:"El laísmo usa «la/las» como complemento indirecto. El leísmo, «le» como complemento directo de cosa (no aceptado). El loísmo, «lo» como indirecto. La norma culta los rechaza.",
     ejemplo:"Laísmo: «La dije a la docente que esperara». Correcto: «Le dije a la docente que esperara». Leísmo aceptado: «Le vi ayer» (a él, persona masculina).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso pronominal.",
       categorias:["Correcto","Laísmo","Loísmo"],
       items:[
         {texto:"Le entregué el informe a la coordinadora.", cat:0},
         {texto:"La entregué el informe a la coordinadora.", cat:1},
         {texto:"Le dije a la familia que viniera.", cat:0},
         {texto:"Lo entregué la circular al rector.", cat:2},
         {texto:"Le envié la carta al acudiente.", cat:0}
       ],
       retro:"El laísmo y el loísmo son errores. La norma culta exige le/les para complemento indirecto."}},

    {id:"p24", nombre:"Mayúsculas en instituciones educativas",
     concepto:"Los nombres oficiales de instituciones llevan mayúscula: Ministerio de Educación Nacional, Institución Educativa San Juan, Universidad Nacional. Los genéricos van en minúscula: colegio, escuela, universidad.",
     ejemplo:"«La Institución Educativa San Juan convoca a reunión». «El colegio abrirá sus puertas». «La Universidad Nacional publicó el estudio».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«La Institución Educativa San Juan convoca»,", cat:0},
         {texto:"«La Institución Educativa san juan convoca»,", cat:1},
         {texto:"«El colegio abrirá sus puertas»,", cat:0},
         {texto:"«El Colegio abrirá sus puertas»,", cat:1},
         {texto:"«La Universidad Nacional publicó»,", cat:0}
       ],
       retro:"Los nombres oficiales completos llevan mayúscula. Los comunes van en minúscula."}},

    {id:"p25", nombre:"Mayúsculas en cargos docentes",
     concepto:"Los cargos van en minúscula cuando acompañan al nombre: «el rector Gómez», «la coordinadora Ruiz». En vocativo directo llevan mayúscula: «Señor Rector», «Señora Coordinadora».",
     ejemplo:"«El rector Gómez firmó la circular». «Señor Rector, me permito informarle». «La docente Martínez asistió».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"El rector Gómez firmó.", cat:0},
         {texto:"El Rector Gómez firmó.", cat:1},
         {texto:"Señor Rector, me permito...", cat:0},
         {texto:"La Docente Martínez asistió.", cat:1},
         {texto:"Señora Coordinadora, adjunto...", cat:0}
       ],
       retro:"Los cargos en minúscula junto al nombre; en mayúscula como vocativo."}},

    {id:"p26", nombre:"Tilde diacrítica",
     concepto:"Distingue funciones: él/el, sí/si, más/mas, té/te, dé/de, sé/se, aún/aun. Errores frecuentes en comunicaciones escolares.",
     ejemplo:"«Él es docente» / «El docente llegó». «Sí, acepta» / «Si acepta, firme». «Aún no llega» / «Aun así, procede».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"___ docente llegó (él/el). · Quiero ___ de aromáticas (té/te). · ___ no ha llegado (aún/aun).",
       respuestas:[["el","él"],["te","té"],["aun","aún"]],
       retro:"La tilde diacrítica distingue funciones. En comunicaciones oficiales es exigencia formal."}},

    {id:"p27", nombre:"Tildes en términos pedagógicos",
     concepto:"Los términos pedagógicos siguen las reglas generales: evaluación, didáctica, pedagógico, currículo, metodología, práctica, diagnóstico. Errores frecuentes: «evaluacion», «curriculo», «practicas».",
     ejemplo:"«Evaluación», «currículo», «didáctica», «pedagógico», «metodología», «práctica». Todas llevan tilde según su tipo.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada palabra.",
       categorias:["Esdrújula","Grave","Aguda"],
       items:[
         {texto:"pedagógico", cat:0},
         {texto:"currículo", cat:0},
         {texto:"evaluación", cat:2},
         {texto:"práctica", cat:0},
         {texto:"metodología", cat:2}
       ],
       retro:"Los términos pedagógicos siguen las reglas generales. Esdrújulas siempre llevan tilde."}},

    {id:"p28", nombre:"A ver / haber",
     concepto:"«A ver» es preposición + verbo (mirar, comprobar). «Haber» es verbo auxiliar o infinitivo. Confundirlos es error frecuente en comunicaciones informales.",
     ejemplo:"Correcto: «Vamos a ver los resultados». Correcto: «Debe haber asistencia». Incorrecto: «Vamos haber los resultados».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con «a ver» o «haber».",
       texto:"«Vamos ___ los informes» · «Debe ___ asistencia» · «Esperamos ___ terminado»",
       respuestas:[["a ver"],["haber"],["haber"]],
       retro:"«A ver» es preposición + verbo; «haber» es auxiliar o infinitivo. La confusión resta seriedad."}},

    {id:"p29", nombre:"Porque / por qué / porqué / por que",
     concepto:"Cuatro formas: «porque» (causa), «por qué» (interrogativo), «porqué» (sustantivo), «por que» (relativo). Es esencial distinguirlas en comunicaciones formales.",
     ejemplo:"«No asistió porque estaba enfermo». «¿Por qué no asistió?». «Se desconoce el porqué de su inasistencia». «La razón por que no asistió».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"No asistió ___ estaba enfermo (porque). · ¿___ no asistió? (Por qué). · Se desconoce el ___ (porqué).",
       respuestas:[["porque"],["por que","por qué"],["porque","porqué"]],
       retro:"Cada forma tiene función propia. La confusión es error frecuente."}},

    {id:"p30", nombre:"Siglas educativas colombianas",
     concepto:"Siglas del sistema educativo colombiano: MEN (Ministerio de Educación Nacional), PEI (Proyecto Educativo Institucional), ICFES, SIMAT, SIEE (Sistema Institucional de Evaluación de Estudiantes), PMI (Plan de Mejoramiento Institucional). Se escriben sin puntos y en mayúsculas.",
     ejemplo:"«El MEN publicó los lineamientos». «El PEI se articula con el PMI». «El SIEE se actualizará este año».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el significado.",
       texto:"PEI = Proyecto ___ Institucional · SIEE = Sistema Institucional de ___ de Estudiantes · MEN = Ministerio de ___ Nacional",
       respuestas:[["educativo"],["evaluacion","evaluación"],["educacion","educación"]],
       retro:"Las siglas educativas se definen la primera vez. Son esenciales en comunicaciones institucionales."}}
  ]
},

/* ============ 4 · VICIOS DEL LENGUAJE Y CLARIDAD ============ */
{
  id:"b4", nombre:"Vicios del lenguaje y claridad", emoji:"⚠",
  desc:"Pleonasmo, anfibología, cosismo, muletillas y claridad en comunicaciones escolares.",
  tecnicas:[
    {id:"p31", nombre:"Pleonasmo o redundancia",
     concepto:"El pleonasmo repite ideas innecesariamente: «subir arriba», «salir afuera», «lo vi con mis propios ojos». En comunicaciones escolares resta credibilidad y ocupa espacio.",
     ejemplo:"Incorrecto: «El estudiante subió arriba al salón». Correcto: «El estudiante subió al salón». Incorrecto: «Lo vi personalmente con mis propios ojos».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la redundancia.",
       texto:"«El informe debe ser breve y conciso» → «El informe debe ser ___».",
       respuestas:[["breve","conciso"]],
       retro:"La redundancia resta fuerza. Se corrige eliminando el elemento duplicado."}},

    {id:"p32", nombre:"Anfibología o doble sentido",
     concepto:"La anfibología es ambigüedad por doble interpretación. En comunicaciones escolares confunde a las familias. Se corrige explicitando la relación.",
     ejemplo:"Ambiguo: «El docente habló con el estudiante sobre su trabajo». ¿«Su» = docente o estudiante? Correcto: «...sobre el trabajo del estudiante».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin ambigüedad.",
       texto:"«La coordinadora informó al acudiente sobre su hijo» → «La coordinadora informó al acudiente sobre el hijo del ___».",
       respuestas:[["acudiente"]],
       retro:"La anfibología se corrige explicitando la relación. En comunicaciones, la claridad es esencial."}},

    {id:"p33", nombre:"Cosismo",
     concepto:"El cosismo es el uso abusivo de «cosa» o «cosas» en lugar del término preciso. En comunicaciones escolares, «cosa» es vago: debe especificarse si es actividad, reunión, documento, proyecto.",
     ejemplo:"Incorrecto: «Sucedió una cosa importante en la reunión». Correcto: «Se aprobó una decisión importante en la reunión».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye «cosa» por término preciso.",
       texto:"«Sucedió una cosa en la jornada» → «Se presentó un ___ en la jornada».",
       respuestas:[["incidente","evento","hecho","situacion","situación","problema"]],
       retro:"El cosismo es impreciso. En comunicaciones formales se exige el término exacto."}},

    {id:"p34", nombre:"Muletillas y fórmulas vacías",
     concepto:"Muletillas como «en su momento oportuno», «a la mayor brevedad posible», «cúmpleme manifestar» ocupan espacio sin aportar información. El lenguaje claro las elimina.",
     ejemplo:"En lugar de «A la mayor brevedad posible», se escribe: «Antes del 15 de julio». En lugar de «En su momento oportuno», «Dentro del plazo establecido».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye la fórmula vacía.",
       texto:"«A la mayor brevedad posible» → «Antes del ___» (fecha: 15 de julio).",
       respuestas:[["15 de julio","15/07","15"]],
       retro:"Las fórmulas vacías oscurecen. El lenguaje claro exige precisión temporal y factual."}},

    {id:"p35", nombre:"Impropiedad léxica",
     concepto:"La impropiedad es usar una palabra con significado distinto al que tiene. Errores frecuentes: «evaluación» por «calificación», «problema» por «conflicto», «caso» por «situación».",
     ejemplo:"Incorrecto: «La evaluación de Juan fue 4,5». Correcto: «La calificación de Juan fue 4,5». «Evaluar» es el proceso; «calificar» es asignar nota.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su significado.",
       categorias:["Proceso completo","Asignación de nota","Situación compleja","Hecho verificable"],
       items:[
         {texto:"evaluación", cat:0},
         {texto:"calificación", cat:1},
         {texto:"conflicto", cat:2},
         {texto:"hecho", cat:3},
         {texto:"valoración", cat:0}
       ],
       retro:"La impropiedad léxica altera el significado. En educación, evaluar no es calificar."}},

    {id:"p36", nombre:"Abuso del «que»",
     concepto:"El encadenamiento de «que» produce frases ilegibles. Se corrige eliminando «que» superfluos y dividiendo oraciones.",
     ejemplo:"Incorrecto: «Dijo que el docente que había visto que el estudiante que estaba presente...». Correcto: «Dijo que el docente había visto al estudiante presente».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina el «que» superfluo.",
       texto:"«Resulta que el informe que fue entregado que estaba completo» → «El informe entregado estaba ___».",
       respuestas:[["completo"]],
       retro:"El abuso del «que» genera confusión. El estilo culto lo evita."}},

    {id:"p37", nombre:"Cacofonía",
     concepto:"La cacofonía es la repetición de sonidos desagradables: «el área del área», «la coordinación coordina», «el acto del acta». Se corrige por eufonía.",
     ejemplo:"Cacofónico: «El área del área administrativa». Mejor: «El área administrativa».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin cacofonía.",
       texto:"«El acta del acto cívico fue archivada en el archivo» → «El acta del acto cívico fue archivada en el ___».",
       respuestas:[["deposito","depósito","fondo documental","archivo central"]],
       retro:"La cacofonía se corrige por sustitución léxica. En comunicaciones formales, la eufonía es parte del estilo."}},

    {id:"p38", nombre:"Barbarismos frecuentes",
     concepto:"Barbarismos: «haiga» por «haya», «dijieron» por «dijeron», «vinistes» por «viniste», «prevee» por «prevé». En comunicaciones escolares restan credibilidad institucional.",
     ejemplo:"Correcto: «Espero que haya asistencia». Correcto: «Ellos dijeron». Correcto: «El reglamento prevé».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige el barbarismo.",
       texto:"«Se espera que haiga asistencia» → «Se espera que ___ asistencia».",
       respuestas:[["haya"]],
       retro:"Los barbarismos son formas incorrectas. En comunicaciones institucionales son señal de escaso rigor."}},

    {id:"p39", nombre:"Anacoluto",
     concepto:"El anacoluto es la ruptura de la estructura sintáctica: la oración empieza de una manera y termina de otra. Produce incoherencia y confusión.",
     ejemplo:"Anacoluto: «Los estudiantes que llegaron tarde, sus acudientes fueron citados». Correcto: «A los estudiantes que llegaron tarde se les citó a sus acudientes».",
     ejercicio:{tipo:"fill",
       consigna:"Reescribe sin anacoluto.",
       texto:"«El informe que presentó el docente, sus conclusiones son claras» → «Las conclusiones del informe presentado por el docente son ___».",
       respuestas:[["claras"]],
       retro:"El anacoluto produce incoherencia. Se corrige reorganizando la oración."}},

    {id:"p40", nombre:"Ultracorrección",
     concepto:"La ultracorrección consiste en corregir lo que no está mal: «Bogotá» escrito «Bogotà», «vinistes» en lugar de «viniste», «dijistes» en lugar de «dijiste».",
     ejemplo:"Incorrecto: «Tú vinistes a la reunión». Correcto: «Tú viniste a la reunión». Incorrecto: «Bilbáo». Correcto: «Bilbao».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la ultracorrección.",
       texto:"«Tú dijistes que sí» → «Tú ___ que sí».",
       respuestas:[["dijiste"]],
       retro:"La ultracorrección es un error por exceso de celo. La norma culta exige la forma correcta."}}
  ]
},

/* ============ 5 · ESTILO UNIVERSITARIO ============ */
{
  id:"b5", nombre:"Estilo universitario y académico", emoji:"🎓",
  desc:"Registro, citas APA, paráfrasis, plagio y argumentación académica.",
  tecnicas:[
    {id:"p41", nombre:"Registro académico",
     concepto:"El registro académico es formal, preciso y objetivo. Se evitan coloquialismos, valoraciones sin respaldo y expresiones vagas. El vocabulario debe ser técnico y preciso.",
     ejemplo:"No: «Los estudiantes son muy flojos». Sí: «Se observa una disminución en la entrega de tareas que requiere intervención pedagógica».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Académico","Coloquial"],
       items:[
         {texto:"«Se evidencia una disminución en la asistencia»,", cat:0},
         {texto:"«Los chicos no vienen casi»,", cat:1},
         {texto:"«Los resultados sugieren una tendencia»,", cat:0},
         {texto:"«Un montón de estudiantes faltaron»,", cat:1},
         {texto:"«Se observa una mejora progresiva»,", cat:0}
       ],
       retro:"El registro académico es formal y objetivo. Los coloquialismos restan credibilidad."}},

    {id:"p42", nombre:"Citas APA cortas",
     concepto:"Las citas textuales de menos de 40 palabras van entre comillas dentro del párrafo, con autor, año y página: (Autor, año, p. X). Es la norma APA, frecuente en educación.",
     ejemplo:"«La educación no cambia el mundo, cambia a las personas que van a cambiar el mundo» (Freire, 1970, p. 45).",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita APA.",
       texto:"«Enseñar no es transferir conocimiento» (Freire, ___, p. ___). (Freire, 2004, p. 47)",
       respuestas:[["2004"],["47"]],
       retro:"La cita textual siempre lleva autor, año y página. Sin estos datos está incompleta."}},

    {id:"p43", nombre:"Citas APA largas",
     concepto:"Las citas de más de 40 palabras van en bloque sangrado, sin comillas, con autor, año y página al final. Se usan para fragmentos extensos citados textualmente.",
     ejemplo:"En párrafo aparte, sangrado: «La lectura del mundo precede siempre a la lectura de la palabra...» (Freire, 2004, p. 47).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se escribe una cita de más de 40 palabras en APA?",
       opciones:["Entre comillas dentro del texto","En bloque sangrado, sin comillas, con autor, año y página","Sin indicar la fuente","En cursiva y sin autor"],
       correcta:1,
       retro:"Las citas largas se sangran en bloque y se omiten las comillas. Siempre se indica autor, año y página."}},

    {id:"p44", nombre:"Paráfrasis académica",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, citando la fuente. No es copiar cambiando algunas palabras. Es esencial para sintetizar la literatura.",
     ejemplo:"Original: «El aprendizaje significativo se produce cuando el nuevo contenido se relaciona con los conocimientos previos». Paráfrasis: «Según Ausubel (1983), el aprendizaje se vuelve significativo cuando lo nuevo se conecta con lo que el estudiante ya sabe».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis.",
       texto:"«Según ___ (1983), el aprendizaje es significativo cuando se conecta con los ___ previos».",
       respuestas:[["ausubel","Ausubel"],["conocimientos","saberes"]],
       retro:"La paráfrasis mantiene la idea con palabras propias y cita la fuente. Sin cita, sería plagio."}},

    {id:"p45", nombre:"Referencias bibliográficas APA",
     concepto:"En APA, las referencias se ordenan alfabéticamente: Apellido, A. A. (Año). Título en cursiva. Editorial. Para artículos: Apellido, A. A. (Año). Título del artículo. Nombre de la Revista, volumen(número), páginas.",
     ejemplo:"Freire, P. (1970). Pedagogía del oprimido. Siglo XXI. · Ausubel, D. (1983). Psicología educativa. Trillas.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia APA.",
       items:[
         "Apellido, inicial del autor.",
         "(Año).",
         "Título del libro en cursiva.",
         "Editorial."
       ],
       retro:"El orden APA es fijo: autor, año, título (cursiva), editorial. Es la norma más usada en educación."}},

    {id:"p46", nombre:"Referencias de documentos oficiales",
     concepto:"En Colombia, los documentos oficiales (leyes, decretos, lineamientos del MEN) tienen formato específico: entidad, año, título. Ejemplo: «Ministerio de Educación Nacional. (2016). Derechos Básicos de Aprendizaje: Lenguaje. MEN».",
     ejemplo:"«Ley 115 de 1994. Ley General de Educación». «Ministerio de Educación Nacional. (2016). DBA: Lenguaje. MEN».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia oficial.",
       texto:"«Ministerio de Educación Nacional. (___). Derechos Básicos de Aprendizaje: Lenguaje. MEN».",
       respuestas:[["2016","2015","año"]],
       retro:"Los documentos oficiales se citan con entidad, año y título. Es parte de la formación docente."}},

    {id:"p47", nombre:"Conectores lógicos académicos",
     concepto:"Los conectores organizan el razonamiento: adición, contraste, causa, consecuencia, orden, reformulación. Sin ellos, el texto académico pierde su hilo.",
     ejemplo:"«La evaluación formativa mejora el aprendizaje; sin embargo, exige más tiempo. Por lo tanto, requiere planeación cuidadosa».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector.",
       categorias:["Adición","Contraste","Consecuencia","Reformulación"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"por lo tanto", cat:2},
         {texto:"es decir", cat:3},
         {texto:"no obstante", cat:1}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Son esenciales en el discurso académico."}},

    {id:"p48", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. Es falta grave de integridad académica.",
     ejemplo:"Copiar un párrafo de un libro sin comillas ni cita es plagio. Parafrasear sin citar también lo es.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir y referenciar","Citar entre comillas con referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"p49", nombre:"Argumentación académica",
     concepto:"La argumentación académica defiende una tesis con razones, evidencia, ejemplos y referencias. Reconoce objeciones y las responde. Estructura: introducción con tesis, desarrollo, refutación, conclusión.",
     ejemplo:"«Este ensayo defiende que la evaluación formativa mejora el aprendizaje. Primero, porque ofrece retroalimentación oportuna. Segundo, porque permite ajustar la enseñanza. Sin embargo, algunos señalan su costo en tiempo...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de la argumentación.",
       items:[
         "Introducción con la tesis.",
         "Argumentos con evidencia y referencias.",
         "Reconocimiento y respuesta a objeciones.",
         "Conclusión que retoma la tesis."
       ],
       retro:"La argumentación sigue la estructura: tesis, argumentos, refutación, conclusión. Cada paso es esencial."}},

    {id:"p50", nombre:"Coherencia global del texto",
     concepto:"La coherencia es la unidad de sentido: todas las partes contribuyen al mismo propósito, sin contradicciones, con progresión temática. Es esencial en el texto académico.",
     ejemplo:"Un ensayo sobre evaluación formativa que dedica tres párrafos a la evaluación sumativa sin justificación pierde coherencia global.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué afecta la COHERENCIA global, no la cohesión?",
       opciones:["Falta de conector","Contradicción entre secciones","Falta ortográfica","Oración larga"],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. La contradicción entre secciones es fallo grave."}}
  ]
},

/* ============ 6 · ESTRUCTURA DE DOCUMENTOS ESCOLARES ============ */
{
  id:"b6", nombre:"Estructura de documentos escolares", emoji:"📄",
  desc:"Circulares, cartas, actas, informes, comunicados y notificaciones.",
  tecnicas:[
    {id:"p51", nombre:"Circular escolar",
     concepto:"La circular es un comunicado breve y directo. Incluye: encabezado con número y fecha, destinatario, motivo, información detallada, cierre y firma. Debe ser clara y sin rodeos.",
     ejemplo:"«CIRCULAR N.º 15. Apreciadas familias: Les informamos que la reunión de entrega de informes será el viernes 19 de julio a las 3:00 p.m. Se requiere la asistencia de un acudiente por estudiante».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una circular.",
       items:[
         "Encabezado: número y fecha.",
         "Saludo al destinatario.",
         "Motivo de la circular.",
         "Información detallada.",
         "Despedida y firma."
       ],
       retro:"La circular es breve y directa. Cada parte cumple una función específica."}},

    {id:"p52", nombre:"Carta a familias",
     concepto:"La carta a familias es más extensa que la circular. Puede informar, solicitar, agradecer o acompañar procesos. Tono cordial, lenguaje accesible, estructura clara.",
     ejemplo:"«Apreciadas familias: Me dirijo a ustedes para compartirles los avances del grupo durante este período. Hemos trabajado en la comprensión lectora y en la escritura de textos argumentativos...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el encabezado.",
       texto:"«Apreciadas ___ : Me dirijo a ustedes para ___ los avances del grupo».",
       respuestas:[["familias"],["compartirles","informarles","contarles"]],
       retro:"La carta a familias combina información y vínculo. Tono cordial y lenguaje accesible."}},

    {id:"p53", nombre:"Acta de reunión",
     concepto:"El acta registra lo ocurrido en una reunión: lugar, fecha, hora, asistentes, temas tratados, decisiones, compromisos y firmas. Es documento formal con valor institucional.",
     ejemplo:"«Acta N.º 05. Consejo Académico. Fecha: 15 de julio de 2024, 10:00 a.m. Asistentes: rector, coordinadores, docentes. Temas: ajuste al cronograma. Decisiones: se aprueba el ajuste. Compromisos: los coordinadores informarán a los docentes. Firmas».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del acta.",
       items:[
         "Encabezado: número, fecha y hora.",
         "Asistentes.",
         "Temas tratados.",
         "Decisiones y compromisos.",
         "Firmas."
       ],
       retro:"El acta registra lugar, fecha, asistentes, temas, decisiones y compromisos. Las firmas dan fe."}},

    {id:"p54", nombre:"Informe de desempeño",
     concepto:"El informe de desempeño describe logros, dificultades y recomendaciones sobre un estudiante. Debe ser objetivo, con evidencias, respetuoso y orientado a la mejora.",
     ejemplo:"«El estudiante ha mejorado en comprensión lectora: pasó de identificar ideas explícitas a inferir información. Presenta dificultad en producción escrita. Se recomienda acompañamiento en lectura en casa».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado.",
       categorias:["Apropiado","Inapropiado"],
       items:[
         {texto:"«Ha mejorado en comprensión lectora».", cat:0},
         {texto:"«Es un estudiante mediocre».", cat:1},
         {texto:"«Presenta dificultad en producción escrita».", cat:0},
         {texto:"«No le gusta estudiar y no quiere hacer nada».", cat:1},
         {texto:"«Se recomienda acompañamiento en lectura».", cat:0}
       ],
       retro:"El informe describe con evidencias y orienta la mejora. No etiqueta al estudiante."}},

    {id:"p55", nombre:"Comunicado institucional",
     concepto:"El comunicado informa sobre decisiones, eventos o situaciones que afectan a la comunidad. Tono formal. Se dirige a toda la comunidad o a un grupo específico.",
     ejemplo:"«COMUNICADO. La Institución Educativa informa a toda la comunidad que, por trabajos de mantenimiento, la jornada del viernes 19 iniciará a las 8:00 a.m. Agradecemos su comprensión».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del comunicado.",
       items:[
         "Encabezado: institución y tipo.",
         "Motivo o asunto.",
         "Información detallada.",
         "Instrucciones o recomendaciones.",
         "Despedida institucional y firma."
       ],
       retro:"El comunicado institucional es formal y claro. Se dirige a la comunidad o a un grupo específico."}},

    {id:"p56", nombre:"Notificación formal",
     concepto:"La notificación comunica formalmente una decisión o situación a una persona. Incluye: identificación del destinatario, decisión o situación, fundamento, fecha y firma del responsable.",
     ejemplo:"«NOTIFICACIÓN. Señor acudiente Juan Pérez: Se le notifica que su hijo ha sido citado a reunión de seguimiento académico el día 20 de julio a las 10:00 a.m. Fundamento: artículo X del manual de convivencia. Firma: Coordinación Académica».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la notificación.",
       texto:"La notificación incluye: identificación del destinatario, decisión, ___, fecha y ___ del responsable.",
       respuestas:[["fundamento"],["firma"]],
       retro:"La notificación tiene estructura formal. Su omisión puede generar nulidad del acto."}},

    {id:"p57", nombre:"Constancia y certificación",
     concepto:"La constancia certifica un hecho. Incluye: identificación del solicitante, hecho certificado, fundamento y firma de la autoridad. Se usa para asistencia, desempeño, vinculación.",
     ejemplo:"«El suscrito Rector CERTIFICA: Que el estudiante Juan Pérez, identificado con TI X, se encuentra matriculado en esta institución en el grado 7.º. Se expide a solicitud del interesado».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la constancia.",
       texto:"«El suscrito Rector ___: Que el estudiante se encuentra matriculado...».",
       respuestas:[["certifica","CERTIFICA"]],
       retro:"La constancia usa el verbo performativo «CERTIFICA» seguido de dos puntos. Da fe de un hecho con efectos."}},

    {id:"p58", nombre:"Memorando interno",
     concepto:"El memorando es una comunicación interna entre dependencias. Contiene: destinatario, remitente, asunto, cuerpo y firma. Es breve y directo.",
     ejemplo:"«MEMORANDO. PARA: Coordinación Académica. DE: Rectoría. ASUNTO: Remisión de informe. Me permito remitir el informe solicitado... Firma».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del memorando.",
       items:[
         "Encabezado: PARA, DE, ASUNTO.",
         "Cuerpo del mensaje.",
         "Conclusión o solicitud.",
         "Firma."
       ],
       retro:"El memorando es breve y directo. Identifica destinatario, remitente y asunto."}},

    {id:"p59", nombre:"Observador del estudiante",
     concepto:"El observador registra la vida escolar del estudiante: comportamientos, logros, dificultades, observaciones y compromisos. Documento formal con valor institucional. Debe ser objetivo y respetuoso.",
     ejemplo:"«15 de julio: el estudiante llegó tarde por tercera vez en el mes. Se conversó con él y con su familia. Se acordó compromiso de puntualidad firmado por todos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada anotación.",
       categorias:["Apropiada","Inapropiada"],
       items:[
         {texto:"«Participó activamente en el proyecto».", cat:0},
         {texto:"«Es un problema para el grupo».", cat:1},
         {texto:"«Se acordó compromiso de puntualidad».", cat:0},
         {texto:"«Es incapaz de aprender».", cat:1},
         {texto:"«Mejoró en la entrega de tareas».", cat:0}
       ],
       retro:"El observador registra hechos y compromisos. No etiqueta al estudiante como persona."}},

    {id:"p60", nombre:"Citación a acudiente",
     concepto:"La citación convoca al acudiente a una reunión. Incluye: identificación del estudiante y del acudiente, motivo de la citación, fecha, hora, lugar y firma del responsable.",
     ejemplo:"«Señor acudiente: Se le cita a reunión el día 20 de julio a las 10:00 a.m. en la coordinación académica para tratar asuntos relacionados con el desempeño académico de su hijo. Su asistencia es obligatoria».",

       texto:"«Se le cita a reunión el día ___ a las ___ a.m. en la ___ académica».",
       respuestas:[["20 de julio","fecha","20/07"],["10:00","10"],["coordinacion","coordinación"]],

},

    {id:"p63", nombre:"Citación a reunión de padres",

    {id:"p64", nombre:"Agradecimiento institucional",

    {id:"p65", nombre:"Solicitud de colaboración",

     ejemplo:"«Apreciadas familias: Solicitamos su colaboración para la actividad del viernes: cada estudiante debe traer una botella plástica limpia y una caja de cartón. El propósito es construir un modelo del ciclo del agua».",

       retro:"La solicitud es específica: qué, para qué, cuándo y cómo. La claridad facilita la colaboración."}},

    {id:"p66", nombre:"Carta de felicitación",
     concepto:"La felicitación reconoce logros de estudiantes o familias. Debe ser personalizada, concreta y cordial. Refuerza el vínculo y la motivación.",
     ejemplo:"«Apreciada familia Pérez Gómez: Los felicitamos por el desempeño sobresaliente de su hija Ana en el concurso de matemáticas. Su dedicación y esfuerzo son ejemplo para nuestra comunidad».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la felicitación.",
       texto:"«Los felicitamos por el desempeño ___ de su hija en el ___ ».",
       respuestas:[["sobresaliente","excelente","destacado","notable"],["concurso","torneo","proyecto","certamen"]],
       retro:"La felicitación debe ser personalizada y concreta. Reconoce logros específicos."}},

    {id:"p67", nombre:"Comunicación de dificultad académica",
     concepto:"Cuando un estudiante presenta dificultades, la comunicación debe ser objetiva, con evidencias, respetuosa y orientada a la mejora. Se describen hechos, no se etiqueta.",
     ejemplo:"«Apreciada familia: Le informamos que Juan ha presentado dificultad en la entrega de tareas durante las últimas tres semanas (entrega 4 de 10). Solicitamos su acompañamiento y le proponemos una reunión para acordar estrategias».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión.",
       categorias:["Apropiada","Inapropiada"],

         {texto:"«Ha entregado 4 de 10 tareas».", cat:0},
         {texto:"«Es un estudiante irresponsable».", cat:1},
         {texto:"«Solicitamos su acompañamiento».", cat:0},
         {texto:"«No le importa nada».", cat:1},
         {texto:"«Proponemos una reunión para acordar estrategias».", cat:0}
       ],
       retro:"La comunicación con familias describe hechos con evidencias y orienta la mejora. Nunca etiqueta."}},

    {id:"p68", nombre:"Comunicación de situación disciplinaria",
     concepto:"Cuando se comunica una situación disciplinaria, se debe ser objetivo, describir los hechos, citar la norma del manual de convivencia y proponer un diálogo. Sin juicios de valor.",
     ejemplo:"«Apreciada familia: Le comunicamos que el estudiante X, el día 15 de julio, interrumpió la clase en tres ocasiones pese a las indicaciones del docente. Esta conducta está prevista en el artículo 45 del manual de convivencia. Le proponemos una reunión el 20 de julio a las 10:00 a.m.».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la comunicación.",
       texto:"«Le comunicamos que el estudiante X el día ___ interrumpió la clase en ___ ocasiones. Esta conducta está prevista en el artículo ___ del manual de convivencia».",
       respuestas:[["15 de julio","15/07","fecha"],["3","tres"],["45","artículo","numero","número"]],
       retro:"La comunicación disciplinaria es objetiva, describe hechos, cita la norma y propone diálogo."}},

    {id:"p69", nombre:"Cita con orientación escolar",
     concepto:"La cita con orientación convoca a la familia a acompañar procesos de tipo socioemocional. Tono respetuoso, confidencial, sin diagnosticar. Se enfoca en el acompañamiento.",
     ejemplo:"«Apreciada familia: Le proponemos una reunión con el servicio de orientación escolar el 22 de julio a las 9:00 a.m. para acompañar el proceso socioemocional de su hijo. Es un espacio de diálogo y apoyo».",

       retro:"La cita con orientación es respetuosa y confidencial. Se enfoca en el acompañamiento, no en el diagnóstico."}},

    {id:"p70", nombre:"Carta de cierre de año",
