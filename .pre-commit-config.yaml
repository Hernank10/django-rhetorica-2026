# Pre-commit hooks para django-rhetorica
# Instalacion: python -m pre_commit install
# Ejecutar sobre todos los archivos: python -m pre_commit run --all-files
# Saltar hooks en un commit puntual: git commit --no-verify

exclude: |
  (?x)^(
    ejercicios_completos-lengua-castellana/|
    scripts/_deprecated/|
    locale/.*\.po$|
    data/|
    .*\.sql$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|txt)$
      - id: end-of-file-fixer
        exclude: \.(md|txt)$
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: \.(bat|cmd)$
      - id: check-ast
        files: \.py$
      - id: debug-statements
        files: \.py$

  # Descomentar cuando quieras linting automatico con ruff:
