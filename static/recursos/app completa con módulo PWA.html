<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<meta name="description" content="Mini LMS Completo · 100 técnicas para desarrollar un LMS con Python, Django y SQL. Funciona sin conexión (PWA).">
<link rel="manifest" href="#" id="manifestLink">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Mini LMS Completo · 100 técnicas · PWA + Dashboard</title>
<style>
  :root{
    --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --warn:#a67c52; --warn-soft:#f0e4d3;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
    --transition:.22s cubic-bezier(.4,.15,.2,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;font-family:"Public Sans",system-ui,sans-serif;
    background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),#e8e6e0;
    color:var(--ink);-webkit-font-smoothing:antialiased;font-size:.95rem;min-height:100vh;
  }

  /* ============ TOPBAR ============ */
  .topbar{
    position:sticky;top:0;z-index:1030;display:flex;align-items:center;
    justify-content:space-between;gap:1rem;padding:.6rem 1.1rem;
    background:linear-gradient(180deg,#fdfaf3,#f7f2e8);
    border-bottom:3px double var(--navy);
    box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:.8rem;min-width:0;}
  .seal{
    width:44px;height:44px;flex:0 0 auto;border-radius:50%;padding:3px;
    border:1.5px dashed var(--bronze);display:grid;place-items:center;
  }
  .seal-inner{
    width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);
    display:grid;place-items:center;
    background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);
    color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:12px;
    position:relative;
  }
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:5px;color:var(--bronze);}
  .seal-inner::before{top:4px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:4px;left:50%;transform:translateX(-50%);}
  .brand h1{
    font-family:"PT Serif",Georgia,serif;font-size:.88rem;margin:0;font-weight:700;
    color:var(--navy);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand small{font-size:.6rem;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700;}

  .modo-tabs{display:flex;border:1px solid var(--navy);background:var(--paper);flex-wrap:wrap;}
  .modo-tab{
    font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:.5rem .8rem;cursor:pointer;border:none;background:transparent;color:var(--navy);
    border-right:1px solid var(--navy);transition:var(--transition);font-family:inherit;
  }
  .modo-tab:last-child{border-right:none;}
  .modo-tab:hover{background:var(--navy-soft);}
  .modo-tab.active{background:var(--navy);color:var(--paper);}

  .btn-sm-custom{
    font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:.42rem .8rem;border:1px solid var(--navy);background:var(--paper);color:var(--navy);
    cursor:pointer;border-radius:3px;transition:var(--transition);font-family:inherit;
  }
  .btn-sm-custom:hover{background:var(--navy-soft);}
  .btn-sm-custom.primary{background:var(--navy);color:var(--paper);}
  .btn-sm-custom.primary:hover{background:var(--navy-dark);}
  .btn-sm-custom.outline{border-color:var(--bronze);color:var(--bronze-dark);}
  .btn-sm-custom.outline:hover{background:var(--bronze-soft);}
  .btn-sm-custom.danger{border-color:var(--bad);color:var(--bad);}
  .btn-sm-custom.danger:hover{background:var(--bad-soft);}
  .btn-sm-custom.ok{border-color:var(--ok);color:var(--ok);}
  .btn-sm-custom.ok:hover{background:var(--ok-soft);}

  .status-pill{
    display:inline-flex;align-items:center;gap:.35rem;font-size:.6rem;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase;padding:.3rem .6rem;border-radius:99px;
    border:1px solid;background:var(--paper);
  }
  .status-pill.online{border-color:var(--ok);color:var(--ok);}
  .status-pill.offline{border-color:var(--bad);color:var(--bad);}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  /* ============ LAYOUT ============ */
  .layout{display:grid;grid-template-columns:290px 1fr;gap:1.3rem;padding:1.3rem;max-width:1450px;margin:0 auto;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;padding:.8rem;gap:.8rem;}}

  /* ============ SIDEBAR ============ */
  .sidebar{
    position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto;
    background:var(--paper);border:1px solid var(--navy);padding:4px;
    box-shadow:var(--shadow);border-radius:4px;
  }
  .sidebar-inner{border:1px solid var(--bronze-line);padding:.8rem;border-radius:3px;}
  .side-label{
    font-size:.6rem;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--bronze-dark);padding-bottom:.4rem;margin-bottom:.6rem;
    border-bottom:1px solid var(--bronze-line);display:flex;justify-content:space-between;align-items:center;
  }
  .side-search{
    width:100%;font-size:.8rem;padding:.4rem .6rem;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);margin-bottom:.7rem;border-radius:3px;outline:none;
  }
  .side-search:focus{border-color:var(--navy);}

  .cat-block{margin-bottom:.3rem;}
  .cat-toggle{
    display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
    background:none;border:none;padding:.5rem .55rem;
    font-size:.68rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:var(--navy);border-left:3px solid transparent;font-family:inherit;
    transition:var(--transition);cursor:pointer;
  }
  .cat-toggle:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-toggle[aria-expanded="true"] .chev{transform:rotate(90deg);}
  .chev{margin-left:auto;font-size:.55rem;color:var(--bronze);transition:transform var(--transition);}
  .cat-count{
    font-family:"PT Serif",Georgia,serif;font-size:.66rem;font-weight:700;
    background:var(--bronze-soft);color:var(--bronze-dark);
    padding:.1rem .4rem;border:1px solid var(--bronze-line);
  }
  .cat-prog{height:3px;background:var(--paper-2);margin:0 .55rem .4rem;border:1px solid var(--line);}
  .cat-prog > div{height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width var(--transition);}
  .tech-btn{
    display:flex;align-items:flex-start;gap:.4rem;width:100%;text-align:left;
    background:none;border:none;padding:.35rem .55rem;
    font-size:.74rem;line-height:1.35;color:var(--ink);
    border-left:3px solid transparent;font-family:inherit;transition:var(--transition);cursor:pointer;
    border-radius:0 3px 3px 0;
  }
  .tech-btn:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-btn.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-btn .done-mark{
    flex:0 0 auto;width:12px;height:12px;margin-top:.15rem;
    border:1px solid var(--line);background:var(--paper);
    display:grid;place-items:center;font-size:.5rem;color:transparent;
  }
  .tech-btn.done .done-mark{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* ============ PANEL ============ */
  .panel{
    background:var(--paper);border:1px solid var(--navy);padding:6px;
    box-shadow:var(--shadow);border-radius:4px;position:relative;
  }
  .panel-inner{
    border:1px solid var(--bronze-line);padding:1.8rem 2rem;border-radius:3px;
    background:radial-gradient(circle at 100% 0%, var(--bronze-soft) 0%, transparent 45%), var(--paper);
    position:relative;
  }
  @media (max-width:640px){.panel-inner{padding:1.1rem;}}
  .panel-seal{
    position:absolute;top:14px;right:18px;width:60px;height:60px;
    border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.75;
  }
  .panel-seal-inner{
    width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);
    display:grid;place-items:center;color:var(--navy);
    font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:8px;
    text-align:center;line-height:1.1;
  }

  /* ============ DASHBOARD ============ */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.6rem;}
  .kpi{
    border:1px solid var(--bronze-line);padding:1rem;border-radius:4px;background:var(--paper);
    border-left:4px solid var(--navy);position:relative;overflow:hidden;
  }
  .kpi .lbl{font-size:.6rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--bronze-dark);display:block;margin-bottom:.3rem;}
  .kpi .val{font-family:"PT Serif",Georgia,serif;font-size:2rem;font-weight:700;color:var(--navy);line-height:1;}
  .kpi .sub{font-size:.7rem;color:var(--muted);margin-top:.35rem;}
  .kpi .spark{position:absolute;right:8px;bottom:8px;opacity:.65;}

  .chart-card{
    border:1px solid var(--navy);padding:4px;border-radius:4px;background:var(--paper);
    box-shadow:var(--shadow);margin-bottom:1.2rem;
  }
  .chart-inner{
    border:1px solid var(--bronze-line);padding:1.2rem;border-radius:3px;background:var(--paper);
  }
  .chart-inner h3{
    font-family:"PT Serif",Georgia,serif;font-size:1.05rem;color:var(--navy);
    margin:0 0 .2rem;font-weight:700;
  }
  .chart-inner .sub{font-size:.7rem;color:var(--muted);margin:0 0 1rem;letter-spacing:.5px;text-transform:uppercase;font-weight:600;}

  .bar-chart{display:flex;flex-direction:column;gap:.7rem;}
  .bar-row{
    display:grid;grid-template-columns:200px 1fr 60px;gap:.7rem;align-items:center;
  }
  @media (max-width:640px){.bar-row{grid-template-columns:1fr;gap:.3rem;}}
  .bar-row .nombre{
    font-size:.78rem;font-weight:700;color:var(--navy);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .bar-row .nombre small{display:block;font-weight:500;color:var(--muted);font-size:.65rem;}
  .bar-track{
    height:22px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:3px;overflow:hidden;position:relative;
  }
  .bar-fill{
    height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));
    width:0;transition:width .8s cubic-bezier(.4,.15,.2,1);
    display:flex;align-items:center;justify-content:flex-end;padding-right:.5rem;
    color:var(--paper);font-size:.7rem;font-weight:700;letter-spacing:.5px;
  }
  .bar-row .pct{
    font-family:"PT Serif",Georgia,serif;font-size:.9rem;font-weight:700;
    color:var(--navy);text-align:right;
  }

  .donut-wrap{
    display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;justify-content:center;
  }
  .donut-wrap svg{flex:0 0 auto;}
  .donut-info{display:flex;flex-direction:column;gap:.5rem;font-size:.82rem;}
  .donut-info div{display:flex;align-items:center;gap:.5rem;}
  .donut-info .dot{width:11px;height:11px;border-radius:3px;}
  .donut-info .lbl{flex:1;color:var(--ink);}
  .donut-info .val{font-weight:700;color:var(--navy);font-family:"PT Serif",Georgia,serif;}

  .line-chart svg{width:100%;height:auto;max-height:220px;}

  /* ============ CERTIFICADO ============ */
  .certificado{text-align:center;padding:1.5rem 1rem 2.5rem;position:relative;}
  .certificado::before,.certificado::after{
    content:"";position:absolute;left:0;right:0;height:3px;
    border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);
  }
  .certificado::before{top:0;}
  .certificado::after{bottom:0;}
  .cert-sello{width:100px;height:100px;margin:0 auto 1.2rem;border-radius:50%;padding:4px;
    border:2px dashed var(--bronze);display:grid;place-items:center;position:relative;}
  .cert-sello-inner{
    width:100%;height:100%;border-radius:50%;border:2px solid var(--navy);
    display:grid;place-items:center;
    background:radial-gradient(circle, var(--paper) 55%, var(--bronze-soft) 100%);
    color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;text-align:center;line-height:1.2;
  }
  .cert-sello-inner .anio{font-size:1.9rem;display:block;line-height:1;}
  .cert-sello-inner .lbl{font-size:.55rem;letter-spacing:2px;text-transform:uppercase;color:var(--bronze-dark);font-weight:800;}
  .cert-eyebrow{font-size:.68rem;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:.5rem;}
  .cert-titulo{font-family:"PT Serif",Georgia,serif;font-size:clamp(1.2rem,3.2vw,1.9rem);color:var(--navy);line-height:1.15;margin:0 0 .9rem;font-weight:700;}
  .cert-linea{width:60%;margin:1rem auto;height:1px;background:var(--bronze-line);position:relative;}
  .cert-linea::before{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 .5rem;color:var(--bronze);font-size:.7rem;}
  .cert-otorgado{font-family:"PT Serif",Georgia,serif;font-style:italic;font-size:.9rem;color:var(--muted);margin:.9rem 0 .4rem;}
  .cert-nombre{
    font-family:"PT Serif",Georgia,serif;font-size:clamp(1.2rem,3.4vw,1.9rem);
    font-weight:700;color:var(--navy);line-height:1.15;padding:.35rem .7rem;
    border-bottom:1px dashed var(--bronze);display:inline-block;min-width:60%;
    outline:none;transition:var(--transition);
  }
  .cert-nombre:hover,.cert-nombre:focus{background:var(--bronze-soft);}
  .cert-desc{font-family:"PT Serif",Georgia,serif;font-size:.9rem;line-height:1.7;color:var(--ink);max-width:600px;margin:1rem auto 0;}
  .cert-firmas{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;max-width:520px;margin:1.8rem auto 0;}
  .cert-firma{border-top:1px solid var(--navy);padding-top:.5rem;text-align:center;}
  .cert-firma strong{display:block;font-family:"PT Serif",Georgia,serif;font-size:.85rem;color:var(--navy);outline:none;padding:.1rem .3rem;min-width:60%;}
  .cert-firma small{font-size:.6rem;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;font-weight:700;}
  .cert-meta{display:flex;justify-content:space-between;gap:1rem;margin-top:1.6rem;font-size:.66rem;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:700;padding-top:.9rem;border-top:1px solid var(--bronze-line);}
  .cert-meta span{outline:none;}
  .cert-meta span:hover,.cert-meta span:focus{background:var(--bronze-soft);}

  /* ============ DOCUMENTO ============ */
  .doc-bloque{margin-top:2.2rem;page-break-before:always;}
  .doc-bloque:first-of-type{page-break-before:avoid;}
  .doc-bloque-header{
    padding:.85rem 1rem;background:var(--navy-soft);border-left:4px solid var(--navy);
    border-radius:3px;margin-bottom:1.1rem;
  }
  .doc-bloque-header h2{
    font-family:"PT Serif",Georgia,serif;font-size:1.1rem;color:var(--navy);
    margin:0 0 .2rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;
  }
  .doc-bloque-header .rango{
    font-family:"JetBrains Mono",monospace;font-size:.66rem;font-weight:700;
    color:var(--bronze-dark);background:var(--bronze-soft);padding:.15rem .45rem;border:1px solid var(--bronze-line);
  }
  .doc-bloque-header p{font-size:.76rem;color:var(--muted);margin:0;line-height:1.5;}

  .doc-tecnica{
    display:grid;grid-template-columns:56px 1fr;gap:.9rem;
    padding:.9rem 0;border-bottom:1px solid var(--line);page-break-inside:avoid;
  }
  .doc-tecnica:last-child{border-bottom:none;}
  .doc-tecnica .num{
    font-family:"PT Serif",Georgia,serif;font-size:1.5rem;font-weight:700;
    color:var(--bronze);line-height:1;text-align:right;padding-top:.15rem;
  }
  .doc-tecnica .body h3{font-family:"PT Serif",Georgia,serif;font-size:.95rem;font-weight:700;color:var(--navy);margin:0 0 .3rem;line-height:1.3;}
  .doc-tecnica .body p{font-size:.82rem;line-height:1.6;color:var(--ink);margin:0 0 .45rem;}
  .doc-tecnica .ej{
    font-family:"JetBrains Mono",monospace;font-size:.7rem;line-height:1.55;
    background:var(--paper-2);border-left:3px solid var(--bronze);
    padding:.45rem .7rem;border-radius:0 3px 3px 0;color:var(--navy-dark);
    overflow-x:auto;white-space:pre-wrap;
  }
  @media (max-width:640px){
    .doc-tecnica{grid-template-columns:36px 1fr;gap:.5rem;}
    .doc-tecnica .num{font-size:1.1rem;}
  }

  /* ============ CUADERNO INTERACTIVO ============ */
  .tech-header{padding-right:80px;margin-bottom:1rem;}
  .tech-badge{
    display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);
    border:1px solid var(--bronze-line);padding:.15rem .55rem;margin-bottom:.5rem;
  }
  .tech-title{font-family:"PT Serif",Georgia,serif;font-size:clamp(1.05rem,2.6vw,1.5rem);font-weight:700;color:var(--navy);line-height:1.2;margin:0;}
  .tech-sub{font-size:.68rem;color:var(--muted);margin-top:.3rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .rule-double{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:.8rem 0 1.1rem;}

  .block-dots{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem;}
  .block-dot{
    width:10px;height:10px;border:1px solid var(--line);background:var(--paper);
    cursor:pointer;transition:var(--transition);
  }
  .block-dot:hover{transform:scale(1.25);border-color:var(--bronze);}
  .block-dot.done{background:var(--ok);border-color:var(--ok);}
  .block-dot.current{background:var(--bronze);border-color:var(--bronze-dark);}

  .flashcard{
    perspective:1600px;margin:0 0 1rem;cursor:pointer;
    border:1px solid var(--navy);padding:4px;background:var(--paper);
    box-shadow:var(--shadow);border-radius:3px;
  }
  .flashcard-inner{
    position:relative;min-height:clamp(200px,30vh,260px);
    transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);
    border:1px solid var(--bronze-line);
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    padding:1rem 1.2rem;display:flex;flex-direction:column;overflow:auto;background:var(--paper);
    background-image:linear-gradient(transparent 27px, rgba(20,33,61,.06) 27px 28px);
    background-size:100% 28px;background-position:0 14px;
  }
  .flashcard-back{transform:rotateY(180deg);background:var(--bronze-soft);}
  .flashcard-tag{font-size:.6rem;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid var(--bronze-line);display:block;}
  .flashcard-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:.9rem;line-height:1.7;color:var(--ink);}
  .flashcard-back p{font-style:italic;color:var(--navy-dark);}
  .flashcard-hint{margin-top:auto;padding-top:.6rem;font-size:.6rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}

  .sec-title{display:flex;align-items:center;gap:.5rem;font-family:"PT Serif",Georgia,serif;font-size:.95rem;font-weight:700;color:var(--navy);margin:1.5rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title small{font-size:.6rem;color:var(--muted);margin-left:auto;letter-spacing:.5px;text-transform:uppercase;}

  .consigna{font-family:"PT Serif",Georgia,serif;font-size:.9rem;line-height:1.55;background:var(--paper-2);border-left:3px solid var(--bronze);padding:.65rem .9rem;margin:0 0 .9rem;border-radius:0 3px 3px 0;}

  .opciones{display:flex;flex-direction:column;gap:.4rem;}
  .opcion-btn{

  .opcion-btn:disabled{cursor:default;opacity:.9;}
  .opcion-letra{
    flex:0 0 auto;width:22px;height:22px;background:var(--paper-2);color:var(--muted);
    border:1px solid var(--line);display:grid;place-items:center;
    font-family:"PT Serif",Georgia,serif;font-size:.7rem;font-weight:700;
  }
  .opcion-btn.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion-btn.correcta .opcion-letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion-btn.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion-btn.incorrecta .opcion-letra{background:var(--bad);color:#fff;border-color:var(--bad);}

  textarea.area-redaccion{
    width:100%;font-family:"JetBrains Mono",monospace;font-size:.82rem;line-height:1.5;
    color:var(--ink);padding:.7rem .9rem;border:1px solid var(--bronze-line);
    background:var(--paper);border-radius:3px;resize:vertical;outline:none;transition:var(--transition);
  }
  textarea.area-redaccion:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft);}

  .fb-box{margin-top:1rem;padding:0;overflow:hidden;max-height:0;opacity:0;transition:var(--transition);border-left:3px solid transparent;border-radius:0 3px 3px 0;}
  .fb-box.show{max-height:600px;opacity:1;padding:.8rem 1rem;}
  .fb-box.fb-ok{background:var(--ok-soft);border-left-color:var(--ok);color:var(--ok);}
  .fb-box.fb-mal{background:var(--bad-soft);border-left-color:var(--bad);color:var(--bad);}
  .fb-box.fb-info{background:var(--bronze-soft);border-left-color:var(--bronze);color:var(--bronze-dark);}
  .fb-box strong{display:block;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:.3rem;}
  .fb-box p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:.86rem;line-height:1.55;}

  .modelo-respuesta{
    display:none;margin-top:1rem;background:var(--paper-2);border-left:3px solid var(--navy);

    font-size:.86rem;line-height:1.6;color:var(--navy-dark);

  .modelo-respuesta.show{display:block;}

  .cuaderno-block{margin-top:1.6rem;padding-top:1.1rem;border-top:1px solid var(--navy);position:relative;}

  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:.65rem;color:var(--muted);margin-top:.4rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--bronze-line);}

  /* ============ TALLER ============ */
  .tool-card{background:var(--paper);border:1px solid var(--navy);padding:4px;border-radius:3px;box-shadow:var(--shadow);margin-bottom:1rem;}
  .tool-inner{border:1px solid var(--bronze-line);padding:1rem;border-radius:3px;background:var(--paper);}
  .tool-inner h4{font-family:"PT Serif",Georgia,serif;font-size:1rem;color:var(--navy);margin:0 0 .4rem;font-weight:700;}
  .tool-inner > p{font-size:.8rem;color:var(--muted);margin:0 0 .8rem;}
  .input-sm,.select-sm{font-size:.85rem;width:100%;padding:.4rem .6rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;outline:none;transition:var(--transition);}
  .input-sm:focus,.select-sm:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}

  .resultado-caja{
    background:var(--paper-2);border:1px solid var(--bronze-line);padding:.8rem;
    border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:.78rem;line-height:1.6;
    color:var(--ink);white-space:pre-wrap;max-height:400px;overflow-y:auto;margin-top:.7rem;
  }

  /* ============ PWA BANNER ============ */
  .pwa-banner{
    position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(200px);
    background:var(--paper);border:1px solid var(--navy);box-shadow:var(--shadow);
    padding:.8rem 1rem;border-radius:6px;display:flex;align-items:center;gap:.9rem;
    max-width:520px;width:calc(100% - 2rem);z-index:2100;
    transition:transform .35s cubic-bezier(.4,.15,.2,1);
  }
  .pwa-banner.show{transform:translateX(-50%) translateY(0);}
  .pwa-banner .icon{
    width:44px;height:44px;border-radius:8px;background:var(--navy-soft);
    display:grid;place-items:center;font-size:1.3rem;flex:0 0 auto;
  }
  .pwa-banner .text{flex:1;min-width:0;}
  .pwa-banner .text strong{display:block;font-family:"PT Serif",Georgia,serif;color:var(--navy);font-size:.9rem;}
  .pwa-banner .text small{font-size:.72rem;color:var(--muted);display:block;margin-top:.15rem;}
  .pwa-banner .btns{display:flex;gap:.4rem;flex:0 0 auto;}

  /* ============ TOAST ============ */
  .app-toast{
    position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--navy);color:var(--paper);padding:.6rem 1.1rem;
    font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    border:1px solid var(--bronze-line);box-shadow:var(--shadow);
    opacity:0;transition:var(--transition);z-index:2200;border-radius:3px;
  }
  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ PRINT ============ */
  @media print{
    @page{size:A4;margin:2cm;}
    body{background:#fff !important;}
    .topbar,.sidebar,.app-toast,.no-print,.pwa-banner{display:none !important;}
    .layout{display:block;padding:0;gap:0;max-width:none;margin:0;}
    .panel{border:none;box-shadow:none;padding:0;background:#fff;}
    .panel-inner{border:none;padding:0;background:#fff;}
    .panel-seal{display:none;}
    .doc-bloque{page-break-before:always;margin-top:0;}
    .doc-bloque:first-of-type{page-break-before:avoid;}
    .doc-tecnica{page-break-inside:avoid;}
    .certificado{min-height:calc(297mm - 4cm);display:flex;flex-direction:column;justify-content:center;}
    .cuaderno-interactivo,.taller-completo,.dashboard-view{display:none !important;}
  }

  @media (max-width:900px){
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:290px;max-height:100vh;
      z-index:1050;padding:4px;transform:translateX(-105%);
      transition:transform .28s ease;overflow-y:auto;border-radius:0 6px 6px 0;
    }
    .sidebar.open{transform:none;}
    .only-mobile{display:inline-block !important;}
  }
  .only-mobile{display:none;}

  /* utilidades */
  .d-flex{display:flex;}
  .gap-2{gap:.5rem;}
  .gap-3{gap:.7rem;}
  .mt-2{margin-top:.5rem;}
  .mt-3{margin-top:.8rem;}
  .mb-2{margin-bottom:.5rem;}
  .mb-3{margin-bottom:.8rem;}
  .text-muted{color:var(--muted);}
  .fw-bold{font-weight:700;}
  .text-center{text-align:center;}
</style>
</head>

const STORAGE_PROG = "mini_lms_pwa_prog";
const STORAGE_CAMPOS = "mini_lms_pwa_campos";
const STORAGE_TEMA = "mini_lms_pwa_tema";

let progreso = {};
let campos = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_PROG)) || {}; } catch(e){ progreso = {}; }
try { campos = JSON.parse(localStorage.getItem(STORAGE_CAMPOS)) || {}; } catch(e){ campos = {}; }

const TECNICAS_FLAT = [];
BLOQUES.forEach(b => b.tecnicas.forEach(t => { t.bloqueId = b.id; t.bloqueNombre = b.nombre; TECNICAS_FLAT.push(t); }));

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s,c=document) => c.querySelector(s);
const $$ = (s,c=document) => Array.from(c.querySelectorAll(s));
function el(t,c,x){ const e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e; }
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function guardarProg(){ try{ localStorage.setItem(STORAGE_PROG, JSON.stringify(progreso)); }catch(e){} }
function guardarCampos(){ try{ localStorage.setItem(STORAGE_CAMPOS, JSON.stringify(campos)); }catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function norm(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"").replace(/\s+/g," ").trim();
}
function barajar(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function bloqueDe(id){ const t = TECNICAS_FLAT.find(x=>("t"+x.n)===id); return t ? t.bloqueId : null; }

  const t = document.getElementById("appToast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

/* =====================================================================
   CAMBIO DE MODO
   ===================================================================== */
function cambiarModo(m){
  modo = m;
  $$(".modo-tab").forEach(t => {
    const a = t.dataset.modo === m;
    t.classList.toggle("active", a);
    t.setAttribute("aria-selected", a ? "true" : "false");
  });
  $("#menuDashboard").style.display = m === "dashboard" ? "block" : "none";
  $("#menuCuaderno").style.display = m === "cuaderno" ? "block" : "none";
  $("#menuTaller").style.display = m === "taller" ? "block" : "none";
  $("#menuCertificado").style.display = m === "certificado" ? "block" : "none";
  $("#searchTecnica").style.display = m === "cuaderno" ? "block" : "none";
  $("#sidebarTitle").textContent = m === "dashboard" ? "Secciones del dashboard" : m === "certificado" ? "Secciones del documento" : m === "cuaderno" ? "Bloques y técnicas" : "Herramientas";
  cerrarSidebar();

  if(m === "dashboard"){ renderMenuDashboard(); abrirDashboard(); }
  if(m === "cuaderno"){ renderMenuCuaderno(); abrirTecnica(actualId); }
  if(m === "taller"){ renderMenuTaller(); abrirHerramienta(); }
  if(m === "certificado"){ renderMenuCertificado(); abrirCertificado(); }
}

/* =====================================================================
   MENÚ CUADERNO
   ===================================================================== */
function renderMenuCuaderno(){
  const menu = $("#menuCuaderno");
  menu.innerHTML = "";
  const f = norm($("#searchTecnica").value || "");
  BLOQUES.forEach(bloque => {
    const tecnicas = bloque.tecnicas.filter(t => !f || norm(t.t).includes(f) || norm(bloque.nombre).includes(f));
    if(!tecnicas.length) return;
    const hechas = bloque.tecnicas.filter(t => getProg("t" + t.n).ok).length;
    const abierto = f ? true : (bloque.id === bloqueDe(actualId));
    const block = el("div","cat-block");
    const toggle = el("button","cat-toggle");
    toggle.setAttribute("aria-expanded", abierto ? "true" : "false");
    toggle.innerHTML = `<span>${bloque.emoji}</span><span>${esc(bloque.nombre)}</span><span class="cat-count">${hechas}/${bloque.tecnicas.length}</span><span class="chev">▶</span>`;
    const body = el("div");
    body.style.display = abierto ? "block" : "none";
    toggle.addEventListener("click", () => {
      const open = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", open ? "false" : "true");
      body.style.display = open ? "none" : "block";
    });
    block.appendChild(toggle);
    const prog = el("div","cat-prog");
    const fill = document.createElement("div");
    fill.style.width = (hechas/bloque.tecnicas.length*100) + "%";
    prog.appendChild(fill);
    block.appendChild(prog);
    tecnicas.forEach(t => {
      const id = "t" + t.n;
      const b = el("button","tech-btn" + (getProg(id).ok ? " done":"") + (id === actualId ? " active":""));
      b.innerHTML = `<span class="done-mark">✓</span><span>${t.n}. ${esc(t.t)}</span>`;
      b.addEventListener("click", () => { abrirTecnica(id); cerrarSidebar(); });
      body.appendChild(b);
    });
    block.appendChild(body);
    menu.appendChild(block);
  });
  $("#sidebarCount").textContent = TECNICAS_FLAT.length;
}

/* ---------- SVG Sparkline ---------- */
function svgSpark(hechas, total){
  const pct = total ? hechas/total : 0;
  const w = 70, h = 30;
  const puntos = [];
  for(let i=0;i<=10;i++){
    const x = (i/10)*w;
    const y = h - (pct*(i/10))*h;
    puntos.push(`${x},${y.toFixed(1)}`);
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${puntos.join(" ")}" fill="none" stroke="#a67c52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ---------- SVG Donut ---------- */
function svgDonut(hechas, restantes){
  const total = hechas + restantes;
  const radio = 60, grosor = 22, c = 2*Math.PI*radio;
  const pct = total ? hechas/total : 0;
  const largoHechas = c * pct;
  const largoRestantes = c - largoHechas;
  const svg = `
    <svg width="160" height="160" viewBox="0 0 160 160" aria-label="Estado global: ${hechas} de ${total} técnicas completadas">
      <circle cx="80" cy="80" r="${radio}" fill="none" stroke="var(--paper-2)" stroke-width="${grosor}"/>
      <circle cx="80" cy="80" r="${radio}" fill="none" stroke="#a67c52" stroke-width="${grosor}"
        stroke-dasharray="${largoRestantes} ${largoHechas}" stroke-dashoffset="${-largoHechas}"
        transform="rotate(-90 80 80)"/>
      <circle cx="80" cy="80" r="${radio}" fill="none" stroke="#14213d" stroke-width="${grosor}"
        stroke-dasharray="${largoHechas} ${largoRestantes}" stroke-dashoffset="0"
        transform="rotate(-90 80 80)"/>
      <text x="80" y="76" text-anchor="middle" font-family="PT Serif,Georgia,serif" font-size="26" font-weight="700" fill="var(--navy)">${Math.round(pct*100)}%</text>
      <text x="80" y="94" text-anchor="middle" font-family="Public Sans,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="var(--muted)">COMPLETADO</text>
    </svg>`;
  return { svg };
}

/* ---------- SVG Línea ---------- */
function svgLine(datos, total){
  const w = 600, h = 180, pad = 30;
  const anchoUtil = w - pad*2;
  const altoUtil = h - pad*2;
  const puntos = datos.map((v,i) => {
    const x = pad + (i/(datos.length-1 || 1))*anchoUtil;
    const y = h - pad - (v/total)*altoUtil;
    return [x, y];
  });
  const path = puntos.map((p,i) => (i===0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = path + ` L ${puntos[puntos.length-1][0].toFixed(1)} ${h-pad} L ${puntos[0][0].toFixed(1)} ${h-pad} Z`;
  const grid = [0,25,50,75,100].map(p => {
    const y = h - pad - (p/100)*altoUtil;
    return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
            <text x="${pad-6}" y="${y+3}" text-anchor="end" font-family="Public Sans" font-size="9" fill="var(--muted)">${p}%</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" aria-label="Curva de avance acumulado">
    ${grid}
    <path d="${area}" fill="rgba(20,33,61,0.08)"/>
    <path d="${path}" fill="none" stroke="#14213d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${puntos.filter((_,i) => i%10===0 || i===puntos.length-1).map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#a67c52"/>`
    ).join("")}
  </svg>`;
}

/* ---------- SVG Radar ---------- */
function svgRadar(bloques){
  const cx = 250, cy = 180, r = 130;
  const n = bloques.length;
  const angles = bloques.map((_,i) => (Math.PI*2*i)/n - Math.PI/2);
  const ejes = angles.map(a => [cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
  const puntos = bloques.map((b,i) => {
    const rr = r * (b.pct/100);
    return [cx + Math.cos(angles[i])*rr, cy + Math.sin(angles[i])*rr];
  });
  const polygon = puntos.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const ejesSvg = ejes.map(e => `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const circulos = [0.25,0.5,0.75,1].map(p => `<circle cx="${cx}" cy="${cy}" r="${(r*p).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>`).join("");
  const labels = bloques.map((b,i) => {
    const lx = cx + Math.cos(angles[i])*(r+22);
    const ly = cy + Math.sin(angles[i])*(r+22);
    const anchor = Math.cos(angles[i]) > 0.3 ? "start" : Math.cos(angles[i]) < -0.3 ? "end" : "middle";
    return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-family="Public Sans" font-size="10" font-weight="700" fill="var(--navy)">${b.emoji} ${b.pct.toFixed(0)}%</text>
            <text x="${lx.toFixed(1)}" y="${(ly+12).toFixed(1)}" text-anchor="${anchor}" font-family="Public Sans" font-size="8" fill="var(--muted)">${esc(b.nombre.slice(0,16))}</text>`;
  }).join("");
  const puntosSvg = puntos.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#a67c52"/>`).join("");
  return `<svg viewBox="0 0 500 360" aria-label="Comparación por bloque">
    ${circulos}
    ${ejesSvg}
    <polygon points="${polygon}" fill="rgba(20,33,61,0.15)" stroke="#14213d" stroke-width="2"/>
    ${puntosSvg}
    ${labels}
  </svg>`;
}

/* ---------- Ejercicio automático ---------- */
function generarEjercicio(t){
  const otras = TECNICAS_FLAT.filter(x => x.bloqueId !== t.bloqueId).slice(0,3).map(x => x.c);
  const opcionesFinales = barajar([
    {texto: t.c, ok: true},
    {texto: otras[0] || "Contenido no relacionado con esta técnica.", ok: false},
    {texto: otras[1] || "Una afirmación incorrecta sobre esta técnica.", ok: false},
    {texto: "Una definición que no corresponde a la técnica descrita.", ok: false}
  ]);
  const correctaIdx = opcionesFinales.findIndex(o => o.ok);
  return {
    tipo:"quiz",
    consigna:`Elija la afirmación que corresponde correctamente a la técnica «${t.t}».`,
    opciones: opcionesFinales.map(o => o.texto),
    correcta: correctaIdx,
    retro:`${t.t}: ${t.c}`
  };
}
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "fb-box";
  if(ej.tipo === "quiz") renderQuiz(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "fb-box fb-" + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}
function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const L = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = el("button","opcion-btn");
    b.innerHTML = `<span class="opcion-letra">${L[i]}</span><span>${esc(op)}</span>`;
    b.addEventListener("click", () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c,j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok?"ok":"mal", ok?"✓ Correcto":"✗ Revise su respuesta", ej.retro || "");
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    });
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}
function agregarReintentar(cont, fn){

function toolModeloDjango(cont){
  cont.innerHTML = "<h4>Generador de modelo Django</h4><p>Complete clase y campos para obtener models.py.</p>";
  const form = el("div","d-flex gap-2 mb-2"); form.style.flexWrap = "wrap";
  const clase = document.createElement("input"); clase.className = "input-sm"; clase.placeholder = "Nombre de la clase"; clase.style.flex = "1 1 200px";
  const app = document.createElement("input"); app.className = "input-sm"; app.placeholder = "App"; app.style.flex = "1 1 150px";
  form.appendChild(clase); form.appendChild(app);
  cont.appendChild(form);
  const ta = document.createElement("textarea"); ta.className = "area-redaccion"; ta.rows = 6;
  ta.placeholder = "Un campo por línea: nombre, TipoField, args\ntitulo, CharField, max_length=200\ncurso, ForeignKey, Curso, on_delete=CASCADE";
  cont.appendChild(ta);
  const acciones = el("div","d-flex gap-2 mt-3");
  const btn = el("button","btn-sm-custom primary","Generar");
  const btnCopy = el("button","btn-sm-custom outline","Copiar");
  acciones.appendChild(btn); acciones.appendChild(btnCopy);
  cont.appendChild(acciones);
  const out = el("div","resultado-caja");
  cont.appendChild(out);
  const gen = () => {
    const nc = clase.value.trim() || "Modelo";
    const na = app.value.trim() || "app";

    (ta.value || "").split("\n").forEach(l => {

    });

  };

  btnCopy.addEventListener("click", () => { if(!out.textContent.trim()) out.textContent = gen(); navigator.clipboard.writeText(out.textContent).then(() => toast("✓ Copiado")); });
}

  t.addEventListener("click", () => cambiarModo(t.dataset.modo));
});

/* =====================================================================
   PWA · SERVICE WORKER + MANIFEST + INSTALACIÓN
   ===================================================================== */
const PWA_INSTALLED_KEY = "mini_lms_pwa_installed";
const PWA_DISMISSED_KEY = "mini_lms_pwa_dismissed";

function buildManifest(){
  const manifest = {
    name: "Mini LMS Completo · 100 técnicas",
    short_name: "Mini LMS",
    description: "100 técnicas para desarrollar un LMS con Python, Django y SQL. Funciona sin conexión.",
    start_url: ".",
    scope: ".",
    display: "standalone",
    orientation: "portrait-primary",
    background_color: "#fdfaf3",
    theme_color: "#14213d",
    lang: "es-CO",
    icons: [
      { src: svgDataURI("192"), sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
      { src: svgDataURI("512"), sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" });
  return URL.createObjectURL(blob);
}
function svgDataURI(size){
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14213d"/><stop offset="100%" stop-color="#a67c52"/>
    </linearGradient></defs>
    <rect width="512" height="512" rx="80" fill="url(#g)"/>
    <text x="256" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="200" font-weight="700" fill="#fdfaf3">LMS</text>
    <circle cx="440" cy="80" r="34" fill="#fdfaf3" opacity="0.95"/>
    <text x="440" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#14213d">100</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}
// Asignar manifest dinámico
document.getElementById("manifestLink").href = buildManifest();

// Registrar service worker (blob)
async function registrarSW(){
  if(!("serviceWorker" in navigator)) return;
  try {
    // El SW se genera como Blob para funcionar en un solo archivo
    const swCode = `
      const CACHE = 'mini-lms-pwa-v1';
      const CORE = [
        './',
        'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css',
        'https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap'
      ];
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(CORE).catch(()=>{})).then(()=>self.skipWaiting()));
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(()=>self.clients.claim()));
      });
      self.addEventListener('fetch', e => {
        const url = new URL(e.request.url);
        if(e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
            return res;
          }).catch(() => caches.match('./')))
        );
      });
    `;
    const blob = new Blob([swCode], { type:"application/javascript" });
    const swURL = URL.createObjectURL(blob);
    const reg = await navigator.serviceWorker.register(swURL, { scope:"./" });
    console.log("SW registrado", reg.scope);
    toast("✓ App lista sin conexión");
  } catch(e){
    console.warn("SW no disponible:", e);
  }
}

// Estado online/offline
function actualizarEstadoConexion(){
  const pill = $("#statusPill");
  const txt = $("#statusText");
  if(navigator.onLine){
    pill.classList.remove("offline"); pill.classList.add("online");
    txt.textContent = "En línea";
  } else {
    pill.classList.remove("online"); pill.classList.add("offline");
    txt.textContent = "Sin conexión";
  }
}
window.addEventListener("online", actualizarEstadoConexion);
window.addEventListener("offline", actualizarEstadoConexion);
actualizarEstadoConexion();

// Instalación PWA
let deferredPrompt = null;
const pwaBanner = $("#pwaBanner");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem(PWA_INSTALLED_KEY) && !localStorage.getItem(PWA_DISMISSED_KEY)){
    pwaBanner.classList.add("show");
    $("#btnInstall").style.display = "inline-block";
  }
});
$("#pwaInstall").addEventListener("click", async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if(outcome === "accepted"){
    localStorage.setItem(PWA_INSTALLED_KEY, "1");
    toast("✓ App instalada");
  }
  deferredPrompt = null;
  pwaBanner.classList.remove("show");
});
$("#pwaDismiss").addEventListener("click", () => {
  localStorage.setItem(PWA_DISMISSED_KEY, "1");
  pwaBanner.classList.remove("show");
});
$("#btnInstall").addEventListener("click", () => {
  if(deferredPrompt){ $("#pwaInstall").click(); }
  else toast("Use el menú del navegador → Instalar app");
});
window.addEventListener("appinstalled", () => {
  localStorage.setItem(PWA_INSTALLED_KEY, "1");
  pwaBanner.classList.remove("show");
  toast("✓ App instalada");
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
initTema();
cambiarModo("dashboard");
registrarSW();
</script>
