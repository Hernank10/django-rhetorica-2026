    {id:"l52", nombre:"Punto, punto y coma y dos puntos",
     concepto:"El punto cierra una oración o un párrafo. El punto y coma separa ideas relacionadas de cierta extensión. Los dos puntos anuncian enumeración, cita o conclusión.",
     ejemplo:"«Estudió mucho; sin embargo, no aprobó» (punto y coma). «Trajo tres cosas: pan, vino y queso» (dos puntos).",
     ejercicio:{tipo:"fill",
       consigna:"Coloca el signo adecuado (punto, punto y coma o dos puntos).",
       texto:"«Trajo lo necesario ___ pan, agua y mantas» · «Terminó el trabajo ___ luego se fue a casa» · «No estudió ___ por eso reprobó»",
       respuestas:[["dos puntos",":"],["punto","."],["punto y coma",";"]],
       retro:"Dos puntos anuncian; punto y coma relaciona; punto cierra. Cada signo tiene una función propia."}},

    {id:"l53", nombre:"Comillas y guiones en diálogos",
     concepto:"Las comillas (« », “ ”, ' ') enmarcan citas, palabras extranjeras o usos irónicos. Los guiones (—) introducen diálogos en narraciones. Se diferencian de las rayas (—) y de los guiones cortos (-).",
     ejemplo:"«Dijo: “No vendré mañana”». En narrativa: «—No vendré mañana —respondió Ana—. Tengo trabajo.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la función principal de las comillas?",
       opciones:["Separar ideas de un párrafo","Enmarcar citas textuales, palabras extranjeras o usos especiales","Indicar una pausa larga","Unir palabras compuestas"],
       correcta:1,
       retro:"Las comillas enmarcan lo que otro dijo o lo que se usa con valor especial. También se usan para títulos dentro de un texto o para ironía."}},

    {id:"l54", nombre:"Paréntesis y corchetes",
     concepto:"Los paréntesis ( ) introducen información aclaratoria o incidental. Los corchetes [ ] se usan para añadir aclaraciones dentro de una cita o para encerrar un paréntesis dentro de otro.",
     ejemplo:"«Cervantes (autor del Quijote) nació en Alcalá.» «El autor afirma: “La lectura [comprensiva] exige tiempo”.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usan los corchetes en lugar de los paréntesis?",
       opciones:["Siempre indistintamente.","Cuando hay que añadir una aclaración dentro de una cita textual o un paréntesis dentro de otro.","Solo en matemáticas.","Para indicar interrogación."],
       correcta:1,
       retro:"Los corchetes son más específicos: intervienen cuando se cita o cuando hay que anidar un paréntesis dentro de otro."}},

    {id:"l55", nombre:"Acentuación: reglas generales",
     concepto:"Las palabras se clasifican según su sílaba tónica en agudas, graves (o llanas), esdrújulas y sobresdrújulas. Las agudas llevan tilde si terminan en -n, -s o vocal; las graves, si NO terminan en -n, -s o vocal; las esdrújulas y sobresdrújulas siempre.",
     ejemplo:"«Canción» (aguda, termina en -n → tilde). «Árbol» (grave, termina en -l → tilde). «Médico» (esdrújula → siempre tilde).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada palabra según su acento.",
       categorias:["Aguda","Grave","Esdrújula"],
       items:[
         {texto:"camión", cat:0},
         {texto:"árbol", cat:1},
         {texto:"médico", cat:2},
         {texto:"papel (sin tilde)", cat:0},
         {texto:"lápiz", cat:1},
         {texto:"pájaro", cat:2}
       ],
       retro:"Agudas: última sílaba. Graves: penúltima. Esdrújulas: antepenúltima. Las reglas dependen de la terminación de la palabra."}},

    {id:"l56", nombre:"Acentuación diacrítica",
     concepto:"La tilde diacrítica distingue palabras iguales que cumplen funciones distintas: el/él, tu/tú, mi/mí, te/té, mas/más, si/sí, de/dé, se/sé.",
     ejemplo:"«El libro» (artículo) / «Él lee» (pronombre). «Tu casa» (posesivo) / «Tú lees» (pronombre). «Mas» (=pero) / «Más» (=cantidad).",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"___ dijo que vendría (él/el). · ___ casa es grande (tu/tú). · Quiero ___ café (te/té).",
       respuestas:[["el","él"],["tu","tú"],["te","té"]],
       retro:"La tilde diacrítica distingue funciones. Sin ella, el lector tendría que deducir del contexto, con riesgo de ambigüedad."}},

    {id:"l57", nombre:"Palabras juntas o separadas",
     concepto:"Algunas secuencias se escriben juntas (aunque, porque, conque, sino, asimismo) y otras separadas (aun que no es correcto, por que / porque / porqué / por qué). Reconocer la diferencia evita errores frecuentes.",
     ejemplo:"«Porque» (causa: «No vino porque llovía»). «Por qué» (interrogativo: «¿Por qué no vino?»). «Porqué» (sustantivo: «No sé el porqué»). «Por que» (relativo: «La razón por que vino»).",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"No vino ___ llovía (porque / por qué). · ¿___ no me avisaste? (Por qué / Porque). · No entiendo el ___ de su enfado (porqué / por qué).",
       respuestas:[["porque"],["por que","por qué"],["porque","porqué"]],
       retro:"Porque (conjunción causal), por qué (interrogativo), porqué (sustantivo), por que (relativo). Cada forma tiene su función."}},

    {id:"l58", nombre:"Homófonas: b/v, ll/y, c/s/z",
     concepto:"Existen palabras que suenan igual pero se escriben con letras distintas: haber/a ver, tubo/tuvo, halla/haya/aya, cayó/calló, casa/caza. Conocer la diferencia evita errores graves.",
     ejemplo:"«Haber» (verbo auxiliar) / «A ver» (mirar). «Tubo» (cilindro) / «Tuvo» (verbo tener). «Casa» (vivienda) / «Caza» (persecución de animales).",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la forma correcta.",
       texto:"Voy ___ qué pasa (a ver / haber). · ___ un problema (Hubo / Ubo). · Se ___ al suelo (calló / cayó). · Iremos de ___ (caza / casa).",
       respuestas:[["a ver"],["hubo"],["cayo","cayó"],["caza"]],
       retro:"Estas parejas se distinguen por significado, no por sonido. La lectura atenta del contexto es la clave."}},

    {id:"l59", nombre:"Mayúsculas y minúsculas",
     concepto:"Se escriben con mayúscula: inicio de texto y de oración, nombres propios, títulos de obras (con criterios), siglas, tras dos puntos en ciertos casos. Los días, meses y estaciones van con minúscula.",
     ejemplo:"«El lunes de enero fuimos al Prado.» «Cervantes escribió el Quijote.» «La ONU se fundó en 1945.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas palabras debe escribirse con minúscula?",
       opciones:["Nombres de personas.","Días de la semana y meses del año.","Nombres de países.","Siglas de organismos."],
       correcta:1,
       retro:"En español los días de la semana, los meses y las estaciones se escriben con minúscula. Es una diferencia con el inglés."}},

    {id:"l60", nombre:"Abreviaturas, siglas y acrónimos",
     concepto:"Las abreviaturas se cierran con punto (pág., Sr.). Las siglas se escriben sin puntos ni espacios y en mayúsculas (ONU, ADN). Los acrónimos, cuando se lexicalizan, pueden escribirse como palabras (ovni, sida).",
     ejemplo:"«pág. 23» (abreviatura). «La ONU» (sigla). «El sida» (acrónimo lexicalizado). «El ovni» (acrónimo lexicalizado).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada forma.",
       categorias:["Abreviatura","Sigla","Acrónimo"],
       items:[
         {texto:"pág.", cat:0},
         {texto:"ONU", cat:1},
         {texto:"ovni", cat:2},
         {texto:"etc.", cat:0},
         {texto:"ADN", cat:1},
         {texto:"sida", cat:2}
       ],
       retro:"Abreviatura: con punto y minúsculas. Sigla: mayúsculas sin puntos. Acrónimo: lexicalizado como palabra común."}}
  ]
},

/* ============ BLOQUE 7 · PRODUCCIÓN TEXTUAL ============ */
{
  id:"b7", nombre:"Producción textual y redacción", emoji:"📝",
  desc:"Planificar, redactar y revisar textos: párrafos, cohesión, coherencia, adecuación.",
  tecnicas:[
    {id:"l61", nombre:"Planificación del texto",
     concepto:"Antes de escribir, hay que decidir el tema, el propósito, el destinatario y la estructura. La planificación evita la escritura errática y los textos desorganizados.",
     ejemplo:"Para un ensayo: lluvia de ideas, selección, esquema (introducción, tres argumentos, conclusión) y asignación de extensión.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos para planificar un texto.",
       items:[
         "Definir el tema y el propósito del texto.",
         "Identificar el destinatario y el registro adecuado.",
         "Generar ideas mediante lluvia de ideas.",
         "Seleccionar y ordenar las ideas en un esquema.",
         "Asignar una extensión aproximada a cada parte."
       ],
       retro:"Planificar es decidir antes de escribir. Sin este paso, la redacción se vuelve un ejercicio de corrección permanente."}},

    {id:"l62", nombre:"Redactar la tesis o idea principal",
     concepto:"En textos argumentativos la tesis es la afirmación central que se va a defender. Debe ser clara, discutible y sostenible con argumentos. Suele aparecer en la introducción.",
     ejemplo:"Tesis: «La lectura digital no sustituye a la lectura en papel porque requiere procesos cognitivos distintos.»",
     ejercicio:{tipo:"fill",
       consigna:"Redacta una tesis clara para un texto sobre las redes sociales.",
       texto:"Posible tesis: las redes sociales ___, porque ___.",
       respuestas:[["no son neutras","no son inocentes","no son solo herramientas de comunicacion","tienen efectos ambivalentes","pueden ser beneficiosas y perjudiciales","transforman la forma de relacionarnos","no son ni buenas ni malas en si mismas"]],
       retro:"Una buena tesis es discutible, concreta y da pie a argumentos. Evita formulaciones vagas como «las redes sociales son importantes»."}},

    {id:"l63", nombre:"El párrafo: estructura y unidad",
     concepto:"El párrafo es la unidad mínima de composición escrita. Suele tener una idea principal y varias secundarias. Debe haber unidad temática y coherencia interna entre sus oraciones.",
     ejemplo:"Un párrafo sobre «los beneficios del ejercicio» no debería mezclar, sin transición, datos sobre nutrición. Cada párrafo trata una idea.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué hace que un párrafo sea unitario?",
       opciones:["Que tenga al menos diez líneas.","Que todas sus oraciones desarrollen una misma idea principal.","Que empiece siempre con una cita.","Que tenga una sola oración."],
       correcta:1,
       retro:"La unidad del párrafo es temática: todas las oraciones giran en torno a una misma idea."}},

    {id:"l64", nombre:"Cohesión mediante conectores",
     concepto:"La cohesión es el conjunto de mecanismos que enlazan las partes del texto: conectores, pronombres, sinónimos, elipsis. Sin cohesión, el texto se fragmenta y pierde fluidez.",
     ejemplo:"«Quería ir al cine. Sin embargo, no tenía dinero. Por eso, se quedó en casa.» Los conectores articulan las ideas.",
     ejercicio:{tipo:"fill",
       consigna:"Completa con el conector adecuado.",
       texto:"Estudió mucho. ___, no aprobó. · Llegó tarde; ___, se disculpó. · No tengo dinero; ___, no puedo ir.",
       respuestas:[["sin embargo","no obstante","aunque","pero"],["ademas","asimismo","por eso","entonces","luego"],["por lo tanto","por eso","en consecuencia","asi que","así que"]],
       retro:"Los conectores no son adornos: revelan la relación lógica y evitan que el lector tenga que adivinarla."}},

    {id:"l65", nombre:"Coherencia global del texto",
     concepto:"La coherencia es la unidad de sentido del texto: todas sus partes contribuyen al mismo propósito, sin contradicciones y con una progresión temática adecuada.",
     ejemplo:"Un texto sobre «la contaminación del agua» que dedica tres párrafos a la contaminación del aire carece de coherencia global.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estos problemas afecta a la COHERENCIA global, no a la cohesión?",
       opciones:["Falta un conector entre dos oraciones.","Un párrafo se contradice con el anterior.","Hay una falta de ortografía.","Una oración es demasiado larga."],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. Una contradicción es un fallo de coherencia."}},

    {id:"l66", nombre:"Adecuación al destinatario y registro",
     concepto:"Un texto debe adaptarse a su destinatario, al contexto y al registro: formal o informal, técnico o divulgativo. Un mismo contenido cambia según a quién va dirigido.",
     ejemplo:"Un texto científico sobre el cambio climático no se redacta igual que un folleto para niños de primaria ni que un tuit.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión según el registro.",
       categorias:["Formal","Informal"],
       items:[
         {texto:"«Le agradezco su pronta respuesta.»", cat:0},
         {texto:"«Oye, ¿me pasas el dato?»", cat:1},
         {texto:"«Estimado profesor: me dirijo a usted...»", cat:0},
         {texto:"«¡Qué fuerte, tío!»", cat:1},
         {texto:"«Adjunto encontrará el documento solicitado.»", cat:0}
       ],
       retro:"El registro se elige según el destinatario y la situación. Un mismo mensaje puede decirse de muchas maneras."}},

    {id:"l67", nombre:"Introducción y conclusión",
     concepto:"La introducción presenta el tema y anticipa la tesis; la conclusión cierra el texto recuperando la tesis y sintetizando los argumentos, sin introducir información nueva.",
     ejemplo:"Introducción: «La lectura en pantalla ha crecido. ¿Es equivalente a la lectura en papel?» Conclusión: «Como se ha mostrado, los procesos cognitivos difieren; conviene, por tanto, no equipararlas sin más.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué NO debe hacerse en una conclusión?",
       opciones:["Recuperar la tesis planteada.","Sintetizar los argumentos principales.","Introducir un argumento nuevo y decisivo.","Cerrar con una reflexión final."],
       correcta:2,
       retro:"La conclusión cierra; si se introduce un argumento nuevo, el lector siente que el texto queda abierto y sin justificar."}},

    {id:"l68", nombre:"Revisión y corrección del borrador",
     concepto:"Revisar es leer el propio texto con distancia crítica: ortografía, puntuación, coherencia, cohesión, adecuación y claridad. Se recomienda leer en voz alta y esperar un tiempo entre escritura y revisión.",
     ejemplo:"Primera lectura: ortografía. Segunda: claridad de las oraciones. Tercera: cohesión entre párrafos. Cuarta: coherencia global.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos de una revisión eficaz.",
       items:[
         "Dejar reposar el texto un tiempo para leerlo con distancia.",
         "Revisar la ortografía y la puntuación.",
         "Comprobar la claridad y la longitud de las oraciones.",
         "Verificar la cohesión entre párrafos (conectores, pronombres).",
         "Leer el texto completo para comprobar su coherencia global."
       ],
       retro:"Revisar por capas es más eficaz que intentar corregirlo todo a la vez. Cada pasada se centra en un aspecto."}},

    {id:"l69", nombre:"Parafrasear y resumir",
     concepto:"Parafrasear es decir lo mismo con otras palabras, manteniendo el sentido. Resumir es reducir el texto a sus ideas esenciales. Ambos demuestran comprensión profunda.",
     ejemplo:"Original: «La lectura comprensiva exige un lector activo.» Paráfrasis: «Para comprender un texto hay que implicarse y trabajar con él.» Resumen: «Leer de verdad requiere actividad del lector.»",
     ejercicio:{tipo:"open",
       consigna:"Parafrasea en dos o tres líneas: «El lenguaje no solo describe la realidad: también la construye».",
       criterios:[
         "Usé mis propias palabras, no copié la estructura literal.",
         "Mantuve el sentido completo de la idea original.",
         "El resultado se entiende sin leer el texto fuente."
       ],
       modelo:"El lenguaje no se limita a nombrar lo que ya existe: también crea marcos de interpretación, influye en cómo percibimos el mundo y, en ese sentido, contribuye a formar la realidad tal como la vivimos."}},

    {id:"l70", nombre:"Citar y referenciar fuentes",
     concepto:"Citar es indicar el origen de una idea o frase ajena. Se hace con comillas para la cita textual y con referencia al autor y año. Evita el plagio y da rigor al texto.",
     ejemplo:"Cita textual: «La lectura es un proceso activo» (Solé, 1992). Paráfrasis: según Solé (1992), leer requiere implicación del lector.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la función principal de citar fuentes?",
       opciones:["Adornar el texto con nombres famosos.","Reconocer la autoría ajena y dar rigor, evitando el plagio.","Aumentar el número de palabras.","Mostrar que se ha leído mucho."],
       correcta:1,
       retro:"Citar es un acto de honestidad intelectual: reconoce el trabajo ajeno y permite al lector verificar la información."}}
  ]
},

/* ============ BLOQUE 8 · TIPOLOGÍAS TEXTUALES ============ */
{
  id:"b8", nombre:"Tipologías textuales y géneros", emoji:"📄",
  desc:"Narrativo, descriptivo, expositivo, argumentativo, periodístico, publicitario y digital.",
  tecnicas:[
    {id:"l71", nombre:"Texto narrativo: cuento, novela, fábula",
     concepto:"El texto narrativo cuenta hechos reales o ficticios en una secuencia temporal. Elementos: narrador, personajes, acción, espacio, tiempo. Subgéneros: cuento, novela, fábula, leyenda, mito.",
     ejemplo:"Un cuento suele ser breve y con un solo conflicto; la novela, extensa y con tramas entrelazadas; la fábula, breve y con moraleja, a menudo con animales personificados.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada subgénero narrativo por sus rasgos.",
       categorias:["Cuento","Novela","Fábula"],
       items:[
         {texto:"Breve, un solo conflicto, final generalmente sorpresivo.", cat:0},
         {texto:"Extenso, varios personajes, tramas entrelazadas.", cat:1},
         {texto:"Breve, con animales personificados y moraleja final.", cat:2},
         {texto:"«El zorro y las uvas»", cat:2},
         {texto:"«Cien años de soledad»", cat:1}
       ],
       retro:"El cuento concentra, la novela expande, la fábula enseña. Reconocer el subgénero orienta la lectura."}},

    {id:"l72", nombre:"Texto descriptivo",
     concepto:"Describe cómo son personas, lugares, objetos o procesos. Puede ser objetiva (técnica) o subjetiva (literaria). Usa gran cantidad de adjetivos y, a menudo, los cinco sentidos.",
     ejemplo:"Objetiva: «La casa tiene 120 m², tres habitaciones y dos baños.» Subjetiva: «La casa olía a cedro y a tiempo detenido.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada descripción.",
       categorias:["Objetiva","Subjetiva"],
       items:[
         {texto:"«El animal mide 1,20 m y pesa 45 kg.»", cat:0},
         {texto:"«Sus ojos eran dos pozos de tristeza.»", cat:1},
         {texto:"«La habitación tiene 4 m de largo por 3 de ancho.»", cat:0},
         {texto:"«El viento acariciaba las ramas con dulzura.»", cat:1}
       ],
       retro:"La descripción objetiva informa; la subjetiva transmite sensaciones. Ambas usan adjetivos, pero con función distinta."}},

    {id:"l73", nombre:"Texto expositivo: divulgación y académico",
     concepto:"El texto expositivo transmite información de forma ordenada y clara. Puede ser divulgativo (para público general) o académico (para especialistas). Predominan la función referencial y los datos.",
     ejemplo:"Un artículo de divulgación científica explica un tema complejo con lenguaje accesible. Un manual académico usa terminología técnica y referencias.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la diferencia principal entre un texto divulgativo y uno académico?",
       opciones:["El divulgativo es más largo.","El divulgativo adapta el lenguaje al público general; el académico usa terminología especializada.","El académico no tiene autor.","El divulgativo no usa datos."],
       correcta:1,
       retro:"Ambos exponen, pero con destinatarios distintos. El divulgativo traduce; el académico profundiza con terminología especializada."}},

    {id:"l74", nombre:"Texto argumentativo: ensayo y artículo",
     concepto:"El texto argumentativo defiende una tesis con razones. Estructura: introducción con tesis, desarrollo con argumentos y conclusión. Subgéneros: ensayo, artículo de opinión, columna, editorial.",
     ejemplo:"Un ensayo explora una idea con libertad; un artículo de opinión defiende una postura breve; un editorial expresa la línea del medio.",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de un texto argumentativo.",
       items:[
         "Introducción que presenta el tema y anticipa la tesis.",
         "Exposición de la tesis de forma clara.",
         "Desarrollo con argumentos y ejemplos.",
         "Refutación de posibles contraargumentos.",
         "Conclusión que recupera la tesis y cierra el razonamiento."
       ],
       retro:"Tesis → argumentos → refutación → conclusión. Este es el esqueleto básico de la argumentación."}},

    {id:"l75", nombre:"Texto periodístico: noticia, reportaje, entrevista",
     concepto:"Los géneros periodísticos informan sobre hechos de actualidad. La noticia responde a qué, quién, cuándo, dónde, cómo y por qué. El reportaje profundiza; la entrevista recoge las palabras de alguien.",
     ejemplo:"Una noticia sobre un incendio: qué (incendio), quién (afectados), cuándo (esta madrugada), dónde (sierra norte), cómo (por una chispa), por qué (sequía).",
     ejercicio:{tipo:"fill",
       consigna:"Identifica los elementos básicos de la noticia.",
       texto:"«Ayer, en Sevilla, un incendio destruyó un mercado tras un cortocircuito.» Qué: ___ · Quién / qué afectado: ___ · Cuándo: ___ · Dónde: ___",
       respuestas:[["incendio","un incendio"],["el mercado","mercado"],["ayer"],["sevilla"]],
       retro:"Las 6 W del periodismo (qué, quién, cuándo, dónde, cómo, por qué) organizan la información en la noticia."}},

    {id:"l76", nombre:"Texto publicitario y propagandístico",
     concepto:"El texto publicitario busca persuadir para consumir; el propagandístico, para adherir a una idea. Usan eslóganes, imágenes, apelación emocional y figuras retóricas.",
     ejemplo:"«Porque tú lo vales» (publicidad). «El cambio empieza contigo» (propaganda). Ambos apelan a la emoción, no a la razón.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada mensaje.",
       categorias:["Publicidad","Propaganda"],
       items:[
         {texto:"«Nueva crema: piel radiante en 7 días.»", cat:0},
         {texto:"«Vota por un futuro mejor.»", cat:1},
         {texto:"«Solo hoy: 50 % de descuento.»", cat:0},
         {texto:"«Únete a la causa por el clima.»", cat:1}
       ],
       retro:"La publicidad vende productos o servicios; la propaganda, ideas o causas. Ambas persuaden, pero su objeto es distinto."}},

    {id:"l77", nombre:"Texto instructivo: recetas, normas, manuales",
     concepto:"Los textos instructivos indican cómo hacer algo. Predomina el imperativo o el infinitivo, y suelen estructurarse en pasos ordenados. Ejemplos: recetas, reglamentos, manuales, prospectos.",
     ejemplo:"«Precaliente el horno a 180 °C. Mezcle la harina con el azúcar. Hornee durante 25 minutos.»",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos de una receta sencilla.",
       items:[
         "Precalentar el horno a 180 °C.",

    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  /* flashcard */
  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  /* ejercicio */
  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  /* cuaderno */
  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, dudas, ejemplos propios o el resultado del ejercicio…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  /* navegación */
  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  /* eventos */
  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Alguna respuesta válida: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-family:system-ui,sans-serif;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
</body>
</html>
