<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Lengua Castellana · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#efe9fb;
    --paper:#ffffff;
    --paper-2:#fbf8ff;
    --ink:#1e1b31;
    --muted:#6b6785;
    --line:#d8d2ee;
    --line-2:#c4bce0;
    --accent:#7c3aed;
    --accent-dark:#5b21b6;
    --accent-soft:#f3e8ff;
    --rose:#be185d;
    --rose-soft:#fce7f3;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(45,20,80,.06), 0 12px 30px rgba(45,20,80,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Georgia","Iowan Old Style","Times New Roman",serif;
    background:
      radial-gradient(circle at 15% 0%, #f8f3ff 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:24px; line-height:1;
    background:var(--accent-soft);
    border:1px solid #dcc7fb;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    flex:0 0 auto;
  }
  .brand h1{font-size:16.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600; font-family:system-ui,sans-serif;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#e2dbf5; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#7c3aed,#be185d); transition:width .4s;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#f5f0ff; border-color:#a78bfa;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#faf7ff; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.6px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#f5f0ff;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    background:var(--rose-soft); color:var(--rose);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#e8e2f7; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--rose)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:13px; line-height:1.35; color:#3d3550;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#f5f0ff;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--rose));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #dcc7fb; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:25px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(124,58,237,.22); border-color:var(--accent);}

  /* ---------- FLASHCARD (papel rayado) ---------- */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fff;
    background-image:
      linear-gradient(transparent 27px, rgba(124,58,237,.15) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
    box-shadow:inset 22px 0 0 -21px #f9a8d4;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #dcc7fb;
    background-color:#fbf7ff;
    box-shadow:inset 22px 0 0 -21px #a78bfa;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:16px; line-height:28px; color:#241e3d;}
  .fc-back p{color:#3b2c62;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#a79fc5; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  /* ---------- SECCIONES ---------- */
  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-family:system-ui,sans-serif; font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#332b50;
    background:#faf7ff; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#faf7ff; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#e8e2f7; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#241e3d;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--accent);
    background:#faf7ff; color:var(--accent-dark); font-weight:700;
    padding:3px 8px; min-width:120px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#f3e8ff; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-family:system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#f1ecfa; border:1.5px dashed var(--line-2);}
  .seq{background:#faf7ff; border:1.5px solid #dcc7fb;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#c4bce0; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#faf7ff;}
  .seq .ord-item{border-color:#dcc7fb;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#f1ecfa; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-family:system-ui,sans-serif; font-size:13px; color:#4b436a; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:27px;
    color:#241e3d; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fff;
    background-image:linear-gradient(transparent 26px, rgba(124,58,237,.15) 26px 27px);
    background-size:100% 27px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,58,237,.13);}
  textarea::placeholder{color:#a79fc5; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:520px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--accent-soft); border:1px solid #dcc7fb; color:#4c1d95;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#faf7ff; border-left:3px solid var(--rose);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#5b1d3d;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--rose); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(30,15,60,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:21px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">✒️</div>
    <div>
      <h1>Cuaderno de Lengua Castellana · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · comprensión, léxico, gramática, literatura</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS EN 10 BLOQUES · LENGUA CASTELLANA (6.º A 11.º)
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · COMPRENSIÓN LITERAL ============ */
{
  id:"b1", nombre:"Comprensión literal", emoji:"🔎",
  desc:"Leer lo que el texto dice explícitamente: ideas, datos, personajes, tiempo y espacio.",
  tecnicas:[
    {id:"l1", nombre:"Lectura global o panorámica",
     concepto:"Primera lectura rápida del texto completo para captar su sentido general antes de analizar detalles. Se revisan títulos, primeras líneas de cada párrafo y conclusión. Es la base de toda comprensión.",
     ejemplo:"Antes de estudiar un artículo de tres páginas lo recorres en dos minutos: ya sabes que trata de la deforestación amazónica, que tiene tres causas principales y que termina con propuestas.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es el objetivo principal de una lectura global?",
       opciones:["Memorizar todos los datos del texto","Captar el sentido general antes de profundizar","Corregir la ortografía del texto","Traducir el texto a otro idioma"],
       correcta:1,
       retro:"La lectura global no busca retener detalles, sino hacerse un mapa mental del texto: tema, estructura y tono."}},

    {id:"l2", nombre:"Identificar la idea principal explícita",
     concepto:"En muchos textos la idea principal está enunciada de forma directa, generalmente en la primera o la última oración del párrafo. Reconocerla es el primer paso para comprender la estructura del texto.",
     ejemplo:"«La lectura comprensiva exige un lector activo. Este debe preguntarse constantemente qué dice el texto, cómo lo dice y por qué lo dice.» La primera oración es la idea principal.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la idea principal del siguiente fragmento.",
       texto:"«La poesía no está hecha de ideas, sino de palabras. Por eso, cambiar una sola palabra puede alterar todo el poema.»",
       respuestas:[["la poesia no esta hecha de ideas sino de palabras","la poesia esta hecha de palabras","la poesia se construye con palabras"]],
       retro:"La primera oración anuncia la tesis; la segunda la explica. La idea principal es que la poesía es, ante todo, un trabajo sobre las palabras."}},

    {id:"l3", nombre:"Distinguir ideas principales y secundarias",
     concepto:"Las ideas principales sostienen el texto; las secundarias las explican, ejemplifican o amplían. Se suele subrayar la principal con una línea y las secundarias con otra, o marcarlas con colores distintos.",
     ejemplo:"Idea principal: «La contaminación del aire afecta la salud». Ideas secundarias: cifras de enfermedades respiratorias; ciudades más afectadas; medidas recomendadas.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado según sea idea principal o secundaria de un texto sobre el reciclaje.",
       categorias:["Idea principal","Idea secundaria"],
       items:[
         {texto:"El reciclaje reduce el volumen de residuos que llega a los vertederos.", cat:0},
         {texto:"En 2023 se reciclaron 1,2 millones de toneladas de papel en el país.", cat:1},
         {texto:"Reciclar exige separar los residuos en origen.", cat:1},
         {texto:"Reciclar es una estrategia clave para frenar la crisis ambiental.", cat:0}
       ],
       retro:"Las ideas principales son generales y sostienen la argumentación; las secundarias aportan datos o detalles concretos."}},

    {id:"l4", nombre:"Localizar información específica",
     concepto:"Buscar un dato concreto dentro del texto sin leerlo todo. Se llama técnica del barrido o scanning. Se localizan fechas, nombres, cifras o palabras clave.",
     ejemplo:"Para saber en qué año se publicó una novela, recorres el texto buscando años con los ojos, sin detenerte en las descripciones.",
     ejercicio:{tipo:"fill",
       consigna:"Localiza los datos en el fragmento.",
       texto:"«Miguel de Cervantes publicó la primera parte del Quijote en 1605 y la segunda en 1615, diez años después.» Primera parte: ___ · Segunda parte: ___",
       respuestas:[["1605"],["1615"]],
       retro:"Localizar no es leer: es buscar. Los ojos saltan por el texto hasta encontrar el dato que interesa."}},

    {id:"l5", nombre:"Reconocer personajes y acciones",
     concepto:"En los textos narrativos hay que identificar quiénes actúan y qué hacen. Los personajes pueden ser principales o secundarios; las acciones, físicas, mentales o verbales.",
     ejemplo:"En un fragmento: «Ana abrió la carta temblando y no pudo contener las lágrimas.» Personaje: Ana. Acciones: abrir la carta, temblar, no contener las lágrimas.",
     ejercicio:{tipo:"fill",
       consigna:"Identifica personaje y acción principal.",
       texto:"«El viejo pescador arrojó la red al mar y esperó en silencio.» Personaje principal: ___ · Acción principal: ___",
       respuestas:[["viejo pescador","pescador","el viejo pescador","el pescador"],["arrojar la red","arrojo la red","lanzar la red","tirar la red","arrojar"]],
       retro:"En la narración, el personaje y la acción son la unidad mínima de sentido. Sin ellos no hay relato."}},

    {id:"l6", nombre:"Identificar espacio y tiempo",
     concepto:"Todo texto narrativo se sitúa en un lugar (espacio) y en un momento (tiempo). Pueden estar indicados explícitamente o deducirse de las marcas textuales: adverbios, formas verbales, referencias culturales.",
     ejemplo:"«Aquella mañana de verano, en un pueblo de la sierra, sonó la campana.» Espacio: pueblo de la sierra. Tiempo: una mañana de verano.",
     ejercicio:{tipo:"fill",
       consigna:"Indica espacio y tiempo en el fragmento.",
       texto:"«En el invierno de 1936, en una aldea perdida de los Pirineos, la nieve cubrió todo durante semanas.» Espacio: ___ · Tiempo: ___",
       respuestas:[["aldea de los Pirineos","los Pirineos","aldea perdida de los Pirineos","una aldea perdida de los Pirineos"],["invierno de 1936","el invierno de 1936","1936"]],
       retro:"Las marcas espaciales y temporales organizan el relato: sin ellas, la historia flota sin ubicación."}},

    {id:"l7", nombre:"Secuenciación de hechos",
     concepto:"Ordenar cronológicamente los hechos que presenta el texto. Es especialmente útil cuando la narración no sigue un orden lineal, sino que usa saltos, retrospectivas o anticipaciones.",
     ejemplo:"Si el texto empieza contando el regreso del protagonista y luego narra su infancia, la secuencia real es: infancia → viaje → regreso.",
     ejercicio:{tipo:"order",
       consigna:"Ordena cronológicamente los hechos del relato.",
       items:[
         "El protagonista nace en un pueblo costero.",
         "A los veinte años emigra a la ciudad para estudiar.",
         "Trabaja diez años en una empresa y forma una familia.",
         "Regresa al pueblo para cuidar de sus padres ancianos."
       ],
       retro:"Los textos literarios no siempre respetan el orden temporal. Reconstruir la secuencia aclara las causas y consecuencias."}},

    {id:"l8", nombre:"Reconocer el tema del texto",
     concepto:"El tema es la cuestión general que aborda el texto, expresada en una frase breve (no confundir con el argumento, que es la sucesión de hechos). Se formula con un sintagma nominal: «la soledad», «la amistad», «la memoria».",
     ejemplo:"Un cuento sobre una anciana que espera cartas que nunca llegan tiene como tema «la soledad de la vejez», no «una anciana que espera cartas» (eso sería el argumento).",
     ejercicio:{tipo:"fill",
       consigna:"Formula el tema en cinco palabras o menos.",
       texto:"«La obra narra la historia de un soldado que vuelve del frente y descubre que su pueblo ya no lo reconoce.» Tema: ___",
       respuestas:[["el desarraigo del retorno","el regreso y el desarraigo","la incomprension del retorno","el desarraigo","el retorno imposible","la vuelta al hogar"]],
       retro:"El tema es una abstracción: se formula con un sustantivo y no incluye nombres propios ni acciones concretas."}},

    {id:"l9", nombre:"Comprensión de consignas y enunciados",
     concepto:"En la escuela y en los exámenes, comprender lo que se pide es tan importante como saber la respuesta. Hay que identificar el verbo de la tarea (analiza, explica, compara, justifica) y las condiciones.",
     ejemplo:"«Explica las causas de la contaminación y pon dos ejemplos» pide explicar + ejemplificar. Responder solo con ejemplos sería incompleto.",
     ejercicio:{tipo:"fill",
       consigna:"Identifica cuántas tareas pide cada consigna.",
       texto:"«Compara los dos textos y señala tres diferencias entre sus personajes.» Número de tareas: ___ · Verbo principal de la consigna: ___",
       respuestas:[["2","dos"],["compara","comparar"]],
       retro:"La consigna «compara y señala tres diferencias» pide dos acciones. La primera es comparar; la segunda, señalar."}},

    {id:"l10", nombre:"Vocabulario en contexto literal",
     concepto:"Reconocer el significado de una palabra tal como aparece en el texto, usando las palabras que la rodean como pistas. Distinto de la inferencia léxica, aquí se trata de verificar el sentido literal en contexto.",
     ejemplo:"«El toro embistió con furia contra la barrera.» «Embistió» significa «atacó con violencia», como indican «toro», «furia» y «contra la barrera».",
     ejercicio:{tipo:"quiz",
       consigna:"«El río se desbordó tras las lluvias y anegó los cultivos.» ¿Qué significa «anegó»?",
       opciones:["Regó ligeramente","Cubrió de agua, inundó","Secó por completo","Fertilizó con limo"],
       correcta:1,
       retro:"El contexto («se desbordó», «tras las lluvias») indica que se trata de una inundación: anegar es cubrir de agua."}}
  ]
},

/* ============ BLOQUE 2 · COMPRENSIÓN INFERENCIAL ============ */
{
  id:"b2", nombre:"Comprensión inferencial", emoji:"💭",
  desc:"Deducir lo que el texto no dice pero sugiere: causas, consecuencias, intenciones, tono.",
  tecnicas:[
    {id:"l11", nombre:"Inferencias sobre causas",
     concepto:"Deducir por qué ocurre algo que el texto no explica directamente. Se apoya en indicios: palabras, acciones, contexto. Es un paso más allá de la información explícita.",
     ejemplo:"«Entró en casa sin saludar y se encerró en su cuarto.» Se infiere que algo le ha ocurrido: no se dice qué, pero el comportamiento lo sugiere.",
     ejercicio:{tipo:"quiz",
       consigna:"«María miró su reloj por tercera vez y se levantó a la puerta del café.» ¿Qué se puede inferir?",
       opciones:["Que acaba de llegar al café.","Que está esperando a alguien que tarda.","Que trabaja en el café.","Que quiere pedir la cuenta."],
       correcta:1,
       retro:"Mirar el reloj varias veces y levantarse a la puerta indica que espera a alguien. La repetición es un indicio clave."}},

    {id:"l12", nombre:"Inferencias sobre consecuencias",
     concepto:"Deducir qué ocurrirá después o qué efectos tendrá lo narrado. Se basa en el conocimiento del mundo y en las pistas del texto.",
     ejemplo:"«El equipo no entrenó en toda la semana.» Se infiere que probablemente perderá el partido del sábado.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe una consecuencia probable.",
       texto:"«El río lleva semanas sin llover y la presa apenas retiene agua.» Consecuencia probable: ___",
       respuestas:[["restricciones de agua","sequia","corte de agua","racionamiento","problemas de abastecimiento","escasez de agua","no habra agua","sequía"]],
       retro:"La inferencia no es certeza: es una hipótesis razonable que el texto permite y que el lector construye."}},

    {id:"l13", nombre:"Inferir el significado por contexto",
     concepto:"Deducir el significado de palabras desconocidas a partir de las pistas que las rodean. Es una de las técnicas más rentables para no interrumpir la lectura.",
     ejemplo:"«El anciano caminaba con paso vacilante, tambaleándose a cada paso.» Vacilante ≈ inseguro, inestable.",
     ejercicio:{tipo:"quiz",
       consigna:"«Guardaba un arcón repleto de baratijas: anillos sin piedra, relojes parados, pulseras oxidadas.» ¿Qué significa «baratijas»?",
       opciones:["Joyas de gran valor","Objetos de poco valor y calidad","Herramientas antiguas","Documentos antiguos"],
       correcta:1,
       retro:"La enumeración que sigue (anillos sin piedra, relojes parados, pulseras oxidadas) indica que son objetos viejos y sin valor."}},

    {id:"l14", nombre:"Inferir intenciones de los personajes",
     concepto:"Deducir qué pretende un personaje con sus palabras o acciones, aunque el narrador no lo diga. Se apoya en el comportamiento, el lenguaje no verbal y el contexto.",
     ejemplo:"«Le sonrió amablemente mientras cerraba la puerta con llave.» La sonrisa puede ser fingida: el gesto de cerrar con llave sugiere intención de retener.",
     ejercicio:{tipo:"quiz",
       consigna:"«Le ofreció el asiento junto a la ventana y le sirvió el mejor té de la casa.» ¿Qué intención se puede inferir?",
       opciones:["Indiferencia hacia el visitante.","Deseo de agradar o de causar buena impresión.","Miedo al visitante.","Costumbre sin significado."],
       correcta:1,
       retro:"Los detalles (el mejor asiento, el mejor té) revelan una intención: agradar. Los gestos son pistas de intenciones."}},

    {id:"l15", nombre:"Inferir el tema implícito",
     concepto:"En textos literarios o argumentativos el tema no siempre está enunciado. Hay que deducirlo del conjunto: personajes, conflictos, imágenes, tono.",
     ejemplo:"Un poema que habla de un árbol que resiste tormentas puede tener como tema la resiliencia o la soledad, aunque nunca se nombre esa palabra.",
     ejercicio:{tipo:"fill",
       consigna:"Formula el tema implícito del fragmento.",
       texto:"«El reloj de la abuela se detuvo la misma tarde en que ella se fue. Nadie volvió a darle cuerda.» Tema: ___",
       respuestas:[["la perdida","la muerte y el duelo","el duelo","la memoria","el paso del tiempo","la ausencia","la muerte","el recuerdo"]],
       retro:"El reloj detenido es una imagen simbólica. El tema va más allá de lo literal: la pérdida, el duelo, la memoria."}},

    {id:"l16", nombre:"Inferir relaciones lógicas",
     concepto:"Deducir la relación entre dos ideas aunque el conector esté elidido o implícito: causa, contraste, consecuencia, condición. Es clave para seguir el hilo argumentativo.",
     ejemplo:"«Estudió toda la noche. Aprobó con nota alta.» Entre las dos oraciones hay una relación implícita de causa-efecto.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica la relación lógica entre las dos oraciones.",
       categorias:["Causa","Contraste","Consecuencia"],
       items:[
         {texto:"«Llovía sin parar. El río creció.»", cat:2},
         {texto:"«No estudió nada. Sin embargo, aprobó.»", cat:1},
         {texto:"«Llegó tarde porque perdió el autobús.»", cat:0},
         {texto:"«Le dolía la cabeza. Por eso se acostó temprano.»", cat:2},
         {texto:"«Aunque estaba cansado, siguió trabajando.»", cat:1}
       ],
       retro:"Causa explica el origen; consecuencia es el efecto; contraste opone dos ideas. Identificar la relación es comprender el razonamiento."}},

    {id:"l17", nombre:"Completar información elidida",
     concepto:"En los textos hay información que el autor omite porque se sobreentiende. El lector competente la repone sin esfuerzo. La elipsis puede ser gramatical o de contenido.",
     ejemplo:"«Ana fue al mercado. Compró tomates y cebollas.» Se sobreentiende que fue Ana quien compró, aunque el sujeto no se repita.",
     ejercicio:{tipo:"fill",
       consigna:"Escribe el sujeto elidido.",
       texto:"«El niño abrió el libro. Leyó toda la tarde. Después, lo cerró con cuidado.» Los tres verbos tienen el mismo sujeto: ___",
       respuestas:[["el niño","niño"]],
       retro:"El sujeto se omite en la segunda y tercera oración porque se sobreentiende. La elipsis evita repeticiones innecesarias."}},

    {id:"l18", nombre:"Detectar presuposiciones",
     concepto:"Una presuposición es una información que el hablante da por sabida sin enunciarla. Se puede detectar en ciertos verbos, adverbios o construcciones: «dejó de fumar» presupone que fumaba.",
     ejemplo:"«Mi hermano también aprobó el examen» presupone que otra persona aprobó además de él. «Lamento que hayas llegado tarde» presupone que llegaste tarde.",
     ejercicio:{tipo:"quiz",
       consigna:"«¿Ya has dejado de morderte las uñas?» ¿Qué presupone esta pregunta?",
       opciones:["Que la persona nunca se ha mordido las uñas.","Que la persona se mordía las uñas.","Que la persona acaba de empezar a morderse las uñas.","Nada, es una pregunta neutra."],
       correcta:1,
       retro:"El verbo «dejar de» presupone que antes se hacía la acción. Es una de las marcas típicas de la presuposición."}},

    {id:"l19", nombre:"Inferir el tono y la actitud",
     concepto:"El tono es la actitud del autor hacia lo que dice o hacia el lector: irónico, solemne, burlón, melancólico, neutro. Se detecta en el léxico, la puntuación y las imágenes.",
     ejemplo:"«Menuda hazaña: llegar tarde otra vez.» La palabra «hazaña» está usada con ironía: el tono no es admirativo, sino burlón.",
     ejercicio:{tipo:"quiz",
       consigna:"«Excelente idea: tirar el dinero en cosas que no necesitas.» ¿Qué tono predomina?",
       opciones:["Admirativo sincero","Irónico","Melancólico","Neutro"],
       correcta:1,
       retro:"El elogio aparente («excelente idea») más el contenido negativo («tirar el dinero») producen ironía."}},

    {id:"l20", nombre:"Elaborar hipótesis de lectura",
     concepto:"Antes y durante la lectura, formular hipótesis sobre lo que vendrá. Se verifican o reformulan a medida que se avanza. Es un motor de la comprensión activa.",
     ejemplo:"Con el título «El último tren», hipotetizas: alguien tiene que tomar una decisión urgente, probablemente con un trasfondo emotivo. Sigues leyendo para verificar.",
     ejercicio:{tipo:"open",
       consigna:"Formula dos hipótesis sobre lo que tratará un texto titulado «La casa vacía».",
       criterios:[
         "Formulé dos hipótesis distintas y razonadas.",
         "Relacioné cada hipótesis con el título.",
         "Marqué una expectativa sobre el género o el tono."
       ],
       modelo:"1) Probablemente sea un texto narrativo sobre la pérdida o la ausencia: una casa que fue hogar y ahora está sin nadie. 2) Podría ser un texto argumentativo sobre el abandono de los pueblos rurales, usando «casa vacía» como símbolo."}}
  ]
},

/* ============ BLOQUE 3 · COMPRENSIÓN CRÍTICA ============ */
{
  id:"b3", nombre:"Comprensión crítica y valorativa", emoji:"⚖️",
  desc:"Evaluar el texto: intención, sesgos, argumentos, ideología y toma de postura.",
  tecnicas:[
    {id:"l21", nombre:"Distinguir hechos de opiniones",
     concepto:"Un hecho es verificable; una opinión expresa valoración o creencia. Confundirlos es la base de la desinformación. Los adjetivos valorativos y los verbos de opinión suelen delatar opiniones.",
     ejemplo:"Hecho: «La novela se publicó en 1967.» Opinión: «Es la mejor novela del siglo XX.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado.",
       categorias:["Hecho","Opinión"],
       items:[
         {texto:"«El Quijote se publicó en 1605.»", cat:0},
         {texto:"«Cervantes es el mejor escritor de la lengua española.»", cat:1},
         {texto:"«La novela tiene 52 capítulos en su primera parte.»", cat:0},
         {texto:"«Es una obra aburrida y demasiado larga.»", cat:1},
         {texto:"«El autor nació en Alcalá de Henares.»", cat:0}
       ],
       retro:"Los hechos se pueden comprobar; las opiniones dependen de valores. Los adjetivos («mejor», «aburrida») son la pista más clara."}},

    {id:"l22", nombre:"Reconocer la intención comunicativa",
     concepto:"Todo texto persigue algo: informar, persuadir, entretener, advertir, criticar. Se reconoce por el léxico, la estructura y el tono.",
     ejemplo:"«Nadie en su sano juicio puede seguir defendiendo esta medida absurda.» La intención es persuasiva, no informativa: el léxico es valorativo.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la intención predominante de un texto que empieza así: «Debemos actuar ahora, antes de que sea tarde»?",
       opciones:["Informar objetivamente","Entretener","Persuadir a la acción","Describir un paisaje"],
       correcta:2,
       retro:"El uso del imperativo («debemos») y la apelación a la urgencia son marcas clásicas de la intención persuasiva."}},

    {id:"l23", nombre:"Detectar falacias argumentativas",
     concepto:"Una falacia es un razonamiento que parece válido pero no lo es. Reconocerlas permite no dejarse convencer por argumentos defectuosos.",
     ejemplo:"Ad hominem: atacar a la persona en lugar del argumento. Generalización: concluir de un caso aislado. Falso dilema: presentar dos opciones cuando hay más.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado según el tipo de falacia.",
       categorias:["Ad hominem","Generalización apresurada","Falso dilema"],
       items:[
         {texto:"«No le hagas caso: es un ignorante.»", cat:0},
         {texto:"«Todos los jóvenes son irresponsables, lo vi en las noticias.»", cat:1},
         {texto:"«O estás conmigo o estás contra mí.»", cat:2},
         {texto:"«Su propuesta es mala porque él nunca ha estudiado.»", cat:0},
         {texto:"«Como un político mintió, todos los políticos mienten.»", cat:1}
       ],
       retro:"Detectar falacias es la vacuna contra la manipulación: se ataca a la persona, se generaliza desde pocos casos o se reducen las opciones."}},

    {id:"l24", nombre:"Identificar el sesgo del autor",
     concepto:"Un sesgo es una inclinación sistemática que distorsiona la información. Se manifiesta en lo que se destaca, lo que se omite y las palabras que se eligen. Ninguna fuente es completamente neutral.",
     ejemplo:"Si un texto sobre inmigración solo menciona delitos y nunca aportes culturales o económicos, hay un sesgo de selección.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas preguntas ayuda MÁS a detectar sesgos?",
       opciones:["¿El texto es largo o corto?","¿Qué se destaca, qué se omite y a quién se cita?","¿Cuántos párrafos tiene?","¿El vocabulario es difícil?"],
       correcta:1,
       retro:"Para detectar sesgos hay que preguntar por las ausencias y por las voces: qué no se dice, a quién no se cita, qué se presenta como natural."}},

    {id:"l25", nombre:"Evaluar la solidez de los argumentos",
     concepto:"Un argumento es sólido si sus premisas son verdaderas y la conclusión se sigue de ellas. Hay que distinguir argumentos de autoridad, de datos, de ejemplos y de analogías, y ver cuáles son más fuertes.",
     ejemplo:"«Según el INE, el paro bajó un 3 %» es un argumento de datos (fuerte). «Lo dijo mi vecino» es un argumento de autoridad débil.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada tipo de argumento.",
       categorias:["Datos","Autoridad","Ejemplo","Analogía"],
       items:[
         {texto:"«El 78 % de los encuestados apoya la medida.»", cat:0},
         {texto:"«Según la OMS, el sedentarismo es un riesgo sanitario.»", cat:1},
         {texto:"«Mi abuelo fumó toda su vida y vivió 90 años.»", cat:2},
         {texto:"«Prohibir los móviles en clase es como prohibir los libros.»", cat:3}
       ],
       retro:"Los datos y las autoridades reconocidas son más sólidos que los ejemplos aislados o las analogías, que a menudo son falaces."}},

    {id:"l26", nombre:"Reconocer estereotipos y prejuicios",
     concepto:"Un estereotipo es una imagen rígida y generalizadora de un grupo. Un prejuicio es un juicio previo sin fundamento. Se detectan en generalizaciones, adjetivos y roles fijos.",
     ejemplo:"Decir que «las mujeres son más sensibles» o que «los jóvenes no leen» son estereotipos: generalizan sin matices y sin evidencia.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estos enunciados contiene un estereotipo?",
       opciones:["«Algunos adolescentes leen más de diez libros al año.»","«Todos los adolescentes prefieren las pantallas a los libros.»","«La lectura en pantalla ha crecido en los últimos años.»","«Existen clubes de lectura para jóvenes.»"],
       correcta:1,
       retro:"El uso de «todos» convierte una observación en estereotipo. Los enunciados con «algunos» o «muchos» son más prudentes y verificables."}},

    {id:"l27", nombre:"Analizar la ideología subyacente",
     concepto:"Todo texto refleja una visión del mundo: valores, creencias, intereses. Analizarla es preguntarse qué se da por supuesto, qué se defiende y qué visión de la sociedad se transmite.",
     ejemplo:"Un texto que presenta el éxito como fruto exclusivo del esfuerzo individual transmite una ideología meritocrática. Otro que subraya los factores estructurales, una visión más social.",
     ejercicio:{tipo:"open",
       consigna:"Escribe un breve análisis de la ideología que podría haber detrás de esta frase: «El que quiere, puede».",
       criterios:[
         "Identifiqué los valores o creencias que presupone la frase.",
         "Expliqué qué visión de la sociedad transmite.",
         "Reconocí algún posible límite o crítica a esa visión."
       ],
       modelo:"La frase presupone que el éxito depende solo del esfuerzo individual, ignorando factores como el acceso a la educación, la salud o la situación económica. Transmite una ideología meritocrática que responsabiliza al individuo de su situación y tiende a culpabilizar a quien no logra «querer lo suficiente». Un análisis crítico señalaría que el esfuerzo es necesario pero no suficiente: las condiciones sociales también determinan las oportunidades."}},

    {id:"l28", nombre:"Comparar fuentes y perspectivas",
     concepto:"Contrastar dos o más textos sobre el mismo tema permite detectar coincidencias, divergencias, intereses y silencios. Es la técnica central de la lectura crítica.",
     ejemplo:"Comparar cómo dos periódicos de líneas distintas titulan la misma noticia revela qué se destaca, qué se omite y qué adjetivos se eligen.",
     ejercicio:{tipo:"open",
       consigna:"Elige un tema de actualidad y describe cómo lo compararías en dos fuentes distintas.",
       criterios:[
         "Elegí un tema concreto y dos fuentes identificables.",
         "Definí al menos tres criterios de comparación.",
         "Explicitó qué diferencias esperaría encontrar y cómo las interpretaría."
       ],
       modelo:"Tema: una reforma educativa. Fuente A: un diario generalista. Fuente B: el comunicado oficial del ministerio. Compararía: 1) titulares y adjetivos; 2) datos numéricos citados; 3) voces expertas convocadas; 4) aspectos omitidos. Si el comunicado oficial no menciona las críticas y el diario las destaca, sabré que cada uno enfoca el tema desde intereses distintos."}},

    {id:"l29", nombre:"Valorar la credibilidad de las fuentes",
     concepto:"No todas las fuentes merecen la misma confianza. Hay que revisar autoría, respaldo institucional, fecha, referencias y rigor. Una fuente creíble cita, contextualiza y reconoce límites.",
     ejemplo:"Un artículo firmado por un especialista, con bibliografía y publicado en una revista académica, es más creíble que una publicación anónima sin referencias en redes sociales.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada característica según indique mayor o menor credibilidad.",
       categorias:["Mayor credibilidad","Menor credibilidad"],
       items:[
         {texto:"Firma un especialista con afiliación institucional.", cat:0},
         {texto:"No tiene autor ni fecha de publicación.", cat:1},
         {texto:"Cita fuentes y ofrece bibliografía.", cat:0},
         {texto:"Usa un lenguaje sensacionalista y muchas mayúsculas.", cat:1},
         {texto:"Publicada en una revista académica con revisión por pares.", cat:0}
       ],
       retro:"La credibilidad se construye con transparencia: autor identificable, fuentes citadas, tono mesurado y contexto."}},

    {id:"l30", nombre:"Toma de postura argumentada",

     ejemplo:"Tras leer un artículo contra las redes sociales, puedes concluir: «Estoy parcialmente de acuerdo: comparto la crítica a la desinformación, pero no creo que la solución sea prohibir, sino educar».",
     ejercicio:{tipo:"open",
       consigna:"Escribe tu postura ante esta afirmación: «Los móviles deberían prohibirse en los institutos».",
       criterios:[

         "Consideré un contraargumento o matiz.",
         "Cerré con una conclusión coherente."
       ],
       modelo:"Creo que prohibir los móviles en los institutos es una medida simplista, aunque comprensible. Por un lado, es cierto que interrumpen la atención y favorecen el acoso digital; por otro, los móviles son herramientas de aprendizaje y su prohibición total no enseña a usarlos con criterio. Una política educativa razonable debería regular su uso por franjas y formar en competencia digital. En conclusión, no prohibiría, sino que educaría en el uso responsable."}}

    {id:"l32", nombre:"Familias léxicas",

    {id:"l33", nombre:"Campos semánticos",

    {id:"l34", nombre:"Prefijos y sufijos",
     concepto:"Los prefijos se anteponen a la raíz (re-, des-, in-, pre-) y los sufijos se posponen (-ción, -dad, -oso, -ito). Conocerlos permite deducir el significado de palabras desconocidas.",
     ejemplo:"«Rehacer» = volver a hacer. «Inútil» = no útil. «Bondad» = cualidad de bueno. «Librito» = libro pequeño.",

       respuestas:[["negacion","contrario","inversion","lo contrario","privacion","quitar"],["cualidad","cualidades","abstraccion","estado","cualidad abstracta"],["diminutivo","pequeño","afectivo","de tamaño pequeño","cariñoso"]],
       retro:"Conocer unos cuantos prefijos y sufijos multiplica la capacidad de deducir significados sin diccionario."}},

    {id:"l35", nombre:"Palabras homónimas",
     concepto:"Las homónimas se pronuncian o escriben igual pero tienen significados distintos. Homógrafas: misma escritura (banco, vino). Homófonas: mismo sonido, distinta escritura (hola/ola, haya/halla).",
     ejemplo:"«Banco» puede ser asiento o entidad financiera. «Haya» es un árbol o el verbo haber; «halla» es del verbo hallar.",

         {texto:"vela (de barco) / vela (de cera)", cat:0}
       ],
       retro:"Homógrafas: se escriben igual y significan cosas distintas. Homófonas: suenan igual pero se escriben distinto."}},

    {id:"l36", nombre:"Palabras parónimas",
     concepto:"Las parónimas se parecen mucho en forma o sonido pero significan cosas distintas. Confundirlas produce errores frecuentes.",
     ejemplo:"«Actitud» (disposición) y «aptitud» (capacidad). «Afecto» (cariño) y «efecto» (resultado). «Compresión» (apretar) y «comprensión» (entender).",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la palabra correcta en cada caso.",
       texto:"Tiene buena ___ para las matemáticas (aptitud / actitud). · Mostró una ___ positiva ante el reto (actitud / aptitud). · El médico notó una ___ en la vena (compresión / comprensión).",

       retro:"Aptitud es capacidad; actitud es disposición. Compresión es apretar; comprensión es entender."}},

    {id:"l37", nombre:"Frases hechas, refranes y modismos",
     concepto:"Son expresiones cuyo significado no se deduce de las palabras que las componen. Forman parte del acervo cultural de la lengua y enriquecen el texto.",
     ejemplo:"«Estirar la pata» = morir. «A ojo de buen cubero» = calcular aproximadamente. «Más vale tarde que nunca» = refrán que pondera la acción sobre la puntualidad.",
     ejercicio:{tipo:"fill",
       consigna:"Explica el significado de estas expresiones.",
       texto:"«Ponerse las botas» significa ___ · «No tener pelos en la lengua» significa ___ · «Estar en las nubes» significa ___",

       retro:"Las frases hechas se aprenden como bloques: su significado global no se deduce de sus partes."}},

    {id:"l38", nombre:"Neologismos, extranjerismos y arcaísmos",
     concepto:"Los neologismos son palabras nuevas; los extranjerismos, palabras tomadas de otras lenguas; los arcaísmos, palabras antiguas en desuso. Reconocerlos ayuda a entender la evolución del léxico.",
     ejemplo:"Neologismo: «ciberacoso». Extranjerismo: «chat», «software» (aunque existen alternativas: «charla», «programa»). Arcaísmo: «maguer» (aunque), «yantar» (comer).",
     ejercicio:{tipo:"classify",

       ],
       retro:"Los neologismos nacen para nombrar realidades nuevas; los extranjerismos se toman de otras lenguas; los arcaísmos quedan como reliquias del pasado."}},

    {id:"l39", nombre:"Léxico denotativo y connotativo",
     concepto:"El significado denotativo es el literal, el que aparece en el diccionario. El connotativo añade valores afectivos, culturales o simbólicos según el contexto.",

    {id:"l40", nombre:"Cuaderno de vocabulario",
     concepto:"Registro sistemático de palabras nuevas: la palabra, el contexto donde apareció, el significado inferido, el significado real y una frase propia. Escribir una frase propia fija el aprendizaje.",

/* ============ BLOQUE 5 · GRAMÁTICA Y MORFOSINTAXIS ============ */
{
  id:"b5", nombre:"Gramática y morfosintaxis", emoji:"🧩",
  desc:"Categorías gramaticales, oración simple y compuesta, conectores.",
  tecnicas:[
    {id:"l41", nombre:"Sustantivos y adjetivos",
     concepto:"El sustantivo nombra personas, cosas, ideas; tiene género y número. El adjetivo expresa cualidades del sustantivo y concuerda con él en género y número. La concordancia es obligatoria.",
     ejemplo:"«La casa blanca» → sustantivo femenino singular + adjetivo femenino singular. «Los ríos caudalosos» → masculino plural.",
     ejercicio:{tipo:"fill",
       consigna:"Haz concordar el adjetivo.",

    {id:"l42", nombre:"Verbos: tiempo, modo y aspecto",
     concepto:"El verbo expresa acción, estado o proceso. Se conjuga en tiempo (presente, pasado, futuro), modo (indicativo, subjuntivo, imperativo) y aspecto (perfecto/imperfecto). Reconocerlo permite entender la perspectiva del hablante.",
     ejemplo:"«Ayer estudié» (pasado, indicativo, perfecto). «Ojalá estudie» (presente, subjuntivo, expresa deseo). «Estudiaba cada tarde» (imperfecto, acción habitual).",
     ejercicio:{tipo:"classify",

         {texto:"«Mañana iré al cine.»", cat:0},
         {texto:"«Quiero que estudies más.»", cat:1}
       ],
       retro:"Indicativo: hechos reales. Subjuntivo: deseos, dudas, hipótesis. Imperativo: órdenes o ruegos."}},

    {id:"l43", nombre:"Pronombres y su función",
     concepto:"Los pronombres sustituyen al sustantivo. Personales (yo, tú, él, nos, os, les...), demostrativos (este, ese, aquel), posesivos (mío, tuyo), relativos (que, quien, cual). Evitan repeticiones y cohesionan el texto.",
     ejemplo:"«Ana llegó tarde. Ella siempre llega tarde.» «Ella» sustituye a «Ana» y evita repetir su nombre.",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el sintagma por el pronombre adecuado.",
       texto:"«Entregué el libro a Marta» → «___ entregué el libro» (pronombre de CI) · «Compré las flores» → «___ compré» (pronombre de CD)",
       respuestas:[["le"],["las"]],
       retro:"Los pronombres átonos de complemento directo son lo, la, los, las; los de indirecto son le, les. La sustitución pronominal evita repeticiones."}},

    {id:"l44", nombre:"Determinantes y artículos",
     concepto:"Los determinantes precisan al sustantivo: artículos (el, la, los, las), demostrativos (este, ese), posesivos (mi, tu, su), numerales, indefinidos (algún, varios, mucho). Siempre preceden al sustantivo y concuerdan con él.",
     ejemplo:"«Aquellos tres libros míos» → demostrativo + numeral + sustantivo + posesivo. Todos concuerdan en género y número.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada determinante.",
       categorias:["Artículo","Demostrativo","Posesivo","Indefinido"],

         {texto:"este", cat:1},
         {texto:"mi", cat:2},
         {texto:"algunos", cat:3},
         {texto:"las", cat:0},
         {texto:"aquel", cat:1},
         {texto:"varios", cat:3}
       ],
       retro:"Cada tipo de determinante aporta un matiz distinto al sustantivo: presentación, cercanía, posesión o cantidad imprecisa."}},

    {id:"l45", nombre:"Estructura de la oración simple",
     concepto:"La oración simple tiene un sujeto (de quien se dice algo) y un predicado (lo que se dice). El núcleo del sujeto es un sustantivo o pronombre; el núcleo del predicado, un verbo. Puede haber sujeto elidido u oraciones impersonales.",
     ejemplo:"«Los niños juegan en el parque.» Sujeto: los niños. Predicado: juegan en el parque. En «Llueve mucho», el sujeto es inexistente (impersonal).",
     ejercicio:{tipo:"fill",
       consigna:"Separa sujeto y predicado.",
       texto:"«La profesora explicó la lección con claridad.» Sujeto: ___ · Predicado: ___",
       respuestas:[["la profesora"],["explico la leccion con claridad","explicó la lección con claridad"]],
       retro:"Para reconocer el sujeto se pregunta «¿quién?» al verbo. Si no hay respuesta, la oración es impersonal."}},

    {id:"l46", nombre:"Complementos del verbo",
     concepto:"El predicado puede llevar complemento directo (CD), indirecto (CI), circunstancial (CC), atributo (con verbos copulativos) y complemento agente (en pasivas). Identificarlos revela la estructura de la oración.",
     ejemplo:"«Pedro entregó el informe al jefe ayer.» CD: el informe. CI: al jefe. CC de tiempo: ayer.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada sintagma subrayado de la oración «Ana compró flores a su madre en el mercado el sábado».",
       categorias:["CD","CI","CC"],
       items:[
         {texto:"flores", cat:0},
         {texto:"a su madre", cat:1},
         {texto:"en el mercado", cat:2},
         {texto:"el sábado", cat:2}
       ],
       retro:"El CD se sustituye por lo/la/los/las; el CI por le/les; el CC responde a cuándo, dónde, cómo, cuánto."}},

    {id:"l47", nombre:"Oraciones compuestas: coordinación",
     concepto:"Dos o más oraciones se unen por coordinación cuando son independientes sintácticamente. Tipos: copulativas (y, e), adversativas (pero, sino), disyuntivas (o, u), distributivas (ya…ya), explicativas (es decir).",
     ejemplo:"«Estudió mucho, pero no aprobó» (adversativa). «¿Vienes o te quedas?» (disyuntiva).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración coordinada.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],

         {texto:"«No es tonto, sino distraído.»", cat:1}
       ],
       retro:"Copulativas suman; adversativas oponen; disyuntivas presentan alternativas. Reconocerlas ayuda a seguir el razonamiento."}},

    {id:"l48", nombre:"Oraciones subordinadas",
     concepto:"Una oración subordinada depende sintácticamente de otra. Pueden ser sustantivas (funcionan como sustantivo), adjetivas o de relativo (modifican a un sustantivo) y adverbiales (expresan tiempo, causa, condición, consecuencia...).",
     ejemplo:"«Quiero que vengas» (sustantiva de CD). «El libro que me prestaste es fascinante» (adjetiva o de relativo). «Cuando llegues, avísame» (adverbial temporal).",

       ],
       retro:"Sustantiva: se puede sustituir por «eso». Adjetiva: se puede sustituir por un adjetivo. Adverbial: responde a cuándo, dónde, cómo, por qué, para qué."}},

    {id:"l49", nombre:"Conectores y marcadores discursivos",
     concepto:"Los conectores y marcadores organizan el discurso y señalan la relación entre ideas: adición, contraste, causa, consecuencia, orden, reformulación. Son las señales de tráfico del texto.",
     ejemplo:"«En primer lugar... además... sin embargo... por lo tanto... en conclusión...» articula un texto argumentativo.",

         {texto:"en otras palabras", cat:3}
       ],
       retro:"Los conectores no son adornos: sin ellos, el lector no sabe cómo se relacionan las ideas del texto."}},

    {id:"l50", nombre:"Concordancia y coherencia gramatical",
     concepto:"La concordancia es la correspondencia obligatoria en género y número entre sustantivo y adjetivo, y en número y persona entre sujeto y verbo. Su ruptura produce agramaticalidad.",
     ejemplo:"Correcto: «Los alumnos estudian». Incorrecto: «Los alumnos estudia» (sujeto plural y verbo singular). Correcto: «Un grupo de niños juega» (sujeto en singular: el núcleo es «grupo»).",

/* ============ BLOQUE 6 · ORTOGRAFÍA Y PUNTUACIÓN ============ */
