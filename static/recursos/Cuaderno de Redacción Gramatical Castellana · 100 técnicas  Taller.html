<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Gramatical Castellana · 100 técnicas + Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e6e0; --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);border-bottom:3px double var(--navy);box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .seal{width:50px;height:50px;flex:0 0 auto;border-radius:50%;padding:3px;border:1.5px dashed var(--bronze);display:grid;place-items:center;}
  .seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:16px;position:relative;}
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:6px;color:var(--bronze);}
  .seal-inner::before{top:5px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:5px;left:50%;transform:translateX(-50%);}
  .brand h1{font-family:"PT Serif",Georgia,serif;font-size:15px;margin:0;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tabs{display:flex;gap:0;border:1px solid var(--navy);background:var(--paper);}
  .tab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:none;background:transparent;color:var(--navy);border-right:1px solid var(--navy);transition:.15s;font-family:"Public Sans",sans-serif;}
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--navy-soft);}
  .tab.active{background:var(--navy);color:var(--paper);}
  .progress-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .progress-bar{width:130px;height:6px;border:1px solid var(--line-2);background:#f0ece0;overflow:hidden;}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .stat strong{font-family:"PT Serif",Georgia,serif;font-size:15px;color:var(--navy);font-weight:700;padding:0 5px;}
  .btn{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 14px;cursor:pointer;border:1px solid var(--navy);background:var(--paper);color:var(--navy);transition:.16s;font-family:"Public Sans",sans-serif;}
  .btn:hover{background:var(--navy-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--navy);color:var(--paper);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted);}
  .btn.ghost:hover{background:#eee9dc;color:var(--navy);}
  .btn.danger{border-color:var(--bad);color:var(--bad);}
  .btn.danger:hover{background:var(--bad-soft);}
  .only-mobile{display:none;}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:22px;max-width:1400px;margin:0 auto;padding:22px;align-items:start;}
  .sidebar{position:sticky;top:100px;max-height:calc(100vh - 124px);overflow-y:auto;background:var(--paper);border:1px solid var(--navy);padding:4px;box-shadow:var(--shadow);}
  .sidebar-inner{border:1px solid var(--bronze-line);padding:12px;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);}
  #search{width:100%;font-size:12px;padding:8px 11px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);outline:none;margin-bottom:12px;font-family:"Public Sans",sans-serif;}
  #search:focus{border-color:var(--navy);}
  .cat{margin-bottom:4px;}
  .cat-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;padding:9px 10px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--navy);text-transform:uppercase;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .cat-head:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-head .chev{margin-left:auto;font-size:9px;color:var(--bronze);transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{font-family:"PT Serif",Georgia,serif;font-size:10.5px;font-weight:700;background:var(--bronze-soft);color:var(--bronze-dark);padding:1px 7px;border:1px solid var(--bronze-line);}
  .cat-bar{height:3px;background:#e8e2d2;margin:0 10px 6px;overflow:hidden;border:1px solid var(--line);}
  .cat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width .4s;}
  .cat-body{display:none;padding:2px 0 8px 4px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:10.5px;color:var(--muted);padding:0 10px 8px;line-height:1.5;font-style:italic;}
  .tech-link{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:7px 10px;border-left:3px solid transparent;font-family:"Public Sans",sans-serif;}
  .tech-link:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-link.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-link .dot{flex:0 0 auto;width:13px;height:13px;margin-top:1px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-size:8px;color:transparent;}
  .tech-link.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}
  .sidebar-label{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--bronze-line);}
  .sidebar-section{margin-bottom:16px;}
  .side-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px;line-height:1.4;color:#3a3a3a;padding:8px 10px;border-left:3px solid transparent;transition:.15s;font-family:"Public Sans",sans-serif;}
  .side-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .side-item.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .side-item .icon{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;color:var(--navy);}
  .side-item.active .icon{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .side-item .label{flex:1;min-width:0;}
  .side-item .label small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px;}
  .empty-mini{font-size:11px;color:var(--muted);font-style:italic;padding:10px;text-align:center;border:1px dashed var(--line-2);background:var(--paper-2);}
  .draft-item{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-left:3px solid transparent;cursor:pointer;transition:.15s;font-size:11px;line-height:1.35;font-family:"Public Sans",sans-serif;border-bottom:1px solid var(--line);}
  .draft-item:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .draft-item.active{background:var(--navy-soft);border-left-color:var(--navy);}
  .draft-item .di-title{flex:1;min-width:0;color:#3a3a3a;font-weight:600;}
  .draft-item .di-title small{display:block;font-weight:400;font-size:10px;color:var(--muted);margin-top:2px;}
  .draft-item .di-del{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
  .draft-item .di-del:hover{color:var(--bad);}
  .panel{background:var(--paper);border:1px solid var(--navy);padding:6px;box-shadow:var(--shadow);}
  .panel-inner{border:1px solid var(--bronze-line);padding:26px 30px 30px;background:radial-gradient(circle at 100% 0%,#f7f2e8 0%,transparent 40%),var(--paper);position:relative;}
  .panel-seal{position:absolute;top:18px;right:22px;width:70px;height:70px;border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.75;}
  .panel-seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:10px;text-align:center;line-height:1.1;}
  .tech-head{margin-bottom:20px;padding-right:90px;}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);border:1px solid var(--bronze-line);padding:3px 10px;margin-bottom:12px;}
  .tech-head h2{margin:0;font-family:"PT Serif",Georgia,serif;font-size:25px;line-height:1.2;letter-spacing:-.3px;font-weight:700;color:var(--navy);}
  .tech-head p.lead{margin:8px 0 0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.6;color:var(--muted);}
  .tech-pos{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .rule{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:16px 0 20px;}
  .block-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .bdot{width:11px;height:11px;border:1px solid var(--line-2);background:var(--paper);cursor:pointer;transition:.15s;}
  .bdot:hover{transform:scale(1.2);border-color:var(--bronze);}
  .bdot.done{background:var(--ok);border-color:var(--ok);}
  .bdot.current{background:var(--bronze);border-color:var(--bronze-dark);}
  .flashcard{perspective:1600px;margin:0 0 14px;cursor:pointer;border:1px solid var(--navy);padding:4px;background:var(--paper);box-shadow:var(--shadow);}
  .fc-inner{position:relative;min-height:clamp(270px,35vh,330px);transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);border:1px solid var(--bronze-line);}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px 26px;display:flex;flex-direction:column;overflow:auto;background:var(--paper);background-image:linear-gradient(transparent 27px,rgba(20,33,61,.06) 27px 28px);background-size:100% 28px;background-position:0 14px;}
  .fc-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:15.5px;line-height:28px;color:var(--ink);}
  .fc-back{transform:rotateY(180deg);background:#faf6ec;}
  .fc-back p{color:var(--navy-dark);font-style:italic;}
  .fc-tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:12px;display:block;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);}
  .fc-hint{margin-top:auto;padding-top:14px;font-size:10.5px;color:#9c907c;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .flip-btn{margin:0 0 26px;}
  .sec-title{display:flex;align-items:center;gap:10px;font-family:"PT Serif",Georgia,serif;font-size:16px;font-weight:700;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title span{font-size:10px;font-weight:700;color:var(--muted);margin-left:auto;letter-spacing:.6px;text-transform:uppercase;}
  .consigna{font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper-2);border-left:3px solid var(--bronze);padding:12px 16px;margin:0 0 16px;}
  .opciones{display:flex;flex-direction:column;gap:8px;}
  .opcion{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:13.5px;line-height:1.5;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);padding:12px 14px;cursor:pointer;transition:.15s;font-family:"Public Sans",sans-serif;}
  .opcion:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft);}
  .opcion:disabled{cursor:default;opacity:.9;}
  .opcion .letra{flex:0 0 auto;width:22px;height:22px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line-2);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:12px;font-weight:700;}
  .opcion.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad);color:#fff;border-color:var(--bad);}
  .fill-texto{font-family:"PT Serif",Georgia,serif;font-size:16px;line-height:2.4;margin:0 0 16px;color:var(--ink);}
  .hueco{font:inherit;font-family:"PT Serif",Georgia,serif;font-size:15px;font-style:italic;border:none;border-bottom:1.5px solid var(--bronze);background:transparent;color:var(--bronze-dark);font-weight:700;padding:2px 6px;min-width:110px;text-align:center;outline:none;}
  .hueco:focus{background:var(--bronze-soft);border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);text-decoration:line-through;}
  .order-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .order-col h4{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .pool,.seq{min-height:120px;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .pool{background:var(--paper-2);border:1px dashed var(--line-2);}
  .seq{background:#f4efe2;border:1px solid var(--bronze-line);}
  .pool:empty::after,.seq:empty::after{content:"···";color:#c9c2b2;font-size:16px;text-align:center;margin:auto;letter-spacing:4px;}
  .ord-item{font:inherit;font-size:12.5px;line-height:1.4;text-align:left;background:var(--paper);border:1px solid var(--line-2);padding:9px 11px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;gap:8px;align-items:flex-start;font-family:"Public Sans",sans-serif;}
  .ord-item:hover{border-color:var(--navy);background:var(--navy-soft);}
  .seq .ord-item{border-color:var(--bronze-line);}
  .seq .ord-item .num{flex:0 0 auto;width:18px;height:18px;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:11px;font-weight:700;}
  .ord-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .cl-item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line-2);padding:11px 13px;margin-bottom:8px;}
  .cl-item p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.5;flex:1 1 260px;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:5px 10px;cursor:pointer;border:1px solid var(--line-2);background:var(--paper-2);color:var(--muted);transition:.14s;text-transform:uppercase;font-family:"Public Sans",sans-serif;}
  .chip:hover{border-color:var(--navy);color:var(--navy);}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .cl-item.ok{border-color:var(--ok);background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad);background:var(--bad-soft);}
  .criterios{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;}
  .criterios li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#4a4a4a;line-height:1.55;}
  .criterios input{margin-top:2px;accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto;}
  textarea{width:100%;font-family:"PT Serif",Georgia,serif;font-size:15px;line-height:26px;color:var(--ink);padding:12px 16px;border:1px solid var(--bronze-line);background-color:#fdfaf3;background-image:linear-gradient(transparent 25px,rgba(20,33,61,.07) 25px 26px);background-size:100% 26px;background-attachment:local;resize:vertical;outline:none;}
  textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  textarea::placeholder{color:#a1957e;font-style:italic;}
  .feedback{margin-top:16px;padding:0;overflow:hidden;max-height:0;opacity:0;transition:.3s;border-left:3px solid transparent;}
  .feedback.show{max-height:600px;opacity:1;padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft);border-left-color:var(--ok);color:#1d4526;}
  .feedback.mal{background:var(--bad-soft);border-left-color:var(--bad);color:#5c1414;}
  .feedback.info{background:var(--bronze-soft);border-left-color:var(--bronze);color:#5a3f22;}
  .feedback strong{display:block;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px;}
  .feedback p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.6;}
  .ej-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .modelo{display:none;margin-top:14px;background:var(--paper-2);border-left:3px solid var(--navy);padding:13px 16px;font-family:"PT Serif",Georgia,serif;font-size:14.5px;line-height:1.65;color:var(--navy-dark);}
  .modelo.show{display:block;animation:fade .3s ease;}
  .modelo strong{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:5px;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .cuaderno{margin-top:32px;padding-top:22px;border-top:1px solid var(--navy);position:relative;}
  .cuaderno::before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--bronze-line);}
  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--bronze-line);}
  .nav-foot .btn{flex:1;max-width:220px;text-align:center;}
  .nav-foot .btn:disabled{opacity:.35;cursor:not-allowed;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid .third{grid-column:span 1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--bronze-dark);font-family:"Public Sans",sans-serif;}
  .field label small{font-weight:500;font-style:italic;letter-spacing:.2px;text-transform:none;color:var(--muted);margin-left:4px;}
  .field input,.field textarea,.field select{font-family:"PT Serif",Georgia,serif;font-size:14px;padding:8px 11px;border:1px solid var(--bronze-line);background-color:#fdfaf3;color:var(--ink);outline:none;transition:.15s;width:100%;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field input::placeholder,.field textarea::placeholder{color:#a1957e;font-style:italic;}
  .field select{cursor:pointer;}
  .preview-wrap{border:1px solid var(--navy);padding:4px;background:var(--paper);margin-top:6px;}
  .preview-inner{border:1px solid var(--bronze-line);padding:24px 26px;background:var(--paper);font-family:"PT Serif",Georgia,serif;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;max-height:520px;overflow-y:auto;}
  .preview-inner .placeholder{color:#a1957e;font-style:italic;}
  .preview-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--bronze-line);}
  .hint{font-family:"PT Serif",Georgia,serif;font-size:12.5px;font-style:italic;color:var(--muted);background:var(--paper-2);border-left:3px solid var(--bronze);padding:9px 13px;margin:0 0 16px;}
  .hint strong{color:var(--navy);font-style:normal;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:var(--paper);padding:11px 20px;font-family:"Public Sans",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--bronze-line);box-shadow:var(--shadow);opacity:0;transition:.28s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .mode{display:none;}
  .mode.active{display:block;}

  /* Analizador morfológico tabla */
  .morph-table{width:100%;border-collapse:collapse;margin:14px 0;font-family:"Public Sans",sans-serif;font-size:12px;}
  .morph-table th,.morph-table td{border:1px solid var(--bronze-line);padding:7px 9px;text-align:left;background:var(--paper);}
  .morph-table th{background:var(--bronze-soft);color:var(--bronze-dark);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:10.5px;}
  .morph-table td select,.morph-table td input{width:100%;font-family:"Public Sans",sans-serif;font-size:11.5px;padding:4px 6px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);outline:none;}
  .morph-table td select:focus,.morph-table td input:focus{border-color:var(--navy);}

  /* Conjugador */
  .conj-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:18px 0;}
  .conj-col{border:1px solid var(--bronze-line);background:var(--paper);padding:14px;}
  .conj-col h4{font-family:"PT Serif",Georgia,serif;font-size:14px;color:var(--navy);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bronze-line);letter-spacing:.3px;text-align:center;text-transform:uppercase;font-size:11px;font-weight:800;}
  .conj-col table{width:100%;border-collapse:collapse;font-family:"PT Serif",Georgia,serif;font-size:13px;}
  .conj-col td{padding:3px 4px;vertical-align:top;}
  .conj-col td.pron{color:var(--muted);width:38%;font-style:italic;}
  .conj-col td.form{color:var(--navy-dark);font-weight:700;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr;padding:14px;gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:100vh;z-index:100;padding:4px;transform:translateX(-105%);transition:transform .28s ease;overflow-y:auto;top:0;}
    .sidebar.open{transform:none;}
    .scrim{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:99;opacity:0;pointer-events:none;transition:.25s;}
    .scrim.show{opacity:1;pointer-events:auto;}
    .panel-inner{padding:20px 18px 24px;}
    .panel-seal{display:none;}
    .tech-head{padding-right:0;}
    .tech-head h2{font-size:20px;}
    .form-grid{grid-template-columns:1fr;}
    .conj-wrap{grid-template-columns:1fr;}
    .brand p{display:none;}
    .brand h1{font-size:12.5px;}
    .progress-wrap{display:none;}
  }
</style>
</head>

<script>
/* =====================================================================
   MODO 1 · 100 TÉCNICAS DE GRAMÁTICA CASTELLANA
   ===================================================================== */
const CATEGORIAS = [
/* ---------- Bloque 1 ---------- */
{ id:"g1", nombre:"Categorías gramaticales", emoji:"📚",
  desc:"Sustantivo, adjetivo, verbo, adverbio, pronombre, preposición, conjunción.",
  tecnicas:[
    {id:"g1_1", nombre:"Categorías gramaticales",
     concepto:"Las palabras se clasifican en categorías según su función y significado: sustantivo, adjetivo, verbo, adverbio, pronombre, artículo, preposición, conjunción, interjección. Reconocerlas es la base del análisis.",
     ejemplo:"En «La casa blanca de mi abuela está lejos»: La (artículo), casa (sustantivo), blanca (adjetivo), de (preposición), mi (determinante), abuela (sustantivo), está (verbo), lejos (adverbio).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada palabra de la oración «El niño corre rápido».",
       categorias:["Artículo","Sustantivo","Verbo","Adverbio"],
       items:[{texto:"El",cat:0},{texto:"niño",cat:1},{texto:"corre",cat:2},{texto:"rápido",cat:3}],
       retro:"El: artículo. Niño: sustantivo. Corre: verbo. Rápido: adverbio (modifica al verbo)."}},
    {id:"g1_2", nombre:"Sustantivo: género y número",
     concepto:"El sustantivo tiene género (masculino/femenino) y número (singular/plural). Puede ser común o propio, concreto o abstracto, contable o no contable.",

     ejercicio:{tipo:"fill", consigna:"Indica el género y número.",
       texto:"«Los estudiantes» → género ___ , número ___ .",
       respuestas:[["masculino"],["plural"]],
       retro:"«Los estudiantes» es masculino plural (aunque incluya mujeres, en español el plural mixto es masculino)."}},
    {id:"g1_3", nombre:"Adjetivo: función y grados",
     concepto:"El adjetivo califica o determina al sustantivo. Tiene tres grados: positivo (alto), comparativo (más alto que), superlativo (altísimo / el más alto).",
     ejemplo:"Alto (positivo). Más alto que Juan (comparativo). Altísimo / el más alto (superlativo).",
     ejercicio:{tipo:"fill", consigna:"Identifica el grado del adjetivo.",
       texto:"«Este edificio es altísimo» → grado ___ .",
       respuestas:[["superlativo","superlativo absoluto"]],
       retro:"«Altísimo» es superlativo absoluto (sin comparación con otro). El superlativo relativo sería «el más alto»."}},
    {id:"g1_4", nombre:"El verbo: raíz y desinencia",
     concepto:"El verbo tiene raíz (significado léxico) y desinencia (persona, número, tiempo, modo, aspecto). La conjugación regular sigue tres modelos: -ar, -er, -ir.",
     ejemplo:"«Cant-o»: cant- (raíz) + -o (1.ª persona singular, presente, indicativo). «Cant-aba»: cant- + -aba (1.ª singular, pretérito imperfecto).",
     ejercicio:{tipo:"fill", consigna:"Separa raíz y desinencia.",
       texto:"«Comíamos» → raíz ___ , desinencia ___ .",
       respuestas:[["com","com-"],["iamos","-iamos"]],
       retro:"«Com-íamos»: raíz com-, desinencia -íamos (1.ª plural, imperfecto, indicativo)."}},
    {id:"g1_5", nombre:"El adverbio",
     concepto:"El adverbio modifica al verbo, al adjetivo o a otro adverbio. Indica tiempo, lugar, modo, cantidad, afirmación, negación, duda.",
     ejemplo:"«Corre rápidamente» (modo). «Llegó ayer» (tiempo). «Vive lejos» (lugar). «Muy alto» (cantidad). «Sí quiero» (afirmación).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada adverbio.",
       categorias:["Tiempo","Lugar","Modo","Cantidad"],
       items:[{texto:"ayer",cat:0},{texto:"aquí",cat:1},{texto:"bien",cat:2},{texto:"mucho",cat:3},{texto:"mañana",cat:0}],
       retro:"Ayer/mañana: tiempo. Aquí: lugar. Bien: modo. Mucho: cantidad."}},
    {id:"g1_6", nombre:"La preposición",
     concepto:"La preposición une palabras y establece relación. Las principales: a, ante, bajo, con, contra, de, desde, en, entre, hacia, hasta, para, por, según, sin, sobre, tras.",
     ejemplo:"«Casa de madera» (materia). «Viajó a Bogotá» (destino). «Trabaja para ella» (beneficio).",
     ejercicio:{tipo:"fill", consigna:"Elige la preposición correcta.",
       texto:"«El libro ___ matemáticas» (tema) · «Voy ___ Medellín» (destino) · «Estudia ___ aprobar» (finalidad).",
       respuestas:[["de"],["a","para"],["para"]],
       retro:"«De matemáticas» (tema), «a Medellín» (destino), «para aprobar» (finalidad)."}},
    {id:"g1_7", nombre:"La conjunción",
     concepto:"La conjunción une palabras, sintagmas u oraciones. Puede ser coordinante (y, o, pero) o subordinante (que, porque, si, cuando).",
     ejemplo:"«Estudia y trabaja» (coordinante copulativa). «Quiero que vengas» (subordinante). «Si vienes, avísame» (subordinante condicional).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada conjunción.",
       categorias:["Coordinante","Subordinante"],
       items:[{texto:"y",cat:0},{texto:"que",cat:1},{texto:"pero",cat:0},{texto:"porque",cat:1},{texto:"o",cat:0},{texto:"si",cat:1}],
       retro:"Coordinantes: y, o, pero. Subordinantes: que, porque, si."}},
    {id:"g1_8", nombre:"La interjección",
     concepto:"La interjección expresa emoción o reacción: ¡ay!, ¡oh!, ¡eh!, ¡caramba! Se escriben entre signos de exclamación.",
     ejemplo:"«¡Ay! Me duele». «¡Oh! No lo sabía». «¡Caramba! Qué sorpresa».",
     ejercicio:{tipo:"fill", consigna:"Coloca los signos de exclamación.",
       texto:"«___Ay___ Me duele mucho» → ___Ay___ Me duele mucho.",
       respuestas:[["¡"],["!"]],
       retro:"Las interjecciones se escriben entre signos de exclamación: ¡Ay!"}},
    {id:"g1_9", nombre:"Locuciones",
     concepto:"Las locuciones son grupos de palabras que funcionan como una sola unidad: locución adverbial (de repente), prepositiva (a causa de), conjuntiva (sin embargo), verbal (dar a entender).",
     ejemplo:"«De repente» (adverbial). «A causa de» (prepositiva). «Sin embargo» (conjuntiva). «Hacer caso» (verbal).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada locución.",
       categorias:["Adverbial","Prepositiva","Conjuntiva"],
       items:[{texto:"de repente",cat:0},{texto:"a causa de",cat:1},{texto:"sin embargo",cat:2},{texto:"a pesar de",cat:1},{texto:"de pronto",cat:0}],
       retro:"«De repente» es adverbial. «A causa de» y «a pesar de» son prepositivas. «Sin embargo» es conjuntiva."}},
    {id:"g1_10", nombre:"Categorías y función",
     concepto:"La categoría de una palabra es fija (sustantivo, verbo...). La función es variable según el contexto (sujeto, complemento directo...). La misma palabra puede cumplir distintas funciones.",

       correcta:1,
       retro:"La categoría (sustantivo, verbo) es una propiedad de la palabra. La función (sujeto, CD) es la que cumple en la oración."}}
  ]},

/* ---------- Bloque 2 ---------- */
{ id:"g2", nombre:"Sustantivo y adjetivo", emoji:"📕",
  desc:"Género, número, concordancia y clases de sustantivo y adjetivo.",
  tecnicas:[
    {id:"g2_1", nombre:"Género del sustantivo",
     concepto:"El género es masculino o femenino. Existen sustantivos comunes en cuanto al género (el/la estudiante), epicenos (la víctima, masculino o femenino indistinto) y ambiguos (el/la mar).",

       categorias:["Común","Epiceno","Ambiguo"],
       items:[{texto:"el/la estudiante",cat:0},{texto:"la víctima",cat:1},{texto:"el/la mar",cat:2},{texto:"el/la periodista",cat:0},{texto:"la persona",cat:1}],
       retro:"Común: cambia artículo pero no forma. Epiceno: solo un género gramatical, cualquier sexo real. Ambiguo: admite los dos géneros."}},
    {id:"g2_2", nombre:"Número del sustantivo",
     concepto:"El plural se forma añadiendo -s (si termina en vocal) o -es (si termina en consonante). Excepciones: régimen→regímenes, carácter→caracteres, él→elles.",

    {id:"g2_3", nombre:"Sustantivos comunes y propios",
     concepto:"Los comunes designan clases (ciudad, río). Los propios designan individuos únicos y van en mayúscula (Bogotá, Magdalena).",

     ejercicio:{tipo:"classify", consigna:"Clasifica cada sustantivo.",

    {id:"g2_4", nombre:"Sustantivos abstractos y concretos",

    {id:"g2_6", nombre:"Adjetivo determinativo",

    {id:"g2_7", nombre:"Grados del adjetivo",
     concepto:"Positivo: cualidad sin comparar (alto). Comparativo: de igualdad (tan alto como), de superioridad (más alto que), de inferioridad (menos alto que). Superlativo: absoluto (altísimo) o relativo (el más alto).",

/* ---------- Bloque 3 ---------- */
{ id:"g3", nombre:"El verbo", emoji:"⚙",

       retro:"Hablo (1.ª -ar), comes (2.ª -er), vive (3.ª -ir)."}},
    {id:"g3_3", nombre:"Pretérito perfecto simple",
     concepto:"Expresa acciones pasadas y terminadas: «ayer estudié». Es el pretérito por excelencia de la narración.",
     ejemplo:"«Ayer estudié gramática». «En 1810 se inició la independencia». «Llegó tarde».",
     ejercicio:{tipo:"fill", consigna:"Conjuga en pretérito perfecto simple.",
       texto:"Yo ___ (cantar) · Tú ___ (comer) · Él ___ (vivir).",
       respuestas:[["cante","canté"],["comiste"],["vivio","vivió"]],
       retro:"Canté, comiste, vivió. El pretérito perfecto simple marca acciones terminadas."}},
    {id:"g3_4", nombre:"Pretérito imperfecto",
     concepto:"Expresa acciones pasadas habituales o en desarrollo. Es el tiempo de la descripción y del fondo narrativo.",
     ejemplo:"«Cuando era niño, jugaba en el parque». «Llovía cuando llegó».",
     ejercicio:{tipo:"fill", consigna:"Conjuga en imperfecto.",
       texto:"Yo ___ (cantar) · Tú ___ (comer) · Él ___ (vivir).",
       respuestas:[["cantaba"],["comias","comías"],["vivia","vivía"]],
       retro:"Cantaba, comías, vivía. El imperfecto describe o marca hábito en el pasado."}},
    {id:"g3_5", nombre:"Pretérito perfecto compuesto",
     concepto:"Expresa acciones pasadas con relación al presente: «he estudiado» (hoy, esta semana). Se forma con haber + participio.",
     ejemplo:"«He estudiado toda la mañana». «¿Has visto la película?». «Hemos llegado».",
     ejercicio:{tipo:"fill", consigna:"Conjuga en pretérito perfecto compuesto.",
       texto:"Yo ___ (estudiar) · Tú ___ (comer) · Él ___ (vivir).",
       respuestas:[["he estudiado"],["has comido"],["ha vivido"]],
       retro:"He estudiado, has comido, ha vivido. Se forma con haber + participio."}},
    {id:"g3_6", nombre:"Futuro simple",
     concepto:"Expresa acciones futuras: «estudiaré». También expresa probabilidad o mandato: «Serán las cinco», «No matarás».",
     ejemplo:"«Mañana estudiaré». «Serán las tres» (probabilidad). «No robarás» (mandato).",
     ejercicio:{tipo:"fill", consigna:"Conjuga en futuro simple.",
       texto:"Yo ___ (cantar) · Tú ___ (comer) · Él ___ (vivir).",
       respuestas:[["cantare","cantaré"],["comeras","comerás"],["vivira","vivirá"]],
       retro:"Cantaré, comerás, vivirá. Todas las personas llevan tilde excepto la 1.ª plural (cantaremos)."}},
    {id:"g3_7", nombre:"Condicional simple",
     concepto:"Expresa acciones hipotéticas, cortesía o consecuencia de una condición: «estudiaría», «¿podrías ayudarme?».",
     ejemplo:"«Si tuviera tiempo, estudiaría más». «¿Podrías ayudarme?» (cortesía).",
     ejercicio:{tipo:"fill", consigna:"Conjuga en condicional simple.",
       texto:"Yo ___ (cantar) · Tú ___ (comer) · Él ___ (vivir).",
       respuestas:[["cantaria","cantaría"],["comerias","comerías"],["viviria","viviría"]],
       retro:"Cantaría, comerías, viviría. El condicional expresa hipótesis o cortesía."}},
    {id:"g3_8", nombre:"Modo subjuntivo: presente",
     concepto:"El subjuntivo expresa deseo, duda, temor, posibilidad, valoración. Presente: «que yo cante», «que tú comas», «que él viva».",
     ejemplo:"«Quiero que estudies». «Ojalá llueva». «Es posible que venga».",
     ejercicio:{tipo:"fill", consigna:"Conjuga en presente de subjuntivo.",
       texto:"Que yo ___ (cantar) · Que tú ___ (comer) · Que él ___ (vivir).",
       respuestas:[["cante"],["comas"],["viva"]],
       retro:"Cante, comas, viva. El subjuntivo se usa tras verbos de deseo, duda o valoración."}},
    {id:"g3_9", nombre:"Formas no personales",
     concepto:"Infinitivo (cantar), gerundio (cantando) y participio (cantado) no tienen persona gramatical. El infinitivo funciona como sustantivo; el gerundio como adverbio; el participio como adjetivo.",
     ejemplo:"«Cantar es bello» (infinitivo = sujeto). «Estoy cantando» (gerundio). «He cantado» (participio).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada forma no personal.",
       categorias:["Infinitivo","Gerundio","Participio"],
       items:[{texto:"cantar",cat:0},{texto:"cantando",cat:1},{texto:"cantado",cat:2},{texto:"comer",cat:0},{texto:"vivido",cat:2}],
       retro:"Infinitivo: -ar, -er, -ir. Gerundio: -ando, -iendo. Participio: -ado, -ido (regulares)."}},
    {id:"g3_10", nombre:"Perífrasis verbales",
     concepto:"La perífrasis verbal combina un verbo auxiliar + forma no personal: «ir a + infinitivo» (futuro), «estar + gerundio» (acción en curso), «tener + participio» (obligación), «deber + infinitivo» (obligación).",
     ejemplo:"«Voy a estudiar» (futuro inmediato). «Estoy estudiando» (en curso). «Tengo que estudiar» (obligación).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada perífrasis por su valor.",
       categorias:["Futuro","En curso","Obligación"],
       items:[{texto:"voy a estudiar",cat:0},{texto:"estoy estudiando",cat:1},{texto:"tengo que estudiar",cat:2},{texto:"debo estudiar",cat:2},{texto:"iré a estudiar",cat:0}],
       retro:"«Ir a + inf.»: futuro. «Estar + ger.»: en curso. «Tener que / deber + inf.»: obligación."}}
  ]},

/* ---------- Bloque 4 ---------- */
{ id:"g4", nombre:"Pronombres y determinantes", emoji:"👤",
  desc:"Personales, demostrativos, posesivos, relativos, leísmo, laísmo, loísmo.",
  tecnicas:[
    {id:"g4_1", nombre:"Pronombres personales tónicos",
     concepto:"Funcionan como sujeto o complemento con preposición: yo, tú, él/ella, nosotros, vosotros, ellos. Van con preposición en complementos: «a mí», «para ti».",
     ejemplo:"«Yo estudio». «A mí me gusta». «Para ti es fácil».",
     ejercicio:{tipo:"fill", consigna:"Completa con el pronombre tónico.",
       texto:"«A ___ me gusta» (yo) · «Para ___ es fácil» (tú) · «Según ___ , es correcto» (él).",
       respuestas:[["mi","mí"],["ti"],["el","él"]],
       retro:"«A mí», «para ti», «según él». Los tónicos con preposición llevan tilde en mí, tú, él."}},
    {id:"g4_2", nombre:"Pronombres átonos",
     concepto:"Funcionan como complemento directo o indirecto: me, te, lo/la, nos, os, los/las (CD); me, te, le, nos, os, les (CI). Van sin preposición.",
     ejemplo:"«Me vio» (CD). «Le dije» (CI). «Lo compré» (CD). «Nos llamó» (CD).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada pronombre átono.",
       categorias:["Complemento directo","Complemento indirecto"],
       items:[{texto:"lo vi",cat:0},{texto:"le dije",cat:1},{texto:"la compré",cat:0},{texto:"les entregué",cat:1},{texto:"los leí",cat:0}],
       retro:"Lo/la/los/las: CD. Le/les: CI. Se puede comprobar sustituyendo: si admite «a él», es CI."}},
    {id:"g4_3", nombre:"Pronombres demostrativos",
     concepto:"Este, ese, aquel (y sus variantes) señalan distancia respecto al hablante. Tradicionalmente podían llevar tilde diacrítica, pero la RAE ya no la recomienda.",
     ejemplo:"«Este libro» (cerca). «Ese libro» (media distancia). «Aquel libro» (lejos).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada demostrativo por la distancia.",
       categorias:["Cerca","Media","Lejos"],
       items:[{texto:"este",cat:0},{texto:"ese",cat:1},{texto:"aquel",cat:2},{texto:"esta",cat:0},{texto:"aquella",cat:2}],
       retro:"Este: cerca del hablante. Ese: cerca del oyente. Aquel: lejos de ambos."}},
    {id:"g4_4", nombre:"Pronombres posesivos",
     concepto:"Indican posesión: mío, tuyo, suyo, nuestro, vuestro (tónicos); mi, tu, su, nuestro, vuestro (átonos, determinantes).",
     ejemplo:"«El libro es mío» (tónico). «Mi libro» (átono/determinante). «Es tuyo».",
     ejercicio:{tipo:"fill", consigna:"Completa con el posesivo.",
       texto:"«El libro es ___ » (de mí) · «___ casa es grande» (de ti) · «Es ___ » (de él).",
       respuestas:[["mio","mío"],["tu","tú"],["suyo"]],
       retro:"Formas tónicas: mío, tuyo, suyo (tras verbo). Átonas: mi, tu, su (antes del sustantivo)."}},
    {id:"g4_5", nombre:"Pronombres relativos",
     concepto:"Introducen oraciones subordinadas adjetivas: que, quien, cual, cuyo. El antecedente es el sustantivo al que remiten.",
     ejemplo:"«El libro que leí». «La persona quien me ayudó» (poco frecuente). «El autor cuyo libro leí».",
     ejercicio:{tipo:"fill", consigna:"Completa con el relativo.",
       texto:"«El libro ___ leí» (cosa) · «La persona ___ me ayudó» (persona) · «El autor ___ libro leí» (posesión).",
       respuestas:[["que","el cual"],["que","quien"],["cuyo"]],
       retro:"«Que»: el más común. «Quien»: solo personas. «Cuyo»: posesión."}},
    {id:"g4_6", nombre:"Pronombres interrogativos y exclamativos",
     concepto:"Qué, quién, cuál, cuánto, dónde, cuándo, cómo introducen preguntas o exclamaciones. Llevan tilde diacrítica en interrogativas y exclamativas.",
     ejemplo:"«¿Qué quieres?». «¿Quién vino?». «¡Cuánto estudias!».",
     ejercicio:{tipo:"fill", consigna:"Coloca tilde donde corresponda.",
       texto:"«___Quien vino___ » → ¿___ vino? · «___Cuanto estudias!___ » → ¡___ estudias!",
       respuestas:[["quien","quién"],["cuanto","cuánto"]],
       retro:"En interrogativas y exclamativas, los interrogativos llevan tilde diacrítica: quién, cuánto, qué, cuál."}},
    {id:"g4_7", nombre:"Pronombres indefinidos",
     concepto:"Alguien, nadie, algo, nada, alguno, ninguno, todo, mucho, poco, varios. Indican cantidad o identidad imprecisa.",
     ejemplo:"«Alguien llamó». «Nadie vino». «Varios estudiaron». «Muchos aprobaron».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada indefinido.",
       categorias:["Existencia","Cantidad"],
       items:[{texto:"alguien",cat:0},{texto:"varios",cat:1},{texto:"nadie",cat:0},{texto:"muchos",cat:1},{texto:"algo",cat:0}],
       retro:"Alguien, nadie, algo: existencia. Varios, muchos, pocos: cantidad."}},
    {id:"g4_8", nombre:"Leísmo, laísmo y loísmo",
     concepto:"Leísmo: usar «le» por «lo» (CD masculino). Laísmo: usar «la» por «le» (CI femenino). Loísmo: usar «lo» por «le» (CI masculino). La norma culta solo admite leísmo de persona masculina.",
     ejemplo:"Correcto: «Le dije a María» (CI). «Lo vi a Juan» (CD). Laísmo: «La dije a María». Loísmo: «Lo dije a Juan» (por «le dije»).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada oración.",
       categorias:["Correcto","Leísmo","Laísmo","Loísmo"],
       items:[{texto:"Le entregué el libro a María.",cat:0},{texto:"La entregué el libro a María.",cat:2},{texto:"Lo dije a Juan que viniera.",cat:3},{texto:"Le vi a Juan (persona).",cat:1},{texto:"Lo vi (el libro).",cat:0}],
       retro:"La norma culta solo admite leísmo de persona masculina singular («le vi a Juan»). Rechaza laísmo y loísmo."}},
    {id:"g4_9", nombre:"Colocación de pronombres",
     concepto:"Los pronombres átonos van antepuestos al verbo conjugado (lo vi) y pospuestos al infinitivo, gerundio e imperativo afirmativo (verlo, viéndolo, dile).",
     ejemplo:"«Lo vi» (conjugado). «Verlo» (infinitivo). «Viéndolo» (gerundio). «Dile» (imperativo). «No le digas» (imperativo negativo, antepuesto).",
     ejercicio:{tipo:"fill", consigna:"Coloca el pronombre.",
       texto:"«___ ver» (lo) → ___ · «Estoy ___ » (viendo, lo) → ___ · «___ » (di, le) → ___ .",
       respuestas:[["verlo","verlo"],["viendolo","viéndolo"],["dile"]],
       retro:"Enclítico tras infinitivo, gerundio e imperativo afirmativo. Antepuesto tras verbo conjugado y en imperativo negativo."}},
    {id:"g4_10", nombre:"Reduplicación del objeto indirecto",
     concepto:"Cuando el objeto indirecto va antepuesto o es tónico, se reduplica con el pronombre átono: «A Juan le di el libro». Es obligatoria en español.",
     ejemplo:"«A Juan le di el libro» (obligatorio). «Le di el libro a Juan» (también correcto). «A mí me gusta» (obligatorio).",
     ejercicio:{tipo:"fill", consigna:"Completa la reduplicación.",
       texto:"«A María ___ entregué el informe» (le) · «A nosotros ___ invitaron» (nos) · «A ti ___ gusta» (te).",
       respuestas:[["le"],["nos"],["te"]],
       retro:"La reduplicación es obligatoria cuando el OI va antepuesto o es tónico."}}
  ]},

/* ---------- Bloque 5 ---------- */
{ id:"g5", nombre:"Oración simple", emoji:"🧩",
  desc:"Sujeto, predicado, CD, CI, CC, atributo y complementos.",
  tecnicas:[
    {id:"g5_1", nombre:"Sujeto y predicado",
     concepto:"La oración simple tiene sujeto (de quien se dice algo) y predicado (lo que se dice). El sujeto puede ser expreso u omitido (elidido).",
     ejemplo:"«El niño juega» → sujeto: el niño; predicado: juega. «Juega» (sujeto elidido: él/ella).",
     ejercicio:{tipo:"fill", consigna:"Separa sujeto y predicado.",
       texto:"«La profesora explica la lección» → Sujeto: ___ · Predicado: ___ .",
       respuestas:[["la profesora","La profesora"],["explica la leccion","explica la lección"]],
       retro:"Para reconocer el sujeto, se pregunta ¿quién? al verbo."}},
    {id:"g5_2", nombre:"Núcleo del sujeto",
     concepto:"El núcleo del sujeto es un sustantivo o pronombre. Puede llevar determinantes, adjetivos y complementos: «El niño alto de mi barrio juega» (núcleo: niño).",
     ejemplo:"«El estudiante aplicado estudia» → núcleo: estudiante. «Los tres niños juegan» → núcleo: niños.",
     ejercicio:{tipo:"fill", consigna:"Identifica el núcleo del sujeto.",
       texto:"«Los estudiantes de medicina estudian mucho» → núcleo: ___ .",
       respuestas:[["estudiantes"]],
       retro:"El núcleo del sujeto es el sustantivo principal: estudiantes."}},
    {id:"g5_3", nombre:"Núcleo del predicado",
     concepto:"El núcleo del predicado es el verbo. Todo predicado tiene un verbo como núcleo: «El niño corre rápido» (núcleo: corre).",
     ejemplo:"«El profesor explica la lección» → núcleo del predicado: explica.",
     ejercicio:{tipo:"fill", consigna:"Identifica el núcleo del predicado.",
       texto:"«La niña escribe una carta a su abuela» → núcleo: ___ .",
       respuestas:[["escribe"]],
       retro:"El verbo conjugado es el núcleo del predicado: escribe."}},
    {id:"g5_4", nombre:"Complemento directo",
     concepto:"El CD recibe la acción del verbo transitivo. Se sustituye por lo, la, los, las. Se pregunta ¿qué? al verbo. No lleva preposición (salvo con personas: «vi a Juan»).",
     ejemplo:"«Compré el libro» → CD: el libro → Lo compré. «Vi a María» → CD: a María → La vi.",
     ejercicio:{tipo:"fill", consigna:"Identifica el CD.",
       texto:"«El niño come una manzana» → CD: ___ · sustitución: ___ .",
       respuestas:[["una manzana"],["la come","se la come"]],
       retro:"El CD se sustituye por lo/la/los/las. «Una manzana → la come»."}},
    {id:"g5_5", nombre:"Complemento indirecto",
     concepto:"El CI indica el destinatario o beneficiario. Se sustituye por le/les. Se pregunta ¿a quién? o ¿para quién? al verbo.",
     ejemplo:"«Di el libro a Juan» → CI: a Juan → Le di el libro. «Compré flores para María» → CI: para María → Le compré flores.",
     ejercicio:{tipo:"fill", consigna:"Identifica el CI.",
       texto:"«Entregué el informe al jefe» → CI: ___ · sustitución: ___ .",
       respuestas:[["al jefe"],["le entregue el informe","le entregué el informe"]],
       retro:"El CI se sustituye por le/les. «Al jefe → le entregué el informe»."}},
    {id:"g5_6", nombre:"Complemento circunstancial",
     concepto:"El CC indica las circunstancias de la acción: tiempo, lugar, modo, causa, finalidad, instrumento, cantidad. Es opcional.",
     ejemplo:"«Estudia en la biblioteca» (lugar). «Llegó ayer» (tiempo). «Corre rápidamente» (modo). «Estudia para aprobar» (finalidad).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada CC.",
       categorias:["Tiempo","Lugar","Modo","Finalidad"],
       items:[{texto:"ayer",cat:0},{texto:"en la biblioteca",cat:1},{texto:"rápidamente",cat:2},{texto:"para aprobar",cat:3},{texto:"mañana",cat:0}],
       retro:"Tiempo: cuándo. Lugar: dónde. Modo: cómo. Finalidad: para qué."}},
    {id:"g5_7", nombre:"Atributo",
     concepto:"El atributo aparece con verbos copulativos (ser, estar, parecer). Concuerda con el sujeto y se sustituye por «lo». Puede ser adjetivo, sustantivo o sintagma.",
     ejemplo:"«El niño está cansado» → atributo: cansado. «María es médica» → atributo: médica. «Lo está».",
     ejercicio:{tipo:"fill", consigna:"Identifica el atributo.",
       texto:"«Mi hermana es inteligente» → atributo: ___ · sustitución: ___ .",
       respuestas:[["inteligente"],["lo es","lo es ella"]],
       retro:"El atributo se sustituye por «lo». «Es inteligente → lo es»."}},
    {id:"g5_8", nombre:"Complemento predicativo",
     concepto:"El predicativo modifica al verbo y a la vez al sujeto o al CD. Concuerda con él. Con verbos no copulativos: «Llegó cansado».",
     ejemplo:"«Llegó cansado» (predicativo del sujeto). «Encontré rota la silla» (predicativo del CD).",
     ejercicio:{tipo:"fill", consigna:"Identifica el predicativo.",
       texto:"«Los niños volvieron contentos» → predicativo: ___ .",
       respuestas:[["contentos"]],
       retro:"«Contentos» modifica al verbo (volvieron) y al sujeto (los niños). Es predicativo."}},
    {id:"g5_9", nombre:"Complemento de régimen",
     concepto:"El CRV es exigido por el verbo con una preposición específica: «depender de», «confiar en», «insistir en», «acordarse de». No es CC.",
     ejemplo:"«Depende de ti» (CRV). «Confío en ella» (CRV). «Insistió en el tema» (CRV).",
     ejercicio:{tipo:"fill", consigna:"Completa con la preposición del CRV.",
       texto:"«Depende ___ ti» · «Confío ___ ella» · «Insistió ___ el tema».",
       respuestas:[["de"],["en"],["en"]],
       retro:"Cada verbo rige una preposición: depender DE, confiar EN, insistir EN."}},
    {id:"g5_10", nombre:"Oraciones impersonales",
     concepto:"No tienen sujeto: con «haber» impersonal (hay, había), con verbos meteorológicos (llueve, nieva), con «se» impersonal (se dice), con «hacer» temporal (hace frío).",
     ejemplo:"«Hay mucha gente». «Llueve mucho». «Se dice que vendrá». «Hace frío».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada oración impersonal.",
       categorias:["Haber","Meteorológica","Se impersonal"],
       items:[{texto:"Hay mucha gente",cat:0},{texto:"Llueve mucho",cat:1},{texto:"Se dice que vendrá",cat:2},{texto:"Había muchos",cat:0},{texto:"Nieva",cat:1}],
       retro:"Haber impersonal: hay, había, hubo. Meteorológicas: llueve, nieva. Se impersonal: se dice, se comenta."}}
  ]},

/* ---------- Bloque 6 ---------- */
{ id:"g6", nombre:"Oración compuesta", emoji:"🔗",
  desc:"Coordinación, subordinación, yuxtaposición y estilo indirecto.",
  tecnicas:[
    {id:"g6_1", nombre:"Coordinación copulativa",
     concepto:"Une oraciones con «y» (o «e» ante i-): «Estudia y trabaja». Suma informaciones.",
     ejemplo:"«Cantó y bailó». «Padres e hijos vinieron».",
     ejercicio:{tipo:"fill", consigna:"Elige el conector.",
       texto:"«Estudia ___ trabaja» → ___ · «Padres ___ hijos» → ___ .",
       respuestas:[["y"],["e"]],
       retro:"«Y» ante consonante o vocal distinta de i-. «E» ante palabra que empieza por i- o hi- (excepto hie-)."}},
    {id:"g6_2", nombre:"Coordinación adversativa",
     concepto:"Une oraciones con «pero», «sino», «mas», «sin embargo»: expresa contraste.",
     ejemplo:"«Estudió mucho, pero no aprobó». «No es tonto, sino distraído».",
     ejercicio:{tipo:"fill", consigna:"Elige el conector.",
       texto:"«Quería ir, ___ no pudo» → ___ · «No es médico, ___ enfermero» → ___ .",
       respuestas:[["pero"],["sino"]],
       retro:"«Pero»: contraste. «Sino»: contraste tras negación, sustituye a algo."}},
    {id:"g6_3", nombre:"Coordinación disyuntiva",
     concepto:"Une con «o» (o «u» ante o-/ho-): presenta alternativas.",
     ejemplo:"«¿Vienes o te quedas?». «Uno u otro».",
     ejercicio:{tipo:"fill", consigna:"Elige el conector.",
       texto:"«¿Café ___ té?» → ___ · «Siete ___ ocho» → ___ .",
       respuestas:[["o"],["u"]],
       retro:"«O» normalmente. «U» ante palabra que empieza por o-/ho-: siete u ocho."}},
    {id:"g6_4", nombre:"Subordinadas sustantivas",
     concepto:"Cumplen función de sustantivo: sujeto, CD, CI... Van con «que», «si», «el que», infinitivo. Se sustituyen por «eso».",
     ejemplo:"«Quiero que vengas» (CD). «Me alegra que estés aquí» (sujeto). «Dime si vendrás» (CD).",
     ejercicio:{tipo:"fill", consigna:"Identifica la función de la subordinada.",
       texto:"«Quiero que vengas» → función: ___ · «Me alegra que estés» → función: ___ .",
       respuestas:[["complemento directo","CD"],["sujeto"]],
       retro:"Se sustituye por «eso»: «Quiero eso» (CD). «Me alegra eso» (sujeto)."}},
    {id:"g6_5", nombre:"Subordinadas adjetivas",
     concepto:"Modifican a un sustantivo antecedente. Van con «que», «quien», «cual», «cuyo». Se sustituyen por un adjetivo.",
     ejemplo:"«El libro que leí es bueno» (que leí modifica a libro). «La casa donde vivo» (adjetiva).",
     ejercicio:{tipo:"fill", consigna:"Identifica el antecedente.",
       texto:"«El chico que vino es mi primo» → antecedente: ___ · subordinada: ___ .",
       respuestas:[["chico","el chico"],["que vino"]],
       retro:"El antecedente es el sustantivo modificado. La subordinada adjetiva se puede sustituir por un adjetivo."}},
    {id:"g6_6", nombre:"Subordinadas adverbiales",
     concepto:"Funcionan como adverbios: expresan tiempo, lugar, modo, causa, finalidad, condición, consecuencia, concesión.",
     ejemplo:"«Cuando llegues, avísame» (tiempo). «Si estudias, aprobarás» (condición). «Como no estudió, reprobó» (causa).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada subordinada adverbial.",
       categorias:["Tiempo","Causa","Condición","Concesión"],
       items:[{texto:"cuando llegues",cat:0},{texto:"porque estudió",cat:1},{texto:"si estudias",cat:2},{texto:"aunque estudie",cat:3},{texto:"mientras leía",cat:0}],
       retro:"Tiempo: cuándo. Causa: por qué. Condición: si. Concesión: aunque."}},
    {id:"g6_7", nombre:"Yuxtaposición",
     concepto:"Oraciones unidas sin conjunción, solo con signos de puntuación: coma, punto y coma, dos puntos. «Llegó, vio, venció».",
     ejemplo:"«Llegó, vio, venció». «Estudia; aprueba». «No vino: estaba enfermo».",
     ejercicio:{tipo:"fill", consigna:"Une con yuxtaposición.",
       texto:"«Llegó. Vio. Venció.» → «Llegó, ___ , ___ ».",
       respuestas:[["vio"],["vencio","venció"]],
       retro:"La yuxtaposición une oraciones sin conjunción. La coma, el punto y coma y los dos puntos son los signos que las conectan."}},
    {id:"g6_8", nombre:"Correlación temporal",
     concepto:"En subordinadas, la elección del tiempo depende de la principal: «Quiero que vengas» (presente + subjuntivo), «Quería que vinieras» (pasado + imperfecto de subjuntivo).",
     ejemplo:"«Espero que vengas» (presente → presente subj.). «Esperaba que vinieras» (pasado → imperfecto subj.).",
     ejercicio:{tipo:"fill", consigna:"Ajusta el tiempo.",
       texto:"«Quiero que ___ (venir, tú)» → ___ · «Quería que ___ (venir, tú)» → ___ .",
       respuestas:[["vengas"],["vinieras"]],
       retro:"Con presente de la principal → presente de subjuntivo. Con pasado/codicional → imperfecto de subjuntivo."}},
    {id:"g6_9", nombre:"Estilo directo e indirecto",
     concepto:"Estilo directo: reproduce las palabras textuales («Vengo mañana»). Estilo indirecto: las integra con «que» y ajusta tiempos y pronombres (Dijo que vendría al día siguiente).",
     ejemplo:"Directo: «Vengo mañana». Indirecto: «Dijo que vendría al día siguiente».",
     ejercicio:{tipo:"fill", consigna:"Transforma a estilo indirecto.",
       texto:"«Estoy cansado» → «Dijo que ___ cansado».",
       respuestas:[["estaba"]],
       retro:"En el paso al indirecto, el presente pasa a imperfecto (estaba) y los deícticos se ajustan (mañana → al día siguiente)."}},
    {id:"g6_10", nombre:"Conectores y marcadores",
     concepto:"Los marcadores organizan el discurso: adición (además), contraste (sin embargo), causa (porque), consecuencia (por lo tanto), orden (en primer lugar), reformulación (es decir).",
     ejemplo:"«En primer lugar, llegó tarde. Sin embargo, trajo el trabajo. Por lo tanto, no hubo problema».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada marcador.",
       categorias:["Adición","Contraste","Consecuencia","Reformulación"],
       items:[{texto:"además",cat:0},{texto:"sin embargo",cat:1},{texto:"por lo tanto",cat:2},{texto:"es decir",cat:3},{texto:"no obstante",cat:1}],
       retro:"Adición: además, asimismo. Contraste: sin embargo, no obstante. Consecuencia: por lo tanto. Reformulación: es decir."}}
  ]},

/* ---------- Bloque 7 ---------- */
{ id:"g7", nombre:"Concordancia y régimen", emoji:"⚖",
  desc:"Concordancia sujeto-verbo, régimen preposicional, queísmo y dequeísmo.",
  tecnicas:[
    {id:"g7_1", nombre:"Concordancia sujeto-verbo",
     concepto:"El verbo concuerda con el sujeto en persona y número. Es una de las reglas más firmes del español: «Los niños juegan» (no «juega»).",
     ejemplo:"«El estudiante estudia». «Los estudiantes estudian». «Tú y yo estudiamos».",
     ejercicio:{tipo:"fill", consigna:"Corrige la concordancia.",
       texto:"«Los niños juega en el parque» → «Los niños ___ en el parque».",
       respuestas:[["juegan","juego","juega"]],
       retro:"Sujeto plural → verbo plural. «Los niños juegan»."}},
    {id:"g7_2", nombre:"Concordancia con sujeto compuesto",
     concepto:"Con dos o más sujetos coordinados, el verbo va en plural. Si los sujetos son de distinta persona, prevalece la 1.ª sobre la 2.ª y la 2.ª sobre la 3.ª.",
     ejemplo:"«Juan y María estudian». «Tú y yo estudiamos» (1.ª prevalece). «Tú y él estudiáis» (2.ª prevalece en España) / «estudian» (América).",
     ejercicio:{tipo:"fill", consigna:"Conjuga correctamente.",
       texto:"«Pedro y Ana ___ (estudiar) mucho» → ___ .",
       respuestas:[["estudian"]],
       retro:"Sujeto compuesto de 3.ª personas → verbo en 3.ª plural: estudian."}},
    {id:"g7_3", nombre:"Concordancia con colectivos",
     concepto:"Con sustantivos colectivos (grupo, gente, equipo, mayoría), el verbo puede ir en singular (concordancia gramatical) o en plural (concordancia de sentido). En Colombia se prefiere el singular.",
     ejemplo:"«El grupo llegó» (singular, preferido). «La mayoría votó» o «La mayoría votaron» (ambos válidos).",
     ejercicio:{tipo:"fill", consigna:"Concuerda con el colectivo.",
       texto:"«El equipo ___ (ganar) el partido» → ___ .",
       respuestas:[["gano","ganó","ganaron"]],
       retro:"Con colectivo en singular, el verbo puede ir en singular (preferido) o en plural. «El equipo ganó»."}},
    {id:"g7_4", nombre:"Concordancia en impersonales",
     concepto:"Los verbos impersonales (haber, hacer, llover) van siempre en 3.ª persona singular: «Hay muchos libros» (no «habían»). «Hace cinco años».",
     ejemplo:"«Hay mucha gente». «Había muchos libros». «Hace cinco años». No: «Habían muchos».",
     ejercicio:{tipo:"fill", consigna:"Corrige la concordancia.",
       texto:"«Habían muchos estudiantes» → «___ muchos estudiantes».",
       respuestas:[["habia","había"]],
       retro:"El verbo haber impersonal va siempre en 3.ª singular: «había muchos estudiantes»."}},
    {id:"g7_5", nombre:"Régimen preposicional",
     concepto:"Muchos verbos exigen una preposición específica: depender de, confiar en, consistir en, insistir en, aspirar a, tender a.",
     ejemplo:"«Depende de ti». «Confío en ella». «Consiste en estudiar». «Aspira a ganar».",
     ejercicio:{tipo:"fill", consigna:"Elige la preposición correcta.",
       texto:"«Depende ___ ti» · «Confío ___ ella» · «Consiste ___ estudiar».",
       respuestas:[["de"],["en"],["en"]],
       retro:"Depender DE, confiar EN, consistir EN. El régimen es obligatorio."}},
    {id:"g7_6", nombre:"Queísmo",
     concepto:"El queísmo es omitir «de» cuando el verbo o la expresión la exige: «Me di cuenta que» por «Me di cuenta de que». Verbos y expresiones: darse cuenta de, acordarse de, alegrarse de, estar seguro de.",
     ejemplo:"Incorrecto: «Me di cuenta que faltaba». Correcto: «Me di cuenta de que faltaba».",
     ejercicio:{tipo:"fill", consigna:"Corrige el queísmo.",
       texto:"«Estoy seguro que vendrá» → «Estoy seguro ___ que vendrá».",
       respuestas:[["de"]],
       retro:"«Estar seguro» rige «de que». El queísmo es un error en la norma culta."}},
    {id:"g7_7", nombre:"Dequeísmo",
     concepto:"El dequeísmo es añadir «de» cuando el verbo no la exige: «Pienso de que» por «Pienso que». Verbos que NO llevan «de»: pensar, creer, considerar, opinar, decir, saber.",
     ejemplo:"Incorrecto: «Creo de que vendrá». Correcto: «Creo que vendrá».",
     ejercicio:{tipo:"fill", consigna:"Elimina el dequeísmo.",
       texto:"«Considero de que es correcto» → «Considero ___ es correcto».",
       respuestas:[["que"]],
       retro:"«Considerar» rige «que», no «de que». El dequeísmo es un error frecuente."}},
    {id:"g7_8", nombre:"Verbos que rigen preposición",
     concepto:"Algunos verbos cambian de significado según la preposición: «contar con» (confiar), «contar» (narrar); «tratar de» (intentar), «tratar a» (relacionarse); «pensar en» (recordar), «pensar de» (opinar).",
     ejemplo:"«Cuento contigo» (confío). «Cuento un cuento» (narro). «Pienso en ti» (recuerdo).",
     ejercicio:{tipo:"fill", consigna:"Elige la preposición.",
       texto:"«Pienso ___ ti todos los días» (recordar) · «¿Qué piensas ___ esto?» (opinar).",
       respuestas:[["en"],["de"]],
       retro:"«Pensar en» = recordar. «Pensar de» = opinar. La preposición cambia el significado."}},
    {id:"g7_9", nombre:"Concordancia del adjetivo",
     concepto:"El adjetivo concuerda en género y número con el sustantivo al que modifica. Con dos sustantivos de distinto género, va en masculino plural.",
     ejemplo:"«Casa blanca», «casas blancas». «El niño y la niña están contentos».",
     ejercicio:{tipo:"fill", consigna:"Concuerda el adjetivo.",
       texto:"«Los libros y las revistas están ___ (nuevo)» → ___ .",
       respuestas:[["nuevos"]],
       retro:"Con dos sustantivos de distinto género, el adjetivo va en masculino plural: nuevos."}},
    {id:"g7_10", nombre:"Concordancia del pronombre",
     concepto:"El pronombre concuerda con el sustantivo al que sustituye en género y número. «Compré las flores → las compré».",
     ejemplo:"«Vi a María → la vi». «Compré los libros → los compré». «Entregué los informes a los jefes → se los entregué».",
     ejercicio:{tipo:"fill", consigna:"Sustituye por el pronombre correcto.",
       texto:"«Compré las flores» → «___ compré» (las). · «Vi a los niños» → «___ vi» (los).",
       respuestas:[["las"],["los"]],
       retro:"El pronombre CD concuerda en género y número con el sustantivo."}}
  ]},

/* ---------- Bloque 8 ---------- */
{ id:"g8", nombre:"Puntuación", emoji:"¶",
  desc:"Coma, punto y coma, dos puntos, comillas, paréntesis, guiones.",
  tecnicas:[
    {id:"g8_1", nombre:"Coma en enumeraciones",
     concepto:"La coma separa elementos de una enumeración. El último se une con «y» u «o» sin coma previa.",
     ejemplo:"«Compré pan, leche, huevos y queso».",
     ejercicio:{tipo:"fill", consigna:"Coloca las comas.",
       texto:"«Fui al mercado y compré frutas verduras carnes y pescado» → «Fui al mercado y compré frutas___ verduras___ carnes___ y pescado».",
       respuestas:[[","],[","],[","]],
       retro:"Los elementos de la enumeración se separan con coma; el último se une con «y» sin coma previa."}},
    {id:"g8_2", nombre:"Coma vocativa",
     concepto:"El vocativo (a quien nos dirigimos) se separa siempre con coma. «María, ven aquí». «Oye, Juan, escucha».",
     ejemplo:"«Profesor, tengo una pregunta». «Apreciados estudiantes, atención».",
     ejercicio:{tipo:"fill", consigna:"Coloca la coma vocativa.",
       texto:"«Señor Presidente___ le informo».",
       respuestas:[[","]],
       retro:"El vocativo se separa con coma. Es uno de los usos más firmes."}},
    {id:"g8_3", nombre:"Coma en incisos",
     concepto:"Los incisos o aclaraciones se encierran entre comas. Se pueden eliminar sin que la oración pierda sentido.",
     ejemplo:"«Bogotá, capital de Colombia, es una ciudad grande». «Mi hermano, que vive en Cali, vendrá».",
     ejercicio:{tipo:"fill", consigna:"Coloca las comas del inciso.",
       texto:"«Mi hermano ___ que vive en Cali ___ vendrá».",
       respuestas:[[","],[","]],
       retro:"Los incisos van entre comas. Se pueden quitar sin alterar la estructura básica."}},
    {id:"g8_4", nombre:"Punto y coma",
     concepto:"Separa oraciones relacionadas de cierta extensión. Ante conectores (sin embargo, no obstante) cuando unen periodos largos. En enumeraciones complejas.",
     ejemplo:"«Llegó tarde; sin embargo, trajo el trabajo». «Compró pan, queso y vino; también trajo frutas».",
     ejercicio:{tipo:"fill", consigna:"Coloca punto y coma o coma.",
       texto:"«Llegó tarde ___ sin embargo ___ trajo el trabajo».",
       respuestas:[[";"],[""]],
       retro:"Ante «sin embargo» que une periodos largos, se usa punto y coma; después del conector, coma."}},
    {id:"g8_5", nombre:"Dos puntos",
     concepto:"Anuncian enumeración, cita textual, consecuencia, ejemplos. «Trajo tres cosas: pan, vino y queso». «Dijo: “Vengo”».",
     ejemplo:"«Los objetivos son: aprender, aplicar y evaluar». «Como dijo Ortega: “Yo soy yo y mi circunstancia”».",
     ejercicio:{tipo:"fill", consigna:"Coloca los dos puntos.",
       texto:"«Trajo tres cosas___ pan, vino y queso».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian enumeración, cita o consecuencia."}},
    {id:"g8_6", nombre:"Punto",
     concepto:"El punto cierra oración (seguido), párrafo (aparte) o texto (final). Después se escribe mayúscula.",
     ejemplo:"«Estudia. Luego descansa. Después continúa».",
     ejercicio:{tipo:"fill", consigna:"Coloca los puntos.",
       texto:"«Estudia___ Luego descansa___ Después continúa».",
       respuestas:[["."],["."]],
       retro:"Cada oración termina en punto. Después, mayúscula."}},
    {id:"g8_7", nombre:"Comillas",
     concepto:"Encierran citas textuales, títulos de artículos o poemas, términos específicos. Pueden ser latinas (« »), inglesas (“ ”) o simples (‘ ’).",
     ejemplo:"«Dijo: “Vengo mañana”». «El poema “Altazor” de Huidobro».",
     ejercicio:{tipo:"fill", consigna:"Coloca comillas.",
       texto:"«El poema ___Altazor___ de Huidobro es famoso».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran citas y títulos de obras breves (poemas, artículos)."}},
    {id:"g8_8", nombre:"Paréntesis y corchetes",
     concepto:"Los paréntesis encierran información complementaria. Los corchetes, aclaraciones dentro de citas o datos.",
     ejemplo:"«Cervantes (autor del Quijote) nació en Alcalá». «El autor afirma: “La lectura [comprensiva] exige tiempo”».",
     ejercicio:{tipo:"fill", consigna:"Coloca paréntesis.",
       texto:"«Cervantes ___autor del Quijote___ nació en Alcalá».",
       respuestas:[["("],[")",""]],
       retro:"Los paréntesis encierran aclaraciones complementarias."}},
    {id:"g8_9", nombre:"Guiones y rayas",
     concepto:"El guion (-) une palabras (teórico-práctico). La raya (—) introduce diálogos o aclaraciones en textos narrativos.",
     ejemplo:"«El enfoque teórico-práctico es útil». «—Ven aquí —dijo Ana—. Te espero».",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada uso.",
       categorias:["Guion (-)","Raya (—)"],
       items:[{texto:"teórico-práctico",cat:0},{texto:"—dijo Ana—",cat:1},{texto:"histórico-crítico",cat:0},{texto:"—respondió—",cat:1},{texto:"político-económico",cat:0}],
       retro:"El guion une; la raya introduce diálogos o aclaraciones."}},
    {id:"g8_10", nombre:"Signos en diálogos",
     concepto:"En diálogos, cada intervención se introduce con raya y se cierra cuando sigue narración: «—Hola —dijo—. ¿Cómo estás?». El punto va tras el cierre.",
     ejemplo:"«—Hola —dijo María—. ¿Cómo estás?».",
     ejercicio:{tipo:"fill", consigna:"Coloca las rayas.",
       texto:"«___Hola ___dijo María___ ¿Cómo estás?» → «___Hola ___dijo María___ . ¿Cómo estás?»",
       respuestas:[["—"],["—"],["—"]],
       retro:"Cada intervención lleva raya. La narración intercalada va también entre rayas."}}
  ]},

/* ---------- Bloque 9 ---------- */
{ id:"g9", nombre:"Vicios gramaticales", emoji:"⚠",
  desc:"Pleonasmo, anfibología, cosismo, anacoluto, cacofonía y más.",
  tecnicas:[
    {id:"g9_1", nombre:"Pleonasmo",
     concepto:"Repetición innecesaria de una idea: «subir arriba», «lo vi con mis propios ojos», «breve y conciso». Es un vicio de estilo.",
     ejemplo:"Incorrecto: «Subió arriba al segundo piso». Correcto: «Subió al segundo piso».",
     ejercicio:{tipo:"fill", consigna:"Elimina la redundancia.",
       texto:"«Debe ser breve y conciso» → «Debe ser ___ ».",
       respuestas:[["breve","conciso"]],
       retro:"«Breve y conciso» es redundante. Basta con uno de los dos."}},
    {id:"g9_2", nombre:"Anfibología",
     concepto:"Ambigüedad por doble interpretación sintáctica. «Vi a Juan con prismáticos» puede ser: yo con prismáticos, o Juan con prismáticos.",
     ejemplo:"Ambiguo: «Vi a Juan con prismáticos». Claro: «Con prismáticos, vi a Juan» o «Vi a Juan, que llevaba prismáticos».",
     ejercicio:{tipo:"fill", consigna:"Elimina la ambigüedad.",
       texto:"«Compré el libro de Juan» (¿Juan escribió el libro o es de su propiedad?) → «Compré el libro ___ escribió Juan» o «Compré el libro ___ pertenece a Juan».",
       respuestas:[["que"],["que"]],
       retro:"La anfibología se corrige explicitando la relación. En el lenguaje formal, la claridad es obligatoria."}},
    {id:"g9_3", nombre:"Cosismo",
     concepto:"Abuso de «cosa» o «cosas» en lugar de términos precisos. Es un vicio de pobreza léxica.",
     ejemplo:"Incorrecto: «Sucedió una cosa en la reunión». Correcto: «Se aprobó una decisión en la reunión».",
     ejercicio:{tipo:"fill", consigna:"Sustituye «cosa».",
       texto:"«Sucedió una cosa importante» → «Se presentó un ___ importante».",
       respuestas:[["hecho","evento","incidente","acuerdo","problema"]],
       retro:"El cosismo es señal de imprecisión. En textos formales, se exige el término exacto."}},
    {id:"g9_4", nombre:"Queísmo y dequeísmo",
     concepto:"Queísmo: omitir «de» cuando corresponde («Me di cuenta que»). Dequeísmo: añadir «de» cuando no corresponde («Pienso de que»). Ambos son errores.",
     ejemplo:"Correcto: «Me di cuenta de que faltaba» (queísmo evitado). «Pienso que vendrá» (dequeísmo evitado).",
     ejercicio:{tipo:"classify", consigna:"Clasifica cada error.",
       categorias:["Queísmo","Dequeísmo"],
       items:[{texto:"Me di cuenta que faltaba.",cat:0},{texto:"Pienso de que vendrá.",cat:1},{texto:"Estoy seguro que es así.",cat:0},{texto:"Creo de que es correcto.",cat:1},{texto:"Me alegro que vengas.",cat:0}],
       retro:"Queísmo: falta «de» («me di cuenta que»). Dequeísmo: sobra «de» («pienso de que»)."}},
    {id:"g9_5", nombre:"Anacoluto",
     concepto:"Ruptura de la estructura sintáctica: la oración empieza de una manera y termina de otra. «Yo, mi opinión es diferente» (anacoluto).",
     ejemplo:"Anacoluto: «Los estudiantes que llegaron tarde, sus padres fueron citados». Correcto: «A los estudiantes que llegaron tarde se les citó a sus padres».",
     ejercicio:{tipo:"fill", consigna:"Reescribe sin anacoluto.",
       texto:"«El informe que presentó el técnico, sus conclusiones son claras» → «Las conclusiones del informe presentado por el técnico son ___ ».",
       respuestas:[["claras"]],
       retro:"El anacoluto se corrige reorganizando la oración completa."}},
    {id:"g9_6", nombre:"Cacofonía",
     concepto:"Repetición de sonidos desagradables: «el área del área», «la coordinación coordina». Distrae y resta elegancia.",
     ejemplo:"Cacofónico: «El área del área administrativa». Mejor: «El área administrativa».",
     ejercicio:{tipo:"fill", consigna:"Corrige la cacofonía.",
       texto:"«El acta del acto fue archivada en el archivo» → «El acta del acto fue archivada en el ___ ».",
       respuestas:[["deposito","depósito","fondo documental","archivo central"]],
       retro:"La cacofonía se corrige por sustitución léxica."}},
    {id:"g9_7", nombre:"Barbarismos",
     concepto:"Formas incorrectas: «haiga» por «haya», «dijieron» por «dijeron», «vinistes» por «viniste», «prevee» por «prevé».",
     ejemplo:"Correcto: «Espero que haya», «ellos dijeron», «tú viniste», «el reglamento prevé».",
     ejercicio:{tipo:"fill", consigna:"Corrige el barbarismo.",
       texto:"«Se espera que haiga respuesta» → «Se espera que ___ respuesta».",
       respuestas:[["haya"]],
       retro:"«Haiga» es un barbarismo. La forma correcta es «haya»."}},
    {id:"g9_8", nombre:"Ultracorrección",
     concepto:"Corregir lo que no está mal: «Bogotà», «dijistes», «vinistes». Es un error por exceso de celo.",
     ejemplo:"Incorrecto: «Tú dijistes». Correcto: «Tú dijiste».",
     ejercicio:{tipo:"fill", consigna:"Corrige la ultracorrección.",
       texto:"«Tú vinistes ayer» → «Tú ___ ayer».",
       respuestas:[["viniste"]],
       retro:"La 2.ª persona singular del pretérito perfecto simple nunca lleva -s final: viniste, dijiste."}},
    {id:"g9_9", nombre:"Impropiedad léxica",
     concepto:"Usar una palabra con significado distinto al que tiene: «evaluación» por «calificación», «intoxicación» por «infección».",
     ejemplo:"Incorrecto: «La evaluación de Juan fue 4,5». Correcto: «La calificación de Juan fue 4,5».",
     ejercicio:{tipo:"fill", consigna:"Elige el término correcto.",
       texto:"«La ___ de Juan fue 4,5» (evaluación / calificación) → ___ .",
       respuestas:[["calificacion","calificación"]],
       retro:"«Calificación» es la nota; «evaluación» es el proceso completo."}},
    {id:"g9_10", nombre:"Abuso del gerundio",
     concepto:"El gerundio de posterioridad es incorrecto: «Se casó, teniendo un hijo» (por «y tuvo»). También el gerundio especificativo mal usado.",
     ejemplo:"Incorrecto: «Se casó, teniendo un hijo». Correcto: «Se casó y tuvo un hijo».",
     ejercicio:{tipo:"fill", consigna:"Sustituye el gerundio.",
       texto:"«Se casó, teniendo un hijo» → «Se casó y ___ un hijo».",
       respuestas:[["tuvo"]],
       retro:"El gerundio de posterioridad se sustituye por coordinación con verbo conjugado."}}
  ]},

/* ---------- Bloque 10 ---------- */
{ id:"g10", nombre:"Estilo y revisión", emoji:"✓",
  desc:"Claridad, cohesión, coherencia, revisión por capas y práctica.",
  tecnicas:[
    {id:"g10_1", nombre:"La oración clara",
     concepto:"La oración clara tiene sujeto y verbo identificables, orden natural, sin ambigüedad y sin incisos excesivos. Se lee una vez y se entiende.",
     ejemplo:"«El profesor explicó la lección a los estudiantes» es clara. «La lección, el profesor, a los estudiantes, explicó» es oscura.",
     ejercicio:{tipo:"quiz", consigna:"¿Qué caracteriza a una oración clara?",
       opciones:["Que sea larga y detallada","Que tenga orden natural, sujeto y verbo identificables y sin ambigüedad","Que use muchas subordinadas","Que incluya tecnicismos"],
       correcta:1,
       retro:"La claridad exige orden natural, identificación de funciones y ausencia de ambigüedad."}},
    {id:"g10_2", nombre:"La oración larga",
