<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Jurídica Colombiana · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e8ecf3;
    --paper:#fffdf8;
    --paper-2:#f5f7fb;
    --ink:#111c2e;
    --muted:#5c6a80;
    --line:#ccd4e0;
    --line-2:#b3bfd0;
    --accent:#1e3a5f;
    --accent-dark:#0f2545;
    --accent-soft:#dbe6f5;
    --gold:#b8860b;
    --gold-dark:#8b6508;
    --gold-soft:#fdf6e3;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(15,30,60,.06), 0 12px 30px rgba(15,30,60,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    background:
      radial-gradient(circle at 15% 0%, #f4f7fc 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,253,248,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #b0c4de;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:system-ui,sans-serif;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600; font-family:system-ui,sans-serif;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d4dce8; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#1e3a5f,#b8860b); transition:width .4s;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eef3fa; border-color:#8fa3be;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f5f7fb; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
    font-family:system-ui,sans-serif;
  }
  .cat-head:hover{background:#eef3fa;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    background:var(--gold-soft); color:var(--gold-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dae1ec; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#2a3a52;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link:hover{background:#eef3fa;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--gold));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #b0c4de; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(30,58,95,.22); border-color:var(--accent);}

  /* flashcard · papel con renglones azulados */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fffdf8;
    background-image:
      linear-gradient(transparent 27px, rgba(30,58,95,.13) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
    box-shadow:inset 22px 0 0 -21px #d4a72c;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #b0c4de;
    background-color:#f5f9ff;
    box-shadow:inset 22px 0 0 -21px #7aa2d4;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:28px; color:#1a2438;}
  .fc-back p{color:#1e3a5f;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#8a99b0; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
    font-family:system-ui,sans-serif;
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#2a3a52;
    background:#f5f7fb; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f5f9ff; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dae1ec; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#1a2438;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--gold);
    background:#fdf9ed; color:var(--gold-dark); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fdf6e3; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-family:system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eef3fa; border:1.5px dashed var(--line-2);}
  .seq{background:#f5f9ff; border:1.5px solid #b0c4de;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b3bfd0; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f5f9ff;}
  .seq .ord-item{border-color:#b0c4de;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eef3fa; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-family:system-ui,sans-serif; font-size:13px; color:#3a4a63; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:27px;
    color:#1a2438; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf8;
    background-image:linear-gradient(transparent 26px, rgba(30,58,95,.13) 26px 27px);
    background-size:100% 27px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(30,58,95,.12);}
  textarea::placeholder{color:#8a99b0; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--gold-soft); border:1px solid #fcd34d; color:#78350f;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f5f7fb; border-left:3px solid var(--gold);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#5b3d08;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--gold-dark); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,30,60,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">⚖️</div>
    <div>
      <h1>Cuaderno de Redacción Jurídica Colombiana · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · sintaxis, puntuación, ortografía y estilo universitario</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN JURÍDICA COLOMBIANA
   Sintaxis · Puntuación · Ortografía · Estilo universitario
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · FUNDAMENTOS DE LA REDACCIÓN JURÍDICA ============ */
{
  id:"b1", nombre:"Fundamentos de la redacción jurídica", emoji:"📜",
  desc:"Principios, claridad, precisión, lenguaje claro y estilo llano.",
  tecnicas:[
    {id:"j1", nombre:"Claridad: principio rector",
     concepto:"La claridad es el primer principio de la redacción jurídica colombiana. Un texto claro es de fácil comprensión y tiene sentido inequívoco. Sin claridad, el derecho no cumple su función de regular la conducta social.",
     ejemplo:"En lugar de «El suscrito procede a poner en su conocimiento que, en atención a las consideraciones que anteceden, se ha determinado...», se escribe: «Le informo que se ha decidido...».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estos enunciados cumple mejor con el principio de claridad?",
       opciones:["«El que suscribe, en su calidad de apoderado, procede a manifestar...»","«Le informo que su solicitud fue negada.»","«En atención a las consideraciones precedentes, este despacho estima pertinente...»","«Cúmpleme manifestar a usted que...»"],
       correcta:1,
       retro:"El principio de claridad exige un lenguaje directo y comprensible. Las fórmulas ampulosas oscurecen el mensaje."}},

    {id:"j2", nombre:"Sencillez sin adornos",
     concepto:"La sencillez significa redactar sin adornos, comentarios o elementos innecesarios. No se trata de empobrecer el lenguaje, sino de eliminar lo que no aporta información jurídica relevante.",
     ejemplo:"En vez de «En el presente caso que nos ocupa y para efectos de la resolución del mismo, se procede a analizar...», se escribe: «Para resolver este caso, se analiza...».",
     ejercicio:{tipo:"fill",
       consigna:"Transforma el enunciado eliminando adornos innecesarios.",
       texto:"«Cúmpleme manifestar a usted, en atención a las consideraciones que anteceden, que su solicitud ha sido ___».",
       respuestas:[["negada","rechazada","resuelta","denegada","no concedida"]],
       retro:"La sencillez no empobrece: aclara. Los adornos retóricos oscurecen el mensaje jurídico."}},

    {id:"j3", nombre:"Precisión terminológica",
     concepto:"La precisión exige usar cada término con su significado técnico exacto, evitando ambigüedades. Un mismo término debe usarse siempre con el mismo sentido a lo largo del texto.",
     ejemplo:"No es lo mismo «prescripción» que «caducidad»; no es igual «nulidad» que «anulabilidad». Confundirlos produce errores jurídicos graves.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su significado jurídico correcto.",
       categorias:["Prescripción","Caducidad","Nulidad"],
       items:[
         {texto:"Extinción de la acción por el paso del tiempo, pero puede interrumpirse.", cat:0},
         {texto:"Extinción automática del derecho por vencimiento del plazo.", cat:1},
         {texto:"Sanción que priva de efectos a un acto jurídico.", cat:2},
         {texto:"Puede suspenderse o interrumpirse.", cat:0},
         {texto:"No admite suspensión ni interrupción.", cat:1}
       ],
       retro:"Precisión significa usar cada término con su significado exacto. La ambigüedad terminológica es una de las principales causas de litigio."}},

    {id:"j4", nombre:"Lenguaje claro vs. lenguaje oscuro",
     concepto:"El movimiento del lenguaje claro (Plain Language) propone que los textos jurídicos se redacten de forma comprensible. El lenguaje oscuro, lleno de arcaísmos y circunloquios, obstaculiza el acceso a la justicia.",
     ejemplo:"Oscuro: «El peticionario interpone recurso de reposición contra el auto que denegó el reconocimiento de personería.» Claro: «El peticionario recurre la decisión que negó reconocerlo como apoderado.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es el principal problema del lenguaje jurídico oscuro?",
       opciones:["Es más elegante","Obstaculiza la comprensión y el acceso a la justicia","Es más rápido de leer","Solo lo entienden los jueces"],
       correcta:1,
       retro:"El lenguaje oscuro no es señal de erudición: es una barrera. El lenguaje claro es un derecho ciudadano."}},

    {id:"j5", nombre:"Estilo llano en el derecho colombiano",
     concepto:"El estilo llano propone que las normas y decisiones judiciales se redacten de forma comprensible para quienes deben cumplirlas. No se simplifica el derecho: se comunica mejor.",
     ejemplo:"Una sentencia en estilo llano explica al ciudadano, en lenguaje accesible, por qué se tomó la decisión, sin renunciar al rigor jurídico.",
     ejercicio:{tipo:"open",
       consigna:"Reescribe en estilo llano esta frase: «El Despacho, en atención a las consideraciones fácticas y jurídicas que anteceden, procede a decretar la nulidad del acto administrativo demandado».",
       criterios:[
         "Usé un lenguaje directo y comprensible.",
         "Mantuve el sentido jurídico de la decisión.",
         "Evité fórmulas ampulosas."
       ],
       modelo:"«El Despacho declara nulo el acto administrativo demandado, por las razones de hecho y de derecho expuestas.»"}},

    {id:"j6", nombre:"Impersonalidad del discurso jurídico",
     concepto:"El discurso jurídico prefiere la impersonalidad: se evita el «yo» y se usa la pasiva refleja o la tercera persona. El foco queda en el proceso, no en quien escribe.",
     ejemplo:"En vez de «Yo analicé los hechos», se escribe «Se analizaron los hechos» o «Este Despacho analizó los hechos».",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a estilo impersonal.",
       texto:"«Yo verifiqué los requisitos» → «Se ___ los requisitos». · «Nosotros decidimos negar la solicitud» → «Se ___ negar la solicitud».",
       respuestas:[["verificaron","verifico","verificó"],["decidio","decidió"]],
       retro:"La impersonalidad aporta objetividad al discurso jurídico. El «yo» debilita la fuerza institucional del texto."}},

    {id:"j7", nombre:"Formalidad y registro culto",
     concepto:"El texto jurídico exige un registro formal y culto, sin coloquialismos ni expresiones vulgares. La formalidad no significa ampulosidad: significa respeto por el género y por el destinatario.",
     ejemplo:"No se escribe «el tipo ese» ni «un montón de plata»; se escribe «el sujeto» o «una suma considerable de dinero».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como formal o informal.",
       categorias:["Formal","Informal"],
       items:[
         {texto:"«el sujeto procesal»", cat:0},
         {texto:"«el tipo ese»", cat:1},
         {texto:"«la suma de $1.000.000»", cat:0},
         {texto:"«un montón de plata»", cat:1},
         {texto:"«el despacho judicial»", cat:0}
       ],
       retro:"El registro formal es obligatorio en los textos jurídicos. Los coloquialismos restan credibilidad al escrito."}},

    {id:"j8", nombre:"Universalidad del destinatario",
     concepto:"El texto jurídico se dirige a un público amplio: jueces, abogados, ciudadanos. No puede asumir que todos comparten los mismos conocimientos técnicos. Debe ser comprensible para cualquier lector culto.",
     ejemplo:"Cuando se usa un tecnicismo, se define la primera vez: «La prescripción, es decir, la extinción de la acción por el paso del tiempo...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición del tecnicismo.",
       texto:"«La caducidad, es decir, la ___ automática del derecho por vencimiento del plazo, no admite suspensión.»",
       respuestas:[["extincion","extinción","perdida","pérdida"]],
       retro:"Definir el tecnicismo la primera vez que aparece hace el texto accesible sin perder rigor."}},

    {id:"j9", nombre:"Estructura externa del texto jurídico",
     concepto:"Los textos jurídicos tienen una estructura externa prefijada: encabezado, antecedentes, fundamentos, parte resolutiva y firmas. Esta estructura facilita la interpretación y localización de la información.",
     ejemplo:"Una sentencia colombiana tiene: encabezado, antecedentes, consideraciones, decisión y firma. Cada parte cumple una función específica.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una sentencia colombiana.",
       items:[
         "Encabezado con identificación del proceso y las partes.",
         "Antecedentes de hecho y síntesis de la demanda.",
         "Consideraciones y fundamentos jurídicos.",
         "Parte resolutiva o decisión.",
         "Firma del juez o magistrado."
       ],
       retro:"La estructura externa es previsible. Reconocerla permite localizar rápidamente la información relevante."}},

    {id:"j10", nombre:"Función comunicativa del derecho",
     concepto:"El derecho es, ante todo, un ejercicio de comunicación. Las normas, sentencias y escritos jurídicos están destinados a ser comprendidos por otros. Si no se comunican, no cumplen su función.",
     ejemplo:"Una norma que nadie entiende no puede ser cumplida. Una sentencia incomprensible no puede ser acatada cabalmente. La comunicación es esencial al derecho.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué se dice que el derecho es un ejercicio de comunicación?",
       opciones:["Porque los abogados hablan mucho","Porque las normas y decisiones están destinadas a ser comprendidas y aplicadas por otros","Porque se publican en el Diario Oficial","Porque usan lenguaje técnico"],
       correcta:1,
       retro:"El derecho existe para regular conductas y resolver conflictos. Si no se comunica eficazmente, no puede cumplir su función."}}
  ]
},

/* ============ BLOQUE 2 · SINTAXIS JURÍDICA ============ */
{
  id:"b2", nombre:"Sintaxis jurídica", emoji:"🧱",
  desc:"Orden lógico, oraciones simples y compuestas, subordinación y ambigüedad.",
  tecnicas:[
    {id:"j11", nombre:"Orden lógico: sujeto + verbo + complemento",
     concepto:"El orden natural de la oración en español es sujeto + verbo + complemento. En textos jurídicos, respetar este orden favorece la claridad. Las alteraciones del orden (hipérbatos) deben ser excepcionales.",
     ejemplo:"Orden lógico: «El juez declaró la nulidad del contrato.» Orden alterado: «La nulidad del contrato, el juez, declaró.»",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden lógico.",
       texto:"Palabras: «la demanda / el juez / admitió». Oración ordenada: ___.",
       respuestas:[["el juez admitio la demanda","el juez admitió la demanda"]],
       retro:"El orden lógico (sujeto + verbo + complemento) es la base de la claridad. Los hipérbatos innecesarios oscurecen el mensaje."}},

    {id:"j12", nombre:"Oraciones cortas y claras",
     concepto:"Los expertos recomiendan oraciones de no más de 20-25 palabras. Las oraciones excesivamente largas dificultan la comprensión y favorecen la ambigüedad.",
     ejemplo:"En lugar de «El demandante, quien fuera notificado en debida forma y quien compareció al proceso mediante apoderado debidamente constituido, presentó escrito de contestación dentro del término legal establecido para tal efecto», se escribe: «El demandante fue notificado en debida forma. Compareció mediante apoderado. Presentó la contestación dentro del término legal.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la extensión recomendada para una oración jurídica?",
       opciones:["Hasta 50 palabras","No más de 20-25 palabras","Entre 30 y 40 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas (20-25 palabras) facilitan la lectura y reducen la ambigüedad. Las oraciones largas deben dividirse."}},

    {id:"j13", nombre:"Voz activa vs. voz pasiva",
     concepto:"La voz activa es más clara y directa: el sujeto realiza la acción. La voz pasiva oculta al agente y puede generar ambigüedad. En textos jurídicos se prefiere la voz activa, salvo cuando se busca objetividad.",
     ejemplo:"Pasiva: «La sentencia fue proferida por el juez.» Activa: «El juez profirió la sentencia.» La segunda es más clara.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"«El juez profirió la sentencia.»", cat:0},
         {texto:"«La sentencia fue proferida por el juez.»", cat:1},
         {texto:"«El demandante presentó la demanda.»", cat:0},
         {texto:"«La demanda fue presentada por el demandante.»", cat:1},
         {texto:"«El Congreso expidió la ley.»", cat:0}
       ],
       retro:"La voz activa es más clara. La pasiva se reserva para cuando el agente es desconocido o irrelevante."}},

    {id:"j14", nombre:"Evitar gerundios innecesarios",
     concepto:"El gerundio es una forma verbal que termina en -ando, -iendo. Su uso excesivo o incorrecto dificulta establecer quién realiza la acción. En textos jurídicos se recomienda evitarlo.",
     ejemplo:"Incorrecto: «El juez, considerando los hechos, profirió sentencia condenatoria.» Correcto: «El juez consideró los hechos y profirió sentencia condenatoria.»",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por una forma verbal conjugada.",
       texto:"«El juez, habiendo analizado las pruebas, decidió absolver» → «El juez ___ las pruebas y decidió absolver».",
       respuestas:[["analizo","analizó","estudio","estudió","reviso","revisó"]],
       retro:"El gerundio de posterioridad es incorrecto: no debe usarse para indicar una acción posterior. Se sustituye por un verbo conjugado."}},

    {id:"j15", nombre:"Oraciones compuestas por subordinación",
     concepto:"La subordinación une una oración principal con una o varias secundarias. En textos jurídicos abunda, pero el exceso genera oscuridad. Se recomienda limitar la anidación.",
     ejemplo:"Excesivo: «El juez que conoció del proceso que fue repartido al Juzgado que está ubicado en la carrera que atraviesa el centro de la ciudad...» Adecuado: «El juez conoció del proceso. Este fue repartido al Juzgado ubicado en el centro.»",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos oraciones simples.",
       texto:"«El demandante que presentó la demanda que fue admitida por el juez que conoce del caso solicitó medidas cautelares.» → «El demandante presentó la demanda. Esta fue ___ por el juez».",
       respuestas:[["admitida","aceptada","recibida"]],
       retro:"La subordinación excesiva es una de las principales causas de oscuridad. Dividir en oraciones simples mejora la claridad."}},

    {id:"j16", nombre:"Coordinación de oraciones",
     concepto:"La coordinación une oraciones independientes mediante conjunciones (y, o, pero). En textos jurídicos se usa para enumerar hechos, pretensiones o fundamentos.",
     ejemplo:"«El demandante solicita: primera, que se declare la nulidad; segunda, que se condene al demandado; tercera, que se condene en costas.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su tipo de coordinación.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],
       items:[
         {texto:"y", cat:0},
         {texto:"pero", cat:1},
         {texto:"o", cat:2},
         {texto:"ni", cat:0},
         {texto:"mas", cat:1}
       ],
       retro:"La coordinación copulativa suma, la adversativa opone y la disyuntiva presenta alternativas. Reconocerlas ayuda a seguir el razonamiento."}},

    {id:"j17", nombre:"Evitar ambigüedad referencial",
     concepto:"Los pronombres (él, ella, este, aquel, que) pueden generar ambigüedad si no está claro a qué se refieren. En textos jurídicos se recomienda repetir el sustantivo o usar la denominación completa.",
     ejemplo:"Ambiguo: «El demandante le dijo al demandado que su abogado lo había engañado.» ¿Su abogado de quién? Claro: «El demandante le dijo al demandado que el abogado del demandante lo había engañado.»",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad repitiendo el sustantivo.",
       texto:"«El juez le comunicó al secretario que su despacho había recibido la demanda.» ¿Su despacho de quién? → «El juez le comunicó al secretario que el despacho ___ había recibido la demanda».",
       respuestas:[["del juez","judicial","del despacho del juez"]],
       retro:"La ambigüedad referencial es uno de los errores más frecuentes y peligrosos en la redacción jurídica. Repetir el sustantivo evita confusiones."}},

    {id:"j18", nombre:"Concordancia gramatical",
     concepto:"La concordancia exige que sujeto y verbo coincidan en número y persona, y que sustantivo y adjetivo coincidan en género y número. Su ruptura produce agramaticalidad.",
     ejemplo:"Incorrecto: «Los demandantes presentó la demanda.» Correcto: «Los demandantes presentaron la demanda.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál oración tiene concordancia correcta?",
       opciones:["«El juez y el secretario firmó la providencia.»","«El juez y el secretario firmaron la providencia.»","«Los demandante presentó pruebas.»","«Las partes presentó alegatos.»"],
       correcta:1,
       retro:"El sujeto compuesto (el juez y el secretario) exige verbo en plural (firmaron). La concordancia es obligatoria."}},

    {id:"j19", nombre:"Uso del infinitivo en lugar del futuro",
     concepto:"El futuro de indicativo puede sonar arcaico en textos jurídicos. Se recomienda usar el presente o el infinitivo según el contexto. El futuro de obligación («el juez admitirá la demanda») es frecuente pero debe usarse con criterio.",
     ejemplo:"En vez de «El juez admitirá la demanda si cumple los requisitos», se prefiere: «El juez admite la demanda si cumple los requisitos» o «El juez debe admitir la demanda...».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada forma verbal según su uso recomendado.",
       categorias:["Presente (recomendado)","Futuro de obligación (arcaico)"],
       items:[
         {texto:"«El juez admite la demanda»", cat:0},
         {texto:"«El juez admitirá la demanda»", cat:1},
         {texto:"«La norma establece que...»", cat:0},
         {texto:"«La norma establecerá que...»", cat:1},
         {texto:"«El despacho resuelve»", cat:0}
       ],
       retro:"El presente es más directo y actual. El futuro de obligación es arcaizante y puede generar ambigüedad."}},

    {id:"j20", nombre:"Párrafos: una idea por párrafo",
     concepto:"Cada párrafo debe desarrollar una idea principal. Mezclar varias ideas en un párrafo genera confusión. La extensión recomendada es de 50-150 palabras, con oraciones cortas.",
     ejemplo:"Un párrafo para los hechos, otro para los fundamentos de derecho, otro para las pretensiones. Cada uno con su idea central.",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de un párrafo jurídico.",
       items:[
         "Oración tópica que anuncia la idea central.",
         "Desarrollo o explicación de la idea.",
         "Evidencia o fundamento jurídico.",
         "Conclusión o consecuencia."
       ],
       retro:"El párrafo jurídico sigue la estructura: idea principal, desarrollo, fundamento y conclusión. Una idea por párrafo."}}
  ]
},

/* ============ BLOQUE 3 · PUNTUACIÓN JURÍDICA ============ */
{
  id:"b3", nombre:"Puntuación jurídica", emoji:"✒️",
  desc:"Coma, punto y coma, dos puntos, punto, paréntesis y corchetes en textos jurídicos.",
  tecnicas:[
    {id:"j21", nombre:"La coma: usos principales",
     concepto:"La coma separa elementos de una enumeración, aísla vocativos, separa oraciones coordinadas y marca incisos. En textos jurídicos, su uso correcto es esencial para evitar ambigüedades.",
     ejemplo:"«El demandante, señor Juez, solicita que se declare la nulidad.» La coma aísla el vocativo.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál oración usa correctamente la coma?",
       opciones:["«El demandante señor Juez, solicita la nulidad.»","«El demandante, señor Juez, solicita la nulidad.»","«El demandante, solicita la nulidad señor Juez.»","«El demandante solicita, la nulidad, señor Juez.»"],
       correcta:1,
       retro:"El vocativo («señor Juez») se aísla entre comas. Su omisión o mal ubicación altera el sentido."}},

    {id:"j22", nombre:"Coma vocativa",
     concepto:"El vocativo es la palabra o frase con la que nos dirigimos al interlocutor. Siempre se separa con coma del resto del enunciado. En textos jurídicos es frecuente: «señor Juez», «su Señoría».",
     ejemplo:"«Señores magistrados, la demanda cumple los requisitos.» «Limítese a plantear su pregunta, abogado.»",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma donde corresponda.",
       texto:"«Señor Juez ___ la demanda cumple con los requisitos.» · «Su Señoría ___ solicito que se admita el recurso.»",
       respuestas:[[","],["␣"]],
       retro:"El vocativo siempre se separa con coma: «Señor Juez, la demanda cumple...». En «Su Señoría, solicito...» también."}},

    {id:"j23", nombre:"Punto y coma",
     concepto:"El punto y coma separa oraciones relacionadas de cierta extensión. Se usa ante conectores discursivos (sin embargo, no obstante, por lo tanto) cuando unen periodos largos.",
     ejemplo:"«La demanda cumple los requisitos de forma; sin embargo, no acredita la cuantía.»",
     ejercicio:{tipo:"fill",
       consigna:"Coloca punto y coma o coma según corresponda.",
       texto:"«El recurso fue presentado oportunamente ___ sin embargo, no cumple los requisitos.» · «El juez analizó las pruebas, los testimonios y los documentos ___ y profirió sentencia.»",
       respuestas:[[";"],[";"]],
       retro:"Ante «sin embargo» que une periodos largos se usa punto y coma. La coma antes de «y» en enumeraciones complejas también puede ser punto y coma."}},

    {id:"j24", nombre:"Dos puntos: verbos performativos",
     concepto:"En textos jurídicos, se colocan dos puntos después del verbo que presenta el objetivo fundamental del documento: CERTIFICA, EXPONE, SOLICITA, DECRETA, RESUELVE.",
     ejemplo:"«El suscrito Secretario CERTIFICA: Que la providencia fue notificada...» «El Juez RESUELVE: Primero. Declarar...»",
     ejercicio:{tipo:"fill",
       consigna:"Coloca dos puntos donde corresponda.",
       texto:"«El Secretario CERTIFICA___ Que la sentencia fue notificada.» · «El Juez RESUELVE___ Primero. Declarar la nulidad.»",
       respuestas:[[""],[""]],
       retro:"Los dos puntos siguen al verbo performativo (CERTIFICA:, RESUELVE:, DECRETA:). Es una convención del género jurídico."}},

    {id:"j25", nombre:"Punto y aparte",
     concepto:"El punto y aparte marca el final de un párrafo. En textos jurídicos, cada párrafo debe desarrollar una idea. El punto y aparte facilita la lectura y la localización de información.",
     ejemplo:"Un párrafo para los hechos, otro para los fundamentos de derecho, otro para la decisión. Cada uno termina en punto y aparte.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte en un texto jurídico?",
       opciones:["Cuando se termina una oración","Cuando se termina un párrafo","Cuando se cita una norma","Cuando se enumeran hechos"],
       correcta:1,
       retro:"El punto y aparte cierra el párrafo. Después se inicia uno nuevo con sangría y mayúscula."}},

    {id:"j26", nombre:"Paréntesis",
     concepto:"Los paréntesis encierran información complementaria o aclaratoria. En textos jurídicos se usan para agregar datos, fechas, referencias o aclaraciones breves.",
     ejemplo:"«El demandante (quien compareció mediante apoderado) presentó la demanda.» «La Ley 599 de 2000 (Código Penal) regula la materia.»",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde corresponda.",
       texto:"«La Ley 906 de 2004 ___ Código de Procedimiento Penal ___ regula el sistema acusatorio.»",
       respuestas:[["("],[" )",""]],
       retro:"Los paréntesis encierran información aclaratoria. No se deja espacio antes del paréntesis de apertura ni después del de cierre."}},

    {id:"j27", nombre:"Corchetes en citas textuales",
     concepto:"Los corchetes se usan en citas textuales para introducir aclaraciones, modificaciones o para indicar que se ha omitido un fragmento [...]. Son propios del discurso académico y jurídico.",
     ejemplo:"«El artículo 29 de la Constitución establece: “Toda persona tiene derecho a la libertad [personal] y a la intimidad.”»",
     ejercicio:{tipo:"fill",
       consigna:"Completa con corchetes donde corresponda.",
       texto:"«El juez afirmó: “La demanda ___ la principal ___ cumple los requisitos.”» (se aclara que es la principal, no la de reconvención)",
       respuestas:[["["],["]"]],
       retro:"Los corchetes encierran aclaraciones dentro de citas textuales. La palabra aclarada va dentro de corchetes."}},

    {id:"j28", nombre:"Punto y coma en enumeraciones complejas",
     concepto:"Cuando los elementos de una enumeración son extensos o tienen puntuación interna, se separan con punto y coma. Es frecuente en la parte resolutiva de sentencias y en el articulado de normas.",
     ejemplo:"«El Juez RESUELVE: Primero. Declarar la nulidad del acto; Segundo. Condenar en costas al demandado; Tercero. Notificar la decisión.»",
     ejercicio:{tipo:"fill",
       consigna:"Separa los elementos con punto y coma.",
       texto:"«Primero. Declarar la nulidad ___ Segundo. Condenar en costas ___ Tercero. Notificar.»",
       respuestas:[[";"],[";"]],
       retro:"En enumeraciones extensas o numeradas, se usa punto y coma para separar cada elemento. Facilita la lectura."}},

    {id:"j29", nombre:"Punto y seguido",
     concepto:"El punto y seguido separa oraciones dentro de un mismo párrafo. Cada oración debe tener sentido completo. Su uso correcto es fundamental para la claridad.",
     ejemplo:"«El demandante presentó la demanda. El juez la admitió. El demandado contestó oportunamente.»",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la función del punto y seguido?",
       opciones:["Separar párrafos","Separar oraciones dentro de un párrafo","Introducir una cita","Encerrar aclaraciones"],
       correcta:1,
       retro:"El punto y seguido cierra una oración y separa de la siguiente dentro del mismo párrafo. Después se escribe mayúscula."}},

    {id:"j30", nombre:"Signos de interrogación y exclamación",
     concepto:"En textos jurídicos, los signos de interrogación y exclamación se usan con moderación. Son propios de citas textuales o de títulos que plantean una cuestión. No se usan para enfatizar.",
     ejemplo:"Título: «¿Es la caducidad un término procesal o sustancial?» En el cuerpo del texto no se usan signos de exclamación.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se usan los signos de interrogación en textos jurídicos?",
       opciones:["Para enfatizar argumentos","Con moderación, en citas o títulos","En cada párrafo","Para expresar duda del juez"],
       correcta:1,
       retro:"Los signos de interrogación y exclamación se reservan para citas textuales o títulos. En el cuerpo del texto jurídico se evitan."}}
  ]
},

    {id:"j33", nombre:"Escritura de números en textos jurídicos",

    {id:"j39", nombre:"Ortografía de los números romanos",

/* ============ BLOQUE 5 · ESTILO UNIVERSITARIO ============ */
{
  id:"b5", nombre:"Estilo universitario y académico", emoji:"🎓",
  desc:"Registro académico, precisión, citas, referencias y argumentación.",
  tecnicas:[
    {id:"j41", nombre:"Registro académico",
     concepto:"El estilo universitario exige un registro formal y culto, sin coloquialismos. Se usa un vocabulario preciso y se evita el lenguaje figurado o emotivo.",
     ejemplo:"No se escribe «el juez se pasó de la raya»; se escribe «el juez excedió sus competencias».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como académica o coloquial.",

         {texto:"«metió la pata»", cat:1},
         {texto:"«profirió sentencia»", cat:0}
       ],
       retro:"El registro académico exige precisión y formalidad. Los coloquialismos restan seriedad al texto jurídico."}},

    {id:"j42", nombre:"Citas textuales: reglas básicas",
     concepto:"Las citas textuales de menos de 40 palabras van entre comillas dentro del párrafo. Las de más de 40 palabras se escriben en bloque sangrado, sin comillas. Siempre se indica la fuente.",
     ejemplo:"Cita corta: «La claridad es un derecho del ciudadano» (García, 2020, p. 45). Cita larga: bloque sangrado con la referencia al final.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita según las reglas.",
       texto:"«La claridad es un derecho del ciudadano» (García, ___, p. ___). Si el artículo es de 2020 y la cita está en la página 45.",
       respuestas:[["2020"],["45"]],
       retro:"La cita textual siempre lleva autor, año y página. Sin estos datos, la cita está incompleta."}},

    {id:"j43", nombre:"Paráfrasis y cita indirecta",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, manteniendo el significado y citando la fuente. No es copiar cambiando algunas palabras.",
     ejemplo:"Original: «La prescripción extingue la acción por el paso del tiempo.» Paráfrasis: «Según García (2020), el transcurso del tiempo extingue la acción mediante la prescripción.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis con la cita.",
       texto:"«Según diversos autores, la caducidad no admite suspensión (___, ___)».",
       respuestas:[["garcia","garcía","autor"],["2020","año"]],
       retro:"La paráfrasis mantiene la idea ajena con palabras propias y siempre cita la fuente. Sin cita, sería plagio."}},

    {id:"j44", nombre:"Referencias bibliográficas APA",
     concepto:"En estilo APA, las referencias de libros incluyen: Apellido, A. A. (Año). Título en cursiva. Editorial. Las de artículos: Apellido, A. A. (Año). Título del artículo. Nombre de la Revista, volumen(número), páginas.",
     ejemplo:"García, M. (2020). Manual de redacción jurídica. Editorial Jurídica. · López, J. (2021). La claridad en el derecho. Revista de Derecho, 15(2), 45-58.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia de libro en APA.",
       items:[
         "Apellido, inicial del autor.",
         "(Año).",
         "Título del libro en cursiva.",
         "Editorial."
       ],
       retro:"El orden APA es fijo: autor, año, título, editorial. El título va en cursiva."}},

    {id:"j45", nombre:"Citas de jurisprudencia colombiana",
     concepto:"Las sentencias se citan indicando la corporación, el número de sentencia y el año. Ejemplo: Corte Constitucional, Sentencia C-1141 de 2000. También se incluye el magistrado ponente si es relevante.",
     ejemplo:"«Corte Constitucional, Sentencia T-406 de 1992, M.P. Ciro Angarita Barón.» «Corte Suprema de Justicia, Sala de Casación Civil, Sentencia del 15 de agosto de 2014.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita de jurisprudencia.",
       texto:"«___ Constitucional, Sentencia ___ de 1992» (Corte, T-406).",
       respuestas:[["Corte","corte"],["T-406","t-406"]],
       retro:"La cita de jurisprudencia incluye: corporación, tipo de sentencia, número y año. El M.P. se añade si es relevante."}},

    {id:"j46", nombre:"Citas de normas colombianas",
     concepto:"Las normas se citan indicando el tipo, número y año: Ley 599 de 2000, Decreto 1082 de 2015. Si se cita un artículo específico: «artículo 29 de la Constitución Política».",
     ejemplo:"«El artículo 29 de la Constitución Política establece el debido proceso.» «La Ley 599 de 2000 regula el Código Penal.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita normativa.",
       texto:"«El artículo ___ de la ___ Política establece el debido proceso.» (artículo 29).",
       respuestas:[["29"],["Constitucion","Constitución"]],
       retro:"Se cita: artículo + número + de + norma. La Constitución Política es la norma fundamental del ordenamiento colombiano."}},

    {id:"j47", nombre:"Uso de conectores académicos",
     concepto:"Los conectores académicos organizan el discurso: sin embargo, no obstante, por lo tanto, en consecuencia, asimismo, además. Su uso correcto revela madurez argumentativa.",
     ejemplo:"«La demanda cumple los requisitos; sin embargo, no acredita la cuantía. Por lo tanto, debe rechazarse.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Contraste","Consecuencia","Adición"],
       items:[
         {texto:"sin embargo", cat:0},
         {texto:"por lo tanto", cat:1},
         {texto:"además", cat:2},
         {texto:"no obstante", cat:0},
         {texto:"en consecuencia", cat:1}
       ],
       retro:"Los conectores revelan la relación lógica entre ideas. Sin ellos, el texto parece una lista de frases sueltas."}},

    {id:"j48", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. Es una falta grave de integridad académica.",
     ejemplo:"Copiar un párrafo de un artículo sin comillas ni cita es plagio, aunque se cambien algunas palabras. Parafrasear sin citar también lo es.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"j49", nombre:"Argumentación jurídica",
     concepto:"La argumentación jurídica consiste en defender una tesis con razones basadas en normas, jurisprudencia y doctrina. Estructura: premisa mayor (norma), premisa menor (hechos), conclusión.",
     ejemplo:"Premisa mayor: «El artículo 29 exige el debido proceso.» Premisa menor: «El demandado no fue notificado.» Conclusión: «Se vulneró el debido proceso.»",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos de la argumentación jurídica.",
       items:[
         "Identificar la norma aplicable (premisa mayor).",
         "Establecer los hechos relevantes (premisa menor).",
         "Relacionar norma y hechos.",
         "Formular la conclusión jurídica."
       ],
       retro:"La argumentación jurídica sigue la estructura del silogismo: norma + hechos → conclusión. Es la base del razonamiento judicial."}},

    {id:"j50", nombre:"Revisión y edición del texto",
     concepto:"La revisión es una fase esencial de la escritura jurídica. Se revisan ortografía, sintaxis, puntuación, coherencia y precisión terminológica. Dejar reposar el texto antes de revisarlo mejora los resultados.",
     ejemplo:"Primera pasada: ortografía y puntuación. Segunda: coherencia y estructura. Tercera: precisión terminológica. Cuarta: formato y citas.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos de la revisión de un texto jurídico.",

         "Verificar coherencia y estructura.",
         "Comprobar precisión terminológica.",
         "Revisar formato y citas."
       ],

/* ============ BLOQUE 6 · ESTRUCTURA DE TEXTOS JURÍDICOS ============ */
{
  id:"b6", nombre:"Estructura de textos jurídicos", emoji:"🏛️",
  desc:"Demanda, contestación, sentencia, resolución, concepto y recurso.",
  tecnicas:[
    {id:"j51", nombre:"Estructura de la demanda",
     concepto:"La demanda colombiana contiene: designación del juez, identificación de las partes, pretensiones, hechos, fundamentos de derecho, pruebas y juramento estimatorio. Cada parte es obligatoria.",
     ejemplo:"«Señor Juez Civil del Circuito de Bogotá: E. S. D. REF: Proceso ordinario. Demandante: X. Demandado: Y. PRETENSIONES: Primera. Que se declare... HECHOS: Primero. Que el 15 de enero... FUNDAMENTOS DE DERECHO: ...»",

         "Identificación de las partes.",
         "Pretensiones.",
         "Hechos.",
         "Fundamentos de derecho, pruebas y juramento estimatorio."
       ],
       retro:"La estructura de la demanda es previsible. Cada parte cumple una función procesal específica."}},

    {id:"j52", nombre:"Redacción de hechos",
     concepto:"Los hechos se redactan en párrafos numerados, ordenados cronológicamente, con claridad y precisión. Se indica quién, qué, cuándo, dónde, cómo y por qué. Sin valoraciones subjetivas.",
     ejemplo:"«PRIMERO. El 15 de enero de 2024, el demandante suscribió con el demandado un contrato de arrendamiento sobre el inmueble ubicado en la carrera 10 n.º 20-30 de Bogotá. SEGUNDO. El plazo pactado fue de un año...»",
     ejercicio:{tipo:"fill",
       consigna:"Ordena el hecho con los elementos esenciales.",
       texto:"«El ___ de enero de 2024, el demandante suscribió un contrato con el demandado.» (quién, cuándo, qué)",
       respuestas:[["15","quince"]],
       retro:"Los hechos se redactan en párrafos numerados, cronológicos y precisos. Se indica quién, qué, cuándo y dónde."}},

    {id:"j53", nombre:"Redacción de pretensiones",
     concepto:"Las pretensiones expresan lo que se pide al juez, con precisión y claridad. Se numeran y se formulan en infinitivo: declarar, condenar, ordenar.",
     ejemplo:"«PRIMERA. Que se declare la nulidad absoluta del contrato de compraventa. SEGUNDA. Que se condene al demandado al pago de perjuicios. TERCERA. Que se condene en costas.»",
     ejercicio:{tipo:"fill",
       consigna:"Redacta la pretensión con verbo en infinitivo.",
       texto:"«Que se ___ la nulidad del contrato.» · «Que se ___ al demandado al pago de perjuicios.»",
       respuestas:[["declare","declara"],["condene","condena"]],
       retro:"Las pretensiones se formulan en infinitivo (declarar, condenar, ordenar) y se numeran. Deben ser claras y precisas."}},

    {id:"j54", nombre:"Estructura de la contestación",
     concepto:"La contestación de la demanda contiene: identificación del proceso, pronunciamiento sobre los hechos (ciertos, no ciertos, no le constan), excepciones de mérito y solicitud de pruebas.",
     ejemplo:"«PRIMERO. El hecho primero es cierto. SEGUNDO. El hecho segundo no es cierto. TERCERO. El hecho tercero no me consta. EXCEPCIONES: falta de legitimación en la causa.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pronunciamiento sobre los hechos.",
       categorias:["Cierto","No cierto","No le consta"],
       items:[
         {texto:"El hecho ocurrió como se narra.", cat:0},
         {texto:"El hecho no ocurrió.", cat:1},
         {texto:"El demandado no tiene conocimiento del hecho.", cat:2},
         {texto:"El contrato se firmó en la fecha indicada.", cat:0},
         {texto:"El demandado no participó en los hechos.", cat:1}
       ],
       retro:"En la contestación, cada hecho de la demanda se pronuncia como cierto, no cierto o no le consta. Es una carga procesal."}},

    {id:"j55", nombre:"Estructura de la sentencia",
     concepto:"La sentencia colombiana contiene: encabezado, antecedentes, consideraciones (análisis de los alegatos y valoración de pruebas), decisión (parte resolutiva) y firma. La parte resolutiva se profiere «administrando justicia en nombre de la República y por autoridad de la ley».",
     ejemplo:"«...administrando justicia en nombre de la República de Colombia y por autoridad de la ley, RESUELVE: Primero. Declarar la nulidad del contrato. Segundo. Condenar en costas al demandado.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la fórmula de la parte resolutiva.",
       texto:"«Administrando justicia en nombre de la ___ de Colombia y por autoridad de la ___».",
       respuestas:[["Republica","República"],["ley"]],
       retro:"La fórmula es obligatoria: «Administrando justicia en nombre de la República de Colombia y por autoridad de la ley»."}},

    {id:"j56", nombre:"Estructura de la resolución",
     concepto:"La resolución colombiana contiene: encabezado (número y fecha), consideraciones, parte resolutiva (RESUELVE) y firma. Se usa para decisiones administrativas.",
     ejemplo:"«RESOLUCIÓN N.º 1234 DE 2024. Por la cual se resuelve una solicitud. EL DIRECTOR, en ejercicio de sus facultades legales, CONSIDERANDO: ... RESUELVE: Artículo primero. ...»",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una resolución.",
       items:[
         "Encabezado: número y fecha.",
         "Consideraciones o motivos.",
         "Parte resolutiva (RESUELVE).",
         "Artículos.",
         "Firma de la autoridad."
       ],
       retro:"La resolución sigue la estructura: encabezado, consideraciones, RESUELVE, artículos y firma."}},

    {id:"j57", nombre:"Estructura del concepto jurídico",
     concepto:"El concepto jurídico contiene: identificación del solicitante, problema jurídico, análisis normativo y jurisprudencial, conclusión y firma. Responde una consulta con fundamento legal.",
     ejemplo:"«CONCEPTO JURÍDICO. Solicitante: X. Problema: ¿Es procedente la solicitud? Análisis: ... Conclusión: La solicitud es procedente porque...»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del concepto.",
       texto:"Un concepto jurídico contiene: identificación, problema ___, análisis normativo, ___ y firma.",
       respuestas:[["juridico","jurídico"],["conclusion","conclusión"]],
       retro:"El concepto jurídico resuelve un problema jurídico con base en normas y jurisprudencia. Termina con una conclusión clara."}},

    {id:"j58", nombre:"Estructura del recurso de apelación",
     concepto:"El recurso de apelación contiene: identificación del proceso, la decisión recurrida, los fundamentos del recurso (inconformidad) y la petición. Se dirige al juez superior.",
     ejemplo:"«Recurso de apelación contra la sentencia del 15 de mayo de 2024, proferida por el Juzgado... FUNDAMENTOS: 1. El juez incurrió en error al valorar la prueba...»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del recurso.",
       texto:"El recurso de apelación contiene: identificación, decisión ___, fundamentos y ___.",
       respuestas:[["recurrida"],["peticion","petición"]],
       retro:"El recurso de apelación expone los fundamentos de la inconformidad y la petición concreta al superior."}},

    {id:"j59", nombre:"Memoriales y escritos de parte",
     concepto:"Los memoriales son escritos que las partes presentan al juez durante el proceso: solicitudes, recursos, alegatos. Siguen la estructura: encabezado, cuerpo y petición.",
     ejemplo:"«Señor Juez: X, mayor de edad, identificado..., en mi calidad de apoderado, respetuosamente solicito que se decrete la práctica de la prueba testimonial.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la fórmula de tratamiento.",
       texto:"«Señor ___ , respetuosamente solicito...»",
       respuestas:[["Juez","juez"]],
       retro:"Los memoriales usan fórmulas de tratamiento: «Señor Juez», «Señores Magistrados». El respeto es esencial en el trato procesal."}},

    {id:"j60", nombre:"Encabezado del escrito jurídico",
     concepto:"El encabezado identifica el juez destinatario, el proceso, las partes y la referencia. Es la primera impresión del escrito y debe ser claro y preciso.",
     ejemplo:"«Señor JUEZ CIVIL DEL CIRCUITO DE BOGOTÁ. E. S. D. REF: Proceso ordinario de nulidad de contrato. Demandante: Juan Pérez. Demandado: Ana Gómez. Radicación: 2024-00123.»",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos del encabezado.",
       items:[
         "Designación del juez.",
         "E. S. D. (Estrado Señor Despacho).",
         "Referencia del proceso.",
         "Identificación de las partes.",
         "Número de radicación."
       ],
       retro:"El encabezado identifica al juez, el proceso y las partes. Es la puerta de entrada del escrito jurídico."}}
  ]
},

/* ============ BLOQUE 7 · LÉXICO Y TERMINOLOGÍA JURÍDICA ============ */
{
  id:"b7", nombre:"Léxico y terminología jurídica", emoji:"📖",
  desc:"Tecnicismos, latinismos, falso lenguaje jurídico, precisión y sinónimos.",
  tecnicas:[
    {id:"j61", nombre:"Tecnicismos jurídicos necesarios",
     concepto:"Los tecnicismos son términos propios del derecho que tienen un significado preciso: prescripción, caducidad, nulidad, dolo, culpa. Son necesarios cuando no existe equivalente en el lenguaje común.",
     ejemplo:"«Prescripción», «caducidad», «nulidad», «dolo», «culpa», «legítima defensa» son tecnicismos que no deben sustituirse por paráfrasis imprecisas.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término como tecnicismo jurídico o no.",
       categorias:["Tecnicismo jurídico","Lenguaje común"],
       items:[
         {texto:"prescripción", cat:0},
         {texto:"casa", cat:1},
         {texto:"caducidad", cat:0},
         {texto:"dolo", cat:0},
         {texto:"ventana", cat:1}
       ],
       retro:"Los tecnicismos jurídicos son necesarios cuando no hay equivalente preciso en el lenguaje común. Deben usarse con propiedad."}},

    {id:"j62", nombre:"Latinismos y su uso",
     concepto:"Los latinismos son expresiones latinas de uso frecuente en el derecho: habeas corpus, in dubio pro reo, a quo, ad quem, prima facie. Se escriben en cursiva y sin acentos.",
     ejemplo:"«El juez a quo negó la solicitud. El ad quem la revocó.» «En caso de duda, se aplica el principio in dubio pro reo.»",
     ejercicio:{tipo:"fill",
       consigna:"Traduce el latinismo.",
       texto:"«In dubio pro reo» significa «en caso de duda, a favor del ___».",
       respuestas:[["reo","acusado","procesado","imputado"]],
       retro:"«In dubio pro reo» es el principio que favorece al acusado en caso de duda. Los latinismos se escriben en cursiva."}},

    {id:"j63", nombre:"Evitar el falso lenguaje jurídico",
     concepto:"No todo lo que suena jurídico es correcto. Expresiones como «en su momento procesal oportuno», «a la mayor brevedad posible», «cúmpleme manifestar» son fórmulas vacías que oscurecen el texto.",
     ejemplo:"En vez de «cúmpleme manifestar a usted que», se escribe «le informo que». En vez de «en su momento procesal oportuno», se escribe «en el término legal».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como fórmula vacía o lenguaje claro.",
       categorias:["Fórmula vacía","Lenguaje claro"],
       items:[
         {texto:"«cúmpleme manifestar»", cat:0},
         {texto:"«le informo»", cat:1},
         {texto:"«en su momento procesal oportuno»", cat:0},
         {texto:"«en el término legal»", cat:1},
         {texto:"«a la mayor brevedad posible»", cat:0}
       ],
       retro:"Las fórmulas vacías no aportan información y oscurecen el texto. El lenguaje claro las reemplaza por expresiones directas."}},

    {id:"j64", nombre:"Sinónimos con matiz jurídico",
     concepto:"En derecho, los sinónimos aparentes pueden tener matices distintos: «nulidad» y «anulabilidad»; «prescripción» y «caducidad»; «delito» y «falta». Usarlos como equivalentes es un error grave.",
     ejemplo:"La nulidad es absoluta y no admite ratificación; la anulabilidad es relativa y puede sanearse. No son sinónimos.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la distinción.",
       texto:"La ___ es absoluta y no admite ratificación; la ___ es relativa y puede sanearse.",
       respuestas:[["nulidad"],["anulabilidad"]],
       retro:"En derecho, los sinónimos aparentes tienen significados precisos. Usarlos como equivalentes produce errores jurídicos graves."}},

    {id:"j65", nombre:"Precisión léxica",
     concepto:"La precisión léxica exige usar la palabra exacta. «El juez declaró» no es lo mismo que «el juez ordenó» o «el juez dispuso». Cada verbo tiene un matiz procesal distinto.",
     ejemplo:"El juez «declara» la nulidad; «ordena» la práctica de una prueba; «dispone» la notificación; «condena» al pago de perjuicios.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada verbo según su uso procesal.",
       categorias:["Declarar","Ordenar","Condenar"],
       items:[
         {texto:"___ la nulidad del contrato.", cat:0},
         {texto:"___ la práctica de la prueba.", cat:1},
         {texto:"___ al pago de perjuicios.", cat:2},
         {texto:"___ la caducidad de la acción.", cat:0},
         {texto:"___ la notificación del auto.", cat:1}
       ],
       retro:"Cada verbo procesal tiene un matiz preciso: declarar, ordenar, condenar, disponer. La precisión es esencial en el lenguaje jurídico."}},

    {id:"j66", nombre:"Léxico denotativo",
     concepto:"El lenguaje jurídico usa un léxico denotativo: cada término tiene un significado preciso, objetivo y unívoco. Se evita el lenguaje figurado, connotativo o ambiguo.",
     ejemplo:"No se escribe «el juez se hizo el de la vista gorda»; se escribe «el juez omitió pronunciarse sobre la solicitud».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué caracteriza al léxico denotativo jurídico?",
       opciones:["Su significado figurado","Su significado preciso, objetivo y unívoco","Su ambigüedad intencional","Su uso coloquial"],
       correcta:1,
       retro:"El léxico denotativo tiene un significado único y verificable. La ambigüedad es un defecto, no un recurso."}},

    {id:"j67", nombre:"Arcaísmos: uso y abuso",
     concepto:"Los arcaísmos son palabras antiguas en desuso: «otrora», «empero», «maguer», «yantar». En textos jurídicos se recomienda evitarlos, salvo en citas textuales.",
     ejemplo:"En lugar de «empero», se escribe «sin embargo» o «no obstante». En lugar de «otrora», «en otro tiempo» o «antes».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el arcaísmo.",
       texto:"«Empero, la demanda no cumple los requisitos» → «___, la demanda no cumple los requisitos».",
       respuestas:[["sin embargo","no obstante","pero"]],
       retro:"Los arcaísmos oscurecen el texto jurídico. Se prefieren las expresiones actuales equivalentes."}},

    {id:"j68", nombre:"Extranjerismos",
     concepto:"Los extranjerismos son palabras de otras lenguas. En textos jurídicos se usan cuando no hay equivalente en español o cuando la traducción alteraría el sentido. Se escriben en cursiva.",
     ejemplo:"«Debido process» (inglés) se traduce como «debido proceso». «Soft law» se usa en cursiva si no hay equivalente aceptado.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término como extranjerismo o equivalente español.",
       categorias:["Extranjerismo","Equivalente español"],
       items:[
         {texto:"due process", cat:0},
         {texto:"debido proceso", cat:1},
         {texto:"soft law", cat:0},
         {texto:"derecho blando", cat:1},
         {texto:"privacy", cat:0}
       ],
       retro:"Los extranjerismos se usan con moderación y se escriben en cursiva. Cuando existe equivalente español, se prefiere este."}},

    {id:"j69", nombre:"Fórmulas rituales del derecho",
     concepto:"El derecho usa fórmulas rituales: «E. S. D.», «Cúmplase», «Notifíquese», «Ejecutoriada esta providencia». Estas fórmulas tienen valor procesal y deben usarse correctamente.",
     ejemplo:"«Notifíquese y cúmplase.» «Ejecutoriada esta providencia, archívese el expediente.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la fórmula ritual.",
       texto:"«___ y cúmplase.» (fórmula al final de una providencia)",
       respuestas:[["Notifiquese","Notifíquese"]],
       retro:"Las fórmulas rituales tienen valor procesal. Deben usarse correctamente y en el lugar que corresponde."}},

    {id:"j70", nombre:"Diccionario jurídico y consulta",
     concepto:"El redactor jurídico debe consultar diccionarios especializados: Diccionario panhispánico del español jurídico (RAE), diccionarios jurídicos colombianos. La consulta constante mejora la precisión.",
     ejemplo:"Antes de usar un término dudoso, se consulta el Diccionario panhispánico del español jurídico (DPEJ) de la RAE.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la utilidad del Diccionario panhispánico del español jurídico?",
       opciones:["Traducir textos jurídicos","Resolver dudas sobre el significado preciso de términos jurídicos","Escribir sentencias automáticamente","Reemplazar al abogado"],
       correcta:1,
       retro:"El DPEJ es una herramienta fundamental para la precisión terminológica. Resuelve dudas sobre el significado de los términos jurídicos."}}
  ]
},

/* ============ BLOQUE 8 · ARGUMENTACIÓN Y RAZONAMIENTO JURÍDICO ============ */
{
  id:"b8", nombre:"Argumentación y razonamiento jurídico", emoji:"🧠",
  desc:"Silogismo, premisas, conectores lógicos, falacias y estructura argumentativa.",
  tecnicas:[
    {id:"j71", nombre:"Silogismo jurídico",
     concepto:"El razonamiento jurídico se estructura como un silogismo: premisa mayor (norma), premisa menor (hechos), conclusión (decisión). Es la base de la sentencia judicial.",
     ejemplo:"Premisa mayor: «El que cause daño a otro debe indemnizarlo (art. 2341 C.C.).» Premisa menor: «Juan causó daño a Pedro.» Conclusión: «Juan debe indemnizar a Pedro.»",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del silogismo jurídico.",
       items:[
         "Premisa mayor (norma aplicable).",
         "Premisa menor (hechos probados).",
         "Conclusión (decisión jurídica)."
       ],
       retro:"El silogismo jurídico es la estructura básica del razonamiento judicial: norma + hechos → decisión."}},

    {id:"j72", nombre:"Conectores lógicos jurídicos",
     concepto:"Los conectores lógicos articulan el razonamiento jurídico: causales (porque, ya que), consecutivos (por lo tanto, en consecuencia), concesivos (aunque, no obstante), conclusivos (en conclusión, en síntesis).",
     ejemplo:"«La demanda no cumple los requisitos; por lo tanto, debe rechazarse.» «Aunque el recurso fue oportuno, no cumple los requisitos de fondo.»",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Causal","Consecutivo","Concesivo","Conclusivo"],
       items:[
         {texto:"porque", cat:0},
         {texto:"por lo tanto", cat:1},
         {texto:"aunque", cat:2},
         {texto:"en conclusión", cat:3},
         {texto:"ya que", cat:0},
         {texto:"no obstante", cat:2}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Su uso correcto demuestra madurez argumentativa."}},

    {id:"j73", nombre:"Conectores causales",
     concepto:"Los conectores causales introducen la razón o motivo: porque, ya que, puesto que, dado que, en tanto que. Son frecuentes en la motivación de las decisiones judiciales.",
     ejemplo:"«Se niega la solicitud, porque no cumple los requisitos legales.» «Dado que el término venció, la acción caducó.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa con un conector causal.",
       texto:"«Se rechaza la demanda, ___ no cumple los requisitos.»",
       respuestas:[["porque","ya que","puesto que","dado que","en tanto que"]],
       retro:"Los conectores causales introducen la razón de la decisión. Son esenciales en la motivación judicial."}},

    {id:"j74", nombre:"Conectores consecutivos",
     concepto:"Los conectores consecutivos expresan la consecuencia de lo dicho: por lo tanto, en consecuencia, por consiguiente, así pues, de ahí que. Se usan en la parte resolutiva.",
     ejemplo:"«El demandado no contestó la demanda; en consecuencia, se presumen ciertos los hechos.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa con un conector consecutivo.",
       texto:"«El recurso fue presentado extemporáneamente; ___, se rechaza.»",
       respuestas:[["por lo tanto","en consecuencia","por consiguiente","así pues","de ahí que"]],
       retro:"Los conectores consecutivos expresan la consecuencia lógica de lo dicho. Son frecuentes en la parte resolutiva."}},

    {id:"j75", nombre:"Conectores concesivos",
     concepto:"Los conectores concesivos admiten un obstáculo o dificultad: aunque, no obstante, sin embargo, a pesar de que, pese a que. Son frecuentes en la refutación de argumentos.",
     ejemplo:"«Aunque el demandante tiene razón en el primer cargo, los demás no prosperan.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa con un conector concesivo.",
       texto:"«___, el recurso cumple los requisitos formales, no prosperará por razones de fondo.»",
       respuestas:[["aunque","no obstante","sin embargo","a pesar de que","pese a que"]],
       retro:"Los conectores concesivos admiten un obstáculo antes de la conclusión principal. Son propios de la argumentación jurídica."}},

    {id:"j76", nombre:"Falacias argumentativas",
     concepto:"Las falacias son razonamientos defectuosos que parecen válidos. En derecho se deben evitar: ad hominem, generalización apresurada, falso dilema, apelación a la autoridad sin fundamento.",
     ejemplo:"Ad hominem: atacar al abogado contrario en lugar de refutar su argumento. Generalización: concluir de un caso aislado.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada falacia.",
       categorias:["Ad hominem","Generalización","Falso dilema"],
       items:[
         {texto:"«El abogado contrario es un incompetente.»", cat:0},
         {texto:"«Todos los jueces son corruptos, lo vi en un caso.»", cat:1},
         {texto:"«O se acepta mi pretensión o se vulnera la justicia.»", cat:2},
         {texto:"«No le crea, es un mentiroso.»", cat:0},
         {texto:"«Dos sentencias fueron revocadas, así que todas lo serán.»", cat:1}
       ],
       retro:"Detectar falacias es esencial para una argumentación jurídica sólida. La descalificación personal no es argumentación."}},

    {id:"j77", nombre:"Estructura de la argumentación jurídica",
     concepto:"La argumentación jurídica contiene: tesis (lo que se pretende), fundamentos (normas, jurisprudencia, doctrina), análisis y conclusión. Cada parte cumple una función específica.",
     ejemplo:"«TESIS: La demanda es procedente. FUNDAMENTOS: El artículo 29 exige el debido proceso. ANÁLISIS: El demandado no fue notificado. CONCLUSIÓN: Se vulneró el debido proceso.»",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura argumentativa.",
       items:[
         "Tesis o pretensión.",
         "Fundamentos normativos y jurisprudenciales.",
         "Análisis de los hechos y su subsunción en la norma.",
         "Conclusión."
       ],
       retro:"La argumentación jurídica sigue la estructura: tesis → fundamentos → análisis → conclusión."}},

    {id:"j78", nombre:"Subsunción de los hechos en la norma",
     concepto:"La subsunción es el proceso lógico de encajar los hechos probados en el supuesto de hecho de la norma. Es la operación central del razonamiento judicial.",
     ejemplo:"Norma: «El que cause daño debe indemnizar.» Hechos: «Juan causó daño a Pedro.» Subsunción: «El hecho de Juan encaja en el supuesto de la norma.»",
     ejercicio:{tipo:"fill",
       consigna:"Completa la subsunción.",
       texto:"La ___ es el proceso de encajar los hechos probados en el supuesto de la ___.",
       respuestas:[["subsuncion","subsunción"],["norma","ley"]],
       retro:"La subsunción es la operación lógica que permite aplicar la norma al caso concreto. Es la base de la decisión judicial."}},

    {id:"j79", nombre:"Distinguishing y overruling",
     concepto:"El distinguishing es la técnica de distinguir un caso de otro para no aplicar el precedente. El overruling es la revocación de un precedente. Son herramientas del razonamiento jurisprudencial.",
     ejemplo:"El juez distingue el caso actual del precedente porque los hechos son diferentes. O revoca el precedente porque ya no responde a la realidad social.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada técnica según su función.",
       categorias:["Distinguishing","Overruling"],
       items:[
         {texto:"Distinguir el caso actual de un precedente.", cat:0},
         {texto:"Revocar un precedente anterior.", cat:1},
         {texto:"No aplicar el precedente porque los hechos son distintos.", cat:0},
         {texto:"Cambiar la regla jurisprudencial.", cat:1},
         {texto:"Diferenciar los hechos del caso.", cat:0}
       ],
       retro:"El distinguishing distingue hechos; el overruling revoca el precedente. Son técnicas del razonamiento jurisprudencial."}},

    {id:"j80", nombre:"Razonamiento por analogía",
     concepto:"La analogía consiste en aplicar la norma de un caso similar a otro que no tiene regulación específica. Es un recurso limitado en el derecho penal, pero frecuente en el civil.",
     ejemplo:"Si no hay norma específica para un contrato atípico, se aplican por analogía las normas del contrato típico más similar.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición.",
       texto:"La ___ consiste en aplicar la norma de un caso ___ a otro que no tiene regulación específica.",
       respuestas:[["analogia","analogía"],["similar","semejante","parecido"]],
       retro:"La analogía permite aplicar normas de casos similares. En materia penal está limitada por el principio de legalidad."}}
  ]
},

/* ============ BLOQUE 9 · REDACCIÓN DE DOCUMENTOS JURÍDICOS ============ */
{
  id:"b9", nombre:"Redacción de documentos jurídicos", emoji:"📄",
  desc:"Contratos, poderes, actas, notificaciones y escritos procesales.",
  tecnicas:[
    {id:"j81", nombre:"Estructura del contrato",

     ejemplo:"«CONTRATO DE ARRENDAMIENTO. Entre X, mayor de edad, y Y, mayor de edad, se celebra el presente contrato, que se regirá por las siguientes cláusulas: PRIMERA. OBJETO. SEGUNDA. CANON...»",

       ],
       retro:"El contrato sigue la estructura: encabezado, partes, declaraciones, cláusulas y firmas. Cada cláusula regula un aspecto."}},

    {id:"j82", nombre:"Cláusulas contractuales",

    {id:"j83", nombre:"Poderes y mandatos",
     concepto:"El poder es el documento mediante el cual una persona autoriza a otra para actuar en su nombre. Contiene: identificación del poderdante, del apoderado, facultades conferidas y firma.",
