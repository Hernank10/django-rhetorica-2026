<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Pedagógica · Escuelas Normales y Licenciaturas</title>
<style>
  :root{
    --bg:#eee6e9;
    --paper:#fffdfa;
    --paper-2:#f9f4f2;
    --ink:#2b1220;
    --muted:#7a5c6a;
    --line:#ddd0d6;
    --line-2:#c8b4be;
    --accent:#5b21b6;
    --accent-dark:#4c1d95;
    --accent-soft:#ede9fe;
    --gold:#ca8a04;
    --gold-dark:#854d0e;
    --gold-soft:#fef9c3;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(60,20,50,.06), 0 12px 30px rgba(60,20,50,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    background:
      radial-gradient(circle at 15% 0%, #f6eef2 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(255,253,250,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #c4b5fd;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:15.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:system-ui,sans-serif;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600; font-family:system-ui,sans-serif;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#e3d4db; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#5b21b6,#ca8a04); transition:width .4s;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#f6ecef; border-color:#a88ba0;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f9f4f2; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
    font-family:system-ui,sans-serif;
  }
  .cat-head:hover{background:#f6ecef;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    background:var(--gold-soft); color:var(--gold-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#ebdde2; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#4a2838;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link:hover{background:#f6ecef;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--gold));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #c4b5fd; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(91,33,182,.22); border-color:var(--accent);}

  /* flashcard · papel con retícula punteada (cuaderno de docente) */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fffdf5;
    background-image:radial-gradient(rgba(91,33,182,.22) 1.1px, transparent 1.2px);
    background-size:22px 22px;
    background-position:11px 11px;
    box-shadow:inset 22px 0 0 -21px #d9a72e;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #c4b5fd;
    background-color:#f7f2ff;
    box-shadow:inset 22px 0 0 -21px #8b5cf6;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:25px; color:#2b1220; background:rgba(255,253,245,.92); padding:8px 12px; border-radius:8px;}
  .fc-back p{color:#4c1d95; background:rgba(247,242,255,.94);}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#a18ba0; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
    font-family:system-ui,sans-serif;
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#4a2838;
    background:#f9f4f2; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f7f2ff; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#ebdde2; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#2b1220;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--gold);
    background:#fdf9e9; color:var(--gold-dark); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fef9c3; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-family:system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#f2e9ec; border:1.5px dashed var(--line-2);}
  .seq{background:#f7f2ff; border:1.5px solid #c4b5fd;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#c8b4be; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f7f2ff;}
  .seq .ord-item{border-color:#c4b5fd;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#f2e9ec; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-family:system-ui,sans-serif; font-size:13px; color:#5a3a4a; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:25px;
    color:#2b1220; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf5;
    background-image:radial-gradient(rgba(91,33,182,.14) 1px, transparent 1.1px);
    background-size:22px 22px;
    background-position:11px 11px;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,33,182,.12);}
  textarea::placeholder{color:#a18ba0; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--gold-soft); border:1px solid #fde047; color:#713f12;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f9f4f2; border-left:3px solid var(--gold);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#713f12;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--gold-dark); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(60,20,50,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">✏️</div>
    <div>
      <h1>Cuaderno de Redacción Pedagógica · Escuelas Normales y Licenciaturas</h1>
      <p>100 técnicas · 10 bloques · sintaxis, puntuación, ortografía y estilo universitario</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN PEDAGÓGICA · 10 BLOQUES
   Escuelas Normales Superiores y Licenciaturas en Educación · Colombia
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · FUNDAMENTOS DE LA ESCRITURA PEDAGÓGICA ============ */
{
  id:"b1", nombre:"Fundamentos de la escritura pedagógica", emoji:"📚",
  desc:"Claridad, adecuación al destinatario, registro y función educativa del texto.",
  tecnicas:[
    {id:"p1", nombre:"Claridad y adecuación al destinatario",
     concepto:"El docente escribe para públicos muy diversos: estudiantes, familias, colegas, directivos. La claridad exige adaptar el registro, el léxico y el tono a quien va dirigido el texto. No se escribe igual una planeación de clase que una circular para padres.",
     ejemplo:"Al escribir a las familias: «El próximo viernes los estudiantes deben traer los materiales del proyecto» es más adecuado que «Los discentes deberán aportar los insumos requeridos para el desarrollo de la actividad pedagógica».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué significa «adecuación al destinatario» en la escritura pedagógica?",
       opciones:["Usar siempre el mismo lenguaje sin importar quién lee","Adaptar el registro, el léxico y el tono a quien va dirigido el texto","Escribir solo para los directivos","Utilizar tecnicismos para demostrar erudición"],
       correcta:1,
       retro:"La adecuación es un principio central: el mismo contenido cambia según el destinatario. Un texto pedagógico se juzga por cómo llega a quien lo lee."}},

    {id:"p2", nombre:"Función educativa de la escritura",
     concepto:"El texto del docente no solo informa: forma, orienta, evalúa y acompaña procesos. La escritura pedagógica tiene una función educativa explícita: debe contribuir al aprendizaje de quien la lee.",
     ejemplo:"Una retroalimentación escrita no solo señala errores: también propone caminos, motiva y reconoce avances. «Observo que ya usas conectores; ahora podrías trabajar la puntuación de diálogos».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué distingue a la escritura pedagógica de otros tipos de escritura?",
       opciones:["Su extensión","Su función educativa explícita: forma, orienta y acompaña aprendizajes","Su vocabulario técnico","Que se escribe en el aula"],
       correcta:1,
       retro:"La escritura pedagógica tiene una intención formativa. No es solo informar: es contribuir al aprendizaje de quien lee."}},

    {id:"p3", nombre:"Registro pedagógico formal",
     concepto:"El registro pedagógico es formal, respetuoso y claro. Evita coloquialismos, diminutivos innecesarios y expresiones que puedan resultar ambiguas o descalificadoras hacia estudiantes y familias.",
     ejemplo:"No se escribe «los chicos son un desastre»; se escribe «el grupo presenta dificultades de atención sostenida que requieren estrategias específicas».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro pedagógico o coloquial.",
       categorias:["Pedagógico","Coloquial"],
       items:[
         {texto:"«El grupo requiere estrategias de atención sostenida.»", cat:0},
         {texto:"«Los chicos son un desastre.»", cat:1},
         {texto:"«Se observa una mejora en la comprensión lectora.»", cat:0},
         {texto:"«Le fue súper mal en el examen.»", cat:1},
         {texto:"«El estudiante presenta dificultades específicas.»", cat:0}
       ],
       retro:"El registro pedagógico es formal y respetuoso. Los coloquialismos restan seriedad y pueden herir a quien lee."}},

    {id:"p4", nombre:"Impersonalidad y voz profesional",
     concepto:"En documentos institucionales (actas, informes, circulares) se prefiere la impersonalidad: pasiva refleja o primera persona del plural. En textos personales (diario pedagógico, reflexión), la primera persona es válida y necesaria.",
     ejemplo:"Acta: «Se acordó ajustar el cronograma». Diario pedagógico: «Hoy comprendí que mis estudiantes aprenden mejor cuando trabajan en equipo».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado según el tipo de texto al que corresponde.",
       categorias:["Documento institucional (impersonal)","Diario pedagógico (primera persona)"],
       items:[
         {texto:"«Se acordó ajustar el cronograma.»", cat:0},
         {texto:"«Hoy me di cuenta de que mi pregunta fue demasiado cerrada.»", cat:1},
         {texto:"«Se aprueba el plan de mejoramiento.»", cat:0},
         {texto:"«Siento que la clase de hoy funcionó mejor que la anterior.»", cat:1},
         {texto:"«Se informa a las familias del cambio de fecha.»", cat:0}
       ],
       retro:"El género define la voz. Los documentos institucionales son impersonales; los textos reflexivos admiten y requieren la primera persona."}},

    {id:"p5", nombre:"Objetividad y valoración justa",
     concepto:"El docente describe hechos y evidencias antes de valorar. La valoración debe apoyarse en datos, no en impresiones. Esto es especialmente importante en informes de estudiantes y en observaciones de clase.",
     ejemplo:"Objetivo: «El estudiante participó 4 veces durante la clase y entregó 3 de 4 tareas». Valorativo sin evidencia: «El estudiante es muy desinteresado».",
     ejercicio:{tipo:"fill",
       consigna:"Convierte la valoración en un enunciado con evidencia.",
       texto:"«El estudiante es irresponsable» → «El estudiante entregó ___ de las últimas 4 tareas asignadas».",
       respuestas:[["1","una","2","dos","3","tres"]],
       retro:"La valoración justa se apoya en evidencias observables. Describir antes de juzgar es un principio ético y pedagógico."}},

    {id:"p6", nombre:"Concisión al servicio del lector",
     concepto:"Un texto pedagógico conciso es más fácil de leer y de aplicar. Se eliminan rodeos, fórmulas vacías y frases que no aportan información. La concisión respeta el tiempo del lector.",
     ejemplo:"Extenso: «Con el objetivo de poder llevar a cabo la implementación de las actividades previstas». Conciso: «Para realizar las actividades previstas».",
     ejercicio:{tipo:"fill",
       consigna:"Reduce el enunciado sin perder información.",
       texto:"«Con el fin de poder llevar a cabo la realización de las actividades programadas» → «Para ___ las actividades programadas».",
       respuestas:[["realizar","hacer","ejecutar","desarrollar","aplicar"]],
       retro:"La concisión respeta el tiempo del lector. En documentos pedagógicos, decir más con menos palabras es una forma de cuidado."}},

    {id:"p7", nombre:"Coherencia entre propósito y forma",
     concepto:"Cada tipo de texto pedagógico cumple un propósito: informar, orientar, evaluar, reflexionar, comunicar. La forma (extensión, estructura, tono) debe corresponder a ese propósito.",
     ejemplo:"Una circular debe ser breve y directa (informar). Una planeación de clase requiere detalle (orientar). Un diario pedagógico requiere reflexión (pensar la práctica).",
     ejercicio:{tipo:"classify",
       consigna:"Relaciona cada tipo de texto con su propósito principal.",
       categorias:["Informar","Orientar","Reflexionar"],
       items:[
         {texto:"Circular a las familias.", cat:0},
         {texto:"Planeación de clase.", cat:1},
         {texto:"Diario pedagógico.", cat:2},
         {texto:"Observador del estudiante.", cat:0},
         {texto:"Informe de práctica.", cat:2}
       ],
       retro:"Cada género tiene su propósito. Reconocerlo orienta las decisiones de forma, extensión y tono."}},

    {id:"p8", nombre:"Estructura externa de los textos pedagógicos",
     concepto:"La mayoría de documentos pedagógicos tienen una estructura prefijada: encabezado, identificación, cuerpo, conclusiones y firma. Reconocerla facilita la escritura y el cumplimiento de normas institucionales.",
     ejemplo:"Un informe de práctica docente incluye: portada, introducción, contextualización, descripción de la práctica, análisis reflexivo, conclusiones y anexos.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un informe de práctica.",
       items:[
         "Portada e identificación del practicante.",
         "Introducción y contextualización.",
         "Descripción de la práctica.",
         "Análisis reflexivo.",
         "Conclusiones y anexos."
       ],
       retro:"La estructura externa es previsible. Reconocerla permite cumplir con las normas institucionales y facilitar la lectura."}},

    {id:"p9", nombre:"Corrección lingüística como ética docente",
     concepto:"La corrección lingüística no es un lujo: es parte de la responsabilidad profesional. Un docente que escribe con errores transmite un modelo de lengua. La escritura del maestro enseña tanto como lo que dice.",
     ejemplo:"Un docente que escribe «haber si vienes» en lugar de «a ver si vienes» transmite un error ortográfico que los estudiantes pueden repetir.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué la corrección lingüística es una responsabilidad del docente?",
       opciones:["Porque lo exige el manual de funciones","Porque el docente es modelo de lengua escrita para sus estudiantes","Porque las universidades lo exigen","Porque mejora el sueldo"],
       correcta:1,
       retro:"El docente enseña lengua con su propio uso. Escribir con corrección es una forma de respeto hacia los estudiantes y hacia la profesión."}},

    {id:"p10", nombre:"Escritura como herramienta de pensamiento",
     concepto:"Escribir no es solo comunicar: es pensar. La escritura pedagógica ayuda al docente a organizar su práctica, a reflexionar sobre ella, a planear y a sistematizar. Escribir es una forma de aprender a enseñar.",
     ejemplo:"Un docente que escribe su diario pedagógico descubre patrones que no había notado en su práctica. La escritura hace visible el pensamiento profesional.",
     ejercicio:{tipo:"open",
       consigna:"¿Cómo puede la escritura ayudarte a pensar mejor tu práctica docente? Escribe 3-4 líneas.",
       criterios:[
         "Expliqué al menos una forma en que la escritura ayuda a pensar.",
         "Relacioné la escritura con la práctica docente concreta.",
         "Mencioné algún tipo de texto pedagógico (diario, planeación, informe)."
       ],
       modelo:"Escribir mi diario pedagógico me ayuda a ver lo que no noto durante la clase. Al redactar por la tarde, descubro patrones: por ejemplo, que mis preguntas son casi siempre cerradas o que un grupo pierde la atención siempre a la misma hora. La escritura fija lo fugaz y convierte la experiencia en pensamiento. Sin escribir, la práctica se me escapa entre las clases."}}
  ]
},

/* ============ BLOQUE 2 · SINTAXIS PEDAGÓGICA ============ */
{
  id:"b2", nombre:"Sintaxis y oración", emoji:"🧱",
  desc:"Orden lógico, longitud, voz, subordinación, coordinación y concordancia.",
  tecnicas:[
    {id:"p11", nombre:"Orden lógico: SVO",
     concepto:"En español se prefiere el orden Sujeto + Verbo + Objeto. Alterarlo (hipérbaton) dificulta la lectura. En textos pedagógicos que deben ser comprendidos por estudiantes y familias, el orden natural es esencial.",
     ejemplo:"Orden lógico: «El docente explicó la actividad». Orden alterado: «La actividad, el docente, explicó».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden lógico.",
       texto:"Palabras: «los estudiantes / la maestra / felicitó» → «La maestra ___ a los estudiantes».",
       respuestas:[["felicito","felicitó"]],
       retro:"El orden SVO es la base de la claridad. En textos pedagógicos, la claridad supera a la elegancia estilística."}},

    {id:"p12", nombre:"Oraciones cortas y legibles",
     concepto:"Las oraciones pedagógicas deben ser cortas: 15-20 palabras máximo. Las oraciones largas dificultan la lectura, especialmente para estudiantes y familias. Si una oración es larga, se divide.",
     ejemplo:"En vez de una oración de 50 palabras explicando los criterios de evaluación, se divide en tres: «Se evaluará la participación. Se tendrá en cuenta la entrega puntual. Se valorará la calidad del trabajo».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la longitud recomendada de una oración pedagógica?",
       opciones:["Hasta 40 palabras","Entre 15 y 20 palabras","Al menos 30 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas (15-20 palabras) son más fáciles de leer y de comprender, especialmente para estudiantes y familias."}},

    {id:"p13", nombre:"Voz activa vs. voz pasiva",
     concepto:"La voz activa es más directa y clara. La voz pasiva oculta al agente y puede generar ambigüedad. En textos pedagógicos se prefiere la voz activa, salvo cuando se busca impersonalidad institucional.",
     ejemplo:"Pasiva: «La actividad fue explicada por el docente». Activa: «El docente explicó la actividad».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"«La maestra organizó el trabajo en grupos.»", cat:0},
         {texto:"«El trabajo fue organizado por la maestra.»", cat:1},
         {texto:"«Los estudiantes entregaron el proyecto.»", cat:0},
         {texto:"«El proyecto fue entregado por los estudiantes.»", cat:1},
         {texto:"«El rector convocó a reunión.»", cat:0}
       ],
       retro:"La voz activa es más clara. La pasiva se reserva para documentos institucionales donde se prioriza la impersonalidad."}},

    {id:"p14", nombre:"Gerundios: evitar el abuso",
     concepto:"El gerundio excesivo (especialmente el de posterioridad) dificulta la lectura. En textos pedagógicos se prefiere el verbo conjugado o la oración de relativo. «Escribiendo, pensando, observando» son formas válidas, pero no para encadenar acciones.",
     ejemplo:"Incorrecto: «Los estudiantes leyeron el texto, comprendiendo la idea principal». Correcto: «Los estudiantes leyeron el texto y comprendieron la idea principal».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por un verbo conjugado.",
       texto:"«Se organizó la salida, coordinando con las familias» → «Se organizó la salida y se ___ con las familias».",
       respuestas:[["coordino","coordinó"]],
       retro:"El gerundio de posterioridad es incorrecto. Se sustituye por un verbo conjugado o por una oración de relativo."}},

    {id:"p15", nombre:"Subordinación mínima",
     concepto:"En textos pedagógicos se recomienda limitar la subordinación. Encadenar muchas oraciones subordinadas produce frases interminables y ambiguas. Se prefiere dividir en oraciones simples.",
     ejemplo:"Excesivo: «El estudiante que había faltado a la clase que se realizó el martes que pasó me entregó el trabajo que le había pedido». Adecuado: «El estudiante faltó el martes. Me entregó el trabajo que le había pedido».",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos más cortas.",
       texto:"«El estudiante que había estado enfermo me entregó el trabajo que le había pedido» → «El estudiante había estado enfermo. Me ___ el trabajo».",
       respuestas:[["entrego","entregó"]],
       retro:"La subordinación excesiva es una de las causas más frecuentes de oscuridad. Dividir en oraciones simples mejora la claridad."}},

    {id:"p16", nombre:"Coordinación en enumeraciones pedagógicas",
     concepto:"La coordinación une elementos paralelos: objetivos, criterios, pasos. En textos pedagógicos es frecuente al enumerar actividades, criterios de evaluación o desempeños.",
     ejemplo:"«Se evaluará: (1) la participación en clase; (2) la entrega de tareas; (3) el trabajo en equipo; (4) la evaluación final».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su tipo de coordinación.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],
       items:[
         {texto:"y", cat:0},
         {texto:"pero", cat:1},
         {texto:"o", cat:2},
         {texto:"e", cat:0},
         {texto:"sino", cat:1}
       ],
       retro:"La coordinación copulativa suma; la adversativa opone; la disyuntiva presenta alternativas."}},

    {id:"p17", nombre:"Concordancia gramatical",
     concepto:"La concordancia exige que sujeto y verbo coincidan en número y persona, y que sustantivo y adjetivo coincidan en género y número. Su ruptura produce agramaticalidad. Es un error frecuente en informes extensos.",
     ejemplo:"Incorrecto: «Los estudiantes presentó el trabajo». Correcto: «Los estudiantes presentaron el trabajo».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la concordancia.",
       texto:"«Los docentes y los estudiantes participó en la jornada» → «Los docentes y los estudiantes ___ en la jornada».",
       respuestas:[["participaron","participo","participó"]],
       retro:"El sujeto compuesto exige verbo en plural. La concordancia es obligatoria en todo el texto."}},

    {id:"p18", nombre:"Evitar hipérbaton",
     concepto:"El hipérbaton es la alteración del orden natural de la oración. En poesía es un recurso; en textos pedagógicos, un obstáculo. Se debe mantener el orden lógico para facilitar la lectura.",
     ejemplo:"Hipérbaton: «A los estudiantes, la maestra, la actividad, explicó». Orden natural: «La maestra explicó la actividad a los estudiantes».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden natural.",
       texto:"Palabras: «la maestra / el proyecto / evaluó» → «La maestra ___ el proyecto».",
       respuestas:[["evaluo","evaluó"]],
       retro:"El hipérbaton innecesario oscurece el mensaje. En textos pedagógicos se mantiene el orden lógico."}},

    {id:"p19", nombre:"Párrafos: una idea por párrafo",
     concepto:"Cada párrafo desarrolla una idea principal. Mezclar ideas genera confusión. La extensión recomendada es de 60-120 palabras. En planeaciones, cada sección (objetivos, actividades, evaluación) es un párrafo.",
     ejemplo:"Un párrafo para los objetivos, otro para las actividades, otro para la evaluación. Cada uno con su idea central.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuántas ideas principales debe desarrollar cada párrafo pedagógico?",
       opciones:["Todas las relacionadas con el tema","Una sola idea principal","Al menos tres","No importa cuántas"],
       correcta:1,
       retro:"Un párrafo = una idea. Si aparece otra idea, se abre un nuevo párrafo. Es la base de la organización pedagógica."}},

    {id:"p20", nombre:"Referencias anafóricas",
     concepto:"Los pronombres (él, este, aquel, que) remiten a un antecedente. En textos pedagógicos debe quedar claro a qué se refieren. Si hay duda, se repite el sustantivo o se usa la denominación completa.",
     ejemplo:"Ambiguo: «El docente habló con el estudiante sobre su trabajo». ¿«Su» = docente o estudiante? Claro: «El docente habló con el estudiante sobre el trabajo del estudiante».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad repitiendo el sustantivo.",
       texto:"«La maestra le dijo a la madre que su hijo había mejorado» → «La maestra le dijo a la madre que el hijo de la ___ había mejorado».",
       respuestas:[["madre"]],
       retro:"Repetir el sustantivo elimina la ambigüedad. En textos pedagógicos, la claridad es primordial."}}
  ]
},

/* ============ BLOQUE 3 · PUNTUACIÓN ============ */
{
  id:"b3", nombre:"Puntuación en textos pedagógicos", emoji:"✒️",
  desc:"Coma, punto y coma, dos puntos, comillas, guiones y paréntesis.",
  tecnicas:[
    {id:"p21", nombre:"La coma en enumeraciones",
     concepto:"La coma separa elementos de una enumeración. En textos pedagógicos es frecuente al listar objetivos, actividades, criterios o recursos. El último elemento se une con «y» u «o».",
     ejemplo:"«Se utilizarán cartulinas, marcadores, tijeras y pegamento». La coma separa los materiales; la «y» cierra la enumeración.",
     ejercicio:{tipo:"fill",
       consigna:"Coloca las comas donde correspondan.",
       texto:"«Los estudiantes leerán escribirán y expondrán» → «Los estudiantes leerán___ escribirán___ y expondrán».",
       respuestas:[[","],[","]],
       retro:"Los elementos de una enumeración se separan con coma. El último se une con «y» sin coma previa."}},

    {id:"p22", nombre:"Coma vocativa",
     concepto:"El vocativo es la palabra o frase con la que nos dirigimos al interlocutor. Siempre se separa con coma. En textos pedagógicos es frecuente: «Estimados estudiantes», «Apreciadas familias».",
     ejemplo:"«Estudiantes, recuerden traer los materiales». «Apreciadas familias, la reunión será el viernes».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma del vocativo.",
       texto:"«Apreciadas familias___ la reunión será el viernes».",
       respuestas:[[","]],
       retro:"El vocativo siempre se separa con coma. Es un error frecuente en circulares y comunicados escolares."}},

    {id:"p23", nombre:"Punto y coma en enumeraciones complejas",
     concepto:"Cuando los elementos de una enumeración son extensos o tienen puntuación interna, se separan con punto y coma. Es frecuente en criterios de evaluación y en descriptores de desempeño.",
     ejemplo:"«Se evaluará: la participación activa en clase; la entrega puntual de tareas; el trabajo colaborativo; la evaluación escrita final».",
     ejercicio:{tipo:"fill",
       consigna:"Separa los criterios con punto y coma.",
       texto:"«Se evaluará la participación___ la entrega de tareas___ el trabajo en equipo».",
       respuestas:[[";"],[";"]],
       retro:"En enumeraciones extensas o con puntuación interna, se usa punto y coma. Facilita la lectura."}},

    {id:"p24", nombre:"Dos puntos: anunciar listas y citas",
     concepto:"Los dos puntos anuncian una enumeración, una aclaración, una cita textual o una conclusión. En textos pedagógicos son frecuentes al presentar objetivos, criterios o actividades.",
     ejemplo:"«Los objetivos son los siguientes: comprender el texto; identificar ideas principales; elaborar un resumen».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca dos puntos donde correspondan.",
       texto:"«Los objetivos son los siguientes___ comprender; analizar; aplicar».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian una enumeración o cita. Se escriben sin espacio antes y con espacio después."}},

    {id:"p25", nombre:"Punto y aparte",
     concepto:"El punto y aparte cierra un párrafo. En textos pedagógicos, cada párrafo desarrolla una idea. El punto y aparte facilita la lectura y la localización de información.",
     ejemplo:"Un párrafo para la introducción, otro para la descripción de la práctica, otro para el análisis. Cada uno termina en punto y aparte.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte en un texto pedagógico?",
       opciones:["Cuando se termina una oración","Cuando se termina un párrafo","Cuando se cita un autor","Cuando se enumeran objetivos"],
       correcta:1,
       retro:"El punto y aparte cierra el párrafo. Después se inicia uno nuevo con sangría o espacio adicional."}},

    {id:"p26", nombre:"Paréntesis para aclaraciones",
     concepto:"Los paréntesis encierran información complementaria: siglas, aclaraciones, ejemplos breves. En textos pedagógicos se usan para agregar precisiones sin interrumpir el argumento.",
     ejemplo:"«Los estudiantes de grado sexto (11-12 años) participaron en la jornada». «Se aplicó el DBA (Derechos Básicos de Aprendizaje)».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde correspondan.",
       texto:"«Los estudiantes de grado sexto ___11-12 años___ participaron en la jornada».",
       respuestas:[["("],[" )",""]],
       retro:"Los paréntesis encierran información aclaratoria. No se deja espacio antes del de apertura ni después del de cierre."}},

    {id:"p27", nombre:"Comillas",
     concepto:"Las comillas encierran citas textuales, títulos de artículos o capítulos, términos específicos y usos irónicos. En textos pedagógicos son frecuentes al citar autores o al destacar términos.",
     ejemplo:"«Según Freire (1970), “la educación no cambia el mundo, cambia a las personas que van a cambiar el mundo”». «Se trabajará el “aprendizaje significativo” de Ausubel».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«El enfoque de ___aprendizaje significativo___ orienta la propuesta».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran citas, términos específicos o títulos. Pueden ser latinas (« ») o inglesas (“ ”), según la norma."}},

    {id:"p28", nombre:"Guiones y rayas",
     concepto:"El guion (-) une palabras compuestas. La raya (—) introduce diálogos o aclaraciones. En textos pedagógicos, el guion aparece en términos como «enseñanza-aprendizaje», y la raya en transcripciones de clases o entrevistas.",
     ejemplo:"«El proceso de enseñanza-aprendizaje» (guion). «El estudiante —dijo la maestra— mejoró notablemente» (raya).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso del signo.",
       categorias:["Guion (-)","Raya (—)"],
       items:[
         {texto:"«enseñanza-aprendizaje»", cat:0},
         {texto:"«teórico-práctico»", cat:0},
         {texto:"«El estudiante —dijo la maestra— mejoró»", cat:1},
         {texto:"«El niño —comentó el padre— está feliz»", cat:1},
         {texto:"«educativo-cultural»", cat:0}
       ],
       retro:"El guion une; la raya aísla. Cada uno tiene usos específicos. En textos pedagógicos, el guion es frecuente en términos compuestos."}},

    {id:"p29", nombre:"Punto y seguido",
     concepto:"El punto y seguido separa oraciones dentro de un mismo párrafo. Cada oración debe tener sentido completo. Su uso correcto es fundamental para la claridad.",
     ejemplo:"«Los estudiantes leyeron el texto. Luego respondieron las preguntas. Finalmente compartieron sus respuestas».",
     ejercicio:{tipo:"fill",
       consigna:"Separa las oraciones con punto y seguido.",
       texto:"«Los estudiantes leyeron el texto___ Luego respondieron las preguntas».",
       respuestas:[["."]],
       retro:"El punto y seguido separa oraciones. Después se escribe mayúscula."}},

    {id:"p30", nombre:"Signos de interrogación en consignas",
     concepto:"Los signos de interrogación enmarcan preguntas. En textos pedagógicos son frecuentes en consignas, cuestionarios, evaluaciones y reflexiones. En español se abren (¿) y se cierran (?).",
     ejemplo:"«¿Cuál es la idea principal del texto?» «¿Cómo se relaciona con tu experiencia?». También en reflexiones: «¿Qué aprendí hoy como docente?».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca los signos de interrogación.",
       texto:"«___Cuál es la idea principal del texto___»",
       respuestas:[["¿"],["?"]],
       retro:"En español los signos de interrogación son dobles: se abren (¿) y se cierran (?). Es una diferencia frente al inglés."}}
  ]
},

    {id:"p32", nombre:"Tilde diacrítica",
     concepto:"La tilde diacrítica distingue palabras iguales con funciones distintas: él/el, tú/tu, mí/mi, sí/si, más/mas, dé/de, sé/se, té/te. Es un error muy frecuente en textos pedagógicos.",

    {id:"p33", nombre:"Mayúsculas en instituciones y cargos",
     concepto:"Los nombres oficiales de instituciones llevan mayúscula (Universidad Pedagógica Nacional, Ministerio de Educación Nacional). Los cargos genéricos van en minúscula (rector, docente, coordinador), salvo en vocativo.",

    {id:"p34", nombre:"Fechas y horas",
     concepto:"Las fechas se escriben con números arábigos y mes en minúscula: 15 de julio de 2024. Las horas con dos puntos: 14:30 h. Es la norma de la RAE y del estilo académico.",

    {id:"p35", nombre:"Siglas educativas",
     concepto:"En pedagogía abundan las siglas: PEI (Proyecto Educativo Institucional), DBA (Derechos Básicos de Aprendizaje), ICFES, MEN (Ministerio de Educación Nacional), PTA (Programa Todos a Aprender). Se escriben sin puntos y en mayúsculas.",

    {id:"p36", nombre:"Abreviaturas pedagógicas",
     concepto:"Las abreviaturas se cierran con punto: págs. (páginas), cap. (capítulo), ed. (edición), n.º (número), etc. (etcétera), a. C. (antes de Cristo). En textos pedagógicos se usan con moderación.",

       retro:"Las abreviaturas llevan punto. Se usan con moderación y con coherencia en el documento."}},

    {id:"p37", nombre:"Latinismos académicos",
     concepto:"En textos pedagógicos y académicos se usan algunos latinismos: in situ, a priori, a posteriori, per cápita, de facto, ad hoc, curriculum vitae, modus operandi. Se escriben en cursiva y sin acentos.",
     ejemplo:"«La observación se realizó in situ». «A priori, la hipótesis es plausible». «El comité ad hoc revisó el informe».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada latinismo según su significado.",
       categorias:["En el lugar","Antes de","Después de","Para este caso"],
       items:[

         {texto:"a priori", cat:1},
         {texto:"a posteriori", cat:2},
         {texto:"ad hoc", cat:3},
         {texto:"de facto", cat:0}
       ],
       retro:"Los latinismos son frecuentes en lenguaje académico. Se escriben en cursiva y sin acentos."}},

    {id:"p38", nombre:"Extranjerismos en educación",
     concepto:"En pedagogía abundan los extranjerismos: feedback, coaching, brainstorming, blended learning, flipped classroom. Cuando existen equivalentes en español, se prefieren; si no, se usan en cursiva.",
     ejemplo:"«Retroalimentación» en lugar de «feedback». «Aprendizaje combinado» en lugar de «blended learning». «Aula invertida» en lugar de «flipped classroom».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el extranjerismo por su equivalente español.",
       texto:"«El feedback del docente» → «La ___ del docente». · «Blended learning» → «Aprendizaje ___».",
       respuestas:[["retroalimentacion","retroalimentación"],["combinado","mixto","semipresencial"]],
       retro:"Cuando existe equivalente en español, se prefiere. Si no, se usa el término original en cursiva."}},

    {id:"p39", nombre:"Escritura de números",
     concepto:"En textos pedagógicos, los números del uno al diez pueden escribirse con letra en el cuerpo del texto; las cifras exactas y datos se escriben con número arábigo. En listas y enumeraciones se prefieren los números.",
     ejemplo:"«Se realizaron tres actividades» (letra). «Participaron 32 estudiantes» (cifra). «Los grados 6.º, 7.º y 8.º» (números).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica el uso correcto de los números.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«Se realizaron tres actividades»", cat:0},
         {texto:"«Participaron treinta y dos estudiantes»", cat:1},

         {texto:"«Los grados 6.º, 7.º y 8.º»", cat:0}
       ],
       retro:"Los datos exactos y cifras van con número. Los números pequeños en el cuerpo del texto pueden ir con letra."}},

    {id:"p40", nombre:"Cursivas y negritas",
     concepto:"En textos pedagógicos, la cursiva se usa para latinismos, extranjerismos y títulos de obras completas. La negrita, para títulos de sección y palabras clave. Se evita el abuso de mayúsculas sostenidas y negritas.",
     ejemplo:"«El currículum (cursiva) de la institución...». Títulos en negrita. No se escribe todo un párrafo en mayúsculas.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa la cursiva en textos pedagógicos?",
       opciones:["Para enfatizar cualquier palabra","Para latinismos, extranjerismos y títulos de obras completas","Para títulos de sección","Para todo el texto"],
       correcta:1,
       retro:"La cursiva se usa con moderación: latinismos, extranjerismos y títulos de obras. El abuso de formatos resta profesionalismo."}}
  ]

    {id:"p42", nombre:"Falso lenguaje pedagógico",
     concepto:"No todo lo que suena pedagógico es correcto. Expresiones como «el alumno», «dar clase», «dictar» (en lugar de «enseñar»), «a nivel de» son criticadas por su carga semántica o por su imprecisión.",
     ejemplo:"Se prefiere «estudiante» a «alumno» (alumno = sin luz). Se prefiere «enseñar» o «acompañar el aprendizaje» a «dictar clase». Se prefiere «en el ámbito de» a «a nivel de».",

    {id:"p43", nombre:"Precisión en la terminología",
     concepto:"En pedagogía, los términos tienen matices: «evaluar», «calificar», «medir», «valorar» no son sinónimos. «Objetivo», «competencia», «desempeño», «resultado de aprendizaje» tienen significados distintos.",

       consigna:"Clasifica cada verbo según su significado pedagógico.",
       categorias:["Asignar nota","Proceso completo","Cuantificar"],

         {texto:"medir", cat:2},
         {texto:"poner una nota", cat:0},
         {texto:"aplicar un instrumento", cat:1}
       ],
       retro:"Evaluar, calificar, medir y valorar son procesos distintos. La precisión terminológica es esencial en documentos pedagógicos."}},

    {id:"p44", nombre:"Lenguaje inclusivo y respetuoso",
     concepto:"El lenguaje pedagógico evita expresiones discriminatorias, estereotipadas o que estigmaticen a los estudiantes. Se prefieren fórmulas respetuosas y que reconozcan la diversidad.",

       respuestas:[["apoyo"]],
       retro:"El lenguaje construye realidades. Un lenguaje respetuoso reconoce al estudiante como sujeto y evita estigmatizarlo."}},

    {id:"p45", nombre:"Neologismos pedagógicos",
     concepto:"La pedagogía produce neologismos constantemente: gamificación, aula invertida, aprendizaje ubicuo, microaprendizaje, pensamiento computacional. Algunos se adaptan al español; otros se mantienen en inglés.",

    {id:"p46", nombre:"Siglas y su significado",

    {id:"p48", nombre:"Léxico de la evaluación",

    {id:"p49", nombre:"Léxico de la didáctica",
