/* ============ BLOQUE 6 · ESTILO UNIVERSITARIO ============ */
{
  id:"b6", nombre:"Estilo universitario y académico", emoji:"🎓",
  desc:"Registro, citas APA, paráfrasis, plagio, argumentación y coherencia.",
  tecnicas:[
    {id:"p51", nombre:"Registro académico",
     concepto:"El registro académico es formal y culto. Evita coloquialismos, expresiones vagas y valoraciones sin respaldo. Se usa un vocabulario preciso y se construyen argumentos con evidencia.",
     ejemplo:"No se escribe «los estudiantes son muy flojos»; se escribe «se observa una disminución en la entrega de tareas que requiere atención pedagógica».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro académico o coloquial.",
       categorias:["Académico","Coloquial"],
       items:[
         {texto:"«Se observa una disminución en la entrega.»", cat:0},
         {texto:"«Los estudiantes son muy flojos.»", cat:1},
         {texto:"«Los datos sugieren una tendencia.»", cat:0},
         {texto:"«Un montón de estudiantes faltaron.»", cat:1},
         {texto:"«Se evidencia una mejora progresiva.»", cat:0}
       ],
       retro:"El registro académico es formal y objetivo. Los coloquialismos restan credibilidad al texto."}},

    {id:"p52", nombre:"Citas textuales cortas (APA)",
     concepto:"Las citas textuales de menos de 40 palabras van entre comillas dentro del párrafo, con autor, año y número de página: (Autor, año, p. X). Es la norma APA, muy usada en licenciaturas.",
     ejemplo:"«La educación no cambia el mundo, cambia a las personas que van a cambiar el mundo» (Freire, 1970, p. 45).",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita APA.",
       texto:"«Enseñar no es transferir conocimiento» (Freire, ___, p. ___). (Freire, 2004, p. 47)",
       respuestas:[["2004"],["47"]],
       retro:"La cita textual siempre lleva autor, año y página. Sin estos datos, la cita está incompleta."}},

    {id:"p53", nombre:"Citas textuales largas",
     concepto:"Las citas de más de 40 palabras van en bloque sangrado, sin comillas, con autor, año y página al final. Se usa para fragmentos extensos que merecen reproducirse literalmente.",
     ejemplo:"En un párrafo aparte, sangrado a la izquierda, se escribe: «La lectura del mundo precede siempre a la lectura de la palabra… (texto completo)» (Freire, 2004, p. 47).",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cómo se escribe una cita directa de más de 40 palabras en APA?",
       opciones:["Entre comillas dentro del texto","En bloque sangrado, sin comillas, con autor, año y página","Sin indicar la fuente","En cursiva y sin autor"],
       correcta:1,
       retro:"Las citas largas se sangran en bloque y se omiten las comillas. Siempre se indica autor, año y página."}},

    {id:"p54", nombre:"Paráfrasis académica",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, manteniendo el significado y citando la fuente. No es copiar cambiando algunas palabras.",
     ejemplo:"Original: «El aprendizaje significativo se produce cuando el nuevo contenido se relaciona con los conocimientos previos del estudiante». Paráfrasis: «Según Ausubel (1983), se aprende significativamente cuando lo nuevo se conecta con lo que el estudiante ya sabe».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis con la cita APA.",
       texto:"«Según Ausubel (___), el aprendizaje se vuelve significativo cuando se conecta con los ___ previos».",
       respuestas:[["1983","año"],["conocimientos","saberes","aprendizajes"]],
       retro:"La paráfrasis mantiene la idea ajena con palabras propias y siempre cita la fuente. Sin cita, sería plagio."}},

    {id:"p55", nombre:"Referencias bibliográficas APA",
     concepto:"En APA, las referencias se ordenan alfabéticamente y siguen un formato específico: Apellido, A. A. (Año). Título en cursiva. Editorial. Para artículos: Apellido, A. A. (Año). Título del artículo. Nombre de la Revista, volumen(número), páginas.",
     ejemplo:"Freire, P. (1970). Pedagogía del oprimido. Siglo XXI. · Ausubel, D. (1983). Psicología educativa: un punto de vista cognoscitivo. Trillas.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia APA de libro.",
       items:[
         "Apellido, inicial del autor.",
         "(Año).",
         "Título del libro en cursiva.",
         "Editorial."
       ],
       retro:"El orden APA es fijo: autor, año, título (cursiva), editorial. Es la norma más usada en licenciaturas colombianas."}},

    {id:"p56", nombre:"Referencias de documentos oficiales",
     concepto:"En Colombia, los documentos oficiales (leyes, decretos, lineamientos del MEN, DBA) tienen un formato específico de referencia. Se citan con el nombre del documento, el año y la entidad.",
     ejemplo:"«Ministerio de Educación Nacional. (2016). Derechos Básicos de Aprendizaje: Lenguaje. MEN». «Ley 115 de 1994. Ley General de Educación».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia del documento oficial.",
       texto:"«Ministerio de Educación Nacional. (___). Derechos Básicos de Aprendizaje: Lenguaje. MEN». (año: 2016)",
       respuestas:[["2016"]],
       retro:"Los documentos oficiales se citan con entidad, año y título. Es parte de la formación del docente colombiano."}},

    {id:"p57", nombre:"Conectores lógicos académicos",
     concepto:"Los conectores organizan el razonamiento: adición (además, asimismo), contraste (sin embargo, no obstante), causa (porque, debido a), consecuencia (por lo tanto, en consecuencia), orden (en primer lugar, seguidamente).",
     ejemplo:"«La evaluación formativa mejora el aprendizaje; sin embargo, exige más tiempo del docente. Por lo tanto, requiere planeación cuidadosa».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Adición","Contraste","Causa","Consecuencia"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"debido a", cat:2},
         {texto:"por lo tanto", cat:3},
         {texto:"asimismo", cat:0},
         {texto:"en consecuencia", cat:3}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Sin ellos, el texto académico parece una lista sin hilo."}},

    {id:"p58", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. Es una falta grave de integridad académica.",
     ejemplo:"Copiar un párrafo de un libro sin comillas ni cita es plagio. Parafrasear sin citar también lo es. Citar sin comillas cuando es textual también lo es.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"p59", nombre:"Argumentación académica",
     concepto:"La argumentación académica defiende una tesis con razones y evidencia. Estructura: introducción con tesis, desarrollo con argumentos, refutación de contraargumentos y conclusión.",
     ejemplo:"«Este ensayo defiende que la evaluación formativa mejora el aprendizaje. Primero, porque ofrece retroalimentación oportuna. Segundo, porque permite ajustar la enseñanza. Sin embargo, algunos señalan su costo en tiempo; a ello se responde que...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de la argumentación académica.",
       items:[
         "Introducción con la tesis.",
         "Argumentos con evidencia.",
         "Refutación de contraargumentos.",
         "Conclusión que retoma la tesis."
       ],
       retro:"La argumentación académica sigue la estructura: tesis → argumentos → refutación → conclusión. Cada paso es necesario."}},

    {id:"p60", nombre:"Coherencia global del texto",
     concepto:"La coherencia es la unidad de sentido del texto: todas sus partes contribuyen al mismo propósito, sin contradicciones, con progresión temática. Es un principio esencial del texto académico.",
     ejemplo:"Un ensayo sobre evaluación formativa que dedica la mitad del texto a la evaluación sumativa sin justificación pierde coherencia global.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué problema afecta a la COHERENCIA global, no a la cohesión?",
       opciones:["Falta un conector entre dos oraciones","Un párrafo se contradice con el anterior","Hay una falta de ortografía","Una oración es demasiado larga"],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. Una contradicción es un fallo de coherencia."}}
  ]
},

/* ============ BLOQUE 7 · GÉNEROS DE LA ESCRITURA PEDAGÓGICA ============ */
{
  id:"b7", nombre:"Géneros de la escritura pedagógica", emoji:"📄",
  desc:"Planeación, diario, informe, ensayo, reseña y otros géneros del docente.",
  tecnicas:[
    {id:"p61", nombre:"Planeación de clase",
     concepto:"La planeación de clase describe qué se enseñará, cómo, con qué recursos y cómo se evaluará. Incluye: objetivos, contenidos, actividades, recursos, evaluación y tiempos. Debe ser clara y ejecutable.",
     ejemplo:"«Área: Lenguaje. Grado: 7.º. Objetivo: identificar la idea principal de un texto. Actividades: lectura guiada, trabajo en parejas, socialización. Recursos: texto impreso, marcadores. Evaluación: rúbrica de comprensión».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una planeación de clase.",
       items:[
         "Área, grado y objetivo de aprendizaje.",
         "Contenidos y saberes previos.",
         "Actividades (inicio, desarrollo, cierre).",
         "Recursos y materiales.",
         "Evaluación y criterios."
       ],
       retro:"La planeación de clase describe qué, cómo, con qué y cómo se evaluará. Debe ser clara y ejecutable por cualquier docente."}},

    {id:"p62", nombre:"Diario pedagógico",
     concepto:"El diario pedagógico es un texto reflexivo en el que el docente registra lo que ocurrió en la clase, sus reacciones, sus dudas y sus aprendizajes profesionales. Es un instrumento de formación y de investigación.",
     ejemplo:"«15 de julio. Hoy intenté una actividad grupal que no funcionó como esperaba: los grupos se dispersaron. Creo que el problema fue que las instrucciones no eran claras. Mañana lo intentaré de nuevo con consignas escritas».",
     ejercicio:{tipo:"open",
       consigna:"Escribe una entrada breve de diario pedagógico (5-6 líneas) sobre una clase que hayas observado o imaginado.",
       criterios:[
         "Registré lo que ocurrió en la clase.",
         "Incluí alguna reflexión o pregunta sobre mi práctica.",
         "Usé un tono personal y honesto, no solo descriptivo."
       ],
       modelo:"Hoy, en la clase de ciencias, la maestra usó un experimento con agua y colorantes. Los estudiantes estaban muy atentos, incluso los que suelen distraerse. Me sorprendió que una actividad tan simple captara la atención de todos. Creo que funcionó porque vieron algo concreto, que podían observar con sus propios ojos. Me pregunto: ¿por qué no uso más experimentos? Quizá por miedo a que salgan mal. Mañana voy a intentar uno sencillo, con materiales del aula."}},

    {id:"p63", nombre:"Informe de práctica",
     concepto:"El informe de práctica documenta la experiencia del practicante en la institución educativa: contextualización, descripción de la práctica, análisis reflexivo, conclusiones y anexos. Es un requisito en las escuelas normales y licenciaturas.",
     ejemplo:"«Informe de práctica pedagógica. Contexto: Institución Educativa X, grado 6.º. Descripción: se acompañó al docente titular en 8 sesiones. Análisis: los estudiantes participan más cuando trabajan en grupos pequeños. Conclusión: la disposición del aula influye en la participación».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del informe de práctica.",
       items:[
         "Contextualización de la institución.",
         "Descripción de la práctica realizada.",
         "Análisis reflexivo de la experiencia.",
         "Conclusiones y aprendizajes.",
         "Anexos y evidencias."
       ],
       retro:"El informe de práctica documenta y analiza la experiencia del practicante. Debe combinar descripción y reflexión."}},

    {id:"p64", nombre:"Ensayo pedagógico",
     concepto:"El ensayo pedagógico defiende una tesis sobre educación con argumentos, evidencia y referencias. Admite voz personal pero exige rigor académico. Es un género central en licenciaturas.",
     ejemplo:"«¿Debe evaluarse la creatividad en la escuela? Este ensayo defiende que sí, siempre que se use una evaluación formativa. Se apoyará en las propuestas de Gardner y en experiencias documentadas…».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del ensayo pedagógico.",
       texto:"El ensayo pedagógico tiene una ___ con tesis, un ___ con argumentos, y una ___ que retoma la tesis.",
       respuestas:[["introduccion","introducción"],["desarrollo","cuerpo"],["conclusion","conclusión"]],
       retro:"El ensayo pedagógico combina la argumentación académica con la reflexión profesional. Exige rigor y voz propia."}},

    {id:"p65", nombre:"Reseña pedagógica",
     concepto:"La reseña valora críticamente un libro, un artículo o una experiencia educativa. Resume, contextualiza, analiza los puntos fuertes y débiles, y lo sitúa en el campo pedagógico.",
     ejemplo:"«El libro X ofrece una síntesis actualizada de la evaluación formativa, aunque omite las críticas desde la sociología. Su principal aporte es…».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las partes de la reseña.",
       texto:"La reseña pedagógica resume el ___ y lo ___ en el campo. Analiza los puntos ___ y ___ y termina con una ___ razonada.",
       respuestas:[["contenido","texto","libro","trabajo"],["contextualiza","sitúa","situa"],["fuertes","positivos","fortalezas"],["debiles","débiles","negativos","debilidades"],["valoracion","valoración","recomendacion","recomendación","opinion","opinión"]],
       retro:"La reseña combina síntesis y valoración. No basta con resumir: hay que aportar un juicio razonado."}},

    {id:"p66", nombre:"Sistematización de experiencias",
     concepto:"La sistematización es un proceso de reflexión sobre la propia práctica educativa para producir conocimiento. Implica: describir la experiencia, analizarla, interpretarla y comunicarla. Es un género propio del docente investigador.",
     ejemplo:"«Sistematización de una experiencia de lectura en voz alta en grado 4.º: durante 6 meses se documentó el proceso, se registraron avances y se analizaron los factores que los hicieron posibles».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las fases de la sistematización.",
       items:[
         "Descripción de la experiencia (qué se hizo, cuándo, cómo).",
         "Análisis de los registros y evidencias.",
         "Interpretación: qué significó la experiencia.",
         "Comunicación: escritura y socialización."
       ],
       retro:"La sistematización produce conocimiento desde la práctica. Es un género propio del docente investigador."}},

    {id:"p67", nombre:"Proyecto de aula",
     concepto:"El proyecto de aula es una propuesta pedagógica que articula contenidos, actividades y evaluación alrededor de un tema o problema significativo. Tiene objetivos, metodología, cronograma y evaluación.",
     ejemplo:"«Proyecto de aula: “El agua en mi barrio”. Área: Ciencias Naturales. Objetivo: comprender el ciclo del agua y su relación con la comunidad. Actividades: salida de campo, entrevistas, cartografía social, informe final».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del proyecto de aula.",
       items:[
         "Título y justificación.",
         "Objetivos y pregunta orientadora.",
         "Actividades y cronograma.",
         "Recursos y responsables.",
         "Evaluación y productos finales."
       ],
       retro:"El proyecto de aula integra contenidos, actividades y evaluación. Debe partir de un problema significativo para los estudiantes."}},

    {id:"p68", nombre:"Observador del estudiante",
     concepto:"El observador es un registro institucional de la vida escolar del estudiante: comportamientos, logros, dificultades, observaciones y compromisos. Es un documento formal con valor institucional.",
     ejemplo:"«15 de julio: el estudiante llegó tarde por tercera vez en el mes. Se conversó con él y con su familia. Se acordó un compromiso de puntualidad firmado por todos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada anotación según corresponda al observador.",
       categorias:["Anotación apropiada","Anotación inapropiada"],
       items:[
         {texto:"«El estudiante participó activamente en el proyecto.»", cat:0},
         {texto:"«El estudiante es un problema.»", cat:1},
         {texto:"«Se acordó compromiso de puntualidad con la familia.»", cat:0},
         {texto:"«El estudiante es incapaz de aprender.»", cat:1},
         {texto:"«El estudiante mejoró en la entrega de tareas.»", cat:0}
       ],
       retro:"El observador registra hechos y compromisos. No califica al estudiante como persona ni usa etiquetas estigmatizantes."}},

    {id:"p69", nombre:"Acta de reunión",
     concepto:"El acta registra lo ocurrido en una reunión: lugar, fecha, asistentes, temas tratados, decisiones y compromisos. Es un documento formal que da fe de lo acordado.",
     ejemplo:"«Acta 05. Consejo Académico. Fecha: 15 de julio de 2024. Asistentes: rector, coordinadores, docentes. Temas: ajuste al cronograma. Decisiones: se aprueba el ajuste. Compromisos: los coordinadores informarán a los docentes».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un acta.",
       items:[
         "Encabezado: número, fecha y hora.",
         "Asistentes.",
         "Temas tratados.",
         "Decisiones y compromisos.",
         "Firmas."
       ],
       retro:"El acta registra lugar, fecha, asistentes, temas, decisiones y compromisos. Las firmas dan fe de lo acordado."}},

    {id:"p70", nombre:"Ponencia y comunicación en eventos",
     concepto:"La ponencia es un texto que se presenta oralmente en un evento académico. Combina escritura y oralidad: tiene introducción, desarrollo con argumentos y conclusión, y se apoya en diapositivas claras.",
     ejemplo:"«Ponencia: “La evaluación formativa en aulas rurales: una experiencia”. Presenta el contexto, describe la experiencia, expone resultados y conclusiones».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una ponencia.",
       items:[
         "Presentación del tema y del ponente.",
         "Contexto y problema abordado.",
         "Desarrollo con argumentos y evidencia.",
         "Resultados y conclusiones.",
         "Turno de preguntas."
       ],
       retro:"La ponencia combina escritura y oralidad. Debe ser clara, concisa y con apoyo visual adecuado."}}
  ]
},

/* ============ BLOQUE 8 · ESCRITURA REFLEXIVA Y METACOGNICIÓN ============ */
{
  id:"b8", nombre:"Escritura reflexiva y metacognición docente", emoji:"🪞",
  desc:"Reflexión sobre la práctica, autorreflexión, portafolio y aprendizaje profesional.",
  tecnicas:[
    {id:"p71", nombre:"Reflexión sobre la práctica",
     concepto:"Reflexionar sobre la práctica es pensar lo que se hizo, por qué se hizo y qué se aprendería para la próxima vez. Es un proceso central en la formación docente. Se escribe en primera persona y con honestidad.",
     ejemplo:"«Hoy me di cuenta de que cuando doy instrucciones muy largas, los estudiantes se pierden. La próxima vez voy a escribir las consignas en el tablero y a pedir que un estudiante las repita con sus palabras».",
     ejercicio:{tipo:"open",
       consigna:"Escribe una reflexión breve sobre una clase que recuerdes (como estudiante o como practicante).",
       criterios:[
         "Describí lo que ocurrió en la clase.",
         "Reflexioné sobre por qué ocurrió.",
         "Formulé una pregunta o un propósito para la próxima vez."
       ],
       modelo:"Recuerdo una clase de matemáticas en la que el profesor explicó la factorización durante 40 minutos seguidos, sin parar. Al final, casi nadie entendió. Reflexionando, creo que el problema fue el ritmo: no hubo pausas para procesar, ni ejemplos en los que pudiéramos participar. Me pregunto cómo habría sido si nos hubiera pedido resolver un ejercicio a la mitad de la explicación. Cuando sea docente, voy a intercalar siempre momentos de práctica."}},

    {id:"p72", nombre:"Metacognición docente",
     concepto:"La metacognición es pensar sobre el propio pensamiento. En la docencia implica preguntarse: ¿cómo enseño?, ¿cómo aprendo yo?, ¿qué estrategias uso?, ¿qué me cuesta más? Es la base del desarrollo profesional.",
     ejemplo:"«Me he dado cuenta de que aprendo mejor cuando escribo, pero enseño casi siempre hablando. Debería incorporar la escritura como estrategia de aprendizaje en mis clases».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las preguntas metacognitivas del docente.",
       texto:"¿Cómo ___? · ¿Cómo ___ yo? · ¿Qué ___ uso? · ¿Qué me ___ más?",
       respuestas:[["enseno","enseño"],["aprendo"],["estrategias"],["cuesta","cuesta mas","cuesta más"]],
       retro:"La metacognición docente es pensar la propia práctica y el propio aprendizaje. Es la base del desarrollo profesional."}},

    {id:"p73", nombre:"Portafolio docente",
     concepto:"El portafolio docente reúne evidencias del trabajo profesional: planeaciones, reflexiones, producciones de estudiantes, evaluaciones, aprendizajes. No es un archivo: es una narración del propio desarrollo.",
     ejemplo:"Un portafolio puede mostrar: planeación del período 1, reflexión del período 1, evidencia de producciones de estudiantes, ajustes para el período 2, y así sucesivamente.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de un portafolio docente.",
       items:[
         "Presentación y propósito del portafolio.",
         "Evidencias del trabajo (planeaciones, producciones).",
         "Reflexiones sobre cada evidencia.",
         "Análisis de los aprendizajes profesionales.",
         "Proyección: próximos pasos."
       ],
       retro:"El portafolio no es un archivo: es una narración del desarrollo profesional. Las reflexiones son tan importantes como las evidencias."}},

    {id:"p74", nombre:"Autorreflexión honesta",
     concepto:"La autorreflexión honesta reconoce los aciertos y las dificultades. No se trata de autoflagelarse ni de autoelogiarse: se trata de mirar con cuidado. La honestidad es lo que hace productiva la reflexión.",
     ejemplo:"«Hoy me frustré y levanté la voz. No me gustó cómo me sentí después. Creo que el problema fue que no había planeado bien la transición entre actividades».",
     ejercicio:{tipo:"open",
       consigna:"Escribe una autorreflexión honesta sobre una situación que te haya costado como estudiante o practicante.",
       criterios:[
         "Reconocí una dificultad concreta sin juzgarme con dureza.",
         "Exploré las posibles causas.",
         "Formulé un aprendizaje o un propósito."
       ],
       modelo:"Cuando hice mi primera exposición en clase, me puse muy nervioso y no pude mirar al público. Después me sentí mal. Creo que el problema fue que había memorizado el texto palabra por palabra, sin comprenderlo del todo. Ahora pienso que si hubiera estudiado con mis propias palabras, habría podido explicar sin depender de la memoria. Aprendí que estudiar no es memorizar: es entender."}},

    {id:"p75", nombre:"Diálogo con la teoría",
     concepto:"Escribir la práctica a la luz de la teoría es una estrategia formativa. Se contrasta lo vivido con lo que dicen los autores. Así la teoría ilumina la práctica y la práctica cuestiona la teoría.",
     ejemplo:"«Hoy trabajé con grupos cooperativos. Revisando a Johnson y Johnson, veo que mi error fue no asignar roles. La teoría propone roles claros para que la cooperación funcione».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el diálogo teoría-práctica.",
       texto:"«Hoy trabajé con ___. Revisando a ___ , veo que mi error fue ___.» (grupos cooperativos; Johnson y Johnson)",
       respuestas:[["grupos cooperativos","grupos","trabajo grupal","aprendizaje cooperativo"],["johnson","Johnson","johnson y johnson"],["no asignar roles","no asignar roles claros","no definir roles","no distribuir roles"]],
       retro:"El diálogo con la teoría convierte la práctica en conocimiento. Es una estrategia formativa propia de la licenciatura."}},

    {id:"p76", nombre:"Narrativa pedagógica",
     concepto:"La narrativa pedagógica cuenta la experiencia educativa como un relato. Combina descripción, personajes, conflicto y reflexión. Es un género que reconoce el valor del saber de la experiencia.",
     ejemplo:"«Aquella mañana, Miguel entró al aula con un libro bajo el brazo. Nunca antes había traído uno. Se sentó en silencio y empezó a leer. Cuando le pregunté qué leía, me dijo: “Es sobre dragones”. Desde ese día, Miguel se convirtió en lector».",
     ejercicio:{tipo:"open",
       consigna:"Escribe una narrativa pedagógica breve (5-6 líneas) sobre un momento significativo de aprendizaje.",
       criterios:[
         "Conté una escena concreta con personajes y contexto.",
         "Incluí un momento de cambio o descubrimiento.",
         "Cerré con una reflexión sobre lo que la escena enseña."
       ],
       modelo:"En la primera clase, Laura se sentó al fondo y no habló. Pasaron tres semanas sin que participara. Un día, al trabajar con una historieta, levantó la mano y dijo: “Yo también dibujo”. Le pedí que mostrara su cuaderno. Estaba lleno de viñetas. Desde entonces, Laura se convirtió en la narradora del grupo. Aquel día entendí que el silencio no siempre es ausencia: a veces es una espera de la puerta adecuada."}},

    {id:"p77", nombre:"Pregunta problematizadora",
     concepto:"La pregunta problematizadora orienta la reflexión sobre la práctica: no es una pregunta de examen, es una pregunta que abre un campo de indagación. Se formula en primera persona y sobre la propia práctica.",
     ejemplo:"«¿Por qué los estudiantes se dispersan cuando propongo tareas escritas largas?» Es una pregunta problematizadora que puede orientar toda una sistematización.",
     ejercicio:{tipo:"fill",
       consigna:"Reformula como pregunta problematizadora.",
       texto:"«Mis estudiantes no participan» → «¿Por qué mis estudiantes no ___ en clase?»",
       respuestas:[["participan"]],
       retro:"La pregunta problematizadora abre un campo de indagación. Se formula en primera persona y sobre la propia práctica."}},

    {id:"p78", nombre:"Análisis de incidentes críticos",
     concepto:"Un incidente crítico es un episodio que sorprende, incomoda o transforma la comprensión. Analizarlo consiste en describirlo, explorar sus causas y extraer aprendizajes profesionales.",
     ejemplo:"«Un estudiante me respondió con ironía cuando le pedí que se callara. Al principio me enfadé. Luego comprendí que mi tono había sido autoritario. Aprendí que el modo de pedir algo importa tanto como lo que se pide».",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos del análisis de un incidente crítico.",
       items:[
         "Descripción objetiva del incidente.",
         "Exploración de las causas y del contexto.",
         "Análisis de mis reacciones y decisiones.",
         "Identificación de aprendizajes profesionales.",
         "Formulación de un propósito de cambio."
       ],
       retro:"El análisis de incidentes críticos convierte la sorpresa en aprendizaje. Es una herramienta poderosa de formación docente."}},

    {id:"p79", nombre:"Escritura como cuidado de sí",
     concepto:"Escribir sobre la práctica también es cuidarse: poner en palabras las dificultades ayuda a elaborarlas, a no cargarlas solas, a comprender que los problemas profesionales son compartidos.",
     ejemplo:"Un docente que escribe su diario descubre que sus dificultades no son únicas: son parte del oficio. Esto alivia y abre caminos.",
     ejercicio:{tipo:"open",
       consigna:"¿Cómo puede la escritura ayudarte a cuidar de ti mismo como docente? Responde en 3-4 líneas.",
       criterios:[
         "Expliqué al menos una manera en que la escritura cuida.",
         "Relacioné la escritura con la vida emocional del docente.",
         "Mencioné algún género o práctica concreta."
       ],
       modelo:"Escribir me ayuda a no cargar sola lo que me pasa en clase. Cuando pongo por escrito una dificultad, deja de ser un peso difuso y se vuelve algo concreto, que puedo mirar y pensar. También me permite recordar los momentos buenos, que se olvidan rápido. El diario docente es una forma de acompañarme a mí misma en el oficio."}},

    {id:"p80", nombre:"Socialización de la reflexión",
     concepto:"Compartir la reflexión con otros docentes multiplica su valor. La socialización puede ser oral (encuentros, seminarios) o escrita (publicaciones, blogs, artículos). Convierte la experiencia individual en conocimiento colectivo.",
     ejemplo:"Un grupo de docentes se reúne cada mes a leer sus diarios pedagógicos y comentarse. La reflexión individual se vuelve diálogo profesional.",
     ejercicio:{tipo:"open",
       consigna:"¿Por qué es valioso socializar la reflexión pedagógica? Responde en 3-4 líneas.",
       criterios:[
         "Expliqué al menos un beneficio de socializar la reflexión.",
         "Consideré la dimensión colectiva del saber docente.",
         "Mencioné algún formato o espacio de socialización."
       ],

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_pedagogico_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo pedagógico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno pedagógico <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, ejemplos, redacciones propias, reflexiones sobre tu práctica…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =====================================================================
   EJERCICIOS
   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
