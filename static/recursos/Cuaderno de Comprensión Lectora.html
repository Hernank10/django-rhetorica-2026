<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Comprensión Lectora · Lengua Castellana</title>
<style>
  :root{
    --bg:#efe9dd;
    --paper:#fdfbf6;
    --paper-2:#fffdf8;
    --ink:#26221d;
    --muted:#7a7266;
    --line:#e3dbcb;
    --line-2:#d8cdb8;
    --accent:#b45309;
    --accent-soft:#fdf0e0;
    --blue:#1e3a5f;
    --ok:#15803d;
    --ok-soft:#e8f5ec;
    --bad:#b91c1c;
    --bad-soft:#fdeaea;
    --radius:16px;
    --shadow:0 2px 4px rgba(60,45,20,.05), 0 10px 28px rgba(60,45,20,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    background:
      radial-gradient(circle at 20% 0%, #f6f1e6 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(253,251,246,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:24px; line-height:1;
    background:var(--accent-soft);
    border:1px solid #f0d9bd;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    flex:0 0 auto;
  }
  .brand h1{
    font-size:17px; margin:0; letter-spacing:.2px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-family:system-ui,sans-serif; font-size:12px; color:var(--muted);}
  .progress-bar{width:120px; height:7px; border-radius:99px; background:#e7dfd0; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#d97706,#15803d); transition:width .4s ease;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:600;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:var(--paper-2); color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#f4eee2; border-color:#c9bda4;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#96450a;}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1380px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%;
    font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#faf6ee; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px 10px; border-radius:10px;
    font-size:14px; font-weight:700; color:var(--ink);
  }
  .cat-head:hover{background:#f6f1e6;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:700;
    background:#efe7d7; color:var(--muted); padding:2px 7px; border-radius:99px;
  }
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{
    font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted);
    padding:0 10px 8px 10px; line-height:1.45;
  }
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:13.3px; line-height:1.35; color:#3d372e;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#f6f1e6;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:#7c3a06; font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--accent),#e8b06a);
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block;
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.8px; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft);
    border:1px solid #f0d9bd; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{
    margin:0; font-size:26px; line-height:1.22; letter-spacing:-.3px;
  }
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px;}

  /* ---------- FLASHCARD ---------- */
  .flashcard{perspective:1600px; margin:20px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(270px, 34vh, 330px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px;
    padding:24px 26px;
    display:flex; flex-direction:column;
    overflow:auto;
  }
  .fc-front{
    background:
      repeating-linear-gradient(transparent 0 27px, rgba(30,58,95,.09) 27px 28px),
      #fffdf7;
    border:1px solid var(--line-2);
    box-shadow:inset 22px 0 0 -21px #e8a3a3;
  }
  .fc-back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(transparent 0 27px, rgba(30,58,95,.09) 27px 28px),
      #fff8ec;
    border:1px solid #f0d9bd;
    box-shadow:inset 22px 0 0 -21px #e8a3a3;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent);}
  .fc-face p{
    margin:0; font-size:16.5px; line-height:28px; color:#2e2a24;
  }
  .fc-back p{font-style:italic; color:#5a4a33;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#a89c88;
  }
  .flip-btn{margin-bottom:26px;}

  /* ---------- SECCIONES ---------- */
  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:700; letter-spacing:.2px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-family:system-ui,sans-serif; font-size:12px; font-weight:500; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#3a342c;
    background:#f7f3ea; border-left:3px solid #d8cdb8;
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  /* quiz */
  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:var(--paper-2); border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#fffaf2; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.85;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#efe7d7; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  /* fill */
  .fill-texto{
    font-size:16px; line-height:2.2; margin:0 0 16px; color:#2e2a24;
  }
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--accent);
    background:#fffaf2; color:#7c3a06; font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fff3e0; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  /* order */
  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
    letter-spacing:.9px; text-transform:uppercase; color:var(--muted);
    margin:0 0 9px;
  }
  .pool, .seq{
    min-height:120px; border-radius:12px; padding:9px;
    display:flex; flex-direction:column; gap:8px;
  }
  .pool{background:#f4f0e6; border:1.5px dashed var(--line-2);}
  .seq{background:#fff8ec; border:1.5px solid #f0d9bd;}
  .pool:empty::after, .seq:empty::after{
    content:"…"; color:#c3b9a4; font-size:20px; text-align:center; margin:auto;
  }
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:var(--paper-2); border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#fffaf2;}
  .seq .ord-item{background:#fff; border-color:#e8cfae;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* classify */
  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:var(--paper-2); border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#f7f3ea; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent);}
  .chip.sel{background:var(--blue); border-color:var(--blue); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  /* open */
  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{
    display:flex; gap:10px; align-items:flex-start;
    font-family:system-ui,sans-serif; font-size:13px; color:#4a4438; line-height:1.5;
  }
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:28px;
    color:#2e2a24; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf7;
    background-image:repeating-linear-gradient(transparent 0 27px, #e6dfd0 27px 28px);
    background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(180,83,9,.1);}
  textarea::placeholder{color:#b5aa96; font-style:italic;}

  /* feedback */
  .feedback{
    margin-top:16px; border-radius:12px; padding:0; overflow:hidden;
    max-height:0; opacity:0; transition:.3s;
  }
  .feedback.show{max-height:400px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #b9e0c6; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #f2c2c2; color:#7f1d1d;}
  .feedback.info{background:#eef3fa; border:1px solid #c8d8ee; color:#1e3a5f;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  /* modelo */
  .modelo{
    display:none; margin-top:14px;
    background:#f7f3ea; border-left:3px solid var(--blue);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#33445c;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--blue); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  /* cuaderno */
  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{
    display:flex; justify-content:space-between; align-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted);
    margin-top:8px;
  }
  #notaStatus{color:var(--ok); font-weight:600; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  /* nav inferior */
  .nav-foot{
    display:flex; justify-content:space-between; gap:12px;
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
  }
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{
      position:fixed; inset:0; background:rgba(30,25,15,.4);
      z-index:99; opacity:0; pointer-events:none; transition:.25s;
    }
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:22px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">📖</div>
    <div>
      <h1>Cuaderno de Comprensión Lectora</h1>
      <p>Lengua Castellana · flashcards y ejercicios interactivos</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Temario</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 48</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>

<div id="scrim" class="scrim"></div>

<script>
/* =========================================================================
   DATOS: 6 CATEGORÍAS · 48 TÉCNICAS
   ========================================================================= */
const CATEGORIAS = [

/* ---------------- 1. ANTES DE LA LECTURA ---------------- */
{
  id:"antes", nombre:"Antes de la lectura", emoji:"🔍",
  desc:"Preparar el terreno: activar saberes, predecir y planificar.",
  tecnicas:[
    {
      id:"a1", nombre:"Predicción a partir del título",
      concepto:"Consiste en anticipar el contenido del texto usando el título, los subtítulos y las imágenes. Activa tus conocimientos previos y crea un gancho mental: cuando el cerebro ya espera algo, reconoce la información con más facilidad y la retiene mejor.",
      ejemplo:"Título: «El naufragio del velero Aurora». Antes de leer predices: será un texto narrativo, habrá una tormenta, al menos un superviviente, un rescate y un conflicto humano. Al leer, confirmas, ajustas o descartas cada hipótesis.",
      ejercicio:{
        tipo:"quiz",
        consigna:"Ante el título «Crónica de una sequía anunciada», ¿cuál es la predicción más completa y fundamentada?",
        opciones:[
          "Será un texto narrativo o periodístico sobre una sequía; el título evoca a García Márquez y sugiere que el desastre era previsible.",
          "Será un poema de amor con rima consonante y versos alejandrinos.",
          "Será un manual técnico para instalar sistemas de riego.",
          "No se puede predecir absolutamente nada sin leer el texto completo."
        ],
        correcta:0,
        retro:"Predecir no es adivinar: es usar todas las pistas del título —género, palabras clave, referencias culturales— para construir una hipótesis que luego verificarás durante la lectura."
      }
    },
    {
      id:"a2", nombre:"Lluvia de ideas sobre el tema",
      concepto:"Antes de abrir el texto, escribe durante dos minutos todo lo que ya sabes del tema, sin filtro ni orden. Esas ideas funcionan como anclajes: la información nueva se adhiere a lo que ya existe en tu memoria y se comprende mucho mejor.",
      ejemplo:"Tema: «Los volcanes». Lluvia de ideas: magma, lava, erupción, placas tectónicas, cráter, ceniza, Pompeya, Vesubio, sismógrafo, anillo de fuego, géiser.",
      ejercicio:{
        tipo:"open",
        consigna:"Haz una lluvia de ideas con al menos 8 conceptos sobre el tema «La lectura digital». Escríbelos sin ordenar y sin corregirte.",
        criterios:[
          "Escribí al menos 8 ideas o palabras relacionadas con el tema.",
          "No me detuve a ordenar ni a corregir: dejé fluir las asociaciones.",
          "Incluí tanto ideas generales como ejemplos concretos."
        ],
        modelo:"Posibles asociaciones: pantalla, hipertexto, distracción, enlaces, subrayado digital, fatiga visual, velocidad, multitarea, pdf, audiolibros, comprensión superficial, memoria, marcadores, resaltado, redes sociales, atención fragmentada."
      }
    },
    {
      id:"a3", nombre:"Formular preguntas propias",
      concepto:"Convierte títulos y subtítulos en preguntas antes de leer. Así la lectura deja de ser pasiva y se transforma en una búsqueda activa de respuestas: tu atención se dirige a lo que realmente necesitas saber.",
      ejemplo:"Subtítulo «Causas de la contaminación del agua» → Preguntas: ¿Cuáles son las causas principales? ¿Quién las provoca? ¿Afectan por igual a todos los países? ¿Qué soluciones se proponen?",
      ejercicio:{
        tipo:"open",
        consigna:"Convierte este subtítulo en tres preguntas guía: «Consecuencias del uso de pantallas en adolescentes».",

/* =========================================================================
   ESTADO Y UTILIDADES
   ========================================================================= */
const STORAGE_KEY = "cuaderno_comprension_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){}
}
function getProg(id){
  if(!progreso[id]) progreso[id] = {ok:false, nota:""};
  return progreso[id];
}
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¡!¿?.,;:"']/g,"").replace(/\s+/g," ");
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =========================================================================
   MENÚ LATERAL
   ========================================================================= */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const body = el("div","cat-body");
    const desc = el("div","cat-desc", cat.desc);
    body.appendChild(desc);

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });

    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =========================================================================
   RENDER DEL PANEL
   ========================================================================= */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  /* --- cabecera --- */
  const head = el("div","tech-head");
  const badge = el("span","badge", t.catEmoji + " " + t.catNombre);
  head.appendChild(badge);
  head.appendChild(el("h2", null, t.nombre));
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length));
  panel.appendChild(head);

  /* --- flashcard --- */
  const fc = el("div","flashcard");
  fc.id = "flashcard";
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo práctico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front);
  inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  /* --- ejercicio --- */
  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  body.id = "ej-body";
  sec.appendChild(body);

  const fb = el("div","feedback");
  fb.id = "ej-feedback";
  sec.appendChild(fb);

  panel.appendChild(sec);

  /* --- cuaderno --- */
  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.id = "nota";
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, dudas, ejemplos propios o el resultado de la técnica…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  info.id = "notaInfo";
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info);
  foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  /* --- navegación --- */
  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  /* --- eventos --- */
  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  /* --- render del ejercicio --- */
  renderEjercicio(t.ejercicio, body, fb, t.id);

  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

/* =========================================================================
   MOTOR DE EJERCICIOS
   ========================================================================= */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";

  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}

function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  const t = el("strong", null, titulo);
  const p = el("p", null, texto);
  fb.appendChild(t); fb.appendChild(p);
}

/* ---------- QUIZ ---------- */
function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;

  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal",
        ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta",
        ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

/* ---------- FILL ---------- */
function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];

  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "hueco";
      inp.setAttribute("autocomplete","off");
      inp.setAttribute("aria-label","respuesta " + (i+1));
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp);
      inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    const vacios = inputs.some(i => !i.value.trim());
    if(vacios){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      (ej.retro || "") + (perfecto ? "" : " Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

/* ---------- ORDER ---------- */
function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);

  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);

  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;

  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a la columna «Tu secuencia» antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? (ej.retro || "") : "El orden correcto empieza por: «" + correcto[0].slice(0,70) + "…». " + (ej.retro || ""));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

/* ---------- CLASSIFY ---------- */
function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);

  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip";
      c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    const filas = cont.querySelectorAll(".cl-item");
    filas.forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-family:system-ui,sans-serif;font-size:12px;color:#b91c1c;font-weight:600;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

/* ---------- OPEN ---------- */
function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios");
  ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id;
    lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo. El valor está en tu propio esfuerzo previo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total + " criterios",
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú que el modelo no dice?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    if(ta.value.trim().length >= 25) marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

/* ---------- helpers de acción ---------- */
function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =========================================================================
   PROGRESO
   ========================================================================= */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true;
    guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =========================================================================
   SIDEBAR MÓVIL + BÚSQUEDA + RESET
   ========================================================================= */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }

document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {};
    guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =========================================================================
   ARRANQUE
   ========================================================================= */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
</body>
</html>
