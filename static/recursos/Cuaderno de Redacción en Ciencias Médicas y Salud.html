<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción Médica y en Salud · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e6eef4;
    --paper:#fbfdff;
    --paper-2:#f3f8fb;
    --ink:#0d1f2d;
    --muted:#5c7286;
    --line:#cddbe5;
    --line-2:#b0c4d3;
    --accent:#0369a1;
    --accent-dark:#075985;
    --accent-soft:#dbeafe;
    --green:#047857;
    --green-dark:#065f46;
    --green-soft:#d1fae5;
    --red:#dc2626;
    --red-dark:#991b1b;
    --red-soft:#fee2e2;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(10,40,60,.06), 0 12px 30px rgba(10,40,60,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #f5f9fc 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(251,253,255,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:linear-gradient(135deg,#0369a1 0%,#047857 100%);
    color:#fff;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    flex:0 0 auto;
    position:relative;
  }
  .logo::after{
    content:"+";
    position:absolute;
    top:-4px; right:-4px;
    background:var(--red);
    color:#fff;
    font-size:12px; font-weight:900;
    width:16px; height:16px;
    border-radius:50%;
    display:grid; place-items:center;
    line-height:1;
  }
  .brand h1{font-size:15.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d5e0e8; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#0369a1,#047857); transition:width .4s;}

  .btn{
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eef5f9; border-color:#8ba5b8;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:inherit; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f3f8fb; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
  }
  .cat-head:hover{background:#eef5f9;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-size:10.5px; font-weight:800;
    background:var(--red-soft); color:var(--red-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dce6ed; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#2a3c4a;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
  }
  .tech-link:hover{background:#eef5f9;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--green); border-color:var(--green); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--green),var(--red));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #93c5fd; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--green); border-color:var(--green);}
  .bdot.current{box-shadow:0 0 0 3px rgba(3,105,161,.22); border-color:var(--accent);}

  /* flashcard · papel de historia clínica */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fbfdff;
    background-image:
      linear-gradient(rgba(3,105,161,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(3,105,161,.10) 1px, transparent 1px);
    background-size:22px 22px;
    box-shadow:inset 22px 0 0 -21px #f59e8e;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #93c5fd;
    background-color:#f3faff;
    box-shadow:inset 22px 0 0 -21px #6ee7b7;
  }
  .fc-tag{
    font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--green-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:24px; color:#13293a; background:rgba(251,253,255,.9); padding:7px 10px; border-radius:6px; border-left:3px solid var(--accent);}
  .fc-back p{color:#075e54; background:rgba(243,250,255,.94); border-left-color:var(--green);}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-size:11.5px; color:#8298a8; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#26404f;
    background:#f3f8fb; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f3faff; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dce6ed; color:var(--muted);
    display:grid; place-items:center;
    font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#13293a;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--red);
    background:#fdf2f2; color:var(--red-dark); font-weight:700;
    padding:3px 8px; min-width:120px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fee2e2; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eef5f9; border:1.5px dashed var(--line-2);}
  .seq{background:#f3faff; border:1.5px solid #93c5fd;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b0c4d3; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f3faff;}
  .seq .ord-item{border-color:#93c5fd;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eef5f9; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#3a5465; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:25px;
    color:#13293a; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fbfdff;
    background-image:
      linear-gradient(rgba(3,105,161,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(3,105,161,.08) 1px, transparent 1px);
    background-size:22px 22px;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(3,105,161,.12);}
  textarea::placeholder{color:#8298a8; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:#fef3c7; border:1px solid #fcd34d; color:#78350f;}
  .feedback strong{display:block; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f3f8fb; border-left:3px solid var(--green);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#065f46;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--green-dark); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(10,40,60,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🩺</div>
    <div>
      <h1>Cuaderno de Redacción Médica y en Salud · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · sintaxis, puntuación, ortografía y estilo universitario</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN MÉDICA Y EN SALUD · 10 BLOQUES
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · FUNDAMENTOS ============ */
{
  id:"b1", nombre:"Fundamentos de la escritura clínica", emoji:"📋",
  desc:"Claridad, precisión, objetividad, registro y ética en la escritura médica.",
  tecnicas:[
    {id:"m1", nombre:"Claridad clínica",
     concepto:"En ciencias médicas, la claridad no es estética: es seguridad del paciente. Un texto ambiguo puede inducir a error diagnóstico o terapéutico. Se prefieren frases directas, verbos precisos y datos verificables.",
     ejemplo:"En lugar de «Se procedió a efectuar la valoración del paciente arrojando como resultado un cuadro compatible con...», se escribe: «El paciente presenta fiebre de 39 °C y tos productiva desde hace 3 días».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué la claridad es esencial en la escritura clínica?",
       opciones:["Porque lo exige el manual","Porque un texto ambiguo puede poner en riesgo la seguridad del paciente","Porque ocupa menos espacio","Porque lo piden los profesores"],
       correcta:1,
       retro:"En medicina, la claridad es seguridad. Un registro ambiguo puede inducir a error en el diagnóstico o el tratamiento."}},

    {id:"m2", nombre:"Precisión: signo, síntoma y síndrome",
     concepto:"Los términos clínicos tienen significados precisos: un signo es observable objetivamente (fiebre, ictericia); un síntoma es referido por el paciente (dolor, náusea); un síndrome es un conjunto de signos y síntomas con identidad clínica.",
     ejemplo:"«Fiebre de 38,5 °C» (signo) es distinto de «refiere sensación febril» (síntoma). El síndrome febril agrupa varios signos y síntomas.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada hallazgo según sea signo o síntoma.",
       categorias:["Signo","Síntoma"],
       items:[
         {texto:"Temperatura de 38,5 °C medida con termómetro.", cat:0},
         {texto:"Refiere dolor abdominal.", cat:1},
         {texto:"Ictericia en escleras.", cat:0},
         {texto:"Refiere náuseas.", cat:1},
         {texto:"Presión arterial 150/95 mmHg.", cat:0}
       ],
       retro:"Signo: observable. Síntoma: referido por el paciente. Precisar cada término es esencial para no confundir el registro clínico."}},

    {id:"m3", nombre:"Objetividad clínica",
     concepto:"El registro clínico describe hechos verificables. Se evitan valoraciones subjetivas («el paciente exagera») y se prefieren descripciones observables («el paciente refiere dolor 9/10 sin signos objetivos asociados»).",
     ejemplo:"En lugar de «el paciente es quejumbroso», se escribe: «el paciente refiere dolor persistente 8/10 en escala EVA, sin hallazgos objetivos que lo expliquen en la exploración actual».",
     ejercicio:{tipo:"fill",
       consigna:"Reformula objetivamente.",
       texto:"«El paciente exagera el dolor» → «El paciente refiere dolor ___/10 en escala EVA, sin ___ objetivos asociados».",
       respuestas:[["8","9","10","7","6","5"],["signos","hallazgos","signos clinicos","signos clínicos"]],
       retro:"La objetividad registra lo observable y lo referido, sin juzgar. Es una exigencia ética y legal del registro clínico."}},

    {id:"m4", nombre:"Impersonalidad en notas clínicas",
     concepto:"En notas de evolución, informes y protocolos se prefiere la impersonalidad: pasiva refleja («se administró», «se observó») o tercera persona. La primera persona se reserva para notas personales o impresiones diagnósticas explícitas.",
     ejemplo:"Nota clínica: «Se administró ceftriaxona 1 g IV». Impresión diagnóstica explícita: «Considero probable neumonía adquirida en la comunidad».",
     ejercicio:{tipo:"fill",
       consigna:"Transforma a estilo impersonal.",
       texto:"«Yo administré ceftriaxona» → «Se ___ ceftriaxona».",
       respuestas:[["administro","administró"]],
       retro:"La pasiva refleja con «se» es el recurso estándar en las notas clínicas. Mantiene el foco en la acción."}},

    {id:"m5", nombre:"Función comunicativa del informe clínico",
     concepto:"El informe clínico se escribe para que otros profesionales comprendan el caso y puedan continuar la atención. Si el texto no permite esa continuidad, no cumple su función.",
     ejemplo:"Una historia clínica debe permitir que un médico que nunca vio al paciente comprenda el cuadro, el diagnóstico y el plan. Si no lo logra, el registro es deficiente.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la función principal del informe clínico?",
       opciones:["Demostrar erudición del médico","Permitir que otros profesionales comprendan y continúen la atención","Aumentar el número de páginas","Proteger legalmente al médico únicamente"],
       correcta:1,
       retro:"El informe clínico es una herramienta de continuidad asistencial. Su valor se mide por su utilidad para el siguiente profesional."}},

    {id:"m6", nombre:"Registro académico-clínico",
     concepto:"El registro en ciencias médicas es formal, preciso y técnico. Evita coloquialismos («el paciente está malito») y expresiones vagas («más o menos estable»). Se usan términos clínicos precisos.",
     ejemplo:"En lugar de «el paciente está malito», se escribe «el paciente se encuentra en regulares condiciones generales, con TA 90/60 mmHg y FC 110 lpm».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro clínico o coloquial.",
       categorias:["Clínico","Coloquial"],
       items:[
         {texto:"«TA 90/60 mmHg, FC 110 lpm».", cat:0},
         {texto:"«El paciente está malito».", cat:1},
         {texto:"«Se encuentra en regulares condiciones generales».", cat:0},
         {texto:"«Más o menos estable».", cat:1},
         {texto:"«Afebril, eupneico, normohidratado».", cat:0}
       ],
       retro:"El registro clínico es técnico y preciso. Los coloquialismos restan rigor y pueden inducir a error."}},

    {id:"m7", nombre:"Estructura externa de la historia clínica",
     concepto:"La historia clínica tiene una estructura prefijada: datos de identificación, motivo de consulta, enfermedad actual, antecedentes, revisión por sistemas, examen físico, diagnóstico y plan. Cumplirla es una obligación legal.",
     ejemplo:"En Colombia, la Resolución 1995 de 1999 regula el diligenciamiento de la historia clínica. Su estructura es obligatoria.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la historia clínica.",
       items:[
         "Datos de identificación del paciente.",
         "Motivo de consulta y enfermedad actual.",
         "Antecedentes personales y familiares.",
         "Revisión por sistemas y examen físico.",
         "Diagnóstico, plan y firma del profesional."
       ],
       retro:"La historia clínica tiene una estructura legalmente establecida. Cumplirla garantiza la calidad del registro y la continuidad asistencial."}},

    {id:"m8", nombre:"Adecuación al destinatario",
     concepto:"El lenguaje médico varía según el destinatario: colega especialista, médico general, paciente, familia o público general. No se escribe igual una nota de remisión que un consentimiento informado.",
     ejemplo:"Nota a especialista: «Se remite por sospecha de síndrome coronario agudo». Consentimiento: «Le vamos a realizar un examen para ver si su corazón recibe suficiente sangre».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada enunciado según su destinatario.",
       categorias:["Colega especialista","Paciente o familia"],
       items:[
         {texto:"«Se remite por sospecha de SCA».", cat:0},
         {texto:"«Vamos a revisar su corazón con un examen».", cat:1},
         {texto:"«ECG con elevación del ST en cara inferior».", cat:0},
         {texto:"«Este examen no duele y dura unos 10 minutos».", cat:1},
         {texto:"«Se solicita troponina seriada y ecocardiograma».", cat:0}
       ],
       retro:"El destinatario define el registro. Con colegas se usa terminología técnica; con pacientes, lenguaje claro y accesible."}},

    {id:"m9", nombre:"Trazabilidad y registro cronológico",
     concepto:"Todo registro clínico debe indicar fecha, hora, profesional responsable y firma. La trazabilidad permite reconstruir la atención y sustenta la responsabilidad legal y ética.",
     ejemplo:"«15/07/2024, 14:30 h. Dra. Ana Ruiz, RM 12345. Se administra primera dosis de antibiótico. Paciente tolera vía oral».",
     ejercicio:{tipo:"fill",
       consigna:"Completa los datos de trazabilidad.",
       texto:"Todo registro clínico incluye: fecha, ___, profesional responsable, número de ___ y firma.",
       respuestas:[["hora"],["registro","tarjeta profesional","rm","documento"]],
       retro:"Sin trazabilidad, el registro no tiene valor legal ni permite reconstruir la atención. Es una obligación normativa."}},

    {id:"m10", nombre:"Ética de la escritura clínica",
     concepto:"Escribir en salud es un acto ético: se registran datos sensibles de personas vulnerables. El respeto, la veracidad y la confidencialidad son principios irrenunciables.",
     ejemplo:"Nunca se escribe una nota clínica con juicios despectivos o información que no aporte al cuidado. El paciente puede acceder a su historia clínica.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué la escritura clínica tiene una dimensión ética?",
       opciones:["Porque lo exige la ley","Porque se registran datos sensibles de personas y el paciente puede acceder a su historia","Porque lo piden los jefes","Porque ocupa menos espacio"],
       correcta:1,
       retro:"El registro clínico es un documento legal y ético. La veracidad, el respeto y la confidencialidad son principios irrenunciables."}}
  ]
},

/* ============ BLOQUE 2 · SINTAXIS ============ */
{
  id:"b2", nombre:"Sintaxis clínica", emoji:"🧱",
  desc:"Orden, longitud, voz, gerundios, concordancia y párrafos en el texto médico.",
  tecnicas:[
    {id:"m11", nombre:"Orden lógico: SVO",
     concepto:"El orden Sujeto + Verbo + Objeto es la base de la claridad. En notas clínicas y artículos médicos, respetarlo ayuda a la lectura rápida y evita ambigüedades.",
     ejemplo:"Orden lógico: «El paciente presentó fiebre». Orden alterado: «Fiebre, el paciente, presentó».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden lógico.",
       texto:"Palabras: «el médico / la dosis / ajustó» → «El médico ___ la dosis».",
       respuestas:[["ajusto","ajustó"]],
       retro:"El orden SVO facilita la lectura rápida. En medicina, leer rápido y bien es esencial."}},

    {id:"m12", nombre:"Oraciones cortas en la nota clínica",
     concepto:"Las oraciones de las notas clínicas deben ser cortas: 15-20 palabras. La lectura rápida en urgencias o durante la visita exige frases directas. Las oraciones largas se dividen.",
     ejemplo:"En lugar de una oración de 40 palabras describiendo el cuadro, se escribe: «Paciente de 65 años. Consulta por disnea de 2 días. Antecedente de EPOC. Afebril al ingreso».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la longitud recomendada de una oración en una nota clínica?",
       opciones:["Hasta 40 palabras","Entre 15 y 20 palabras","Al menos 30 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas son esenciales en la nota clínica. La lectura rápida exige frases directas y datos precisos."}},

    {id:"m13", nombre:"Voz activa vs. voz pasiva",
     concepto:"La voz activa identifica al agente. En la nota clínica es importante saber quién hizo qué: qué profesional, qué servicio, en qué momento. La pasiva se reserva para protocolos y descripciones impersonales.",
     ejemplo:"Activa: «El residente administró morfina 3 mg IV». Pasiva: «Se administró morfina 3 mg IV» (aceptable en nota de enfermería o protocolo).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"«La enfermera administró la dosis.»", cat:0},
         {texto:"«Se administró la dosis.»", cat:1},
         {texto:"«El cardiólogo realizó el ecocardiograma.»", cat:0},
         {texto:"«El procedimiento fue realizado por el equipo de guardia.»", cat:1},
         {texto:"«El paciente refirió mejoría.»", cat:0}
       ],
       retro:"La voz activa identifica responsabilidades. La pasiva se usa en protocolos y registros impersonales."}},

    {id:"m14", nombre:"Evitar el abuso del gerundio",
     concepto:"El gerundio de posterioridad es incorrecto. En textos clínicos se prefiere el verbo conjugado. El gerundio de simultaneidad («respirando con dificultad, refirió...») sí es válido.",
     ejemplo:"Incorrecto: «Se administró morfina, cediendo el dolor». Correcto: «Se administró morfina y el dolor cedió».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por un verbo conjugado.",
       texto:"«Se administró oxígeno, mejorando la saturación» → «Se administró oxígeno y la saturación ___».",
       respuestas:[["mejoro","mejoró","aumento","aumentó"]],
       retro:"El gerundio de posterioridad es incorrecto. Se sustituye por un verbo conjugado o una oración coordinada."}},

    {id:"m15", nombre:"Subordinación mínima en informes médicos",
     concepto:"El exceso de subordinación oscurece. En informes y notas clínicas se prefieren oraciones simples o coordinadas. Se divide cuando la frase se vuelve difícil de seguir.",
     ejemplo:"Excesivo: «El paciente que había sido intervenido el mes pasado que se realizó en el hospital que está en la zona norte...». Adecuado: «El paciente fue intervenido el mes pasado en el hospital de la zona norte».",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos más cortas.",
       texto:"«El paciente que ingresó ayer que presentó fiebre fue trasladado a UCI» → «El paciente ingresó ayer. Presentó fiebre y fue ___ a UCI».",
       respuestas:[["trasladado","llevado","remitido","enviado"]],
       retro:"La subordinación excesiva dificulta la lectura rápida. Se prefiere dividir en oraciones simples."}},

    {id:"m16", nombre:"Coordinación en antecedentes y datos clínicos",
     concepto:"La coordinación une datos paralelos: antecedentes, medicamentos, alergias. En la historia clínica se usa para enumerar sin subordinar. Es clara y verificable.",
     ejemplo:"«Antecedentes: HTA en tratamiento con losartán; DM2 en tratamiento con metformina; dislipidemia sin tratamiento actual».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su tipo de coordinación.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],
       items:[
         {texto:"y", cat:0},
         {texto:"pero", cat:1},
         {texto:"o", cat:2},
         {texto:"e", cat:0},
         {texto:"sino", cat:1}
       ],
       retro:"La coordinación copulativa suma; la adversativa opone; la disyuntiva presenta alternativas."}},

    {id:"m17", nombre:"Concordancia gramatical",
     concepto:"La concordancia exige que sujeto y verbo coincidan en número y persona. En textos clínicos extensos es frecuente el error. Revisar la concordancia es parte del rigor.",
     ejemplo:"Incorrecto: «Los hallazgos de la radiografía fue compatible con neumonía». Correcto: «Los hallazgos de la radiografía fueron compatibles con neumonía».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la concordancia.",
       texto:"«Los exámenes de laboratorio fue normal» → «Los exámenes de laboratorio ___ normales».",
       respuestas:[["fueron","fue"]],
       retro:"El sujeto plural exige verbo en plural. La concordancia es obligatoria en todo el texto médico."}},

    {id:"m18", nombre:"Evitar hipérbaton",
     concepto:"El hipérbaton innecesario dificulta la lectura. En textos clínicos se mantiene el orden lógico. La excepción son las descripciones enfáticas o los diagnósticos destacados.",
     ejemplo:"Hipérbaton: «En el hemitórax derecho, la ausencia de murmullo vesicular, se auscultó». Orden natural: «Se auscultó ausencia de murmullo vesicular en el hemitórax derecho».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden natural.",
       texto:"Palabras: «el paciente / fiebre / presentó» → «El paciente ___ fiebre».",
       respuestas:[["presento","presentó"]],
       retro:"El hipérbaton innecesario oscurece. En medicina, la claridad es seguridad."}},

    {id:"m19", nombre:"Párrafos: una idea por párrafo",
     concepto:"En la historia clínica, cada sección desarrolla un aspecto: motivo de consulta, enfermedad actual, antecedentes, examen físico. En el artículo médico, cada párrafo desarrolla una idea.",
     ejemplo:"En la enfermedad actual: un párrafo para el inicio, otro para la evolución, otro para los síntomas asociados. Cada uno con su idea central.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuántas ideas principales debe desarrollar cada párrafo en la nota clínica?",
       opciones:["Todas las relacionadas con el caso","Una sola idea principal","Al menos tres","No importa cuántas"],
       correcta:1,
       retro:"Un párrafo = una idea. En la nota clínica, cada párrafo desarrolla un aspecto: motivo, evolución, antecedentes, hallazgos."}},

    {id:"m20", nombre:"Referencias anafóricas en el caso clínico",
     concepto:"En el caso clínico circulan varios sujetos: paciente, familiares, profesionales. La ambigüedad referencial es peligrosa: puede confundir datos clínicos. Se repite el sustantivo cuando hay duda.",
     ejemplo:"Ambiguo: «El médico le informó al paciente que su tratamiento había cambiado». ¿«Su» = médico o paciente? Claro: «...que el tratamiento del paciente había cambiado».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad.",
       texto:"«La enfermera le indicó al paciente que su dosis había sido ajustada» → «La enfermera le indicó al paciente que la dosis del ___ había sido ajustada».",
       respuestas:[["paciente"]],
       retro:"Repetir el sustantivo elimina la ambigüedad. En medicina, la precisión referencial es esencial para no confundir datos."}}
  ]
},

/* ============ BLOQUE 3 · PUNTUACIÓN CLÍNICA ============ */
{
  id:"b3", nombre:"Puntuación clínica", emoji:"✒️",
  desc:"Coma, punto y coma, dos puntos, paréntesis y comillas en textos médicos.",
  tecnicas:[
    {id:"m21", nombre:"Coma en enumeraciones clínicas",
     concepto:"La coma separa elementos de una enumeración: síntomas, medicamentos, antecedentes. En la nota clínica es frecuente. El último elemento se une con «y» u «o».",
     ejemplo:"«Antecedentes: HTA, DM2, dislipidemia y tabaquismo».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca las comas donde correspondan.",
       texto:"«Presenta fiebre tos y disnea» → «Presenta fiebre___ tos___ y disnea».",
       respuestas:[[","],[","]],
       retro:"Los elementos de una enumeración se separan con coma. El último se une con «y» sin coma previa."}},

    {id:"m22", nombre:"Coma en el saludo al paciente o al colega",
     concepto:"En cartas, remisiones y consentimientos, el vocativo se separa con coma: «Estimado doctor», «Apreciado paciente», «Señor director».",
     ejemplo:"«Estimado Dr. Rodríguez, remito al paciente...». «Apreciado paciente, le informo que...».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma del vocativo.",
       texto:"«Estimado doctor___ remito al paciente Juan Pérez».",
       respuestas:[[","]],
       retro:"El vocativo se separa con coma. Es un error frecuente en remisiones y cartas médicas."}},

    {id:"m23", nombre:"Punto y coma en antecedentes complejos",
     concepto:"Cuando los antecedentes son extensos o incluyen datos entre paréntesis, se separan con punto y coma. Es frecuente en la sección de antecedentes de la historia clínica.",
     ejemplo:"«Antecedentes: HTA (2015), en tratamiento con losartán 50 mg/día; DM2 (2018), en tratamiento con metformina 850 mg/12 h; dislipidemia sin tratamiento actual».",
     ejercicio:{tipo:"fill",
       consigna:"Separa los antecedentes con punto y coma.",
       texto:"«HTA (2015) en tratamiento con losartán___ DM2 (2018) en tratamiento con metformina___ dislipidemia sin tratamiento».",
       respuestas:[[";"],[";"]],
       retro:"En antecedentes extensos, se usa punto y coma. Facilita la lectura y evita confundir los datos."}},

    {id:"m24", nombre:"Dos puntos: listas de diagnósticos y planes",
     concepto:"Los dos puntos anuncian enumeraciones, aclaraciones o listas de diagnósticos, medicamentos o plan. En la nota clínica son frecuentes antes de la sección de plan.",
     ejemplo:"«Plan: 1) hospitalizar; 2) iniciar ceftriaxona 1 g IV cada 12 h; 3) solicitar hemograma y PCR; 4) control de signos vitales cada 4 h».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca dos puntos donde correspondan.",
       texto:"«Plan___ hospitalizar, iniciar antibiótico, monitorizar signos vitales».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian la lista de plan. Se escriben sin espacio antes y con espacio después."}},

    {id:"m25", nombre:"Punto y aparte en la historia clínica",
     concepto:"Cada sección de la historia clínica se separa con punto y aparte: motivo de consulta, enfermedad actual, antecedentes, examen físico, diagnóstico, plan. La separación facilita la lectura rápida.",
     ejemplo:"El motivo de consulta termina en punto y aparte. La enfermedad actual comienza en un nuevo párrafo. Y así sucesivamente.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte en la historia clínica?",
       opciones:["Cuando se termina una oración","Cuando se termina una sección o párrafo","Cuando se cita un autor","Cuando se enumeran medicamentos"],
       correcta:1,
       retro:"El punto y aparte separa secciones. Facilita la lectura rápida y la localización de la información."}},

    {id:"m26", nombre:"Paréntesis para valores, unidades y siglas",
     concepto:"Los paréntesis encierran valores, unidades, siglas, aclaraciones y fechas. En la nota clínica son frecuentes: «TA 120/80 mmHg (2015)», «Hb 12 g/dL (ref. 13-17)».",
     ejemplo:"«Antecedente de HTA (2015), en tratamiento con losartán (50 mg/día)».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde correspondan.",
       texto:"«HTA ___2015___ en tratamiento con losartán ___50 mg/día___».",
       respuestas:[["("],[")",""],["("],[")",""]],
       retro:"Los paréntesis encierran información complementaria: fechas, valores, dosis. Facilitan la lectura sin interrumpir el texto."}},

    {id:"m27", nombre:"Comillas en diagnósticos y términos",
     concepto:"Las comillas encierran diagnósticos dudosos, términos entrecomillados por el paciente o palabras que se usan con un sentido específico. En la nota clínica: «“dolor de huesos” refiere la paciente».",
     ejemplo:"«Refiere haber tenido “el azúcar alta” hace años, sin tratamiento documentado». «“Shock” séptico de origen abdominal».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«Refiere haber tenido ___el azúcar alta___ hace años».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas encierran expresiones del paciente o usos específicos. En la nota clínica permiten distinguir el lenguaje del paciente del lenguaje técnico."}},

    {id:"m28", nombre:"Guiones y rayas",
     concepto:"El guion (-) une palabras compuestas: «inmunosuprimido», «cardio-respiratorio». La raya (—) introduce aclaraciones o diálogos en transcripciones de entrevista clínica.",
     ejemplo:"«Paciente inmunosuprimido por VIH». «El informante —un familiar— refirió que el paciente había estado confuso desde la noche anterior».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso del signo.",
       categorias:["Guion (-)","Raya (—)"],
       items:[
         {texto:"«cardio-respiratorio»", cat:0},
         {texto:"«inmuno-competente»", cat:0},
         {texto:"«El familiar —informó— que había confusión»", cat:1},
         {texto:"«fisio-patológico»", cat:0},
         {texto:"«El testigo —dijo la enfermera— no recuerda»", cat:1}
       ],
       retro:"El guion une términos; la raya aísla aclaraciones. En transcripciones clínicas, la raya marca intervenciones."}},

    {id:"m29", nombre:"Punto y seguido en la nota clínica",
     concepto:"El punto y seguido separa oraciones dentro del mismo párrafo. En la nota clínica, cada oración debe tener un dato completo. Su uso correcto facilita la lectura rápida.",
     ejemplo:"«Paciente de 65 años. Consulta por disnea de 2 días. Antecedente de EPOC. Afebril al ingreso. TA 130/80 mmHg».",
     ejercicio:{tipo:"fill",
       consigna:"Separa las oraciones con punto y seguido.",
       texto:"«Paciente de 65 años___ consulta por disnea de 2 días___ antecedente de EPOC».",
       respuestas:[["."],["."]],
       retro:"El punto y seguido separa oraciones. En la nota clínica, cada dato importante merece su propia oración."}},

    {id:"m30", nombre:"Signos en valores y unidades",
     concepto:"En medicina, los valores se escriben con número y unidad separadas por espacio: 38,5 °C, 120/80 mmHg, 12 g/dL, 5 mg/kg. Los signos (=, <, >) se usan en contextos técnicos.",
     ejemplo:"«Temperatura 38,5 °C». «TA 120/80 mmHg». «Hb 12 g/dL». «Dosis 5 mg/kg». «FC > 100 lpm» (taquicardia).",
     ejercicio:{tipo:"fill",

},

/* ============ BLOQUE 4 · ORTOGRAFÍA Y NORMATIVA ============ */
{
  id:"b4", nombre:"Ortografía y normativa médica", emoji:"📝",

  tecnicas:[
    {id:"m31", nombre:"Tildes en términos médicos",

       items:[
         {texto:"cardiología", cat:0},

         {texto:"terapia", cat:2}
       ],
       retro:"Los términos médicos siguen las reglas generales. Esdrújulas siempre llevan tilde."}},

    {id:"m32", nombre:"Tilde diacrítica en el texto médico",
     concepto:"La tilde diacrítica distingue: él/el, tú/tu, mí/mi, sí/si, más/mas, dé/de, sé/se, té/te. En la nota clínica es frecuente el error.",
     ejemplo:"«Él refiere dolor» / «El dolor es intenso». «Sí presentó fiebre» / «Si presenta fiebre, avise».",
     ejercicio:{tipo:"fill",
       consigna:"Completa con la forma correcta.",
       texto:"___ refiere dolor (él/el). · Quiero ___ de hierbas (té/te). · ___ presenta fiebre, avise (si/sí).",
       respuestas:[["el","él"],["te","té"],["si","sí"]],
       retro:"La tilde diacrítica distingue funciones. En textos médicos, escribirla correctamente es parte del rigor."}},

    {id:"m33", nombre:"Mayúsculas en enfermedades y síndromes",
     concepto:"Los nombres de enfermedades van en minúscula: diabetes, tuberculosis, neumonía, hipertensión. Los epónimos con nombre propio llevan mayúscula en el nombre: síndrome de Down, enfermedad de Crohn.",
     ejemplo:"«Diabetes mellitus tipo 2». «Síndrome de Down». «Enfermedad de Parkinson». «Neumonía adquirida en la comunidad».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica el uso de mayúsculas/minúsculas.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«El paciente tiene Diabetes Mellitus tipo 2»", cat:1},
         {texto:"«El paciente tiene diabetes mellitus tipo 2»", cat:0},
         {texto:"«Síndrome de Down»", cat:0},
         {texto:"«Enfermedad De Crohn»", cat:1},
         {texto:"«Enfermedad de Crohn»", cat:0}
       ],
       retro:"Enfermedades comunes van en minúscula. Epónimos con nombre propio llevan mayúscula en el nombre."}},

    {id:"m34", nombre:"Fechas y horas en la historia clínica",
     concepto:"Las fechas se escriben con número y mes en minúscula: 15 de julio de 2024. Las horas con dos puntos: 14:30 h. En la historia clínica, la fecha y la hora son obligatorias.",
     ejemplo:"«15/07/2024, 14:30 h. Paciente ingresa por urgencias». Formato numérico: «15/07/2024».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la fecha y hora.",
       texto:"«Bogotá, 15 de Julio de 2024, 2:30 pm» → «Bogotá, 15 de ___ de 2024, ___ h».",
       respuestas:[["julio"],["14:30"]],
       retro:"El mes va en minúscula. La hora se expresa en formato de 24 h. En la historia clínica es obligatoria."}},

    {id:"m35", nombre:"Siglas médicas",
     concepto:"Las siglas médicas se escriben sin puntos y en mayúsculas: OMS, OPS, INS, ICFES, EPS, IPS, SIVIGILA. Se definen la primera vez. Las siglas internacionales: WHO, PAHO, CDC.",
     ejemplo:"«La Organización Mundial de la Salud (OMS) publicó el informe». «El Sistema Nacional de Vigilancia en Salud Pública (SIVIGILA) reportó el brote».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el significado.",
       texto:"OMS = Organización Mundial de la ___ · EPS = Entidad Promotora de ___ · INS = Instituto Nacional de ___.",
       respuestas:[["Salud"],["Salud"],["Salud"]],
       retro:"Las siglas médicas se definen la primera vez. Son esenciales para la comunicación en salud en Colombia."}},

    {id:"m36", nombre:"Abreviaturas clínicas",
     concepto:"En medicina se usan abreviaturas: Dx (diagnóstico), Tx (tratamiento), Rx (prescripción), Hx (historia), TA (tensión arterial), FC (frecuencia cardiaca), FR (frecuencia respiratoria), SatO2 (saturación de oxígeno).",
     ejemplo:"«Dx: neumonía adquirida en la comunidad. Tx: ceftriaxona 1 g IV cada 12 h». «TA 120/80, FC 80, FR 18, SatO2 98 %».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el significado de las abreviaturas.",
       texto:"Dx = ___ · Tx = ___ · TA = ___ · FC = ___",
       respuestas:[["diagnostico","diagnóstico"],["tratamiento"],["tension arterial","tensión arterial"],["frecuencia cardiaca","frecuencia cardíaca"]],
       retro:"Las abreviaturas clínicas son estándar en la práctica. Sin embargo, no deben usarse en documentos dirigidos a pacientes."}},

    {id:"m37", nombre:"Unidades del Sistema Internacional en salud",
     concepto:"Las unidades SI son universales: g (gramo), mg (miligramo), mL (mililitro), L (litro), °C (grado Celsius), mmHg, lpm (latidos por minuto), rpm (respiraciones por minuto). Se deja espacio entre número y unidad.",
     ejemplo:"«38,5 °C». «120/80 mmHg». «5 mg/kg». «80 lpm». «18 rpm». «500 mL».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las unidades.",
       texto:"Temperatura: 38,5 ___ · Frecuencia cardiaca: 80 ___ · Dosis: 5 ___/kg",
       respuestas:[["°C","°C"],["lpm","latidos por minuto"],["mg","miligramos"]],
       retro:"Las unidades SI en salud son estándar. Se deja espacio entre número y unidad: 38,5 °C, no 38,5°C."}},

    {id:"m38", nombre:"Números y cifras clínicas",
     concepto:"En la nota clínica, los valores siempre van con número arábigo: «TA 120/80 mmHg», «FC 80 lpm», «T 38,5 °C». Los números grandes se escriben con separador de miles o sin él según la norma.",
     ejemplo:"«Glucosa 120 mg/dL». «Leucocitos 12 500/mm³» o «12500/mm³». «Plaquetas 250 000/mm³».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica el uso de las cifras.",
       categorias:["Correcto","Incorrecto"],
       items:[
         {texto:"«TA ciento veinte sobre ochenta»", cat:1},
         {texto:"«TA 120/80 mmHg»", cat:0},
         {texto:"«FC ochenta latidos»", cat:1},
         {texto:"«FC 80 lpm»", cat:0},
         {texto:"«Temperatura treinta y ocho cinco»", cat:1}
       ],
       retro:"Los valores clínicos siempre van con número arábigo. Escribirlos con letra es un error frecuente pero grave."}},

    {id:"m39", nombre:"Latinismos en medicina",
     concepto:"En medicina abundan los latinismos: in situ, in vitro, in vivo, post mortem, ante mortem, per os, ad libitum, status quo. Se escriben en cursiva y sin acentos.",
     ejemplo:"«El tumor se encontraba in situ». «El estudio in vitro mostró resistencia». «Administración per os». «El paciente falleció post mortem en UCI» (aunque «post mortem» se refiere al estudio, no al fallecimiento).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada latinismo según su significado.",
       categorias:["En el lugar","En laboratorio","En el organismo","Por vía oral"],
       items:[
         {texto:"in situ", cat:0},
         {texto:"in vitro", cat:1},
         {texto:"in vivo", cat:2},
         {texto:"per os", cat:3},
         {texto:"ad libitum", cat:3}
       ],
       retro:"Los latinismos médicos son frecuentes. Se escriben en cursiva y sin acentos."}},

    {id:"m40", nombre:"Cursivas y negritas en textos médicos",
     concepto:"En textos médicos, la cursiva se usa para latinismos, extranjerismos y términos que se mencionan más que se usan. La negrita se reserva para títulos y palabras clave. Se evita el abuso.",
     ejemplo:"«El estudio in vitro mostró resistencia al antibiótico». «La palabra “shock” en inglés no equivale exactamente al “choque” en español».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa la cursiva en textos médicos?",
       opciones:["Para enfatizar cualquier palabra","Para latinismos, extranjerismos y términos mencionados","Para títulos de sección","Para todo el texto"],
       correcta:1,
       retro:"La cursiva se usa con moderación: latinismos, extranjerismos y términos mencionados. El abuso de formatos resta profesionalismo."}}
  ]
},

{

    {id:"m41", nombre:"Terminología anatómica",
     concepto:"La terminología anatómica es precisa: «cefálico» (cabeza), «caudal» (cola), «proximal» (cerca del origen), «distal» (lejos del origen), «medial», «lateral», «anterior», «posterior». Confundirlos es un error.",
     ejemplo:"«Dolor en la región proximal del muslo derecho». «Lesión en el aspecto medial del tobillo». No es lo mismo «proximal» que «superior» en todos los casos.",
     ejercicio:{tipo:"classify",

    {id:"m42", nombre:"Terminología clínica: signo, síntoma, síndrome",
     concepto:"Signo: hallazgo objetivo (fiebre medida, ictericia). Síntoma: referido por el paciente (dolor, náusea). Síndrome: conjunto de signos y síntomas con identidad clínica. Enfermedad: entidad nosológica con etiología, fisiopatología y curso.",
     ejemplo:"«Fiebre de 38,5 °C» (signo) vs. «refiere escalofríos» (síntoma). «Síndrome febril» (conjunto). «Neumonía» (enfermedad específica).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su nivel.",

         {texto:"Síndrome febril.", cat:2},
         {texto:"Neumonía adquirida en la comunidad.", cat:3},
         {texto:"TA 150/95 mmHg.", cat:0}
       ],
       retro:"Signo, síntoma, síndrome y enfermedad son niveles distintos de descripción clínica. Confundirlos es un error conceptual."}},

    {id:"m43", nombre:"Terminología farmacológica",
     concepto:"Los medicamentos tienen nombre genérico (DCI), nombre comercial y forma farmacéutica. En documentos clínicos se prefiere el nombre genérico: «acetaminofén» (no «Tylenol»), «ibuprofeno» (no «Advil»).",
     ejemplo:"«Se administró acetaminofén 500 mg VO cada 6 h». No «Tylenol 500 mg VO cada 6 h».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el nombre comercial por el genérico.",
       texto:"«Tylenol» → ___ · «Advil» → ___ · «Aspirina» → ___",
       respuestas:[["acetaminofen","acetaminofén","paracetamol"],["ibuprofeno"],["acido acetilsalicilico","ácido acetilsalicílico","asa"]],
       retro:"En documentos clínicos se prefiere el nombre genérico. Evita confusión entre marcas y facilita la comunicación entre profesionales."}},

    {id:"m44", nombre:"Falsos amigos en medicina",
     concepto:"Existen términos que parecen equivalentes entre inglés y español pero no lo son: «constipation» (estreñimiento, no constipación), «intoxication» (intoxicación, no intoxicación alcohólica necesariamente), «eventration» (eventración, no evisceración).",
     ejemplo:"«The patient presented constipation» se traduce como «el paciente presentó estreñimiento», no «constipación» (que en español es congestión nasal).",
     ejercicio:{tipo:"fill",
       consigna:"Traduce correctamente.",
       texto:"«Constipation» en inglés significa ___ en español. · «Intoxication» puede significar ___ según contexto.",
       respuestas:[["estreñimiento","estrenimiento"],["intoxicacion","intoxicación","envenenamiento"]],
       retro:"Los falsos amigos entre inglés y español son frecuentes en medicina. Verificar el contexto es esencial."}},

    {id:"m45", nombre:"Precisión: incidencia, prevalencia, mortalidad, letalidad",
     concepto:"Estos términos epidemiológicos tienen significados distintos: incidencia (casos nuevos en un período), prevalencia (casos existentes en un momento), mortalidad (muertes por todas las causas), letalidad (muertes entre los enfermos).",
     ejemplo:"«La incidencia de tuberculosis en Colombia en 2023 fue de X casos por 100 000 habitantes». «La prevalencia de diabetes es del 7 % en adultos». «La letalidad del sarampión puede llegar al 1 %».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su definición.",
       categorias:["Casos nuevos","Casos existentes","Muertes por causas","Muertes entre enfermos"],
       items:[
         {texto:"incidencia", cat:0},
         {texto:"prevalencia", cat:1},
         {texto:"mortalidad", cat:2},
         {texto:"letalidad", cat:3},
         {texto:"mortalidad infantil", cat:2}
       ],
       retro:"Incidencia, prevalencia, mortalidad y letalidad son distintos. Confundirlos es un error grave en epidemiología."}},

    {id:"m46", nombre:"Neologismos médicos",
     concepto:"La medicina produce neologismos constantemente: telemedicina, telesalud, mHealth, nanomedicina, inmunoterapia, teleconsulta, farmacogenómica. Algunos se adaptan al español; otros se mantienen en inglés.",
     ejemplo:"«Telemedicina» y «telesalud» están adaptados al español. «mHealth» (mobile health) se traduce como «salud móvil». «Big data» en salud se usa en inglés o «macrodatos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término como adaptado al español o mantenido en inglés.",
       categorias:["Adaptado al español","Mantenido en inglés"],
       items:[

         {texto:"telesalud", cat:0},
         {texto:"big data", cat:1},
         {texto:"nanomedicina", cat:0}
       ],
       retro:"Cuando existe equivalente en español, se prefiere. Si no, se mantiene el término original en cursiva."}},

    {id:"m47", nombre:"Extranjerismos en medicina",
     concepto:"En medicina abundan los extranjerismos: shock, screening, bypass, stent, feedback, kit. Muchos se usan sin adaptación; otros tienen equivalentes: «cribado» (screening), «derivación» (bypass), «endoprótesis» (stent).",
     ejemplo:"«El cribado de cáncer de cuello uterino se realiza con citología». «La endoprótesis coronaria se implantó por vía femoral». «Shock» se mantiene como préstamo.",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el extranjerismo por su equivalente español.",

       retro:"Cuando existe equivalente en español, se prefiere. Si el término está muy extendido, se mantiene en cursiva la primera vez."}},

    {id:"m48", nombre:"Léxico de la epidemiología",
     concepto:"La epidemiología tiene su léxico: brote, epidemia, pandemia, endemia, caso índice, contacto, período de incubación, tasa de ataque, curva epidémica, factor de riesgo, factor protector.",
     ejemplo:"«Brote» (número inusual de casos en una zona). «Endemia» (presencia habitual). «Epidemia» (aumento inusual). «Pandemia» (epidemia global).",

       retro:"Brote, endemia, epidemia y pandemia son niveles distintos. Usarlos con precisión es esencial en salud pública."}},

    {id:"m49", nombre:"Léxico de la salud pública",
     concepto:"La salud pública tiene su léxico: determinantes sociales, atención primaria, promoción, prevención, vigilancia, tamizaje, cobertura, accesibilidad, equidad en salud, APS, MAIS, RIAS (en Colombia).",
     ejemplo:"«Los determinantes sociales de la salud explican gran parte de las inequidades». «El sistema de salud colombiano se organiza por el MAIS (Modelo de Atención Integral en Salud)».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el término.",

    {id:"m50", nombre:"Diccionarios y fuentes médicas",

     ejemplo:"Antes de usar un término dudoso, se consulta el Diccionario de términos médicos de la Real Academia Nacional de Medicina (DTM).",
     ejercicio:{tipo:"quiz",
