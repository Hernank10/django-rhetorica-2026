/* ============ BLOQUE 6 · ESTILO UNIVERSITARIO Y CITAS ============ */
{
  id:"b6", nombre:"Estilo universitario y citas médicas", emoji:"🎓",
  desc:"Registro, citas Vancouver y APA, paráfrasis, plagio y argumentación en salud.",
  tecnicas:[
    {id:"m51", nombre:"Registro académico-médico",
     concepto:"El registro en ciencias médicas es formal, preciso y técnico. Se evitan coloquialismos, valoraciones subjetivas sin evidencia y expresiones ambiguas. Se usa terminología estándar.",
     ejemplo:"No se escribe «el paciente está muy mal»; se escribe «el paciente se encuentra en malas condiciones generales, con TA 80/50 mmHg y SatO2 88 % con FiO2 0,21».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro médico o coloquial.",
       categorias:["Médico","Coloquial"],
       items:[
         {texto:"«TA 80/50 mmHg, SatO2 88 %».", cat:0},
         {texto:"«El paciente está muy mal».", cat:1},
         {texto:"«Se encuentra en malas condiciones generales».", cat:0},
         {texto:"«Está fatal».", cat:1},
         {texto:"«Presenta taquicardia e hipotensión».", cat:0}
       ],
       retro:"El registro médico es técnico y objetivo. Los coloquialismos restan rigor y pueden inducir a error."}},

    {id:"m52", nombre:"Citas estilo Vancouver",
     concepto:"El estilo Vancouver es el estándar en medicina. Las citas se numeran entre corchetes según orden de aparición: [1], [2], [3]. Al final se incluye la lista numerada.",
     ejemplo:"En el texto: «El tratamiento con estatinas reduce la mortalidad cardiovascular [1]». En la lista: «1. Smith A, Jones B. Statins and mortality. N Engl J Med. 2020;382(3):245-55».",
     ejercicio:{tipo:"fill",
       consigna:"Escribe la cita según Vancouver.",
       texto:"«El tratamiento reduce la mortalidad cardiovascular ___». (primera cita del texto)",
       respuestas:[["[1]","[1].","1"]],
       retro:"En Vancouver las citas se numeran con corchetes en orden de aparición. La lista final va numerada."}},

    {id:"m53", nombre:"Citas estilo APA en salud",
     concepto:"El estilo APA también se usa en ciencias de la salud, especialmente en psicología, enfermería y salud pública. Formato: (Autor, año). Se usa cuando la revista lo exige.",
     ejemplo:"«Diversos estudios confirman esta asociación (García, 2020; López, 2021)». «Según García (2020), el efecto es significativo».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la cita APA.",
       texto:"«El efecto fue significativo (García, ___)».",
       respuestas:[["2020","año"]],
       retro:"En APA la cita va con (Autor, año). Se usa en algunas áreas de la salud, especialmente en enfermería y psicología."}},

    {id:"m54", nombre:"Paráfrasis médica",
     concepto:"Parafrasear es reformular la idea de otro con palabras propias, manteniendo el significado y citando la fuente. En medicina es esencial para sintetizar la literatura sin plagiar.",
     ejemplo:"Original: «Los inhibidores de la ECA reducen la mortalidad en pacientes con insuficiencia cardiaca». Paráfrasis: «Los IECA disminuyen la mortalidad en la insuficiencia cardiaca (García, 2020)».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la paráfrasis.",
       texto:"«Según diversos estudios, las estatinas reducen la mortalidad cardiovascular en prevención secundaria ___».",
       respuestas:[["[1]","[2]","(garcia, 2020)","(García, 2020)"]],
       retro:"La paráfrasis mantiene la idea ajena con palabras propias y siempre cita la fuente. Sin cita, sería plagio."}},

    {id:"m55", nombre:"Referencias bibliográficas Vancouver",
     concepto:"El formato Vancouver para artículos de revista: Apellido AB, Apellido CD. Título del artículo. Abreviatura de la revista. Año;volumen(número):páginas. Para libros: Apellido AB. Título. Edición. Ciudad: Editorial; Año.",
     ejemplo:"Smith A, Jones B. Statins and cardiovascular mortality. N Engl J Med. 2020;382(3):245-55. · Kasper D, Fauci A. Harrison's principles of internal medicine. 20th ed. New York: McGraw-Hill; 2018.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia Vancouver de artículo.",
       items:[
         "Apellido e iniciales de los autores.",
         "Título del artículo.",
         "Abreviatura de la revista.",
         "Año;volumen(número):páginas.",
         "DOI (si aplica)."
       ],
       retro:"El formato Vancouver es fijo. La abreviatura de la revista sigue el estilo de Index Medicus."}},

    {id:"m56", nombre:"Referencias de guías de práctica clínica",
     concepto:"Las guías de práctica clínica se referencian de forma específica: entidad, año, título, versión. En Colombia se citan las GPC del Ministerio de Salud y las del IETS (Instituto de Evaluación Tecnológica en Salud).",
     ejemplo:"«Ministerio de Salud y Protección Social. Guía de práctica clínica para el diagnóstico y tratamiento de la diabetes mellitus tipo 2. Bogotá: MinSalud; 2022».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia de la GPC.",
       texto:"«Ministerio de Salud y Protección Social. Guía de práctica clínica para el diagnóstico y tratamiento de la ___ mellitus tipo 2. Bogotá: MinSalud; ___».",
       respuestas:[["diabetes"],["2022","2021","2020","ano","año"]],
       retro:"Las guías de práctica clínica se referencian con entidad, título, ciudad, editorial y año. Son fuente central de evidencia."}},

    {id:"m57", nombre:"Conectores lógicos en texto médico",
     concepto:"Los conectores organizan el razonamiento: adición (además), contraste (sin embargo), causa (porque, debido a), consecuencia (por lo tanto), orden (en primer lugar, seguidamente).",
     ejemplo:"«El paciente presenta fiebre; sin embargo, no hay signos de focalización. Por lo tanto, se solicitan estudios complementarios».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Adición","Contraste","Causa","Consecuencia"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"debido a", cat:2},
         {texto:"por lo tanto", cat:3},
         {texto:"no obstante", cat:1},
         {texto:"en consecuencia", cat:3}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Son esenciales en el razonamiento clínico escrito."}},

    {id:"m58", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. En medicina es una falta grave de integridad científica.",
     ejemplo:"Copiar un párrafo de un artículo sin comillas ni cita es plagio. Parafrasear sin citar también lo es. Presentar datos de otros como propios también.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. En medicina, el plagio afecta la credibilidad y la seguridad del paciente."}},

    {id:"m59", nombre:"Argumentación en salud",
     concepto:"La argumentación médica defiende una tesis con evidencia: estudios clínicos, guías, datos epidemiológicos. Estructura: introducción con tesis, argumentos, refutación y conclusión. La evidencia manda.",
     ejemplo:"«Este artículo defiende que la vacunación reduce la mortalidad infantil. Primero, los estudios muestran… Segundo, las guías recomiendan… Sin embargo, algunos objetan…».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de la argumentación médica.",
       items:[
         "Introducción con la tesis.",
         "Argumentos con evidencia (estudios, guías).",
         "Refutación de objeciones.",
         "Conclusión con recomendación."
       ],
       retro:"La argumentación médica se apoya en evidencia. La jerarquía de la evidencia orienta la fuerza de cada argumento."}},

    {id:"m60", nombre:"Coherencia global del texto médico",
     concepto:"La coherencia es la unidad de sentido del texto: todas sus partes contribuyen al mismo propósito. En un artículo médico, los datos, la discusión y las conclusiones deben ser coherentes entre sí.",
     ejemplo:"Un artículo que en Resultados muestra un efecto y en Conclusiones afirma lo contrario pierde coherencia global.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué problema afecta a la COHERENCIA global, no a la cohesión?",
       opciones:["Falta un conector entre dos oraciones","Las conclusiones contradicen los resultados","Hay una falta de ortografía","Una oración es demasiado larga"],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. Una contradicción entre secciones es un fallo grave de coherencia."}}
  ]
},

/* ============ BLOQUE 7 · GÉNEROS DE LA ESCRITURA MÉDICA ============ */
{
  id:"b7", nombre:"Géneros de la escritura médica", emoji:"📄",
  desc:"Historia clínica, nota de evolución, caso clínico, artículo, revisión, protocolo, consentimiento y guía.",
  tecnicas:[
    {id:"m61", nombre:"Historia clínica",
     concepto:"La historia clínica es el registro completo de la atención. Incluye: identificación, motivo de consulta, enfermedad actual, antecedentes, revisión por sistemas, examen físico, diagnóstico, plan y firma. Es un documento legal.",
     ejemplo:"«Motivo de consulta: “me duele el pecho”. Enfermedad actual: paciente de 55 años, con dolor precordial opresivo de 30 min de evolución, irradiado a brazo izquierdo...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de la historia clínica.",
       items:[
         "Identificación del paciente.",
         "Motivo de consulta y enfermedad actual.",
         "Antecedentes personales y familiares.",
         "Revisión por sistemas y examen físico.",
         "Diagnóstico, plan y firma."
       ],
       retro:"La historia clínica tiene una estructura legal. Cumplirla garantiza la continuidad asistencial y la validez legal."}},

    {id:"m62", nombre:"Nota de evolución",
     concepto:"La nota de evolución registra el estado del paciente durante la hospitalización: subjetivo, objetivo, análisis y plan (SOAP). Se escribe diariamente y refleja los cambios clínicos.",
     ejemplo:"«S: refiere mejoría del dolor. O: TA 120/80, FC 78, afebril. A: evolución favorable de neumonía. P: continuar antibiótico, control de laboratorio».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las partes del SOAP.",
       texto:"S = ___ · O = ___ · A = ___ · P = ___",
       respuestas:[["subjetivo"],["objetivo"],["analisis","análisis","evaluacion","evaluación"],["plan"]],
       retro:"El SOAP (Subjetivo, Objetivo, Análisis, Plan) es el formato estándar de la nota de evolución. Cada parte es esencial."}},

    {id:"m63", nombre:"Caso clínico",
     concepto:"El caso clínico es un género que presenta un paciente o una serie de pacientes con una condición relevante. Estructura: introducción, presentación del caso, discusión, conclusión. Se publica en revistas médicas.",
     ejemplo:"«Presentamos el caso de un paciente de 45 años con dolor abdominal y fiebre. La evaluación inicial mostró... El diagnóstico final fue... La discusión aborda los hallazgos clave».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del caso clínico.",
       items:[
         "Introducción y justificación del reporte.",
         "Presentación del caso (datos, clínica, exámenes).",
         "Discusión (diagnóstico diferencial, evidencia).",
         "Conclusión y aprendizaje principal."
       ],
       retro:"El caso clínico presenta y discute un caso relevante. Su valor está en el aprendizaje clínico que aporta."}},

    {id:"m64", nombre:"Artículo original (IMRyD)",
     concepto:"El artículo original presenta resultados de investigación. Sigue la estructura IMRyD: Introducción, Métodos, Resultados y Discusión. Tiene resumen y palabras clave. Se publica en revistas con revisión por pares.",
     ejemplo:"«Resumen: Se evaluó el efecto de la intervención X en pacientes con Y. Métodos: ensayo clínico aleatorizado con 200 pacientes. Resultados: reducción del 30 % en el desenlace principal. Discusión: ...».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura IMRyD.",
       texto:"El artículo original sigue la estructura ___: ___, ___, ___ y ___.",
       respuestas:[["IMRyD","imryd"],["Introduccion","Introducción"],["Metodos","Métodos"],["Resultados"],["Discusion","Discusión"]],
       retro:"IMRyD = Introducción, Métodos, Resultados y Discusión. Es el estándar de la comunicación científica médica."}},

    {id:"m65", nombre:"Revisión sistemática",
     concepto:"La revisión sistemática sintetiza toda la evidencia disponible sobre una pregunta clínica. Sigue un protocolo estricto: criterios de inclusión, búsqueda documentada, selección y síntesis. Puede incluir metaanálisis.",
     ejemplo:"«Revisión sistemática sobre el uso de estatinas en prevención primaria. Se buscaron ensayos clínicos aleatorizados en PubMed, Embase y Cochrane entre 2000 y 2023. Se incluyeron 15 estudios...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las fases de la revisión sistemática.",
       items:[
         "Formular la pregunta clínica (formato PICO).",
         "Definir criterios de inclusión y exclusión.",
         "Realizar la búsqueda sistemática documentada.",
         "Seleccionar y evaluar los estudios.",
         "Sintetizar los resultados y presentar conclusiones."
       ],
       retro:"La revisión sistemática es la forma más rigurosa de síntesis de evidencia. Sigue un protocolo reproducible."}},

    {id:"m66", nombre:"Protocolo de investigación",
     concepto:"El protocolo describe el diseño de un estudio antes de realizarlo. Incluye: justificación, pregunta de investigación, objetivos, metodología, aspectos éticos, cronograma y presupuesto. Es un requisito para aprobación por comité de ética.",
     ejemplo:"«Protocolo: Ensayo clínico aleatorizado doble ciego. Pregunta: ¿reduce la intervención X la mortalidad en pacientes con Y? Metodología: 200 pacientes aleatorizados... Aspectos éticos: aprobado por el comité...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del protocolo de investigación.",
       items:[
         "Título, resumen y justificación.",
         "Pregunta de investigación y objetivos.",
         "Metodología (diseño, población, variables).",
         "Aspectos éticos y consentimiento.",
         "Cronograma y presupuesto."
       ],
       retro:"El protocolo se escribe antes de iniciar el estudio. Su detalle garantiza la validez metodológica y la aprobación ética."}},

    {id:"m67", nombre:"Guía de práctica clínica",
     concepto:"La GPC es un documento que sintetiza evidencia y formula recomendaciones para la práctica clínica. Sigue metodologías como GRADE. Incluye niveles de evidencia y grados de recomendación.",
     ejemplo:"«Recomendación: Se sugiere iniciar tratamiento con IECA en pacientes con insuficiencia cardiaca con fracción de eyección reducida (Recomendación fuerte, evidencia moderada)».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura de la GPC.",
       texto:"Una GPC formula ___ basadas en la evidencia y asigna niveles de ___ y grados de ___.",
       respuestas:[["recomendaciones"],["evidencia"],["recomendacion","recomendación"]],
       retro:"Las GPC son herramientas centrales de la práctica clínica basada en evidencia. Guían las decisiones de profesionales y sistemas de salud."}},

    {id:"m68", nombre:"Consentimiento informado",
     concepto:"El consentimiento informado es un documento mediante el cual el paciente acepta un procedimiento o tratamiento tras recibir información clara sobre sus riesgos, beneficios y alternativas. Es obligatorio y debe estar en lenguaje accesible.",
     ejemplo:"«Se le ha explicado que este procedimiento consiste en... Los riesgos son... Los beneficios son... Usted puede retirar su consentimiento en cualquier momento. Firmo libremente...».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada elemento como propio o no del consentimiento informado.",
       categorias:["Propio","No propio"],
       items:[
         {texto:"Descripción del procedimiento en lenguaje claro.", cat:0},
         {texto:"Riesgos y beneficios.", cat:0},
         {texto:"Alternativas disponibles.", cat:0},
         {texto:"Historia clínica completa del paciente.", cat:1},
         {texto:"Firma del paciente o representante.", cat:0}
       ],
       retro:"El consentimiento informado incluye descripción, riesgos, beneficios, alternativas y firma. Es un derecho del paciente."}},

    {id:"m69", nombre:"Informe de laboratorio",
     concepto:"El informe de laboratorio clínico comunica resultados de análisis. Incluye: identificación del paciente, tipo de muestra, resultados con valores de referencia, interpretación y firma del profesional responsable.",
     ejemplo:"«Hemograma: Leucocitos 12 500/mm³ (ref. 4 500-11 000). Neutrófilos 80 % (ref. 40-70 %). Hallazgos compatibles con infección bacteriana».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el informe de laboratorio.",
       texto:"El informe incluye: identificación, tipo de ___, resultados con valores de ___, interpretación y ___ del profesional.",
       respuestas:[["muestra"],["referencia","referencias"],["firma"]],
       retro:"El informe de laboratorio es un documento técnico. Sus resultados orientan decisiones clínicas, por lo que la precisión es esencial."}},

    {id:"m70", nombre:"Resumen ejecutivo en salud",
     concepto:"El resumen ejecutivo sintetiza un informe extenso para tomadores de decisiones. Incluye: problema, hallazgos principales, recomendaciones y aspectos económicos o de implementación. Se escribe en lenguaje claro.",
     ejemplo:"«Resumen ejecutivo. Problema: la cobertura de vacunación ha disminuido del 95 % al 85 % en 5 años. Hallazgos: la principal barrera es la accesibilidad geográfica. Recomendaciones: ampliar puntos de vacunación en zonas rurales...».",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del resumen ejecutivo.",
       items:[
         "Planteamiento del problema.",
         "Hallazgos principales.",
         "Recomendaciones.",
         "Implicaciones económicas o de implementación."
       ],
       retro:"El resumen ejecutivo sintetiza para tomadores de decisiones. Debe ser breve, claro y orientado a la acción."}}
  ]
},

/* ============ BLOQUE 8 · ÉTICA Y COMUNICACIÓN EN SALUD ============ */
{
  id:"b8", nombre:"Ética y comunicación en salud", emoji:"🤝",
  desc:"Confidencialidad, consentimiento, comunicación con pacientes y bioética.",
  tecnicas:[
    {id:"m71", nombre:"Confidencialidad",
     concepto:"La confidencialidad es un deber ético y legal. La información clínica del paciente no puede divulgarse sin su autorización, salvo excepciones legales (riesgo para terceros, orden judicial).",
     ejemplo:"Nunca se comenta un caso clínico con nombres propios fuera del ámbito profesional. En publicaciones, se anonimizan los datos.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo puede divulgarse información clínica de un paciente?",
       opciones:["Cuando el médico lo considere necesario","Solo con autorización del paciente o por excepción legal","Siempre que sea con colegas","Cuando el paciente no esté presente"],
       correcta:1,
       retro:"La confidencialidad es un derecho del paciente. Se exceptúa solo por autorización o por excepciones legales específicas."}},

    {id:"m72", nombre:"Autonomía del paciente",
     concepto:"El principio de autonomía reconoce que el paciente es el protagonista de las decisiones sobre su salud. El consentimiento informado, el rechazo al tratamiento y la voluntad anticipada son expresiones de este principio.",
     ejemplo:"Un paciente con capacidad puede rechazar un tratamiento, incluso si el médico lo considera necesario. Se respeta su decisión informándole las consecuencias.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el principio de autonomía.",
       texto:"El principio de ___ reconoce que el paciente decide sobre su salud. Se expresa en el ___ informado.",
       respuestas:[["autonomia","autonomía"],["consentimiento"]],
       retro:"El principio de autonomía es fundamental en bioética. El paciente es protagonista de las decisiones sobre su salud."}},

    {id:"m73", nombre:"Comunicación con el paciente",
     concepto:"La comunicación con el paciente debe ser clara, empática y accesible. Se evitan tecnicismos sin explicación. Se verifica la comprensión. El paciente es un interlocutor, no un receptor pasivo.",
     ejemplo:"En lugar de «tiene una neoplasia maligna», se dice: «los análisis muestran un tumor, es decir, un crecimiento anormal de células. Vamos a explicarle las opciones».",
     ejercicio:{tipo:"fill",
       consigna:"Reformula en lenguaje accesible.",
       texto:"«Presenta hipertensión arterial» → «Su ___ está alta y hay que controlarla».",
       respuestas:[["presion","presión","tension","tensión"]],
       retro:"La comunicación con el paciente exige lenguaje accesible. Verificar la comprensión es parte del acto clínico."}},

    {id:"m74", nombre:"Comunicación de malas noticias",
     concepto:"La comunicación de malas noticias requiere preparación, empatía y protocolo. El método SPIKES (Setting, Perception, Invitation, Knowledge, Emotions, Strategy) es el estándar internacional.",
     ejemplo:"«Setting: lugar privado. Perception: “¿qué sabe hasta ahora?”. Invitation: “¿quiere que le explique los resultados?”. Knowledge: “los análisis muestran...”. Emotions: dejar llorar. Strategy: “vamos a...”».",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos del protocolo SPIKES.",
       items:[
         "Preparar el espacio y la disposición.",
         "Explorar lo que el paciente ya sabe.",
         "Indagar cuánta información desea recibir.",
         "Comunicar la información con claridad.",
         "Reconocer y responder a las emociones.",
         "Proponer un plan de acción."
       ],
       retro:"El protocolo SPIKES es el estándar para comunicar malas noticias. Cada paso es esencial para respetar al paciente."}},

    {id:"m75", nombre:"Comunicación entre profesionales",
     concepto:"La comunicación entre profesionales de la salud debe ser clara, precisa y estructurada. El método SBAR (Situation, Background, Assessment, Recommendation) es estándar para la transferencia de información.",
     ejemplo:"«SBAR: Situación: paciente de 65 años con disnea súbita. Antecedentes: EPOC. Evaluación: SatO2 88 %, FR 28. Recomendación: iniciar oxígeno y evaluar ingreso».",
     ejercicio:{tipo:"fill",
       consigna:"Completa el método SBAR.",
       texto:"S = ___ · B = ___ · A = ___ · R = ___",
       respuestas:[["situacion","situación"],["background","antecedentes"],["assessment","evaluacion","evaluación"],["recommendation","recomendacion","recomendación"]],
       retro:"SBAR (Situation, Background, Assessment, Recommendation) es el estándar para la comunicación entre profesionales. Reduce errores."}},

    {id:"m76", nombre:"Comunicación con la familia",
     concepto:"La comunicación con la familia debe ser respetuosa, clara y considerar el contexto emocional. Se debe informar sin tecnicismos, reconocer el papel de la familia y respetar la voluntad del paciente.",
     ejemplo:"«Su familiar está estable pero requiere hospitalización. Vamos a explicarle el tratamiento. ¿Tienen preguntas?».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la comunicación con la familia.",
       texto:"«Su familiar está ___ pero requiere hospitalización. Vamos a ___ el tratamiento».",
       respuestas:[["estable","estable","mejorando","estabilizado"],["explicarle","explicar"]],
       retro:"La comunicación con la familia reconoce el papel del entorno y respeta la voluntad del paciente. Es parte de la atención integral."}},

    {id:"m77", nombre:"Lenguaje incluyente en salud",
     concepto:"El lenguaje en salud debe evitar estigmatizar a las personas. Se prefieren fórmulas centradas en la persona: «persona con diabetes» (no «diabético»), «persona con discapacidad» (no «discapacitado»), «persona que consume sustancias psicoactivas» (no «adicto»).",
     ejemplo:"«Persona con obesidad» en lugar de «obeso». «Persona con VIH» en lugar de «sidoso» o «VIH positivo» (el virus no define a la persona).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como incluyente o estigmatizante.",
       categorias:["Incluyente","Estigmatizante"],
       items:[
         {texto:"«Persona con diabetes».", cat:0},
         {texto:"«Diabético».", cat:1},
         {texto:"«Persona con discapacidad».", cat:0},
         {texto:"«Discapacitado».", cat:1},
         {texto:"«Persona con VIH».", cat:0}
       ],
       retro:"El lenguaje centrado en la persona reconoce su dignidad. Evita reducir a alguien a su condición de salud."}},

    {id:"m78", nombre:"Estigma y lenguaje en salud mental",
     concepto:"En salud mental, el lenguaje tiene un peso enorme. Se evitan términos como «loco», «demente», «trastornado». Se prefieren expresiones clínicas y no estigmatizantes: «persona con esquizofrenia», «persona con depresión».",
     ejemplo:"«Persona con esquizofrenia» en lugar de «esquizofrénico». «Persona con depresión mayor» en lugar de «depresivo».",
     ejercicio:{tipo:"fill",
       consigna:"Reformula con lenguaje no estigmatizante.",
       texto:"«Es un esquizofrénico» → «Es una persona con ___».",
       respuestas:[["esquizofrenia"]],
       retro:"El lenguaje centrado en la persona reduce el estigma y respeta la dignidad. Es un deber ético del profesional de salud."}},

    {id:"m79", nombre:"Comunicación intercultural en salud",
     concepto:"La comunicación en salud debe considerar la diversidad cultural: creencias sobre la enfermedad, prácticas tradicionales, lenguas, cosmovisiones. La competencia intercultural mejora la atención.",
     ejemplo:"En comunidades indígenas, integrar la medicina tradicional con la occidental cuando es posible. En poblaciones afrocolombianas, considerar sus prácticas ancestrales.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la comunicación intercultural.",
       texto:"La comunicación intercultural considera las creencias sobre la ___, las prácticas ___ y las lenguas de los pacientes.",
       respuestas:[["enfermedad","salud"],["tradicionales","ancestrales","culturales","medicas","médicas"]],
       retro:"La competencia intercultural mejora la atención. El respeto por la diversidad es parte del acto clínico."}},

    {id:"m80", nombre:"Bioética y escritura",
     concepto:"La bioética (autonomía, beneficencia, no maleficencia, justicia) orienta la escritura médica. Los textos clínicos deben respetar estos principios: informar con veracidad, no dañar, buscar el bien del paciente y tratar con justicia.",
     ejemplo:"Un informe no debe exponer innecesariamente la intimidad del paciente ni usar su caso para fines ajenos a su cuidado.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada principio bioético según su definición.",
       categorias:["Autonomía","Beneficencia","No maleficencia","Justicia"],
       items:[
         {texto:"Respetar la decisión del paciente.", cat:0},
         {texto:"Buscar el bien del paciente.", cat:1},
         {texto:"No causar daño.", cat:2},
         {texto:"Tratar con equidad.", cat:3},
         {texto:"Informar con veracidad.", cat:0}
       ],
       retro:"Los cuatro principios de la bioética (autonomía, beneficencia, no maleficencia, justicia) orientan la práctica clínica y la escritura médica."}}
  ]
},

    {id:"m83", nombre:"Abstract estructurado",

/* =====================================================================
   ESTADO Y UTILIDADES
   ===================================================================== */
const STORAGE_KEY = "cuaderno_medico_100_v1";
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ progreso = {}; }

const TECNICAS_FLAT = [];
CATEGORIAS.forEach(cat => cat.tecnicas.forEach(t => {
  t.catId = cat.id; t.catNombre = cat.nombre; t.catEmoji = cat.emoji;
  TECNICAS_FLAT.push(t);
}));

let actualId = TECNICAS_FLAT[0].id;
let notaTimer = null;

function guardar(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progreso)); } catch(e){} }
function getProg(id){ if(!progreso[id]) progreso[id] = {ok:false, nota:""}; return progreso[id]; }
function normaliza(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"'«»()]/g,"")
    .replace(/\s+/g," ").trim();
}
function barajar(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function boton(txt, cls){
  const b = document.createElement("button");
  b.className = "btn " + (cls||"primary");
  b.textContent = txt;
  return b;
}

/* =====================================================================
   MENÚ
   ===================================================================== */
function renderMenu(filtro){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const f = normaliza(filtro||"");

  CATEGORIAS.forEach(cat => {
    const tecnicas = cat.tecnicas.filter(t => !f || normaliza(t.nombre).includes(f) || normaliza(cat.nombre).includes(f));
    if(!tecnicas.length) return;

    const hechas = cat.tecnicas.filter(t => getProg(t.id).ok).length;
    const div = el("div","cat" + (f ? " open" : (cat.id === catDe(actualId) ? " open" : "")));
    div.dataset.cat = cat.id;

    const head = document.createElement("button");
    head.className = "cat-head";
    head.innerHTML = '<span>' + cat.emoji + '</span><span>' + cat.nombre + '</span>' +
                     '<span class="cat-count">' + hechas + "/" + cat.tecnicas.length + '</span>' +
                     '<span class="chev">▶</span>';
    head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const bar = el("div","cat-bar");
    const barFill = document.createElement("i");
    barFill.style.width = (hechas/cat.tecnicas.length*100) + "%";
    bar.appendChild(barFill);
    div.appendChild(bar);

    const body = el("div","cat-body");
    body.appendChild(el("div","cat-desc", cat.desc));

    tecnicas.forEach(t => {
      const b = document.createElement("button");
      b.className = "tech-link" + (getProg(t.id).ok ? " done":"") + (t.id === actualId ? " active":"");
      b.innerHTML = '<span class="dot">✓</span><span>' + t.nombre + '</span>';
      b.onclick = () => { abrirTecnica(t.id); cerrarSidebar(); };
      body.appendChild(b);
    });
    div.appendChild(body);
    menu.appendChild(div);
  });
}
function catDe(id){
  const t = TECNICAS_FLAT.find(x => x.id === id);
  return t ? t.catId : null;
}

/* =====================================================================
   PANEL
   ===================================================================== */
function abrirTecnica(id){
  actualId = id;
  const t = TECNICAS_FLAT.find(x => x.id === id);
  const idx = TECNICAS_FLAT.indexOf(t);
  const panel = document.getElementById("panel");
  panel.innerHTML = "";

  const head = el("div","tech-head");
  head.appendChild(el("span","badge", t.catEmoji + " " + t.catNombre));
  head.appendChild(el("h2", null, t.nombre));
  const bloqueIdx = CATEGORIAS.findIndex(c => c.id === t.catId) + 1;
  head.appendChild(el("div","tech-pos", "Técnica " + (idx+1) + " de " + TECNICAS_FLAT.length +
                     " · Bloque " + bloqueIdx + "/10"));

  const block = CATEGORIAS.find(c => c.id === t.catId);
  const dots = el("div","block-dots");
  dots.title = "Puntos de avance del bloque";
  block.tecnicas.forEach(bt => {
    const d = el("span","bdot" + (getProg(bt.id).ok ? " done":"") + (bt.id === t.id ? " current":""));
    d.onclick = () => abrirTecnica(bt.id);
    d.title = bt.nombre;
    dots.appendChild(d);
  });
  head.appendChild(dots);
  panel.appendChild(head);

  const fc = el("div","flashcard");
  const inner = el("div","fc-inner");

  const front = el("div","fc-face fc-front");
  front.appendChild(el("span","fc-tag","💡 Concepto"));
  front.appendChild(el("p", null, t.concepto));
  front.appendChild(el("span","fc-hint","Toca la tarjeta para ver el ejemplo clínico ↻"));

  const back = el("div","fc-face fc-back");
  back.appendChild(el("span","fc-tag","🔎 Ejemplo práctico"));
  back.appendChild(el("p", null, t.ejemplo));
  back.appendChild(el("span","fc-hint","↻ Toca de nuevo para volver al concepto"));

  inner.appendChild(front); inner.appendChild(back);
  fc.appendChild(inner);
  fc.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(fc);

  const flipBtn = boton("↻ Voltear tarjeta", "ghost flip-btn");
  flipBtn.onclick = () => fc.classList.toggle("flipped");
  panel.appendChild(flipBtn);

  const sec = el("section");
  const st = el("h3","sec-title");
  st.innerHTML = "✍️ Ejercicio interactivo <span>comprueba tu comprensión</span>";
  sec.appendChild(st);
  sec.appendChild(el("p","consigna", t.ejercicio.consigna));

  const body = el("div");
  sec.appendChild(body);
  const fb = el("div","feedback");
  sec.appendChild(fb);
  panel.appendChild(sec);

  const cuad = el("section","cuaderno");
  const ct = el("h3","sec-title");
  ct.innerHTML = "📓 Mi cuaderno clínico <span>se guarda automáticamente</span>";
  cuad.appendChild(ct);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "Escribe aquí tus notas, ejemplos clínicos, redacciones propias, dudas…";
  ta.value = getProg(t.id).nota || "";
  cuad.appendChild(ta);

  const foot = el("div","cuaderno-foot");
  const info = el("span", null, "");
  const status = el("span", null, "✓ Guardado");
  status.id = "notaStatus";
  foot.appendChild(info); foot.appendChild(status);
  cuad.appendChild(foot);
  panel.appendChild(cuad);

  const nav = el("div","nav-foot");
  const prev = boton("← Anterior","ghost");
  const next = boton("Siguiente →","ghost");
  prev.disabled = idx === 0;
  next.disabled = idx === TECNICAS_FLAT.length - 1;
  prev.onclick = () => { if(idx>0) abrirTecnica(TECNICAS_FLAT[idx-1].id); };
  next.onclick = () => { if(idx<TECNICAS_FLAT.length-1) abrirTecnica(TECNICAS_FLAT[idx+1].id); };
  nav.appendChild(prev); nav.appendChild(next);
  panel.appendChild(nav);

  const actualizarInfo = () => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    info.textContent = n + (n === 1 ? " palabra" : " palabras");
  };
  ta.addEventListener("input", () => {
    actualizarInfo();
    status.classList.add("show");
    clearTimeout(notaTimer);
    notaTimer = setTimeout(() => {
      getProg(t.id).nota = ta.value;
      guardar();
      status.classList.remove("show");
    }, 600);
  });
  actualizarInfo();

  renderEjercicio(t.ejercicio, body, fb, t.id);
  window.scrollTo({top:0, behavior:"smooth"});
  renderMenu(document.getElementById("search").value);
  actualizarProgreso();
}

   ===================================================================== */
function renderEjercicio(ej, cont, fb, techId){
  cont.innerHTML = "";
  fb.className = "feedback";
  if(ej.tipo === "quiz")     renderQuiz(ej, cont, fb, techId);
  if(ej.tipo === "fill")     renderFill(ej, cont, fb, techId);
  if(ej.tipo === "order")    renderOrder(ej, cont, fb, techId);
  if(ej.tipo === "classify") renderClassify(ej, cont, fb, techId);
  if(ej.tipo === "open")     renderOpen(ej, cont, fb, techId);
}
function mostrarFeedback(fb, tipo, titulo, texto){
  fb.className = "feedback " + tipo + " show";
  fb.innerHTML = "";
  fb.appendChild(el("strong", null, titulo));
  fb.appendChild(el("p", null, texto));
}

function renderQuiz(ej, cont, fb, techId){
  const wrap = el("div","opciones");
  const letras = ["A","B","C","D","E"];
  let respondido = false;
  ej.opciones.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.innerHTML = '<span class="letra">' + letras[i] + '</span><span>' + op + '</span>';
    b.onclick = () => {
      if(respondido) return;
      respondido = true;
      const ok = i === ej.correcta;
      Array.from(wrap.children).forEach((c, j) => {
        c.disabled = true;
        if(j === ej.correcta) c.classList.add("correcta");
        if(j === i && !ok) c.classList.add("incorrecta");
      });
      mostrarFeedback(fb, ok ? "ok" : "mal", ok ? "✓ ¡Correcto!" : "✗ Revisa tu respuesta", ej.retro);
      if(ok) marcarCompletada(techId);
      agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
    };
    wrap.appendChild(b);
  });
  cont.appendChild(wrap);
}

function renderFill(ej, cont, fb, techId){
  const partes = ej.texto.split("___");
  const p = el("p","fill-texto");
  const inputs = [];
  partes.forEach((parte, i) => {
    p.appendChild(document.createTextNode(parte));
    if(i < partes.length - 1){
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "hueco"; inp.setAttribute("autocomplete","off");
      inp.addEventListener("keydown", e => { if(e.key === "Enter") comprobar(); });
      p.appendChild(inp); inputs.push(inp);
    }
  });
  cont.appendChild(p);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function comprobar(){
    if(resuelto) return;
    if(inputs.some(i => !i.value.trim())){
      mostrarFeedback(fb,"info","Completa todos los huecos","Escribe una respuesta en cada espacio antes de comprobar.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    inputs.forEach((inp, i) => {
      const validas = (ej.respuestas[i] || []).map(normaliza);
      const ok = validas.includes(normaliza(inp.value));
      inp.classList.add(ok ? "ok" : "mal");
      inp.disabled = true;
      if(ok) aciertos++;
    });
    const total = inputs.length;
    const perfecto = aciertos === total;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Perfecto! " + aciertos + "/" + total : "✗ " + aciertos + " de " + total + " correctas",
      ej.retro + (perfecto ? "" : " · Respuestas válidas: " + ej.respuestas.map((r,i) => (i+1) + ") " + r[0]).join("  ·  ")));
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  }
  btn.onclick = comprobar;
}

function renderOrder(ej, cont, fb, techId){
  const correcto = ej.items.slice();
  let pool = barajar(correcto.map((txt,i) => ({txt, i})));
  const seq = [];

  const wrap = el("div","order-wrap");
  const colA = el("div","order-col");
  colA.appendChild(el("h4", null, "Elementos sueltos"));
  const poolEl = el("div","pool");
  colA.appendChild(poolEl);
  const colB = el("div","order-col");
  colB.appendChild(el("h4", null, "Tu secuencia"));
  const seqEl = el("div","seq");
  colB.appendChild(seqEl);
  wrap.appendChild(colA); wrap.appendChild(colB);
  cont.appendChild(wrap);

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  function pintar(){
    poolEl.innerHTML = ""; seqEl.innerHTML = "";
    pool.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item"; b.textContent = o.txt;
      b.onclick = () => { if(resuelto) return; seq.push(pool.splice(k,1)[0]); pintar(); };
      poolEl.appendChild(b);
    });
    seq.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "ord-item";
      b.innerHTML = '<span class="num">' + (k+1) + '</span><span>' + o.txt + '</span>';
      b.onclick = () => { if(resuelto) return; pool.push(seq.splice(k,1)[0]); pintar(); };
      seqEl.appendChild(b);
    });
  }
  pintar();

  btn.onclick = () => {
    if(resuelto) return;
    if(seq.length !== correcto.length){
      mostrarFeedback(fb,"info","Secuencia incompleta","Pasa todos los elementos a «Tu secuencia».");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    Array.from(seqEl.children).forEach((nodo, k) => {
      const ok = seq[k].i === k;
      nodo.classList.add(ok ? "ok" : "mal");
      if(ok) aciertos++;
    });
    const perfecto = aciertos === correcto.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Secuencia correcta!" : "✗ " + aciertos + " de " + correcto.length + " en su lugar",
      perfecto ? ej.retro : "Empieza por: «" + correcto[0].slice(0,70) + "…». " + ej.retro);
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderClassify(ej, cont, fb, techId){
  const seleccion = new Array(ej.items.length).fill(null);
  ej.items.forEach((it, i) => {
    const row = el("div","cl-item");
    row.appendChild(el("p", null, it.texto));
    const chips = el("div","chips");
    ej.categorias.forEach((cat, ci) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = cat;
      c.onclick = () => {
        if(row.dataset.locked) return;
        seleccion[i] = ci;
        Array.from(chips.children).forEach((x,xi) => x.classList.toggle("sel", xi === ci));
      };
      chips.appendChild(c);
    });
    row.appendChild(chips);
    cont.appendChild(row);
  });

  const acciones = el("div","ej-actions");
  const btn = boton("Comprobar","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  let resuelto = false;
  btn.onclick = () => {
    if(resuelto) return;
    if(seleccion.includes(null)){
      mostrarFeedback(fb,"info","Faltan elementos","Asigna una categoría a cada elemento.");
      return;
    }
    resuelto = true;
    let aciertos = 0;
    cont.querySelectorAll(".cl-item").forEach((fila, i) => {
      fila.dataset.locked = "1";
      const ok = seleccion[i] === ej.items[i].cat;
      fila.classList.add(ok ? "ok" : "mal");
      Array.from(fila.querySelectorAll(".chip")).forEach(c => c.disabled = true);
      if(ok) aciertos++;
      if(!ok){
        const nota = el("div", null, "");
        nota.style.cssText = "flex-basis:100%;font-size:12px;color:#b91c1c;font-weight:700;";
        nota.textContent = "→ Correcto: " + ej.categorias[ej.items[i].cat];
        fila.appendChild(nota);
      }
    });
    const perfecto = aciertos === ej.items.length;
    mostrarFeedback(fb, perfecto ? "ok" : "mal",
      perfecto ? "✓ ¡Clasificación perfecta!" : "✗ " + aciertos + " de " + ej.items.length + " correctas",
      ej.retro || "");
    if(perfecto) marcarCompletada(techId);
    btn.remove();
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function renderOpen(ej, cont, fb, techId){
  const ta = document.createElement("textarea");
  ta.rows = 5; ta.placeholder = "Redacta aquí tu respuesta…";
  cont.appendChild(ta);

  const ul = el("ul","criterios"); ul.style.marginTop = "14px";
  ej.criterios.forEach((c, i) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = "crit_" + techId + "_" + i;
    const lb = document.createElement("label");
    lb.htmlFor = cb.id; lb.textContent = c;
    li.appendChild(cb); li.appendChild(lb);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const mod = el("div","modelo");
  mod.innerHTML = "<strong>Respuesta modelo orientativa</strong>" + ej.modelo;
  cont.appendChild(mod);

  const acciones = el("div","ej-actions");
  const btn = boton("Ver respuesta modelo","primary");
  acciones.appendChild(btn);
  cont.appendChild(acciones);

  btn.onclick = () => {
    if(ta.value.trim().length < 25){
      mostrarFeedback(fb,"info","Escribe primero tu respuesta","Redacta al menos unas líneas antes de comparar con el modelo.");
      return;
    }
    mod.classList.add("show");
    const marcados = cont.querySelectorAll(".criterios input:checked").length;
    const total = ej.criterios.length;
    mostrarFeedback(fb, marcados === total ? "ok" : "info",
      marcados === total ? "✓ Autoevaluación completa" : "Autoevaluación: " + marcados + "/" + total,
      "Compara tu texto con el modelo: ¿qué ideas coinciden? ¿qué te falta? ¿qué aportas tú?");
    btn.textContent = "Ocultar respuesta modelo";
    btn.onclick = () => {
      mod.classList.toggle("show");
      btn.textContent = mod.classList.contains("show") ? "Ocultar respuesta modelo" : "Ver respuesta modelo";
    };
    marcarCompletada(techId);
    agregarReintentar(cont, () => renderEjercicio(ej, cont, fb, techId));
  };
}

function agregarReintentar(cont, fn){
  const acciones = cont.querySelector(".ej-actions") || cont;
  const b = boton("↺ Intentar de nuevo","ghost");
  b.style.marginTop = "10px";
  b.onclick = fn;
  acciones.appendChild(b);
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
function marcarCompletada(id){
  const p = getProg(id);
  if(!p.ok){
    p.ok = true; guardar();
    actualizarProgreso();
    renderMenu(document.getElementById("search").value);
    const block = CATEGORIAS.find(c => c.tecnicas.some(t => t.id === id));
    if(block){
      document.querySelectorAll(".bdot").forEach((d,i) => {
        if(block.tecnicas[i]) d.classList.toggle("done", getProg(block.tecnicas[i].id).ok);
      });
    }
  }
}
function actualizarProgreso(){
  const total = TECNICAS_FLAT.length;
  const hechas = TECNICAS_FLAT.filter(t => getProg(t.id).ok).length;
  document.getElementById("progressText").textContent = hechas + " / " + total;
  document.getElementById("progressFill").style.width = (hechas/total*100) + "%";
}

/* =====================================================================
   SIDEBAR / BÚSQUEDA / RESET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
function cerrarSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("btnMenu").onclick = () => {
  sidebar.classList.toggle("open");
  scrim.classList.toggle("show", sidebar.classList.contains("open"));
};
scrim.onclick = cerrarSidebar;

document.getElementById("search").addEventListener("input", e => {
  renderMenu(e.target.value);
  if(e.target.value.trim()){
    document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
  }
});

document.getElementById("btnReset").onclick = () => {
  if(confirm("¿Borrar todo el progreso y las notas del cuaderno? Esta acción no se puede deshacer.")){
    progreso = {}; guardar();
    abrirTecnica(TECNICAS_FLAT[0].id);
  }
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
renderMenu("");
abrirTecnica(actualId);
actualizarProgreso();
</script>
