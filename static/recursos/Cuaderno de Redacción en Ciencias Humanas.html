<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Redacción en Ciencias Humanas · 100 técnicas (6.º a 11.º)</title>
<style>
  :root{
    --bg:#e8eef0;
    --paper:#fdfbf6;
    --paper-2:#f4f7f8;
    --ink:#152528;
    --muted:#5c6f73;
    --line:#cfdbdd;
    --line-2:#b4c5c8;
    --accent:#0f766e;
    --accent-dark:#115e59;
    --accent-soft:#ccfbf1;
    --brick:#9a3412;
    --brick-dark:#7c2d12;
    --brick-soft:#fee2d5;
    --ok:#15803d;
    --ok-soft:#dcfce7;
    --bad:#b91c1c;
    --bad-soft:#fee2e2;
    --radius:16px;
    --shadow:0 2px 4px rgba(15,50,55,.06), 0 12px 30px rgba(15,50,55,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    background:
      radial-gradient(circle at 15% 0%, #f3f7f8 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px;
    background:rgba(253,251,246,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    font-size:22px; line-height:1; font-weight:800;
    background:var(--accent-soft);
    border:1px solid #7dd3c8;
    border-radius:12px;
    width:44px; height:44px;
    display:grid; place-items:center;
    color:var(--accent-dark);
    flex:0 0 auto;
  }
  .brand h1{font-size:15.5px; margin:0; font-weight:800; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:system-ui,sans-serif;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); font-family:system-ui,sans-serif;}
  .topbar-actions{display:flex; align-items:center; gap:12px; flex:0 0 auto;}

  .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:600; font-family:system-ui,sans-serif;}
  .progress-bar{width:140px; height:8px; border-radius:99px; background:#d6e0e1; overflow:hidden;}
  #progressFill{height:100%; width:0%; background:linear-gradient(90deg,#0f766e,#9a3412); transition:width .4s;}

  .btn{
    font-family:system-ui,sans-serif; font-size:13px; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line-2); background:#fff; color:var(--ink);
    transition:.16s;
  }
  .btn:hover{background:#eef5f5; border-color:#8fa8aa;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent;}
  .only-mobile{display:none;}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:22px;
    max-width:1400px;
    margin:0 auto;
    padding:22px;
    align-items:start;
  }

  .sidebar{
    position:sticky; top:82px;
    max-height:calc(100vh - 106px);
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  #search{
    width:100%; font-family:system-ui,sans-serif; font-size:13px;
    padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-2); background:#f4f7f8; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent); background:#fff;}

  .cat{margin-bottom:6px;}
  .cat-head{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    padding:10px; border-radius:10px;
    font-size:13.4px; font-weight:800; color:var(--ink);
    font-family:system-ui,sans-serif;
  }
  .cat-head:hover{background:#eef5f5;}
  .cat-head .chev{margin-left:auto; font-size:11px; color:var(--muted); transition:transform .25s;}
  .cat.open .chev{transform:rotate(90deg);}
  .cat-count{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    background:var(--brick-soft); color:var(--brick-dark);
    padding:2px 8px; border-radius:99px;
  }
  .cat-bar{height:4px; border-radius:99px; background:#dce5e6; margin:0 10px 6px; overflow:hidden;}
  .cat-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--brick)); transition:width .4s;}
  .cat-body{display:none; padding:2px 0 8px 6px;}
  .cat.open .cat-body{display:block;}
  .cat-desc{font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); padding:0 10px 8px; line-height:1.45;}
  .tech-link{
    display:flex; align-items:flex-start; gap:8px;
    width:100%; text-align:left; cursor:pointer;
    background:none; border:none; font:inherit;
    font-size:12.8px; line-height:1.35; color:#2c3f42;
    padding:8px 10px; border-radius:9px;
    border-left:3px solid transparent;
    font-family:system-ui,sans-serif;
  }
  .tech-link:hover{background:#eef5f5;}
  .tech-link.active{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-dark); font-weight:700;}
  .tech-link .dot{
    flex:0 0 auto; width:15px; height:15px; margin-top:2px;
    border-radius:50%; border:1.6px solid var(--line-2);
    display:grid; place-items:center; font-size:9px; color:transparent;
  }
  .tech-link.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 30px 30px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--brick));
  }
  .tech-head{margin-bottom:18px;}
  .badge{
    display:inline-block; font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase;
    color:var(--accent-dark); background:var(--accent-soft);
    border:1px solid #7dd3c8; padding:4px 10px; border-radius:99px;
    margin-bottom:10px;
  }
  .tech-head h2{margin:0; font-size:24px; line-height:1.22; letter-spacing:-.4px; font-weight:800;}
  .tech-pos{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  .block-dots{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .bdot{
    width:12px; height:12px; border-radius:50%;
    border:1.6px solid var(--line-2); background:#fff;
    cursor:pointer; transition:.15s;
  }
  .bdot:hover{transform:scale(1.25); border-color:var(--accent);}
  .bdot.done{background:var(--ok); border-color:var(--ok);}
  .bdot.current{box-shadow:0 0 0 3px rgba(15,118,110,.22); border-color:var(--accent);}

  /* flashcard · papel con líneas horizontales tenues */
  .flashcard{perspective:1600px; margin:18px 0 10px; cursor:pointer;}
  .fc-inner{
    position:relative;
    min-height:clamp(280px, 36vh, 340px);
    transform-style:preserve-3d;
    transition:transform .68s cubic-bezier(.4,.15,.2,1);
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:14px; padding:22px 26px 22px 46px;
    display:flex; flex-direction:column; overflow:auto;
    background-color:#fffdf8;
    background-image:
      linear-gradient(transparent 27px, rgba(15,118,110,.14) 27px 28px);
    background-size:100% 28px;
    background-position:0 14px;
    box-shadow:inset 22px 0 0 -21px #d99a78;
  }
  .fc-front{border:1px solid var(--line-2);}
  .fc-back{
    transform:rotateY(180deg);
    border:1px solid #7dd3c8;
    background-color:#f3fbf9;
    box-shadow:inset 22px 0 0 -21px #5eb0a4;
  }
  .fc-tag{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    margin-bottom:12px; display:block;
  }
  .fc-back .fc-tag{color:var(--accent-dark);}
  .fc-face p{margin:0; font-size:15.5px; line-height:28px; color:#1a2d30;}
  .fc-back p{color:#0d3a36;}
  .fc-hint{
    margin-top:auto; padding-top:14px;
    font-family:system-ui,sans-serif; font-size:11.5px; color:#94a8aa; font-weight:600;
  }
  .flip-btn{margin-bottom:26px;}

  .sec-title{
    display:flex; align-items:center; gap:9px;
    font-size:15px; font-weight:800; letter-spacing:-.1px;
    margin:0 0 12px; padding-bottom:9px;
    border-bottom:2px solid var(--line);
    font-family:system-ui,sans-serif;
  }
  .sec-title span{font-size:12px; font-weight:600; color:var(--muted); margin-left:auto;}

  .consigna{
    font-size:15px; line-height:1.6; color:#2a3f42;
    background:#f4f7f8; border-left:3px solid var(--line-2);
    padding:12px 16px; border-radius:0 10px 10px 0; margin:0 0 16px;
  }

  .opciones{display:flex; flex-direction:column; gap:9px;}
  .opcion{
    display:flex; gap:11px; align-items:flex-start;
    text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    background:#fff; border:1.5px solid var(--line-2);
    color:var(--ink); padding:13px 15px; border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .opcion:hover:not(:disabled){border-color:var(--accent); background:#f3fbf9; transform:translateX(2px);}
  .opcion:disabled{cursor:default; opacity:.9;}
  .opcion .letra{
    flex:0 0 auto; width:23px; height:23px; border-radius:7px;
    background:#dce5e6; color:var(--muted);
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:800;
  }
  .opcion.correcta{border-color:var(--ok); background:var(--ok-soft);}
  .opcion.correcta .letra{background:var(--ok); color:#fff;}
  .opcion.incorrecta{border-color:var(--bad); background:var(--bad-soft);}
  .opcion.incorrecta .letra{background:var(--bad); color:#fff;}

  .fill-texto{font-size:16px; line-height:2.4; margin:0 0 16px; color:#1a2d30;}
  .hueco{
    font:inherit; font-size:15px;
    border:none; border-bottom:2px dashed var(--brick);
    background:#fdf1ea; color:var(--brick-dark); font-weight:700;
    padding:3px 8px; min-width:130px; text-align:center;
    outline:none; border-radius:6px 6px 0 0;
  }
  .hueco:focus{background:#fee2d5; border-bottom-style:solid;}
  .hueco.ok{border-bottom-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .hueco.mal{border-bottom-color:var(--bad); color:var(--bad); background:var(--bad-soft); text-decoration:line-through;}

  .order-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .order-col h4{font-family:system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin:0 0 9px;}
  .pool, .seq{min-height:120px; border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:8px;}
  .pool{background:#eff4f5; border:1.5px dashed var(--line-2);}
  .seq{background:#f3fbf9; border:1.5px solid #7dd3c8;}
  .pool:empty::after, .seq:empty::after{content:"…"; color:#b4c5c8; font-size:20px; text-align:center; margin:auto;}
  .ord-item{
    font:inherit; font-size:13.6px; line-height:1.42; text-align:left;
    background:#fff; border:1.5px solid var(--line-2);
    padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
    transition:.15s; display:flex; gap:9px; align-items:flex-start;
  }
  .ord-item:hover{border-color:var(--accent); background:#f3fbf9;}
  .seq .ord-item{border-color:#7dd3c8;}
  .seq .ord-item .num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:800;
  }
  .ord-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .ord-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .cl-item{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--line-2);
    border-radius:12px; padding:12px 14px; margin-bottom:9px;
  }
  .cl-item p{margin:0; font-size:14.2px; line-height:1.45; flex:1 1 260px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:system-ui,sans-serif; font-size:11.5px; font-weight:700;
    padding:6px 11px; border-radius:99px; cursor:pointer;
    border:1.5px solid var(--line-2); background:#eff4f5; color:var(--muted);
    transition:.14s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-dark);}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cl-item.ok{border-color:var(--ok); background:var(--ok-soft);}
  .cl-item.mal{border-color:var(--bad); background:var(--bad-soft);}

  .criterios{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:7px;}
  .criterios li{display:flex; gap:10px; align-items:flex-start; font-family:system-ui,sans-serif; font-size:13px; color:#3d5155; line-height:1.5;}
  .criterios input{margin-top:2px; accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}

  textarea{
    width:100%; font-family:inherit; font-size:15px; line-height:27px;
    color:#1a2d30; padding:12px 16px;
    border:1px solid var(--line-2); border-radius:12px;
    background-color:#fffdf8;
    background-image:linear-gradient(transparent 26px, rgba(15,118,110,.14) 26px 27px);
    background-size:100% 27px; background-attachment:local;
    resize:vertical; outline:none;
  }
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,118,110,.12);}
  textarea::placeholder{color:#94a8aa; font-style:italic;}

  .feedback{margin-top:16px; border-radius:12px; padding:0; overflow:hidden; max-height:0; opacity:0; transition:.3s;}
  .feedback.show{max-height:600px; opacity:1; padding:14px 17px;}
  .feedback.ok{background:var(--ok-soft); border:1px solid #86efac; color:#14532d;}
  .feedback.mal{background:var(--bad-soft); border:1px solid #fca5a5; color:#7f1d1d;}
  .feedback.info{background:var(--brick-soft); border:1px solid #fdba74; color:#7c2d12;}
  .feedback strong{display:block; font-family:system-ui,sans-serif; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  .feedback p{margin:0; font-size:14.4px; line-height:1.6;}

  .ej-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:4px;}

  .modelo{
    display:none; margin-top:14px;
    background:#f4f7f8; border-left:3px solid var(--brick);
    padding:13px 16px; border-radius:0 10px 10px 0;
    font-size:14.4px; line-height:1.65; color:#7c2d12;
  }
  .modelo.show{display:block; animation:fade .3s ease;}
  .modelo strong{font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--brick); display:block; margin-bottom:5px;}
  @keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  .cuaderno{margin-top:32px; padding-top:22px; border-top:2px solid var(--line);}
  .cuaderno-foot{display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:11.5px; color:var(--muted); margin-top:8px; font-weight:600;}
  #notaStatus{color:var(--ok); font-weight:700; opacity:0; transition:opacity .3s;}
  #notaStatus.show{opacity:1;}

  .nav-foot{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .nav-foot .btn{flex:1; max-width:220px; text-align:center;}
  .nav-foot .btn:disabled{opacity:.35; cursor:not-allowed;}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr; padding:14px; gap:14px;}
    .only-mobile{display:inline-block;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:300px; max-height:100vh;
      z-index:100; border-radius:0 18px 18px 0;
      transform:translateX(-105%); transition:transform .28s ease;
      padding-top:18px;
    }
    .sidebar.open{transform:none;}
    .scrim{position:fixed; inset:0; background:rgba(15,50,55,.45); z-index:99; opacity:0; pointer-events:none; transition:.25s;}
    .scrim.show{opacity:1; pointer-events:auto;}
    .panel{padding:20px 18px 24px;}
    .tech-head h2{font-size:20px;}
    .order-wrap{grid-template-columns:1fr;}
    .progress-wrap{display:none;}
    .brand p{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🏛️</div>
    <div>
      <h1>Cuaderno de Redacción en Ciencias Humanas · 6.º a 11.º</h1>
      <p>100 técnicas · 10 bloques · sintaxis, puntuación, ortografía y estilo universitario</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnMenu" class="btn ghost only-mobile">☰ Bloques</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 100</span>
    </div>
    <button id="btnReset" class="btn ghost">Reiniciar</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <input id="search" type="search" placeholder="🔎 Buscar técnica…" autocomplete="off">
    <nav id="menu"></nav>
  </aside>
  <main class="main">
    <article id="panel" class="panel"></article>
  </main>
</div>
<div id="scrim" class="scrim"></div>

<script>
/* =====================================================================
   100 TÉCNICAS · REDACCIÓN EN CIENCIAS HUMANAS · 10 BLOQUES
   ===================================================================== */
const CATEGORIAS = [

/* ============ BLOQUE 1 · FUNDAMENTOS ============ */
{
  id:"b1", nombre:"Fundamentos de la escritura humanística", emoji:"📖",
  desc:"Claridad, precisión conceptual, interdisciplinariedad y función crítica.",
  tecnicas:[
    {id:"h1", nombre:"Claridad conceptual",
     concepto:"La claridad en Ciencias Humanas exige definir los conceptos clave antes de usarlos. Palabras como «cultura», «poder», «identidad» o «discurso» tienen múltiples sentidos: sin precisión, el texto se vuelve ambiguo.",
     ejemplo:"En lugar de usar «cultura» sin más, se precisa: «Entiendo cultura en el sentido de Clifford Geertz: una red de significados que los seres humanos tejen y que orienta su acción».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Por qué es esencial definir los conceptos en Ciencias Humanas?",
       opciones:["Porque lo exige la RAE","Porque muchos conceptos tienen múltiples sentidos y sin definición el texto se vuelve ambiguo","Porque alarga el texto","Porque los profesores lo piden"],
       correcta:1,
       retro:"En Ciencias Humanas, los conceptos son polisémicos. Definirlos es parte del rigor: sin definición, el lector no sabe de qué se habla."}},

    {id:"h2", nombre:"Precisión terminológica",
     concepto:"Los términos de las Ciencias Humanas tienen historia y matices: «poder» no es lo mismo que «dominación» o «autoridad»; «identidad» no es «identificación»; «discurso» no es «lenguaje». Usarlos como sinónimos es un error conceptual.",
     ejemplo:"En Foucault, «poder» no es solo represión: es una relación productiva que atraviesa el cuerpo social. No es sinónimo de «violencia» ni de «dominación» en sentido weberiano.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada término según su matiz conceptual.",
       categorias:["Poder (relación)","Dominación (imposición)","Autoridad (legitimidad)"],
       items:[
         {texto:"Relación productiva que atraviesa el cuerpo social (Foucault).", cat:0},
         {texto:"Imposición estable de un orden (Weber).", cat:1},
         {texto:"Poder legítimamente reconocido.", cat:2},
         {texto:"Capacidad de acción sobre otros.", cat:0},
         {texto:"Obediencia sin cuestionamiento.", cat:1}
       ],
       retro:"Poder, dominación y autoridad no son sinónimos. Precisar cada término es un deber del redactor en Ciencias Humanas."}},

    {id:"h3", nombre:"Perspectiva interdisciplinaria",
     concepto:"Las Ciencias Humanas cruzan saberes: historia, sociología, antropología, filosofía, lingüística, psicología, literatura. Un buen texto humanístico articula varias miradas sin diluir ninguna.",
     ejemplo:"Un análisis de la violencia en Colombia puede combinar historia (contexto), sociología (estructuras), antropología (significados), filosofía (ética) y literatura (testimonios).",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pregunta según su disciplina principal.",
       categorias:["Historia","Sociología","Antropología","Filosofía"],
       items:[
         {texto:"¿Cómo cambió el conflicto armado entre 1980 y 2000?", cat:0},
         {texto:"¿Qué estructuras sociales sostienen la desigualdad?", cat:1},
         {texto:"¿Qué significados tiene la tierra para una comunidad campesina?", cat:2},
         {texto:"¿Qué fundamentos éticos orientan la justicia transicional?", cat:3},
         {texto:"¿Cómo se narra la memoria del desplazamiento?", cat:2}
       ],
       retro:"Cada disciplina aporta una mirada. La riqueza de las Ciencias Humanas está en su cruce, no en su aislamiento."}},

    {id:"h4", nombre:"Función crítica del texto humanístico",
     concepto:"El texto en Ciencias Humanas no solo describe: interpreta, cuestiona y problematiza. Busca desnaturalizar lo que se presenta como evidente y mostrar los supuestos que sostienen las prácticas sociales.",
     ejemplo:"En lugar de decir «la pobreza es un problema natural», el texto crítico pregunta: «¿Qué relaciones sociales producen y sostienen la pobreza? ¿A quién beneficia esa naturalización?».",
     ejercicio:{tipo:"fill",
       consigna:"Transforma la afirmación en pregunta crítica.",
       texto:"«La violencia es natural en el ser humano» → «¿Qué ___ sociales producen y sostienen la violencia?»",
       respuestas:[["relaciones","estructuras","condiciones","practicas","prácticas"]],
       retro:"La mirada crítica desnaturaliza: convierte lo que parece evidente en problema. Ese es el aporte de las Ciencias Humanas."}},

    {id:"h5", nombre:"Reconocer la posición del autor",
     concepto:"El texto humanístico reconoce que todo autor habla desde algún lugar: disciplinar, ideológico, histórico, biográfico. La objetividad no es ausencia de posición, sino explicitud de la perspectiva.",
     ejemplo:"«Escribo desde la historia social y con una simpatía explícita por las víctimas del conflicto. Esa posición orienta mis preguntas, aunque no exime del rigor documental».",
     ejercicio:{tipo:"fill",
       consigna:"Reconoce la posición del autor.",
       texto:"«Escribo desde la ___, con un interés explícito por las voces subalternas. Mi posición orienta mis preguntas y exige ___ documental».",
       respuestas:[["historia","sociologia","sociología","antropologia","antropología","filosofia","filosofía"],["rigor","cuidado","control","verificacion","verificación"]],
       retro:"Reconocer la propia posición no invalida el texto: lo vuelve honesto. La posición explícita es parte del rigor."}},

    {id:"h6", nombre:"Contextualización histórica",
     concepto:"Los textos humanísticos sitúan sus objetos en contexto: época, lugar, condiciones sociales, tradiciones intelectuales. Sin contexto, las afirmaciones quedan flotando y pierden sentido.",
     ejemplo:"Afirmar «la familia está en crisis» exige precisar: ¿qué modelo de familia?, ¿en qué época?, ¿según qué indicadores?, ¿en qué contexto social?",
     ejercicio:{tipo:"fill",
       consigna:"Contextualiza la afirmación.",
       texto:"«La familia está en crisis» → «El modelo de familia ___ en el siglo XX en contextos urbanos presenta transformaciones desde ___».",
       respuestas:[["nuclear","burgues","burgués","tradicional","occidental"],["1970","1960","1980","los anos sesenta","los años sesenta","la segunda mitad del siglo XX"]],
       retro:"Contextualizar es situar: época, lugar, condiciones sociales. Sin contexto, las afirmaciones en Ciencias Humanas no son verificables."}},

    {id:"h7", nombre:"Interlocución con la tradición",
     concepto:"El texto humanístico dialoga con autores, corrientes y debates previos. No se escribe en el vacío: se escribe en una conversación que ya lleva siglos. Reconocer esa conversación es parte del oficio.",
     ejemplo:"Un texto sobre identidad dialoga con Erikson, Hall, Butler, García Canclini. No ignora lo que se ha dicho antes: lo discute, lo amplía o lo critica.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el diálogo con la tradición.",
       texto:"«Mi reflexión sobre la identidad dialoga con ___, ___ y ___, y se distancia de ___ en el punto ___».",
       respuestas:[["hall","Hall","erikson","Erikson","butler","Butler","garcia canclini","García Canclini"],["hall","Hall","erikson","Erikson","butler","Butler","garcia canclini","García Canclini"],["hall","Hall","erikson","Erikson","butler","Butler","garcia canclini","García Canclini"],["hall","Hall","erikson","Erikson","butler","Butler","garcia canclini","García Canclini"],["genero","género","clase","raza","etnicidad","performidad","performatividad"]],
       retro:"Ningún texto humanístico comienza de cero. Reconocer el diálogo con la tradición es parte del rigor."}},

    {id:"h8", nombre:"Registro académico-crítico",
     concepto:"El registro académico en Ciencias Humanas es formal, culto y riguroso, pero también puede ser personal y comprometido. No se trata de neutralidad, sino de precisión y honestidad.",
     ejemplo:"No se escribe «la gente piensa que la historia es aburrida»; se escribe «la historia como disciplina enfrenta un desafío de legitimación frente a públicos amplios».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión como registro académico-crítico o coloquial.",
       categorias:["Académico-crítico","Coloquial"],
       items:[
         {texto:"«La historia enfrenta un desafío de legitimación.»", cat:0},
         {texto:"«La historia es aburrida, la verdad.»", cat:1},
         {texto:"«Se observa una tensión entre memoria y discurso histórico.»", cat:0},
         {texto:"«La gente no lee, y ya.»", cat:1},
         {texto:"«El concepto de nación es problematizado por la crítica poscolonial.»", cat:0}
       ],
       retro:"El registro académico en Ciencias Humanas es riguroso pero también comprometido. La formalidad no excluye la voz propia."}},

    {id:"h9", nombre:"Argumentación en Ciencias Humanas",
     concepto:"Argumentar no es afirmar con énfasis: es ofrecer razones, evidencia, ejemplos y reconocer objeciones. El texto humanístico construye un razonamiento complejo que resiste la objeción.",
     ejemplo:"En lugar de «la escuela reproduce la desigualdad», se argumenta: «La escuela reproduce la desigualdad porque los currículos, las prácticas evaluativas y la distribución del capital cultural favorecen a quienes ya poseen ventajas sociales (Bourdieu, 1979)».",
     ejercicio:{tipo:"fill",
       consigna:"Convierte la afirmación en argumentación.",
       texto:"«La escuela reproduce la desigualdad» → «La escuela reproduce la desigualdad porque ___, ___ y ___ favorecen a quienes ya tienen ventajas».",
       respuestas:[["los curriculos","los currículos","el curriculo","el currículo","las practicas","las prácticas","los contenidos"],["las practicas evaluativas","las prácticas evaluativas","la evaluacion","la evaluación","los criterios"],["la distribucion del capital cultural","la distribución del capital cultural","el capital cultural","la cultura escolar"]],
       retro:"Argumentar es dar razones. En Ciencias Humanas, la argumentación se apoya en teoría, evidencia y reconocimiento de objeciones."}},

    {id:"h10", nombre:"Escritura como forma de pensamiento",
     concepto:"En Ciencias Humanas, escribir no es solo comunicar lo pensado: es pensar. La escritura permite descubrir contradicciones, articular ideas dispersas y construir el objeto de estudio.",
     ejemplo:"Un investigador puede empezar a escribir sin tener clara su tesis. Al escribir, la tesis emerge, se precisa, se transforma. Escribir es investigar.",
     ejercicio:{tipo:"open",
       consigna:"¿Cómo puede la escritura ayudarte a pensar en Ciencias Humanas? Responde en 3-4 líneas.",
       criterios:[
         "Expliqué al menos una manera en que la escritura ayuda a pensar.",
         "Relacioné la escritura con el trabajo intelectual en Ciencias Humanas.",
         "Mencioné algún tipo de texto o práctica concreta."
       ],
       modelo:"Escribir me ayuda a descubrir lo que pienso. Cuando empiezo un ensayo, muchas veces creo tener una idea clara; al escribir, me doy cuenta de que había contradicciones o vacíos que no había visto. La escritura es como un espejo: me muestra lo que realmente sostengo. Por eso escribo primero sin corregir, para dejar salir las ideas, y después vuelvo sobre el texto para ordenarlo y precisarlo."}}
  ]
},

/* ============ BLOQUE 2 · SINTAXIS ============ */
{
  id:"b2", nombre:"Sintaxis y oración", emoji:"🧱",
  desc:"Orden, longitud, voz, subordinación, coordinación y concordancia en el texto humanístico.",
  tecnicas:[
    {id:"h11", nombre:"Orden lógico: SVO",
     concepto:"El orden Sujeto + Verbo + Objeto es la base de la claridad. En Ciencias Humanas, donde los conceptos son complejos, respetar el orden natural ayuda al lector a seguir el razonamiento. Los hipérbatos solo se justifican por énfasis.",
     ejemplo:"Orden lógico: «Weber distingue cuatro tipos de acción social». Orden alterado: «Cuatro tipos de acción social, Weber, distingue».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden lógico.",
       texto:"Palabras: «Foucault / el poder / analizó» → «Foucault ___ el poder».",
       respuestas:[["analizo","analizó"]],
       retro:"El orden SVO es la base de la claridad. En textos donde los conceptos son complejos, la sintaxis clara es un deber."}},

    {id:"h12", nombre:"Oraciones cortas y pensamiento complejo",
     concepto:"Las oraciones cortas (20-25 palabras) no empobrecen el pensamiento: lo hacen más preciso. Las ideas complejas se construyen con varias oraciones cortas, no con una interminable.",
     ejemplo:"En vez de una oración de 60 palabras sobre la posmodernidad, se divide en tres: «La posmodernidad cuestiona los grandes relatos. Lyotard lo formuló así en 1979. Su crítica alcanza a la ciencia y a la política».",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál es la longitud recomendada de una oración en Ciencias Humanas?",
       opciones:["Hasta 50 palabras","Entre 20 y 25 palabras","Al menos 40 palabras","No hay límite"],
       correcta:1,
       retro:"Las oraciones cortas no empobrecen: precisan. La complejidad del pensamiento se construye con varias oraciones, no con una sola larga."}},

    {id:"h13", nombre:"Voz activa vs. voz pasiva",
     concepto:"La voz activa es más clara y directa. En Ciencias Humanas, donde es importante saber quién hace qué, la voz activa permite identificar al agente: autor, sujeto histórico, institución.",
     ejemplo:"Pasiva: «La teoría fue formulada por Bourdieu». Activa: «Bourdieu formuló la teoría de los campos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada oración según la voz.",
       categorias:["Voz activa","Voz pasiva"],
       items:[
         {texto:"«Bourdieu formuló la teoría de los campos.»", cat:0},
         {texto:"«La teoría de los campos fue formulada por Bourdieu.»", cat:1},
         {texto:"«Los movimientos sociales transformaron la Constitución.»", cat:0},
         {texto:"«La Constitución fue transformada por los movimientos sociales.»", cat:1},
         {texto:"«Freire propuso una pedagogía crítica.»", cat:0}
       ],
       retro:"La voz activa identifica al agente. En Ciencias Humanas, saber quién hace qué es parte del análisis."}},

    {id:"h14", nombre:"Gerundios: evitar el abuso",
     concepto:"El gerundio de posterioridad es incorrecto. En textos humanísticos se prefiere el verbo conjugado. El gerundio de simultaneidad («pensando, escribía») sí es válido.",
     ejemplo:"Incorrecto: «El autor analizó la obra, concluyendo que era revolucionaria». Correcto: «El autor analizó la obra y concluyó que era revolucionaria».",
     ejercicio:{tipo:"fill",
       consigna:"Sustituye el gerundio por un verbo conjugado.",
       texto:"«Lyotard cuestionó los grandes relatos, inaugurando una nueva época» → «Lyotard cuestionó los grandes relatos e ___ una nueva época».",
       respuestas:[["inauguro","inauguró"]],
       retro:"El gerundio de posterioridad es incorrecto. Se sustituye por un verbo conjugado o por una oración de relativo."}},

    {id:"h15", nombre:"Subordinación en el texto argumentativo",
     concepto:"La subordinación es necesaria para matizar y precisar, pero su abuso oscurece. Se recomienda equilibrar: oraciones simples para afirmar, subordinadas para matizar.",
     ejemplo:"Excesivo: «El autor que analizó la obra que revolucionó el pensamiento que dominaba la época que precedió a la guerra...». Adecuado: «El autor analizó la obra. Esta revolucionó el pensamiento dominante antes de la guerra».",
     ejercicio:{tipo:"fill",
       consigna:"Divide la oración en dos más cortas.",
       texto:"«El historiador que estudió el archivo que contiene documentos del conflicto publicó un libro» → «El historiador estudió el archivo del conflicto. Después ___ un libro».",
       respuestas:[["publico","publicó"]],
       retro:"La subordinación excesiva oscurece. Se recomienda equilibrar: oraciones simples para afirmar, subordinadas para matizar."}},

    {id:"h16", nombre:"Coordinación en enumeraciones conceptuales",
     concepto:"La coordinación une elementos paralelos: corrientes, autores, conceptos, ejemplos. En Ciencias Humanas es frecuente al presentar clasificaciones o tipologías.",
     ejemplo:"«Weber distingue cuatro tipos de acción social: racional con arreglo a fines; racional con arreglo a valores; afectiva; y tradicional».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su tipo de coordinación.",
       categorias:["Copulativa","Adversativa","Disyuntiva"],
       items:[
         {texto:"y", cat:0},
         {texto:"pero", cat:1},
         {texto:"o", cat:2},
         {texto:"e", cat:0},
         {texto:"sino", cat:1}
       ],
       retro:"La coordinación copulativa suma; la adversativa opone; la disyuntiva presenta alternativas."}},

    {id:"h17", nombre:"Concordancia gramatical",
     concepto:"La concordancia exige que sujeto y verbo coincidan en número y persona, y que sustantivo y adjetivo coincidan en género y número. Su ruptura produce agramaticalidad y afecta la credibilidad del texto.",
     ejemplo:"Incorrecto: «Los autores analizó la obra». Correcto: «Los autores analizaron la obra».",
     ejercicio:{tipo:"fill",
       consigna:"Corrige la concordancia.",
       texto:"«Los conceptos de poder y dominación fue desarrollado por Weber» → «Los conceptos de poder y dominación ___ desarrollados por Weber».",
       respuestas:[["fueron","fue"]],
       retro:"El sujeto compuesto exige verbo en plural. La concordancia es obligatoria en todo el texto."}},

    {id:"h18", nombre:"Evitar hipérbaton",
     concepto:"El hipérbaton altera el orden natural. En Ciencias Humanas, se evita salvo cuando se busca un efecto enfático específico. El lector debe poder seguir el razonamiento sin obstáculos sintácticos.",
     ejemplo:"Hipérbaton: «De la modernidad, los grandes relatos, Lyotard, cuestionó». Orden natural: «Lyotard cuestionó los grandes relatos de la modernidad».",
     ejercicio:{tipo:"fill",
       consigna:"Ordena la oración según el orden natural.",
       texto:"Palabras: «la identidad / Hall / problematizó» → «Hall ___ la identidad».",
       respuestas:[["problematizo","problematizó"]],
       retro:"El hipérbaton innecesario oscurece. En textos argumentativos, la claridad sintáctica es esencial."}},

    {id:"h19", nombre:"Párrafos: una idea por párrafo",
     concepto:"Cada párrafo desarrolla una idea principal. En Ciencias Humanas, donde los argumentos son densos, respetar esta regla es esencial. La extensión recomendada es de 80-150 palabras.",
     ejemplo:"Un párrafo para presentar el concepto de «campo» en Bourdieu, otro para la «violencia simbólica», otro para un ejemplo etnográfico.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuántas ideas principales debe desarrollar cada párrafo?",
       opciones:["Todas las relacionadas con el tema","Una sola idea principal","Al menos tres","No importa cuántas"],
       correcta:1,
       retro:"Un párrafo = una idea. Si aparece otra, se abre un nuevo párrafo. Es la base de la organización argumentativa."}},

    {id:"h20", nombre:"Referencias anafóricas",
     concepto:"Los pronombres remiten a antecedentes. En textos humanísticos, donde circulan varios autores y conceptos, la ambigüedad referencial es frecuente. Se debe repetir el sustantivo cuando hay duda.",
     ejemplo:"Ambiguo: «Bourdieu criticó a Foucault y luego reconoció su influencia». ¿«Su» = Bourdieu o Foucault? Claro: «...y luego reconoció la influencia de Foucault».",
     ejercicio:{tipo:"fill",
       consigna:"Elimina la ambigüedad repitiendo el sustantivo.",
       texto:"«Habermas discutió con Foucault sobre su noción de poder» → «Habermas discutió con Foucault sobre la noción de poder de ___».",
       respuestas:[["foucault","Foucault"]],
       retro:"Repetir el sustantivo elimina la ambigüedad. En textos donde circulan varios autores, la precisión referencial es esencial."}}
  ]
},

/* ============ BLOQUE 3 · PUNTUACIÓN ============ */
{
  id:"b3", nombre:"Puntuación humanística", emoji:"✒️",
  desc:"Coma, punto y coma, dos puntos, paréntesis, comillas y guiones en el texto académico.",
  tecnicas:[
    {id:"h21", nombre:"Coma en enumeraciones conceptuales",
     concepto:"La coma separa elementos de una enumeración. En Ciencias Humanas es frecuente al listar corrientes, autores o dimensiones de análisis. El último elemento se une con «y» u «o».",
     ejemplo:"«Se analizarán la dimensión histórica, la dimensión social, la dimensión cultural y la dimensión política del fenómeno».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca las comas donde correspondan.",
       texto:"«Se estudiarán los conceptos de poder de cultura y de identidad» → «Se estudiarán los conceptos de poder___ de cultura___ y de identidad».",
       respuestas:[[","],[","]],
       retro:"Los elementos de una enumeración se separan con coma. El último se une con «y» sin coma previa."}},

    {id:"h22", nombre:"Coma vocativa",
     concepto:"El vocativo se separa con coma. En textos humanísticos, aparece en citas de diálogo, cartas académicas y textos que se dirigen a un interlocutor.",
     ejemplo:"«Estimado profesor, adjunto el ensayo revisado». En diálogo: «María, dijo el sociólogo, la modernidad no es un bloque».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca la coma del vocativo.",
       texto:"«Estimado profesor___ adjunto el ensayo revisado».",
       respuestas:[[","]],
       retro:"El vocativo siempre se separa con coma. Es un error frecuente en cartas y textos de presentación."}},

    {id:"h23", nombre:"Punto y coma en series complejas",
     concepto:"Cuando los elementos de una serie son extensos o tienen puntuación interna, se separan con punto y coma. Es frecuente en textos con autores, obras y años entre paréntesis.",
     ejemplo:"«Se revisaron las obras de Bourdieu (1979), sobre la distinción; de Foucault (1975), sobre la disciplina; y de Elias (1939), sobre el proceso civilizatorio».",
     ejercicio:{tipo:"fill",
       consigna:"Separa los elementos con punto y coma.",
       texto:"«Se revisaron Bourdieu (1979)___ Foucault (1975)___ y Elias (1939)».",
       respuestas:[[";"],[";"]],
       retro:"En series con puntuación interna (autor, año, obra), se usa punto y coma entre elementos."}},

    {id:"h24", nombre:"Dos puntos: citas y conclusiones",
     concepto:"Los dos puntos anuncian una cita textual, una enumeración o una conclusión. En Ciencias Humanas son frecuentes antes de citas de autores y en el cierre de un razonamiento.",
     ejemplo:"Como afirmó Geertz: «el hombre es un animal suspendido en redes de significados que él mismo ha tejido».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca dos puntos donde correspondan.",
       texto:"«Como afirmó Geertz___ el hombre es un animal suspendido en redes de significados».",
       respuestas:[[""],[""]],
       retro:"Los dos puntos anuncian citas y conclusiones. Se escriben sin espacio antes y con espacio después."}},

    {id:"h25", nombre:"Punto y aparte",
     concepto:"El punto y aparte cierra un párrafo. En textos humanísticos, cada párrafo desarrolla una idea; el punto y aparte marca el paso a la siguiente. Facilita la lectura y organiza la argumentación.",
     ejemplo:"Un párrafo para presentar la tesis, otro para el primer argumento, otro para el segundo, otro para la conclusión.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuándo se usa el punto y aparte en un texto humanístico?",
       opciones:["Cuando se termina una oración","Cuando se termina un párrafo","Cuando se cita un autor","Cuando se enumeran obras"],
       correcta:1,
       retro:"El punto y aparte cierra el párrafo. Después se inicia uno nuevo con sangría o espacio adicional."}},

    {id:"h26", nombre:"Paréntesis para referencias y aclaraciones",
     concepto:"Los paréntesis encierran información complementaria: referencias bibliográficas (Autor, año), aclaraciones breves, fechas, siglas. En Ciencias Humanas son frecuentes en las citas APA.",
     ejemplo:"«La noción de campo (Bourdieu, 1979) permite analizar las relaciones de poder en el espacio social».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca paréntesis donde correspondan.",
       texto:"«La noción de campo ___Bourdieu, 1979___ permite analizar las relaciones de poder».",
       respuestas:[["("],[" )",""]],
       retro:"Los paréntesis encierran referencias y aclaraciones. En APA, la referencia va entre paréntesis tras la idea citada."}},

    {id:"h27", nombre:"Comillas: citas y términos específicos",
     concepto:"Las comillas encierran citas textuales, títulos de artículos o capítulos, términos específicos y usos irónicos. En Ciencias Humanas, distinguen el uso mencionado del uso normal de un término.",
     ejemplo:"«El término “poder” en Foucault no equivale al de “dominación” en Weber». Cita: «“la imaginación sociológica” (Mills, 1959)».",
     ejercicio:{tipo:"fill",
       consigna:"Coloca comillas donde correspondan.",
       texto:"«El término ___poder___ en Foucault no equivale al de dominación en Weber».",
       respuestas:[["«","\""],[ "»","\""]],
       retro:"Las comillas distinguen el uso mencionado de un término. Son frecuentes al problematizar conceptos."}},

    {id:"h28", nombre:"Guiones y rayas en diálogos y aclaraciones",
     concepto:"El guion (-) une palabras compuestas. La raya (—) introduce diálogos o aclaraciones. En Ciencias Humanas, es frecuente en transcripciones de entrevistas y en aclaraciones del autor.",
     ejemplo:"«El informante —un campesino de 70 años— describió la violencia como un “tiempo sin ley”». Diálogo: «—Yo no sabía nada —dijo el testigo—. Solo escuché los disparos».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada uso del signo.",
       categorias:["Guion (-)","Raya (—)"],
       items:[
         {texto:"«socio-histórico»", cat:0},
         {texto:"«teórico-metodológico»", cat:0},
         {texto:"«El testigo —dijo— no recordaba»", cat:1},
         {texto:"«El informante —de 70 años— describió»", cat:1},
         {texto:"«histórico-cultural»", cat:0}
       ],
       retro:"El guion une; la raya aísla. En transcripciones de entrevistas, la raya marca intervenciones."}},

    {id:"h29", nombre:"Punto y seguido",
     concepto:"El punto y seguido separa oraciones dentro de un párrafo. Cada oración debe tener sentido completo. Su uso correcto es fundamental para la claridad.",
     ejemplo:"«Weber propuso una sociología comprensiva. Su objetivo era entender el sentido de la acción social. Distinguió cuatro tipos ideales».",
     ejercicio:{tipo:"fill",
       consigna:"Separa las oraciones con punto y seguido.",
       texto:"«Weber propuso una sociología comprensiva___ Su objetivo era entender el sentido de la acción social».",
       respuestas:[["."]],
       retro:"El punto y seguido separa oraciones. Después se escribe mayúscula."}},

    {id:"h30", nombre:"Signos en citas largas y entrecomillados anidados",
     concepto:"En Ciencias Humanas es frecuente citar textos que a su vez citan. Las comillas anidadas siguen una jerarquía: las externas son latinas (« ») o inglesas (“ ”), y las internas, simples (‘ ’).",
     ejemplo:"«Freire afirmó: “La educación no cambia el mundo, cambia a las personas que van a cambiar el mundo”. Esta frase, hoy tan citada, resume su ‘pedagogía de la esperanza’».",

     ejercicio:{tipo:"order",
       consigna:"Ordena los elementos de una referencia APA de libro.",
       items:[
         "Apellido, inicial del autor.",
         "(Año).",
         "Título del libro en cursiva.",
         "Editorial."
       ],
       retro:"El orden APA es fijo: autor, año, título (cursiva), editorial. Es la norma más usada en Ciencias Humanas."}},

    {id:"h56", nombre:"Referencias de capítulos y artículos",
     concepto:"Los capítulos de libro y los artículos de revista tienen formatos específicos en APA. Capítulo: Apellido, A. A. (Año). Título del capítulo. En A. A. Editor (Ed.), Título del libro (pp. X-X). Editorial. Artículo: Apellido, A. A. (Año). Título. Revista, vol(núm), páginas. DOI.",
     ejemplo:"Foucault, M. (1976). El dispositivo de sexualidad. En Historia de la sexualidad (pp. 101-135). Siglo XXI. · Hall, S. (1996). ¿Quién necesita identidad? Cuadernos de Sociología, 12(3), 45-68.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la referencia del capítulo.",
       texto:"Foucault, M. (1976). El dispositivo de sexualidad. En ___ (pp. 101-135). Siglo XXI.",
       respuestas:[["historia de la sexualidad","Historia de la sexualidad"]],
       retro:"El capítulo incluye el título del libro donde aparece, con la abreviatura «En» y las páginas entre paréntesis."}},

    {id:"h57", nombre:"Conectores lógicos académicos",
     concepto:"Los conectores organizan el razonamiento: adición (además, asimismo), contraste (sin embargo, no obstante), causa (porque, debido a), consecuencia (por lo tanto, en consecuencia), orden (en primer lugar, seguidamente), reformulación (es decir, en otras palabras).",
     ejemplo:"«El estructuralismo cuestionó al sujeto moderno; sin embargo, no renunció a la búsqueda de estructuras. Por lo tanto, mantuvo una ambigüedad productiva».",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada conector según su función.",
       categorias:["Adición","Contraste","Consecuencia","Reformulación"],
       items:[
         {texto:"además", cat:0},
         {texto:"sin embargo", cat:1},
         {texto:"por lo tanto", cat:2},
         {texto:"es decir", cat:3},
         {texto:"asimismo", cat:0},
         {texto:"en consecuencia", cat:2},
         {texto:"en otras palabras", cat:3}
       ],
       retro:"Los conectores revelan la relación lógica entre las ideas. Sin ellos, el texto académico pierde su hilo argumentativo."}},

    {id:"h56b", nombre:"Evitar el plagio",
     concepto:"El plagio es presentar como propio el trabajo ajeno. Se evita citando siempre las fuentes, tanto en citas textuales como en paráfrasis. En Ciencias Humanas es una falta grave de integridad académica.",
     ejemplo:"Copiar un párrafo de un libro sin comillas ni cita es plagio. Parafrasear sin citar también lo es. Usar ideas de otro sin reconocerlas también.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Cuál de estas prácticas es plagio?",
       opciones:["Parafrasear una idea y citar al autor","Copiar un párrafo literal sin comillas ni cita","Resumir un artículo y referenciarlo","Usar una cita textual entre comillas con su referencia"],
       correcta:1,
       retro:"Copiar sin citar es plagio, incluso si se cambian algunas palabras. Citar y parafrasear con referencia son prácticas correctas."}},

    {id:"h59", nombre:"Argumentación humanística",
     concepto:"La argumentación en Ciencias Humanas defiende una tesis con razones, evidencia, ejemplos y referencias. Reconoce objeciones y las responde. La argumentación es compleja porque los problemas son complejos.",
     ejemplo:"«Este ensayo defiende que la noción de identidad en Hall es procesual. Primero, porque Hall la define como identificación, no como esencia. Segundo, porque articula historia y cultura. Sin embargo, algunos objetan…».",
     ejercicio:{tipo:"order",
       consigna:"Ordena la estructura de la argumentación humanística.",
       items:[
         "Introducción con la tesis.",
         "Argumentos con evidencia y referencias.",
         "Reconocimiento y respuesta a objeciones.",
         "Conclusión que retoma la tesis."
       ],
       retro:"La argumentación humanística sigue la estructura: tesis → argumentos → refutación de objeciones → conclusión."}},

    {id:"h60", nombre:"Coherencia global del texto",
     concepto:"La coherencia es la unidad de sentido del texto: todas sus partes contribuyen al mismo propósito, sin contradicciones, con progresión temática. En Ciencias Humanas, donde los argumentos son densos, la coherencia es esencial.",
     ejemplo:"Un ensayo sobre «identidad» que en la mitad dedica tres párrafos a «diferencia» sin articulación pierde coherencia global.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué problema afecta a la COHERENCIA global, no a la cohesión?",
       opciones:["Falta un conector entre dos oraciones","Un párrafo se contradice con el anterior","Hay una falta de ortografía","Una oración es demasiado larga"],
       correcta:1,
       retro:"La cohesión se ocupa de los enlaces; la coherencia, del sentido global. Una contradicción es un fallo de coherencia."}}
  ]
},

/* ============ BLOQUE 7 · GÉNEROS DISCURSIVOS ============ */
{
  id:"b7", nombre:"Géneros discursivos en Ciencias Humanas", emoji:"📄",
  desc:"Ensayo, reseña, monografía, ponencia, informe, artículo y comentario de texto.",
  tecnicas:[
    {id:"h61", nombre:"Ensayo humanístico",
     concepto:"El ensayo es un género de reflexión libre, personal y riguroso. Defiende una tesis con argumentos, referencias y estilo propio. Admite la voz personal sin renunciar al rigor académico.",
     ejemplo:"Un ensayo sobre «la memoria y el olvido» puede articular filosofía, historia y literatura, con voz personal y referencias académicas.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la estructura del ensayo.",
       texto:"El ensayo tiene una ___ con tesis, un ___ con argumentos, y una ___ que retoma la tesis.",
       respuestas:[["introduccion","introducción"],["desarrollo","cuerpo"],["conclusion","conclusión"]],
       retro:"El ensayo combina reflexión personal y rigor académico. La tesis se defiende con argumentos y referencias."}},

    {id:"h62", nombre:"Reseña crítica",
     concepto:"La reseña valora críticamente un libro, un artículo o una obra. Resume, contextualiza, analiza los puntos fuertes y débiles, y lo sitúa en el campo. No es solo un resumen: es una evaluación razonada.",
     ejemplo:"«El libro X ofrece una síntesis actualizada del concepto de cultura, aunque omite las críticas decoloniales recientes. Su principal aporte es…».",
     ejercicio:{tipo:"fill",
       consigna:"Completa las partes de la reseña.",
       texto:"La reseña resume el ___ y lo ___ en el campo. Analiza los puntos ___ y ___ y termina con una ___ razonada.",
       respuestas:[["contenido","texto","libro","trabajo"],["contextualiza","sitúa","situa"],["fuertes","positivos","fortalezas"],["debiles","débiles","negativos","debilidades"],["valoracion","valoración","recomendacion","recomendación","opinion","opinión"]],
       retro:"La reseña combina síntesis y valoración. No basta con resumir: hay que aportar un juicio razonado."}},

    {id:"h63", nombre:"Monografía",
     concepto:"La monografía es un trabajo extenso y riguroso sobre un tema específico. Tiene introducción, marco teórico, metodología, desarrollo, conclusiones y referencias. Es el género por excelencia del trabajo de grado.",
     ejemplo:"Una monografía sobre «la memoria del conflicto armado en Colombia» puede incluir marco teórico, análisis documental, entrevistas y conclusiones.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una monografía.",
       items:[
         "Introducción y planteamiento del problema.",
         "Marco teórico y estado del arte.",
         "Metodología y fuentes.",
         "Desarrollo y análisis.",
         "Conclusiones y referencias."
       ],
       retro:"La monografía es un trabajo extenso y riguroso. Cada parte cumple una función específica en la construcción del conocimiento."}},

    {id:"h64", nombre:"Ponencia",
     concepto:"La ponencia es un texto que se presenta oralmente en un evento académico. Combina escritura y oralidad: tiene introducción, desarrollo con argumentos, conclusión y se apoya en diapositivas claras.",
     ejemplo:"Una ponencia sobre «la imagen en la era digital» presenta el problema, expone la metodología, muestra resultados y propone conclusiones.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes de una ponencia.",
       items:[
         "Presentación del tema y del ponente.",
         "Contexto y problema abordado.",
         "Desarrollo con argumentos y evidencia.",
         "Resultados y conclusiones.",
         "Turno de preguntas."
       ],
       retro:"La ponencia combina escritura y oralidad. Debe ser clara, concisa y con apoyo visual adecuado."}},

    {id:"h65", nombre:"Informe de investigación",
     concepto:"El informe de investigación documenta un proceso: problema, objetivos, marco teórico, metodología, resultados, discusión y conclusiones. Es un género central en Ciencias Humanas.",
     ejemplo:"Un informe sobre «la deserción escolar en zonas rurales» incluye contexto, metodología cualitativa, resultados y recomendaciones.",
     ejercicio:{tipo:"order",
       consigna:"Ordena las partes del informe de investigación.",
       items:[
         "Problema y objetivos.",
         "Marco teórico.",
         "Metodología.",
         "Resultados y discusión.",
         "Conclusiones y recomendaciones."
       ],
       retro:"El informe de investigación documenta un proceso. Cada parte debe ser clara y verificable."}},

    {id:"h66", nombre:"Artículo de reflexión",
     concepto:"El artículo de reflexión presenta una interpretación o análisis teórico sobre un tema, sin pretender necesariamente presentar datos empíricos nuevos. Es frecuente en revistas de Ciencias Humanas.",
     ejemplo:"Un artículo que analiza «la noción de biopolítica en Foucault y su recepción en América Latina» es un artículo de reflexión.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada artículo según su tipo.",
       categorias:["Artículo de reflexión","Artículo de investigación"],
       items:[
         {texto:"Análisis teórico del concepto de hegemonía.", cat:0},
         {texto:"Estudio empírico con encuestas a 200 personas.", cat:1},
         {texto:"Relectura crítica de un autor clásico.", cat:0},
         {texto:"Análisis de datos recogidos en campo.", cat:1},
         {texto:"Ensayo interpretativo sobre un problema filosófico.", cat:0}
       ],
       retro:"El artículo de reflexión es teórico; el de investigación presenta datos empíricos. Ambos son válidos en Ciencias Humanas."}},

    {id:"h67", nombre:"Comentario de texto",
     concepto:"El comentario de texto analiza un fragmento: lo sitúa, lo explica, lo interpreta y lo valora. Es un género clásico en filosofía, literatura e historia. Exige comprensión profunda del texto.",
     ejemplo:"Comentar un fragmento de «La genealogía de la moral» de Nietzsche: situarlo, explicar sus conceptos, interpretarlo y valorarlo.",
     ejercicio:{tipo:"order",
       consigna:"Ordena los pasos del comentario de texto.",
       items:[
         "Localización del fragmento (autor, obra, contexto).",
         "Explicación del contenido y de los conceptos clave.",
         "Análisis de la estructura y los recursos.",
         "Interpretación del sentido global.",
         "Valoración crítica."
       ],
       retro:"El comentario de texto exige comprender, explicar, interpretar y valorar. Cada paso es necesario."}},

    {id:"h68", nombre:"Entrevista y testimonio",
     concepto:"La entrevista y el testimonio son géneros que recogen la voz de los sujetos. En Ciencias Humanas se usan en investigación cualitativa, etnografía e historia oral. Exigen transcripción, análisis y contexto.",
     ejemplo:"Una entrevista a un líder comunitario sobre el desplazamiento forzado: se transcribe, se analiza y se contextualiza con marco teórico.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el proceso de la entrevista.",
       texto:"Una entrevista se ___, se ___ y se ___ con marco teórico.",
       respuestas:[["transcribe"],["analiza"],["contextualiza","sitúa","situa"]],
       retro:"La entrevista exige transcripción, análisis e interpretación. No es solo recolección de datos: es construcción de conocimiento."}},

    {id:"h69", nombre:"Texto de divulgación humanística",
     concepto:"El texto de divulgación traduce las Ciencias Humanas a un público amplio. Usa analogías, ejemplos cotidianos y un lenguaje accesible, sin perder el rigor conceptual.",
     ejemplo:"«¿Por qué recordamos algunas cosas y olvidamos otras? La historia y la psicología han intentado responder…». Se explica con ejemplos, no con tecnicismos.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada expresión según el tipo de texto.",
       categorias:["Académico","Divulgativo"],
       items:[
         {texto:"«El habitus articula estructura y práctica (Bourdieu, 1979).»", cat:0},
         {texto:"«Imagina que tu forma de hablar revela tu origen social.»", cat:1},
         {texto:"«La noción de dispositivo en Foucault…»", cat:0},
         {texto:"«Es como cuando alguien te dice algo y no puedes dejar de pensarlo.»", cat:1},
         {texto:"«Se aplicó un muestreo teórico con saturación en 20 entrevistas.»", cat:0}
       ],
       retro:"La divulgación traduce sin traicionar: mantiene el rigor pero cambia el lenguaje y los ejemplos."}},

    {id:"h70", nombre:"Reseña de una exposición o evento",
     concepto:"La reseña de exposición o evento valora críticamente una experiencia cultural: qué se presentó, cómo, qué aportó, qué generó. Es un género frecuente en revistas culturales y académicas.",
     ejemplo:"«La exposición “Memorias del conflicto” en el Museo Nacional propone un recorrido por objetos y testimonios. Su mayor acierto es… Su límite es…».",
     ejercicio:{tipo:"fill",
       consigna:"Completa la reseña de la exposición.",
       texto:"La exposición ___ un recorrido por ___. Su mayor acierto es ___ y su límite es ___.",
       respuestas:[["propone","presenta","ofrece"],["objetos","testimonios","imagenes","imágenes","documentos","memorias"],["la articulacion","la articulación","el dialogo","el diálogo","la sensibilidad","la curaduria","la curaduría"],["la falta de contexto","el exceso de texto","la ausencia de voces","la saturacion","la saturación"]],
       retro:"La reseña de exposición valora críticamente. Combina descripción, análisis y juicio razonado."}}
  ]
},

/* ============ BLOQUE 8 · ANÁLISIS Y HERMENÉUTICA ============ */
{
  id:"b8", nombre:"Análisis y hermenéutica", emoji:"🔎",
  desc:"Interpretación, análisis del discurso, hermenéutica, crítica y deconstrucción.",
  tecnicas:[
    {id:"h71", nombre:"Hermenéutica: arte de la interpretación",
     concepto:"La hermenéutica es la disciplina que estudia la interpretación. En Ciencias Humanas se aplica a textos, discursos, prácticas y obras. Gadamer, Ricoeur y Heidegger son referentes fundamentales.",
     ejemplo:"Interpretar un texto no es solo descifrar su significado literal: es comprender el horizonte histórico y cultural en el que se produjo.",
     ejercicio:{tipo:"quiz",
       consigna:"¿Qué estudia la hermenéutica?",
       opciones:["La estructura del lenguaje","La interpretación de textos, discursos y prácticas","La gramática del español","Las matemáticas"],
       correcta:1,
       retro:"La hermenéutica estudia la interpretación. En Ciencias Humanas se aplica a textos, discursos, prácticas y obras."}},

    {id:"h72", nombre:"Círculo hermenéutico",
     concepto:"El círculo hermenéutico es la relación entre el todo y las partes en la interpretación: comprendemos el texto por sus partes y las partes por el todo. La interpretación es un movimiento continuo entre ambos.",
     ejemplo:"Comprender un capítulo de un libro requiere comprender el libro completo, y viceversa. La interpretación avanza en espiral.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la definición del círculo hermenéutico.",
       texto:"El círculo hermenéutico es la relación entre el ___ y las ___ en la interpretación: comprendemos el texto por sus partes y las partes por el ___.",
       respuestas:[["todo"],["partes"],["todo"]],
       retro:"El círculo hermenéutico muestra que la interpretación es un movimiento continuo entre el todo y las partes."}},

    {id:"h73", nombre:"Horizonte de comprensión",
     concepto:"Cada lector y cada época tienen un horizonte de comprensión: el conjunto de supuestos, valores y saberes desde los que interpretan. Gadamer propone la «fusión de horizontes» entre el texto y el lector.",
     ejemplo:"Leer a Marx hoy no es lo mismo que leerlo en 1850: nuestro horizonte ha cambiado. La interpretación implica poner en diálogo ambos horizontes.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el concepto de Gadamer.",
       texto:"El ___ de comprensión es el conjunto de supuestos desde los que interpretamos. Gadamer propone la ___ de horizontes entre texto y lector.",
       respuestas:[["horizonte"],["fusion","fusión"]],
       retro:"La fusión de horizontes es el encuentro entre el horizonte del texto y el del lector. Es el corazón de la hermenéutica gadameriana."}},

    {id:"h74", nombre:"Análisis del discurso",
     concepto:"El análisis del discurso estudia cómo el lenguaje construye significados, identidades y relaciones de poder. Se interesa por las formaciones discursivas, los enunciados y los efectos sociales del discurso.",
     ejemplo:"Analizar el discurso político: qué palabras se usan, qué se silencia, qué identidades se construyen, qué relaciones de poder se reproducen.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el análisis del discurso.",
       texto:"El análisis del discurso estudia cómo el lenguaje construye significados, identidades y relaciones de ___.",
       respuestas:[["poder"]],
       retro:"El análisis del discurso estudia el lenguaje como práctica social. No es solo lingüística: es análisis crítico."}},

    {id:"h75", nombre:"Análisis crítico del discurso (ACD)",
     concepto:"El ACD (Fairclough, Van Dijk, Wodak) estudia cómo el discurso reproduce o resiste el poder, la ideología y la desigualdad. Combina análisis lingüístico y análisis social.",
     ejemplo:"Un ACD de un discurso presidencial puede analizar el uso de «nosotros», «pueblo», «enemigo» y las relaciones de poder que construyen.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada pregunta según el tipo de análisis.",
       categorias:["Análisis lingüístico","Análisis crítico del discurso"],
       items:[
         {texto:"¿Cuántas veces se repite «nosotros» en el discurso?", cat:0},
         {texto:"¿Qué relaciones de poder reproduce el discurso?", cat:1},
         {texto:"¿Qué palabras se usan con mayor frecuencia?", cat:0},
         {texto:"¿Qué identidades se construyen y cuáles se silencian?", cat:1},
         {texto:"¿Cómo se articula el discurso con el contexto social?", cat:1}
       ],
       retro:"El ACD combina análisis lingüístico y análisis social. No se queda en la forma: busca los efectos de poder del discurso."}},

    {id:"h76", nombre:"Deconstrucción",
     concepto:"La deconstrucción (Derrida) es una estrategia de lectura que muestra las contradicciones internas de un texto, los binarismos que lo sostienen y lo que queda fuera de su lógica.",
     ejemplo:"Deconstruir un texto que opone «naturaleza» y «cultura»: mostrar que la oposición no es tan clara, que cada término contiene al otro.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el concepto de deconstrucción.",
       texto:"La deconstrucción muestra las ___ internas de un texto y los ___ que lo sostienen. Su autor principal es ___.",
       respuestas:[["contradicciones"],["binarismos","binarismo","oposiciones"],["derrida","Derrida"]],
       retro:"La deconstrucción no es destrucción: es mostrar cómo un texto se sostiene en oposiciones que pueden desmontarse."}},

    {id:"h77", nombre:"Análisis de fuentes históricas",
     concepto:"El análisis de fuentes históricas implica distinguir fuentes primarias y secundarias, evaluar su credibilidad, contextualizarlas y contrastarlas. La historia se construye a partir de las fuentes.",
     ejemplo:"Analizar un diario personal del siglo XIX: es fuente primaria, subjetiva, pero valiosa para comprender la vida cotidiana.",
     ejercicio:{tipo:"classify",
       consigna:"Clasifica cada fuente según su tipo.",
       categorias:["Fuente primaria","Fuente secundaria"],
       items:[
         {texto:"Un diario personal del siglo XIX.", cat:0},
         {texto:"Un libro de historia sobre el siglo XIX.", cat:1},
         {texto:"Un acta notarial de 1850.", cat:0},
         {texto:"Un artículo académico que analiza el siglo XIX.", cat:1},
         {texto:"Una fotografía de la época.", cat:0}
       ],
       retro:"Las fuentes primarias son contemporáneas a los hechos; las secundarias los interpretan. Ambas son necesarias."}},

    {id:"h78", nombre:"Interpretación de imágenes y cultura visual",
     concepto:"Las Ciencias Humanas analizan imágenes como textos: cuadros, fotografías, publicidad, cine, redes. Se interpretan sus significados, sus contextos y sus efectos sociales.",
     ejemplo:"Analizar una fotografía de prensa sobre el conflicto: qué muestra, qué silencia, qué emoción construye, qué relación de poder reproduce.",
     ejercicio:{tipo:"fill",
       consigna:"Completa el análisis de la imagen.",
       texto:"Analizar una imagen implica examinar qué ___, qué ___ y qué relaciones de ___ construye.",
       respuestas:[["muestra"],["silencia","oculta"],["poder"]],
       retro:"Las imágenes son textos culturales. Analizarlas es interpretar sus significados y sus efectos sociales."}},

    {id:"h79", nombre:"Interpretación de prácticas culturales",
     concepto:"Las Ciencias Humanas interpretan prácticas culturales: rituales, fiestas, comidas, vestimenta, gestos, formas de habla. Cada práctica es un texto que puede leerse.",
     ejemplo:"Interpretar una fiesta popular: qué se celebra, quiénes participan, qué jerarquías reproduce, qué significados expresa.",
     ejercicio:{tipo:"fill",
       consigna:"Completa la interpretación de la práctica cultural.",
       texto:"Interpretar una fiesta popular implica preguntar qué se ___, quiénes ___ y qué ___ reproduce.",
       respuestas:[["celebra"],["participan"],["jerarquia","jerarquía","orden","poder"]],
       retro:"Las prácticas culturales son textos que pueden leerse. Interpretarlas es parte del trabajo de las Ciencias Humanas."}},

    {id:"h80", nombre:"Reflexividad del intérprete",
     concepto:"En Ciencias Humanas, el intérprete forma parte del proceso. La reflexividad consiste en reconocer cómo su posición, sus supuestos y su contexto afectan la interpretación.",
     ejemplo:"Un investigador que estudia su propia comunidad debe reconocer su cercanía y cómo eso afecta su mirada.",
     ejercicio:{tipo:"open",
       consigna:"¿Por qué es importante la reflexividad en la interpretación en Ciencias Humanas? Responde en 3-4 líneas.",
       criterios:[
         "Expliqué qué es la reflexividad.",
         "Relacioné la reflexividad con la interpretación.",
         "Reconocí que el intérprete no es neutral."
       ],
       modelo:"La reflexividad es reconocer que el intérprete no es un observador neutral: llega al texto, la imagen o la práctica con sus propios supuestos, su historia y su posición social. Si no se reconoce eso, el análisis se presenta como objetivo cuando en realidad está mediado por la mirada del intérprete. Ser reflexivo no elimina la posición: la vuelve explícita, y eso hace el análisis más honesto y riguroso."}}
  ]
},
