<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Cuaderno Unificado · + Examen + Rúbrica de redacción</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfaf3; --paper-2:#f7f2e8; --ink:#14213d;
    --navy:#14213d; --navy-dark:#0a1528; --navy-soft:#dde5f0;
    --bronze:#a67c52; --bronze-dark:#7c5c39; --bronze-soft:#f0e4d3; --bronze-line:#c9a96e;
    --muted:#6b6355; --line:#d8d2c3; --line-2:#b8af99;
    --ok:#2f6b3a; --ok-soft:#e0efe2; --bad:#8b1e1e; --bad-soft:#f8e0e0;
    --warn:#a67c52; --warn-soft:#f0e4d3;
    --shadow:0 1px 2px rgba(20,33,61,.08), 0 8px 22px rgba(20,33,61,.10);
    --transition:.22s cubic-bezier(.4,.15,.2,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,#f4f1ea 0%,transparent 55%),#e8e6e0;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:.95rem;min-height:100vh;}

  /* TOPBAR */
  .topbar{position:sticky;top:0;z-index:1030;display:flex;align-items:center;justify-content:space-between;gap:.9rem;padding:.55rem 1rem;background:linear-gradient(180deg,#fdfaf3,#f7f2e8);border-bottom:3px double var(--navy);box-shadow:0 1px 0 var(--bronze-line) inset;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:.75rem;min-width:0;}
  .seal{width:42px;height:42px;flex:0 0 auto;border-radius:50%;padding:3px;border:1.5px dashed var(--bronze);display:grid;place-items:center;}
  .seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle,var(--paper) 60%,var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:10px;position:relative;}
  .seal-inner::before,.seal-inner::after{content:"★";position:absolute;font-size:4px;color:var(--bronze);}
  .seal-inner::before{top:4px;left:50%;transform:translateX(-50%);}
  .seal-inner::after{bottom:4px;left:50%;transform:translateX(-50%);}
  .brand h1{font-family:"PT Serif",Georgia,serif;font-size:.8rem;margin:0;font-weight:700;color:var(--navy);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand small{font-size:.55rem;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:700;}

  .modo-tabs{display:flex;border:1px solid var(--navy);background:var(--paper);flex-wrap:wrap;}
  .modo-tab{font-size:.62rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:.4rem .65rem;cursor:pointer;border:none;background:transparent;color:var(--navy);border-right:1px solid var(--navy);transition:var(--transition);font-family:inherit;}
  .modo-tab:last-child{border-right:none;}
  .modo-tab:hover{background:var(--navy-soft);}
  .modo-tab.active{background:var(--navy);color:var(--paper);}
  .modo-tab.exam.active{background:var(--bronze);border-right-color:var(--bronze);}
  .modo-tab.rubrica.active{background:var(--ok);border-right-color:var(--ok);}

  .btn-sm-custom{font-size:.62rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:.36rem .65rem;border:1px solid var(--navy);background:var(--paper);color:var(--navy);cursor:pointer;border-radius:3px;transition:var(--transition);font-family:inherit;}
  .btn-sm-custom:hover{background:var(--navy-soft);}
  .btn-sm-custom.primary{background:var(--navy);color:var(--paper);}
  .btn-sm-custom.primary:hover{background:var(--navy-dark);}
  .btn-sm-custom.outline{border-color:var(--bronze);color:var(--bronze-dark);}
  .btn-sm-custom.outline:hover{background:var(--bronze-soft);}
  .btn-sm-custom.danger{border-color:var(--bad);color:var(--bad);}
  .btn-sm-custom.danger:hover{background:var(--bad-soft);}
  .btn-sm-custom.ok{border-color:var(--ok);color:var(--ok);}
  .btn-sm-custom.ok:hover{background:var(--ok-soft);}

  .status-pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.54rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:.24rem .45rem;border-radius:99px;border:1px solid;background:var(--paper);}
  .status-pill.online{border-color:var(--ok);color:var(--ok);}
  .status-pill.offline{border-color:var(--bad);color:var(--bad);}
  .status-pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .lang-pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.54rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:.24rem .45rem;border-radius:3px;border:1px solid var(--bronze-line);background:var(--bronze-soft);color:var(--bronze-dark);cursor:pointer;transition:var(--transition);}
  .lang-pill:hover{background:var(--bronze);color:var(--paper);}

  /* LAYOUT */
  .layout{display:grid;grid-template-columns:270px 1fr;gap:1.1rem;padding:1.1rem;max-width:1450px;margin:0 auto;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;padding:.7rem;gap:.7rem;}}

  /* SIDEBAR */
  .sidebar{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow-y:auto;background:var(--paper);border:1px solid var(--navy);padding:4px;box-shadow:var(--shadow);border-radius:4px;}
  .sidebar-inner{border:1px solid var(--bronze-line);padding:.7rem;border-radius:3px;}
  .side-label{font-size:.55rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--bronze-dark);padding-bottom:.35rem;margin-bottom:.55rem;border-bottom:1px solid var(--bronze-line);display:flex;justify-content:space-between;align-items:center;}
  .side-search{width:100%;font-size:.78rem;padding:.36rem .5rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin-bottom:.6rem;border-radius:3px;outline:none;}
  .side-search:focus{border-color:var(--navy);}
  .cat-block{margin-bottom:.25rem;}
  .cat-toggle{display:flex;align-items:center;gap:.4rem;width:100%;text-align:left;background:none;border:none;padding:.42rem .48rem;font-size:.62rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--navy);border-left:3px solid transparent;font-family:inherit;transition:var(--transition);cursor:pointer;}
  .cat-toggle:hover{background:var(--navy-soft);border-left-color:var(--bronze);}
  .cat-toggle[aria-expanded="true"] .chev{transform:rotate(90deg);}
  .chev{margin-left:auto;font-size:.5rem;color:var(--bronze);transition:transform var(--transition);}
  .cat-count{font-family:"PT Serif",Georgia,serif;font-size:.58rem;font-weight:700;background:var(--bronze-soft);color:var(--bronze-dark);padding:.08rem .3rem;border:1px solid var(--bronze-line);}
  .cat-prog{height:3px;background:var(--paper-2);margin:0 .48rem .3rem;border:1px solid var(--line);}
  .cat-prog > div{height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));transition:width var(--transition);}
  .tech-btn{display:flex;align-items:flex-start;gap:.35rem;width:100%;text-align:left;background:none;border:none;padding:.3rem .48rem;font-size:.68rem;line-height:1.32;color:var(--ink);border-left:3px solid transparent;font-family:inherit;transition:var(--transition);cursor:pointer;border-radius:0 3px 3px 0;}
  .tech-btn:hover{background:var(--bronze-soft);border-left-color:var(--bronze);}
  .tech-btn.active{background:var(--navy-soft);border-left-color:var(--navy);color:var(--navy-dark);font-weight:700;}
  .tech-btn .done-mark{flex:0 0 auto;width:11px;height:11px;margin-top:.15rem;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:.45rem;color:transparent;}
  .tech-btn.done .done-mark{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* PANEL */
  .panel{background:var(--paper);border:1px solid var(--navy);padding:5px;box-shadow:var(--shadow);border-radius:4px;position:relative;}
  .panel-inner{border:1px solid var(--bronze-line);padding:1.5rem 1.7rem;border-radius:3px;background:radial-gradient(circle at 100% 0%, var(--bronze-soft) 0%, transparent 45%), var(--paper);position:relative;}
  @media (max-width:640px){.panel-inner{padding:.95rem;}}
  .panel-seal{position:absolute;top:12px;right:16px;width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--bronze);padding:3px;opacity:.7;}
  .panel-seal-inner{width:100%;height:100%;border-radius:50%;border:1px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:6.5px;text-align:center;line-height:1.1;}

  /* TÉCNICAS */
  .tech-header{padding-right:65px;margin-bottom:.85rem;}
  .tech-badge{display:inline-block;font-size:.54rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);background:var(--bronze-soft);border:1px solid var(--bronze-line);padding:.12rem .4rem;margin-bottom:.4rem;}
  .tech-title{font-family:"PT Serif",Georgia,serif;font-size:clamp(.98rem,2.4vw,1.35rem);font-weight:700;color:var(--navy);line-height:1.2;margin:0;}
  .tech-sub{font-size:.6rem;color:var(--muted);margin-top:.22rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
  .rule-double{height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);margin:.65rem 0 .95rem;}

  .flashcard{perspective:1600px;margin:0 0 .85rem;cursor:pointer;border:1px solid var(--navy);padding:4px;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;}
  .flashcard-inner{position:relative;min-height:clamp(190px,28vh,240px);transform-style:preserve-3d;transition:transform .68s cubic-bezier(.4,.15,.2,1);border:1px solid var(--bronze-line);}
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:.85rem 1rem;display:flex;flex-direction:column;overflow:auto;background:var(--paper);background-image:linear-gradient(transparent 27px, rgba(20,33,61,.06) 27px 28px);background-size:100% 28px;background-position:0 14px;}
  .flashcard-back{transform:rotateY(180deg);background:var(--bronze-soft);}
  .flashcard-tag{font-size:.55rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:.4rem;padding-bottom:.28rem;border-bottom:1px solid var(--bronze-line);display:block;}
  .flashcard-face p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:.86rem;line-height:1.7;color:var(--ink);}
  .flashcard-back p{font-style:italic;color:var(--navy-dark);}
  .flashcard-hint{margin-top:auto;padding-top:.5rem;font-size:.55rem;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;}

  .sec-title{display:flex;align-items:center;gap:.4rem;font-family:"PT Serif",Georgia,serif;font-size:.9rem;font-weight:700;color:var(--navy);margin:1.2rem 0 .5rem;padding-bottom:.32rem;border-bottom:1px solid var(--navy);position:relative;}
  .sec-title::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--bronze-line);}
  .sec-title small{font-size:.55rem;color:var(--muted);margin-left:auto;letter-spacing:.4px;text-transform:uppercase;}

  .consigna{font-family:"PT Serif",Georgia,serif;font-size:.86rem;line-height:1.55;background:var(--paper-2);border-left:3px solid var(--bronze);padding:.55rem .8rem;margin:0 0 .8rem;border-radius:0 3px 3px 0;}

  .opciones{display:flex;flex-direction:column;gap:.32rem;}
  .opcion-btn{display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:.55rem .7rem;cursor:pointer;transition:var(--transition);font-family:inherit;font-size:.78rem;line-height:1.45;border-radius:3px;}
  .opcion-btn:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft);}
  .opcion-btn:disabled{cursor:default;opacity:.9;}
  .opcion-letra{flex:0 0 auto;width:20px;height:20px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center;font-family:"PT Serif",Georgia,serif;font-size:.65rem;font-weight:700;}
  .opcion-btn.correcta{border-color:var(--ok);background:var(--ok-soft);}
  .opcion-btn.correcta .opcion-letra{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opcion-btn.incorrecta{border-color:var(--bad);background:var(--bad-soft);}
  .opcion-btn.incorrecta .opcion-letra{background:var(--bad);color:#fff;border-color:var(--bad);}

  textarea.area-redaccion{width:100%;font-family:"JetBrains Mono",monospace;font-size:.8rem;line-height:1.5;color:var(--ink);padding:.6rem .8rem;border:1px solid var(--bronze-line);background:var(--paper);border-radius:3px;resize:vertical;outline:none;transition:var(--transition);}
  textarea.area-redaccion:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft);}

  .fb-box{margin-top:.85rem;padding:0;overflow:hidden;max-height:0;opacity:0;transition:var(--transition);border-left:3px solid transparent;border-radius:0 3px 3px 0;}
  .fb-box.show{max-height:800px;opacity:1;padding:.7rem .9rem;}
  .fb-box.fb-ok{background:var(--ok-soft);border-left-color:var(--ok);color:var(--ok);}
  .fb-box.fb-mal{background:var(--bad-soft);border-left-color:var(--bad);color:var(--bad);}
  .fb-box.fb-info{background:var(--bronze-soft);border-left-color:var(--bronze);color:var(--bronze-dark);}
  .fb-box strong{display:block;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:.22rem;}
  .fb-box p{margin:0;font-family:"PT Serif",Georgia,serif;font-size:.82rem;line-height:1.55;}

  .cuaderno-block{margin-top:1.4rem;padding-top:.95rem;border-top:1px solid var(--navy);position:relative;}
  .cuaderno-block::before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--bronze-line);}
  .cuaderno-foot{display:flex;justify-content:space-between;align-items:center;font-size:.58rem;color:var(--muted);margin-top:.32rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  #notaStatus{color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;}
  #notaStatus.show{opacity:1;}
  .nav-foot{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.1rem;padding-top:.85rem;border-top:1px solid var(--bronze-line);}

  .block-dots{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.4rem;}
  .block-dot{width:9px;height:9px;border:1px solid var(--line);background:var(--paper);cursor:pointer;transition:var(--transition);}
  .block-dot.done{background:var(--ok);border-color:var(--ok);}
  .block-dot.current{background:var(--bronze);border-color:var(--bronze-dark);}

  /* DASHBOARD */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.85rem;margin-bottom:1.3rem;}
  .kpi{border:1px solid var(--bronze-line);padding:.85rem;border-radius:4px;background:var(--paper);border-left:4px solid var(--navy);position:relative;overflow:hidden;}
  .kpi.exam{border-left-color:var(--bronze);}
  .kpi .lbl{font-size:.54rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);display:block;margin-bottom:.22rem;}
  .kpi .val{font-family:"PT Serif",Georgia,serif;font-size:1.8rem;font-weight:700;color:var(--navy);line-height:1;}
  .kpi .sub{font-size:.64rem;color:var(--muted);margin-top:.28rem;}
  .kpi .spark{position:absolute;right:6px;bottom:6px;opacity:.6;}

  .chart-card{border:1px solid var(--navy);padding:4px;border-radius:4px;background:var(--paper);box-shadow:var(--shadow);margin-bottom:1rem;}
  .chart-inner{border:1px solid var(--bronze-line);padding:1rem;border-radius:3px;background:var(--paper);}
  .chart-inner h3{font-family:"PT Serif",Georgia,serif;font-size:.95rem;color:var(--navy);margin:0 0 .15rem;font-weight:700;}
  .chart-inner .sub{font-size:.62rem;color:var(--muted);margin:0 0 .85rem;letter-spacing:.4px;text-transform:uppercase;font-weight:600;}
  .bar-chart{display:flex;flex-direction:column;gap:.55rem;}
  .bar-row{display:grid;grid-template-columns:200px 1fr 55px;gap:.55rem;align-items:center;}
  @media (max-width:640px){.bar-row{grid-template-columns:1fr;gap:.22rem;}}
  .bar-row .nombre{font-size:.72rem;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .nombre small{display:block;font-weight:500;color:var(--muted);font-size:.58rem;}
  .bar-track{height:20px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--bronze));width:0;transition:width .8s cubic-bezier(.4,.15,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:.4rem;color:var(--paper);font-size:.58rem;font-weight:700;}
  .bar-fill.exam{background:linear-gradient(90deg,var(--bronze),var(--bronze-dark));}
  .bar-row .pct{font-family:"PT Serif",Georgia,serif;font-size:.8rem;font-weight:700;color:var(--navy);text-align:right;}

  .donut-wrap{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;justify-content:center;}
  .donut-info{display:flex;flex-direction:column;gap:.4rem;font-size:.74rem;}
  .donut-info div{display:flex;align-items:center;gap:.4rem;}
  .donut-info .dot{width:10px;height:10px;border-radius:3px;}
  .donut-info .lbl{flex:1;color:var(--ink);}
  .donut-info .val{font-weight:700;color:var(--navy);font-family:"PT Serif",Georgia,serif;}

  /* EXAMEN */
  .exam-bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.75rem .95rem;background:linear-gradient(90deg,var(--bronze-soft),var(--paper));border:1px solid var(--bronze-line);border-radius:4px;margin-bottom:1.1rem;flex-wrap:wrap;}
  .exam-stat{display:flex;flex-direction:column;gap:.12rem;}
  .exam-stat .lbl{font-size:.54rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--bronze-dark);}
  .exam-stat .val{font-family:"PT Serif",Georgia,serif;font-size:1.15rem;font-weight:700;color:var(--navy);}
  .exam-progress{flex:1 1 100%;height:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:.4rem;}
  .exam-progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--navy));transition:width .35s;}

  .exam-q{border:1px solid var(--navy);padding:4px;background:var(--paper);border-radius:3px;box-shadow:var(--shadow);margin-bottom:1rem;}
  .exam-q-inner{border:1px solid var(--bronze-line);padding:1.1rem;border-radius:3px;}
  .exam-q .q-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.55rem;}
  .exam-q .q-tag{font-size:.55rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;padding:.15rem .45rem;border-radius:2px;}
  .exam-q .q-tag.html{background:var(--navy-soft);color:var(--navy-dark);}
  .exam-q .q-tag.gram{background:var(--bronze-soft);color:var(--bronze-dark);}
  .exam-q .q-tag.red{background:var(--ok-soft);color:var(--ok);}
  .exam-q .q-num{font-family:"PT Serif",Georgia,serif;font-size:.78rem;font-weight:700;color:var(--muted);margin-left:auto;}
  .exam-q .q-text{font-family:"PT Serif",Georgia,serif;font-size:.98rem;line-height:1.55;color:var(--ink);margin:0 0 .75rem;font-weight:600;}

  .exam-nav{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:space-between;margin-top:1rem;}
  .exam-nav .btns{display:flex;gap:.4rem;flex-wrap:wrap;}

  .result-card{border:2px solid var(--navy);padding:5px;background:var(--paper);border-radius:5px;box-shadow:var(--shadow);}
  .result-card .inner{border:1px solid var(--bronze-line);padding:1.5rem;border-radius:3px;text-align:center;}
  .result-big{font-family:"PT Serif",Georgia,serif;font-size:3rem;font-weight:700;color:var(--navy);line-height:1;margin-bottom:.3rem;}
  .result-range{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:.25rem .65rem;border-radius:99px;margin-bottom:.9rem;}
  .result-range.excelente{background:var(--ok-soft);color:var(--ok);}
  .result-range.bueno{background:var(--navy-soft);color:var(--navy-dark);}
  .result-range.aceptable{background:var(--bronze-soft);color:var(--bronze-dark);}
  .result-range.bajo{background:var(--bad-soft);color:var(--bad);}

  .result-break{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-top:1rem;}
  .result-break .item{background:var(--paper-2);border-radius:3px;padding:.65rem;text-align:left;border-left:3px solid var(--bronze);}
  .result-break .item strong{display:block;font-size:.58rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--bronze-dark);}
  .result-break .item span{font-family:"PT Serif",Georgia,serif;font-size:1.2rem;font-weight:700;color:var(--navy);}

  .history-row{display:grid;grid-template-columns:60px 1fr 70px 70px;gap:.5rem;align-items:center;padding:.5rem .7rem;background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:.35rem;font-size:.74rem;}
  .history-row .fecha{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--muted);}
  .history-row .tipo{font-weight:700;color:var(--navy);}
  .history-row .ptje{font-family:"PT Serif",Georgia,serif;font-size:.9rem;font-weight:700;color:var(--navy);text-align:right;}
  .history-row .pct{font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:700;color:var(--bronze-dark);text-align:right;}

  /* RÚBRICA */
  .rubrica-grid{display:grid;grid-template-columns:1fr 100px 1fr;gap:.55rem;align-items:center;padding:.65rem;border:1px solid var(--line);border-radius:3px;margin-bottom:.45rem;background:var(--paper);}
  .rubrica-grid .crit{font-size:.85rem;font-weight:700;color:var(--navy);}
  .rubrica-grid .crit small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;margin-top:.15rem;line-height:1.4;}
  .rubrica-grid .peso{display:flex;align-items:center;gap:.3rem;}
  .rubrica-grid .peso input{width:60px;font-size:.82rem;padding:.3rem .4rem;border:1px solid var(--line);border-radius:3px;text-align:center;font-family:inherit;}
  .rubrica-grid .valores{display:flex;gap:.2rem;justify-content:flex-end;}
  .rubrica-grid .val-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--paper);cursor:pointer;border-radius:3px;font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:.82rem;color:var(--muted);transition:var(--transition);}
  .rubrica-grid .val-btn:hover{border-color:var(--navy);color:var(--navy);}
  .rubrica-grid .val-btn.sel{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .rubrica-grid.excelente .val-btn.sel{background:var(--ok);border-color:var(--ok);}
  .rubrica-grid.bueno .val-btn.sel{background:var(--blue);border-color:var(--blue);}
  .rubrica-grid.aceptable .val-btn.sel{background:var(--bronze);border-color:var(--bronze);}
  .rubrica-grid.bajo .val-btn.sel{background:var(--bad);border-color:var(--bad);}

  .rubrica-resumen{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:1rem;}
  .rubrica-resumen .bloque{background:var(--paper-2);padding:.75rem;border-radius:3px;border-left:3px solid var(--bronze);}
  .rubrica-resumen .bloque strong{display:block;font-size:.56rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:.3rem;}
  .rubrica-resumen .bloque .num{font-family:"PT Serif",Georgia,serif;font-size:1.9rem;font-weight:700;color:var(--navy);line-height:1;}

  /* TALLER */
  .tool-card{background:var(--paper);border:1px solid var(--navy);padding:4px;border-radius:3px;box-shadow:var(--shadow);margin-bottom:.85rem;}
  .tool-inner{border:1px solid var(--bronze-line);padding:.9rem;border-radius:3px;background:var(--paper);}
  .tool-inner h4{font-family:"PT Serif",Georgia,serif;font-size:.92rem;color:var(--navy);margin:0 0 .32rem;font-weight:700;}
  .tool-inner > p{font-size:.74rem;color:var(--muted);margin:0 0 .7rem;}
  .input-sm,.select-sm{font-size:.8rem;width:100%;padding:.36rem .5rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;outline:none;transition:var(--transition);}
  .input-sm:focus,.select-sm:focus{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft);}
  .resultado-caja{background:var(--paper-2);border:1px solid var(--bronze-line);padding:.7rem;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:.72rem;line-height:1.55;color:var(--ink);white-space:pre-wrap;max-height:420px;overflow-y:auto;margin-top:.6rem;}

  .plantilla-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.65rem;margin:.85rem 0;}
  .plantilla-item{border:1px solid var(--bronze-line);border-radius:4px;padding:.65rem;background:var(--paper);border-top:3px solid var(--navy);cursor:pointer;transition:var(--transition);}
  .plantilla-item:hover{background:var(--bronze-soft);transform:translateY(-2px);}
  .plantilla-item.active{border-top-color:var(--bronze);background:var(--bronze-soft);}
  .plantilla-item h5{margin:0 0 .22rem;font-family:"PT Serif",Georgia,serif;font-size:.84rem;color:var(--navy);}
  .plantilla-item p{margin:0;font-size:.66rem;color:var(--muted);line-height:1.4;}
  .guia-pasos{display:grid;gap:.4rem;margin:.65rem 0;}
  .guia-paso{background:var(--paper-2);border-left:3px solid var(--bronze);padding:.45rem .7rem;border-radius:0 3px 3px 0;font-family:"PT Serif",Georgia,serif;font-size:.8rem;line-height:1.5;}
  .guia-paso strong{color:var(--navy);}
  .ejemplo-4{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:.85rem;}
  @media (max-width:700px){.ejemplo-4{grid-template-columns:1fr;}}
  .ejemplo-card{border:1px solid var(--bronze-line);border-radius:4px;padding:.8rem;background:var(--paper);}
  .ejemplo-card h5{font-family:"PT Serif",Georgia,serif;font-size:.82rem;color:var(--navy);margin:0 0 .28rem;display:flex;gap:.32rem;align-items:baseline;}
  .ejemplo-card h5 span.tag{font-family:"Public Sans",sans-serif;font-size:.54rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;padding:.08rem .32rem;background:var(--navy-soft);color:var(--navy-dark);border-radius:2px;}
  .ejemplo-card p{margin:0 0 .4rem;font-family:"PT Serif",Georgia,serif;font-size:.8rem;line-height:1.55;color:var(--ink);}
  .ejemplo-card p.en{color:var(--muted);font-style:italic;}

  /* CERTIFICADO */
  .certificado{text-align:center;padding:1.3rem .85rem 2rem;position:relative;}
  .certificado::before,.certificado::after{content:"";position:absolute;left:0;right:0;height:3px;border-top:1px solid var(--navy);border-bottom:1px solid var(--bronze-line);}
  .certificado::before{top:0;} .certificado::after{bottom:0;}
  .cert-sello{width:95px;height:95px;margin:0 auto 1rem;border-radius:50%;padding:4px;border:2px dashed var(--bronze);display:grid;place-items:center;position:relative;}
  .cert-sello-inner{width:100%;height:100%;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;background:radial-gradient(circle, var(--paper) 55%, var(--bronze-soft) 100%);color:var(--navy);font-family:"PT Serif",Georgia,serif;font-weight:700;text-align:center;line-height:1.2;}
  .cert-sello-inner .anio{font-size:1.7rem;display:block;line-height:1;}
  .cert-sello-inner .lbl{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--bronze-dark);font-weight:800;}
  .cert-eyebrow{font-size:.6rem;font-weight:800;letter-spacing:1.9px;text-transform:uppercase;color:var(--bronze-dark);margin-bottom:.42rem;}
  .cert-titulo{font-family:"PT Serif",Georgia,serif;font-size:clamp(1.05rem,2.9vw,1.65rem);color:var(--navy);line-height:1.15;margin:0 0 .75rem;font-weight:700;}
  .cert-linea{width:60%;margin:.85rem auto;height:1px;background:var(--bronze-line);position:relative;}
  .cert-linea::before{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 .42rem;color:var(--bronze);font-size:.62rem;}
  .cert-otorgado{font-family:"PT Serif",Georgia,serif;font-style:italic;font-size:.82rem;color:var(--muted);margin:.75rem 0 .32rem;}
  .cert-nombre{font-family:"PT Serif",Georgia,serif;font-size:clamp(1.05rem,3vw,1.65rem);font-weight:700;color:var(--navy);line-height:1.15;padding:.28rem .6rem;border-bottom:1px dashed var(--bronze);display:inline-block;min-width:60%;outline:none;transition:var(--transition);}
  .cert-nombre:hover,.cert-nombre:focus{background:var(--bronze-soft);}
  .cert-desc{font-family:"PT Serif",Georgia,serif;font-size:.82rem;line-height:1.65;color:var(--ink);max-width:620px;margin:.85rem auto 0;}
  .cert-firmas{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;max-width:490px;margin:1.5rem auto 0;}
  .cert-firma{border-top:1px solid var(--navy);padding-top:.42rem;text-align:center;}
  .cert-firma strong{display:block;font-family:"PT Serif",Georgia,serif;font-size:.8rem;color:var(--navy);outline:none;padding:.08rem .25rem;min-width:60%;}
  .cert-firma small{font-size:.54rem;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;font-weight:700;}
  .cert-meta{display:flex;justify-content:space-between;gap:.8rem;margin-top:1.3rem;font-size:.58rem;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:700;padding-top:.75rem;border-top:1px solid var(--bronze-line);}
  .cert-meta span{outline:none;}

  .doc-bloque{margin-top:1.9rem;page-break-before:always;}
  .doc-bloque:first-of-type{page-break-before:avoid;}
  .doc-bloque-header{padding:.75rem .9rem;background:var(--navy-soft);border-left:4px solid var(--navy);border-radius:3px;margin-bottom:.95rem;}
  .doc-bloque-header h2{font-family:"PT Serif",Georgia,serif;font-size:1rem;color:var(--navy);margin:0 0 .18rem;display:flex;gap:.42rem;align-items:baseline;flex-wrap:wrap;}
  .doc-bloque-header .rango{font-family:"JetBrains Mono",monospace;font-size:.6rem;font-weight:700;color:var(--bronze-dark);background:var(--bronze-soft);padding:.1rem .35rem;border:1px solid var(--bronze-line);}
  .doc-bloque-header p{font-size:.7rem;color:var(--muted);margin:0;line-height:1.45;}
  .doc-tecnica{display:grid;grid-template-columns:50px 1fr;gap:.75rem;padding:.8rem 0;border-bottom:1px solid var(--line);page-break-inside:avoid;}
  .doc-tecnica .num{font-family:"PT Serif",Georgia,serif;font-size:1.35rem;font-weight:700;color:var(--bronze);line-height:1;text-align:right;padding-top:.15rem;}
  .doc-tecnica .body h3{font-family:"PT Serif",Georgia,serif;font-size:.88rem;font-weight:700;color:var(--navy);margin:0 0 .25rem;line-height:1.3;}
  .doc-tecnica .body p{font-size:.78rem;line-height:1.55;color:var(--ink);margin:0 0 .38rem;}
  .doc-tecnica .ej{font-family:"JetBrains Mono",monospace;font-size:.66rem;line-height:1.5;background:var(--paper-2);border-left:3px solid var(--bronze);padding:.38rem .6rem;border-radius:0 3px 3px 0;color:var(--navy-dark);overflow-x:auto;white-space:pre-wrap;}

  /* PWA + TOAST */
  .pwa-banner{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(200px);background:var(--paper);border:1px solid var(--navy);box-shadow:var(--shadow);padding:.7rem .9rem;border-radius:6px;display:flex;align-items:center;gap:.75rem;max-width:500px;width:calc(100% - 2rem);z-index:2100;transition:transform .35s cubic-bezier(.4,.15,.2,1);}
  .pwa-banner.show{transform:translateX(-50%) translateY(0);}
  .pwa-banner .icon{width:40px;height:40px;border-radius:8px;background:var(--navy-soft);display:grid;place-items:center;font-size:1.2rem;flex:0 0 auto;}
  .pwa-banner .text{flex:1;min-width:0;}
  .pwa-banner .text strong{display:block;font-family:"PT Serif",Georgia,serif;color:var(--navy);font-size:.84rem;}
  .pwa-banner .text small{font-size:.64rem;color:var(--muted);display:block;margin-top:.12rem;}
  .pwa-banner .btns{display:flex;gap:.35rem;flex:0 0 auto;}
  .app-toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:var(--paper);padding:.55rem 1rem;font-size:.66rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--bronze-line);box-shadow:var(--shadow);opacity:0;transition:var(--transition);z-index:2200;border-radius:3px;}
  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media print{
    @page{size:A4;margin:2cm;}
    body{background:#fff !important;}
    .topbar,.sidebar,.app-toast,.no-print,.pwa-banner{display:none !important;}
    .layout{display:block;padding:0;gap:0;max-width:none;margin:0;}
    .panel{border:none;box-shadow:none;padding:0;background:#fff;}
    .panel-inner{border:none;padding:0;background:#fff;}
    .panel-seal{display:none;}
    .doc-bloque{page-break-before:always;margin-top:0;}
    .doc-bloque:first-of-type{page-break-before:avoid;}
    .doc-tecnica{page-break-inside:avoid;}
    .certificado{min-height:calc(297mm - 4cm);display:flex;flex-direction:column;justify-content:center;}
  }
  @media (max-width:900px){
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-height:100vh;z-index:1050;padding:4px;transform:translateX(-105%);transition:transform .28s ease;overflow-y:auto;border-radius:0 6px 6px 0;}
    .sidebar.open{transform:none;}
    .only-mobile{display:inline-block !important;}
  }
  .only-mobile{display:none;}
  .d-flex{display:flex;}.gap-2{gap:.45rem;}.gap-3{gap:.6rem;}.mt-2{margin-top:.4rem;}.mt-3{margin-top:.7rem;}.mb-2{margin-bottom:.4rem;}.mb-3{margin-bottom:.7rem;}
</style>
</head>

<script>
/* =====================================================================

const BLOQUES_HTML = [

/* ---------- SVG ---------- */
function svgSpark(h,t){ const p=t?h/t:0; const W=70,H=30,pts=[]; for(let i=0;i<=10;i++) pts.push(`${(i/10)*W},${(H-p*(i/10)*H).toFixed(1)}`); return `<svg width="${W}" height="${H}"><polyline points="${pts.join(" ")}" fill="none" stroke="#a67c52" stroke-width="1.5"/></svg>`; }
function svgDonut(h,r){ const t=h+r,R=60,g=22,c=2*Math.PI*R; const p=t?h/t:0; const lh=c*p,lr=c-lh;
  return `<svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--paper-2)" stroke-width="${g}"/><circle cx="80" cy="80" r="${R}" fill="none" stroke="#a67c52" stroke-width="${g}" stroke-dasharray="${lr} ${lh}" stroke-dashoffset="${-lh}" transform="rotate(-90 80 80)"/><circle cx="80" cy="80" r="${R}" fill="none" stroke="#14213d" stroke-width="${g}" stroke-dasharray="${lh} ${lr}" transform="rotate(-90 80 80)"/><text x="80" y="76" text-anchor="middle" font-family="PT Serif" font-size="26" font-weight="700" fill="var(--navy)">${Math.round(p*100)}%</text></svg>`; }
function svgLine(d,t){ const W=600,H=180,pad=30,au=W-pad*2,al=H-pad*2; const pts=d.map((v,i)=>[pad+(i/(d.length-1||1))*au,H-pad-(v/t)*al]); const path=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "); const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`; return `<svg viewBox="0 0 ${W} ${H}"><path d="${area}" fill="rgba(20,33,61,0.08)"/><path d="${path}" fill="none" stroke="#14213d" stroke-width="2.5"/></svg>`; }

function comenzarExamen(){
  const n = parseInt($("#exNum").value,10);
  const minutos = parseInt($("#exTime").value,10);
  const useHTML = $("#exHTML").checked;
  const useGram = $("#exGram").checked;
  const useRed = $("#exRed").checked;
  if(!useHTML && !useGram && !useRed){ toast(lang==="es"?"Seleccione al menos una categoría":"Select at least one category"); return; }

  const pool = [];
  if(useHTML) HTML_FLAT.forEach(t => pool.push({cat:"HTML", catEs:"HTML+CSS+JS", catEn:"HTML+CSS+JS", t}));
  if(useGram) GRAM_FLAT.forEach(t => pool.push({cat:"Gram.", catEs:"Gramática", catEn:"Grammar", t}));
  if(useRed) PREGUNTAS_RED.forEach((p,i) => pool.push({cat:"Red.", catEs:"Redacción", catEn:"Writing", t:{t:p.q, tEN:p.q, c:p.a, cEN:p.a, e:"", alts:p.alts}}));

  const sel = barajar(pool).slice(0, Math.min(n, pool.length));

  examen = {
    preguntas: sel.map(item => ({
      cat: item.cat, catEs: item.catEs, catEn: item.catEn,
      pregunta: item.t.t, preguntaEN: item.t.tEN,
      correcta: item.t.c, correctaEN: item.t.cEN,
      alts: item.t.alts || null
    })),
    actual: 0,
    respuestas: new Array(sel.length).fill(null),
    correctas: 0,
    total: sel.length,
    minutos, segundos: minutos*60,
    timerId: null,
    inicio: Date.now()
  };
  // Armar opciones por pregunta
  examen.preguntas.forEach((p,i) => {
    let distractorPool;
    if(p.alts){
      distractorPool = p.alts;
    } else {
      distractorPool = pool.filter(x => x.t.c !== p.correcta && x.t.c !== p.correctaEN).slice(0,3).map(x => x.t.c);
    }
    const todas = [p.correcta, ...distractorPool].slice(0,4);
    p.opciones = barajar(todas);
    p.correctaIdx = p.opciones.indexOf(p.correcta);
  });

  if(minutos > 0){
    examen.timerId = setInterval(() => {
      examen.segundos--;
      const tEl = $("#exTimer");
      if(tEl){
        const m = Math.floor(examen.segundos/60);
        const s = examen.segundos % 60;
        tEl.textContent = `${m}:${s.toString().padStart(2,"0")}`;
      }
      if(examen.segundos <= 0){ clearInterval(examen.timerId); finalizarExamen(true); }
    }, 1000);
  }

  renderExamen();
}

function renderExamen(){
  const box = $("#examen-actual"); if(!box) return;
  box.innerHTML = "";
  if(!examen) return;

  const total = examen.total, actual = examen.actual;
  const p = examen.preguntas[actual];
  const progreso = ((actual)/total)*100;

  const bar = el("div","exam-bar");
  bar.innerHTML = `
    <div class="exam-stat"><span class="lbl">${lang==="es"?"Pregunta":"Question"}</span><span class="val">${actual+1}/${total}</span></div>
    <div class="exam-stat"><span class="lbl">${lang==="es"?"Correctas":"Correct"}</span><span class="val">${examen.correctas}</span></div>
    <div class="exam-stat"><span class="lbl">${lang==="es"?"Tiempo":"Time"}</span><span class="val" id="exTimer">${examen.minutos===0?"∞":Math.floor(examen.segundos/60)+":"+(examen.segundos%60).toString().padStart(2,"0")}</span></div>
    <div class="exam-progress"><div style="width:${progreso}%"></div></div>`;
  box.appendChild(bar);

  const qc = el("div","exam-q");
  const qi = el("div","exam-q-inner");
  qi.innerHTML = `
    <div class="q-meta">
      <span class="q-tag ${p.cat==="HTML"?"html":(p.cat==="Gram."?"gram":"red")}">${lang==="es"?p.catEs:p.catEn}</span>
      <span class="q-num">${lang==="es"?"Pregunta":"Question"} ${actual+1}/${total}</span>
    </div>
    <p class="q-text">${esc(lang==="es"?p.pregunta:p.preguntaEN)}</p>`;
  qc.appendChild(qi);
  box.appendChild(qc);

  const ops = el("div","opciones");
  const letras = ["A","B","C","D"];
  p.opciones.forEach((op, i) => {
    const b = el("button","opcion-btn");
    b.innerHTML = `<span class="opcion-letra">${letras[i]}</span><span>${esc(op)}</span>`;
    if(examen.respuestas[actual] !== null){
      b.disabled = true;
      if(i === p.correctaIdx) b.classList.add("correcta");
      if(examen.respuestas[actual] === i && i !== p.correctaIdx) b.classList.add("incorrecta");
    }
    b.addEventListener("click", () => responderExamen(i));
    ops.appendChild(b);
  });
  box.appendChild(ops);

  const nav = el("div","exam-nav");
  const bPrev = el("button","btn-sm-custom outline","← " + (lang==="es"?"Anterior":"Previous"));
  const bNext = el("button","btn-sm-custom primary",(lang==="es"?"Siguiente":"Next") + " →");
  const bEnd = el("button","btn-sm-custom danger", lang==="es"?"Finalizar":"Finish");
  bPrev.disabled = actual===0;
  bNext.disabled = actual===total-1;
  bPrev.addEventListener("click", () => { if(actual>0){ examen.actual--; renderExamen(); } });
  bNext.addEventListener("click", () => { if(actual<total-1){ examen.actual++; renderExamen(); } });
  bEnd.addEventListener("click", () => { if(confirm(lang==="es"?"¿Finalizar examen?":"Finish exam?")) finalizarExamen(false); });

  const btn = el("div","btns");
  btn.appendChild(bPrev); btn.appendChild(bNext);
  nav.appendChild(btn); nav.appendChild(bEnd);
  box.appendChild(nav);
}

function responderExamen(i){
  if(!examen) return;
  if(examen.respuestas[examen.actual] !== null) return;
  const p = examen.preguntas[examen.actual];
  examen.respuestas[examen.actual] = i;
  if(i === p.correctaIdx) examen.correctas++;
  renderExamen();
  // Auto-avanzar
  setTimeout(() => {
    if(examen && examen.actual < examen.total - 1){
      examen.actual++;
      renderExamen();
    } else if(examen){
      finalizarExamen(false);
    }
  }, 900);
}

function finalizarExamen(porTiempo){
  if(!examen) return;
  if(examen.timerId) clearInterval(examen.timerId);
  const total = examen.total;
  const correctas = examen.correctas;
  const pct = Math.round((correctas/total)*100);
  const segsTotales = Math.round((Date.now() - examen.inicio)/1000);
  const mm = Math.floor(segsTotales/60), ss = segsTotales % 60;

  const range = pct>=90?"excelente":pct>=75?"bueno":pct>=60?"aceptable":"bajo";
  const rangeEs = {excelente:"Excelente",bueno:"Bueno",aceptable:"Aceptable",bajo:"A mejorar"}[range];
  const rangeEn = {excelente:"Excellent",bueno:"Good",aceptable:"Acceptable",bajo:"Needs work"}[range];

  const box = $("#examen-actual"); box.innerHTML = "";

  const rc = el("div","result-card");
  const ri = el("div","inner");
  ri.innerHTML = `
    <span class="result-range ${range}">${lang==="es"?rangeEs:rangeEn}</span>
    <div class="result-big">${pct}%</div>
    <p style="font-family:'PT Serif',Georgia,serif;font-size:.95rem;margin:.4rem 0 0;">${lang==="es"?"Aciertos":"Correct"}: <strong>${correctas}</strong> / ${total}</p>
    <p style="font-size:.75rem;color:var(--muted);margin-top:.35rem;">${porTiempo?(lang==="es"?"⏰ Tiempo agotado":"⏰ Time up"):(lang==="es"?"Tiempo empleado":"Time used")+": "+mm+":"+ss.toString().padStart(2,"0")}</p>`;
  rc.appendChild(ri);
  box.appendChild(rc);

  // Desglose
  const bk = el("div","result-break");
  const porCat = {};
  examen.preguntas.forEach((p,i) => {
    const cat = p.cat;
    if(!porCat[cat]) porCat[cat] = {ok:0, total:0};
    porCat[cat].total++;
    if(examen.respuestas[i] === p.correctaIdx) porCat[cat].ok++;
  });
  Object.keys(porCat).forEach(cat => {
    const c = porCat[cat];
    const item = el("div","item");
    item.innerHTML = `<strong>${cat}</strong><span>${c.ok}/${c.total}</span>`;
    bk.appendChild(item);
  });
  box.appendChild(bk);

  // Acciones
  const acc = el("div","d-flex gap-2 mt-3");
  const bRep = el("button","btn-sm-custom primary", lang==="es"?"🔁 Repetir":"🔁 Retry");
  const bNew = el("button","btn-sm-custom outline", lang==="es"?"Nuevo examen":"New exam");
  const bExp = el("button","btn-sm-custom outline", lang==="es"?"Exportar resultado":"Export result");
  bRep.addEventListener("click", () => comenzarExamen());
  bNew.addEventListener("click", () => abrirExamen());
  bExp.addEventListener("click", () => {
    let txt = `EXAMEN · ${new Date().toLocaleString(lang==="es"?"es-CO":"en-US")}\n`;
    txt += `Puntaje: ${correctas}/${total} (${pct}%)\nTiempo: ${mm}:${ss.toString().padStart(2,"0")}\n\n`;
    examen.preguntas.forEach((p,i) => {
      const r = examen.respuestas[i];
      const ok = r === p.correctaIdx;
      txt += `${i+1}. [${ok?"✓":"✗"}] ${p.pregunta}\n`;
      txt += `   ${lang==="es"?"Correcta":"Correct"}: ${p.correcta}\n`;
      if(!ok && r !== null) txt += `   ${lang==="es"?"Tu respuesta":"Your answer"}: ${p.opciones[r]}\n`;
      txt += "\n";
    });
    const blob = new Blob([txt], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `examen_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("✓");
  });
  acc.appendChild(bRep); acc.appendChild(bNew); acc.appendChild(bExp);
  box.appendChild(acc);

  // Guardar en historial
  const fecha = new Date().toLocaleDateString(lang==="es"?"es-CO":"en-US",{day:"2-digit",month:"short",year:"numeric"});
  examHistory.unshift({fecha, pts:correctas, max:total, pct, tipoEs:"Examen mixto", tipoEn:"Mixed exam", ts:Date.now()});
  examHistory = examHistory.slice(0,20);
  saveHistory();
  renderHistorial();
  actualizarProgreso();
  // Reset
  examen = null;
}

function renderHistorial(){
  const hl = $("#histFull"); if(!hl) return;
  hl.innerHTML = "";
  if(!examHistory.length){
    hl.innerHTML = `<p style="font-size:.78rem;color:var(--muted);font-style:italic;">${lang==="es"?"Sin exámenes todavía.":"No exams yet."}</p>`;
    return;

  examHistory.forEach(e => {
    const r = el("div","history-row");
    r.innerHTML = `<span class="fecha">${e.fecha}</span><span class="tipo">${esc(lang==="es"?e.tipoEs:e.tipoEn)}</span><span class="ptje">${e.pts}/${e.max}</span><span class="pct">${e.pct}%</span>`;
    hl.appendChild(r);
  });
}

  function renderCriterios(){

      if(c.valor !== undefined){
        const r = c.valor >= 4.5 ? "excelente" : c.valor >= 3.5 ? "bueno" : c.valor >= 2.5 ? "aceptable" : "bajo";
        row.classList.add(r);
      }

  function renderResumen(){
    const box = $("#rubResumenBox"); if(!box) return;

    let sumaPonderada = 0;
    let totalValor = 0;
    rubricaEstado.criterios.forEach(c => {
      const v = c.valor ?? 0;
      sumaPonderada += v * (c.peso||0) / 100;
      totalValor += v;
    });
    const notaFinal = sumaPonderada; // sobre 5
    const pct = Math.round((notaFinal/5)*100);
    const range = pct>=90?"excelente":pct>=75?"bueno":pct>=60?"aceptable":"bajo";
    const rangeEs = {excelente:"Excelente",bueno:"Bueno",aceptable:"Aceptable",bajo:"A mejorar"}[range];
    const rangeEn = {excelente:"Excellent",bueno:"Good",aceptable:"Acceptable",bajo:"Needs work"}[range];

        <div class="bloque"><strong>${lang==="es"?"Nota final (0–5)":"Final grade (0–5)"}</strong><div class="num">${notaFinal.toFixed(2)}</div><p style="font-size:.7rem;color:var(--muted);margin:.3rem 0 0;">${lang==="es"?"Sobre 100":"Out of 100"}: ${pct}% · <span class="result-range ${range}" style="padding:.1rem .4rem;font-size:.55rem;">${lang==="es"?rangeEs:rangeEn}</span></p></div>
      </div>
      <div class="result-break" style="margin-top:1rem;">
        ${rubricaEstado.criterios.map(c => `<div class="item"><strong>${esc(lang==="es"?c.nombre:c.nombreEN)} (${c.peso}%)</strong><span>${(c.valor ?? 0)}/5</span></div>`).join("")}
      </div>
      <p style="font-size:.72rem;color:var(--muted);margin-top:.85rem;">${lang==="es"?"Palabras del texto":"Text words"}: ${palabras}</p>
    `;
  }

  function guardarCustom(){
    rubricaCustom = JSON.parse(JSON.stringify(rubricaEstado.criterios));
    saveRubricaCustom();
    toast("✓ " + (lang==="es"?"Rúbrica guardada":"Rubric saved"));
  }

  ta.addEventListener("input", () => {
    rubricaEstado.texto = ta.value;
    clearTimeout(notaTimer);
    notaTimer = setTimeout(renderResumen, 250);
  });

  bSave.addEventListener("click", guardarCustom);
  bReset.addEventListener("click", () => {
    if(confirm(lang==="es"?"¿Restablecer rúbrica por defecto?":"Reset default rubric?")){
      rubricaEstado = { criterios: JSON.parse(JSON.stringify(CRITERIOS_DEFAULT)), texto:"" };
      ta.value = "";
      renderCriterios();
    }
  });
  bClear.addEventListener("click", () => {
    rubricaEstado.criterios.forEach(c => c.valor = 0);
    rubricaEstado.texto = "";
    ta.value = "";
    renderCriterios();
  });
  bExport.addEventListener("click", () => {
    let txt = `${lang==="es"?"RÚBRICA DE REDACCIÓN":"WRITING RUBRIC"}\n`;
    txt += `${new Date().toLocaleString(lang==="es"?"es-CO":"en-US")}\n\n`;
    txt += `${lang==="es"?"Texto evaluado":"Evaluated text"}:\n${rubricaEstado.texto || "—"}\n\n`;
    txt += `${lang==="es"?"Criterios":"Criteria"}:\n`;
    let sumaPond = 0;
    rubricaEstado.criterios.forEach(c => {
      const v = c.valor ?? 0;
      sumaPond += v * (c.peso||0)/100;
      txt += `• ${c.nombre} (${c.peso}%): ${v}/5\n`;
    });
    txt += `\n${lang==="es"?"NOTA FINAL":"FINAL GRADE"}: ${sumaPond.toFixed(2)}/5.0 · ${Math.round(sumaPond/5*100)}%\n`;
    const blob = new Blob([txt], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `rubrica_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("✓");
  });

  renderCriterios();
}

function toolAnalizador(cont){
  cont.innerHTML = `<h4>${lang==="es"?"Analizador de párrafos":"Paragraph analyzer"}</h4><p>${lang==="es"?"Detecta el tipo probable según marcadores.":"Detects probable type from markers."}</p>`;

  const b = el("button","btn-sm-custom primary","Analizar");

  const out = el("div","resultado-caja"); cont.appendChild(out);
  b.addEventListener("click", () => {

    const m = {
      narrativo:(t.match(/\b(primero|luego|después|entonces|finalmente|ayer|hoy|first|then|finally)\b/gi)||[]).length,
      descriptivo:(t.match(/\b(alto|bajo|verde|rojo|grande|pequeño|rugoso|liso|tall|small|green)\b/gi)||[]).length,
      expositivo:(t.match(/\b(es|son|significa|consiste|proceso|por ejemplo|tipos|the|means|types)\b/gi)||[]).length,
      argumentativo:(t.match(/\b(considero|pienso|por lo tanto|sin embargo|porque|therefore|however|because|should)\b/gi)||[]).length
    };
    const r = Object.entries(m).sort((a,b)=>b[1]-a[1]);
    const gan = r[0];
    out.textContent = `Narrativos: ${m.narrativo}\nDescriptivos: ${m.descriptivo}\nExpositivos: ${m.expositivo}\nArgumentativos: ${m.argumentativo}\n\nTipo probable: ${gan[1] > 0 ? gan[0] : "indeterminado"}`;
  });
}

  });
}

  idx.innerHTML = `<h2 style="font-family:'PT Serif',Georgia,serif;text-align:center;color:var(--navy);font-size:1.15rem;margin:0 0 .22rem;">${t_("índice")}</h2><div class="row g-2 mt-2" id="indiceGrid"></div>`;
  panel.appendChild(idx);
  const grid = idx.querySelector("#indiceGrid");
  [...BLOQUES_HTML.map(b=>({...b,tag:"HTML"})), ...BLOQUES_GRAM.map(b=>({...b,tag:"Gram."}))].forEach(b => {
    const c = el("div","col-md-6");
    c.innerHTML = `<div style="border:1px solid var(--bronze-line);padding:.6rem .8rem;border-left:3px solid var(--navy);border-radius:3px;background:var(--paper);"><h3 style="font-family:'PT Serif',Georgia,serif;font-size:.82rem;color:var(--navy);margin:0;display:flex;gap:.35rem;align-items:baseline;"><span style="font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:700;color:var(--bronze-dark);background:var(--bronze-soft);padding:.06rem .28rem;border:1px solid var(--bronze-line);">${b.rango}</span>${b.emoji} ${b.tag} · ${esc(lang==="es"?b.nombre:b.nombreEN)}</h3></div>`;
    grid.appendChild(c);
  });

  bindCampos(cert);
}
function bindCampos(ctx){
  ctx.querySelectorAll("[data-campo]").forEach(elem => {
    const k = elem.dataset.campo;
    if(campos[k]) elem.textContent = campos[k];
    elem.addEventListener("input", () => { campos[k] = elem.textContent.trim(); saveCampos(); });
  });
}

/* =====================================================================
   PDF / WORD / RESET
   ===================================================================== */
$("#btnPrint").addEventListener("click", () => { if(modo !== "certificado"){ cambiarModo("certificado"); setTimeout(() => window.print(), 400); } else window.print(); });
$("#btnWord").addEventListener("click", () => {
  const n = campos.nombre || t_("escribeNombre");
  const d = campos.docente || t_("docente");
  const i = campos.institucion || t_("institucion");
  let html = `<!DOCTYPE html><html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><title>Cuaderno Unificado</title><style>@page{size:A4;margin:2cm} body{font-family:Georgia,serif;color:#14213d;line-height:1.5} h1{font-size:22pt;text-align:center} h2{font-size:13pt;margin:16pt 0 6pt;border-bottom:1pt solid #14213d;padding-bottom:4pt} h3{font-size:10.5pt} p{font-size:10.5pt;margin:0 0 5pt} .cert{text-align:center;padding:40pt 20pt} .cert-nombre{font-size:22pt;font-weight:bold;border-bottom:1pt dashed #a67c52;display:inline-block;padding:0 40pt 4pt} .bloque{page-break-before:always} .tecnica{padding:6pt 0;border-bottom:1pt solid #d8d2c3}</style></head><body>
<div class="cert"><h1>${lang==="es"?"Certificado de Finalización":"Completion Certificate"}</h1><p>${t_("otorgado")}</p><div class="cert-nombre">${esc(n)}</div><p>${t_("certDesc")}</p><div style="margin-top:40pt"><div style="display:inline-block;width:45%;text-align:center;border-top:1pt solid #14213d;padding-top:6pt;margin:0 2%"><b>${esc(d)}</b></div><div style="display:inline-block;width:45%;text-align:center;border-top:1pt solid #14213d;padding-top:6pt;margin:0 2%"><b>${esc(i)}</b></div></div></div>`;
  [...BLOQUES_HTML, ...BLOQUES_GRAM].forEach(b => {
    html += `<div class="bloque"><h2>${b.emoji} ${esc(lang==="es"?b.nombre:b.nombreEN)} (${b.rango})</h2>`;
    b.tecnicas.forEach(t => {
      const tB = lang==="es"?t.t:t.tEN;
      const cB = lang==="es"?t.c:t.cEN;
      html += `<div class="tecnica"><h3>${t.n}. ${esc(tB)}</h3><p>${esc(cB)}</p></div>`;
    });
    html += `</div>`;
  });
  html += `</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "cuaderno_unificado.doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("✓");
});
$("#btnReset").addEventListener("click", () => {
  if(!confirm(lang==="es"?"¿Reiniciar todo? Se borrará progreso, notas, historial de exámenes y rúbrica personalizada.":"Reset everything? Progress, notes, exam history and custom rubric will be deleted.")) return;
  progreso = {}; progresoGram = {}; campos = {}; redaccion = {}; examHistory = []; rubricaCustom = null;
  try { [K.prog,K.gram,K.campos,K.red,K.examHistory,K.rubrica].forEach(k => localStorage.removeItem(k)); } catch(e){}
  if(examen && examen.timerId) clearInterval(examen.timerId);
  examen = null; rubricaEstado = null;
  cambiarModo("dashboard");
  toast("✓");
});

/* =====================================================================
   SIDEBAR + EVENTOS GLOBALES
   ===================================================================== */
const sidebar = $("#sidebar");
function cerrarSidebar(){ sidebar.classList.remove("open"); }
$("#btnMenu") && $("#btnMenu").addEventListener("click", () => sidebar.classList.toggle("open"));
document.addEventListener("click", e => {
  if(window.innerWidth <= 900 && sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target.id !== "btnMenu") cerrarSidebar();
});
$("#searchTecnica").addEventListener("input", () => { if(modo==="cuaderno") renderMenuCuaderno(); if(modo==="gramatica") renderMenuGramatica(); });
$$(".modo-tab").forEach(t => t.addEventListener("click", () => cambiarModo(t.dataset.modo)));

function actualizarProgreso(){
  const hH = HTML_FLAT.filter(t=>getProg("t"+t.n).ok).length;
  const hG = GRAM_FLAT.filter(t=>getGram("t"+t.n).ok).length;
  $("#sidebarCount") && ($("#sidebarCount").textContent = (HTML_FLAT.length + GRAM_FLAT.length));
}

/* Arranque */
aplicarIdioma(lang);
cambiarModo("dashboard");
</script>
