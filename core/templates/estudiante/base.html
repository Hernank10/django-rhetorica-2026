<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retorica - Redaccion{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               margin: 0; padding: 0; line-height: 1.6; color: #222; background: #f8f9fa; }
        header { background: #2c3e50; color: #fff; padding: 1rem 2rem;
                 display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-weight: 600; }
        header a:hover { text-decoration: underline; }
        main { max-width: 900px; margin: 2rem auto; padding: 1.5rem;
               background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        textarea { width: 100%; min-height: 120px; font-family: inherit;
                   font-size: 1rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer;
                 background: #2c3e50; color: #fff; border: 0; border-radius: 4px; }
        button:hover { background: #34495e; }
        .ok { color: #155724; background: #d4edda; padding: 0.8rem; border-radius: 4px; margin: 1rem 0; }
        .error { color: #721c24; background: #f8d7da; padding: 0.8rem; border-radius: 4px; margin: 1rem 0; }
        .meta { color: #bdc3c7; font-size: 0.9rem; }
        :focus { outline: 3px solid #f39c12; outline-offset: 2px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'redaccion_indice' %}">Retorica - Redaccion</a>
        <nav>
            {% if user.is_authenticated %}
                <span class="meta">{{ user.username }}</span>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
