<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Parafrasis mecanica</title>
</head>
<body>
    <h1>Parafrasis mecanica</h1>
    <form id="form-parafrasis">
        {% csrf_token %}
        <div>
            <label for="texto_original">Texto original:</label><br>
            <textarea id="texto_original" name="original" rows="3" cols="60"></textarea>
        </div>
        <div>
            <label for="texto_parafraseado">Tu parafrasis:</label><br>
            <textarea id="texto_parafraseado" name="parafraseado" rows="3" cols="60"></textarea>
        </div>
        <div>
            <label for="tipo">Tipo:</label>
            <select id="tipo" name="tipo">
                <option value="activa_a_pasiva">Activa a pasiva</option>
                <option value="pasiva_a_activa">Pasiva a activa</option>
            </select>
        </div>
        <div id="resultado"></div>
    </form>
    <button type="button" id="btn-reordenar">Sugerir reordenamientos</button>
    <div id="sugerencias"></div>
    <script>
    (function() {
        var form = document.getElementById('form-parafrasis');
        var timer = null;
        form.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(function() {
                var fd = new FormData(form);
                fetch('/sintaxis/parafrasis/ajax/', {
                    method: 'POST',
                    body: fd
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('resultado').textContent =
                        JSON.stringify(data, null, 2);
                });
            }, 400);
        });
    })();
    </script>
    <script>
    (function() {
        var btn = document.getElementById('btn-reordenar');
        var out = document.getElementById('sugerencias');
        var form = document.getElementById('form-parafrasis');
        btn.addEventListener('click', function() {
            var original = document.getElementById('texto_original').value;
            if (!original.trim()) {
                out.textContent = 'Escribe un texto primero.';
                return;
            }
            var fd = new FormData();
            fd.append('original', original);
            var csrf = form.querySelector('[name=csrfmiddlewaretoken]').value;
            fd.append('csrfmiddlewaretoken', csrf);
            fetch('/sintaxis/parafrasis/reordenar/', { method: 'POST', body: fd })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.sugerencias) {
                    var lines = data.sugerencias
                        .filter(function(s) { return s.esperado; })
                        .map(function(s) { return '- ' + s.tipo + ': ' + s.esperado; });
                    out.textContent = lines.length ? lines.join('\n') : 'Sin sugerencias.';
                } else {
                    out.textContent = 'Error: ' + (data.error || 'desconocido');
                }
            })
            .catch(function(e) { out.textContent = 'Error: ' + e.message; });
        });
    })();
    </script>
    <p><a href="/sintaxis/parafrasis/registro/">Probar parafrasis de registro (formal/coloquial)</a></p>
</body>
</html>
