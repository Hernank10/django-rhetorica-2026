<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Parafrasis de registro</title>
</head>
<body>
    <h1>Parafrasis de registro: formal &lt;-&gt; coloquial</h1>
    <form id="form-registro">
        <div>
            <label for="texto_original">Texto original:</label><br>
            <textarea id="texto_original" name="original" rows="3" cols="60"></textarea>
        </div>
        <div>
            <label for="texto_parafraseado">Tu parafrasis (opcional):</label><br>
            <textarea id="texto_parafraseado" name="parafraseado" rows="3" cols="60"></textarea>
        </div>
        <div>
            <label for="tipo">Tipo:</label>
            <select id="tipo" name="tipo">
                <option value="formal_a_coloquial">Formal a coloquial</option>
                <option value="coloquial_a_formal">Coloquial a formal</option>
            </select>
        </div>
        <button type="button" id="btn-registro">Transformar y verificar</button>
    </form>
    <div id="resultado"></div>
    <p><a href="/sintaxis/parafrasis/">Volver a demo activa/pasiva</a></p>
    <script>
    (function() {
        var btn = document.getElementById('btn-registro');
        var out = document.getElementById('resultado');
        var form = document.getElementById('form-registro');
        btn.addEventListener('click', function() {
            var original = document.getElementById('texto_original').value;
            if (!original.trim()) {
                out.textContent = 'Escribe un texto.';
                return;
            }
            var fd = new FormData();
            fd.append('original', original);
            fd.append('parafraseado', document.getElementById('texto_parafraseado').value);
            fd.append('tipo', document.getElementById('tipo').value);
            fetch('/sintaxis/parafrasis/registro/ajax/', {
                method: 'POST',
                body: fd
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    out.textContent = 'Error: ' + data.error;
                    return;
                }
                var lines = [];
                lines.push('Registro detectado: ' + data.deteccion_original.registro);
                if (data.transformacion_sugerida.esperado) {
                    lines.push('Sugerencia: ' + data.transformacion_sugerida.esperado);
                } else {
                    lines.push('Sugerencia: (sin cambios)');
                }
                if (data.verificacion) {
                    lines.push('Verificacion: ' + data.verificacion.feedback);
                }
                out.textContent = lines.join('\n');
            })
            .catch(function(e) { out.textContent = 'Error: ' + e.message; });
        });
    })();
    </script>
</body>
</html>
