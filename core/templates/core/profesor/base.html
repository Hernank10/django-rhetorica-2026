{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container-fluid mt-4">
  <div class="row">
    <nav class="col-md-2" aria-label="Menú del profesor">
      <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action {% if 'dashboard' in request.path %}active{% endif %}"
           href="{% url 'profesor:dashboard' %}"
           {% if 'dashboard' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-tachometer-alt" aria-hidden="true"></i> Dashboard
        </a>
        <a class="list-group-item list-group-item-action {% if '/estudiantes/' in request.path %}active{% endif %}"
           href="{% url 'profesor:estudiantes' %}"
           {% if '/estudiantes/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-users" aria-hidden="true"></i> Estudiantes
        </a>
        <a class="list-group-item list-group-item-action {% if '/cursos/' in request.path %}active{% endif %}"
           href="{% url 'profesor:cursos_lista' %}"
           {% if '/cursos/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-book" aria-hidden="true"></i> Cursos
        </a>
        <a class="list-group-item list-group-item-action {% if '/modulos/' in request.path %}active{% endif %}"
           href="{% url 'profesor:modulos_lista' %}"
           {% if '/modulos/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-layer-group" aria-hidden="true"></i> Módulos
        </a>
        <a class="list-group-item list-group-item-action {% if '/lecciones/' in request.path %}active{% endif %}"
           href="{% url 'profesor:lecciones_lista' %}"
           {% if '/lecciones/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-file-alt" aria-hidden="true"></i> Lecciones
        </a>
        <a class="list-group-item list-group-item-action {% if '/evaluaciones/' in request.path %}active{% endif %}"
           href="{% url 'profesor:evaluaciones' %}"
           {% if '/evaluaciones/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-clipboard-check" aria-hidden="true"></i> Evaluaciones
        </a>
        <a class="list-group-item list-group-item-action {% if '/certificaciones/' in request.path %}active{% endif %}"
           href="{% url 'profesor:certificaciones' %}"
           {% if '/certificaciones/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-certificate" aria-hidden="true"></i> Certificaciones
        </a>
        <a class="list-group-item list-group-item-action {% if '/profesor/recursos/' in request.path %}active{% endif %}"
           href="{% url 'profesor:recursos_lista' %}"
           {% if '/profesor/recursos/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-folder-open" aria-hidden="true"></i> Recursos
        </a>
        <a class="list-group-item list-group-item-action {% if '/estadisticas/' in request.path %}active{% endif %}"
           href="{% url 'profesor:estadisticas' %}"
           {% if '/estadisticas/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-chart-line" aria-hidden="true"></i> Estadísticas
        </a>

        <a class="list-group-item list-group-item-action {% if '/analytics/' in request.path %}active{% endif %}"
           href="{% url 'profesor:analytics_dashboard' %}"
           {% if '/analytics/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-chart-line" aria-hidden="true"></i> Analytics
        </a>

        <a class="list-group-item list-group-item-action {% if '/ranking/' in request.path %}active{% endif %}"
           href="{% url 'profesor:ranking' %}"
           {% if '/ranking/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-trophy" aria-hidden="true"></i> Ranking
        </a>
        </a>
      </div>
    </nav>
    <section class="col-md-10" role="region" aria-label="Contenido del panel">
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar notificación"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block panel %}{% endblock %}
    </section>
  </div>
</div>
{% endblock %}
