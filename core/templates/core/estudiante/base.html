{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container-fluid mt-4">
  <div class="row">
    <nav class="col-md-2" aria-label="Menú del estudiante">
      <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action {% if '/recursos/' in request.path %}active{% endif %}"
           href="{% url 'recursos:lista' %}"
           {% if '/recursos/' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-folder-open" aria-hidden="true"></i> Recursos
        </a>
        <a class="list-group-item list-group-item-action {% if request.path == '/estudiante/' %}active{% endif %}"
           href="{% url 'estudiante:dashboard' %}"
           {% if request.path == '/estudiante/' %}aria-current="page"{% endif %}>
          <i class="fas fa-home" aria-hidden="true"></i> Inicio
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/cursos' in request.path %}active{% endif %}"
           href="{% url 'estudiante:cursos' %}"
           {% if 'estudiante/cursos' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-book" aria-hidden="true"></i> Mis Cursos
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/evaluaciones' in request.path %}active{% endif %}"
           href="{% url 'estudiante:evaluaciones' %}"
           {% if 'estudiante/evaluaciones' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-clipboard-check" aria-hidden="true"></i> Evaluaciones
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/logros' in request.path %}active{% endif %}"
           href="{% url 'estudiante:logros' %}"
           {% if 'estudiante/logros' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-trophy" aria-hidden="true"></i> Logros
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/certificados' in request.path %}active{% endif %}"
           href="{% url 'estudiante:certificados' %}"
           {% if 'estudiante/certificados' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-certificate" aria-hidden="true"></i> Certificados
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/estadisticas' in request.path %}active{% endif %}"
           href="{% url 'estudiante:estadisticas' %}"
           {% if 'estudiante/estadisticas' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-chart-line" aria-hidden="true"></i> Estadísticas
        </a>
        <a class="list-group-item list-group-item-action {% if 'estudiante/ranking' in request.path %}active{% endif %}"
           href="{% url 'estudiante:ranking' %}"
           {% if 'estudiante/ranking' in request.path %}aria-current="page"{% endif %}>
          <i class="fas fa-medal" aria-hidden="true"></i> Ranking
        </a>
      </div>
    </nav>
    <section class="col-md-10" role="region" aria-label="Contenido del panel">
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar notificación"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block panel %}{% endblock %}
    </section>
  </div>
</div>
{% endblock %}
