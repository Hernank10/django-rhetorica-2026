{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3"><i class="fas fa-tags text-primary"></i> Analizador morfosintáctico</h2>

  <div class="row g-3 mb-3">
    <div class="col-md-7">
      <form onsubmit="return false;">
        {% csrf_token %}
        <textarea id="texto" class="form-control" rows="3"
                  placeholder="Escribe una frase: Juan estudia matematicas en su casa..."></textarea>
        <p class="small text-muted mt-1" id="contador">0 / 1000 caracteres</p>
      </form>
    </div>
    <div class="col-md-5">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-white fw-bold">
          <i class="fas fa-chart-pie text-info"></i> Distribucion POS
        </div>
        <div class="card-body">
          <canvas id="chartPosDist" height="180"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Filtros por categoria POS -->
  <div id="filtrosPos" class="mb-3" style="display:none;">
    <div class="card shadow-sm">
      <div class="card-body py-2">
        <small class="text-muted me-2"><i class="fas fa-filter"></i> Filtrar por categoria:</small>
        <div id="filtrosChips" class="d-inline"></div>
      </div>
    </div>
  </div>

  <!-- Resultado -->
  <div id="resultado" class="card shadow-sm">
    <div class="card-body">
      <p class="text-muted mb-0">Escribe algo para ver el analisis en tiempo real.</p>
    </div>
  </div>

  <p class="mt-3">
    <a href="{% url 'pos_corpus' %}">Analizar el corpus &rarr;</a>
  </p>
</div>

<script src="{% static 'js/chart.umd.min.js' %}"></script>
<script>
(function() {
  "use strict";
  const textoEl = document.getElementById("texto");
  const resultEl = document.getElementById("resultado");
  const contador = document.getElementById("contador");
  const filtrosPos = document.getElementById("filtrosPos");
  const filtrosChips = document.getElementById("filtrosChips");

  let timer = null;
  let controller = null;
  let lastTokens = [];
  let filtroActual = null;
  let chart = null;

  const POS_COLORS = {
    PROPN: "#0d6efd", NOUN: "#6f42c1", VERB: "#dc3545", AUX: "#fd7e14",
    ADJ: "#20c997", ADV: "#0dcaf0", DET: "#6c757d", PRON: "#e83e8c",
    ADP: "#6610f2", CCONJ: "#fd7e14", SCONJ: "#20c997", NUM: "#198754",
    PART: "#adb5bd", INTJ: "#ffc107", PUNCT: "#adb5bd", SYM: "#adb5bd", X: "#adb5bd"
  };

  const POS_LABELS = {
    PROPN: "Nombre propio", NOUN: "Nombre", VERB: "Verbo", AUX: "Auxiliar",
    ADJ: "Adjetivo", ADV: "Adverbio", DET: "Determinante", PRON: "Pronombre",
    ADP: "Preposicion", CCONJ: "Conj. coordinante", SCONJ: "Conj. subordinante",
    NUM: "Numeral", PART: "Particula", INTJ: "Interjeccion",
    PUNCT: "Puntuacion", SYM: "Simbolo", X: "Otro"
  };

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = String(s == null ? "" : s);
    return d.innerHTML;
  }

  function getTokenPos(t) {
    return t.pos || t.pos_ || "?";
  }

  function getCsrf() {
    const inp = document.querySelector("[name=csrfmiddlewaretoken]");
    return inp ? inp.value : "";
  }

  function renderChart(tokens) {
    const canvas = document.getElementById("chartPosDist");
    if (!canvas) return;
    if (chart) { chart.destroy(); chart = null; }
    if (!tokens || !tokens.length) return;
    const counts = {};
    tokens.forEach(function(t) {
      const p = getTokenPos(t);
      counts[p] = (counts[p] || 0) + 1;
    });
    const labels = Object.keys(counts);
    chart = new Chart(canvas, {
      type: "doughnut",
      data: {
        labels: labels.map(function(k){ return POS_LABELS[k] || k; }),
        datasets: [{
          data: labels.map(function(k){ return counts[k]; }),
          backgroundColor: labels.map(function(k){ return POS_COLORS[k] || "#adb5bd"; })
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: "right", labels: { boxWidth: 10, font: { size: 10 } } } }
      }
    });
  }

  function renderFiltros(tokens) {
    const counts = {};
    tokens.forEach(function(t) {
      const p = getTokenPos(t);
      counts[p] = (counts[p] || 0) + 1;
    });
    const cats = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });

    filtrosChips.innerHTML = "";
    const btnTodos = document.createElement("button");
    btnTodos.type = "button";
    btnTodos.className = "btn btn-sm btn-secondary me-1 mb-1 active";
    btnTodos.dataset.pos = "";
    btnTodos.textContent = "Todos (" + tokens.length + ")";
    filtrosChips.appendChild(btnTodos);

    cats.forEach(function(cat) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-sm me-1 mb-1";
      const color = POS_COLORS[cat] || "#adb5bd";
      btn.style.border = "1px solid " + color;
      btn.style.color = color;
      btn.style.backgroundColor = "#fff";
      btn.dataset.pos = cat;
      btn.textContent = (POS_LABELS[cat] || cat) + " (" + counts[cat] + ")";
      filtrosChips.appendChild(btn);
    });

    filtrosPos.style.display = "block";
  }

  function renderTabla(tokens, filtro) {
    const filtered = filtro ? tokens.filter(function(t){ return getTokenPos(t) === filtro; }) : tokens;
    if (!filtered.length) {
      resultEl.innerHTML = '<div class="card-body"><p class="text-muted mb-0">Sin tokens con esa categoria.</p></div>';
      return;
    }
    let html = '<div class="table-responsive"><table class="table table-sm table-hover mb-0">';
    html += '<thead class="table-light"><tr>';
    html += '<th style="width:40px">#</th><th>Palabra</th><th>Categoria</th><th>Lema</th><th>Funcion</th>';
    html += '</tr></thead><tbody>';
    filtered.forEach(function(t, i) {
      const p = getTokenPos(t);
      const color = POS_COLORS[p] || "#adb5bd";
      html += '<tr>';
      html += '<td class="text-muted small">' + (i+1) + '</td>';
      html += '<td><strong>' + esc(t.text) + '</strong></td>';
      html += '<td><span class="badge" style="background:' + color + '">' + esc(p) + '</span> <small class="text-muted">' + esc(POS_LABELS[p] || "") + '</small></td>';
      html += '<td><em>' + esc(t.lemma || t.lemma_ || "") + '</em></td>';
      html += '<td><code class="small">' + esc(t.dep || t.dep_ || "") + '</code></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    resultEl.innerHTML = html;
  }

  function analizar() {
    const texto = (textoEl.value || "").trim();
    if (!texto) {
      resultEl.innerHTML = '<div class="card-body"><p class="text-muted mb-0">Escribe algo para ver el analisis.</p></div>';
      filtrosPos.style.display = "none";
      renderChart([]);
      lastTokens = [];
      return;
    }
    if (controller) controller.abort();
    controller = new AbortController();

    fetch("/pos/ajax/analizar/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCsrf()
      },
      body: JSON.stringify({ texto: texto }),
      signal: controller.signal
    })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data) {
      if (data.error) {
        resultEl.innerHTML = '<div class="card-body"><p class="text-danger mb-0">' + esc(data.error) + '</p></div>';
        return;
      }
      const tokens = (data.analisis && data.analisis.tokens) || data.tokens || [];
      lastTokens = tokens;
      filtroActual = null;
      renderChart(tokens);
      renderFiltros(tokens);
      renderTabla(tokens, null);
    })
    .catch(function(err) {
      if (err.name === "AbortError") return;
      resultEl.innerHTML = '<div class="card-body"><p class="text-danger mb-0">Error: ' + esc(err.message) + '</p></div>';
    });
  }

  textoEl.addEventListener("input", function() {
    const len = textoEl.value.length;
    contador.textContent = len + " / 1000 caracteres";
    clearTimeout(timer);
    timer = setTimeout(analizar, 400);
  });

  filtrosChips.addEventListener("click", function(e) {
    const btn = e.target.closest("button[data-pos]");
    if (!btn) return;
    Array.prototype.forEach.call(filtrosChips.querySelectorAll("button"), function(b) {
      b.classList.remove("active");
    });
    btn.classList.add("active");
    filtroActual = btn.dataset.pos || null;
    renderTabla(lastTokens, filtroActual);
  });
})();
</script>
{% endblock %}
